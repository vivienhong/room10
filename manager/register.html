<!DOCTYPE html>
<html lang="zh">
<head>

<style>
*{
  box-sizing:border-box;
}

html, body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  color:#5b4632;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  overflow-y:auto;
  position:relative;
  background:
    linear-gradient(rgba(235,243,239,0.78), rgba(223,233,230,0.88)),
    radial-gradient(circle at center, rgba(255,255,255,0.40) 0%, rgba(255,255,255,0) 62%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(to right, rgba(223,233,230,0.92) 0%, rgba(223,233,230,0.42) 18%, rgba(223,233,230,0.18) 50%, rgba(223,233,230,0.42) 82%, rgba(223,233,230,0.92) 100%),
    linear-gradient(to bottom, rgba(255,250,243,0.18) 0%, rgba(255,250,243,0.06) 35%, rgba(255,250,243,0.16) 100%);
  pointer-events:none;
  z-index:0;
}

.stage{
  position:relative;
  z-index:1;
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:0;
}

.sheet-wrap{
  position:relative;
  width:min(100vw, 1376px);
  margin:0 auto;
  flex:0 0 auto;
}

.sheet-image{
  display:block;
  width:100%;
  height:auto;
  filter:drop-shadow(0 18px 35px rgba(73, 56, 39, 0.18));
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

.sheet-form{
  position:absolute;
  left:50%;
  top:17.5%;
  width:54%;
  transform:translateX(-50%);
  transform-origin:top center;
  z-index:2;
  transition:width .22s ease, top .22s ease, height .22s ease;
}

.form-content{
  width:100%;
  transform-origin:top center;
  transition:transform .22s ease;
}

.topbar{
  display:grid;
  grid-template-columns:auto 1fr;
  align-items:center;
  gap:0.8vw;
  margin-bottom:0.9vw;
}

.back-btn{
  border:none;
  background:rgba(217,185,143,0.78);
  color:#4b3523;
  padding:0.62vw 1vw;
  border-radius:0.8vw;
  font-size:0.88vw;
  box-shadow:0 0.3vw 0.9vw rgba(91,70,50,0.06);
  transition:background .2s ease, transform .2s ease;
  cursor:pointer;
  justify-self:start;
}

.back-btn:hover{
  background:rgba(229,199,159,0.92);
  transform:translateY(-1px);
}

.top-desc{
  text-align:center;
  font-size:0.84vw;
  color:#7a6652;
  line-height:1.45;
  padding:0.2vw 2vw 0.2vw 0.6vw;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0.62vw;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:0.32vw;
}

.form-group.full{
  grid-column:1 / -1;
}

label{
  font-size:0.82vw;
  font-weight:600;
  color:#6c5845;
}

input, select, textarea{
  width:100%;
  border:1px solid rgba(220,201,177,0.72);
  border-radius:0.72vw;
  padding:0.58vw 0.78vw;
  font-size:0.82vw;
  outline:none;
  background:rgba(255,255,255,0.66);
  color:#5b4632;
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

input:focus, select:focus, textarea:focus{
  border-color:#c89a62;
  box-shadow:0 0 0 3px rgba(200,154,98,0.12);
  background:rgba(255,255,255,0.86);
}

input[readonly]{
  background:rgba(247,243,236,0.92);
  color:#7a6652;
}

textarea{
  min-height:5.2vw;
  resize:vertical;
}

.actions{
  margin-top:0.8vw;
  display:flex;
  gap:0.55vw;
  flex-wrap:wrap;
}

.primary-btn, .secondary-btn{
  border:none;
  border-radius:0.72vw;
  padding:0.62vw 1.05vw;
  font-size:0.82vw;
  transition:background .2s ease, transform .2s ease;
  cursor:pointer;
}

.primary-btn{
  background:#c89a62;
  color:white;
}

.primary-btn:hover{
  background:#b88952;
  transform:translateY(-1px);
}

.primary-btn:disabled{
  background:#d8c0a2;
  cursor:not-allowed;
  transform:none;
}

.secondary-btn{
  background:rgba(238,226,208,0.86);
  color:#5a4632;
}

.secondary-btn:hover{
  background:rgba(229,213,191,0.95);
  transform:translateY(-1px);
}

.message{
  margin-top:0.7vw;
  min-height:1.1vw;
  font-size:0.82vw;
  font-weight:600;
}

.success{
  color:#4d7a43;
}

.error{
  color:#9a4f3e;
}

.field-hint{
  min-height:1.1em;
  font-size:0.72vw;
  line-height:1.35;
  color:#8a7560;
  padding-left:0.1vw;
}

.field-hint.error{
  color:#9a4f3e;
}

.field-hint.success{
  color:#4d7a43;
}

.skills-wrap{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:0.55vw;
}

.skill-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0.42vw;
  background:rgba(255,255,255,0.48);
  border:1px solid rgba(220,201,177,0.56);
  border-radius:0.72vw;
  padding:0.5vw 0.68vw;
  white-space:nowrap;
}

.skills-wrap.field-error{
  border:1px solid #cf7d69;
  border-radius:0.72vw;
  padding:0.35vw;
  background:#fff7f4;
  box-shadow:0 0 0 3px rgba(207,125,105,0.16);
}

.skill-item input{
  width:auto;
  margin:0;
  padding:0;
}


.avatar-preview{
  margin-top:0.35vw;
  width:4.6vw;
  height:4.6vw;
  border-radius:0.85vw;
  border:1px solid #dcc9b1;
  object-fit:cover;
  background:#f4ecdf;
  display:none;
}

.required-mark{
  color:#b24b3f;
  margin-left:0.15vw;
}

.field-error{
  border-color:#cf7d69 !important;
  box-shadow:0 0 0 3px rgba(207,125,105,0.16) !important;
  background:#fff7f4 !important;
}

.birthday-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0.55vw;
}

.mbti-grid{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:0.55vw;
}

.mbti-item{
  display:flex;
  align-items:center;
  gap:0.35vw;
  border-radius:0.72vw;
  padding:0.5vw 0.68vw;
  border:1px solid transparent;
  font-size:0.8vw;
  font-weight:600;
  user-select:none;
  background-clip:padding-box;
  cursor:pointer;
  white-space:nowrap;
}

.mbti-item input{
  width:auto;
  margin:0;
  padding:0;
}

.mbti-analyst{ background:#ece7ffcc; color:#5a47a8; border-color:#d4caf8; }
.mbti-diplomat{ background:#e8f8eccc; color:#36724a; border-color:#c9ebd2; }
.mbti-sentinel{ background:#e8f1ffcc; color:#3e648f; border-color:#cbdcf6; }
.mbti-explorer{ background:#fff1dfcc; color:#9a6632; border-color:#f1d4af; }

@media (max-width:1376px){
  .back-btn{
    font-size:max(12px, 0.88vw);
    padding:max(8px, 0.62vw) max(12px, 1vw);
    border-radius:max(10px, 0.8vw);
  }

  .top-desc{
    font-size:max(13px, 0.84vw);
    padding:max(3px, 0.2vw) max(24px, 2vw) max(3px, 0.2vw) max(8px, 0.6vw);
  }

  label,
  input,
  select,
  textarea,
  .primary-btn,
  .secondary-btn,
  .message{
    font-size:max(13px, 0.82vw);
  }

  .field-hint{
    font-size:max(12px, 0.72vw);
  }

  .mbti-item{
    font-size:max(12px, 0.8vw);
  }

  input, select, textarea{
    border-radius:max(10px, 0.72vw);
    padding:max(10px, 0.58vw) max(12px, 0.78vw);
  }

  .primary-btn, .secondary-btn{
    border-radius:max(10px, 0.72vw);
    padding:max(10px, 0.62vw) max(16px, 1.05vw);
  }

  .skill-item,
  .mbti-item{
    border-radius:max(10px, 0.72vw);
    padding:max(8px, 0.5vw) max(10px, 0.68vw);
  }

  .avatar-preview{
    width:max(60px, 4.6vw);
    height:max(60px, 4.6vw);
    border-radius:max(10px, 0.85vw);
  }

  textarea{
    min-height:max(92px, 5.2vw);
  }

  .topbar{
    margin-bottom:max(10px, 0.9vw);
    gap:max(8px, 0.8vw);
  }

  .form-grid,
  .actions,
  .skills-wrap,
  .birthday-row,
  .mbti-grid{
    gap:max(8px, 0.55vw);
  }

  .form-group{
    gap:max(6px, 0.32vw);
  }

  .message{
    min-height:18px;
    margin-top:max(10px, 0.7vw);
  }

  .actions{
    margin-top:max(12px, 0.8vw);
  }
}

@media (max-width:1200px){
  .sheet-form{
    width:56%;
    top:17.4%;
  }
}

@media (max-width:1000px){
  .sheet-form{
    width:58%;
    top:17.3%;
  }
}

@media (max-width:900px){
  .sheet-form{
    width:70%;
    top:17.2%;
  }

  .mbti-grid{
    grid-template-columns:repeat(4, minmax(0,1fr));
  }
}

@media (max-width:820px){
  .sheet-form{
    width:74%;
    top:17.05%;
  }

  .topbar{
    margin-bottom:8px;
  }

  .form-grid{
    gap:7px;
  }

  .form-group{
    gap:5px;
  }

  label,
  input,
  select,
  textarea,
  .primary-btn,
  .secondary-btn,
  .message{
    font-size:12.5px;
  }

  .field-hint{
    font-size:11.5px;
  }

  .mbti-item{
    font-size:11.5px;
    padding:7px 8px;
  }

  .skill-item{
    padding:7px 8px;
    font-size:12px;
  }

  input, select, textarea{
    padding:8px 10px;
  }

  .birthday-row,
  .skills-wrap,
  .mbti-grid{
    gap:7px;
  }

  .actions{
    margin-top:10px;
    gap:7px;
  }

  textarea{
    min-height:80px;
  }
}

@media (max-width:700px){
  .stage{
    padding:18px 10px 24px;
  }

  .sheet-wrap{
    width:100%;
  }

  .sheet-image{
    display:none;
  }

  .sheet-form{
    position:relative;
    left:auto;
    top:auto;
    transform:none !important;
    width:100%;
    height:auto !important;
  }

  .topbar{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }

  .top-desc{
    padding:0;
    text-align:center;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .birthday-row{
    grid-template-columns:1fr;
  }

  .actions{
    margin-top:18px;
  }

  .mbti-grid{
    grid-template-columns:repeat(2, minmax(0,1fr));
  }

  .skill-item,
  .mbti-item{
    justify-content:flex-start;
  }
}
</style>
</head>

<script>
const supabaseUrl = "https://tfevitwoqmxwaguvtyms.supabase.co";
const supabaseKey = "sb_publishable_0cFYhwx_9uEcrXnMJzzNMQ_cEng8xmI";
const client = window.supabase.createClient(supabaseUrl, supabaseKey);

const avatarInput = document.getElementById("avatar");
const avatarPreview = document.getElementById("avatarPreview");
const sheetImage = document.querySelector(".sheet-image");
const sheetForm = document.getElementById("sheetForm");
const formContent = document.getElementById("formContent");

const nameInput = document.getElementById("name");
const nicknameInput = document.getElementById("nickname");
const locationInput = document.getElementById("location");
const inviteKeyInput = document.getElementById("inviteKey");
const contactQqInput = document.getElementById("contactQq");
const topDesc = document.getElementById("topDesc");

const REGISTER_RETURN_KEY = "room10RegisterReturn";
const PAGE_KEY = "managerRegister";
const REQUIRED_TEXT_KEYS = [
  "title",
  "top_desc.default",
  "top_desc.prefilled",
  "button.back",
  "button.submit",
  "button.clear",
  "label.invite_key",
  "placeholder.invite_key",
  "label.avatar",
  "alt.avatar_preview",
  "alt.sheet_image",
  "label.name",
  "placeholder.name",
  "label.nickname",
  "placeholder.nickname",
  "label.joined_at",
  "label.location",
  "placeholder.location",
  "label.birthday",
  "option.month_placeholder",
  "option.day_placeholder",
  "option.month_suffix",
  "option.day_suffix",
  "label.mbti",
  "label.skills",
  "placeholder.custom_skill",
  "error.skill_required",
  "label.contact_qq",
  "placeholder.contact_qq",
  "value.qq_none",
  "label.social_xhs",
  "label.social_douyin",
  "label.social_bilibili",
  "label.social_weibo",
  "placeholder.social_optional",
  "label.public_message",
  "placeholder.public_message",
  "hint.name_prefilled",
  "hint.name_available",
  "hint.nickname_available",
  "error.config_missing",
  "error.key_missing",
  "error.key_wrong",
  "error.required_missing",
  "error.nickname_format",
  "error.nickname_message",
  "error.qq_invalid",
  "error.name_duplicate_hint",
  "error.nickname_duplicate_hint",
  "error.name_duplicate",
  "error.nickname_duplicate",
  "error.key_application_mismatch",
  "error.name_application_mismatch",
  "error.qq_application_mismatch",
  "error.application_read_failed",
  "message.submitting",
  "error.avatar_upload_failed",
  "error.registration_failed",
  "error.submit_failed",
  "message.registration_success"
];
const REQUIRED_OPTION_GROUPS = ["mbti", "skill", "cohort"];

let approvedApplicationContext = null;
let resizeTimer = null;
let registerTexts = new Map();
let registerOptions = new Map();
let registerConfigReady = false;
let registrationBlocked = false;
let registrationSucceeded = false;
let avatarPreviewUrl = "";
const AVATAR_MAX_BYTES = 5 * 1024 * 1024;
const AVATAR_ALLOWED_TYPES = new Set(["image/jpeg", "image/png", "image/webp"]);

function normalizeText(value){
  return String(value ?? "").trim();
}

function blockRegistration(){
  registrationBlocked = true;
  document.querySelectorAll("#sheetForm input, #sheetForm select, #sheetForm textarea, #submitBtn, #clearBtn")
    .forEach(el => {
      el.disabled = true;
    });
}

function showConfigError(message, detail = ""){
  let panel = document.getElementById("pageError");
  if(!panel){
    panel = document.createElement("div");
    panel.id = "pageError";
    panel.setAttribute("role", "alert");
    panel.setAttribute("aria-live", "assertive");
    document.body.appendChild(panel);
  }
  panel.textContent = detail ? `${message}\n${detail}` : message;
  panel.classList.add("show");
  blockRegistration();
}

function text(key){
  const value = registerTexts.get(key);
  if(!normalizeText(value)){
    const message = registerTexts.get("error.config_missing") || "REGISTER_CONFIG_MISSING";
    throw new Error(`${message}：page_key=${PAGE_KEY}, text_key=${key}`);
  }
  return String(value);
}

function formatText(key, vars = {}){
  return text(key).replace(/\{(\w+)\}/g, (match, name) => {
    if(!Object.prototype.hasOwnProperty.call(vars, name)) return match;
    return String(vars[name]);
  });
}

function optionList(groupKey){
  return registerOptions.get(groupKey) || [];
}


function showPathConfigError(type, key){
  const message = registerTexts.get("error.config_missing") || "REGISTER_CONFIG_MISSING";
  showConfigError(message, `${type}:${key}`);
}

function room10PageUrl(key){
  const pageKey = normalizeText(key);
  if(pageKey && typeof window.room10Page === "function"){
    const url = window.room10Page(pageKey);
    if(url) return url;
  }
  showPathConfigError("page", pageKey || "missing");
  return "";
}

function room10AssetUrl(keyPath){
  const assetKey = normalizeText(keyPath);
  if(assetKey && typeof window.room10Asset === "function"){
    const url = window.room10Asset(assetKey);
    if(url) return url;
  }
  showPathConfigError("asset", assetKey || "missing");
  return "";
}

function applyStaticAssets(){
  const sheetUrl = room10AssetUrl("manager.roomCheckin");
  if(sheetUrl) sheetImage.src = sheetUrl;
}

function normalizeReturnKey(raw){
  const value = normalizeText(raw);
  const compact = value
    .replace(/^\.\//, "")
    .replace(/^\.\.\//, "")
    .replace(/^manager\//, "")
    .toLowerCase();

  const map = {
    "index":"index",
    "index.html":"index",
    "manager":"managerVisitor",
    "manager.html":"managerVisitor",
    "managervisitor":"managerVisitor",
    "manager-visitor":"managerVisitor",
    "manager-visitor.html":"managerVisitor",
    "register":"managerRegister",
    "register.html":"managerRegister",
    "managermember":"managerMember",
    "manager-member":"managerMember",
    "manager-member.html":"managerMember",
    "manageradmin":"managerAdmin",
    "manager-admin":"managerAdmin",
    "manager-admin.html":"managerAdmin"
  };

  return map[compact] || "";
}

function getReturnPageKey(){
  const params = new URLSearchParams(window.location.search);
  const fromQuery = normalizeReturnKey(params.get("from"));
  const fromSession = normalizeReturnKey(sessionStorage.getItem(REGISTER_RETURN_KEY));

  sessionStorage.setItem(REGISTER_RETURN_KEY, "index");
  return "index";
}

async function loadRegisterConfig(){
  const { data, error } = await client.rpc("get_room10_register_page_config");
  if(error){
    throw new Error(`REGISTER_CONFIG_READ_FAILED: ${error.message || "get_room10_register_page_config"}`);
  }

  registerTexts = new Map();
  registerOptions = new Map();

  (Array.isArray(data) ? data : []).forEach(row => {
    const configType = normalizeText(row.config_type);
    const groupKey = normalizeText(row.group_key);
    const configKey = normalizeText(row.config_key);
    const textValue = String(row.text_value ?? "");
    const sortOrder = Number(row.sort_order || 100);
    const extra = row.extra_json && typeof row.extra_json === "object" ? row.extra_json : {};

    if(configType === "text" && configKey){
      registerTexts.set(configKey, textValue);
      return;
    }

    if(configType === "option" && groupKey && configKey){
      const list = registerOptions.get(groupKey) || [];
      list.push({
        value: configKey,
        label: textValue,
        cssClass: normalizeText(extra.css_class),
        extra,
        sortOrder
      });
      registerOptions.set(groupKey, list);
    }
  });

  for(const list of registerOptions.values()){
    list.sort((a, b) => a.sortOrder - b.sortOrder || a.label.localeCompare(b.label, "zh-Hans-CN"));
  }

  const missingTexts = REQUIRED_TEXT_KEYS.filter(key => !normalizeText(registerTexts.get(key)));
  if(missingTexts.length){
    const message = registerTexts.get("error.config_missing") || "REGISTER_CONFIG_MISSING";
    throw new Error(`${message}：${missingTexts.join("、")}`);
  }

  const missingGroups = REQUIRED_OPTION_GROUPS.filter(group => optionList(group).length === 0);
  if(missingGroups.length){
    throw new Error(`${text("error.config_missing")}：${missingGroups.join("、")}`);
  }

  registerConfigReady = true;
}

function getBirthdayMaxDay(month){
  if(month === 2) return 29;
  if([4, 6, 9, 11].includes(month)) return 30;
  return 31;
}

function populateBirthdayDays(preserveValue = true){
  const monthSelect = document.getElementById("birthdayMonth");
  const daySelect = document.getElementById("birthdayDay");
  const previousValue = preserveValue ? daySelect.value : "";
  const month = parseInt(monthSelect.value, 10);
  const maxDay = Number.isInteger(month) ? getBirthdayMaxDay(month) : 31;
  const daySuffix = text("option.day_suffix");

  daySelect.innerHTML = "";
  addSelectPlaceholder(daySelect, text("option.day_placeholder"));

  for(let d = 1; d <= maxDay; d++){
    const opt = document.createElement("option");
    opt.value = String(d);
    opt.textContent = `${d}${daySuffix}`;
    daySelect.appendChild(opt);
  }

  if(previousValue && parseInt(previousValue, 10) <= maxDay){
    daySelect.value = previousValue;
  }
}

async function loadApprovedApplicationContext(){
  const { applicationId, applyName, applyQQ, memberCode } = getApplicationParams();

  if(!applicationId && !applyName && !applyQQ && !memberCode) return;

  if(!applicationId || !applyName || !applyQQ || !memberCode){
    const message = registerTexts.get("error.application_read_failed") || "申请信息读取失败";
    showConfigError(message, "approved application identity incomplete");
    return false;
  }

  try{
    const { data, error } = await client.rpc("get_room10_approved_application_prefill", {
      p_application_id:applicationId,
      p_name:applyName,
      p_contact_qq:applyQQ,
      p_member_code:memberCode
    });

    if(error) throw error;

    const payload = data && typeof data === "object" ? data : {};
    const record = payload.found === true && payload.application && typeof payload.application === "object"
      ? payload.application
      : null;

    if(!record){
      const message = registerTexts.get("error.application_read_failed") || "申请信息读取失败";
      showConfigError(message, "approved application not found or not approved");
      return false;
    }

    applyApplicationPrefill(record);
    return true;
  }catch(err){
    const message = registerTexts.get("error.application_read_failed") || "申请信息读取失败";
    showConfigError(message, err.message || "get_room10_approved_application_prefill");
    return false;
  }
}

function validateAvatarFile(file){
  if(!file) return false;

  if(!AVATAR_ALLOWED_TYPES.has(file.type)){
    setMessage(registerTexts.get("error.avatar_type_invalid") || "头像仅支持 JPG、PNG 或 WebP 格式。", "error");

    setMessage(registerTexts.get("error.avatar_too_large") || "头像文件不能超过 5MB。", "error");
    markError(avatarInput);
    return false;
  }

  return true;
}

function fitFormToSheet(){
  if(window.innerWidth <= 700){
    formContent.style.transform = "none";
    sheetForm.style.height = "auto";
    sheetForm.style.removeProperty("transform");
    return;
  }

  sheetForm.style.transform = "translateX(-50%)";
  sheetForm.style.height = "auto";
  formContent.style.transform = "scale(1)";
  formContent.style.transformOrigin = "top center";

  const imageRect = sheetImage.getBoundingClientRect();
  if(!imageRect.height) return;

  const sheetTopPercent = 17.5;
  const sheetBottomPercent = 73.5;
  const availableHeight = imageRect.height * ((sheetBottomPercent - sheetTopPercent) / 100);

  const naturalHeight = formContent.scrollHeight;
  const scale = Math.max(0.93, Math.min(1, availableHeight / naturalHeight));

  formContent.style.transform = `scale(${scale})`;
  sheetForm.style.height = `${naturalHeight * scale}px`;
}

}

function parseConfigDate(value, endOfDay = false){
  const raw = normalizeText(value);
  if(!raw) return null;
  return new Date(`${raw}T${endOfDay ? "23:59:59" : "00:00:00"}`);
}

function calcCohort(dateStr){
  if(!dateStr) return "";

  const target = parseConfigDate(dateStr);
  if(!target || Number.isNaN(target.getTime())) return "";

  const cohorts = optionList("cohort");
  const defaultCohort = cohorts.find(item => item.extra && item.extra.is_default === true);

  for(const item of cohorts){
    if(item.extra && item.extra.is_default === true) continue;

    const startDate = parseConfigDate(item.extra?.start_date);
    const endDate = parseConfigDate(item.extra?.end_date, true);

    if(startDate && target < startDate) continue;
    if(endDate && target > endDate) continue;

    return item.label;
  }

  return defaultCohort ? defaultCohort.label : "";
}

async function uploadAvatar(file, keyCode){
  const extensionByType = {
    "image/jpeg":"jpg",
    "image/png":"png",
    "image/webp":"webp"
  };
  const safeExt = extensionByType[file.type];
  if(!safeExt || !validateAvatarFile(file)){
    throw new Error(registerTexts.get("error.avatar_type_invalid") || "头像文件不符合要求。");
  }

  const fileName = `${keyCode}-${Date.now()}.${safeExt}`;

  const { error } = await client.storage
    .from("avatars")
    .upload(fileName, file, {
      upsert:false,
      contentType:file.type
    });

  if(error){
    throw new Error(formatText("error.avatar_upload_failed", { reason:error.message || text("error.registration_failed") }));
  }

  const { data } = client.storage
    .from("avatars")
    .getPublicUrl(fileName);

  return {
    path:fileName,
    publicUrl:data.publicUrl
  };
}

async function submitRegistration(){
  const submitBtn = document.getElementById("submitBtn");

  if(registrationBlocked || registrationSucceeded || submitBtn.disabled) return;

  if(!registerConfigReady){
    showConfigError("REGISTER_CONFIG_MISSING");
    return;
  }

  const inviteKey = document.getElementById("inviteKey").value.trim().toUpperCase();
  const name = document.getElementById("name").value.trim();
  const nickname = document.getElementById("nickname").value.trim();
  const avatarFile = document.getElementById("avatar").files[0];
  const mbti = getMbtiValue();
  const location = document.getElementById("location").value.trim();
  const qq = document.getElementById("contactQq").value.trim();
  const birthdayMonthValue = document.getElementById("birthdayMonth").value.trim();
  const birthdayDayValue = document.getElementById("birthdayDay").value.trim();
  const joinedAt = document.getElementById("joinedAt").value || getToday();
  const customSkill = document.getElementById("customSkill").value.trim();
  const socialXhs = document.getElementById("socialXhs").value.trim();
  const socialDouyin = document.getElementById("socialDouyin").value.trim();
  const socialBilibili = document.getElementById("socialBilibili").value.trim();
  const socialWeibo = document.getElementById("socialWeibo").value.trim();
  const publicMessage = document.getElementById("publicMessage").value.trim();

  const birthdayMonth = parseInt(birthdayMonthValue, 10);
  const birthdayDay = parseInt(birthdayDayValue, 10);
  const selectedSkills = [...document.querySelectorAll(".skillCheck:checked")].map(el => el.value);

  clearFieldErrors();
  setMessage("", "");

  if(!inviteKey){
    markError(document.getElementById("inviteKey"));
    setMessage(text("error.key_missing"), "error");
    focusElement(document.getElementById("inviteKey"));
    return;
  }

  if(!validateKeyFormat(inviteKey)){
    markError(document.getElementById("inviteKey"));
    setMessage(text("error.key_wrong"), "error");
    focusElement(document.getElementById("inviteKey"));
    return;
  }

  const requiredFields = [
    { el:document.getElementById("avatar"), empty:!avatarFile },
    { el:document.getElementById("name"), empty:!name },
    { el:document.getElementById("nickname"), empty:!nickname },
    { el:document.getElementById("location"), empty:!location },
    { el:document.getElementById("contactQq"), empty:!qq },
    { el:document.getElementById("birthdayMonth"), empty:!birthdayMonthValue },
    { el:document.getElementById("birthdayDay"), empty:!birthdayDayValue },
    { el:document.getElementById("joinedAt"), empty:!joinedAt },
    { el:document.getElementById("mbtiGrid"), empty:!mbti }
  ];

  const missingFields = requiredFields.filter(item => item.empty);
  if(missingFields.length > 0){
    missingFields.forEach(item => markError(item.el));
    setMessage(text("error.required_missing"), "error");
    const firstMissing = missingFields[0].el;
    if(firstMissing?.id === "mbtiGrid"){
      focusElement(firstMissing.querySelector('input[name="mbti"]'));
    }else{
      focusElement(firstMissing);
    }
    return;
  }

  if(!validateAvatarFile(avatarFile)){
    focusElement(document.getElementById("avatar"));
    return;
  }

  if(selectedSkills.length === 0 && !customSkill){
    markError(document.getElementById("skillsWrap"));
    markError(document.getElementById("customSkill"));
    setMessage(text("error.skill_required"), "error");
    focusElement(document.getElementById("customSkill"));
    return;
  }

  if(!validateNickname(nickname)){
    markError(document.getElementById("nickname"));
    setFieldHint("nicknameHint", text("error.nickname_format"), "error");
    setMessage(text("error.nickname_message"), "error");
    focusElement(document.getElementById("nickname"));
    return;
  }

  if(!validateQq(qq)){
    markError(document.getElementById("contactQq"));
    setMessage(text("error.qq_invalid"), "error");
    focusElement(document.getElementById("contactQq"));
    return;
  }

  if(isNaN(birthdayMonth) || birthdayMonth < 1 || birthdayMonth > 12){
    markError(document.getElementById("birthdayMonth"));
    setMessage(text("error.required_missing"), "error");
    focusElement(document.getElementById("birthdayMonth"));
    return;
  }

  const maxBirthdayDay = Number.isInteger(birthdayMonth) ? getBirthdayMaxDay(birthdayMonth) : 31;
  if(isNaN(birthdayDay) || birthdayDay < 1 || birthdayDay > maxBirthdayDay){
    markError(document.getElementById("birthdayDay"));
    setMessage(registerTexts.get("error.birthday_invalid") || text("error.required_missing"), "error");
    focusElement(document.getElementById("birthdayDay"));
    return;
  }

  if(joinedAt > getToday()){
    markError(document.getElementById("joinedAt"));
    setMessage(registerTexts.get("error.joined_at_future") || text("error.required_missing"), "error");
    focusElement(document.getElementById("joinedAt"));
    return;
  }

  submitBtn.disabled = true;
  let uploadedAvatarPath = "";

  try{
    if(!approvedApplicationContext){
      const nameExists = await checkNameExists(name);
      if(nameExists){
        markError(document.getElementById("name"));
        setFieldHint("nameHint", text("error.name_duplicate_hint"), "error");
        setMessage(text("error.name_duplicate"), "error");
        focusElement(document.getElementById("name"));
        submitBtn.disabled = false;
        return;
      }
    }

    const nicknameExists = await checkNicknameExists(nickname);
    if(nicknameExists){
      markError(document.getElementById("nickname"));
      setFieldHint("nicknameHint", text("error.nickname_duplicate_hint"), "error");
      setMessage(text("error.nickname_duplicate"), "error");
      focusElement(document.getElementById("nickname"));
      submitBtn.disabled = false;
      return;
    }

    if(approvedApplicationContext){
      if(inviteKey !== approvedApplicationContext.member_code){
        markError(document.getElementById("inviteKey"));
        setMessage(text("error.key_application_mismatch"), "error");
        focusElement(document.getElementById("inviteKey"));
        submitBtn.disabled = false;
        return;
      }

      if(name !== approvedApplicationContext.name){
        markError(document.getElementById("name"));
        setMessage(text("error.name_application_mismatch"), "error");
        focusElement(document.getElementById("name"));
        submitBtn.disabled = false;
        return;
      }

      if(qq !== approvedApplicationContext.contact_qq){
        markError(document.getElementById("contactQq"));
        setMessage(text("error.qq_application_mismatch"), "error");
        focusElement(document.getElementById("contactQq"));
        submitBtn.disabled = false;
        return;
      }
    }

    setMessage(text("message.submitting"), "");

    const avatarUpload = await uploadAvatar(avatarFile, inviteKey);
    uploadedAvatarPath = avatarUpload.path;
    const avatarUrl = avatarUpload.publicUrl;
    const skillsValue = selectedSkills.length ? selectedSkills.join(",") : null;
    const customSkillValue = customSkill || null;

    const rpcResult = await client.rpc("submit_room10_member_registration", {
      p_application_id: approvedApplicationContext?.id ? String(approvedApplicationContext.id).trim() : null,
      p_member_code: inviteKey,
      p_name: name,
      p_nickname: nickname,
      p_avatar_url: avatarUrl,
      p_mbti: mbti || null,
      p_location: location || null,
      p_contact_qq: qq,
      p_birthday_month: birthdayMonth,
      p_birthday_day: birthdayDay,
      p_skills: skillsValue,
      p_custom_skill: customSkillValue,
      p_social_xiaohongshu: socialXhs || null,
      p_social_douyin: socialDouyin || null,
      p_social_bilibili: socialBilibili || null,
      p_social_weibo: socialWeibo || null,
      p_joined_at: joinedAt,
      p_cohort: null, // 由数据库根据 joined_at 计算最终期数
      p_public_message: publicMessage || null
    });

    if(rpcResult.error){
      throw new Error(rpcResult.error.message || text("error.registration_failed"));
    }

    const row = extractRpcRow(rpcResult.data);
    if(!row || row.success !== true){
      throw new Error(row?.message || text("error.registration_failed"));
    }

    if(!normalizeText(row.role)){
      throw new Error(registerTexts.get("error.role_missing") || "登记结果缺少成员身份，请联系管理员。");
    }

    uploadedAvatarPath = "";

    if(approvedApplicationContext){
      localStorage.removeItem("room10ApplicantSession");
      localStorage.removeItem("room10ApplicationDraft");
    }

    localStorage.setItem("room10Role", row.role);
    localStorage.setItem("room10LoggedIn", "true");
    localStorage.setItem("room10User", row.nickname || nickname);
    localStorage.setItem("room10MemberId", row.member_id || "");
    localStorage.setItem("room10MemberCode", row.member_code || inviteKey);

    registrationSucceeded = true;
    setMessage(row.message || formatText("message.registration_success", { member_code:inviteKey }), "success");

    const returnPage = getReturnPageUrl();
    setTimeout(() => {
      clearReturnPageCache();
      window.location.href = returnPage;
    }, 1800);
  }catch(err){
    await removeUploadedAvatar(uploadedAvatarPath);
    const message = err.message || text("error.submit_failed");
    setMessage(message, "error");

    if(message.includes(text("label.name"))) markError(document.getElementById("name"));
    if(message.includes(text("label.nickname"))) markError(document.getElementById("nickname"));
    if(message.includes(text("label.invite_key"))) markError(document.getElementById("inviteKey"));
    if(message.includes(text("label.contact_qq"))) markError(document.getElementById("contactQq"));
  }finally{
    if(!registrationSucceeded && !registrationBlocked){
      submitBtn.disabled = false;
    }
  }
}

function initResizeListeners(){
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      requestAnimationFrame(fitFormToSheet);
    }, 60);
  });

  document.fonts?.ready?.then(() => {
    requestAnimationFrame(fitFormToSheet);
  });
}

document.getElementById("joinedAt").value = getToday();
applyStaticAssets();
getReturnPageKey();
initResizeListeners();

window.addEventListener("load", async () => {
  try{
    await loadRegisterConfig();
    applyPageContent();
    renderDynamicOptions();
    await loadApprovedApplicationContext();
    requestAnimationFrame(fitFormToSheet);
  }catch(err){
    showConfigError(err.message || "REGISTER_CONFIG_MISSING");
  }
});
</script>

  2. 头像限制 JPG/PNG/WebP、最大 5MB，并清理失败上传；
  3. 生日按月份限制日期，加入日期禁止未来日期；
  4. 成功后保持提交锁定；
  5. 身份必须由 RPC 返回，期数由数据库计算。
