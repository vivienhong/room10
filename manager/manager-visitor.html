<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title data-text-key="page.title"></title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../room10-paths.js"></script>
<style>
*{box-sizing:border-box;}

:root{
  --bg-left:#fff3e7;
  --bg-right:#f4dfc8;
  --bg-top:#fff7ef;
  --bg-bottom:#edd8c1;
  --bg-ui-scale:1;
  --text:#5b4632;
  --title:#6a5038;
  --line:#d8c2a3;
  --line2:#e3d0b4;
  --panel:rgba(255,249,240,.92);
  --panel2:rgba(255,252,245,.92);
  --btn:#c98e56;
  --btn-hover:#b97d45;
  --sub:#e7d3b7;
  --sub-hover:#dcc29e;
  --shadow:0 10px 24px rgba(0,0,0,.08);
  --radius:16px;
  --ok:#5f7d3a;
  --warn:#8b5b34;
  --bad:#a14d45;
  --info:#7b654f;
  --info-bg:#f7eee1;
  --success-bg:#eef6e8;
  --error-bg:#fbeceb;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  position:relative;
  font-family:Arial, Helvetica, sans-serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at center, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
  color:var(--text);
}

#bgColorFill{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    linear-gradient(180deg, var(--bg-top) 0%, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, var(--bg-bottom) 100%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
}

#bgBleed{
  position:fixed;
  inset:-8vh -8vw;
  z-index:1;
  background:var(--manager-room-bg, none) center center / cover no-repeat;
  filter:blur(30px) saturate(1.05);
  transform:scale(1.08);
  opacity:.72;
  pointer-events:none;
  animation:managerBgDrift 18s ease-in-out infinite alternate;
}

#bgLight{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0) 58%),
    linear-gradient(180deg, rgba(255,248,240,0.08), rgba(255,248,240,0.08));
  animation:managerLightBreath 7.5s ease-in-out infinite;
}

#managerPage{
  position:relative;
  z-index:3;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:transparent;
}

#managerStage{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#managerBg{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

#managerUI{
  position:absolute;
  z-index:1;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#managerUI *{pointer-events:auto;}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}

.hidden{display:none !important;}

#topActions{
  position:absolute;
  z-index:10;
  pointer-events:none;
  min-width:0;
  min-height:0;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:rgba(255,248,239,0.92);
  border:1px solid rgba(186,146,103,0.24);
  box-shadow:
    0 10px 24px rgba(116,86,54,0.12),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:rgba(255,252,247,0.96);
  color:#6c4523;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:1;
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  display:block;
  line-height:1;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--ui-scale));
  top:calc(-6px * var(--ui-scale));
  min-width:calc(18px * var(--ui-scale));
  height:calc(18px * var(--ui-scale));
  padding:0 calc(5px * var(--ui-scale));
  border-radius:999px;
  background:#c98c4f;
  color:#fff9f1;
  font-size:calc(9px * var(--ui-scale));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--ui-scale)) solid rgba(255,248,239,0.98);
  box-shadow:0 2px 8px rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice #siteNoticeCount{
  display:flex;
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:min(calc(360px * var(--ui-scale)), 72vw);
  max-height:min(calc(540px * var(--ui-scale)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  background:rgba(255,249,241,0.98);
  border:1px solid rgba(203,167,123,0.28);
  box-shadow:0 16px 36px rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

#siteNoticePanel.show{display:block;}

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--ui-scale));
  font-weight:900;
  margin-bottom:calc(10px * var(--ui-scale));
}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--ui-scale));
  line-height:1.6;
  padding:6px 2px 2px;
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--ui-scale));
}

.siteNoticeItem{
  padding:calc(10px * var(--ui-scale));
  border-radius:calc(12px * var(--ui-scale));
  background:rgba(255,252,247,0.82);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.92), 0 2px 8px rgba(120,92,63,0.05);
}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1.5;
  margin-bottom:4px;
}

.siteNoticeItemDesc{
  color:#8a6644;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.55;
}

#topBar{
  position:absolute;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:9;
  overflow:visible;
}

#topBar,
#navOuter,
#navScroll{overflow:visible;}

#navOuter{
  flex:0 0 auto;
  min-width:0;
  width:100%;
}

#navScroll{
  width:100%;
  white-space:nowrap;
  scrollbar-width:none;
  -ms-overflow-style:none;
  padding:0;
  margin:0;
}

#navScroll::-webkit-scrollbar{display:none;}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap, 8px);
  transform-origin:left center;
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height, 40px);
  padding:0 var(--nav-btn-px, 16px);
  border-radius:var(--nav-btn-radius, 13px);
  color:#6e4827;
  font-size:var(--nav-btn-font, 14px);
  font-weight:900;
  line-height:1;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid rgba(145,98,56,.34);
  box-shadow:0 1px 1px rgba(255,255,255,.48) inset, 0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:0 1px 1px rgba(255,255,255,.55) inset, 0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{position:relative; z-index:5;}

.navActiveNote{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:0 1px 2px rgba(255,250,232,.72);
}

.navActiveNoteA{left:8%; top:-52%; color:rgba(167,104,54,.72); font-size:calc(var(--nav-btn-font, 14px) * .88);}
.navActiveNoteB{right:8%; top:-60%; color:rgba(122,91,143,.58); font-size:calc(var(--nav-btn-font, 14px) * .80);}
.navActiveNoteC{left:50%; top:-68%; transform:translateX(-50%); color:rgba(198,124,112,.78); font-size:calc(var(--nav-btn-font, 14px) * .96);}

.navBtn:hover .navActiveNoteA,.navBtn:focus-visible .navActiveNoteA{animation:navNotePopA 2.2s ease-in-out infinite;}
.navBtn:hover .navActiveNoteB,.navBtn:focus-visible .navActiveNoteB{animation:navNotePopB 2.5s ease-in-out infinite;}
.navBtn:hover .navActiveNoteC,.navBtn:focus-visible .navActiveNoteC{animation:navNotePopC 2.35s ease-in-out infinite;}

.navBtn[data-room="hall"] .navActiveNote{
  color:rgba(255,205,96,.86);
  text-shadow:0 1px 2px rgba(255,250,232,.95), 0 0 10px rgba(255,215,105,.62);
}
.navBtn[data-room="honor"] .navActiveNote{
  color:rgba(205,143,45,.86);
  text-shadow:0 1px 2px rgba(255,250,232,.92), 0 0 8px rgba(255,220,130,.52);
}
.navBtn[data-room="game"] .navActiveNote{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navActiveNote{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navActiveNote{color:rgba(150,111,72,.82);}
.navBtn[data-room="dorm"] .navActiveNote{color:rgba(143,111,168,.76);}
.navBtn[data-room="pets"] .navActiveNote{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navActiveNote{color:rgba(198,119,145,.82);}

#managerBriefCard{
  position:absolute;
  z-index:4;
  color:#6a4b32;
  background:rgba(255,249,240,.86);
  border:1px solid rgba(216,194,163,.78);
  box-shadow:
    0 10px 24px rgba(116,86,54,.10),
    inset 0 1px 0 rgba(255,255,255,.78);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.brief-title{
  margin:0;
  line-height:1.25;
  font-weight:900;
  color:#6b4524;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.brief-text{
  margin:0;
  line-height:1.55;
  color:#765a40;
}

.brief-list{
  padding:0;
  list-style:none;
  display:flex;
  flex-direction:column;
}

.brief-list li{
  position:relative;
  line-height:1.45;
  color:#84664a;
}

.brief-list li::before{
  content:"•";
  position:absolute;
  left:0;
  top:0;
  color:#c98e56;
  font-weight:900;
}

.brief-sign{
  border-top:1px dashed rgba(180,139,94,.32);
  line-height:1.35;
  color:#9a795b;
  text-align:right;
}

#contentArea{
  position:absolute;
  z-index:2;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  scrollbar-color:#cfad82 rgba(255,255,255,.35);
}

#contentArea::-webkit-scrollbar{width:8px;}
#contentArea::-webkit-scrollbar-track{background:rgba(255,255,255,.35); border-radius:999px;}
#contentArea::-webkit-scrollbar-thumb{background:#cfad82; border-radius:999px;}


.card{position:relative;}

.title-line{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.section-title{
  margin:0;
  font-weight:700;
  color:var(--title);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  line-height:1.2;
}

.title-note{
  margin:0;
  line-height:1.35;
  color:#9a8a78;
  text-align:right;
  white-space:nowrap;
}

.mini-title{
  margin:0;
  font-weight:700;
  color:#7a5b3f;
  line-height:1.3;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.quick-login-row,
.apply-query-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:nowrap;
}

.quick-login-row input,
.apply-query-row input,
.apply-form input{
  border:1px solid #dfccb0;
  border-radius:10px;
  background:rgba(255,255,255,.96);
  color:var(--text);
  outline:none;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.quick-login-row input,
.apply-query-row input{
  flex:1 1 0;
  min-width:0;
}

.quick-login-row input:focus,
.apply-query-row input:focus,
.apply-form input:focus{
  border-color:var(--btn);
  box-shadow:0 0 0 2px rgba(201,142,86,.12);
}

.inline-btn,
.sub-btn{
  border:none;
  cursor:pointer;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-weight:600;
  white-space:nowrap;
  flex:0 0 auto;
}

.inline-btn{background:var(--btn); color:#fff;}
.inline-btn:hover{background:var(--btn-hover);}
.sub-btn{background:var(--sub); color:var(--text);}
.sub-btn:hover{background:var(--sub-hover);}
.inline-btn:disabled,.sub-btn:disabled{opacity:.65; cursor:not-allowed;}

#loginHint,
#applyQueryHint,
#applyHint{
  color:var(--warn);
  line-height:1.4;
}

.register-book,
.notice-box,
.result-box{
  background:var(--panel2);
  border:1px solid var(--line2);
}

.register-book{
  display:flex;
  align-items:center;
}

.register-book-left{
  display:flex;
  align-items:center;
  min-width:0;
  flex:1;
}

.register-book .inline-btn{margin-left:auto;}

.book-icon{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5e6cc;
}

.book-text{min-width:0;}

.book-desc{
  color:#7a6755;
  line-height:1.45;
}

.notice-list{
  margin:0;
  color:#6b5a45;
}

.notice-list li{line-height:1.5;}

.notice-note-line{
  color:#8b5b34;
  line-height:1.35;
}

.dual-fold-row{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.fold-switch-btn{width:100%;}

.fold-switch-btn.is-active{background:#d8bb93;}

.fold-hint{
  width:fit-content;
  max-width:100%;
  margin-left:auto;
  margin-right:auto;
  border-radius:999px;
  background:rgba(255,255,255,.55);
  color:#8b7864;
  line-height:1.32;
  text-align:center;
}

.fold-panel{
  background:rgba(255,255,255,.42);
  border:1px solid #ead9bc;
}

.apply-form{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.apply-form input{width:100%;}

.apply-actions{
  grid-column:1 / -1;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
}

#applyHint{flex:1 1 220px;}

.result-box p{color:#6b5a45;}

.result-row{
  display:flex;
  align-items:flex-start;
  flex-wrap:wrap;
}

.result-label{color:#9a8a78;}
.result-value{color:#5b4632; font-weight:700; word-break:break-all;}
.result-status-pending{color:var(--warn); font-weight:700;}
.result-status-approved{color:var(--ok); font-weight:700;}
.result-status-rejected{color:var(--bad); font-weight:700;}

.result-actions{
  display:flex;
  flex-wrap:wrap;
}

.status-notice{
  border:1px solid #dcc29e;
  background:var(--info-bg);
  color:var(--info);
}

.status-notice.success{background:var(--success-bg); color:var(--ok);}
.status-notice.error{background:var(--error-bg); color:var(--bad);}

.reapply-note{color:#8b5b34; line-height:1.35;}

@keyframes navNotePopA{0%,100%{transform:translateY(3px) rotate(-8deg) scale(.82);opacity:0;}22%,68%{opacity:.88;}48%{transform:translateY(-3px) rotate(5deg) scale(1);opacity:.72;}}
@keyframes navNotePopB{0%,100%{transform:translateY(4px) rotate(8deg) scale(.78);opacity:0;}26%,72%{opacity:.78;}50%{transform:translateY(-4px) rotate(-6deg) scale(1);opacity:.64;}}
@keyframes navNotePopC{0%,100%{transform:translateX(-50%) translateY(5px) rotate(0deg) scale(.76);opacity:0;}24%,70%{opacity:.86;}50%{transform:translateX(-50%) translateY(-5px) rotate(2deg) scale(1);opacity:.76;}}
@keyframes managerLightBreath{0%,100%{opacity:.62;}50%{opacity:.9;}}
@keyframes managerBgDrift{0%{transform:scale(1.08) translate3d(0,0,0);}100%{transform:scale(1.095) translate3d(-.4%,.35%,0);}}
@keyframes managerKeyShine{0%,58%{opacity:0; transform:translateX(-18%) skewX(-8deg);}68%{opacity:.72;}88%,100%{opacity:0; transform:translateX(28%) skewX(-8deg);}}
@keyframes managerDustFloat{0%{transform:translate3d(0,0,0); background-position:18% 22%, 64% 18%, 42% 68%;}100%{transform:translate3d(0,-10px,0); background-position:20% 18%, 61% 14%, 44% 64%;}}
@keyframes managerPanelIn{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:translateY(0);}}

@media (min-width:541px){
  #managerUI::before{
    content:"";
    position:absolute;
    right:9.6%;
    bottom:18.4%;
    width:19%;
    height:22%;
    border-radius:24px;
    background:linear-gradient(112deg, transparent 0%, transparent 35%, rgba(255,244,204,.06) 44%, rgba(255,238,178,.34) 50%, rgba(255,244,204,.08) 57%, transparent 68%, transparent 100%);
    mix-blend-mode:screen;
    opacity:.56;
    pointer-events:none;
    animation:managerKeyShine 6.8s ease-in-out infinite;
  }

  #managerUI::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.38;
    background-image:
      radial-gradient(circle, rgba(194,139,82,.20) 0 1px, transparent 1.5px),
      radial-gradient(circle, rgba(255,238,190,.18) 0 1px, transparent 1.6px),

function normalizeText(value){

function showPageError(message, detail = ""){
  let panel = document.getElementById("pageError");
  if(!panel){
    panel = document.createElement("div");
    panel.id = "pageError";
    panel.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:4000;max-width:min(720px,calc(100vw - 28px));padding:12px 16px;border-radius:16px;background:rgba(255,248,240,.97);border:1px solid rgba(165,94,64,.28);color:#7a3f2b;box-shadow:0 12px 30px rgba(87,50,31,.16);font-size:13px;font-weight:800;line-height:1.55;text-align:left;white-space:pre-line;";
    document.body.appendChild(panel);
  }
  panel.textContent = detail ? `${message}\n${detail}` : message;
}

function clearPageError(){
  document.getElementById("pageError")?.remove();
}

function text(key){
  const value = pageTexts.get(key);
  if(!normalizeText(value)){
    const message = pageTexts.get("error.page_text_missing") || "MANAGER_VISITOR_TEXT_MISSING";
    throw new Error(`${message}：page_key=${PAGE_KEY}, text_key=${key}`);
  }
  return String(value);
}

function formatText(key, vars = {}){
  return text(key).replace(/\{(\w+)\}/g, (match, name) => {
    if(!Object.prototype.hasOwnProperty.call(vars, name)) return match;
    return String(vars[name]);
  });
}

function collectRequiredTextKeys(){
  const keys = new Set(REQUIRED_DYNAMIC_TEXT_KEYS);
  document.querySelectorAll("[data-text-key]").forEach(el => keys.add(el.dataset.textKey));
  document.querySelectorAll("[data-placeholder-key]").forEach(el => keys.add(el.dataset.placeholderKey));
  document.querySelectorAll("[data-aria-label-key]").forEach(el => keys.add(el.dataset.ariaLabelKey));
  document.querySelectorAll("[data-alt-key]").forEach(el => keys.add(el.dataset.altKey));
  return [...keys].filter(Boolean);
}

async function loadPageTexts(){
  const { data, error } = await client.rpc("get_room10_page_texts", {
    p_page_key:PAGE_KEY,
    p_include_inactive:false
  });

  if(error){
    throw new Error(`MANAGER_VISITOR_TEXT_READ_FAILED: ${error.message || "get_room10_page_texts"}`);
  }

  pageTexts = new Map();
  (Array.isArray(data) ? data : []).forEach(row => {
    const key = normalizeText(row.text_key);
    if(key) pageTexts.set(key, String(row.text_value ?? ""));
  });

  const missing = collectRequiredTextKeys().filter(key => !normalizeText(pageTexts.get(key)));
  if(missing.length){
    const message = pageTexts.get("error.page_text_missing") || "MANAGER_VISITOR_TEXT_MISSING";
    throw new Error(`${message}：${missing.join("、")}`);
  }

  pageTextReady = true;
}

function applyPageTexts(){
  document.querySelectorAll("[data-text-key]").forEach(el => {
    el.textContent = text(el.dataset.textKey);
  });
  document.querySelectorAll("[data-placeholder-key]").forEach(el => {
    el.placeholder = text(el.dataset.placeholderKey);
  });
  document.querySelectorAll("[data-aria-label-key]").forEach(el => {
    el.setAttribute("aria-label", text(el.dataset.ariaLabelKey));
  });
  document.querySelectorAll("[data-alt-key]").forEach(el => {
    el.alt = text(el.dataset.altKey);
  });
}

function clearDesktopOverlayStyles(){
  if(managerUI){
    managerUI.style.left = "";
    managerUI.style.top = "";
    managerUI.style.width = "";
    managerUI.style.height = "";
  }
  if(roomNav){
    roomNav.style.transform = "";
  }
}

function syncManagerUIToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }
  if(!managerImg?.naturalWidth || !managerImg?.naturalHeight || !managerStage || !managerUI) return;

  const frame = managerStage.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = managerImg.naturalWidth / managerImg.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = (frame.width - displayWidth) / 2;
    displayTop = 0;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = 0;
    displayTop = (frame.height - displayHeight) / 2;
  }

  managerUI.style.left = `${displayLeft}px`;
  managerUI.style.top = `${displayTop}px`;
  managerUI.style.width = `${displayWidth}px`;
  managerUI.style.height = `${displayHeight}px`;

  const scale = Math.max(0.34, Math.min(1.42, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));

  requestAnimationFrame(fitRoomNavToBar);
}

function fitRoomNavToBar(){
  if(!roomNav || !topBar || isTinyScreen()) return;

  roomNav.style.transform = "scale(1)";
  const available = topBar.clientWidth;
  const needed = roomNav.scrollWidth;
  const scale = Math.min(1, available / Math.max(needed, 1));

  roomNav.style.transform = `scale(${scale})`;
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function normalizeLoginRpcMessage(value){
  return String(value || "").trim();
}

function showUpgradeLoginNotice(loginRow){
  if(!loginRow?.should_show_upgrade_notice) return Promise.resolve();

  const oldKey = normalizeLoginRpcMessage(loginRow.upgrade_old_key);
  const newKey = normalizeLoginRpcMessage(loginRow.upgrade_new_key || loginRow.member_code);
  if(!oldKey || !newKey || !upgradeNoticeModal) return Promise.resolve();

  upgradeNoticeTitle.textContent = text("upgrade.title");
  upgradeNoticeDesc.textContent = formatText("upgrade.desc", {
    old_key:oldKey,
    new_key:newKey
  });
  upgradeNoticeOldKey.textContent = oldKey;
  upgradeNoticeNewKey.textContent = newKey;
  upgradeNoticeModal.classList.remove("hidden");
  document.body.style.overflow = "hidden";

  return new Promise(resolve => {
    let closed = false;

    const close = () => {
      if(closed) return;
      closed = true;
      upgradeNoticeModal.classList.add("hidden");
      document.body.style.overflow = "";
      upgradeNoticeCloseBtn?.removeEventListener("click", close);
      upgradeNoticeModal.removeEventListener("click", onBackdrop);
      document.removeEventListener("keydown", onKeydown);
      resolve();
    };

    const onBackdrop = event => {
      if(event.target === upgradeNoticeModal) close();
    };

    const onKeydown = event => {
      if(event.key === "Escape" || event.key === "Enter") close();
    };

    upgradeNoticeCloseBtn?.addEventListener("click", close);
    upgradeNoticeModal.addEventListener("click", onBackdrop);
    document.addEventListener("keydown", onKeydown);
    requestAnimationFrame(() => upgradeNoticeCloseBtn?.focus());
  });
}

function getRoleLabel(roleValue = getRole()){
  const role = normalizeText(roleValue).toLowerCase();
  if(role === "owner") return text("role.owner");
  if(role === "admin") return text("role.admin");
  if(role === "member" || role === "roomer") return text("role.member");
  if(role === "trainee") return text("role.trainee");
  if(role === "applying") return text("role.visitor");
  if(!role) return text("role.visitor");
  return text("role.invalid");
}

function updateStatusUserUI(labelOverride){
  if(!currentUserText || !loginOpenBtn || !logoutBtn) return;

  if(isLoggedIn()){
    const user = getCurrentUser() || text("identity.logged_in_fallback");
    const roleLabel = labelOverride || getRoleLabel();
    currentUserText.textContent = `${user} | ${roleLabel}`;
    loginOpenBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    return;
  }

  const applicant = getApplicantSession();
  if(applicant && applicant.name){
    const roleLabel = labelOverride || text("role.applying");
    currentUserText.textContent = `${applicant.name} | ${roleLabel}`;
    loginOpenBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    return;
  }

  currentUserText.textContent = text("identity.visitor");
  loginOpenBtn.classList.remove("hidden");
  logoutBtn.classList.add("hidden");
}

    apply_name: currentApplicationRecord.name || "",
    apply_qq: currentApplicationRecord.contact_qq || "",
    member_code: currentApplicationRecord.member_code || ""
  });

  sessionStorage.setItem("room10RegisterReturn", "managerVisitor");
  const registerPage = getRoom10Page("managerRegister");
  if(registerPage){
    window.location.href = `${registerPage}?${params.toString()}`;
  }
}

function scrollContentToBottomPart(targetEl){
  if(!isMediumScrollScreen() || !targetEl) return;
  requestAnimationFrame(() => {
    targetEl.scrollIntoView({ behavior:"smooth", block:"nearest" });
  });
}

function setFoldState(type){
  const openApply = type === "apply";
  const openQuery = type === "query";

  contentArea.classList.toggle("is-expanded", openApply || openQuery);
  applyFormWrap.classList.toggle("hidden", !openApply);
  queryFormWrap.classList.toggle("hidden", !openQuery);

  applyToggleBtn.classList.toggle("is-active", openApply);
  queryToggleBtn.classList.toggle("is-active", openQuery);

  if(openApply){
    applyFoldHint.textContent = text("application.fold.apply");
    setTimeout(() => {
      scrollContentToBottomPart(applyFormWrap);
    }, 60);
    return;
  }

  if(openQuery){
    applyFoldHint.textContent = text("application.fold.query");
    setTimeout(() => {
      scrollContentToBottomPart(queryFormWrap);
    }, 60);
    return;
  }

  applyFoldHint.textContent = text("application.fold.default");
}

function toggleApplyPanel(){
  const isOpen = !applyFormWrap.classList.contains("hidden");
  setFoldState(isOpen ? null : "apply");
}

function toggleQueryPanel(){
  const isOpen = !queryFormWrap.classList.contains("hidden");
  setFoldState(isOpen ? null : "query");
}

function renderApplicationResult(record){
  currentApplicationRecord = record;
  applicationResultWrap.classList.remove("hidden");

  resultName.textContent = record.name || "-";
  resultQQ.textContent = record.contact_qq || "-";
  resultKey.textContent = "-";
  resultKeyRow.classList.add("hidden");
  goRegisterBtn.classList.add("hidden");
  saveForLaterBtn.classList.add("hidden");
  reapplyBtn.classList.add("hidden");
  reapplyNote.classList.add("hidden");

  const status = String(record.status || "").trim().toLowerCase();

  if(status === "pending"){
    resultStatus.textContent = text("status.pending");
    resultStatus.className = "result-value result-status-pending";
    resultMessage.textContent = text("status.pending_message");
  }else if(status === "approved"){
    resultStatus.textContent = text("status.approved");
    resultStatus.className = "result-value result-status-approved";
    resultKey.textContent = record.member_code || text("status.approved_key_missing");
    resultKeyRow.classList.remove("hidden");
    resultMessage.textContent = record.member_code
      ? text("status.approved_with_key_message")
      : text("status.approved_without_key_message");
    if(record.member_code){
      goRegisterBtn.classList.remove("hidden");
      saveForLaterBtn.classList.remove("hidden");
    }
  }else if(status === "rejected"){
    resultStatus.textContent = text("status.rejected");
    resultStatus.className = "result-value result-status-rejected";
    resultMessage.textContent = text("status.rejected_message");
    reapplyBtn.classList.remove("hidden");
    reapplyNote.classList.remove("hidden");
  }else if(status === "registered"){
    resultStatus.textContent = text("status.registered");
    resultStatus.className = "result-value result-status-approved";
    resultMessage.textContent = text("status.registered_message");
  }else{
    resultStatus.textContent = record.status || text("status.unknown");
    resultStatus.className = "result-value";
    resultMessage.textContent = text("status.unknown_message");
  }

  scrollContentToBottomPart(applicationResultWrap);
}

function extractIdentityMember(data){
  const payload = data && typeof data === "object" ? data : {};
  if(payload.member && typeof payload.member === "object") return payload.member;
  if(payload.data && typeof payload.data === "object") return payload.data;
  if(payload.found === true && payload.identity && typeof payload.identity === "object") return payload.identity;
  if(payload.id || payload.member_id) return payload;
  return null;
}

async function validateStoredIdentity(){
  const stored = getStoredUser();
  if(!stored) return null;

  if(!isCompleteStoredUser(stored)){
    clearStoredLogin();
    return null;
  }

  if(identityValidationInFlight) return identityValidationInFlight;

  identityValidationInFlight = (async () => {
    const { data, error } = await client.rpc("get_manager_member_identity", {
      p_member_id:stored.member_id,
      p_member_code:stored.member_code
    });

    if(error){
      showPageError(text("error.identity_read_failed"), error.message || "get_manager_member_identity");
      return null;
    }

    const member = extractIdentityMember(data);
    if(!member){
      clearStoredLogin();
      clearPageError();
      return null;
    }

    const normalizedRole = normalizeText(member.role).toLowerCase();
    if(!VALID_MEMBER_ROLES.has(normalizedRole)){
      updateStatusUserUI(text("role.invalid"));
      showPageError(text("error.identity_invalid"), normalizedRole || "missing role");
      return { ...member, role:normalizedRole, invalid_role:true };
    }

    clearPageError();
    const normalizedMember = {
      ...member,
      id:member.id || member.member_id || stored.member_id,
      nickname:normalizeText(member.nickname) || stored.nickname,
      member_code:normalizeText(member.member_code) || stored.member_code,
      role:normalizedRole
    };
    saveStoredMember(normalizedMember);
    return normalizedMember;
  })();

  try{
    return await identityValidationInFlight;
  }finally{
    identityValidationInFlight = null;
  }
}

async function updateIdentityUI(){
  const rawStored = getStoredUser();
  if(rawStored && !isCompleteStoredUser(rawStored)){
    clearStoredLogin();
  }

  if(!isLoggedIn()){
    const applicant = getApplicantSession();

    if(applicant && currentApplicationRecord){
      const status = normalizeText(currentApplicationRecord.status).toLowerCase();
      if(status === "pending"){
        updateStatusUserUI(text("role.applying"));
        return;
      }
      if(status === "rejected"){
        updateStatusUserUI(text("role.visitor"));
        return;
      }
      if(status === "approved"){
        updateStatusUserUI(text("status.approved"));
        return;
      }
    }

    updateStatusUserUI(applicant ? text("role.applying") : text("role.visitor"));
    return;
  }

  const member = await validateStoredIdentity();
  if(!member){
    updateStatusUserUI(text("role.visitor"));
    return;
  }

  if(member.invalid_role){
    updateStatusUserUI(text("role.invalid"));
    return;
  }

  const role = normalizeText(member.role).toLowerCase();
  if(role === "applying"){
    updateStatusUserUI(text("role.visitor"));
    return;
  }

  const pageKey = getManagerPageKeyByRole(role);
  if(pageKey !== PAGE_KEY){
    goPage(pageKey);
    return;
  }

  updateStatusUserUI(getRoleLabel(role));
}

async function quickLogin(){
  const nickname = quickNicknameInput.value.trim();
  const key = quickPasswordInput.value.trim();

  loginHint.textContent = "";
  loginHint.style.color = "#8b5b34";

  if(!nickname || !key){
    loginHint.textContent = text("login.hint.missing_key");
    return;
  }

  try{
    const loginResult = await client.rpc("room10_member_login", {
      p_nickname: nickname,
      p_key_code: key
    });

    if(loginResult.error){
      console.error("room10_member_login 调用失败：", loginResult.error);
      loginHint.textContent = text("login.hint.check_failed");
      return;
    }

    const loginRow = Array.isArray(loginResult.data) && loginResult.data.length ? loginResult.data[0] : null;

    if(loginRow?.success){
      const normalizedRole = normalizeText(loginRow.role).toLowerCase();
      const memberId = normalizeText(loginRow.member_id);
      const memberCode = normalizeText(loginRow.member_code);
      const memberNickname = normalizeText(loginRow.nickname || nickname);

      if(!VALID_MEMBER_ROLES.has(normalizedRole) || !memberId || !memberCode || !memberNickname){
        clearStoredLogin();
        loginHint.textContent = text("error.identity_invalid");
        return;
      }

      saveStoredMember({
        id:memberId,
        nickname:memberNickname,
        role:normalizedRole,
        member_code:memberCode
      });
      clearApplicantSession();

      loginHint.style.color = "#5f7d3a";
      loginHint.textContent = text("login.hint.success");

      quickNicknameInput.value = "";
      quickPasswordInput.value = "";

      await showUpgradeLoginNotice(loginRow);
      await updateIdentityUI();
      return;
    }

    if(loginRow && loginRow.login_mode !== "no_member"){
      loginHint.textContent = normalizeLoginRpcMessage(loginRow.message) || text("login.hint.door_failed");
      return;
    }

    const appResult = await client.rpc("get_room10_application_login_state", {
      p_name:nickname,
      p_key_code:key
    });

    if(appResult.error){
      console.error("get_room10_application_login_state 调用失败：", appResult.error);
      loginHint.textContent = text("login.hint.check_failed");
      return;
    }

    const appPayload = appResult.data && typeof appResult.data === "object" ? appResult.data : {};
    const app = appPayload.found === true && appPayload.application && typeof appPayload.application === "object"
      ? appPayload.application
      : null;

    if(!app){
      loginHint.textContent = appPayload.message || text("login.hint.no_record");
      return;
    }

    const appStatus = String(app.status || "").toLowerCase();
    const appKey = String(app.member_code || "").trim();

    if(appStatus === "approved" && appKey && appKey === key){
      loginHint.textContent = text("login.hint.approved_unregistered");
      loginHint.style.color = "#8b5b34";
      setApplicantSession(app.name, app.contact_qq);
      setFoldState("query");
      renderApplicationResult(app);
      await updateIdentityUI();
      return;
    }

    if(appStatus === "pending"){
      loginHint.textContent = text("login.hint.pending");
      return;
    }

    if(appStatus === "rejected"){
      loginHint.textContent = text("login.hint.rejected");
      return;
    }

    if(appStatus === "registered"){
      loginHint.textContent = text("login.hint.registered");
      return;
    }

    loginHint.textContent = text("login.hint.blocked");

  }catch(err){
    console.error("quickLogin() 异常：", err);
    loginHint.textContent = text("login.hint.check_failed");
  }
}

async function queryApplicationStatus(){
  const name = applyLoginNameInput.value.trim();
  const qq = applyLoginQQInput.value.trim();

  applyQueryHint.textContent = "";
  applyQueryHint.style.color = "#8b5b34";
  statusNotice.classList.add("hidden");

  if(!name || !qq){
    applyQueryHint.textContent = text("query.hint.missing_fields");
    return;
  }

  const qqValid = /^[0-9]{5,20}$/.test(qq);
  if(!qqValid){
    applyQueryHint.textContent = text("query.hint.invalid_qq");
    return;
  }

  try{
    const result = await client.rpc("query_room10_application_status", {
      p_name:name,
      p_contact_qq:qq
    });

    if(result.error){
      console.error("query_room10_application_status 调用失败：", result.error);
      applyQueryHint.textContent = text("query.hint.failed");
      return;
    }

    const payload = result.data && typeof result.data === "object" ? result.data : {};
    const data = payload.found === true && payload.application && typeof payload.application === "object"
      ? payload.application
      : null;

    if(!data){
      currentApplicationRecord = null;
      applicationResultWrap.classList.add("hidden");
      clearApplicantSession();
      await updateIdentityUI();
      applyQueryHint.textContent = text("query.hint.not_found");
      return;
    }

    setApplicantSession(name, qq);
    saveApplicationDraft();
    setFoldState("query");
    renderApplicationResult(data);
    applyQueryHint.style.color = "#5f7d3a";
    applyQueryHint.textContent = text("query.hint.found");
    await updateIdentityUI();

  }catch(err){
    console.error("queryApplicationStatus() 异常：", err);
    applyQueryHint.textContent = text("query.hint.failed");
  }
}

async function reapplyApplication(){
  if(!currentApplicationRecord?.id || reapplyBusy) return;

  const applicationId = currentApplicationRecord.id;
  reapplyBusy = true;
  const oldText = reapplyBtn.textContent;

  try{
    reapplyBtn.disabled = true;
    reapplyBtn.textContent = text("reapply.processing");
    statusNotice.classList.add("hidden");

    const reapplyResult = await client.rpc("reapply_room10_application", {
      p_application_id:String(applicationId),
      p_name:String(currentApplicationRecord.name || "").trim(),
      p_contact_qq:String(currentApplicationRecord.contact_qq || "").trim()
    });

    if(reapplyResult.error){
      console.error("reapply_room10_application 调用失败：", reapplyResult.error);
      showStatusNotice(text("reapply.failed"), "error");
      return;
    }

    const payload = reapplyResult.data && typeof reapplyResult.data === "object" ? reapplyResult.data : {};
    const updatedApplication = payload.application && typeof payload.application === "object"
      ? payload.application
      : null;

    if(payload.success !== true || !updatedApplication){
      if(updatedApplication){
        currentApplicationRecord = updatedApplication;
        renderApplicationResult(updatedApplication);
        await updateIdentityUI();
      }
      showStatusNotice(payload.message || text("reapply.not_allowed"), "error");
      return;
    }

    setApplicantSession(updatedApplication.name, updatedApplication.contact_qq);

    currentApplicationRecord = updatedApplication;
    renderApplicationResult(updatedApplication);
    await updateIdentityUI();

    applyQueryHint.style.color = "#5f7d3a";
    applyQueryHint.textContent = text("reapply.success");
    showStatusNotice(text("reapply.success"), "success");

  }catch(err){
    console.error("reapplyApplication() 异常：", err);
    showStatusNotice(text("reapply.failed"), "error");
  }finally{
    reapplyBtn.disabled = false;
    reapplyBtn.textContent = oldText;
    reapplyBusy = false;
  }
}

function toggleQuickPassword(){
  const showPassword = quickPasswordInput.type === "password";
  quickPasswordInput.type = showPassword ? "text" : "password";
  const button = quickPasswordInput.parentElement?.querySelector('button[onclick="toggleQuickPassword()"]');
  if(button) button.textContent = text(showPassword ? "login.toggle.hide" : "login.toggle.show");
}

function hasMemberRoomAccess(){
  return new Set(["owner", "admin", "member", "roomer", "trainee"]).has(getRole());
}

function goNeedLogin(pageKey){
  if(!isLoggedIn() || !hasMemberRoomAccess()){
    loginHint.style.color = "#8b5b34";
    loginHint.textContent = text("login.hint.need_key");
    if(isMediumScrollScreen()){
      contentArea.scrollTo({ top:0, behavior:"smooth" });
    }
    return;
  }
  goPage(pageKey);
}

async function logout(){
  clearStoredLogin();
  clearApplicantSession();
  currentApplicationRecord = null;
  applicationResultWrap.classList.add("hidden");
  statusNotice.classList.add("hidden");
  await updateIdentityUI();
}

async function submitApplication(){
  const name = applyNicknameInput.value.trim();
  const contactQQ = applyQQInput.value.trim();

  applyHint.textContent = "";
  applyHint.style.color = "#8b5b34";

  if(!name || !contactQQ){
    applyHint.textContent = text("apply.hint.missing_fields");
    setFoldState("apply");
    scrollContentToBottomPart(applyHint);
    return;
  }

  const qqValid = /^[0-9]{5,20}$/.test(contactQQ);
  if(!qqValid){
    applyHint.textContent = text("apply.hint.invalid_qq");
    setFoldState("apply");
    scrollContentToBottomPart(applyHint);
    return;
  }

  try{
    const submitResult = await client.rpc("submit_room10_application", {
      p_name:name,
      p_contact_qq:contactQQ
    });

    if(submitResult.error){
      console.error("submit_room10_application 调用失败：", submitResult.error);
      applyHint.textContent = text("apply.hint.failed");
      setFoldState("apply");
      scrollContentToBottomPart(applyHint);
      return;
    }

    const submitPayload = submitResult.data && typeof submitResult.data === "object" ? submitResult.data : {};
    const submittedApplication = submitPayload.application && typeof submitPayload.application === "object"
      ? submitPayload.application
      : null;

    if(submitPayload.success !== true || !submittedApplication){
      applyHint.textContent = submitPayload.message || text("apply.hint.failed");
      setFoldState("apply");
      scrollContentToBottomPart(applyHint);
      return;
    }

    localStorage.setItem(APPLY_STORAGE_KEY, JSON.stringify({
      nickname: name,
      qq: contactQQ
    }));

    setApplicantSession(name, contactQQ);
    applyLoginNameInput.value = name;
    applyLoginQQInput.value = contactQQ;

    applyHint.style.color = "#5f7d3a";
    applyHint.textContent = text("apply.hint.success");

    renderApplicationResult(submittedApplication);
    await updateIdentityUI();

    setTimeout(() => {
      setFoldState("query");
      scrollContentToBottomPart(applicationResultWrap);
    }, 500);

  }catch(err){
    console.error("submitApplication() 异常：", err);
    applyHint.textContent = text("apply.hint.failed");
    setFoldState("apply");
    scrollContentToBottomPart(applyHint);
  }
}
