<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-text-key="page.title"></title>
<!-- manager-admin-common-template-v29; based-on-common-template-v45; admin-reviewer-no-transition-notice; key-storage-a-b-columns -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../room10-paths.js"></script>
<style>

*{box-sizing:border-box;}

:root{
    --ui-scale:1;
  --room-nav-scale:var(--ui-scale);
  --identity-scale:var(--ui-scale);

    --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);
  --identity-name-y:0em;
  --identity-separator-y:0em;
  --identity-role-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;

  /* 手机版身份文字独立校准：昵称 / 分隔符 / 身份 / 铃铛 / 登录按钮 */
  --identity-mobile-name-y:0em;
  --identity-mobile-separator-y:0em;
  --identity-mobile-role-y:0em;
  --identity-mobile-notice-y:0em;
  --identity-mobile-button-y:0em;
  --identity-notice-mobile-top:58px;

    /*
     外框位置改为底图百分比绑定，不再使用 px × scale。
     原来的 px × scale 在 541px–650px 会被最小缩放值卡住，导致整排按钮相对底图向右漂移。
     百分比只控制按钮外框位置和尺寸；--room-nav-scale 只控制内部文字、圆角、阴影和特效。
  */
  --room-nav-top:6.35%;
  --room-nav-start-left:25.83%;
  --room-nav-btn-width:4.72%;
  --room-nav-btn-height:5.10%;
  --room-nav-gap:0.486%;

  --room-nav-hall-left:var(--room-nav-start-left);
  --room-nav-living-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 1);
  --room-nav-manager-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 2);
  --room-nav-honor-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 3);
  --room-nav-studio-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 4);
  --room-nav-game-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 5);
  --room-nav-dorm-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 6);
  --room-nav-flower-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 7);
  --room-nav-pets-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 8);

  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:#5b4632;
  background:#e7dfd4;
}

button{font-family:inherit;}
.hidden{display:none!important;}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 16% 12%,rgba(255,246,238,.72),transparent 34%),
    radial-gradient(circle at 86% 18%,rgba(226,215,201,.42),transparent 38%),
    linear-gradient(180deg,#efe7dc 0%,#e5d8c8 100%);
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
}

#overlay *{pointer-events:auto;}

/* 修复：#overlay * 的 pointer-events:auto 会把整层 roomNavLayer 变成透明遮罩，挡住主面板按钮 */
#overlay .roomNavLayer{
  pointer-events:none!important;
}

#overlay .roomNavLayer .navBtn{
  pointer-events:auto!important;
}

#overlay .roomIdentity{
  pointer-events:none!important;
}

#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{
  pointer-events:auto!important;
}

.roomNavLayer{
  position:absolute;
  inset:0;
  z-index:55;
  pointer-events:none;
  --s:var(--room-nav-scale,1);
  --nav-btn-radius:calc(15px * var(--s));
  --nav-btn-font:calc(15px * var(--s));
  --nav-btn-border:calc(1px * var(--s));
  --nav-btn-shadow-y:calc(3px * var(--s));
  --nav-btn-shadow-blur:calc(8px * var(--s));
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:absolute;
  top:var(--room-nav-top);
  width:var(--room-nav-btn-width);
  height:var(--room-nav-btn-height);
  min-width:0;
  min-height:0;
  padding:0;
  border-radius:var(--nav-btn-radius);
  color:var(--room-nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.56), transparent 40%),
    radial-gradient(circle at 78% 74%, var(--room-nav-wash), transparent 48%),
    linear-gradient(180deg, var(--room-nav-paper) 0%, var(--room-nav-paper-2) 100%);
  border:var(--nav-btn-border) solid var(--room-nav-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.64),
    0 calc(2px * var(--s)) calc(7px * var(--s)) rgba(96,70,48,.10);
  text-shadow:0 calc(1px * var(--s)) 0 rgba(255,255,255,.38);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  pointer-events:auto;
}

.navBtn[data-room="hall"]{left:var(--room-nav-hall-left);}
.navBtn[data-room="living"]{left:var(--room-nav-living-left);}
.navBtn[data-room="manager"]{left:var(--room-nav-manager-left);}
.navBtn[data-room="honor"]{left:var(--room-nav-honor-left);}
.navBtn[data-room="studio"]{left:var(--room-nav-studio-left);}
.navBtn[data-room="game"]{left:var(--room-nav-game-left);}
.navBtn[data-room="dorm"]{left:var(--room-nav-dorm-left);}
.navBtn[data-room="flower"]{left:var(--room-nav-flower-left);}
.navBtn[data-room="pets"]{left:var(--room-nav-pets-left);}

.navBtn:not(.is-current):hover,
.navBtn:not(.is-current):focus-visible{
  color:#5f3d22;
  background:
    radial-gradient(circle at 20% 24%, rgba(255,255,255,.66), transparent 42%),
    radial-gradient(circle at 80% 78%, rgba(207,170,143,.24), transparent 50%),
    linear-gradient(180deg, rgba(255,252,246,.88) 0%, rgba(239,226,210,.82) 100%);
  border-color:rgba(151,112,84,.36);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.70),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.12);
  filter:saturate(1.02);
}

.navBtn.is-current{
  cursor:default;
  color:var(--room-nav-current-text);
  background:
    radial-gradient(circle at 22% 22%, rgba(255,255,255,.62), transparent 42%),
    radial-gradient(circle at 80% 80%, rgba(190,151,126,.26), transparent 50%),
    linear-gradient(180deg, rgba(246,235,222,.94) 0%, var(--room-nav-current-bg) 100%);
  border-color:var(--room-nav-current-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.68),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.13),
    0 0 0 calc(2px * var(--s)) rgba(255,253,248,.46);
  filter:none;
}

.navLabel{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.82),
    0 0 calc(8px * var(--s)) rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{ transform:translateY(calc(4px * var(--s))) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(calc(-5px * var(--s))) rotate(6deg) scale(1); opacity:.76; }
}
@keyframes navFloatB{
  0%,100%{ transform:translateY(calc(5px * var(--s))) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(calc(-6px * var(--s))) rotate(-7deg) scale(1); opacity:.68; }
}
@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(calc(6px * var(--s))) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(calc(-6px * var(--s))) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:not(.is-current):hover .navEffectA,
.navBtn:not(.is-current):focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectB,
.navBtn:not(.is-current):focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectC,
.navBtn:not(.is-current):focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}
.navBtn.is-current .navEffect{display:none;}

.navBtn[data-room="hall"] .navEffect{color:rgba(255,205,96,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.95),0 0 calc(10px * var(--s)) rgba(255,215,105,.62);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="honor"] .navEffect{color:rgba(205,143,45,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.92),0 0 calc(8px * var(--s)) rgba(255,220,130,.52);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}

.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}

.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}

.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}

.identityNamePart{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  line-height:1;
  white-space:nowrap;
  font:inherit;
}

.identityNickname{transform:translateY(var(--identity-name-y));}
.identitySeparator{
  margin:0 .08em;
  color:rgba(111,87,70,.78);
  font-weight:800;
  transform:translateY(var(--identity-separator-y));
}
.identityRole{transform:translateY(var(--identity-role-y));}

.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}

.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:950;
  text-align:left;
}

.identityNoticePanel.show{display:block;}

.identityNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
  margin-bottom:calc(10px * var(--s));
}

.identityNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}

.templateMainPanel{
  position:absolute;
  left:8.8%;
  top:22.2%;
  width:60.8%;
  height:58.5%;
  z-index:20;
  border-radius:calc(24px * var(--ui-scale));
  background:rgba(255,250,240,.58);
  border:calc(1px * var(--ui-scale)) dashed rgba(170,122,82,.24);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:calc(12px * var(--ui-scale));
  color:#8a6544;
  font-weight:900;
  font-size:calc(18px * var(--ui-scale));
  text-align:center;
  padding:calc(20px * var(--ui-scale));
}

.templateMainPanel p{
  margin:0;
  max-width:calc(620px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  line-height:1.7;
  font-weight:800;
  color:#9a7656;
}


@media(max-width:540px){
  html,body{
    overflow-x:hidden;
    overflow-y:auto;
    height:auto;
    min-height:100%;
  }

  #room{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    height:auto;
    display:block;
    overflow:visible;
    padding:10px 12px 14px;
    background:
      linear-gradient(rgba(242,236,229,.74), rgba(238,231,222,.92)),
      #e7dfd4;
  }

  #bgFrame{display:none;}

  #overlay{
    position:relative;
    left:auto!important;
    top:auto!important;
    width:100%!important;
    height:auto!important;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:0!important;
    padding:0!important;
    overflow:visible;
    pointer-events:auto;
  }

  .roomNavLayer{
    position:relative;
    inset:auto;
    width:100%;
    height:106px;
    min-height:106px;
    max-height:106px;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(3,32px);
    gap:5px;
    margin:0!important;
    padding:0!important;
    align-content:start;
    order:0;
    z-index:20;
    pointer-events:auto;
    --s:1;
  }

  .roomNavLayer .navBtn{
    position:relative;
    left:auto!important;
    top:auto!important;
    display:flex!important;
    align-items:center;
    justify-content:center;
    width:100%;
    height:32px;
    min-width:0;
    min-height:32px;
    max-height:32px;
    margin:0!important;
    padding:0!important;
    border-radius:10px;
    font-size:12px;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
  }

  .roomNavLayer .navBtn.is-current{
    display:flex!important;
    visibility:visible!important;
  }

  .roomNavLayer .navLabel{
    height:100%;
    padding-top:.04em;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
  }

  .roomNavLayer .navEffect{display:none;}

  .roomIdentity{
    --s:1;
    position:relative;
    right:auto;
    top:auto;
    width:100%;
    min-width:0;
    height:40px;
    min-height:40px;
    order:1;
    z-index:90;
  }

  .roomIdentityBar{
    grid-template-columns:minmax(0,1fr) 34px 42px;
    gap:6px;
    padding:5px 7px;
    border-radius:14px;
  }

  .identityNameBox{
    padding:0 9px;
    border-radius:10px;
    overflow:visible;

/* ===== 宿管室管理页：通用模板内容区 ===== */
:root{
  --manager-text:#5b4632;
  --manager-title:#6a5038;
  --manager-line:#d8c2a3;
  --manager-line2:#e3d0b4;
  --manager-panel:rgba(255,249,240,.88);
  --manager-card:rgba(255,252,247,.92);
  --manager-btn:#c98e56;
  --manager-btn-hover:#b97d45;
  --manager-sub:#e7d3b7;
  --manager-sub-hover:#dcc29e;
  --manager-green:#5f7d3a;
  --manager-red:#a14f3f;
  --manager-muted:#8e7c68;
}

#pageMainPanel.managerMainPanel{
  left:5.65%;
  top:18.6%;
  width:86.5%;
  height:72.5%;
  padding:0;
  border:none;
  background:transparent;
  border-radius:0;
  display:grid;
  grid-template-columns:minmax(180px, 18%) minmax(0, 1fr) minmax(130px, 14.8%);
  gap:calc(14px * var(--ui-scale));
  align-items:stretch;
  justify-content:normal;
  color:var(--manager-text);
  font-size:calc(13px * var(--ui-scale));
  font-weight:400;
  text-align:left;
  pointer-events:auto;
}

#pageMainPanel.managerMainPanel *{pointer-events:auto;}

.panel{
  background:var(--manager-panel);
  border:1px solid var(--manager-line);
  border-radius:calc(16px * var(--ui-scale));
  box-shadow:0 10px 24px rgba(116,86,54,.08);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}




#pageNotice{
  position:fixed;
  left:50%;
  top:50%;
  width:min(420px, calc(100vw - 40px));
  padding:14px 16px;
  border-radius:16px;
  border:1px solid rgba(216,194,163,.86);
  background:rgba(247,238,225,.98);
  color:#7b654f;
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  box-shadow:0 18px 42px rgba(85,58,34,.18);
  font-size:14px;
  line-height:1.5;
  transform:translate(-50%, -50%);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
}
#pageNotice.notice-success{background:rgba(238,246,232,.98);color:var(--manager-green);}
#pageNotice.notice-error{background:rgba(251,236,235,.98);color:var(--manager-red);}
.notice-text{flex:1 1 auto;text-align:center;font-weight:800;}
.notice-close{flex:0 0 auto;width:24px;height:24px;border:none;border-radius:999px;background:rgba(234,217,188,.56);color:inherit;cursor:pointer;font-size:16px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;}

#managerBriefCard{
  min-width:0;
  height:fit-content;
  max-height:100%;
  padding:calc(13px * var(--ui-scale)) calc(14px * var(--ui-scale));

}
.brief-title{margin:0 0 calc(7px * var(--ui-scale));font-size:calc(14px * var(--ui-scale));line-height:1.25;font-weight:900;color:#6b4524;}

.inline-btn,.sub-btn{height:calc(34px * var(--ui-scale));min-width:calc(82px * var(--ui-scale));padding:0 calc(12px * var(--ui-scale));border:none;border-radius:calc(10px * var(--ui-scale));font-size:calc(12px * var(--ui-scale));cursor:pointer;font-weight:800;white-space:nowrap;}

function normalizeText(value){

function showPageError(message, detail = ""){
  let panel = document.getElementById("room10ConfigError");

    panel.id = "room10ConfigError";
    panel.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5000;max-width:min(720px,calc(100vw - 28px));padding:12px 16px;border-radius:14px;background:rgba(255,248,240,.98);border:1px solid rgba(165,94,64,.30);color:#7a3f2b;box-shadow:0 12px 30px rgba(87,50,31,.16);font-size:13px;font-weight:800;line-height:1.5;white-space:pre-line;";
    document.body.appendChild(panel);
  }
  panel.textContent = detail ? `${message}\n${detail}` : message;
}

function text(key){
  const value = pageTexts.get(key);

    const message = pageTexts.get("error.page_text_missing") || "MANAGER_ADMIN_TEXT_MISSING";
    throw new Error(`${message}：page_key=${PAGE_KEY}, text_key=${key}`);
  }
  return String(value);
}

function formatText(key, vars = {}){
  return text(key).replace(/\{(\w+)\}/g, (match, name) => (
    Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : match
  ));
}

function collectRequiredTextKeys(){
  const keys = new Set(REQUIRED_DYNAMIC_TEXT_KEYS);
  document.querySelectorAll("[data-text-key]").forEach(el => keys.add(el.dataset.textKey));
  document.querySelectorAll("[data-aria-label-key]").forEach(el => keys.add(el.dataset.ariaLabelKey));
  document.querySelectorAll("[data-alt-key]").forEach(el => keys.add(el.dataset.altKey));
  return [...keys].filter(Boolean);
}

async function loadPageTexts(){
  const { data, error } = await client.rpc("get_room10_page_texts", {
    p_page_key:PAGE_KEY,
    p_include_inactive:false
  });
  if(error){
    throw new Error(`${pageTexts.get("error.page_text_read_failed") || "MANAGER_ADMIN_TEXT_READ_FAILED"}: ${error.message || "get_room10_page_texts"}`);
  }
  pageTexts = new Map();
  (Array.isArray(data) ? data : []).forEach(row => {
    const key = normalizeText(row.text_key);
    if(key) pageTexts.set(key, String(row.text_value ?? ""));
  });
  const missing = collectRequiredTextKeys().filter(key => !normalizeText(pageTexts.get(key)));
  if(missing.length){
    throw new Error(`${pageTexts.get("error.page_text_missing") || "MANAGER_ADMIN_TEXT_MISSING"}：${missing.join("、")}`);
  }
  pageTextReady = true;
}

function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";

  root.style.setProperty("--ui-scale","1");

function syncOverlayToImage(){
  if(isMobileLayout()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.45, Math.min(3.2, displayWidth / 1440));
  const navScale = Math.max(0.38, Math.min(3.2, displayWidth / 1440));
  root.style.setProperty("--ui-scale", String(scale));
  root.style.setProperty("--room-nav-scale", String(navScale));
  root.style.setProperty("--identity-scale", String(scale));
}

  if(!VALID_MEMBER_ROLES.has(normalized)) return text("role.invalid");

}

    identitySeparator.classList.remove("hidden");
    identityRole.classList.remove("hidden");
    identityRole.textContent = roleText;
    identityAuthText.textContent = text("identity.logout_button");

  const count = Number(noticeCount || 0);
  if(identityNoticeBtn && identityNoticeCount){
    identityNoticeBtn.classList.toggle("hasNotice", count > 0);

  });
}

  if(role === "member" || role === "roomer" || role === "trainee") return room10PageUrl("managerMember");
  return room10PageUrl("managerVisitor");
}

function enterRoom(page, needLogin, room){
  const targetPage = String(page || "").trim();
  const targetRoom = String(room || "").trim();
  if(!targetPage) return;

  const loggedIn = readLoggedIn();
  const role = readRole();

  if(needLogin && !loggedIn){
    openLogin(targetPage);
    return;
  }

  if(targetRoom === "dorm" && role === "applying"){
    window.location.href = getManagerPageByRole();
    return;
  }

  if((targetRoom === "flower" || targetRoom === "pets") && !loggedIn){
    window.location.href = `${targetPage}${targetPage.includes("?") ? "&" : "?"}mode=guest`;
    return;
  }

  window.location.href = targetPage;
}

function setupRoomNav(currentRoom){
  const buttons = document.querySelectorAll(".navBtn");
  const current = String(currentRoom || "").trim();

  buttons.forEach(btn => {
    const room = btn.dataset.room || "";
    const isCurrent = room === current;

    btn.classList.toggle("is-current", isCurrent);

    if(isCurrent){
      btn.setAttribute("aria-current","page");
      btn.setAttribute("tabindex","-1");
    }else{
      btn.removeAttribute("aria-current");
      btn.removeAttribute("tabindex");
    }

    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();

      if(btn.classList.contains("is-current")) return;

      if(btn.dataset.manager === "true"){
        enterManagerRoom();
        return;
      }

      const targetUrl = room10PageUrl(btn.dataset.page);
      enterRoom(targetUrl, btn.dataset.login === "true", btn.dataset.room);
    });
  });
}

function formatTime(input){
  if(!input) return text("common.unknown_time");
  const d = new Date(input);
  if(Number.isNaN(d.getTime())) return text("common.unknown_time");

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  const h = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");

  return `${y}-${m}-${day} ${h}:${min}`;
}

function parseKeySortValue(raw){
  const s = String(raw || "").trim();
  if(!s) return { num: Number.MAX_SAFE_INTEGER, text: s };

  const match = s.match(/^([A-Za-z]*)(\d+)$/);
  if(match){
    const prefix = match[1] || "";
    const num = Number(match[2]);
    return { num, text: prefix + String(num).padStart(20, "0") };
  }

  const digit = s.match(/(\d+)/);
  if(digit){
    return { num: Number(digit[1]), text: s };
  }

  return { num: Number.MAX_SAFE_INTEGER, text: s };
}

async function getCurrentMemberRecord(){
  const stored = getStoredUser();

  if(!stored || !isCompleteStoredUser(stored)){
    if(localStorage.getItem(STORAGE_KEYS.loggedIn) === "true") clearStoredLogin();
    return null;
  }

  const { data, error } = await client.rpc("get_manager_member_identity", {
    p_member_id:stored.member_id,
    p_member_code:stored.member_code
  });

  if(error){
    console.error("读取当前成员身份失败：", error);
    showNotice(text("error.identity_read_failed"), "error");
    return { identity_error:true };
  }

  if(data === null){
    clearStoredLogin();
    return null;
  }

  const isStandardIdentity = (
    data &&
    typeof data === "object" &&
    !Array.isArray(data) &&
    String(data.id || "").trim() &&
    String(data.nickname || "").trim() &&
    String(data.role || "").trim() &&
    String(data.member_code || "").trim()
  );

  if(!isStandardIdentity){
    showNotice(text("error.identity_read_failed"), "error");
    return { identity_error:true };
  }

  const normalizedMember = {
    id:String(data.id).trim(),
    nickname:String(data.nickname).trim(),
    member_code:String(data.member_code).trim(),
    role:String(data.role).trim().toLowerCase()
  };

  if(!VALID_MEMBER_ROLES.has(normalizedMember.role)){
    return { ...normalizedMember, invalid_role:true };
  }

  saveStoredMember(normalizedMember);
  return normalizedMember;
}

async function loadKeyStorage(force = false){
  if(keyListLoaded && !force) return;

  resetKeyStorageUI();

  try{
    const currentMember = await getCurrentMemberRecord();
    const currentMemberCode = currentMember?.member_code || getCurrentMemberCode();

    if(!currentMember?.id || !currentMemberCode){
      keyStorageLoading.classList.add("hidden");
      keyStorageError.classList.remove("hidden");
      keyStorageError.textContent = text("keys.login_required");
      return;
    }

    const result = await client.rpc("get_manager_key_storage", {
      p_manager_member_id: currentMember.id,
      p_manager_member_code: currentMemberCode
    });

    if(result.error || !result.data?.success){
      console.error("读取钥匙保管处失败：", result.error || result.data);
      keyStorageLoading.classList.add("hidden");
      keyStorageError.classList.remove("hidden");
      keyStorageError.textContent = result.data?.message || text("keys.read_failed");
      return;
    }

    const rows = Array.isArray(result.data.items) ? result.data.items : [];

    keyStorageLoading.classList.add("hidden");

    if(!rows.length){
      keyStorageEmpty.classList.remove("hidden");
      keyListWrap.classList.add("hidden");
      keyListLoaded = true;
      return;
    }

    renderKeyList(rows);
    keyListWrap.classList.remove("hidden");
    keyListLoaded = true;

  }catch(err){
    console.error("loadKeyStorage() 异常：", err);
    keyStorageLoading.classList.add("hidden");
    keyStorageError.classList.remove("hidden");
    keyStorageError.textContent = text("keys.read_failed");
  }
}

    const votes = Array.isArray(item.votes) ? item.votes : [];
    const requiredCount = Math.max(1, Number(item.required_count || 1));
    const approveCount = Math.max(0, Number(item.approve_count || 0));
    const rejectCount = Math.max(0, Number(item.reject_count || 0));
    const myVote = votes.find(v => String(v.voter_member_id) === String(currentVoterId));
    const busy = isActionBusy("member", item.id);
    const approveLabel = busy && myVote?.vote !== "approve" ? text("action.processing") : text("button.approve");
    const rejectLabel = busy && myVote?.vote !== "reject" ? text("action.processing") : text("button.reject");
    const myVoteText = myVote
      ? `<div class="apply-meta">${escapeHtml(formatText("vote.my_current", {vote:myVote.vote === "approve" ? text("button.approve") : text("button.reject")}))}</div>`
      : `<div class="apply-meta">${escapeHtml(text("vote.not_voted"))}</div>`;

    return `
      <div class="apply-item">
        <div class="apply-head">
          <strong>${escapeHtml(item.name || text("common.unnamed"))}</strong>
          <span class="apply-time">${formatTime(item.created_at)}</span>
        </div>
        <div class="apply-body">
          <div>${escapeHtml(formatText("application.qq", {value:item.contact_qq || text("common.not_filled")}))}</div>
          <div>${escapeHtml(formatText("application.current_status", {value:statusLabel(item.status)}))}</div>
          <div>${escapeHtml(formatText("application.key", {value:item.member_code || text("common.unassigned")}))}</div>
        </div>
        ${myVoteText}
        ${buildVoteSummaryText(approveCount, rejectCount, requiredCount)}
        <div class="apply-actions-row">
          <button class="inline-btn" type="button" ${busy ? "disabled" : ""} onclick="voteMemberApplication('${item.id}', 'approve')">${approveLabel}</button>
          <button class="sub-btn" type="button" ${busy ? "disabled" : ""} onclick="voteMemberApplication('${item.id}', 'reject')">${rejectLabel}</button>
        </div>
      </div>
    `;
  }).join("");
}

function statusLabel(status){
  const value = normalizeText(status).toLowerCase();
  if(["approved","rejected","cancelled","pending"].includes(value)) return text(`status.${value}`);
  return text("status.unknown");
}

function voteLabel(vote){
  const value = normalizeText(vote).toLowerCase();
  if(value === "approve") return text("button.approve");
  if(value === "reject") return text("button.reject");
  return text("application.not_operated");
}

function roleLabelForApplication(role){
  return getRoleLabel(role || "");
}

function renderIdentityApplications(items){
  const box = document.getElementById("adminApplyList");
  if(!box) return;

  const rows = Array.isArray(items) ? items : [];
  if(!rows.length){
    box.innerHTML = `<div class="module-note">${escapeHtml(text("archive.identity_empty"))}</div>`;
    return;
  }

  box.innerHTML = rows.map(item => {
    const id = item.id;
    const status = String(item.status || "pending").toLowerCase();
    const typeLabel = item.type_label || (item.application_type === "member_upgrade" ? text("application.type_upgrade") : text("application.type_admin"));
    const currentRole = roleLabelForApplication(item.member_role);
    const targetLabel = item.target_label || (item.application_type === "member_upgrade" ? text("application.target_member") : text("application.target_admin"));
    const reviewLabel = item.review_label || (item.application_type === "member_upgrade" ? text("application.review_upgrade") : text("application.review_admin"));
    const approveCount = Number(item.approve_count || 0);
    const rejectCount = Number(item.reject_count || 0);
    const requiredCount = Number(item.required_count || 1);
    const busy = isActionBusy("admin", id);
    const canReview = status === "pending" && item.can_review !== false;
    const myVote = item.my_vote || "";
    const approveLabel = busy ? text("action.processing") : text("button.approve");
    const rejectLabel = busy ? text("action.processing") : text("button.reject");
    const myVoteText = myVote
      ? `<div class="apply-meta">${escapeHtml(formatText("application.my_operation", {vote:voteLabel(myVote)}))}</div>`
      : (canReview ? `<div class="apply-meta">${escapeHtml(text("application.not_operated"))}</div>` : ``);
    const actionHtml = canReview
      ? `<div class="apply-actions-row">
          <button class="inline-btn" type="button" ${busy ? "disabled" : ""} onclick="voteAdminApplication('${escapeHtml(id)}', 'approve')">${approveLabel}</button>
          <button class="sub-btn" type="button" ${busy ? "disabled" : ""} onclick="voteAdminApplication('${escapeHtml(id)}', 'reject')">${rejectLabel}</button>
        </div>`
      : `<div class="apply-meta">${status === "pending" ? text("application.self_blocked") : text("application.finished")}</div>`;

    return `
      <div class="apply-item">
        <div class="apply-head">
          <strong>${escapeHtml(item.nickname || text("common.unnamed"))}｜${escapeHtml(typeLabel)}</strong>
          <span class="apply-time">${formatTime(item.created_at)}</span>
        </div>
        <div class="apply-body">
          <div>${escapeHtml(formatText("application.current_role", {value:currentRole}))}</div>
          <div>${escapeHtml(formatText("application.target", {value:targetLabel}))}</div>
          <div>${escapeHtml(formatText("application.review_method", {value:reviewLabel}))}</div>
          <div>${escapeHtml(formatText("application.current_status", {value:statusLabel(status)}))}</div>
        </div>
        ${myVoteText}
        <div class="vote-summary">${escapeHtml(formatText("application.review_progress", {approve:approveCount,reject:rejectCount,required:requiredCount}))}</div>
        ${actionHtml}
      </div>
    `;
  }).join("");
}

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => {
      window.setTimeout(() => reject(new Error(`${label || "读取"}超时`)), ms);
    })
  ]);
}

async function loadAllApplications(force = false){
  if(archiveLoaded && !force) return;

  const memberApplyList = document.getElementById("memberApplyList");
  const adminApplyList = document.getElementById("adminApplyList");
  if(!memberApplyList || !adminApplyList) return;

  memberApplyList.innerHTML = `<div class="module-note">${escapeHtml(text("archive.member_loading"))}</div>`;
  adminApplyList.innerHTML = `<div class="module-note">${escapeHtml(text("list.loading"))}</div>`;

  let currentMember = null;
  try{
    currentMember = await withTimeout(getCurrentMemberRecord(), 8000, "当前登录信息读取");
  }catch(err){
    console.error("读取当前登录信息失败：", err);
  }

  if(!currentMember?.id || !currentMember?.member_code || currentMember.identity_error || currentMember.invalid_role){
    const message = currentMember?.identity_error
      ? text("error.identity_read_failed")
      : text("archive.identity_invalid");
    memberApplyList.innerHTML = `<div class="module-note">${escapeHtml(message)}</div>`;
    adminApplyList.innerHTML = `<div class="module-note">${escapeHtml(message)}</div>`;
    archiveLoaded = false;
    return;
  }

  let memberDone = false;
  let identityDone = false;

  try{
    const memberResult = await withTimeout(
      client.rpc("get_manager_room10_applications", {
        p_manager_member_id:currentMember.id,
        p_manager_member_code:currentMember.member_code
      }),
      10000,
      "入住申请读取"
    );

    const payload = memberResult.data && typeof memberResult.data === "object" ? memberResult.data : {};
    if(memberResult.error || payload.success !== true){
      console.error("读取入住申请失败：", memberResult.error || payload);
      memberApplyList.innerHTML = `<div class="module-note">${escapeHtml(payload.message || text("archive.member_read_failed"))}</div>`;
    }else{
      const items = Array.isArray(payload.items) ? payload.items : [];
      renderMemberApplications(
        items,
        currentMember.id
      );
      memberDone = true;
    }
  }catch(err){
    console.error("loadAllApplications() 入住申请异常：", err);
    memberApplyList.innerHTML = `<div class="module-note">${escapeHtml(text("archive.member_timeout"))}</div>`;
  }

  try{
    const identityResult = await withTimeout(
      client.rpc("get_manager_identity_applications", {
        p_manager_member_id:currentMember.id,
        p_manager_member_code:currentMember.member_code
      }),
      10000,
      "身份申请读取"
    );

    if(identityResult.error || !identityResult.data?.success){
      console.error("读取身份申请失败：", identityResult.error || identityResult.data);
      adminApplyList.innerHTML = `<div class="module-note">${escapeHtml(identityResult.data?.message || text("archive.identity_read_failed"))}</div>`;
    }else{
      renderIdentityApplications(identityResult.data.items || []);
      identityDone = true;
    }
  }catch(err){
    console.error("loadAllApplications() 身份申请异常：", err);
    adminApplyList.innerHTML = `<div class="module-note">${escapeHtml(text("archive.identity_timeout"))}</div>`;
  }

  archiveLoaded = memberDone && identityDone;
}


async function loadActivityFeed({reset = false, force = false} = {}){
  if(activityLoading) return;
  if(logsLoaded && !force && !reset) return;
  if(!activityFeedList) return;

  if(reset){
    activityRows = [];
    activityBefore = null;
    activityBeforeId = null;
    activityHasMore = false;
    activityFeedList.innerHTML = '<div class="module-note">正在读取维修记录……</div>';
  }

  activityLoading = true;
  if(activityRefreshBtn) activityRefreshBtn.disabled = true;
  if(activityLoadMoreBtn){
    activityLoadMoreBtn.disabled = true;
    activityLoadMoreBtn.textContent = "读取中……";
  }

  try{
    const reviewer = await getCurrentMemberRecord();
    if(!reviewer?.id){
      renderActivityFeed({errorMessage:"无法确认当前宿管身份，请重新登录。"});
      return;
    }

    const limit = 40;
    const { data, error } = await client.rpc("get_manager_room_activity_feed", {
      p_reviewer_member_id: reviewer.id,
      p_reviewer_member_code: getCurrentMemberCode() || null,
      p_category: activityCategory || null,
      p_search: normalizeText(activitySearchInput?.value) || null,
      p_days: Number(activityDaysSelect?.value || 30),
      p_before: activityBefore,
      p_before_event_id: activityBeforeId,
      p_limit: limit + 1
    });

    if(error){
      console.error("读取维修记录失败：", error);
      renderActivityFeed({
        errorMessage:`维修记录读取失败：${error.message || "get_manager_room_activity_feed"}`
      });
      return;
    }

    const rows = Array.isArray(data) ? data : [];
    activityHasMore = rows.length > limit;
    const visibleRows = rows.slice(0, limit);

    if(reset){
      activityRows = visibleRows;
    }else{
      const knownIds = new Set(activityRows.map(item => String(item.event_id || "")));
      activityRows.push(...visibleRows.filter(item => !knownIds.has(String(item.event_id || ""))));
    }

    const last = visibleRows[visibleRows.length - 1];
    activityBefore = last?.occurred_at || activityBefore;
    activityBeforeId = last?.event_id || activityBeforeId;
    logsLoaded = true;
    renderActivityFeed();
  }catch(err){
    console.error("loadActivityFeed() 异常：", err);
    renderActivityFeed({errorMessage:"维修记录读取失败，请稍后重试。"});
  }finally{
    activityLoading = false;
    if(activityRefreshBtn) activityRefreshBtn.disabled = false;
    if(activityLoadMoreBtn){
      activityLoadMoreBtn.disabled = !activityHasMore;
      activityLoadMoreBtn.textContent = "加载更多";
    }
  }
}




async function voteMemberApplication(applicationId, voteValue){
  if(!isAdminRole(getRole())){
    showNotice(text("error.action_permission"), "error");
    return;
  }

  if(isActionBusy("member", applicationId)) return;
  setActionBusy("member", applicationId, true);

  try{
    const voter = await getCurrentMemberRecord();
    if(!voter?.id || !voter?.member_code || voter.identity_error || voter.invalid_role){
      showNotice(text("error.login_required"), "error");
      return;
    }

    const reviewResult = await client.rpc("review_manager_room10_application", {
      p_manager_member_id:voter.id,
      p_manager_member_code:voter.member_code,
      p_application_id:String(applicationId || "").trim(),
      p_vote:voteValue
    });

    const payload = reviewResult.data && typeof reviewResult.data === "object" ? reviewResult.data : {};
    if(reviewResult.error || payload.success !== true){
      console.error("审核入住申请失败：", reviewResult.error || payload);
      showNotice(payload.message || text("action.failed"), "error");
      return;
    }

    archiveLoaded = false;
    logsLoaded = false;
    keyListLoaded = false;
    await loadAllApplications(true);
    if(activeAdminTab === "keys") await loadKeyStorage(true);

    showNotice(
      payload.message || (payload.finalized ? text("member_review.finalized") : text("member_review.saved")),
      payload.finalized ? "success" : "info"
    );
  }catch(err){
    console.error("voteMemberApplication() 异常：", err);
    showNotice(text("action.failed"), "error");
  }finally{
    setActionBusy("member", applicationId, false);
    archiveLoaded = false;
    await loadAllApplications(true);
  }
}



async function voteAdminApplication(applicationId, voteValue){
  if(isActionBusy("admin", applicationId)) return;
  setActionBusy("admin", applicationId, true);
  archiveLoaded = false;
  await loadAllApplications(true);

  try{
    const voter = await getCurrentMemberRecord();
    const voterCode = voter?.member_code || getCurrentMemberCode();

    if(!voter?.id || !voterCode){
      showNotice(text("error.login_required"), "error");
      return;
    }

    const reviewResult = await client.rpc("review_manager_identity_application", {
      p_manager_member_id: voter.id,
      p_manager_member_code: voterCode,
      p_application_id: Number(applicationId),
      p_vote: voteValue
    });

    if(reviewResult.error || !reviewResult.data?.success){
      console.error("审核身份申请失败：", reviewResult.error || reviewResult.data);
      showNotice(reviewResult.data?.message || text("action.failed"), "error");
      return;
    }

    archiveLoaded = false;
    logsLoaded = false;
    await loadAllApplications(true);

    showNotice(reviewResult.data.message || text("action.success"), "success");

  }catch(err){
    console.error("voteAdminApplication() 异常：", err);
    showNotice(text("action.failed"), "error");
  }finally{
    setActionBusy("admin", applicationId, false);
    archiveLoaded = false;
    await loadAllApplications(true);
  }
}

async function ensureAdminPage(){
  const stored = getStoredUser();

  if(!stored || !isCompleteStoredUser(stored)){
    if(localStorage.getItem(STORAGE_KEYS.loggedIn) === "true") clearStoredLogin();
    goPage("managerVisitor");
    return;
  }

  const member = await getCurrentMemberRecord();

  if(member?.identity_error){
    setIdentityState({
      nickname:stored.nickname,
      role:"invalid",
      loggedIn:true,
      noticeCount:0
    });
    return;
  }

  if(!member){
    goPage("managerVisitor");
    return;
  }

  if(member.invalid_role){
    setIdentityState({
      nickname:member.nickname || stored.nickname,
      role:"invalid",
      loggedIn:true,
      noticeCount:0
    });
    showNotice(text("error.identity_invalid"), "error");
    return;
  }

  const role = String(member.role || "").trim().toLowerCase();
  if(!isAdminRole(role)){
    goPage(getManagerPageKeyByRole(role));
    return;
  }

  updateStatusUserUI();
  setAdminTab(activeAdminTab);
}

async function initManagerAdminPage(){
  try{
    await loadPageTexts();
    applyPageTexts();
    renderSiteNoticeList([]);
    applyManagerAssets();
    syncOverlayToImage();
    setupRoomNav(CURRENT_ROOM);
    bindActivityControls();
    await ensureAdminPage();
  }catch(err){
    showPageError(pageTexts.get("error.page_text_read_failed") || "MANAGER_ADMIN_INIT_FAILED", err.message || String(err));
  }
}

window.addEventListener("orientationchange", () => {

void initManagerAdminPage();

  if(
    e.key === "room10LoggedIn" ||
    e.key === "room10User" ||
    e.key === "room10Role" ||
    e.key === "room10MemberId" ||
