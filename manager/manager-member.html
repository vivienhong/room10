<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜宿管室</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../room10-paths.js"></script>
<!-- manager-member-common-template-db-text-v34; cleaned-old-conflict-code; cancel-rpc; common-template-components -->
<style>
*{box-sizing:border-box;}

:root{
    --ui-scale:1;
  --room-nav-scale:var(--ui-scale);
  --identity-scale:var(--ui-scale);

    --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);
  --identity-name-y:0em;
  --identity-separator-y:0em;
  --identity-role-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;

  /* 手机版身份文字独立校准：昵称 / 分隔符 / 身份 / 铃铛 / 登录按钮 */
  --identity-mobile-name-y:0em;
  --identity-mobile-separator-y:0em;
  --identity-mobile-role-y:0em;
  --identity-mobile-notice-y:0em;
  --identity-mobile-button-y:0em;
  --identity-notice-mobile-top:58px;

    /*
     外框位置改为底图百分比绑定，不再使用 px × scale。
     原来的 px × scale 在 541px–650px 会被最小缩放值卡住，导致整排按钮相对底图向右漂移。
     百分比只控制按钮外框位置和尺寸；--room-nav-scale 只控制内部文字、圆角、阴影和特效。
  */
  --room-nav-top:6.35%;
  --room-nav-start-left:25.83%;
  --room-nav-btn-width:4.72%;
  --room-nav-btn-height:5.10%;
  --room-nav-gap:0.486%;

  --room-nav-hall-left:var(--room-nav-start-left);
  --room-nav-living-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 1);
  --room-nav-manager-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 2);
  --room-nav-honor-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 3);
  --room-nav-studio-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 4);
  --room-nav-game-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 5);
  --room-nav-dorm-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 6);
  --room-nav-flower-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 7);
  --room-nav-pets-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 8);

  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:#5b4632;
  background:#e7dfd4;
}

button{font-family:inherit;}
.hidden{display:none!important;}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 16% 12%,rgba(255,246,238,.72),transparent 34%),
    radial-gradient(circle at 86% 18%,rgba(226,215,201,.42),transparent 38%),
    linear-gradient(180deg,#efe7dc 0%,#e5d8c8 100%);
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
}

#overlay *{pointer-events:auto;}

/* 修复：#overlay * 的 pointer-events:auto 会把整层 roomNavLayer 变成透明遮罩，挡住主面板按钮 */
#overlay .roomNavLayer{
  pointer-events:none!important;
}

#overlay .roomNavLayer .navBtn{
  pointer-events:auto!important;
}

#overlay .roomIdentity{
  pointer-events:none!important;
}

#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{
  pointer-events:auto!important;
}

.roomNavLayer{
  position:absolute;
  inset:0;
  z-index:55;
  pointer-events:none;
  --s:var(--room-nav-scale,1);
  --nav-btn-radius:calc(15px * var(--s));
  --nav-btn-font:calc(15px * var(--s));
  --nav-btn-border:calc(1px * var(--s));
  --nav-btn-shadow-y:calc(3px * var(--s));
  --nav-btn-shadow-blur:calc(8px * var(--s));
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:absolute;
  top:var(--room-nav-top);
  width:var(--room-nav-btn-width);
  height:var(--room-nav-btn-height);
  min-width:0;
  min-height:0;
  padding:0;
  border-radius:var(--nav-btn-radius);
  color:var(--room-nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.56), transparent 40%),
    radial-gradient(circle at 78% 74%, var(--room-nav-wash), transparent 48%),
    linear-gradient(180deg, var(--room-nav-paper) 0%, var(--room-nav-paper-2) 100%);
  border:var(--nav-btn-border) solid var(--room-nav-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.64),
    0 calc(2px * var(--s)) calc(7px * var(--s)) rgba(96,70,48,.10);
  text-shadow:0 calc(1px * var(--s)) 0 rgba(255,255,255,.38);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  pointer-events:auto;
}

.navBtn[data-room="hall"]{left:var(--room-nav-hall-left);}
.navBtn[data-room="living"]{left:var(--room-nav-living-left);}
.navBtn[data-room="manager"]{left:var(--room-nav-manager-left);}
.navBtn[data-room="honor"]{left:var(--room-nav-honor-left);}
.navBtn[data-room="studio"]{left:var(--room-nav-studio-left);}
.navBtn[data-room="game"]{left:var(--room-nav-game-left);}
.navBtn[data-room="dorm"]{left:var(--room-nav-dorm-left);}
.navBtn[data-room="flower"]{left:var(--room-nav-flower-left);}
.navBtn[data-room="pets"]{left:var(--room-nav-pets-left);}

.navBtn:not(.is-current):hover,
.navBtn:not(.is-current):focus-visible{
  color:#5f3d22;
  background:
    radial-gradient(circle at 20% 24%, rgba(255,255,255,.66), transparent 42%),
    radial-gradient(circle at 80% 78%, rgba(207,170,143,.24), transparent 50%),
    linear-gradient(180deg, rgba(255,252,246,.88) 0%, rgba(239,226,210,.82) 100%);
  border-color:rgba(151,112,84,.36);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.70),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.12);
  filter:saturate(1.02);
}

.navBtn.is-current{
  cursor:default;
  color:var(--room-nav-current-text);
  background:
    radial-gradient(circle at 22% 22%, rgba(255,255,255,.62), transparent 42%),
    radial-gradient(circle at 80% 80%, rgba(190,151,126,.26), transparent 50%),
    linear-gradient(180deg, rgba(246,235,222,.94) 0%, var(--room-nav-current-bg) 100%);
  border-color:var(--room-nav-current-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.68),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.13),
    0 0 0 calc(2px * var(--s)) rgba(255,253,248,.46);
  filter:none;
}

.navLabel{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.82),
    0 0 calc(8px * var(--s)) rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{ transform:translateY(calc(4px * var(--s))) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(calc(-5px * var(--s))) rotate(6deg) scale(1); opacity:.76; }
}
@keyframes navFloatB{
  0%,100%{ transform:translateY(calc(5px * var(--s))) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(calc(-6px * var(--s))) rotate(-7deg) scale(1); opacity:.68; }
}
@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(calc(6px * var(--s))) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(calc(-6px * var(--s))) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:not(.is-current):hover .navEffectA,
.navBtn:not(.is-current):focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectB,
.navBtn:not(.is-current):focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectC,
.navBtn:not(.is-current):focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}
.navBtn.is-current .navEffect{display:none;}

.navBtn[data-room="hall"] .navEffect{color:rgba(255,205,96,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.95),0 0 calc(10px * var(--s)) rgba(255,215,105,.62);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="honor"] .navEffect{color:rgba(205,143,45,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.92),0 0 calc(8px * var(--s)) rgba(255,220,130,.52);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}

.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}

.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}

.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}

.identityNamePart{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  line-height:1;
  white-space:nowrap;
  font:inherit;
}

.identityNickname{transform:translateY(var(--identity-name-y));}
.identitySeparator{
  margin:0 .08em;
  color:rgba(111,87,70,.78);
  font-weight:800;
  transform:translateY(var(--identity-separator-y));
}
.identityRole{transform:translateY(var(--identity-role-y));}

.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}

.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:950;
  text-align:left;
}

.identityNoticePanel.show{display:block;}

.identityNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
  margin-bottom:calc(10px * var(--s));
}

.identityNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}

.templateMainPanel{
  position:absolute;
  left:8.8%;
  top:22.2%;
  width:60.8%;
  height:58.5%;
  z-index:20;
  border-radius:calc(24px * var(--ui-scale));
  background:rgba(255,250,240,.58);
  border:calc(1px * var(--ui-scale)) dashed rgba(170,122,82,.24);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:calc(12px * var(--ui-scale));
  color:#8a6544;
  font-weight:900;
  font-size:calc(18px * var(--ui-scale));
  text-align:center;
  padding:calc(20px * var(--ui-scale));
}

.templateMainPanel p{
  margin:0;
  max-width:calc(620px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  line-height:1.7;
  font-weight:800;
  color:#9a7656;
}


@media(max-width:540px){
  html,body{
    overflow-x:hidden;
    overflow-y:auto;
    height:auto;
    min-height:100%;
  }

  #room{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    height:auto;
    display:block;
    overflow:visible;
    padding:10px 12px 14px;
    background:
      linear-gradient(rgba(242,236,229,.74), rgba(238,231,222,.92)),
      #e7dfd4;
  }

  #bgFrame{display:none;}

  #overlay{
    position:relative;
    left:auto!important;
    top:auto!important;
    width:100%!important;
    height:auto!important;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:0!important;
    padding:0!important;
    overflow:visible;
    pointer-events:auto;
  }

  .roomNavLayer{
    position:relative;
    inset:auto;
    width:100%;
    height:106px;
    min-height:106px;
    max-height:106px;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(3,32px);
    gap:5px;
    margin:0!important;
    padding:0!important;
    align-content:start;
    order:0;
    z-index:20;
    pointer-events:auto;
    --s:1;
  }

  .roomNavLayer .navBtn{
    position:relative;
    left:auto!important;
    top:auto!important;
    display:flex!important;
    align-items:center;
    justify-content:center;
    width:100%;
    height:32px;
    min-width:0;
    min-height:32px;
    max-height:32px;
    margin:0!important;
    padding:0!important;
    border-radius:10px;
    font-size:12px;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
  }

  .roomNavLayer .navBtn.is-current{
    display:flex!important;
    visibility:visible!important;
  }

  .roomNavLayer .navLabel{
    height:100%;
    padding-top:.04em;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
  }

  .roomNavLayer .navEffect{display:none;}

  .roomIdentity{
    --s:1;
    position:relative;
    right:auto;
    top:auto;
    width:100%;
    min-width:0;
    height:40px;
    min-height:40px;
    order:1;
    z-index:90;
  }

  .roomIdentityBar{
    grid-template-columns:minmax(0,1fr) 34px 42px;
    gap:6px;
    padding:5px 7px;
    border-radius:14px;
  }

  .identityNameBox{
    padding:0 9px;
    border-radius:10px;
    overflow:visible;
  }

function normalizeTextValue(value){
  return String(value ?? "").trim();
}

function showPageError(message, detail = ""){
  let panel = document.getElementById("pageError");
  if(!panel){
    panel = document.createElement("div");
    panel.id = "pageError";
    document.body.appendChild(panel);
  }
  panel.textContent = detail ? `${message}\n${detail}` : message;
  panel.classList.add("show");
}

function fail(message, detail = ""){
  showPageError(message, detail);
  throw new Error(detail ? `${message} ${detail}` : message);
}

function text(key){
  const value = pageTexts.get(key);
  if(!normalizeTextValue(value)){
    const message = pageTexts.get("error.page_text_missing") || "Page text config missing";
    fail(message, `page_key=${PAGE_KEY}, text_key=${key}`);
  }
  return String(value);
}

async function loadPageTexts(){
  const { data, error } = await client
    .from("room10_page_texts")
    .select("text_key,text_value")
    .eq("page_key", PAGE_KEY)
    .eq("is_active", true);

  if(error){
    showPageError("Page text read failed", error.message || "room10_page_texts query failed");
    throw error;
  }

  pageTexts = new Map();
  (Array.isArray(data) ? data : []).forEach(row => {
    const key = normalizeTextValue(row.text_key);
    if(key) pageTexts.set(key, String(row.text_value ?? ""));
  });

  const missingKeys = REQUIRED_TEXT_KEYS.filter(key => !normalizeTextValue(pageTexts.get(key)));
  if(missingKeys.length){
    const message = pageTexts.get("error.page_text_missing") || "Page text config missing";
    showPageError(message, missingKeys.join("、"));
    throw new Error(`${message}：${missingKeys.join(", ")}`);
  }

  pageTextReady = true;
}

function applyPageTexts(){
  document.title = text("page.title");

  document.querySelectorAll("[data-text-key]").forEach(el => {
    el.textContent = text(el.dataset.textKey);
  });

  document.querySelectorAll("[data-text-attr-key]").forEach(el => {
    const raw = el.dataset.textAttrKey || "";
    const parts = raw.split(":");
    const attr = parts.shift();
    const key = parts.join(":");
    if(attr && key) el.setAttribute(attr, text(key));
  });
}

function getRoom10Page(pageKey){
  const key = String(pageKey || "").trim();
  const page = window.room10Page ? window.room10Page(key) : "";
  if(!normalizeTextValue(page) && pageTextReady){
    fail(text("error.path_missing"), key);
  }
  return page || "";
}

}

function isMobileLayout(){

function clearDesktopOverlayStyles(){
  if(!overlay) return;
  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";
  root.style.setProperty("--ui-scale", "1");

  root.style.setProperty("--identity-scale", "1");
}

function syncOverlayToImage(){
  if(isMobileLayout()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.45, Math.min(3.2, displayWidth / 1440));
  const navScale = Math.max(0.38, Math.min(3.2, displayWidth / 1440));
  root.style.setProperty("--ui-scale", String(scale));
  root.style.setProperty("--room-nav-scale", String(navScale));
  root.style.setProperty("--identity-scale", String(scale));
}

  const memberId = localStorage.getItem(STORAGE_KEYS.memberId) || "";

  if(loggedIn && nickname){
    return { nickname, role: role || "member", member_id: memberId, member_code: memberCode };
  }

  try{
    const raw = localStorage.getItem("room10_user") || localStorage.getItem("room10_current_user") || localStorage.getItem("currentUser");

    const data = JSON.parse(raw);
    if(!data) return null;

      member_id: data.member_id || data.id || "",
      member_code: data.member_code || data.memberCode || ""
    };

  }

  const loggedIn = isLoggedIn();

  const page = getRoom10Page(targetPage);
  if(!page) return;

  if(needLogin && !loggedIn){

  if(room === "dorm" && role === "applying"){
    enterManagerRoom();
    return;

  if((room === "flower" || room === "pets") && !loggedIn){
    window.location.href = `${page}?mode=guest`;

    if(isCurrent){
      btn.setAttribute("aria-current", "page");
      btn.setAttribute("tabindex", "-1");
    }else{
      btn.removeAttribute("aria-current");
      btn.removeAttribute("tabindex");
    }

    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      if(btn.classList.contains("is-current")) return;
      if(btn.dataset.manager === "true"){
        enterManagerRoom();

      }
      enterRoom(btn.dataset.page, btn.dataset.login === "true", btn.dataset.room);

  const safeTop = Math.max(8, Math.round(rect.bottom + gap));
  const top = Math.min(safeTop, Math.max(58, viewportHeight - 120));
  root.style.setProperty("--identity-notice-mobile-top", `${top}px`);
}

async function getCurrentMemberRecord(){
  const storedUser = getStoredUser();
  const memberId = normalizeTextValue(storedUser?.member_id || localStorage.getItem(STORAGE_KEYS.memberId));
  const nickname = normalizeTextValue(getCurrentUser());

  if(!memberId && !nickname) return null;

  let result = null;

  if(memberId){
    result = await client
      .from("members")
      .select("id,nickname,role,member_code")
      .eq("id", memberId)
      .maybeSingle();

    if(result.error){
      console.error("Read current member by id failed:", result.error);
    }
  }

  if((!result || !result.data) && nickname){
    result = await client
      .from("members")
      .select("id,nickname,role,member_code")
      .eq("nickname", nickname)
      .maybeSingle();

    if(result.error){
      console.error("Read current member by nickname failed:", result.error);
      return null;
    }
  }

  const data = result?.data || null;
  if(data){
    localStorage.setItem(STORAGE_KEYS.loggedIn, "true");
    localStorage.setItem(STORAGE_KEYS.user, data.nickname || "");
    localStorage.setItem(STORAGE_KEYS.role, data.role || "");
    localStorage.setItem(STORAGE_KEYS.memberId, data.id || "");
    localStorage.setItem(STORAGE_KEYS.memberCode, data.member_code || "");
  }

  return data;
}

function getIdentityApplicationType(role = getRole()){
  const normalizedRole = normalizeTextValue(role).toLowerCase();
  if(normalizedRole === "trainee") return "member_upgrade";
  return "admin";
}

function getApplyTextKey(baseKey, role = getRole()){
  const normalizedRole = normalizeTextValue(role).toLowerCase();
  if(normalizedRole === "trainee"){
    const traineeKey = `${baseKey}.trainee`;
    if(normalizeTextValue(pageTexts.get(traineeKey))){
      return traineeKey;
    }
  }
  return baseKey;
}

async function getLatestAdminApplication(memberId, applicationType = "admin"){
  if(!memberId) return null;

  const memberCode = getCurrentMemberCode();
  if(!memberCode) return null;

  const result = await client.rpc("get_identity_application_status", {
    p_member_id:memberId,
    p_member_code:memberCode,
    p_application_type:applicationType
  });

  if(result.error){
    console.error("Read identity application status failed:", result.error);
    return null;
  }

  const data = result.data || {};
  if(!data.success || data.status === "none") return null;

  return {
    id:data.application_id,
    member_id:memberId,
    nickname:data.nickname || getCurrentUser(),
    status:data.status,
    application_type:data.application_type || applicationType,
    created_at:data.created_at || null,
    updated_at:data.updated_at || null
  };
}

async function getPendingAdminApplication(memberId, applicationType = "admin"){
  const latest = await getLatestAdminApplication(memberId, applicationType);
  return latest && latest.status === "pending" ? latest : null;
}

function updateManagerApplyCopyByRole(role = getRole()){
  const normalizedRole = normalizeTextValue(role).toLowerCase();
  const isTrainee = normalizedRole === "trainee";

  const isSimpleApplyView = normalizedRole === "member" || isTrainee;

  if(pageMainPanel){
    pageMainPanel.classList.toggle("is-simple-apply-view", isSimpleApplyView);
    pageMainPanel.classList.toggle("is-trainee-view", isTrainee);
  }

  if(upgradeKeyIcon){
    upgradeKeyIcon.textContent = isTrainee ? "🔑" : "✎";
  }

  const roleTextKey = (baseKey) => {
    if(isTrainee && normalizeTextValue(pageTexts.get(`${baseKey}.trainee`))){
      return `${baseKey}.trainee`;
    }
    return baseKey;
  };

  const setBySelector = (selector, baseKey) => {
    const el = document.querySelector(selector);
    if(el) el.textContent = text(roleTextKey(baseKey));
  };

  setBySelector(".section-title", "main.title");
  setBySelector(".brief-title", "brief.title");
  setBySelector(".brief-text", "brief.desc");
  setBySelector('.brief-list li[data-text-key="brief.rule_1"]', "brief.rule_1");
  setBySelector('.brief-list li[data-text-key="brief.rule_2"]', "brief.rule_2");
  setBySelector('.brief-list li[data-text-key="brief.rule_3"]', "brief.rule_3");

  if(managerApplyBoxTitle){
    managerApplyBoxTitle.textContent = text(roleTextKey("apply.box_title"));
  }

  if(managerApplyDesc){
    const descText = text(roleTextKey("apply.desc"));
    if(isSimpleApplyView){
      const lines = descText.split(/\n+/).map(line => normalizeTextValue(line)).filter(Boolean);
      managerApplyDesc.innerHTML = lines.map(line => {
        const parts = line.split("：");
        if(parts.length >= 2){
          const label = parts.shift();
          const value = parts.join("：");
          return `<span class="upgrade-info-line"><span class="upgrade-info-label">${escapeHtml(label)}</span><b class="upgrade-info-value">${escapeHtml(value)}</b></span>`;
        }
        return `<span class="upgrade-info-line"><span class="upgrade-info-label">${escapeHtml(line)}</span></span>`;
      }).join("");
    }else{
      managerApplyDesc.textContent = descText;
    }
  }

  if(briefSign){
    briefSign.textContent = text(roleTextKey("brief.sign"));
  }
}

function setManagerApplyButtons({ applyDisabled = false, applyText = text("apply.submit_button"), cancelDisabled = true, cancelHidden = cancelDisabled } = {}){
  managerApplyBtn.disabled = applyDisabled;
  managerApplyBtn.textContent = applyText;
  managerApplyBtn.style.opacity = applyDisabled ? ".72" : "1";
  managerApplyBtn.style.cursor = applyDisabled ? "not-allowed" : "pointer";

  managerCancelBtn.textContent = text("apply.cancel_button");
  managerCancelBtn.disabled = cancelDisabled;
  managerCancelBtn.style.display = cancelHidden ? "none" : "inline-flex";
  managerCancelBtn.style.opacity = cancelDisabled ? ".55" : "1";
  managerCancelBtn.style.cursor = cancelDisabled ? "not-allowed" : "pointer";
}

async function refreshManagerApplyUIFromDB(){
  const role = getRole();
  const isTrainee = role === "trainee";
  updateStatusUserUI();
  updateManagerApplyCopyByRole(role);

  if(role !== "member" && !isTrainee){
    setManagerApplyButtons({ applyDisabled:true, applyText:text("apply.blocked_button"), cancelDisabled:true });
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = text("apply.hint.role_blocked");
    return;
  }

  const member = await getCurrentMemberRecord();
  if(!member){
    setManagerApplyButtons({ applyDisabled:false, applyText:text(getApplyTextKey("apply.submit_button", role)), cancelDisabled:true });
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = text("apply.hint.no_member");
    return;
  }

  rememberPreviousRoleForIdentityTransition(member, role);

  const applicationType = getIdentityApplicationType(role);
  const data = await getLatestAdminApplication(member.id, applicationType);

  if(!data || data.status === "cancelled" || data.status === "rejected"){
    if(applicationType === "admin"){
      clearPendingAdminApplicationIdentityWatch(member);
    }
    setManagerApplyButtons({
      applyDisabled:false,
      applyText:text(getApplyTextKey("apply.submit_button", role)),
      cancelDisabled:true
    });
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = data?.status === "rejected" ? text("apply.hint.rejected") : text(getApplyTextKey("apply.hint.ready", role));
    return;
  }

  if(data.status === "pending"){
    if(applicationType === "admin" && role === "member"){
      watchPendingAdminApplicationForIdentityTransition(member, data);
    }
    setManagerApplyButtons({
      applyDisabled:true,
      applyText:text(getApplyTextKey("apply.submitted_button", role)),
      cancelDisabled:isTrainee
    });
    managerApplyHint.style.color = "#5f7d3a";
    managerApplyHint.textContent = text(getApplyTextKey("apply.hint.pending", role));
    return;
  }

  if(data.status === "approved"){
    if(applicationType === "admin" && role === "member"){
      watchPendingAdminApplicationForIdentityTransition(member, data);
    }
    setManagerApplyButtons({
      applyDisabled:true,
      applyText:text(getApplyTextKey("apply.approved_button", role)),
      cancelDisabled:true
    });
    managerApplyHint.style.color = "#5f7d3a";
    managerApplyHint.textContent = text(getApplyTextKey("apply.hint.approved", role));
  }
}

async function submitManagerApplication(){
  const role = getRole();
  const nickname = getCurrentUser();

  if(role !== "member" && role !== "trainee"){
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = text("apply.hint.not_member_submit");
    return;
  }

  if(!nickname){
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = text("apply.hint.no_login");
    return;
  }

  managerApplyHint.style.color = "#8b5b34";
  managerApplyHint.textContent = text("apply.hint.submitting");

  try{
    const member = await getCurrentMemberRecord();
    if(!member){
      managerApplyHint.textContent = text("apply.hint.submit_no_member");
      return;
    }

    const applicationType = getIdentityApplicationType(role);
    const result = await client.rpc("submit_identity_application", {
      p_member_id:member.id,
      p_member_code:member.member_code,
      p_application_type:applicationType
    });

    if(result.error){
      console.error("Identity application submit RPC failed:", result.error);
      managerApplyHint.textContent = text("apply.hint.submit_failed");
      return;
    }

    const data = result.data || {};
    if(!data.success){
      managerApplyHint.style.color = "#8b5b34";
      managerApplyHint.textContent = data.message || text("apply.hint.submit_failed");
      return;
    }

    await refreshManagerApplyUIFromDB();
    managerApplyHint.style.color = "#5f7d3a";

    if(data.status === "pending"){
      managerApplyHint.textContent = text(getApplyTextKey("apply.hint.submit_success", role));
      return;
    }

    if(data.status === "approved"){
      managerApplyHint.textContent = text(getApplyTextKey("apply.hint.submit_already_approved", role));
      return;
    }

    managerApplyHint.textContent = data.message || text(getApplyTextKey("apply.hint.submit_success", role));
  }catch(err){
    console.error("submitManagerApplication error:", err);
    managerApplyHint.textContent = text("apply.hint.submit_failed");
  }
}

async function cancelManagerApplication(){
  const role = getRole();
  const nickname = getCurrentUser();

  if(role === "trainee"){
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = "";
    return;
  }

  if(role !== "member"){
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = text("apply.hint.not_member_cancel");
    return;
  }

  if(!nickname){
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = text("apply.hint.no_login");
    return;
  }

  managerApplyHint.style.color = "#8b5b34";
  managerApplyHint.textContent = text("apply.hint.cancelling");

  try{
    const member = await getCurrentMemberRecord();
    if(!member){
      managerApplyHint.textContent = text("apply.hint.cancel_no_member");
      return;
    }

    const applicationType = getIdentityApplicationType(role);
    const result = await client.rpc("cancel_identity_application", {
      p_member_id:member.id,
      p_member_code:member.member_code,
      p_application_type:applicationType
    });

    if(result.error){
      console.error("Identity application cancel RPC failed:", result.error);
      managerApplyHint.textContent = text("apply.hint.cancel_failed_permission");
      return;
    }

    const data = result.data || {};
    if(!data.success){
      managerApplyHint.style.color = "#8b5b34";
      managerApplyHint.textContent = data.message || text("apply.hint.cancel_failed");
      await refreshManagerApplyUIFromDB();
      return;
    }

    await refreshManagerApplyUIFromDB();
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = data.message || text("apply.hint.cancel_success");
  }catch(err){
    console.error("cancelManagerApplication error:", err);
    managerApplyHint.textContent = text("apply.hint.cancel_failed");
  }
}

async function ensureMemberPage(){
  if(!isLoggedIn()){
    const page = getRoom10Page("managerVisitor");
    if(page) window.location.href = page;
    return;
  }

  await getCurrentMemberRecord();
  const role = getRole();

  if(role === "owner" || role === "admin"){
    const page = getRoom10Page(getManagerPageKeyByRole(role));
    if(page) window.location.href = page;
    return;
  }

  if(role !== "member" && role !== "trainee" && role !== "applying"){
    const page = getRoom10Page("managerVisitor");
    if(page) window.location.href = page;
    return;
  }

  updateStatusUserUI();
  await refreshManagerApplyUIFromDB();
}

function refreshTemplateLayout(){
  syncOverlayToImage();
  if(identityNoticePanel && (identityNoticePanel.classList.contains("show") || !isMobileLayout())){
    positionIdentityNoticePanel();
  }
}

async function initManagerMemberPage(){
  await loadPageTexts();
  applyPageTexts();

  const managerBg = getRoom10Asset("manager.roomManager");
  if(managerBg){
    img.src = managerBg;
  }

  setupRoomNav(CURRENT_ROOM);
  renderSiteNoticeList([]);
  managerApplyBtn.addEventListener("click", submitManagerApplication);
  managerCancelBtn.addEventListener("click", cancelManagerApplication);

  identityNoticeBtn.addEventListener("click", event => {
    event.stopPropagation();
    const willShow = !identityNoticePanel.classList.contains("show");
    if(willShow){
      positionIdentityNoticePanel();
      identityNoticePanel.classList.add("show");
    }else{
      identityNoticePanel.classList.remove("show");
    }
  });

  identityAuthBtn.addEventListener("click", event => {
    event.stopPropagation();
    if(isLoggedIn()){
      logout();
      return;
    }
    openLogin(getRoom10Page("managerMember"));
  });

  document.addEventListener("click", event => {
    if(identityNoticePanel.contains(event.target) || identityNoticeBtn.contains(event.target)) return;
    identityNoticePanel.classList.remove("show");
  });

  await ensureMemberPage();

  if(img && img.complete && img.naturalWidth){
    syncOverlayToImage();
  }else if(img){
    img.addEventListener("load", syncOverlayToImage, { once:true });
  }

  setTimeout(syncOverlayToImage, 80);
}

window.addEventListener("resize", refreshTemplateLayout);
window.addEventListener("orientationchange", () => setTimeout(refreshTemplateLayout, 80));
if(document.fonts?.ready){
  document.fonts.ready.then(refreshTemplateLayout);
}

window.addEventListener("storage", async event => {
  if([
    "room10LoggedIn",
    "room10User",
    "room10Role",
    "room10MemberId",
    "room10MemberCode",
    "room10_user",
    "room10_current_user",
    "currentUser"
  ].includes(event.key)){
    await ensureMemberPage();
  }
});

initManagerMemberPage().catch(err => {
  console.error("managerMember init failed:", err);
});

</script>
