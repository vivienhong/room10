function unwrapDbCandidate(c){
  if(!c)return null;
  if(typeof c.rpc==="function")return c;
  const nested=[c.client,c.supabase,c.db,c.supabaseClient,c.room10Supabase,c.instance];
  return nested.find(x=>x&&typeof x.rpc==="function")||null;
}
function getExistingDbClient(){
  const list=[
    window.room10Supabase,window.supabaseClient,window.SUPABASE_CLIENT,window.db,window.room10Db,window.ROOM10_DB_CLIENT,
    window.ROOM10_SUPABASE_CLIENT,window.ROOM10_SUPABASE,window.ROOM10_DB,window.room10Database,window.Room10DB,window.Room10Supabase
  ];
  for(const c of list){const got=unwrapDbCandidate(c);if(got)return got;}

}

  const key=cfg.anonKey||cfg.supabaseAnonKey||cfg.SUPABASE_ANON_KEY||cfg.SUPABASE_KEY||window.ROOM10_SUPABASE_ANON_KEY||window.SUPABASE_ANON_KEY||window.supabaseAnonKey;
  if(url&&key&&window.supabase&&typeof window.supabase.createClient==="function"){

async function getDbClientAsync(){

function findUuidDeep(value,depth=0){if(depth>4||value==null)return"";if(typeof value==="string"){if(isUuid(value))return value;try{return findUuidDeep(JSON.parse(value),depth+1)||"";}catch(_){const m=value.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);return m?m[0]:"";}}if(typeof value==="object"){const priority=["member_id","memberId","memberID","id","user_id","userId","auth_user_id","authUserId"];for(const k of priority){if(isUuid(value[k]))return value[k];}for(const k of Object.keys(value)){const got=findUuidDeep(value[k],depth+1);if(got)return got;}}return"";}

function requireMemberId(){const id=getCurrentMemberId();if(!id)throw new Error("请先登录，或确认本地登录信息中包含成员 ID。当前页面无法调用需要 p_member_id 的宠物数据库函数。");return id;}
async function callRpc(name,args){
  const client=await getDbClientAsync();
  if(!client){
    throw new Error("数据库未连接：Supabase CDN 或客户端初始化失败，请确认网络能加载 @supabase/supabase-js。");
  }
  const res=await client.rpc(name,args||{});
  if(res&&res.error)throw new Error(res.error.message||"数据库读取失败");
  return res?res.data:null;
}

async function ensurePetInteractionConfigs(p){
  const speciesKey=speciesKeyForPet(p);
  if(!speciesKey||speciesKey==="petunknown")return;
  if(petInteractionConfigSpecies===speciesKey&&Object.keys(petInteractionConfigs).length)return;
  if(petInteractionConfigLoading)return petInteractionConfigLoading;
  setPetInteractionConfigError("");
  petInteractionConfigLoading=(async()=>{
    try{
      const rows=await callRpc(RPC.interactionConfigs,{p_species_key:speciesKey});
      const next={};
      (Array.isArray(rows)?rows:[]).forEach(row=>{if(row&&row.variant_key)next[row.variant_key]=row;});
      petInteractionConfigs=next;
      petInteractionConfigSpecies=speciesKey;
      if(!Object.keys(next).length)setPetInteractionConfigError(`互动配置缺失：${speciesKey}`);
    }catch(err){
      petInteractionConfigs={};
      petInteractionConfigSpecies=speciesKey;
      setPetInteractionConfigError(`互动配置读取失败：${err.message||"数据库返回错误"}`);
      console.warn("宠物互动配置读取失败：",err);
    }finally{
      petInteractionConfigLoading=null;
    }
  })();
  return petInteractionConfigLoading;
}

function setDailyGiftTextFromReward(reward, already=false){const box=document.getElementById("dailyGiftText");if(reward&&reward.item_name){lastDailyGift={item_key:reward.item_key,item_name:reward.item_name,quantity:reward.quantity||1};}if(box)box.textContent="";if(careState)renderSupplies();}
async function autoClaimDailyGift(){if(autoGiftRunning||!readLoggedIn())return;const memberId=requireMemberId();const key=`room10PetDailyGiftAuto:${memberId}:${todayKey()}`;if(sessionStorage.getItem(key)==="done")return;autoGiftRunning=true;try{const data=await callRpc(RPC.dailyGift,{p_member_id:memberId});sessionStorage.setItem(key,"done");const reward=data?.reward||{};if(data?.success){setDailyGiftTextFromReward(reward,false);await loadCareState({skipAutoGift:true,skipDecay:true});}else{setDailyGiftTextFromReward(reward,true);}}catch(err){sessionStorage.setItem(key,"done");}finally{autoGiftRunning=false;}}
async function loadCareState(options={}){try{const memberId=requireMemberId();if(!options.skipDecay)await maybeRunDecay();const data=await callRpc(RPC.careState,{p_member_id:memberId});careItems=data?.items||{};const pets=Array.isArray(data?.pets)?data.pets:[];carePets=pets.map(normalizeCarePet);if(!carePets.length){careState=null;setCareMessage("这里还没有小动物在等你。先去领养页收集图片卡，集齐后再来领养吧。");if(!options.skipAutoGift)await autoClaimDailyGift();return;}selectedCareAdoptionId=selectedCareAdoptionId||carePets[0].id;careState=carePets.find(p=>String(p.id)===String(selectedCareAdoptionId))||carePets[0];selectedCareAdoptionId=careState.id;await ensurePetInteractionConfigs(careState);renderCare();if(!options.skipAutoGift)await autoClaimDailyGift();}catch(err){careState=null;carePets=[];setCareMessage(err.message||"数据库读取失败。");}}

function setMode(mode){activeMode=mode;const isAdopt=mode==="adopt";document.getElementById("modeAdoptBtn").classList.toggle("is-current",isAdopt);document.getElementById("modeCareBtn").classList.toggle("is-current",!isAdopt);document.getElementById("petShell").classList.toggle("is-active",isAdopt);document.getElementById("adoptView").classList.toggle("is-active",isAdopt);document.getElementById("careView").classList.toggle("is-active",!isAdopt);document.getElementById("petModeTitle").textContent="图片卡";document.getElementById("petModeSub").textContent="";if(isAdopt) loadAdoptionState(); else loadCareState();}
function openGachaPopup(){const mask=document.getElementById("gachaMask");const frame=document.getElementById("gachaFrame");if(frame){const base=room10PageUrl("gameGacha","game/gacha/gacha.html");const guest=!readLoggedIn();const query=`petModal=1&fresh=${Date.now()}${guest?"&mode=guest":""}`;frame.src=`${base}${base.includes("?")?"&":"?"}${query}`;}mask.classList.add("show");mask.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";}
function closeGachaPopup(){const mask=document.getElementById("gachaMask");mask.classList.remove("show");mask.setAttribute("aria-hidden","true");document.body.style.overflow="";}
function goGacha(){openGachaPopup();}
function openAdoptNameDialog(p){pendingAdoptPet=p;document.getElementById("nameTitle").textContent=`领养 ${p.name}`;document.getElementById("nameDesc").textContent="请为它取一个名字。";document.getElementById("nameInput").value="";document.getElementById("nameMask").classList.add("show");document.getElementById("nameMask").setAttribute("aria-hidden","false");setTimeout(()=>document.getElementById("nameInput").focus(),30);}
function closeAdoptNameDialog(){pendingAdoptPet=null;document.getElementById("nameMask").classList.remove("show");document.getElementById("nameMask").setAttribute("aria-hidden","true");}
async function confirmAdoption(){const p=pendingAdoptPet;if(!p)return;const name=document.getElementById("nameInput").value.trim();if(!name){showRewardModal({icon:"🐾",label:"需要取名",title:"请先输入名字",desc:"领养时需要为宠物取一个名字。"});return;}try{const memberId=requireMemberId();await callRpc(RPC.adopt,{p_member_id:memberId,p_pet_no:p.id,p_custom_name:name});closeAdoptNameDialog();showRewardModal({type:"gift",icon:"🐾",label:"领养成功",title:`${name} 来到十号房啦`,desc:"领养记录已经写入数据库。"});await loadAdoptionState();}catch(err){showRewardModal({icon:"⚠️",label:"领养失败",title:"无法领养",desc:err.message||"数据库操作失败。"});}}
async function upgradePet(p){try{const memberId=requireMemberId();await callRpc(RPC.upgrade,{p_member_id:memberId,p_pet_no:p.id});showRewardModal({icon:"⬆️",label:"升级成功",title:"升级已记录",desc:"宠物升级已写入数据库。"});await loadAdoptionState();}catch(err){showRewardModal({icon:"⚠️",label:"升级失败",title:"无法升级",desc:err.message||"数据库操作失败。"});}}
function animatePet(action){if(!careState)return;const variant=careActionVariant(action);renderCarePetScene(variant,{animate:true});careActionReturnTimer=setTimeout(()=>{if(careState)renderCarePetScene(careBaseVariant(careState));},1800);}
function isCareActionOverflow(action){if(!careState)return false;if(action==="clean")return numberOrZero(careState.clean)>=100;if(action==="feed_snack"||action==="feed_can"||action==="feed_dry")return numberOrZero(careState.hunger)>=100;return false;}
function careActionFullMessage(action){if(action==="clean")return "清洁度已经满了，现在使用清洁道具会溢出，先不用啦。";if(action==="feed_snack")return "饱食度已经满了，现在喂零食会溢出，先不用啦。";if(action==="feed_can")return "饱食度已经满了，现在喂罐头会溢出，先不用啦。";if(action==="feed_dry")return "饱食度已经满了，现在喂干粮会溢出，先不用啦。";return "宠物当前状态已经满了，暂时不需要使用道具。";}
async function doCareAction(action){const notice=document.getElementById("careSpeechText");if(!careState?.id){if(notice)notice.textContent="这里还没有小动物在等你。先去领养页收集图片卡，集齐后再来领养吧。";return;}const variant=careActionVariant(action);const cfg=getPetInteractionConfig(variant);const validationMessage=validatePetInteractionConfig(cfg,variant);if(validationMessage){renderPetFallbackNotice(validationMessage);if(notice)notice.textContent=validationMessage;return;}if(isCareActionOverflow(action)){if(notice)notice.textContent=careActionFullMessage(action);return;}try{const memberId=requireMemberId();const data=await callRpc(RPC.careAction,{p_member_id:memberId,p_adoption_id:careState.id,p_action_type:action});await loadCareState({skipAutoGift:true,skipDecay:true});animatePet(action);const pet=data?.pet||{};if(notice)notice.textContent=pet.status||data?.message||"宠物状态已更新。";}catch(err){if(notice)notice.textContent=err.message||"数据库操作失败。";}}
async function claimDailyGift(){try{const memberId=requireMemberId();const data=await callRpc(RPC.dailyGift,{p_member_id:memberId});const reward=data?.reward||{};setDailyGiftTextFromReward(reward,!data?.success);await loadCareState({skipAutoGift:true,skipDecay:true});animatePet("happy");}catch(err){const notice=document.getElementById("careSpeechText");if(notice)notice.textContent=err.message||"数据库操作失败。";}}
function normalizeRewardItem(item){if(typeof item==="string")return {name:item,amount:"",unit:"",icon:"✨",img:""};return {name:item.name||"奖励",amount:item.amount??item.qty??"",unit:item.unit||"",icon:item.icon||"✨",img:item.img||""};}
function renderRewards(rewards){const list=document.getElementById("rewardList"),title=document.getElementById("rewardSectionTitle");list.innerHTML="";list.className="reward-list";title.className="reward-section-title";if(!rewards.length){list.classList.add("empty");title.classList.add("empty");return;}list.classList.add(`count-${Math.min(rewards.length,3)}`);rewards.forEach(r=>{const item=document.createElement("div");item.className="reward-item";const iconHtml=r.img?`<img class="reward-item-img" src="${escapeHtml(r.img)}" alt="">`:`<div class="reward-item-icon">${escapeHtml(r.icon)}</div>`;item.innerHTML=`${iconHtml}<div class="reward-item-name">${escapeHtml(r.name)}</div><div class="reward-item-amount">${escapeHtml(r.amount!==""?`+${r.amount}${r.unit||""}`:"")}</div>`;list.appendChild(item);});}
function showRewardModal(options={}){document.getElementById("rewardIcon").textContent=options.icon||"✨";document.getElementById("rewardLabel").textContent=options.label||"提示";document.getElementById("rewardTitle").textContent=options.title||"完成";const descEl=document.getElementById("rewardDesc");const desc=options.desc===undefined?"操作已完成。":String(options.desc||"");descEl.textContent=desc;descEl.classList.toggle("empty",!desc);renderRewards(Array.isArray(options.rewards)?options.rewards.map(normalizeRewardItem):[]);if(options.hideSectionTitle){document.getElementById("rewardSectionTitle")?.classList.add("empty");}const mask=document.getElementById("rewardMask");mask.classList.add("show");mask.style.display="flex";mask.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";}
function closeRewardModal(){const mask=document.getElementById("rewardMask");mask.classList.remove("show");mask.style.display="";mask.setAttribute("aria-hidden","true");document.body.style.overflow="";}
function hydrateActionIcons(){document.querySelectorAll("[data-item-icon]").forEach(el=>{const url=room10AssetUrl(el.dataset.itemIcon,"");if(url)el.innerHTML=`<img src="${escapeHtml(url)}" alt="">`;});}

window.addEventListener("resize",syncOverlayToImage);if(img){img.addEventListener("load",syncOverlayToImage);}document.addEventListener("DOMContentLoaded",()=>{setIdentityState();setupRoomNav();syncOverlayToImage();hydrateActionIcons();document.getElementById("identityNoticeBtn").addEventListener("click",()=>document.getElementById("identityNoticePanel").classList.toggle("show"));document.getElementById("identityAuthBtn").addEventListener("click",()=>{if(readLoggedIn()){localStorage.setItem(STORAGE_KEYS.loggedIn,"false");[STORAGE_KEYS.user,STORAGE_KEYS.role,STORAGE_KEYS.memberId,STORAGE_KEYS.memberCode,"room10_user","room10_current_user","currentUser","room10ApplicantSession","room10ApplicationDraft"].forEach(k=>localStorage.removeItem(k));sessionStorage.clear();adoptionPets=[];carePets=[];careState=null;selectedCareAdoptionId=null;lastDailyGift=null;const frame=document.getElementById("gachaFrame");if(frame)frame.src="about:blank";closeGachaPopup();setIdentityState();setMode("adopt");}else{window.location.href=room10PageUrl("index","index/index.html");}});document.getElementById("modeAdoptBtn").addEventListener("click",()=>setMode("adopt"));document.getElementById("modeCareBtn").addEventListener("click",()=>setMode("care"));document.getElementById("goGachaBtn").addEventListener("click",goGacha);document.getElementById("gachaCloseBtn").addEventListener("click",closeGachaPopup);document.getElementById("gachaMask").addEventListener("click",e=>{if(e.target.id==="gachaMask")closeGachaPopup();});document.getElementById("refreshBtn").addEventListener("click",()=>activeMode==="adopt"?loadAdoptionState():loadCareState({skipAutoGift:true}));document.getElementById("adoptMainBtn").addEventListener("click",()=>{const p=adoptionPets.find(x=>x.id===selectedPetId);const action=document.getElementById("adoptMainBtn").dataset.action;if(action==="gacha")goGacha();else if(action==="adopt"&&p)openAdoptNameDialog(p);else if(action==="upgrade"&&p)upgradePet(p);});document.getElementById("nameCancelBtn").addEventListener("click",closeAdoptNameDialog);document.getElementById("nameConfirmBtn").addEventListener("click",confirmAdoption);document.getElementById("nameMask").addEventListener("click",e=>{if(e.target.id==="nameMask")closeAdoptNameDialog();});document.querySelectorAll("[data-care-action]").forEach(btn=>btn.addEventListener("click",()=>doCareAction(btn.dataset.careAction)));{const dailyBtn=document.getElementById("dailyGiftBtn");if(dailyBtn)dailyBtn.addEventListener("click",claimDailyGift);}document.getElementById("rewardMask").addEventListener("click",e=>{if(e.target.id==="rewardMask")closeRewardModal();});document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeRewardModal();closeAdoptNameDialog();closeGachaPopup();}});setMode("adopt");});
</script>
</body>
