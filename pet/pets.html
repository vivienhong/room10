function findUuidDeep(value,depth=0){if(depth>4||value==null)return"";if(typeof value==="string"){if(isUuid(value))return value;try{return findUuidDeep(JSON.parse(value),depth+1)||"";}catch(_){const m=value.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);return m?m[0]:"";}}if(typeof value==="object"){const priority=["member_id","memberId","memberID","id","user_id","userId","auth_user_id","authUserId"];for(const k of priority){if(isUuid(value[k]))return value[k];}for(const k of Object.keys(value)){const got=findUuidDeep(value[k],depth+1);if(got)return got;}}return"";}

async function callRpc(name,args){

  const owned=numberOrZero(row.card_quantity??row.owned_fragments??row.owned_cards);

  const discovered=bool(row.is_unlocked)||owned>0;
  const active=bool(row.is_adopted)||!!row.active_adoption_id;

    id,
    pet_no:id,

    pet_code:row.pet_code||meta.pet_code||"",
    cardItemKey:row.card_item_key||`pet_card_${id}`,

  if(type==="gacha"){
    const gachaLabels={
      white_reward:"扭蛋机 · 普通扭蛋",
      white_stored_ball_open:"扭蛋机 · 普通扭蛋",
      purple_reward:"扭蛋机 · 紫金扭蛋",
      purple_stored_ball_open:"扭蛋机 · 紫金扭蛋",
      gold_reward:"扭蛋机 · 黄金扭蛋",

    };
    return gachaLabels[detailKey]||"宠物扭蛋机";
  }

  if(type==="honor_achievement_reward")return detail?`成就奖励 · ${detail}`:"荣誉墙成就奖励";
  if(type==="honor_title_reward")return detail?`称号奖励 · ${detail}`:"荣誉墙称号奖励";
  if(type==="holiday_gift"||type==="holiday_reward")return detail?`节日礼包 · ${detail}`:"节日礼包";
  if(type==="pet_daily_gift")return "宠物每日小礼";

  if(detail&&/[\u3400-\u9fff]/u.test(detail))return detail;

function petCardSourceNote(row,label){
  const note=String(row?.note||"").trim();
  const detail=String(row?.source_detail||"").trim();
  const internalDetails=new Set([
    "white_reward","white_stored_ball_open",
    "purple_reward","purple_stored_ball_open",
    "gold_reward","gold_stored_ball_open"
  ]);
  const internalPhrases=new Set([
    "打开普通未打开扭蛋",
    "打开紫金未打开扭蛋",
    "打开黄金未打开扭蛋"
  ]);
  const candidates=[note,detail].filter(Boolean);
  return candidates.find(value=>{
    const key=String(value).trim().toLowerCase();
    return value!==label
      && !/^pet_card_\d+$/i.test(value)
      && !internalDetails.has(key)
      && !internalPhrases.has(value);
  })||"图片卡入账";
}
function renderPetCardSourceHistory(payload,p){
  const list=document.getElementById("adoptSourceList");
  const summaryEl=document.getElementById("adoptSourceSummary");
  if(!list||!summaryEl)return;

  const rows=Array.isArray(payload?.records)?payload.records:[];
  const current=numberOrZero(payload?.current_quantity??p?.owned);
  const total=numberOrZero(payload?.total_received);
  summaryEl.textContent=`当前 ${current} 张 · 历史获得 ${total} 张`;

  if(!rows.length){
    list.innerHTML='<div class="adoptSourceEmpty">暂未找到这张图片卡的获取流水。</div>';
    return;
  }

  list.innerHTML=rows.map(row=>{
    const label=petCardSourceLabel(row);
    const note=petCardSourceNote(row,label);
    const time=formatPetSourceTime(row.created_at);
    const quantity=Math.max(1,numberOrZero(row.quantity));
    return `<article class="adoptSourceItem">
      <div class="adoptSourceMain"><span>${escapeHtml(label)}</span><span class="adoptSourceQty">+${quantity} 张</span></div>
      <div class="adoptSourceMeta"><span class="adoptSourceNote">${escapeHtml(note||"图片卡入账")}</span><time class="adoptSourceTime">${escapeHtml(time)}</time></div>
    </article>`;
  }).join("");

async function loadPetCardSourceHistory(p,options={}){
  if(!p||!p.discovered)return;
  if(isGuestView()){
    setAdoptSourceMessage("登录后可查看自己的图片卡获取来源。");
    return;
  }

  const petNo=Number(p.id);
  if(!Number.isInteger(petNo)||petNo<=0){
    setAdoptSourceMessage("图片卡编号无效，无法读取获取来源。");
    return;
  }

  const cacheKey=String(petNo);
  if(options.force!==true&&petCardSourceCache.has(cacheKey)){
    renderPetCardSourceHistory(petCardSourceCache.get(cacheKey),p);
    return;
  }

  const requestToken=++petCardSourceRequestToken;
  setAdoptSourceMessage("正在读取获取来源…");
  try{
    const identity=getPetIdentityRpcParams();
    const data=await callRpc(RPC.cardSources,{...identity,p_pet_no:petNo});
    if(requestToken!==petCardSourceRequestToken||Number(selectedPetId)!==petNo)return;
    if(!data||typeof data!=="object"||data.success!==true){
      throw new Error(data?.message||"获取来源读取失败。");
    }
    petCardSourceCache.set(cacheKey,data);
    renderPetCardSourceHistory(data,p);
  }catch(err){
    if(requestToken!==petCardSourceRequestToken||Number(selectedPetId)!==petNo)return;
    console.error("图片卡获取来源读取失败：",err);
    setAdoptSourceMessage(err?.message||"获取来源读取失败，请稍后重试。");
  }
}

async function loadAdoptionState(){
  document.getElementById("adoptGrid").innerHTML=`<div class="petMessage" style="grid-column:1/-1;">${escapeHtml(t("adopt.loading"))}</div>`;
  try{
    await loadPetTypeImages();

    // 游客只读取公开宠物基础资料，不调用带成员 ID 的个人领养状态 RPC。
    // 即使浏览器 localStorage 里残留旧成员 UUID，也不能显示任何人的碎片数量。
    if(isGuestView()){
      adoptionPets=buildGuestAdoptionPets();
      selectedPetId=adoptionPets.some(p=>p.id===selectedPetId)?selectedPetId:(adoptionPets[0]?.id||null);
      renderAdoptionGrid();
      {
        const selectedPet=adoptionPets.find(p=>p.id===selectedPetId);
        renderAdoptDetail(selectedPet);
        void loadPetCardSourceHistory(selectedPet);
      }
      return;
    }

    const identityParams=getPetIdentityRpcParams();
    const data=await callRpc(RPC.adoptionState,identityParams);
    if(!data||typeof data!=="object")throw new Error("宠物领养状态读取失败：接口没有返回有效数据。");
    if(data.success!==true)throw new Error(data.message||"宠物领养状态读取失败，请重新登录后再试。");
    const rows=Array.isArray(data.pets)?data.pets:[];
    adoptionPets=rows.map(normalizePet).filter(p=>Number.isFinite(p.id));
    selectedPetId=adoptionPets.some(p=>p.id===selectedPetId)?selectedPetId:(adoptionPets[0]?.id||null);
    renderAdoptionGrid();
    {
      const selectedPet=adoptionPets.find(p=>p.id===selectedPetId);
      renderAdoptDetail(selectedPet);
      void loadPetCardSourceHistory(selectedPet,{force:true});
    }
  }catch(err){
    adoptionPets=[];
    selectedPetId=null;
    renderAdoptionMessage(err.message||t("adopt.error.read_failed"));
  }
}

async function ensurePetInteractionConfigs(p){

  if(petInteractionConfigLoading)return petInteractionConfigLoading;
  setPetInteractionConfigError("");
  petInteractionConfigLoading=(async()=>{
    try{
      const rows=await callRpc(RPC.interactionConfigs,{p_species_key:speciesKey});

      (Array.isArray(rows)?rows:[]).forEach(row=>{if(row&&row.variant_key)next[row.variant_key]=row;});

function renderCareLog(){

  const totalRows=[];
  if(careState?.status)totalRows.push({text:careState.status,time:formatCareLogTime(careState.updated_at)});
  if(numberOrZero(careState?.feed_count)>0)totalRows.push({text:`累计喂食 ${numberOrZero(careState.feed_count)} 次`,time:"🍽"});
  if(numberOrZero(careState?.clean_count)>0)totalRows.push({text:`累计清洁 ${numberOrZero(careState.clean_count)} 次`,time:"🧼"});
  if(numberOrZero(careState?.play_count)>0)totalRows.push({text:`累计玩耍 ${numberOrZero(careState.play_count)} 次`,time:"🎾"});

  const totalHtml=totalRows.map(x=>`<div class="logItem"><span>${escapeHtml(x.text)}</span><span class="logTime">${escapeHtml(x.time)}</span></div>`).join("");

async function loadCareState(options={}){
  try{
    const identityParams=getPetIdentityRpcParams();
    await loadPetTypeImages();
    if(!options.skipDecay)await maybeRunDecay();
    const data=await callRpc(RPC.careState,identityParams);
    if(!data||typeof data!=="object")throw new Error("宠物抚养状态读取失败：接口没有返回有效数据。");
    if(data.success!==true)throw new Error(data.message||"宠物抚养状态读取失败，请重新登录后再试。");
    careItems=data.items||{};
    const pets=Array.isArray(data.pets)?data.pets:[];
    carePets=pets.map(normalizeCarePet);
    if(!carePets.length){
      careState=null;
      careTodayLogs=[];
      setCareMessage(t("care.no_pet.speech"));
      if(!options.skipAutoGift)await autoClaimDailyGift();
      return;
    }
    selectedCareAdoptionId=selectedCareAdoptionId||carePets[0].id;
    careState=carePets.find(p=>String(p.id)===String(selectedCareAdoptionId))||carePets[0];
    selectedCareAdoptionId=careState.id;
    await ensurePetInteractionConfigs(careState);
    hydrateCareActionButtonsFromConfigs();
    await loadTodayCareLogs(careState.id);
    renderCare();
    if(!options.skipAutoGift)await autoClaimDailyGift();
  }catch(err){
    careState=null;
    carePets=[];
    careTodayLogs=[];
    setCareMessage(err.message||t("care.read_error"));
  }
}

async function doCareAction(action){
  const notice=document.getElementById("careSpeechText");
  if(careActionBusy)return;
  if(!careState?.id){setCareMessage(t("care.action.no_pet"));return;}
  const variant=careActionVariant(action);
  const cfg=getPetInteractionConfig(variant);
  const validationMessage=validatePetInteractionConfig(cfg,variant);
  if(validationMessage){renderPetFallbackNotice(validationMessage);if(notice)notice.textContent=validationMessage;return;}
  if(isCareActionOverflow(action)){if(notice)notice.textContent=careActionFullMessage(action);return;}
  setCareActionButtonsLocked(true);
  try{
    const memberId=requireMemberId();
    const data=await callRpc(RPC.careAction,{p_member_id:memberId,p_adoption_id:careState.id,p_action_type:action});
    if(data?.success===false){
      if(notice)notice.textContent=data?.message||t("care.action.db_error");
      return;
    }
    const changes=(data?.actual_changes&&typeof data.actual_changes==="object")?data.actual_changes:{};
    await loadCareState({skipAutoGift:true,skipDecay:true});
    const pet=data?.pet||{};
    if(notice)notice.textContent=pet.status||data?.message||t("care.action.updated");
    await animatePet(action,changes);
  }catch(err){
    if(notice)notice.textContent=err.message||t("care.action.db_error");
  }finally{
    setCareActionButtonsLocked(false);
  }
}
