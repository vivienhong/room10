<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜项目委托</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  *{box-sizing:border-box;}

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(circle at top left, color-mix(in srgb, #e5ddd1 82%, white 18%) 0%, transparent 36%),
      radial-gradient(circle at top right, color-mix(in srgb, #e1d7ca 80%, white 20%) 0%, transparent 38%),
      linear-gradient(180deg,#e7dfd4 0%, #e2d8cb 52%, #ddd4c8 100%);
  }

  body{
    display:flex;
    justify-content:center;
    align-items:center;
  }

  #room{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:#e7dfd4;
  }

  #bgFrame{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:none;
  }

  #bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center center;
    display:block;
    user-select:none;
    pointer-events:none;
    -webkit-user-drag:none;
  }

  #overlay{
    position:absolute;
    inset:0;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
    --ui-scale:1;
    --overlay-ui-scale:var(--ui-scale);
    --project-panel-scale:var(--ui-scale);
    --project-radius-lg:calc(30px * var(--ui-scale));
    --project-radius-md:calc(20px * var(--ui-scale));
    --project-radius-sm:calc(14px * var(--ui-scale));
    --project-gap-xs:calc(5px * var(--ui-scale));
    --project-gap-sm:calc(8px * var(--ui-scale));
    --project-gap-md:calc(12px * var(--ui-scale));
    --project-gap-lg:calc(16px * var(--ui-scale));
    --project-pad-xs:calc(8px * var(--ui-scale));
    --project-pad-sm:calc(10px * var(--ui-scale));
    --project-pad-md:calc(12px * var(--ui-scale));
    --project-pad-lg:calc(14px * var(--ui-scale));
    --project-pad-xl:calc(18px * var(--ui-scale));
    --project-font-xs:calc(10px * var(--ui-scale));
    --project-font-sm:calc(11px * var(--ui-scale));
    --project-font-md:calc(12px * var(--ui-scale));
    --project-font-base:calc(13px * var(--ui-scale));
    --project-font-lg:calc(15px * var(--ui-scale));
    --project-font-xl:calc(18px * var(--ui-scale));
    --project-font-hero:calc(20px * var(--ui-scale));
    --project-btn-h:calc(40px * var(--ui-scale));
  }

  #overlay *{
    pointer-events:auto;
  }

  
#taskPanel{
    --task-panel-left:9.2%;
    --task-panel-top:18%;
    --task-panel-right:22.4%;
    --task-panel-bottom:12%;

    position:absolute;
    left:var(--task-panel-left);
    right:var(--task-panel-right);
    top:var(--task-panel-top);
    bottom:var(--task-panel-bottom);
    transform:none;
    transform-origin:top left;
    width:auto;
    height:auto;
    min-width:0;
    min-height:0;
    border-radius:var(--project-radius-lg);
    background:rgba(255,255,255,0.34);
    border:1px solid rgba(255,255,255,0.52);
    box-shadow:
      0 16px 42px rgba(122,96,68,0.10),
      inset 0 1px 0 rgba(255,255,255,0.62),
      inset 0 -1px 0 rgba(255,255,255,0.20);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    overflow:visible;
  }

  @media (min-width:1600px){
    #taskPanel{
      --task-panel-left:9.1%;
    }
  }

  #taskPanel::before{
    content:"";
    position:absolute;
    inset:calc(10px * var(--ui-scale));
    border-radius:calc(22px * var(--ui-scale));
    border:1px solid rgba(255,255,255,0.22);
    pointer-events:none;
  }

  .panelView{
    position:absolute;
    inset:0;
    padding:0;
  }

  #signupView{
    position:absolute;
    inset:0;
    padding:0;
  }

  #signupPanelInner{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    display:block;
  }

  #signupDetailPane{
    padding:calc(18px * var(--ui-scale)) calc(20px * var(--ui-scale)) calc(16px * var(--ui-scale));
    width:100%;
    height:100%;
    min-width:0;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  #signupHeader{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:calc(10px * var(--ui-scale));
  }

  #signupTitle{
    color:#6f4726;
    font-size:var(--project-font-hero);
    font-weight:800;
    line-height:1.15;
  }

  #signupStatus{
    flex:0 0 auto;
    padding:5px 10px;
    border-radius:999px;
    background:rgba(255,252,247,0.52);
    color:#7a5231;
    font-size:var(--project-font-md);
    font-weight:700;
    white-space:nowrap;
  }

  #signupBody{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    padding-right:2px;
    scrollbar-width:thin;
    scrollbar-color:rgba(175,135,98,0.55) transparent;
  }

  #signupBody::-webkit-scrollbar{
    width:8px;
  }
  #signupBody::-webkit-scrollbar-track{
    background:transparent;
  }
  #signupBody::-webkit-scrollbar-thumb{
    background:rgba(175,135,98,0.55);
    border-radius:999px;
  }

  .signupSection{
    margin-bottom:calc(10px * var(--ui-scale));
  }

  .signupSectionTitle{
    color:#744a28;
    font-size:var(--project-font-lg);
    font-weight:800;
    margin:0 0 calc(7px * var(--ui-scale));
  }

  .sectionTitleRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:0 0 calc(7px * var(--ui-scale));
  }

  .sectionTitleRow .signupSectionTitle{
    margin:0;
  }

  .sectionTitleActions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
  }

  .roleToolBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    min-width:88px;
    height:30px;
    padding:0 12px;
    border-radius:10px;
    background:rgba(255,252,247,0.72);
    color:#744b25;
    font-size:var(--project-font-sm);
    font-weight:800;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.78),
      0 2px 6px rgba(116,86,54,0.06);
    transition:transform .18s ease, filter .18s ease, background .18s ease, color .18s ease;
    white-space:nowrap;
  }

  .roleToolBtn:hover{
    transform:translateY(-1px);
    filter:brightness(1.03);
  }

  .roleToolBtn.active{
    background:linear-gradient(180deg,#d9a364 0%, #c98c4f 100%);
    color:#fff9f1;
  }

  .roleToolBtn[hidden],
  .lotteryHintText[hidden]{
    display:none !important;
  }

  .lotteryHintText{
    color:#8a6644;
    font-size:var(--project-font-sm);
    font-weight:700;
    line-height:1.35;
  }

  .rowGridFour{
    display:grid;
    grid-template-columns:0.85fr 1.7fr 0.9fr 0.9fr;
    gap:calc(10px * var(--ui-scale));
    align-items:start;
    margin-bottom:calc(10px * var(--ui-scale));
  }

  .producerReleaseRow{
    display:grid;
    grid-template-columns:1.45fr 0.9fr;
    gap:calc(10px * var(--ui-scale));
    align-items:start;
    margin-bottom:calc(10px * var(--ui-scale));
  }

  .colCard{
    padding:calc(9px * var(--ui-scale)) calc(12px * var(--ui-scale));
    border-radius:12px;
    background:rgba(255,252,247,0.34);
    border:1px solid rgba(255,255,255,0.34);
    min-height:calc(66px * var(--ui-scale));
  }

  .colLabel{
    color:#8a6644;
    font-size:var(--project-font-sm);
    font-weight:700;
    margin-bottom:calc(5px * var(--ui-scale));
  }

  .colValue{
    color:#5f3b1d;
    font-size:var(--project-font-lg);
    font-weight:800;
  }

  .signupInput,
  .signupNumber,
  .signupDate,
  .assignInput,
  .originalInput{
    width:100%;
    border:none;
    outline:none;
    border-radius:10px;
    padding:calc(9px * var(--ui-scale)) calc(12px * var(--ui-scale));
    background:rgba(255,252,247,0.68);
    color:#5f3b1d;
    font-size:var(--project-font-base);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7);
  }

  .signupNumber[readonly]{
    cursor:default;
    opacity:1;
  }

  .typeBtnGroup{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:6px;
    margin-bottom:calc(10px * var(--ui-scale));
  }

  .typeBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    height:calc(36px * var(--ui-scale));
    border-radius:10px;
    background:rgba(255,252,247,0.56);
    color:#744b25;
    font-size:var(--project-font-base);
    font-weight:700;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.75),
      0 2px 6px rgba(116,86,54,0.06);
    transition:transform .18s ease, filter .18s ease, background .18s ease;
  }

  .typeBtn:hover{
    transform:translateY(-1px);
    filter:brightness(1.03);
  }

  .typeBtn.active{
    background:linear-gradient(180deg,#d9a364 0%, #c98c4f 100%);
    color:#fff9f1;
  }

  .memberPickerWrap{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:calc(9px * var(--ui-scale)) calc(12px * var(--ui-scale));
    border-radius:12px;
    background:rgba(255,252,247,0.34);
    border:1px solid rgba(255,255,255,0.34);
    margin-bottom:calc(10px * var(--ui-scale));
  }

  .memberPickerLabel{
    color:#7a5231;
    font-size:var(--project-font-sm);
    font-weight:700;
  }

  .memberGrid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }

  .memberBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    min-width:56px;
    height:calc(31px * var(--ui-scale));
    padding:0 10px;
    border-radius:10px;
    background:rgba(255,252,247,0.62);
    color:#6a4120;
    font-size:var(--project-font-base);
    font-weight:700;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.78),
      0 2px 6px rgba(116,86,54,0.06);
    transition:transform .18s ease, filter .18s ease, background .18s ease;
  }

  .memberBtn:hover{
    transform:translateY(-1px);
    filter:brightness(1.03);
  }

  .memberBtn.active{
    background:linear-gradient(180deg,#d9a364 0%, #c98c4f 100%);
    color:#fff9f1;
  }

  .memberEmpty{
    color:#92745a;
    font-size:11px;
    line-height:1.5;
    padding:2px 0;
  }

  .originalRoleBoard{
    border-radius:14px;
    background:rgba(255,252,247,0.34);
    border:1px solid rgba(255,255,255,0.34);
    overflow:hidden;
    margin-bottom:calc(10px * var(--ui-scale));
  }

  .originalRoleHeader,
  .originalRoleRow{
    display:grid;
    grid-template-columns:1fr 1.15fr 64px;
    gap:8px;
    align-items:center;
    padding:calc(9px * var(--ui-scale)) calc(12px * var(--ui-scale));
  }

  .originalRoleHeader{
    background:rgba(255,248,240,0.5);
    border-bottom:1px solid rgba(255,255,255,0.34);
  }

  .originalRoleHeader .headerCell{
    color:#7b5735;
    font-size:11px;
    font-weight:800;
  }

  .originalRoleRow + .originalRoleRow{
    border-top:1px solid rgba(255,255,255,0.22);
  }

  .rowActionBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    height:calc(31px * var(--ui-scale));
    border-radius:9px;
    background:rgba(255,252,247,0.62);
    color:#744b25;
    font-size:var(--project-font-sm);
    font-weight:700;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.78),
      0 2px 6px rgba(116,86,54,0.06);
  }

  .rowActionBtn:hover{
    transform:translateY(-1px);
  }

  .rewardGrid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
    margin-bottom:calc(10px * var(--ui-scale));
  }

  .rewardCard{
    padding:calc(9px * var(--ui-scale)) calc(12px * var(--ui-scale));
    border-radius:12px;
    background:rgba(255,252,247,0.34);
    border:1px solid rgba(255,255,255,0.34);
  }

  .rewardLabel{
    color:#8a6644;
    font-size:var(--project-font-sm);
    font-weight:700;
    margin-bottom:4px;
  }

  .rewardValue{
    color:#5f3b1d;
    font-size:var(--project-font-lg);
    font-weight:800;
    line-height:1.45;
  }

  .rewardHint{
    display:block;
    margin-top:2px;
    color:#8a6644;
    font-size:11px;
    font-weight:600;
    line-height:1.5;
  }

  #signupFooter{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    margin-top:8px;
  }

  .signupActionBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    min-width:98px;
    height:calc(38px * var(--ui-scale));
    padding:0 14px;
    border-radius:12px;
    background:linear-gradient(180deg, #efd5ab 0%, #dfbd8a 100%);
    color:#6a4120;
    font-size:var(--project-font-base);
    font-weight:800;
    box-shadow:
      inset 0 1px 0 rgba(255,247,230,0.95),
      0 4px 12px rgba(112,83,52,0.10);
    transition:transform .18s ease, filter .18s ease, opacity .18s ease;
  }

  .signupActionBtn:hover{
    transform:translateY(-1px);
    filter:brightness(1.03);
  }

  .signupActionBtn:disabled{
    cursor:not-allowed;
    opacity:.72;
    transform:none;
  }

  .signupActionGhost{
    background:rgba(255,252,247,0.52);
    color:#744d2b;
  }

  #toastMask{
    position:fixed;
    inset:0;
    background:rgba(60,42,23,0.18);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
  }

  #toastMask.show{
    display:flex;
  }

  #toastBox{
    width:min(420px, 92vw);
    border-radius:22px;
    background:rgba(255,249,241,0.95);
    border:1px solid rgba(203,167,123,0.28);
    box-shadow:
      0 18px 45px rgba(85,58,34,0.18),
      inset 0 1px 0 rgba(255,255,255,0.92);
    padding:22px 20px 18px;
    text-align:center;
  }

  #toastTitle{
    color:#6f4726;
    font-size:19px;
    font-weight:800;
    margin-bottom:10px;
  }

  #toastMessage{
    color:#6a4525;
    font-size:var(--project-font-base);
    line-height:1.75;
    white-space:pre-line;
    word-break:break-word;
    margin-bottom:14px;
  }

  #toastCloseBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    min-width:100px;
    height:38px;
    padding:0 16px;
    border-radius:12px;
    background:linear-gradient(180deg, #efd5ab 0%, #dfbd8a 100%);
    color:#6a4120;
    font-size:var(--project-font-base);
    font-weight:800;
    box-shadow:
      inset 0 1px 0 rgba(255,247,230,0.95),
      0 4px 12px rgba(112,83,52,0.10);
  }




/* =========================================================
   通用模板同步：房间按钮 / 身份组件 / 工作间页面切换
   项目委托页不接入成就称号奖励弹窗
========================================================= */
:root{
  --bg-ui-scale:1;
  --ui-scale:var(--bg-ui-scale);
  --room-nav-scale:var(--ui-scale);
  --identity-scale:var(--ui-scale);
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);
  --identity-name-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;
  --room-nav-top:6.35%;
  --room-nav-start-left:25.83%;
  --room-nav-btn-width:4.72%;
  --room-nav-btn-height:5.10%;
  --room-nav-gap:0.486%;
  --room-nav-hall-left:var(--room-nav-start-left);
  --room-nav-living-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 1);
  --room-nav-manager-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 2);
  --room-nav-honor-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 3);
  --room-nav-studio-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 4);
  --room-nav-game-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 5);
  --room-nav-dorm-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 6);
  --room-nav-flower-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 7);
  --room-nav-pets-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 8);
  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);
}
.hidden{display:none !important;}
#overlay{
  z-index:2;
  overflow:visible !important;
  --ui-scale:var(--bg-ui-scale,1);
  --overlay-ui-scale:var(--bg-ui-scale,1);
  --project-panel-scale:var(--bg-ui-scale,1);
}
#overlay .roomNavLayer,#overlay .roomIdentity{pointer-events:none !important;}
#overlay .roomNavLayer .navBtn,
#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{pointer-events:auto !important;}

.roomNavLayer{position:absolute;inset:0;z-index:55;pointer-events:none;--s:var(--room-nav-scale,1);--nav-btn-radius:calc(15px * var(--s));--nav-btn-font:calc(15px * var(--s));--nav-btn-border:calc(1px * var(--s));}

  function createRow(initial = {}) {
    return {
      id: initial.id || `r${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      original: String(initial.original || ""),
      assignedSingerId: String(initial.assignedSingerId || ""),

    };

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function showToast(title, message) {
    toastTitle.textContent = title || "提示";
    toastMessage.textContent = message || "";
    toastMask.classList.add("show");
    toastMask.setAttribute("aria-hidden", "false");
  }

  function closeToast() {
    toastMask.classList.remove("show");
    toastMask.setAttribute("aria-hidden", "true");
  }

  toastCloseBtn.addEventListener("click", closeToast);
  toastMask.addEventListener("click", (e) => {
    if (e.target === toastMask) closeToast();
  });

  function splitGold(totalGold) {
    const total = Math.max(0, Math.floor(Number(totalGold) || 0));
    const submit = Math.floor(total * TASK_PAYOUT.onSubmitRatio);
    const publish = total - submit;
    return { total, submit, publish };
  }

  function isSingerQuotaBlank() {
    return String(singerQuotaInput?.value ?? "").trim() === "";
  }

  function normalizeSingerCount(value, fallback = 1) {
    const raw = String(value ?? "").trim();
    if (!raw) return fallback;
    const num = Math.floor(Number(raw));
    if (!Number.isFinite(num)) return fallback;
    return Math.min(99, Math.max(1, num));
  }

  function getSingerQuota(options = {}) {
    const shouldWrite = options.write !== false;
    const normalized = normalizeSingerCount(singerQuotaInput.value, 1);
    if (shouldWrite && String(normalized) !== String(singerQuotaInput.value)) {
      singerQuotaInput.value = String(normalized);
    }
    return normalized;
  }

  function getSingerRewardByCount(singerCount) {
    const count = normalizeSingerCount(singerCount);

    if (SINGING_REWARD_TABLE[count] != null) {
      return SINGING_REWARD_TABLE[count];
    }

    return Math.max(12, Math.floor(17 - 0.5 * (count - 17)));
  }

  function getTaskModeBonus() {
    return selectedTaskMode === "special" ? 10 : 0;
  }

  function getSingerReward(taskType, singerQuota) {
    return getSingerRewardByCount(singerQuota) + getTaskModeBonus();
  }

  function getProducerReward(taskType, singerQuota) {
    const count = normalizeSingerCount(singerQuota);

    if (taskType === "游戏") return 0;

    return Math.min(48 + Math.min(count - 1, 12), 60) + getTaskModeBonus();
  }

  function updateRewardPreview() {
    const previewQuota = getSingerQuota({ write:false });
    const singerTotal = getSingerReward(selectedType, previewQuota);
    const producerTotal = getProducerReward(selectedType, previewQuota);

    const singerSplit = splitGold(singerTotal);
    const producerSplit = splitGold(producerTotal);

    singerRewardValueEl.innerHTML = singerSplit.total > 0
      ? `${singerSplit.total} 金币<span class="rewardHint">交音 ${singerSplit.submit} / 发布 ${singerSplit.publish}</span>`
      : `0 金币`;

    producerRewardValueEl.innerHTML = producerSplit.total > 0
      ? `${producerSplit.total} 金币<span class="rewardHint">交音 ${producerSplit.submit} / 发布 ${producerSplit.publish}</span>`
      : `0 金币`;
  }

  function isLoggedIn() {
    return localStorage.getItem(STORAGE_KEYS.loggedIn) === "true";
  }

  function getCurrentRole() {
    const role = String(localStorage.getItem(STORAGE_KEYS.role) || "visitor").toLowerCase();
    return ["owner", "admin", "member", "visitor", "applying"].includes(role) ? role : "visitor";
  }


  function getCurrentMemberName() {
    return String(authState.nickname || localStorage.getItem(STORAGE_KEYS.user) || "").trim();
  }

  function getCurrentRoleLabel(roleValue = authState.role) {
    const role = String(roleValue || "").toLowerCase();
    if (role === "owner") return "维修工";
    if (role === "admin") return "宿管";
    if (role === "member") return "房客";
    if (role === "applying") return "申请中";
    return "参观者";
  }

  function canAccessStudioSubmit(roleValue = authState.role) {
    return ALLOWED_STUDIO_SUBMIT_ROLES.has(String(roleValue || '').toLowerCase());
  }

  function updateTopBarIdentity() {
    if (!currentUserText) return;
    const nickname = getCurrentMemberName();
    const roleLabel = getCurrentRoleLabel();

    if (!authState.loggedIn || !nickname) {
      currentUserText.textContent = "参观者";
      if (identityAuthBtn) {
        identityAuthBtn.hidden = false;
        identityAuthBtn.classList.remove("hidden");
        identityAuthBtn.querySelector(".identityAuthText").textContent = "登录";
        identityAuthBtn.dataset.action = "login";
      }
    } else {
      currentUserText.textContent = `${nickname} | ${roleLabel}`;
      if (identityAuthBtn) {
        identityAuthBtn.hidden = false;
        identityAuthBtn.classList.remove("hidden");
        identityAuthBtn.querySelector(".identityAuthText").textContent = "登出";
        identityAuthBtn.dataset.action = "logout";
      }
    }

    requestAnimationFrame(fitTopBarIdentityContent);
  }

  function getSiteNotificationItems() {
    return [];
  }

  function renderSiteNotifications() {
    if (!siteNoticeBtn || !siteNoticeBody || !siteNoticeCount) return;
    const items = getSiteNotificationItems();
    const count = items.length;
    siteNoticeBtn.classList.toggle("hasNotice", count > 0);
    siteNoticeCount.textContent = count > 99 ? "99+" : String(count);
    siteNoticeBody.className = count ? "siteNoticeList" : "identityNoticeEmpty siteNoticeEmpty";
    siteNoticeBody.innerHTML = count ? items.join("") : "暂无提醒";
  }

  function toggleSiteNoticePanel(force) {
    if (!siteNoticePanel || !siteNoticeBtn) return;
    const shouldShow = typeof force === "boolean" ? force : !siteNoticePanel.classList.contains("show");
    siteNoticePanel.classList.toggle("show", shouldShow);
    siteNoticePanel.setAttribute("aria-hidden", shouldShow ? "false" : "true");
    siteNoticeBtn.setAttribute("aria-expanded", shouldShow ? "true" : "false");
  }

  async function ensureAuthState() {
    authState.loggedIn = isLoggedIn();
    authState.nickname = String(localStorage.getItem(STORAGE_KEYS.user) || "").trim();
    authState.role = getCurrentRole();
    authState.memberId = localStorage.getItem(STORAGE_KEYS.memberId) || null;

    if (!authState.loggedIn || !authState.nickname || !authState.memberId) {
      handleLogout();
      return false;
    }

    try {
      let verifiedMember = null;

      const directResult = await supabaseClient
        .from("members")
        .select("id, nickname, role")
        .eq("id", authState.memberId)
        .maybeSingle();

      if (!directResult.error && directResult.data) {
        verifiedMember = directResult.data;
      } else {
        const rpcResult = await supabaseClient.rpc("get_member_directory_for_app");
        if (!rpcResult.error && Array.isArray(rpcResult.data)) {
          verifiedMember = rpcResult.data.find(item => String(item.id || "") === String(authState.memberId || "")) || null;
        }
      }

      const verifiedNickname = String(verifiedMember?.nickname || "").trim();
      const verifiedRole = String(verifiedMember?.role || authState.role || "visitor").toLowerCase();

      if (!verifiedMember || !verifiedNickname || verifiedNickname !== authState.nickname) {
        handleLogout();
        return false;
      }

      authState.nickname = verifiedNickname;
      authState.role = ["owner", "admin", "member", "visitor", "applying"].includes(verifiedRole)
        ? verifiedRole
        : authState.role;
      authState.initialized = true;

      localStorage.setItem(STORAGE_KEYS.user, authState.nickname);
      localStorage.setItem(STORAGE_KEYS.role, authState.role);
      localStorage.setItem(STORAGE_KEYS.memberId, String(authState.memberId));

      updateTopBarIdentity();

      if (!canAccessStudioSubmit(authState.role)) {
        handleLogout();
        return false;
      }

      return true;
    } catch (err) {
      console.error("登录状态校验失败：", err);
      handleLogout();
      return false;
    }
  }

  async function loginWithKey(nickname, key) {
    const safeNickname = String(nickname || "").trim();
    const safeKey = String(key || "").trim();

    if (!safeNickname || !safeKey) {
      return { ok: false, message: "请输入昵称和KEY" };
    }

    try {
      const { data, error } = await supabaseClient.rpc("verify_member_login", {
        input_nickname: safeNickname,
        input_code: safeKey
      });

      if (error) {
        console.error("KEY 登录失败：", error);
        return { ok: false, message: error.message || "登录失败，请稍后再试" };
      }

      if (!Array.isArray(data) || !data.length) {
        return { ok: false, message: "昵称或KEY错误" };
      }

      const user = data[0];
      authState.loggedIn = true;
      authState.nickname = String(user.nickname || safeNickname).trim();
      authState.role = String(user.role || "member").toLowerCase();
      authState.memberId = String(user.member_id || "");
      authState.initialized = true;

      localStorage.setItem(STORAGE_KEYS.loggedIn, "true");
      localStorage.setItem(STORAGE_KEYS.user, authState.nickname);
      localStorage.setItem(STORAGE_KEYS.role, authState.role);
      localStorage.setItem(STORAGE_KEYS.memberId, authState.memberId);

      return { ok: true, user };
    } catch (err) {
      console.error("KEY 登录异常：", err);
      return { ok: false, message: err?.message || "登录失败，请稍后再试" };
    }
  }


  window.loginWithKey = loginWithKey;

  function handleLogout() {
    localStorage.removeItem(STORAGE_KEYS.loggedIn);
    localStorage.removeItem(STORAGE_KEYS.user);
    localStorage.removeItem(STORAGE_KEYS.role);
    localStorage.removeItem(STORAGE_KEYS.memberId);
    localStorage.removeItem(STORAGE_KEYS.memberCode);
    window.location.href = "index.html";
  }

  function extractNumberFromValue(value) {
    const str = String(value ?? "");
    const match = str.match(/\d+/);
    return match ? parseInt(match[0], 10) : Number.POSITIVE_INFINITY;
  }

  function getMemberOrderNumber(memberRaw) {
    const candidates = [
      memberRaw.display_order,
      memberRaw.member_order,
      memberRaw.order_no,
      memberRaw.member_no,
      memberRaw.member_number,
      memberRaw.no,
      memberRaw.code,
      memberRaw.member_code,
      memberRaw.invite_code,
      memberRaw.key_code,
      memberRaw.nickname,
      memberRaw.name
    ];

    for (const item of candidates) {
      const num = extractNumberFromValue(item);
      if (Number.isFinite(num)) return num;
    }
    return Number.POSITIVE_INFINITY;
  }

  function normalizeMemberName(memberRaw, index) {
    return memberRaw.nickname || memberRaw.name || `成员${index + 1}`;
  }

  function hasMixSkill(skills) {
    return typeof skills === "string" && skills.replace(/\s/g, "").includes("混音");
  }

  function normalizeMembers(data) {
    return (data || [])
      .map((item, index) => ({
        id: String(item.id ?? index),
        name: normalizeMemberName(item, index),
        nickname: item.nickname || item.name || "",
        skills: item.skills || "",
        orderNumber: getMemberOrderNumber(item)
      }))
      .sort((a, b) => {
        if (a.orderNumber !== b.orderNumber) return a.orderNumber - b.orderNumber;
        return a.name.localeCompare(b.name, "zh-CN");
      });
  }

  function getNextProjectCode() {
    const numbers = tasks
      .map(project => String(project.project_code || "").match(/\d+/))
      .filter(Boolean)
      .map(match => parseInt(match[0], 10))
      .filter(num => Number.isFinite(num) && num > 0)
      .sort((a, b) => a - b);

    if (!numbers.length) return "001";

    const used = new Set(numbers);
    let candidate = 1;
    while (used.has(candidate)) candidate += 1;
    return String(candidate).padStart(3, "0");
  }

  async function loadProjectsFromSupabase() {
    const { data, error } = await supabaseClient
      .from("projects")
      .select("id, project_code, project_name");

    if (error) {
      console.error("读取 projects 失败：", error);
      tasks = [];
      projectAutoCodeEl.textContent = "001";
      return;
    }

    tasks = data || [];
    projectAutoCodeEl.textContent = getNextProjectCode();
  }

  async function loadMembersFromSupabase() {
    try {
      const { data, error } = await supabaseClient.from("members").select("*");
      if (error) {
        console.error("读取 members 失败：", error);
        singerMemberGrid.innerHTML = '<div class="memberEmpty">成员读取失败</div>';
        producerMemberGrid.innerHTML = '<div class="memberEmpty">混音成员读取失败</div>';

      members = normalizeMembers(data || []);
      syncOriginalAssignedNames();
      renderSingerMembers();
      renderProducerMembers();
      renderOriginalRows();
    } catch (err) {
      console.error("Supabase 连接失败：", err);
      singerMemberGrid.innerHTML = '<div class="memberEmpty">数据库连接失败</div>';
      producerMemberGrid.innerHTML = '<div class="memberEmpty">数据库连接失败</div>';
    }
  }

  function getMemberById(memberId) {
    return members.find(item => item.id === memberId) || null;
  }

  function syncOriginalAssignedNames() {
    originalRows = originalRows.map(row => {
      const member = getMemberById(row.assignedSingerId);
      return {
        ...row,
        assignedSingerName: member ? member.name : ""
      };
    });
  }

  function renderSingerMembers() {
    if (!members.length) {
      singerMemberGrid.innerHTML = '<div class="memberEmpty">暂无成员</div>';
      return;
    }

    singerMemberGrid.innerHTML = members.map(member => `
      <button
        type="button"
        class="memberBtn ${selectedSingerIds.includes(member.id) ? "active" : ""}"
        data-member-id="${escapeHtml(member.id)}"
      >
        ${escapeHtml(member.name)}
      </button>
    `).join("");
  }

  function renderProducerMembers() {
    const mixMembers = members.filter(member => hasMixSkill(member.skills));
    if (!mixMembers.length) {
      producerMemberGrid.innerHTML = '<div class="memberEmpty">暂无可选混音成员</div>';
      return;
    }

    if (selectedProducerId && !mixMembers.some(member => member.id === selectedProducerId)) {
      selectedProducerId = "";
    }

    producerMemberGrid.innerHTML = mixMembers.map(member => `
      <button
        type="button"
        class="memberBtn ${selectedProducerId === member.id ? "active" : ""}"
        data-member-id="${escapeHtml(member.id)}"
      >
        ${escapeHtml(member.name)}
      </button>
    `).join("");
  }

  function getAssignableSingerMembers(rowId = "") {
    const usedSingerIds = new Set(getUsedSingerIds(rowId));
    return selectedSingerIds
      .map(memberId => getMemberById(memberId))
      .filter(member => member && (!usedSingerIds.has(member.id) || originalRows.some(row => row.id === rowId && row.assignedSingerId === member.id)));
  }

  function findSingerMemberByText(text, rowId = "") {
    const normalized = String(text || "").trim();
    if (!normalized) return null;
    const exactSelected = getAssignableSingerMembers(rowId).find(member => member.name === normalized || member.nickname === normalized);
    if (exactSelected) return exactSelected;
    return null;
  }

  function buildSingerDatalistOptions(rowId, selectedId) {
    return getAssignableSingerMembers(rowId)
      .map(member => `<option value="${escapeHtml(member.name)}"></option>`)
      .join("");
  }

  function getLyricsLotteryReadyState() {
    const quota = getSingerQuota();
    const rows = originalRows.slice(0, quota);
    const selectedSingerCount = selectedSingerIds.length;
    const allOriginalFilled = rows.length === quota && rows.every(row => String(row.original || "").trim());
    const singersFull = selectedSingerCount === quota;

    return {
      quota,
      selectedSingerCount,
      rowsCount: rows.length,
      singersFull,
      allOriginalFilled,
      ready: singersFull && allOriginalFilled
    };
  }

  function getCurrentSingerMember() {
    const currentMemberId = String(authState.memberId || "").trim();
    if (!currentMemberId) return null;
    if (!selectedSingerIds.includes(currentMemberId)) return null;
    return getMemberById(currentMemberId);
  }

  function getCurrentUserLotteryRow() {
    const currentMemberId = String(authState.memberId || "").trim();
    if (!currentMemberId) return null;
    return originalRows.find(row => String(row.assignedSingerId || "") === currentMemberId) || null;
  }

  function getPendingLotteryRows() {
    const quota = getSingerQuota();
    return originalRows
      .slice(0, quota)
      .filter(row => String(row.original || "").trim() && !String(row.assignedSingerId || "").trim());
  }

  function getLotteryEnabledHintText() {
    const drawnRow = getCurrentUserLotteryRow();
    if (drawnRow && String(drawnRow.original || "").trim()) {
      return `你抽到：${String(drawnRow.original || "").trim()}。提交后，请提醒其他演唱者去待处理页抽签。`;
    }
    return "提交后，请提醒其他演唱者去待处理页抽签。";
  }

  function syncLyricsLotteryButton() {
    if (!enableLyricsLotteryBtn) return;

    const state = getLyricsLotteryReadyState();

    if (!state.ready) {
      lyricsLotteryEnabled = false;
      enableLyricsLotteryBtn.hidden = true;
      enableLyricsLotteryBtn.classList.remove("active");
      enableLyricsLotteryBtn.textContent = "开启抽签";
      if (lyricsLotteryHint) {
        lyricsLotteryHint.hidden = true;
        lyricsLotteryHint.textContent = "";
      }
      return;
    }

    enableLyricsLotteryBtn.hidden = false;
    enableLyricsLotteryBtn.classList.toggle("active", lyricsLotteryEnabled);
    enableLyricsLotteryBtn.textContent = lyricsLotteryEnabled ? "已抽取" : "开启抽签";

    if (lyricsLotteryHint) {
      lyricsLotteryHint.hidden = !lyricsLotteryEnabled;
      lyricsLotteryHint.textContent = lyricsLotteryEnabled ? getLotteryEnabledHintText() : "";
    }
  }

  function handleEnableLyricsLotteryClick() {
    const state = getLyricsLotteryReadyState();

    if (!state.ready) {
      showToast("暂不能开启", "需要先选满演唱者，并补全所有原唱 / 部分名称。");
      syncLyricsLotteryButton();
      syncSubmitToolButtons();
      return;
    }

    const currentSinger = getCurrentSingerMember();
    if (!currentSinger) {
      showToast("暂不能开启", "开启抽签会先抽取填写人本人的部分。请先把当前登录成员加入演唱者，再开启抽签。");
      syncLyricsLotteryButton();
      return;
    }

    let drawnRow = getCurrentUserLotteryRow();

    if (!drawnRow) {
      const pendingRows = getPendingLotteryRows();
      if (!pendingRows.length) {
        showToast("暂不能开启", "当前没有可抽取的空原唱行，请先清空一个分配给本人抽取。");
        syncLyricsLotteryButton();
        return;
      }

      const pickedRow = pendingRows.length === 1
        ? pendingRows[0]
        : pendingRows[Math.floor(Math.random() * pendingRows.length)];

      originalRows = originalRows.map(row => (
        row.id === pickedRow.id
          ? { ...row, assignedSingerId: currentSinger.id, assignedSingerName: currentSinger.name }
          : row
      ));

      drawnRow = originalRows.find(row => row.id === pickedRow.id) || pickedRow;
      syncOriginalAssignedNames();
      renderOriginalRows();
    }

    lyricsLotteryEnabled = true;
    syncLyricsLotteryButton();

    const partName = String(drawnRow.original || "").trim();
    showToast(
      "已开启抽签",
      `你抽到：${partName || "未命名部分"}。
提交任务后，请提醒其他演唱者去待处理页自行抽签。`
    );
  }

  function renderOriginalRows() {
    syncRowsToQuota();
    syncOriginalAssignedNames();

    originalRoleList.innerHTML = originalRows.map((row, index) => `
      <div class="originalRoleRow" data-row-id="${escapeHtml(row.id)}" data-row-index="${index}">
        <input
          class="originalInput"
          type="text"
          data-field="original"
          data-row-index="${index}"
          value="${escapeHtml(row.original)}"
          placeholder="填写原唱名或部分"
        />
        <div>
          <input
            class="originalInput"
            type="text"
            list="assignSingerOptions_${escapeHtml(row.id)}"
            data-field="assignedSingerName"
            data-row-index="${index}"
            value="${escapeHtml(row.assignedSingerName || '')}"
            placeholder="可选择，也可直接填入"
          />
          <datalist id="assignSingerOptions_${escapeHtml(row.id)}">
            ${buildSingerDatalistOptions(row.id, row.assignedSingerId)}
          </datalist>
        </div>
        <button class="rowActionBtn" type="button" data-action="delete">X</button>
      </div>
    `).join("");

    syncLyricsLotteryButton();
    syncSubmitToolButtons();
  }

  function getUsedSingerIds(excludeRowId = "") {
    return Array.from(new Set(
      originalRows
        .filter(row => !excludeRowId || row.id !== excludeRowId)
        .map(row => String(row.assignedSingerId || "").trim())
        .filter(Boolean)
    ));
  }

  function keepAtLeastOneRow() {
    if (!originalRows.length) {
      originalRows = [createRow()];
    }
  }

  function syncRowsToQuota() {
    const quota = getSingerQuota();

    if (originalRows.length > quota) {
      originalRows = originalRows.slice(0, quota);
    }

    while (originalRows.length < quota) {
      originalRows.push(createRow());
    }

    keepAtLeastOneRow();
  }

  function removeSingerFromLyricRows(memberId) {
    const nextRows = [];

    for (const row of originalRows) {
      if (row.assignedSingerId !== memberId) {
        nextRows.push(row);
        continue;
      }

      if (String(row.original || "").trim()) {
        nextRows.push({
          ...row,
          assignedSingerId: "",
          assignedSingerName: ""
        });
      }
    }

    originalRows = nextRows;
    keepAtLeastOneRow();
  }

  function trimRowsToQuota(quota) {
    if (originalRows.length > quota) {
      originalRows = originalRows.slice(0, quota);
    }
    keepAtLeastOneRow();
  }

  function applyQuotaConstraints(showLimitToast = false) {
    const quota = getSingerQuota();

    if (selectedSingerIds.length > quota) {
      const removedIds = selectedSingerIds.slice(quota);
      selectedSingerIds = selectedSingerIds.slice(0, quota);
      removedIds.forEach(memberId => removeSingerFromLyricRows(memberId));
      if (showLimitToast && removedIds.length) {
        showToast("已调整", "演唱人数减少后，已自动移除超出上限的演唱者。");
      }
    }

    trimRowsToQuota(quota);
    syncRowsToQuota();
    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
  }

  function handleSingerMemberToggle(memberId) {
    const exists = selectedSingerIds.includes(memberId);

    if (exists) {
      selectedSingerIds = selectedSingerIds.filter(id => id !== memberId);
      removeSingerFromLyricRows(memberId);
    } else {
      const quota = getSingerQuota();
      if (selectedSingerIds.length >= quota) {
        showToast("超过上限", "当前演唱者数量不能超过演唱人数。");
        return;
      }

      selectedSingerIds.push(memberId);
    }

    syncRowsToQuota();
    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
  }

  function handleProducerMemberToggle(memberId) {
    selectedProducerId = selectedProducerId === memberId ? "" : memberId;
    renderProducerMembers();
  }


  function getWheelReadyState() {
    const quota = getSingerQuota({ write:false });
    const rows = originalRows.slice(0, quota);
    const canUseWheel = selectedType === "游戏" || selectedTaskMode === "special";
    const singersFull = selectedSingerIds.length === quota;
    const allOriginalFilled = rows.length === quota && rows.every(row => String(row.original || "").trim());
    const hasAssignedRows = originalRows.some(row => String(row.assignedSingerId || "").trim());

    let message = "";
    if (!canUseWheel) {
      message = "转盘仅用于游戏类任务或特殊任务。";
    } else if (!singersFull) {
      message = `请先按演唱人数选满演唱者（当前 ${selectedSingerIds.length}/${quota}）。`;
    } else if (!allOriginalFilled) {
      message = "请先补全所有原唱 / 部分名称，再打开转盘。";
    }

    return {
      canUseWheel,
      singersFull,
      allOriginalFilled,
      hasAssignedRows,
      ready: canUseWheel && singersFull && allOriginalFilled,
      message
    };
  }

  function syncSubmitToolButtons() {
    if (!openWheelBtn) return;
    const state = getWheelReadyState();

    openWheelBtn.hidden = !state.canUseWheel;
    openWheelBtn.disabled = !state.ready;
    openWheelBtn.classList.toggle("active", state.ready);
    openWheelBtn.title = state.ready ? "打开转盘分配歌词" : (state.message || "暂不能打开转盘");

    if (clearWheelAssignBtn) {
      clearWheelAssignBtn.hidden = !state.canUseWheel;
      clearWheelAssignBtn.disabled = !state.hasAssignedRows;
      clearWheelAssignBtn.title = state.hasAssignedRows ? "清空歌词分配中的成员" : "当前没有可清空的分配";
    }
  }

  function parseQuickOriginalText(text) {
    return String(text || "")
      .split(/[\n,，]+/)
      .map(item => item.trim())
      .filter(Boolean)
      .map(item => {
        const parts = item.split(/\s*[–—-]\s*/);
        const original = String(parts[0] || "").trim();
        const singerText = parts.length > 1 ? String(parts.slice(1).join("–") || "").trim() : "";
        return { original, singerText };
      })
      .filter(item => item.original);
  }

  function applyQuickOriginalText() {
    const entries = parseQuickOriginalText(quickOriginalInput?.value || "");
    if (!entries.length) {
      showToast("没有内容", "请先粘贴或输入原唱名称。");
      return;
    }

    const currentQuota = getSingerQuota({ write:false });
    if (entries.length > currentQuota) {
      singerQuotaInput.value = String(Math.min(99, entries.length));
    }

    const nextRows = entries.slice(0, 99).map(entry => {
      const matched = findSingerMemberByText(entry.singerText, "");
      return createRow({
        original: entry.original,
        assignedSingerId: matched ? matched.id : "",
        assignedSingerName: matched ? matched.name : ""
      });
    });

    originalRows = nextRows.length ? nextRows : [createRow()];
    syncRowsToQuota();
    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();

    const missed = entries.filter(entry => entry.singerText && !findSingerMemberByText(entry.singerText, "")).length;
    showToast("已填入", missed ? `已填入原唱。${missed} 个演唱者未在已选演唱者中找到，未自动分配。` : "已填入原唱分配。");
  }

  function clearOriginalAssignmentsOnly() {
    originalRows = originalRows.map(row => ({
      ...row,
      assignedSingerId: "",
      assignedSingerName: ""
    }));
    lyricsLotteryEnabled = false;
    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
  }

  function openStudioWheelTool() {
    const state = getWheelReadyState();
    if (!state.ready) {
      showToast("暂不能开启", state.message || "请先补全转盘需要的信息。");
      syncSubmitToolButtons();
      return;
    }

    const payload = {
      source: "studio-Submit",
      type: "room10-wheel-open",
      taskType: selectedType,
      taskMode: selectedTaskMode,
      singerQuota: getSingerQuota({ write:false }),
      singers: selectedSingerIds.map(id => getMemberById(id)).filter(Boolean).map(member => ({
        id: member.id,
        name: member.name
      })),
      rows: originalRows.slice(0, getSingerQuota({ write:false })).map(row => ({
        id: row.id,
        original: row.original,
        assignedSingerId: row.assignedSingerId,
        assignedSingerName: row.assignedSingerName
      }))
    };

    const url = `studio-wheel.html?from=submit&payload=${encodeURIComponent(JSON.stringify(payload))}`;
    window.open(url, "room10StudioWheel", "width=980,height=720,resizable=yes,scrollbars=yes");
  }

  function applyWheelResultToRows(result) {
    const rows = Array.isArray(result?.rows) ? result.rows : Array.isArray(result?.assignments) ? result.assignments : [];
    if (!rows.length) return;

    const nextRows = rows.map(item => {
      const original = String(item.original || item.part || item.role || "").trim();
      const singerText = String(item.assignedSingerName || item.singerName || item.memberName || item.singer || "").trim();
      const matched = item.assignedSingerId
        ? getMemberById(String(item.assignedSingerId))
        : findSingerMemberByText(singerText, "");
      return createRow({
        original,
        assignedSingerId: matched ? matched.id : "",
        assignedSingerName: matched ? matched.name : ""
      });
    }).filter(row => String(row.original || "").trim());

    if (!nextRows.length) return;

    if (nextRows.length > getSingerQuota({ write:false })) {
      singerQuotaInput.value = String(Math.min(99, nextRows.length));
    }

    originalRows = nextRows;
    lyricsLotteryEnabled = false;
    syncRowsToQuota();
    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
    showToast("已写入", "转盘结果已写回歌词分配。");
  }

  function resetSignupForm() {
    songNameInput.value = "";
    singerQuotaInput.value = "1";
    projectToneInput.value = "";
    releaseDateInput.value = "";
    selectedType = "披4";
    selectedTaskMode = "normal";
    selectedSingerIds = [];
    selectedProducerId = "";
    originalRows = [createRow()];
    lyricsLotteryEnabled = false;
    signupStatus.textContent = "填写中";

    document.querySelectorAll(".typeBtn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.type === "披4");
    });
    document.querySelectorAll(".submitModeBtn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.mode === "normal");
    });
    if (quickOriginalInput) quickOriginalInput.value = "";
    syncSubmitToolButtons();

    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
    loadProjectsFromSupabase();
  }

  function validateSignupForm() {
    const taskName = String(songNameInput.value || "").trim();
    if (!taskName) {
      throw new Error("请先填写任务名称。");
    }

    if (isSingerQuotaBlank()) {
      throw new Error("请先填写演唱人数。");
    }

    const singerQuota = getSingerQuota();

    if (originalRows.length > singerQuota) {
      throw new Error("歌词分配行数不能超过演唱人数。");
    }

    if (selectedSingerIds.length > singerQuota) {
      throw new Error("演唱者数量不能超过演唱人数。");
    }

    const nonEmptyRows = originalRows.filter(row =>
      String(row.original || "").trim() || String(row.assignedSingerId || "").trim()
    );

    const lastFilledOriginalIndex = originalRows.reduce((lastIndex, row, index) => {
      return String(row.original || "").trim() ? index : lastIndex;
    }, -1);

    if (lastFilledOriginalIndex >= 0) {
      const hasOriginalGap = originalRows.slice(0, lastFilledOriginalIndex + 1).some(row =>
        !String(row.original || "").trim()
      );
      if (hasOriginalGap) {
        throw new Error("原唱空行未填写完全，请先补全原唱 / 部分。");
      }
    }

    const missingOriginalRow = nonEmptyRows.find(row =>
      String(row.assignedSingerId || "").trim() && !String(row.original || "").trim()
    );
    if (missingOriginalRow) {
      throw new Error("原唱空行未填写完全，请先补全原唱 / 部分。");
    }

    const invalidAssigned = nonEmptyRows.find(row =>
      String(row.assignedSingerId || "").trim() && !selectedSingerIds.includes(row.assignedSingerId)
    );
    if (invalidAssigned) {
      throw new Error("歌词分配中的成员必须来自已勾选的演唱者。");
    }

    const usedSingerIds = nonEmptyRows
      .map(row => String(row.assignedSingerId || "").trim())
      .filter(Boolean);

    if (new Set(usedSingerIds).size !== usedSingerIds.length) {
      throw new Error("同一个成员不能在歌词分配中被重复选择。");
    }

    if (lyricsLotteryEnabled && !getLyricsLotteryReadyState().ready) {
      throw new Error("开启抽签需要先选满演唱者，并补全所有原唱 / 部分名称。");
    }
  }

  async function submitSignup() {
    try {
      validateSignupForm();

      signupSubmitBtn.disabled = true;
      signupStatus.textContent = "提交中";

      const taskName = String(songNameInput.value || "").trim();
      const singerQuota = getSingerQuota();
      const taskCode = getNextProjectCode();
      const singerBonus = getSingerReward(selectedType, singerQuota);
      const producerBonus = getProducerReward(selectedType, singerQuota);

      const payload = {
        project_code: taskCode,
        project_name: taskName,
        project_type: selectedType,
        participant_count: singerQuota,
        singer_bonus: singerBonus,
        producer_bonus: producerBonus,
        producer_member_id: selectedProducerId || null,
        release_date: releaseDateInput.value || null,
        project_tone: String(projectToneInput.value || "").trim() || null,
        lyrics_lottery_enabled: lyricsLotteryEnabled && getLyricsLotteryReadyState().ready,
        created_by: authState.memberId || null,
        status: "待认领"
      };

      const { data: insertedProject, error: projectError } = await supabaseClient
        .from("projects")
        .insert(payload)
        .select("id, project_code, project_name")
        .single();

      if (projectError) throw projectError;

      const projectId = insertedProject.id;

      if (selectedSingerIds.length) {
        const singerRows = selectedSingerIds.map(memberId => ({
          project_id: projectId,
          member_id: memberId,
          is_submitted: false
        }));

        const { error: singerError } = await supabaseClient
          .from("project_singers")
          .insert(singerRows);

        if (singerError) throw singerError;
      }

      const validParts = originalRows
        .map((row, index) => ({
          project_id: projectId,
          part_order: index + 1,
          original_name: String(row.original || "").trim(),
          assigned_member_id: row.assignedSingerId || null
        }))
        .filter(row => row.original_name);

      if (validParts.length) {
        const { error: partError } = await supabaseClient
          .from("project_parts")
          .insert(validParts);

        if (partError) throw partError;
      }

      signupStatus.textContent = "已发布";
      const successMessage = lyricsLotteryEnabled
        ? `任务 ${insertedProject.project_code}.${insertedProject.project_name} 已写入数据库。
你已抽取本人的部分，请提醒其他演唱者去待处理页自行抽签。`
        : `任务 ${insertedProject.project_code}.${insertedProject.project_name} 已写入数据库。`;
      showToast("发布成功", successMessage);
      await loadProjectsFromSupabase();
      resetSignupForm();
    } catch (error) {
      console.error(error);
      showToast("发布失败", error.message || "数据库写入失败，请检查表结构、RLS 或字段名。");
      signupStatus.textContent = "填写中";
    } finally {
      signupSubmitBtn.disabled = false;
      if (signupStatus.textContent === "提交中") signupStatus.textContent = "填写中";
    }
  }

  function fitTopBarIdentityContent() {
    if (!currentUserText) return;
    currentUserText.style.fontSize = "";
    currentUserText.style.lineHeight = "1";
    currentUserText.style.whiteSpace = "nowrap";
  }

  function isMobileLayout() {
    return window.matchMedia("(max-width: 540px)").matches;
  }

  function fitPanelSwitchText() {
    if (isMobileLayout() || !panelSwitch) return;
    const buttons = Array.from(panelSwitch.querySelectorAll(".switchBtn"));
    buttons.forEach(btn => {
      btn.style.fontSize = "";
      btn.style.lineHeight = "1.05";
      btn.style.whiteSpace = "nowrap";
    });
    buttons.forEach(btn => {
      const baseFont = parseFloat(getComputedStyle(btn).fontSize) || 10;
      const available = Math.max(1, btn.clientWidth - 2);
      const needed = Math.max(btn.scrollWidth, btn.getBoundingClientRect().width);
      if (needed > available) {
        const compactFont = Math.max(4.2, baseFont * (available / needed) * 0.96);
        btn.style.fontSize = `${compactFont.toFixed(2)}px`;
      }
    });
  }

  function fitRoomNavToBar() {
    // 通用模板的房间按钮外框使用底图百分比绑定，不再进行整组 transform 缩放。
  }

  function syncTopUiLayout() {
    if (!overlay || !panelSwitch) return;
    const overlayRect = overlay.getBoundingClientRect();
    const scale = parseFloat(getComputedStyle(overlay).getPropertyValue("--bg-ui-scale")) || 1;

    if (overlayRect.width <= 540) {
      requestAnimationFrame(() => {
        fitTopBarIdentityContent();
        fitPanelSwitchText();
      });
      return;
    }

    overlay.style.setProperty("--panel-switch-left", "104.9%");
    overlay.style.setProperty("--panel-switch-top", "10.9%");
    overlay.style.setProperty("--panel-switch-w", "16.55%");
    overlay.style.setProperty("--panel-switch-h", "27.15%");
    overlay.style.setProperty("--panel-switch-pad-y", `${(14 * scale).toFixed(2)}px`);
    overlay.style.setProperty("--panel-switch-pad-x", `${(12 * scale).toFixed(2)}px`);
    overlay.style.setProperty("--panel-switch-radius", `${(20 * scale).toFixed(2)}px`);
    overlay.style.setProperty("--panel-switch-gap", `${(8 * scale).toFixed(2)}px`);
    overlay.style.setProperty("--switch-btn-pad-x", `${(12 * scale).toFixed(2)}px`);
    overlay.style.setProperty("--switch-btn-radius", `${(13 * scale).toFixed(2)}px`);
    overlay.style.setProperty("--switch-font", `${(13 * scale).toFixed(2)}px`);

    overlay.style.setProperty("--task-panel-left-bound", overlayRect.width >= 1600 ? "9.1%" : "9.2%");
    overlay.style.setProperty("--task-panel-right-bound", "22.4%");
    overlay.style.setProperty("--task-panel-top-bound", "18%");
    overlay.style.setProperty("--task-panel-bottom-bound", "12%");

    requestAnimationFrame(() => {
      fitTopBarIdentityContent();
      fitPanelSwitchText();
    });
  }

  function syncOverlayToImage() {
    if (isMobileLayout()) {
      document.documentElement.style.setProperty("--bg-ui-scale", "1");
      if (overlay) {
        overlay.style.left = "";
        overlay.style.top = "";
        overlay.style.width = "";
        overlay.style.height = "";
        overlay.style.setProperty("--bg-ui-scale", "1");
        overlay.style.setProperty("--ui-scale", "1");
        overlay.style.setProperty("--overlay-ui-scale", "1");
        overlay.style.setProperty("--project-panel-scale", "1");
      }
      requestAnimationFrame(syncTopUiLayout);
      return;
    }

    const roomRect = room.getBoundingClientRect();
    const roomW = roomRect.width;
    const roomH = roomRect.height;

    const naturalW = bg.naturalWidth || 1600;
    const naturalH = bg.naturalHeight || 900;
    const imgRatio = naturalW / naturalH;
    const roomRatio = roomW / roomH;

    let drawW, drawH, drawLeft, drawTop;

    if (roomRatio > imgRatio) {
      drawH = roomH;
      drawW = drawH * imgRatio;
      drawLeft = (roomW - drawW) / 2;
      drawTop = 0;
    } else {
      drawW = roomW;
      drawH = drawW / imgRatio;
      drawLeft = 0;
      drawTop = (roomH - drawH) / 2;
    }

    overlay.style.left = drawLeft + "px";
    overlay.style.top = drawTop + "px";
    overlay.style.width = drawW + "px";
    overlay.style.height = drawH + "px";

    const bgScale = Math.max(0.34, Math.min(3.2, drawW / 1440));

    document.documentElement.style.setProperty("--bg-ui-scale", String(bgScale));
    overlay.style.setProperty("--bg-ui-scale", String(bgScale));
    overlay.style.setProperty("--ui-scale", String(bgScale));
    overlay.style.setProperty("--overlay-ui-scale", String(bgScale));
    overlay.style.setProperty("--project-panel-scale", String(bgScale));

    requestAnimationFrame(syncTopUiLayout);
  }

  typeBtnGroup.addEventListener("click", (e) => {
    const btn = e.target.closest(".typeBtn");
    if (!btn) return;
    selectedType = btn.dataset.type || "披4";
    document.querySelectorAll(".typeBtn").forEach(item => item.classList.toggle("active", item === btn));
    syncSubmitToolButtons();
    updateRewardPreview();
  });

  submitModeGroup?.addEventListener("click", (e) => {
    const btn = e.target.closest(".submitModeBtn");
    if (!btn) return;
    selectedTaskMode = btn.dataset.mode === "special" ? "special" : "normal";
    document.querySelectorAll(".submitModeBtn").forEach(item => item.classList.toggle("active", item === btn));
    syncSubmitToolButtons();
    updateRewardPreview();
  });

  openWheelBtn?.addEventListener("click", openStudioWheelTool);
  clearWheelAssignBtn?.addEventListener("click", clearOriginalAssignmentsOnly);
  applyQuickOriginalBtn?.addEventListener("click", applyQuickOriginalText);
  clearQuickOriginalBtn?.addEventListener("click", () => {
    if (quickOriginalInput) quickOriginalInput.value = "";
  });

  window.addEventListener("message", (event) => {
    const data = event?.data || {};
    if (data.type === "room10-wheel-result" || data.type === "studio-wheel-result") {
      applyWheelResultToRows(data);
    }
  });

  singerMemberGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".memberBtn[data-member-id]");
    if (!btn) return;
    handleSingerMemberToggle(btn.dataset.memberId);
  });

  producerMemberGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".memberBtn[data-member-id]");
    if (!btn) return;
    handleProducerMemberToggle(btn.dataset.memberId);
  });

  singerQuotaInput.addEventListener("input", () => {
    if (isSingerQuotaBlank()) {
      updateRewardPreview();
      syncLyricsLotteryButton();
      return;
    }
    applyQuotaConstraints(true);
  });

  singerQuotaInput.addEventListener("blur", () => {
    singerQuotaInput.value = String(getSingerQuota());
    applyQuotaConstraints(false);
  });

  originalRoleList.addEventListener("input", (e) => {
    const rowEl = e.target.closest(".originalRoleRow");
    if (!rowEl) return;
    const rowId = rowEl.dataset.rowId;
    const field = e.target.dataset.field;

    if (field === "original") {
      originalRows = originalRows.map(row => (
        row.id === rowId ? { ...row, original: e.target.value } : row
      ));
      syncLyricsLotteryButton();
      return;
    }

    if (field === "assignedSingerName") {
      originalRows = originalRows.map(row => {
        if (row.id !== rowId) return row;
        const matched = findSingerMemberByText(e.target.value, rowId);
        return {
          ...row,
          assignedSingerId: matched ? matched.id : "",
          assignedSingerName: e.target.value
        };
      });
      syncLyricsLotteryButton();
      syncSubmitToolButtons();
    }
  });

  originalRoleList.addEventListener("keydown", (e) => {
    const input = e.target.closest(".originalInput");
    if (!input) return;

    if (e.key === "Enter" && input.dataset.field === "original") {
      e.preventDefault();
      const currentIndex = Number(input.dataset.rowIndex || "-1");
      if (!Number.isFinite(currentIndex) || currentIndex < 0) return;
      const nextInput = originalRoleList.querySelector(`.originalInput[data-field="original"][data-row-index="${currentIndex + 1}"]`);
      if (nextInput) {
        nextInput.focus();
        nextInput.select();
      }
      return;
    }

    if (e.key !== "Tab") return;

    const inputs = [...originalRoleList.querySelectorAll('.originalInput')];
    const currentIndex = inputs.indexOf(input);
    if (currentIndex < 0) return;

    e.preventDefault();
    const nextIndex = e.shiftKey ? currentIndex - 1 : currentIndex + 1;
    const target = inputs[nextIndex];
    if (target) {
      target.focus();
      if (typeof target.select === 'function') target.select();
    }
  });

  originalRoleList.addEventListener("change", (e) => {
    const rowEl = e.target.closest(".originalRoleRow");
    if (!rowEl) return;
    const rowId = rowEl.dataset.rowId;
    const field = e.target.dataset.field;
    if (field !== "assignedSingerName") return;

    const row = originalRows.find(item => item.id === rowId);
    if (!row) return;

    const previousSingerId = row.assignedSingerId;
    const previousSingerName = row.assignedSingerName;
    const inputText = String(e.target.value || "").trim();
    const matched = findSingerMemberByText(inputText, rowId);
    const nextSingerId = matched ? String(matched.id || "") : "";
    const usedSingerIds = new Set(getUsedSingerIds(rowId));

    if (nextSingerId && usedSingerIds.has(nextSingerId)) {
      e.target.value = previousSingerName || "";
      showToast("重复选择", "同一个成员不能在歌词分配中被重复选择。");
      return;
    }

    if (inputText && !matched) {
      e.target.value = previousSingerName || "";
      showToast("无效成员", "请先在左侧勾选演唱者，再在右侧分配；也可以直接输入已勾选成员的名字。");
      return;
    }

    originalRows = originalRows.map(item => {
      if (item.id !== rowId) return item;
      return {
        ...item,
        assignedSingerId: nextSingerId,
        assignedSingerName: matched ? matched.name : ""
      };
    });

    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
  });

  originalRoleList.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action='delete']");
    if (!btn) return;
    const rowEl = e.target.closest(".originalRoleRow");
    if (!rowEl) return;

    const rowId = rowEl.dataset.rowId;

    originalRows = originalRows.map(item => (
      item.id === rowId
        ? { ...item, assignedSingerId: "", assignedSingerName: "" }
        : item
    ));

    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
  });

  enableLyricsLotteryBtn?.addEventListener("click", handleEnableLyricsLotteryClick);
  signupResetBtn.addEventListener("click", resetSignupForm);
  signupSubmitBtn.addEventListener("click", submitSignup);

  document.querySelectorAll(".navBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const roomKey = btn.dataset.room;

      if (roomKey === "manager") {
        const role = getCurrentRole();
        const page = role === "owner"
          ? "manager-owner.html"
          : role === "admin"
            ? "manager-admin.html"
            : role === "member"
              ? "manager-member.html"
              : "manager-visitor.html";
        window.location.href = page;
        return;
      }

      if (links[roomKey]) {
        window.location.href = links[roomKey];
      }
    });
  });

  document.addEventListener("click", (event) => {
    if (!event.target.closest("#siteNoticeWrap")) {
      toggleSiteNoticePanel(false);
    }
  });

  siteNoticeBtn?.addEventListener("click", (event) => {
    event.stopPropagation();
    renderSiteNotifications();
    toggleSiteNoticePanel();
  });

  identityAuthBtn?.addEventListener("click", () => {
    if (identityAuthBtn.dataset.action === "login") {
      window.location.href = "index.html";
      return;
    }
    handleLogout();
  });

  bg.addEventListener("load", syncOverlayToImage);
  window.addEventListener("resize", syncOverlayToImage);
  window.addEventListener("orientationchange", syncOverlayToImage);
  window.addEventListener("load", syncTopUiLayout);

  if ("ResizeObserver" in window) {
    const ro = new ResizeObserver(syncOverlayToImage);
    ro.observe(room);
  }

  window.addEventListener("storage", async (e) => {
    if ([STORAGE_KEYS.loggedIn, STORAGE_KEYS.user, STORAGE_KEYS.role, STORAGE_KEYS.memberId].includes(e.key)) {
      const ok = await ensureAuthState();
      if (!ok) return;
      updateTopBarIdentity();
      renderSiteNotifications();
      await loadMembersFromSupabase();
      await loadProjectsFromSupabase();
    }
  });

  async function init() {
    updateTopBarIdentity();
    renderSiteNotifications();
    updateRewardPreview();
    syncSubmitToolButtons();
    syncOverlayToImage();

    const ok = await ensureAuthState();
    if (!ok) return;

    syncOverlayToImage();
    renderSiteNotifications();

    try {
      await loadMembersFromSupabase();
      await loadProjectsFromSupabase();
      projectAutoCodeEl.textContent = getNextProjectCode();
      singerQuotaInput.value = String(getSingerQuota());
      syncRowsToQuota();
      applyQuotaConstraints(false);
    } catch (error) {
      console.error(error);
      showToast("初始化失败", error.message || "页面初始化失败，请检查数据库连接。");
    }
  }

  init();
</script>
</body>
