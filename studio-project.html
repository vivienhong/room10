<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜任务详情</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  *{box-sizing:border-box;}

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(180deg,#e7dfd4 0%, #ddd4c8 100%);
  }

  body{
    display:flex;
    justify-content:center;
    align-items:center;
  }

  #room{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:linear-gradient(180deg,#e7dfd4 0%, #ddd4c8 100%);
  }

  #bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center center;
    display:block;
    user-select:none;
    pointer-events:none;
    -webkit-user-drag:none;
  }

  #overlay{
    position:absolute;
    inset:0;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
    --overlay-ui-scale:1;
    --project-panel-scale:1;
    --project-radius-lg:calc(30px * var(--project-panel-scale));
    --project-radius-md:calc(20px * var(--project-panel-scale));
    --project-radius-sm:calc(14px * var(--project-panel-scale));
    --project-gap-xs:calc(5px * var(--project-panel-scale));
    --project-gap-sm:calc(8px * var(--project-panel-scale));
    --project-gap-md:calc(12px * var(--project-panel-scale));
    --project-gap-lg:calc(16px * var(--project-panel-scale));
    --project-pad-xs:calc(8px * var(--project-panel-scale));
    --project-pad-sm:calc(10px * var(--project-panel-scale));
    --project-pad-md:calc(12px * var(--project-panel-scale));
    --project-pad-lg:calc(14px * var(--project-panel-scale));
    --project-pad-xl:calc(18px * var(--project-panel-scale));
    --project-font-xs:calc(11px * var(--project-panel-scale));
    --project-font-sm:calc(12px * var(--project-panel-scale));
    --project-font-md:calc(13px * var(--project-panel-scale));
    --project-font-base:calc(13px * var(--project-panel-scale));
    --project-font-lg:calc(18px * var(--project-panel-scale));
    --project-font-xl:calc(16px * var(--project-panel-scale));
    --project-font-hero:calc(18px * var(--project-panel-scale));
    --project-btn-h:calc(40px * var(--project-panel-scale));
    --project-assignment-min-h:calc(96px * var(--project-panel-scale));
  }
  #overlay *{
    pointer-events:auto;
  }


  /* cleaned: removed old duplicate top navigation / identity CSS */


  #taskPanel{
    position:absolute;
    left:43%;
    top:18%;
    transform:translateX(-50%);
    transform-origin:top center;
    width:69.5%;
    height:70%;
    min-height:360px;
    border-radius:var(--project-radius-lg);
    background:rgba(255,255,255,0.34);
    border:1px solid rgba(255,255,255,0.52);
    box-shadow:
      0 16px 42px rgba(122,96,68,0.10),
      inset 0 1px 0 rgba(255,255,255,0.62),
      inset 0 -1px 0 rgba(255,255,255,0.20);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    overflow:visible;
  }

  #taskPanel::before{
    content:"";
    position:absolute;
    inset:calc(10px * var(--project-panel-scale));
    border-radius:calc(22px * var(--project-panel-scale));
    border:1px solid rgba(255,255,255,0.22);
    pointer-events:none;
  }

  #panelSwitch{
    position:absolute;
    right:calc(-194px * var(--project-panel-scale));
    top:24.6%;
    transform:translateY(-50%);
    transform-origin:top right;
    width:calc(170px * var(--project-panel-scale));
    padding:calc(18px * var(--project-panel-scale)) calc(14px * var(--project-panel-scale));
    border-radius:var(--project-radius-md);
    background:rgba(255,248,239,0.9);
    border:1px solid rgba(186,146,103,0.24);
    box-shadow:
      0 10px 24px rgba(116,86,54,0.12),
      inset 0 1px 0 rgba(255,255,255,0.86);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:flex;
    flex-direction:column;
    gap:calc(10px * var(--project-panel-scale));
    z-index:30;
  }

  .switchBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    width:100%;
    min-height:var(--project-btn-h);
    padding:calc(8px * var(--project-panel-scale)) calc(12px * var(--project-panel-scale));
    border-radius:calc(13px * var(--project-panel-scale));
    background:rgba(231,214,185,0.92);
    color:#744b25;
    font-size:var(--project-font-base);
    font-weight:700;
    line-height:1.2;
    text-align:center;
    box-shadow:
      inset 0 1px 0 rgba(255,247,233,0.95),
      0 2px 6px rgba(116,86,54,0.08);
    transition:transform .18s ease, filter .18s ease, background .18s ease;
  }

  .switchBtn:hover{
    transform:translateY(-1px);
    filter:brightness(1.03);
  }

  .switchBtn.active{
    background:linear-gradient(180deg,#d9a364 0%, #c98c4f 100%);
    color:#fff9f1;
    box-shadow:
      inset 0 1px 0 rgba(255,224,188,0.55),
      0 4px 10px rgba(116,86,54,0.14);
  }

  #browsePanelInner{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:26.5% 73.5%;
    min-width:0;
  }

  #browseListPane{
    padding:calc(16px * var(--project-panel-scale)) calc(10px * var(--project-panel-scale)) calc(14px * var(--project-panel-scale)) calc(14px * var(--project-panel-scale));
    border-right:1px solid rgba(255,255,255,0.20);
    display:flex;
    flex-direction:column;
    min-height:0;
    background:transparent;
    min-width:0;
  }

  #browseListTitleTask{
    display:none;
  }

  .taskFilterRow{
    display:flex;
    flex-wrap:wrap;
    gap:var(--project-gap-xs);
    margin:0 0 var(--project-gap-sm);
    padding-right:calc(4px * var(--project-panel-scale));
  }

  .taskFilterBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    min-width:calc(52px * var(--project-panel-scale));
    height:calc(28px * var(--project-panel-scale));
    padding:0 calc(10px * var(--project-panel-scale));
    border-radius:calc(9px * var(--project-panel-scale));
    background:rgba(255,252,247,0.62);
    color:#6a4120;
    font-size:var(--project-font-sm);
    font-weight:700;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.78),
      0 2px 6px rgba(116,86,54,0.06);
    transition:transform .18s ease, filter .18s ease, background .18s ease;
    white-space:nowrap;
  }

  .taskFilterBtn:hover{
    transform:translateY(-1px);
    filter:brightness(1.03);
  }

  .taskFilterBtn.active{
    background:linear-gradient(180deg,#d9a364 0%, #c98c4f 100%);
    color:#fff9f1;
  }

  .searchWrap{
    flex:0 0 auto;
    margin:0 0 var(--project-gap-sm);
    padding-right:calc(4px * var(--project-panel-scale));
  }

  .searchInput{
    width:100%;
    height:calc(36px * var(--project-panel-scale));
    border:none;
    outline:none;
    border-radius:calc(12px * var(--project-panel-scale));
    padding:0 calc(12px * var(--project-panel-scale));
    background:rgba(255,252,247,0.62);
    color:#5f3b1d;
    font-size:var(--project-font-md);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.75),
      0 2px 8px rgba(120,92,63,0.05);
  }

  .searchInput::placeholder{
    color:#9a7b5b;
  }

  #browseListTask{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    padding-right:4px;
    scrollbar-width:thin;
    scrollbar-color:rgba(175,135,98,0.55) transparent;
  }

  #browseListTask::-webkit-scrollbar{
    width:8px;
  }
  #browseListTask::-webkit-scrollbar-track{
    background:transparent;
  }
  #browseListTask::-webkit-scrollbar-thumb{
    background:rgba(175,135,98,0.55);
    border-radius:999px;
  }

  .taskItem{
    width:100%;
    appearance:none;
    border:none;
    cursor:pointer;
    text-align:left;
    padding:calc(9px * var(--project-panel-scale)) calc(10px * var(--project-panel-scale));
    margin:0 0 calc(6px * var(--project-panel-scale));
    border-radius:calc(13px * var(--project-panel-scale));
    background:rgba(255,252,247,0.34);
    color:#6c4523;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.52),
      0 3px 10px rgba(120,92,63,0.05);
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
    position:relative;
    min-width:0;
    overflow:hidden;
    isolation:isolate;
  }

  .taskItem:hover{
    transform:translateY(-1px);
    background:rgba(255,252,247,0.52);
  }

  .taskItem.active:hover{
    transform:none;
  }

  .taskItem.active{
    background:linear-gradient(180deg, rgba(240,219,185,0.98) 0%, rgba(230,200,157,0.98) 100%);
    color:#5c3819;
    border:1px solid rgba(217,163,100,0.90);
    box-shadow:
      inset 0 0 0 1px rgba(255,247,229,0.96),
      0 0 0 2px rgba(217,163,100,0.22),
      0 6px 14px rgba(120,92,63,0.12);
  }

  .taskItem.active::after{
    content:"";
    position:absolute;
    inset:2px;
    border-radius:11px;
    pointer-events:none;
    background:
      linear-gradient(115deg,
        rgba(255,255,255,0) 18%,
        rgba(255,251,241,0.18) 34%,
        rgba(255,255,255,0.62) 50%,
        rgba(255,244,221,0.20) 64%,
        rgba(255,255,255,0) 82%);
    background-size:220% 100%;
    mix-blend-mode:screen;
    opacity:.92;
    animation:taskActiveShine 2.8s linear infinite;
    z-index:0;
  }

  .taskItem.active.unsubmittedWarn{
    background:linear-gradient(180deg, rgba(240,219,185,0.98) 0%, rgba(230,200,157,0.98) 100%);
    border:1px solid rgba(217,163,100,0.90);
    box-shadow:
      inset 0 0 0 1px rgba(255,247,229,0.96),
      0 0 0 2px rgba(217,163,100,0.22),
      0 6px 14px rgba(120,92,63,0.12);
  }

  .taskItem.unsubmittedWarn{
    box-shadow:
      inset 0 0 0 1px rgba(211,119,54,0.22),
      0 3px 10px rgba(120,92,63,0.05);
    background:rgba(255,245,235,0.72);
  }

  .taskItem.jumpFlash{
    animation:taskJumpFlash 1.8s ease;
  }

  @keyframes taskJumpFlash{
    0%{
      box-shadow:
        inset 0 0 0 1px rgba(244,198,121,0.96),
        0 0 0 3px rgba(244,198,121,0.38),
        0 8px 18px rgba(184,132,74,0.18);
      transform:translateY(-1px);
    }
    70%{
      box-shadow:
        inset 0 0 0 1px rgba(244,198,121,0.56),
        0 0 0 2px rgba(244,198,121,0.18),
        0 5px 12px rgba(184,132,74,0.10);
    }
    100%{
      box-shadow:inherit;
      transform:none;
    }
  }
  @keyframes taskActiveShine{
    0%{background-position:160% 0;}
    100%{background-position:-60% 0;}
  }

  .taskTitleLine{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:6px;
    position:relative;
    z-index:1;
  }

  .taskItemName{
    display:flex;
    align-items:center;
    flex-wrap:nowrap;
    gap:0;
    min-width:0;
    width:100%;
    font-size:var(--project-font-base);
    font-weight:800;
    line-height:1.35;
    color:inherit;
  }

  .taskNameText{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .taskBadgeLine{
    display:flex;
    align-items:center;
    gap:5px;
    flex-wrap:nowrap;
    margin-top:5px;
    min-height:22px;
    position:relative;
    z-index:1;
    overflow:hidden;
  }

  .taskBadgeLine:empty{
    display:none;
  }

  .taskTypeMini{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:20px;
    padding:2px 8px;
    border-radius:999px;
    font-size:10px;
    font-weight:500;
    line-height:1;
    flex:0 0 auto;
    white-space:nowrap;
  }
  .taskTypeMini.type-p4{
    background:rgba(226, 237, 255, 0.96);
    color:#5e6f95;
    border:1px solid rgba(161, 180, 214, 0.42);
  }
  .taskTypeMini.type-bro{
    background:rgba(233, 241, 255, 0.96);
    color:#5f7196;
    border:1px solid rgba(169, 183, 216, 0.44);
  }
  .taskTypeMini.type-sis{
    background:rgba(255, 231, 239, 0.96);
    color:#91627d;
    border:1px solid rgba(220, 181, 196, 0.5);
  }
  .taskTypeMini.type-game{
    background:rgba(232, 244, 230, 0.96);
    color:#5f7c57;
    border:1px solid rgba(171, 202, 161, 0.5);
  }
  .taskTypeMini.type-other{
    background:rgba(247, 236, 220, 0.96);
    color:#8a6a48;
    border:1px solid rgba(216, 190, 153, 0.52);
  }

  .taskMiniBadge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:20px;
    padding:2px 7px;
    border-radius:999px;
    font-size:10px;
    font-weight:500;
    line-height:1;
    flex:0 0 auto;
    white-space:nowrap;
  }

  .taskMiniBadge.mine{
    background:linear-gradient(180deg,#ffe4ee 0%, #ffcfe1 100%);
    color:#8c4f6a;
    border:1px solid rgba(220, 172, 195, 0.52);
  }

  .taskMiniBadge.warn{
    background:linear-gradient(180deg,#ffd8c9 0%, #ffc0aa 100%);
    color:#8d5644;
    border:1px solid rgba(223, 173, 154, 0.56);
  }

  .taskMiniBadge.onlyme{
    background:linear-gradient(180deg,#fff0b8 0%, #ffe08e 100%);
    color:#8a6421;
    border:1px solid rgba(225, 197, 123, 0.58);
  }

  .taskQuickActions{
    display:flex;
    align-items:center;
    gap:6px;
    margin-left:auto;
    flex:0 0 auto;
    position:relative;
    z-index:1;
  }

  .taskQuickBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    min-width:34px;
    height:22px;
    padding:0 9px;
    border-radius:999px;
    background:rgba(255, 250, 245, 0.96);
    color:#7a5231;
    font-size:10px;
    font-weight:600;
    line-height:1;
    border:1px solid rgba(197, 167, 136, 0.54);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 6px rgba(116,86,54,0.08);
  }

  .taskQuickBtn.done{
    background:linear-gradient(180deg,#ffe4bf 0%, #ffd090 100%);
    color:#7d511d;
    border-color:rgba(214, 170, 98, 0.66);
  }

  .taskQuickBtn:hover{
    transform:translateY(-1px);
    filter:brightness(1.02);
  }

  .taskQuickBtn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
    filter:none;
  }

  .taskItemInfo{
    display:block;
    margin-top:calc(4px * var(--project-panel-scale));
    position:relative;
    z-index:1;
    font-size:var(--project-font-xs);
    font-weight:600;
    line-height:1.4;
    color:#8b6947;
    word-break:break-word;
  }

  .taskEmpty{
    padding:16px 12px;
    border-radius:15px;
    background:rgba(255,252,247,0.28);
    color:#8b6947;
    font-size:12px;
    line-height:1.6;
    text-align:center;
  }

  #browseDetailPane{
    padding:calc(12px * var(--project-panel-scale)) calc(12px * var(--project-panel-scale)) calc(8px * var(--project-panel-scale));
    min-width:0;
    display:flex;
    flex-direction:column;
    min-height:0;
    background:transparent;
  }

  #browseDetailHeader{
    display:block;
    margin-bottom:10px;
  }

  .detailTitleWrap{
    min-width:0;
  }

  #browseDetailTitleTask{
    min-width:0;
  }

  .detailHero{
    display:flex;
    flex-direction:column;
    gap:var(--project-gap-sm);
    padding:calc(12px * var(--project-panel-scale)) calc(14px * var(--project-panel-scale));
    border-radius:calc(18px * var(--project-panel-scale));
    background:rgba(255,250,244,0.64);
    border:1px solid rgba(214,186,149,0.34);
    box-shadow:0 4px 14px rgba(118,86,54,0.05);
  }

  .detailHeroTitleRow{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(188,154,117,0.18);
  }

  .detailHeroTitleMain{
    min-width:0;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .detailHeroTitle{
    color:#6f4726;
    font-size:var(--project-font-hero);
    font-weight:800;
    line-height:1.2;
  }

  .detailHeroTags{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }

  .detailHeroMeta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px 16px;
    flex-wrap:wrap;
  }

  .detailHeroMetaLeft,
  .detailHeroMetaRight{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .detailMetaChip{
    color:#7a5231;
    font-size:var(--project-font-base);
    font-weight:500;
    line-height:1.25;
    white-space:nowrap;
  }

  #browseDetailStatusTask{
    display:none;
  }

  #browseDetailBody{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    padding-right:4px;
    scrollbar-width:thin;
    scrollbar-color:rgba(175,135,98,0.55) transparent;
  }

  #browseDetailBody::-webkit-scrollbar{
    width:8px;
  }
  #browseDetailBody::-webkit-scrollbar-track{
    background:transparent;
  }
  #browseDetailBody::-webkit-scrollbar-thumb{
    background:rgba(175,135,98,0.55);
    border-radius:999px;
  }

  .sectionCard{
    padding:calc(10px * var(--project-panel-scale)) calc(11px * var(--project-panel-scale)) calc(10px * var(--project-panel-scale));
    border-radius:calc(18px * var(--project-panel-scale));
    background:rgba(255,250,244,0.60);
    border:1px solid rgba(214,186,149,0.32);
    box-shadow:0 4px 14px rgba(118,86,54,0.05);
    margin-bottom:14px;
    min-width:0;
  }

  .sectionHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:var(--project-gap-sm);
    padding-bottom:calc(5px * var(--project-panel-scale));
    margin-bottom:calc(6px * var(--project-panel-scale));
    border-bottom:1px solid rgba(188,154,117,0.18);
  }

  .sectionTitle{
    color:#6f4726;
    font-size:var(--project-font-xl);
    font-weight:800;
    line-height:1.2;
    margin:0;
  }

  .sectionMeta{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:flex-end;
  }

  .sectionMetaText{
    color:#7a5231;
    font-size:var(--project-font-base);
    font-weight:500;
    line-height:1.25;
    white-space:nowrap;
  }

  .assignmentList{
    --assignment-card-gap:calc(8px * var(--project-panel-scale));
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    justify-content:flex-start;
    align-content:flex-start;
    gap:var(--assignment-card-gap);
    width:100%;
    max-width:100%;
    max-height:none;
    overflow:visible;
    padding-right:0;
    scrollbar-width:thin;
    scrollbar-color:rgba(175,135,98,0.55) transparent;
  }

  .assignmentList::-webkit-scrollbar{
    width:7px;
  }
  .assignmentList::-webkit-scrollbar-track{
    background:transparent;
  }
  .assignmentList::-webkit-scrollbar-thumb{
    background:rgba(175,135,98,0.55);
    border-radius:999px;
  }

  .assignmentCompactRow{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:calc(6px * var(--project-panel-scale));
    width:100%;
    padding:calc(12px * var(--project-panel-scale)) calc(8px * var(--project-panel-scale));
    border-radius:calc(12px * var(--project-panel-scale));
    background:rgba(255, 252, 248, 0.86);
    border:1px solid rgba(222, 202, 180, 0.74);
    text-align:center;
    min-height:var(--project-assignment-min-h);
    min-width:0;
    overflow:hidden;
  }

  .assignmentCompactRow.warn{
    background:rgba(255, 252, 248, 0.86);
    border-color:rgba(222, 202, 180, 0.74);
  }

  .assignmentCompactRow.mineCard{
    background:linear-gradient(180deg, rgba(255,236,191,0.96) 0%, rgba(243,213,156,0.96) 100%);
    border-color:rgba(213,146,65,0.32);
    box-shadow:0 0 0 2px rgba(229,177,96,0.22);
  }

  .assignmentNameInline{
    display:flex;

/* =========================
   统一奖励弹窗（来自独立测试页）
========================= */

.reward-mask {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(64, 45, 30, 0.30);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  --reward-scale: var(--reward-modal-scale, 1);
}

.reward-mask.show {
  display: flex!important;
}

.reward-card {
  position: relative;
  width: min(calc(430px * var(--reward-scale)), calc(100vw - 28px));
  max-height: calc(100dvh - 28px);
  padding:
    calc(28px * var(--reward-scale))
    calc(24px * var(--reward-scale))
    calc(22px * var(--reward-scale));
  border-radius: calc(26px * var(--reward-scale));
  overflow: hidden auto;
  text-align: center;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 16%, rgba(255,226,235,.68), transparent 30%),
    radial-gradient(circle at 86% 18%, rgba(255,240,181,.62), transparent 32%),
    linear-gradient(180deg, rgba(255,253,247,.98), rgba(255,244,226,.96));
  border: calc(2px * var(--reward-scale)) solid var(--line);
  box-shadow:

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");

  /* =========================================================

  const rewardIconMap = {

    称号: "🎖️",

  };

  let rewardModalQueue = [];
  let rewardModalShowing = false;

  function getRewardItemIcon(item = {}) {
    const explicitIcon = String(item.icon || item.item_icon || item.icon_text || "").trim();
    if (explicitIcon && !/\.(png|jpg|jpeg|webp|gif|svg)$/i.test(explicitIcon)) return explicitIcon;
    const name = String(item.name || item.item_name || item.reward_name || item.label || "").trim();
    return rewardIconMap[name] || rewardIconMap[item.type] || "✨";
  }

  function normalizeRewardItem(item) {
    if (typeof item === "string") {
      return { name: item, amount: "", unit: "", icon: rewardIconMap[item] || "✨" };
    }

    const raw = item || {};
    const name = raw.name || raw.item_name || raw.reward_name || raw.label || raw.item_key || "奖励";
    const amount = raw.amount ?? raw.quantity ?? raw.qty ?? raw.count ?? raw.value ?? "";
    return {
      name,
      amount,
      unit: raw.unit || raw.item_unit || "",
      icon: getRewardItemIcon(raw),
      prefix: raw.prefix || ""
    };
  }

  function formatRewardAmount(item) {
    if (item.amount === "" || item.amount === null || item.amount === undefined) return "";
    if (typeof item.amount === "number") {
      const sign = item.amount > 0 ? "+" : "";
      return `${sign}${item.amount}${item.unit || ""}`;
    }
    return `${item.prefix || ""}${item.amount}${item.unit || ""}`;
  }

  function renderRewards(rewards) {
    const list = document.getElementById("rewardList");
    const sectionTitle = document.getElementById("rewardSectionTitle");
    if (!list || !sectionTitle) return;

    list.innerHTML = "";
    list.className = "reward-list";
    sectionTitle.className = "reward-section-title";

    if (!rewards.length) {
      list.classList.add("empty");
      sectionTitle.classList.add("empty");
      return;
    }

    list.classList.add(`count-${Math.min(rewards.length, 3)}`);
    rewards.forEach((reward) => {
      const item = document.createElement("div");
      item.className = "reward-item";
      item.innerHTML = `
        <div class="reward-item-icon">${escapeHtml(reward.icon)}</div>
        <div class="reward-item-name">${escapeHtml(reward.name)}</div>
        <div class="reward-item-amount">${escapeHtml(formatRewardAmount(reward))}</div>
      `;
      list.appendChild(item);
    });
  }

  function showRewardModal(options = {}) {
    const mask = document.getElementById("rewardMask");
    if (!mask) return;

    const type = options.type || "achievement";
    const meta = rewardTypeMeta[type] || rewardTypeMeta.achievement;
    const rewards = Array.isArray(options.rewards)
      ? options.rewards.map(normalizeRewardItem)
      : [];

    mask.dataset.type = type;
    document.getElementById("rewardIcon").textContent = options.icon || meta.icon;
    document.getElementById("rewardLabel").textContent = options.label || meta.label;
    document.getElementById("rewardTitle").textContent = options.title || "奖励已领取";
    document.getElementById("rewardDesc").textContent = options.desc || "奖励已经记录完成。";

    const confirmBtn = mask.querySelector(".reward-confirm");
    if (confirmBtn) confirmBtn.textContent = rewards.length ? "收下奖励" : "知道了";

    renderRewards(rewards);
    rewardModalShowing = true;
    mask.classList.add("show");
    mask.style.display = "flex";
    mask.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";

  function closeRewardModal() {
    const mask = document.getElementById("rewardMask");
    if (!mask) return;
    mask.classList.remove("show");
    mask.style.display = "";
    mask.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    rewardModalShowing = false;

    if (rewardModalQueue.length) {
      const next = rewardModalQueue.shift();
      window.setTimeout(() => showRewardModal(next), 120);
    }
  }

  window.closeRewardModal = closeRewardModal;
  window.showRewardModal = showRewardModal;

  function queueRewardModals(events = []) {
    const normalized = events.filter(Boolean);
    if (!normalized.length) return;
    rewardModalQueue.push(...normalized);
    if (!rewardModalShowing) {
      const first = rewardModalQueue.shift();
      showRewardModal(first);
    }
  }

  function appendGoldReward(rewards, value) {
    const amount = Number(value || 0);
    if (amount > 0) rewards.push({ name: "金币", amount, icon: "🪙" });

  function collectRewardItems(source = {}) {
    const rewards = [];
    appendGoldReward(rewards, source.reward_gold ?? source.gold ?? source.total_gold ?? source.gold_reward);

    const candidates = [
      source.rewards,
      source.reward_items,
      source.item_rewards,
      source.items,
      source.material_rewards
    ];

    candidates.forEach(list => {
      if (Array.isArray(list)) rewards.push(...list.map(normalizeRewardItem));
    });

    return rewards;
  }

  function inferHonorType(item = {}, fallback = "achievement") {
    const raw = String(item.type || item.honor_type || item.kind || item.category || item.table_name || fallback || "achievement").toLowerCase();
    if (raw.includes("title") || raw.includes("称号")) return "title";
    if (raw.includes("gift") || raw.includes("礼包")) return "gift";
    if (raw.includes("item") || raw.includes("道具") || raw.includes("material")) return "item";
    if (raw.includes("gold") || raw.includes("金币")) return "gold";
    return "achievement";
  }

  function buildRewardEventFromHonor(item = {}, fallbackType = "achievement") {
    const type = inferHonorType(item, fallbackType);

    const title = item.title || item.name || item.honor_name || item.achievement_name || item.title_name || item.stage_name || meta.label;

    return {
      type,
      label: item.label || meta.label,
      icon: item.icon_text || item.icon || meta.icon,
      title,
      desc,
      rewards: collectRewardItems(item)
    };
  }

  function normalizeStudioRewardEvents(rawPayload) {
    const events = [];
    const rawList = Array.isArray(rawPayload) ? rawPayload : [rawPayload];

    rawList.filter(Boolean).forEach(payload => {
      if (Array.isArray(payload)) {
        events.push(...normalizeStudioRewardEvents(payload));
        return;
      }

      if (payload.reward_events || payload.rewardEvents || payload.events) {
        events.push(...normalizeStudioRewardEvents(payload.reward_events || payload.rewardEvents || payload.events));
      }

      if (Array.isArray(payload.achievements)) {
        payload.achievements.forEach(item => events.push(buildRewardEventFromHonor(item, "achievement")));
      }
      if (Array.isArray(payload.titles)) {
        payload.titles.forEach(item => events.push(buildRewardEventFromHonor(item, "title")));
      }
      if (Array.isArray(payload.honors)) {
        payload.honors.forEach(item => events.push(buildRewardEventFromHonor(item, inferHonorType(item))));
      }
      if (Array.isArray(payload.unlocked_honors)) {
        payload.unlocked_honors.forEach(item => events.push(buildRewardEventFromHonor(item, inferHonorType(item))));
      }

      const looksLikeSingleHonor = payload.name || payload.honor_name || payload.achievement_name || payload.title_name || payload.stage_name;
      if (looksLikeSingleHonor && !payload.reward_events && !payload.achievements && !payload.titles && !payload.honors && !payload.unlocked_honors) {
        events.push(buildRewardEventFromHonor(payload, inferHonorType(payload)));
      }

      const summaryRewards = collectRewardItems(payload);
      if (!looksLikeSingleHonor && summaryRewards.length && !payload.achievements && !payload.titles && !payload.honors && !payload.unlocked_honors) {
        events.push({
          type: payload.type || "gift",
          title: payload.title || "奖励已领取",
          desc: payload.message || payload.desc || "奖励已经记录完成。",
          rewards: summaryRewards
        });
      }
    });

    return events.filter(item => item && item.title);
  }

  async function runStudioHonorRewardCheck(action, context = {}) {
    const memberId = getCurrentMemberId();
    if (!memberId) return;

    const params = {
      p_member_id: memberId,
      p_action: action,
      p_room_key: "studio",
      p_source_group: "studio_project",
      p_project_id: context.projectId || null,
      p_singer_record_id: context.singerRecordId || null
    };

    for (const rpcName of STUDIO_HONOR_RPC_NAMES) {
      try {
        const { data, error } = await supabaseClient.rpc(rpcName, params);
        if (error) {
          const message = String(error.message || "");
          const code = String(error.code || "");
          if (code === "PGRST202" || message.includes("Could not find the function") || message.includes("schema cache")) {
            continue;
          }
          console.warn(`工作间荣誉检查失败：${rpcName}`, error);
          continue;
        }

        const events = normalizeStudioRewardEvents(data);
        if (events.length) queueRewardModals(events);
        return;
      } catch (err) {
        console.warn(`工作间荣誉检查异常：${rpcName}`, err);
      }
    }
  }

    if (!dateString) return "未定";
    const date = new Date(dateString);
    if (Number.isNaN(date.getTime())) return String(dateString);
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;

  async function ensureAuthState() {
    authState.loggedIn = isLoggedIn();
    authState.nickname = String(localStorage.getItem(STORAGE_KEYS.user) || "").trim();
    authState.role = getCurrentRole();
    authState.memberId = localStorage.getItem(STORAGE_KEYS.memberId) || null;

    if (!authState.loggedIn || !authState.nickname || !authState.memberId) {
      handleLogout();
      return false;
    }

    try {
      let verifiedMember = null;

      const directResult = await supabaseClient
        .from("members")
        .select("id, nickname, role")
        .eq("id", authState.memberId)
        .maybeSingle();

      if (!directResult.error && directResult.data) {
        verifiedMember = directResult.data;
      } else {
        const rpcResult = await supabaseClient.rpc("get_member_directory_for_app");
        if (!rpcResult.error && Array.isArray(rpcResult.data)) {
          verifiedMember = rpcResult.data.find(item => String(item.id || "") === String(authState.memberId || "")) || null;
        }
      }

      const verifiedNickname = String(verifiedMember?.nickname || "").trim();
      const verifiedRole = String(verifiedMember?.role || authState.role || "visitor").toLowerCase();

      if (!verifiedMember || !verifiedNickname || verifiedNickname !== authState.nickname) {
        handleLogout();
        return false;
      }

      authState.nickname = verifiedNickname;
      authState.role = ["owner", "admin", "member", "visitor", "applying"].includes(verifiedRole)
        ? verifiedRole
        : authState.role;
      authState.initialized = true;

      localStorage.setItem(STORAGE_KEYS.user, authState.nickname);
      localStorage.setItem(STORAGE_KEYS.role, authState.role);
      localStorage.setItem(STORAGE_KEYS.memberId, String(authState.memberId));

      return true;
    } catch (err) {
      console.error("登录状态校验失败：", err);
      handleLogout();
      return false;
    }
  }

  async function loginWithKey(nickname, key) {
    const safeNickname = String(nickname || "").trim();
    const safeKey = String(key || "").trim();

    if (!safeNickname || !safeKey) {
      return { ok: false, message: "请输入昵称和KEY" };
    }

    try {
      const { data, error } = await supabaseClient.rpc("verify_member_login", {
        input_nickname: safeNickname,
        input_code: safeKey
      });

      if (error) {
        console.error("KEY 登录失败：", error);
        return { ok: false, message: error.message || "登录失败，请稍后再试" };
      }

      if (!Array.isArray(data) || !data.length) {
        return { ok: false, message: "昵称或KEY错误" };
      }

      const user = data[0];
      authState.loggedIn = true;
      authState.nickname = String(user.nickname || safeNickname).trim();
      authState.role = String(user.role || "member").toLowerCase();
      authState.memberId = String(user.member_id || "");
      authState.initialized = true;

      localStorage.setItem(STORAGE_KEYS.loggedIn, "true");
      localStorage.setItem(STORAGE_KEYS.user, authState.nickname);
      localStorage.setItem(STORAGE_KEYS.role, authState.role);
      localStorage.setItem(STORAGE_KEYS.memberId, authState.memberId);

      return { ok: true, user };
    } catch (err) {
      console.error("KEY 登录异常：", err);
      return { ok: false, message: err?.message || "登录失败，请稍后再试" };
    }
  }

  function getSingerRewardByRule(singerQuota, isSpecialTask = false) {

    if (SINGING_REWARD_TABLE[count] != null) {
      base = SINGING_REWARD_TABLE[count];
    } else {

    }

    return base + (isSpecialTask ? 10 : 0);

    const count = normalizeSingerCount(singerQuota);

    if (String(taskType || "") === "游戏") return 0;

    const base = Math.min(48 + Math.min(count - 1, 12), 60);

  function extractNumberFromValue(value) {
    const str = String(value ?? "");
    const match = str.match(/\d+/);
    return match ? parseInt(match[0], 10) : Number.POSITIVE_INFINITY;
  }

  function getMemberOrderNumber(memberRaw) {
    const candidates = [
      memberRaw.display_order,
      memberRaw.member_order,
      memberRaw.order_no,
      memberRaw.member_no,
      memberRaw.member_number,
      memberRaw.no,
      memberRaw.code,
      memberRaw.member_code,
      memberRaw.invite_code,
      memberRaw.key_code,
      memberRaw.nickname,
      memberRaw.name
    ];

    for (const item of candidates) {
      const num = extractNumberFromValue(item);
      if (Number.isFinite(num)) return num;
    }
    return Number.POSITIVE_INFINITY;
  }

  function normalizeMemberName(memberRaw, index) {

  function normalizeMembers(data) {

        return {
          id: String(item.id ?? index),
          name: item.name || normalizeMemberName(item, index),
          nickname: item.nickname || item.name || normalizeMemberName(item, index),
          skills: item.skills || "",
          orderNumber
        };
      })
      .sort((a, b) => {
        if (a.orderNumber !== b.orderNumber) return a.orderNumber - b.orderNumber;
        return a.name.localeCompare(b.name, "zh-CN");
      });

  function rebuildMemberOrderMap() {

    members.forEach((member, index) => {

        orderNumber: Number.isFinite(member.orderNumber) ? member.orderNumber : (999999 + index),
        name: member.name || ""
      });

  function rebuildMemberDirectoryMap() {
    memberDirectoryMap = new Map();
    members.forEach(member => {
      memberDirectoryMap.set(String(member.id), {
        id: String(member.id),
        name: member.name || "",
        nickname: member.nickname || member.name || "",
        skills: member.skills || "",
        orderNumber: Number.isFinite(member.orderNumber) ? member.orderNumber : Number.POSITIVE_INFINITY
      });
    });

  function getMemberDisplayNameById(memberId, fallback = "") {
    const hit = memberDirectoryMap.get(String(memberId || ""));

  function hydrateTaskNamesFromDirectory(taskList) {
    (taskList || []).forEach(task => {
      task.producer_name = getMemberDisplayNameById(task.producer_member_id, task.producer_name || "");

      (task.parts || []).forEach(part => {
        part.assigned_member_name = getMemberDisplayNameById(part.assigned_member_id, part.assigned_member_name || "");
      });

      (task.singers || []).forEach(singer => {

      });
    });

  function getSortInfoByMemberId(memberId, fallbackName = "") {

      orderNumber: info?.orderNumber ?? Number.POSITIVE_INFINITY,
      name: info?.name || fallbackName || ""
    };

  function sortSingersByMemberOrder(singers) {
    return [...(singers || [])].sort((a, b) => {
      const aInfo = getSortInfoByMemberId(a.member_id, a.member_name);
      const bInfo = getSortInfoByMemberId(b.member_id, b.member_name);
      if (aInfo.orderNumber !== bInfo.orderNumber) return aInfo.orderNumber - bInfo.orderNumber;
      return String(a.member_name || "").localeCompare(String(b.member_name || ""), "zh-CN");

    const isSinger = (task.singers || []).some(item => String(item.member_id) === String(currentUserId));
    const isProducer = String(task.producer_member_id || "") === String(currentUserId);
    return isSinger || isProducer;

  function isMySingerPending(task) {
    const currentUserId = getCurrentMemberId();
    if (!currentUserId) return false;

    const singer = (task.singers || []).find(item => String(item.member_id) === String(currentUserId));
    if (!singer) return false;
    return !singer.is_submitted;

  function areAllSingersSubmitted(task) {
    return (task.singers || []).length > 0 && (task.singers || []).every(item => !!item.is_submitted);
  }

  function isMyProducerPending(task) {
    const currentUserId = getCurrentMemberId();
    if (!currentUserId) return false;
    if (String(task.producer_member_id || "") !== String(currentUserId)) return false;
    return !task.producer_completed;
  }

  function isMyProducerReadyToMix(task) {
    return isMyProducerPending(task) && areAllSingersSubmitted(task);
  }

  function isMyUnsubmitted(task) {
    return isMySingerPending(task) || isMyProducerReadyToMix(task);
  }

  function getMySingerRecord(task) {
    const currentUserId = getCurrentMemberId();

    return (task.singers || []).find(item => String(item.member_id) === String(currentUserId)) || null;
  }

  function getTaskPendingBadgeText(task) {
    if (isMySingerPending(task)) return "未交音";
    if (isMyProducerReadyToMix(task)) return "未混音";

  }

  function isOnlyWaitingMe(task) {
    const currentUserId = getCurrentMemberId();
    if (!currentUserId) return false;

    const mySinger = (task.singers || []).find(item => String(item.member_id) === String(currentUserId));
    const isProducer = String(task.producer_member_id || "") === String(currentUserId);

    if (mySinger && !mySinger.is_submitted) {
      const otherSingersDone = (task.singers || [])
        .filter(item => String(item.member_id) !== String(currentUserId))
        .every(item => !!item.is_submitted);
      return otherSingersDone;
    }

    if (isProducer) {
      const allSingersDone = (task.singers || []).length > 0 && (task.singers || []).every(item => !!item.is_submitted);
      return allSingersDone && !task.producer_completed;
    }

    return false;

  function canEditSingerRecord(singerRecord, task) {
    const role = getCurrentRole();
    if (isManagerRole(role)) return true;

    const currentUserId = getCurrentMemberId();
    if (!currentUserId) return false;

    if (String(task.created_by || "") === String(currentUserId)) return true;
    return String(singerRecord.member_id) === String(currentUserId);
  }

  function canEditProducerTask(task) {
    const role = getCurrentRole();
    if (isManagerRole(role)) return true;

    const currentUserId = getCurrentMemberId();
    if (!currentUserId) return false;

    if (String(task.created_by || "") === String(currentUserId)) return true;
    return String(task.producer_member_id || "") === String(currentUserId);
  }

  function getComputedTaskStatus(task) {
    const singerQuota = Math.max(1, Number(task.participant_count) || 1);
    const parts = Array.isArray(task.parts) ? task.parts : [];
    const singers = Array.isArray(task.singers) ? task.singers : [];
    const singerCount = singers.length;
    const assignedIds = uniqueAssignedIds(parts);
    const normalizedPartNames = parts.map(part => String(part?.original_name || "").trim());
    const filledPartNames = normalizedPartNames.filter(Boolean);
    const hasPartText = filledPartNames.length > 0;
    const hasEnoughPartRows = parts.length >= singerQuota;
    const hasPlaceholderPart = filledPartNames.some(name => /^(待分配|未分配)$/i.test(name));
    const hasIncompletePartRow = parts.some(part => {
      const originalName = String(part?.original_name || "").trim();
      const assignedId = String(part?.assigned_member_id || "").trim();
      return !originalName || !assignedId;
    });
    const hasTone = !!String(task.project_tone || "").trim();
    const hasProducer = !!String(task.producer_member_id || "").trim();
    const producerCompleted = !!task.producer_completed;
    const hasEffectiveProducer = hasProducer || producerCompleted;
    const hasReleaseDate = !!String(task.release_date || "").trim();
    const hasDisplayLink = !!String(task.display_link || "").trim();
    const allSubmitted = singerCount > 0 && singers.every(item => !!item.is_submitted);

    const readyForPublishedHide =
      hasDisplayLink &&
      singerCount >= singerQuota &&
      hasTone &&
      hasPartText &&
      hasEnoughPartRows &&
      !hasPlaceholderPart &&
      !hasIncompletePartRow &&
      assignedIds.length >= singerCount &&
      allSubmitted &&
      hasEffectiveProducer &&
      producerCompleted &&
      hasReleaseDate;
    if (readyForPublishedHide) return "已发布";
    if (singerCount < singerQuota) return "待认领";
    if (!hasTone) return "未定调";
    if (!hasPartText || !hasEnoughPartRows || hasPlaceholderPart || hasIncompletePartRow || assignedIds.length < singerCount) return "未分词";
    if (!allSubmitted) return "制作中";
    if (!hasEffectiveProducer) return "缺后期";
    if (!producerCompleted) return "制作中";
    if (!hasReleaseDate || !hasDisplayLink) return "待发布";

    return "制作中";
  }

  function transformProjectsToTasks(projectRows, partsRows, singersRows) {
    const partMap = new Map();
    const singerMap = new Map();

    (partsRows || []).forEach(part => {
      const key = String(part.project_id);
      if (!partMap.has(key)) partMap.set(key, []);
      partMap.get(key).push({
        id: part.id,
        part_order: part.part_order,
        original_name: part.original_name,
        assigned_member_id: part.assigned_member_id,
        assigned_member_name: part.members?.nickname || part.members?.name || ""
      });
    });

    (singersRows || []).forEach(singer => {
      const key = String(singer.project_id);
      if (!singerMap.has(key)) singerMap.set(key, []);
      singerMap.get(key).push({
        id: singer.id,
        member_id: singer.member_id,
        member_name: singer.members?.nickname || singer.members?.name || "",
        is_submitted: !!singer.is_submitted,
        submitted_at: singer.submitted_at || null
      });
    });

    const transformed = (projectRows || []).map(project => {
      const id = String(project.id);
      const parts = (partMap.get(id) || []).sort((a, b) => (a.part_order || 0) - (b.part_order || 0));
      const singers = sortSingersByMemberOrder(singerMap.get(id) || []);
      const producerName = project.producer_member?.nickname || project.producer_member?.name || "";

      const isSpecialTask = !!project.is_collective_task;
      const computedSingerBonus = getSingerRewardByRule(project.participant_count, isSpecialTask);
      const computedProducerBonus = getProducerRewardByRule(project.project_type, project.participant_count, isSpecialTask);

      return {
        id,
        project_code: project.project_code || "",
        project_name: project.project_name || "",
        displayName: makeDisplayTaskName(project.project_code, project.project_name),
        project_type: project.project_type || "",
        status: project.status || "",
        participant_count: project.participant_count ?? 1,
        singer_bonus: computedSingerBonus,
        producer_bonus: computedProducerBonus,
        producer_member_id: project.producer_member_id || null,
        producer_name: producerName,
        producer_completed: !!project.producer_completed,
        producer_completed_at: project.producer_completed_at || null,
        release_date: project.release_date || null,
        display_link: project.display_link || "",
        project_tone: project.project_tone || "",
        is_collective_task: !!project.is_collective_task,
        created_by: project.created_by || null,
        created_at: project.created_at || null,
        parts,
        singers
      };
    }).map(task => {
      task.computedStatus = getComputedTaskStatus(task);
      return task;
    }).sort((a, b) => {
      const aCode = parseInt(String(a.project_code).match(/\d+/)?.[0] || "0", 10);
      const bCode = parseInt(String(b.project_code).match(/\d+/)?.[0] || "0", 10);
      return aCode - bCode;
    });

    allProjectSearchItems = transformed;
    return transformed.filter(task => task.computedStatus === "制作中");
  }

  async function loadMembersFromSupabase() {
    try {
      let data = [];
      let error = null;

      const rpcResult = await supabaseClient.rpc("get_member_directory_for_app");
      if (!rpcResult.error && Array.isArray(rpcResult.data)) {
        data = rpcResult.data;
      } else {
        error = rpcResult.error || null;
        const fallbackResult = await supabaseClient
          .from("members")
          .select("id, nickname, name, skills");

        if (!fallbackResult.error && Array.isArray(fallbackResult.data)) {
          data = fallbackResult.data;
          error = null;
        } else {
          error = fallbackResult.error || error;
        }
      }

      if (error && !data.length) {
        console.error("读取成员目录失败：", error);
      }

      members = normalizeMembers(data || []);
      rebuildMemberOrderMap();
      rebuildMemberDirectoryMap();
    } catch (err) {

      rebuildMemberOrderMap();
      rebuildMemberDirectoryMap();
      console.error("成员目录读取失败：", err);

  async function loadProjectsFromSupabase() {
    const detailList = document.getElementById("browseListTask");
    detailList.innerHTML = '<div class="loadingText">正在读取任务...</div>';

    try {
      const { data: projectsData, error: projectsError } = await supabaseClient
        .from("projects")
        .select(`
          *,
          producer_member:members!projects_producer_member_id_fkey (
            id,
            nickname,
            name
          )
        `);

      if (projectsError) throw projectsError;

      const projectIds = (projectsData || []).map(item => item.id);

      let partsData = [];
      let singersData = [];

      if (projectIds.length) {
        const { data: partRows, error: partsError } = await supabaseClient
          .from("project_parts")
          .select(`
            id,
            project_id,
            part_order,
            original_name,
            assigned_member_id,
            members!project_parts_assigned_member_id_fkey (
              id,
              nickname,
              name
            )
          `)
          .in("project_id", projectIds)
          .order("part_order", { ascending: true });

        if (partsError) throw partsError;
        partsData = partRows || [];

        const { data: singerRows, error: singersError } = await supabaseClient
          .from("project_singers")
          .select(`
            id,
            project_id,
            member_id,
            is_submitted,
            submitted_at,
            members!project_singers_member_id_fkey (
              id,
              nickname,
              name
            )
          `)
          .in("project_id", projectIds);

        if (singersError) throw singersError;
        singersData = singerRows || [];
      }

      tasks = transformProjectsToTasks(projectsData || [], partsData, singersData);
      hydrateTaskNamesFromDirectory(tasks);

      const detailTasks = getFilteredTasks(detailSearchKeyword);
      if (!detailTasks.some(task => task.id === activeDetailTaskId)) {
        activeDetailTaskId = detailTasks.length ? detailTasks[0].id : "";
      }

      renderBrowseList();
      renderBrowseDetail();
      applyIncomingStudioJumpIntent();
    } catch (err) {
      console.error("读取 projects 失败：", err);
      detailList.innerHTML = '<div class="taskEmpty">任务读取失败，请检查表结构或权限</div>';
      setBrowseDetailEmpty("任务读取失败");
    }
  }

  let bgNoteTimer = null;

  function intersectsForbidden(x, y, size, forbidden) {
    const padding = 18;
    const left = x - padding;
    const top = y - padding;
    const right = x + size + padding;
    const bottom = y + size + padding;
    return forbidden.some(rect => !(right < rect.left || left > rect.right || bottom < rect.top || top > rect.bottom));
  }

  function spawnBackgroundNote() {
    if (!bgNoteLayer || !taskPanel) return;
    const w = bgNoteLayer.clientWidth;
    const h = bgNoteLayer.clientHeight;
    if (!w || !h) return;

    const panelRect = bgNoteLayer.getBoundingClientRect();
    const forbiddenSelectors = [
      '#browseListPane',
      '.detailHero',
      '.sectionCard',
      '.bottomGrid',
      '#browseDetailFooter',
      '.taskItem',
      '.searchWrap',
      '.taskFilterRow'
    ];
    const forbidden = forbiddenSelectors
      .flatMap(selector => Array.from(taskPanel.querySelectorAll(selector)))
      .map(el => {
        const rect = el.getBoundingClientRect();
        return {
          left: rect.left - panelRect.left,
          top: rect.top - panelRect.top,
          right: rect.right - panelRect.left,
          bottom: rect.bottom - panelRect.top
        };
      })
      .filter(rect => rect.right > 0 && rect.bottom > 0 && rect.left < w && rect.top < h);

    const glyphs = ['♪', '♫', '♩', '♬'];
    const colors = ['rgba(255, 194, 208, 0.46)', 'rgba(255, 214, 161, 0.46)', 'rgba(188, 223, 255, 0.44)', 'rgba(205, 237, 210, 0.44)', 'rgba(226, 205, 255, 0.44)'];
    const glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
    const size = Math.round(16 + Math.random() * 24);
    let x = 0;
    let y = 0;
    let found = false;

    for (let i = 0; i < 70; i += 1) {
      x = 10 + Math.random() * Math.max(30, w - size - 20);
      y = 10 + Math.random() * Math.max(30, h - size - 20);
      if (!intersectsForbidden(x, y, size, forbidden)) {
        found = true;
        break;
      }
    }

    if (!found) return;

    const note = document.createElement('span');
    note.className = 'bgNote';
    note.textContent = glyph;
    note.style.left = `${x}px`;
    note.style.top = `${y}px`;
    note.style.fontSize = `${size}px`;
    note.style.setProperty('--note-color', colors[Math.floor(Math.random() * colors.length)]);
    note.style.setProperty('--note-duration', `${2.4 + Math.random() * 2.1}s`);
    note.style.setProperty('--note-drift-x', `${-22 + Math.random() * 44}px`);
    note.style.setProperty('--note-drift-y', `${-52 - Math.random() * 62}px`);
    note.style.setProperty('--note-rot-start', `${-14 + Math.random() * 16}deg`);
    note.style.setProperty('--note-rot-end', `${-10 + Math.random() * 22}deg`);
    note.style.setProperty('--note-scale', `${0.84 + Math.random() * 0.34}`);

    bgNoteLayer.appendChild(note);
    note.addEventListener('animationend', () => note.remove(), { once: true });
  }

  function scheduleBackgroundNote() {
    if (bgNoteTimer) window.clearTimeout(bgNoteTimer);
    const delay = 180 + Math.random() * 320;
    bgNoteTimer = window.setTimeout(() => {
      const burst = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < burst; i += 1) {
        window.setTimeout(() => spawnBackgroundNote(), i * 70);
      }
      scheduleBackgroundNote();
    }, delay);
  }

  function restartBackgroundNotes() {
    if (bgNoteLayer) bgNoteLayer.innerHTML = '';
    for (let i = 0; i < 10; i += 1) {
      window.setTimeout(() => spawnBackgroundNote(), i * 70);
    }
    scheduleBackgroundNote();
  }

  function normalizeSearchQuery(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/[｜|,，/]/g, " ")
      .trim()
      .split(/\s+/)
      .filter(Boolean);
  }

  function getFilteredTasks(keyword) {
    const tokens = normalizeSearchQuery(keyword);

    return tasks.filter(task => {
      if (taskFilterMode === "mine" && !isMyProject(task)) return false;
      if (taskFilterMode === "unsubmitted" && !isMyUnsubmitted(task)) return false;
      if (taskFilterMode === "onlyme" && !isOnlyWaitingMe(task)) return false;

      if (!tokens.length) return true;

      const partText = (task.parts || [])
        .map(item => `${item.original_name || ""} ${item.assigned_member_name || ""}`)
        .join(" ");

      const singerText = (task.singers || [])
        .map(item => item.member_name || "")
        .join(" ");

      const haystack = [
        task.displayName,
        task.project_name,
        task.project_code,
        task.project_type,
        task.producer_name,
        task.project_tone,
        task.release_date ? formatDate(task.release_date) : "",
        singerText,
        partText
      ].join(" ").toLowerCase();

      return tokens.every(token => haystack.includes(token));
    });
  }

  function taskMatchesDetailSearchTokens(task, tokens) {

      task.project_code,

      task.project_tone,
      task.release_date ? formatDate(task.release_date) : "",

    ].join(" ").toLowerCase();
