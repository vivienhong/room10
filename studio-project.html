  function getTodoLocationFromComputedStatus(status) {
    const text = String(status || "").trim();
    if (text === "待认领" || text === "缺后期") return { area:"todo", label:"工作间待处理 · 待认领", page:PAGE_LINKS.studioTodo, filter:"待认领" };
    if (text === "未分词") return { area:"todo", label:"工作间待处理 · 待分词", page:PAGE_LINKS.studioTodo, filter:"待分词" };
    if (text === "未定调") return { area:"todo", label:"工作间待处理 · 待定调", page:PAGE_LINKS.studioTodo, filter:"待定调" };
    if (text === "待发布") return { area:"todo", label:"工作间待处理 · 待发布", page:PAGE_LINKS.studioTodo, filter:"待发布" };
    return null;
  }

  function getTaskDetailFilterLabels(task) {
    const labels = ["全部"];
    if (isMyProject(task)) labels.push("我参与");
    if (isMyUnsubmitted(task)) labels.push("未交音");
    if (isOnlyWaitingMe(task)) labels.push("只等我");
    return labels;
  }

  function getTaskSearchPrimaryLocation(task) {
    const status = String(task?.computedStatus || getComputedTaskStatus(task) || "").trim();
    const todoLocation = getTodoLocationFromComputedStatus(status);
    if (todoLocation) return todoLocation;

    if (status === "已发布") {
      return { area:"honor", label:"荣誉墙 · 作品展览", page:PAGE_LINKS.honor, filter:"作品展览" };
    }

    const detailLabels = getTaskDetailFilterLabels(task).join(" / ");
    return { area:"project", label:`工作间任务详情 · ${detailLabels}`, page:PAGE_LINKS.studioProject, filter:"all" };
  }

  function getSearchLocationResults(keyword) {
    const tokens = normalizeSearchQuery(keyword);
    if (!tokens.length) return [];

    const seen = new Set();
    return (allProjectSearchItems || [])
      .filter(task => taskMatchesDetailSearchTokens(task, tokens))
      .map(task => ({ task, location:getTaskSearchPrimaryLocation(task) }))
      .filter(({ task, location }) => {
        const id = String(task?.id || "");
        if (!id || seen.has(id)) return false;
        seen.add(id);

        if (location.area === "project") {
          const inCurrentList = tasks.some(item => String(item.id) === id);
          if (!inCurrentList) return true;
          if (taskFilterMode === "all") return false;
          if (taskFilterMode === "mine" && isMyProject(task)) return false;
          if (taskFilterMode === "unsubmitted" && isMyUnsubmitted(task)) return false;
          if (taskFilterMode === "onlyme" && isOnlyWaitingMe(task)) return false;
        }
        return true;
      })
      .slice(0, 8);
  }

  function buildSearchLocationHtml(keyword) {
    const safeKeyword = escapeHtml(String(keyword || "").trim());
    const results = getSearchLocationResults(keyword);

    if (!results.length) {
      return `
        <div class="searchLocationBox">
          <div class="searchLocationTitle">没有找到「${safeKeyword}」相关项目</div>
          <div class="searchLocationDesc">任务详情、待处理和作品展览里都没有匹配结果。</div>
        </div>
      `;
    }

    return `
      <div class="searchLocationBox">
        <div class="searchLocationTitle">当前位置没有找到「${safeKeyword}」</div>
        <div class="searchLocationDesc">但在下面位置找到相关项目：</div>
        <div class="searchLocationList">
          ${results.map(({ task, location }) => `
            <button
              type="button"
              class="searchLocationItem"
              data-search-area="${escapeHtml(location.area)}"
              data-search-page="${escapeHtml(location.page)}"
              data-search-filter="${escapeHtml(location.filter || "")}" 
              data-task-id="${escapeHtml(task.id)}"
            >
              <span class="searchLocationWhere">${escapeHtml(location.label)}</span>
              <span class="searchLocationName">${escapeHtml(task.displayName || task.project_name || "未命名项目")}</span>
            </button>
          `).join("")}
        </div>
      </div>
    `;
  }

  function bindSearchLocationActions() {
    const list = document.getElementById("browseListTask");
    if (!list) return;

    list.querySelectorAll(".searchLocationItem").forEach(btn => {
      btn.addEventListener("click", () => {
        const area = String(btn.dataset.searchArea || "").trim();
        const page = String(btn.dataset.searchPage || "").trim();
        const taskId = String(btn.dataset.taskId || "").trim();

        if (area === "project") {
          taskFilterMode = "all";
          updateTaskFilterButtons();
          activeDetailTaskId = taskId;
          renderBrowseList();
          renderBrowseDetail();
          queueStudioJumpFlash(taskId);
          return;
        }

        if (page && taskId) {
          try {
            localStorage.setItem(STORAGE_KEYS.studioJumpIntent, JSON.stringify({
              page,
              taskId,
              keyword:detailSearchKeyword,
              sourcePage:CURRENT_STUDIO_PAGE,
              targetArea:area,
              createdAt:Date.now()
            }));
          } catch (err) {
            console.error("保存搜索跳转意图失败：", err);
          }
          window.location.href = page;
        }
      });
    });
  }

  function renderBrowseList() {
    const list = document.getElementById("browseListTask");
    const listData = getFilteredTasks(detailSearchKeyword);
    const activeId = activeDetailTaskId;

    list.innerHTML = "";

    if (!listData.length) {
      const keyword = String(detailSearchKeyword || "").trim();
      list.innerHTML = keyword
        ? buildSearchLocationHtml(keyword)
        : `<div class="taskEmpty">暂无制作中项目</div>`;
      bindSearchLocationActions();
      return;
    }

    listData.forEach(task => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.taskId = String(task.id || "");
      btn.className = "taskItem" + (task.id === activeId ? " active" : "");

      if (isMyProject(task)) btn.classList.add("myProject");
      if (isMyUnsubmitted(task)) btn.classList.add("unsubmittedWarn");

      const singerText = task.singers.length ? sortSingersByMemberOrder(task.singers).map(s => s.member_name).join("、") : "暂无";
      const mySingerRecord = getMySingerRecord(task);

      const badgeHtml = [
        isMyProject(task) ? `<span class="taskMiniBadge mine">我参与</span>` : ``,
        getTaskPendingBadgeText(task) ? `<span class="taskMiniBadge warn">${escapeHtml(getTaskPendingBadgeText(task))}</span>` : ``,
        isOnlyWaitingMe(task) ? `<span class="taskMiniBadge onlyme">只等我</span>` : ``
      ].filter(Boolean).join("");

      const quickActionHtml = mySingerRecord
        ? `<span class="taskQuickActions"><button class="taskQuickBtn ${mySingerRecord.is_submitted ? "done" : ""}" type="button" data-quick-singer-record-id="${escapeHtml(mySingerRecord.id)}" data-current="${mySingerRecord.is_submitted ? "1" : "0"}">${mySingerRecord.is_submitted ? "撤回" : "交音"}</button></span>`
        : ``;

      btn.innerHTML = `
        <div class="taskTitleLine">
          <span class="taskItemName">
            <span class="taskNameText">${escapeHtml(task.displayName)}</span>
          </span>
        </div>
        <div class="taskBadgeLine">${badgeHtml}${quickActionHtml}</div>
        <span class="taskItemInfo">演唱者：${escapeHtml(singerText)}</span>
      `;

      btn.addEventListener("click", () => {
        activeDetailTaskId = task.id;
        renderBrowseList();
        renderBrowseDetail();
      });

      list.appendChild(btn);
    });

    list.querySelectorAll("[data-quick-singer-record-id]").forEach(btn => {
      btn.addEventListener("click", async (event) => {
        event.stopPropagation();
        const singerRecordId = btn.dataset.quickSingerRecordId;
        const current = btn.dataset.current === "1";
        await toggleSingerSubmitted(singerRecordId, current);
      });
    });
  }

  function setBrowseDetailEmpty(message = "暂无任务") {
    document.getElementById("browseDetailTitleTask").textContent = message;
    document.getElementById("browseDetailStatusTask").textContent = "";
    document.getElementById("browseDetailContentTask").innerHTML = `<div class="taskEmpty">${escapeHtml(message)}</div>`;
    if (browseEditBtnTask) {
      browseEditBtnTask.style.display = "none";
      browseEditBtnTask.disabled = true;
    }
  }

  function buildSingerCardHtml(item, task) {
    const canEdit = canEditSingerRecord(item, task);
    const isMe = String(item.member_id) === String(getCurrentMemberId());
    const parts = getPartsForMember(task, item.member_id);
    const partText = parts.length ? parts.join(" / ") : "未分配部分";

    return `
      <div class="assignmentCompactRow ${isMe ? "mineCard" : ""}">
        <div class="assignmentNameInline">
          <span class="assignmentNameText">${escapeHtml(item.member_name || "未命名成员")}</span>
        </div>
        <div class="assignmentPartText">${escapeHtml(partText)}</div>
        ${
          canEdit
            ? `<button class="tinyActionBtn ${item.is_submitted ? "done" : ""}" data-singer-record-id="${escapeHtml(item.id)}" data-current="${item.is_submitted ? "1" : "0"}">${item.is_submitted ? "撤回" : "交音"}</button>`
            : `<button class="tinyActionBtn readonly" type="button" disabled>${isMe ? (item.is_submitted ? "已交" : "待交") : "成员"}</button>`
        }
      </div>
    `;
  }

  function buildProducerCardHtml(task) {
    if (!task.producer_member_id) {
      return `
        <div class="producerCard is-empty">
          <div class="producerInfo">
            <div class="producerNameInline">暂无</div>
          </div>
        </div>
      `;
    }

    const canEdit = canEditProducerTask(task);
    const allSingersDone = areAllSingersSubmitted(task);

    let buttonHtml = "";

    if (!allSingersDone) {
      buttonHtml = `<button class="tinyActionBtn waiting" type="button" disabled>等待交音</button>`;
    } else if (task.producer_completed) {
      buttonHtml = canEdit
        ? `<button class="tinyActionBtn done" data-project-id="${escapeHtml(task.id)}" data-current="1">撤</button>`
        : `<button class="tinyActionBtn readonly" type="button" disabled>已交付</button>`;
    } else {
      buttonHtml = canEdit
        ? `<button class="tinyActionBtn" data-project-id="${escapeHtml(task.id)}" data-current="0">交付</button>`
        : `<button class="tinyActionBtn readonly" type="button" disabled>未交付</button>`;
    }

    return `
      <div class="producerCard">
        <div class="producerInfo">
          <div class="producerNameInline">${escapeHtml(task.producer_name || "暂无")}</div>
        </div>
        <div class="producerRight">
          ${buttonHtml}
        </div>
      </div>
    `;
  }

  function canEditTaskFromDetail(task) {
    const role = getCurrentRole();
    if (isManagerRole(role)) return true;

    const currentUserId = getCurrentMemberId();
    if (!currentUserId || !task) return false;

    if (String(task.created_by || "") === String(currentUserId)) return true;
    if (String(task.producer_member_id || "") === String(currentUserId)) return true;
    return (task.singers || []).some(item => String(item.member_id) === String(currentUserId));
  }

  function getTaskById(taskId) {
    return tasks.find(item => String(item.id) === String(taskId)) || null;
  }

  function getTaskDisplayName(task) {
    return task?.displayName || makeDisplayTaskName(task?.project_code, task?.project_name);
  }

  function getTaskTypeOptions(currentValue = "") {
    const fixed = ["披4", "披哥", "浪姐", "其他", "游戏"];
    const current = String(currentValue || "").trim();
    return current && !fixed.includes(current) ? [current, ...fixed] : fixed;
  }

  function formatDateForInput(dateString) {
    if (!dateString) return "";
    const date = new Date(dateString);
    if (Number.isNaN(date.getTime())) return "";
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function getEditableSingerIds() {
    return Array.from(editSingerMemberList.querySelectorAll('.memberCheckItem.active[data-member-id]')).map(btn => String(btn.dataset.memberId || ""));
  }

  function renderEditSingerMemberList(selectedIds = []) {
    const selectedSet = new Set((selectedIds || []).map(String));
    editSingerMemberList.innerHTML = members.map(member => {
      const memberId = String(member.id || "");
      const label = `${member.nickname || member.name || "未命名成员"}${member.member_code ? `（${member.member_code}）` : ""}`;
      return `<button type="button" class="memberCheckItem ${selectedSet.has(memberId) ? "active" : ""}" data-member-id="${escapeHtml(memberId)}">${escapeHtml(label)}</button>`;
    }).join("");
  }

  function getCurrentPartDraftFromDom() {
    return Array.from(editPartRows.querySelectorAll(".taskEditRow")).map((row, index) => {
      const memberInput = row.querySelector('[data-field="assigned_member_id"]');
      return {
        original_name: String(row.querySelector('[data-field="original_name"]')?.value || "").trim(),
        assigned_member_id: String(memberInput?.dataset?.memberId || "").trim(),
        assigned_member_name: String(memberInput?.value || "").trim(),
        part_order: index + 1
      };
    });
  }

  function syncEditPartRowsToQuota(preserveCurrent = true) {
    const quota = Math.max(1, Math.floor(Number(editSingerQuota.value) || 1));
    const currentRows = preserveCurrent ? getCurrentPartDraftFromDom() : editPartDraftRows;
    const nextRows = [];
    for (let i = 0; i < quota; i++) {
      const source = currentRows[i] || editPartDraftRows[i] || {};
      nextRows.push({
        original_name: String(source.original_name || "").trim(),
        assigned_member_id: String(source.assigned_member_id || "").trim(),
        assigned_member_name: String(source.assigned_member_name || "").trim(),
        part_order: i + 1
      });
    }
    editPartDraftRows = nextRows;
  }

  function canResizePartRowsToQuota(nextQuota, { preserveCurrent = true } = {}) {
    const safeQuota = Math.max(1, Math.floor(Number(nextQuota) || 1));
    const currentRows = preserveCurrent ? getCurrentPartDraftFromDom() : editPartDraftRows;
    if ((currentRows || []).length <= safeQuota) return { ok: true };

    const trimmedRows = currentRows.slice(safeQuota);
    if (!hasMeaningfulPartContent(trimmedRows)) return { ok: true };

    return {
      ok: false,
      message: "减少演唱人数后，超出行里还有歌词分配内容，请先清空这些行再保存。"
    };
  }

  function getAllowedSingerIdsForRow(allSingerIds, rowIndex) {
    const selectedRows = getCurrentPartDraftFromDom();
    const usedByOthers = new Set(
      selectedRows
        .filter((row, idx) => idx !== rowIndex)
        .map(row => String(row.assigned_member_id || "").trim())
        .filter(Boolean)
    );
    return allSingerIds.filter(id => !usedByOthers.has(String(id)));
  }

  function renderEditPartRows() {
    syncEditPartRowsToQuota(true);
    const singerIds = getEditableSingerIds();

    editPartRows.innerHTML = editPartDraftRows.map((row, index) => {
      const allowedSingerIds = getAllowedSingerIdsForRow(singerIds, index);
      const rawAssignedId = String(row.assigned_member_id || "");
      const assignedId = allowedSingerIds.includes(rawAssignedId) ? rawAssignedId : "";
      const assignedName = assignedId
        ? getMemberDisplayNameById(assignedId, row.assigned_member_name || "")
        : String(row.assigned_member_name || "");
      return `
        <div class="taskEditRow partRow" data-row-index="${index}">
          <label class="taskEditField">
            <input class="taskEditInput" data-field="original_name" type="text" value="${escapeHtml(row.original_name || "")}" placeholder="填写歌词分配 / 原唱名字" />
          </label>
          <div class="partMemberField">
            <input class="taskEditInput" data-field="assigned_member_id" data-member-id="${escapeHtml(assignedId)}" autocomplete="off" type="text" value="${escapeHtml(assignedName)}" placeholder="填写成员名字或下拉选择" />
            <div class="memberSuggestBox"></div>
          </div>
          <button class="taskEditRemoveBtn" type="button" data-clear-part-member="${index}" title="清空成员名字">×</button>
        </div>
      `;
    }).join("");

    refreshAllPartSuggestions();
  }

  function getAllowedSingerMembersForRow(rowIndex) {
    const singerIds = getEditableSingerIds();
    const allowedSingerIds = getAllowedSingerIdsForRow(singerIds, rowIndex);
    return members.filter(member => allowedSingerIds.includes(String(member.id || "")));
  }

  function renderPartSuggestForRow(row) {
    if (!row) return;
    const idx = Number(row.dataset.rowIndex || -1);
    const box = row.querySelector('.memberSuggestBox');
    const input = row.querySelector('[data-field="assigned_member_id"]');
    if (!box || !input) return;
    const keyword = String(input.value || "").trim().toLowerCase();
    const list = getAllowedSingerMembersForRow(idx).filter(member => {
      const label = `${member.nickname || member.name || ""}${member.member_code ? ` ${member.member_code}` : ""}`.toLowerCase();
      return !keyword || label.includes(keyword);
    });
    if (!list.length) {
      box.innerHTML = `<div class="memberSuggestEmpty">暂无可选成员</div>`;
      return;
    }
    box.innerHTML = list.map(member => {
      const memberId = String(member.id || "");
      const label = `${member.nickname || member.name || "未命名成员"}${member.member_code ? `（${member.member_code}）` : ""}`;
      return `<button type="button" class="memberSuggestItem" data-row-member-id="${escapeHtml(memberId)}">${escapeHtml(label)}</button>`;
    }).join("");
  }

  function refreshAllPartSuggestions() {
    Array.from(editPartRows.querySelectorAll('.taskEditRow')).forEach(renderPartSuggestForRow);
  }

  function bindEditPartRowButtons() {
    if (editPartRows.dataset.bound === "1") return;
    editPartRows.dataset.bound = "1";

    editPartRows.addEventListener("click", (event) => {
      const clearBtn = event.target.closest("[data-clear-part-member]");
      if (clearBtn) {
        event.preventDefault();
        event.stopPropagation();
        const idx = Number(clearBtn.dataset.clearPartMember);
        const domRows = getCurrentPartDraftFromDom();
        if (!Number.isFinite(idx) || !domRows[idx]) return;
        domRows[idx].assigned_member_id = "";
        domRows[idx].assigned_member_name = "";
        editPartDraftRows = domRows;
        const row = clearBtn.closest('.taskEditRow');
        const input = row?.querySelector('[data-field="assigned_member_id"]');
        if (input) {
          input.dataset.memberId = "";
          input.value = "";
        }
        renderEditPartRows();
        return;
      }

      const suggestItem = event.target.closest("[data-row-member-id]");
      if (suggestItem) {
        const row = suggestItem.closest(".taskEditRow");
        const input = row?.querySelector('[data-field="assigned_member_id"]');
        if (!row || !input) return;
        const memberId = String(suggestItem.dataset.rowMemberId || "");
        input.dataset.memberId = memberId;
        input.value = getMemberDisplayNameById(memberId, "");
        editPartDraftRows = getCurrentPartDraftFromDom().map(item => ({
          ...item,
          assigned_member_name: item.assigned_member_id ? getMemberDisplayNameById(item.assigned_member_id, item.assigned_member_name || "") : ""
        }));
        renderEditPartRows();
        return;
      }
    });

    editPartRows.addEventListener("input", (event) => {
      const field = event.target?.dataset?.field;
      if (field === "original_name") {
        editPartDraftRows = getCurrentPartDraftFromDom();
        return;
      }
      if (field === "assigned_member_id") {
        const input = event.target;
        input.dataset.memberId = "";
        const row = input.closest('.taskEditRow');
        if (row) {
          renderPartSuggestForRow(row);
          row.querySelector('.memberSuggestBox')?.classList.add('show');
        }
      }
    });

    editPartRows.addEventListener("focusin", (event) => {
      if (event.target?.dataset?.field === "assigned_member_id") {
        const row = event.target.closest('.taskEditRow');
        if (row) {
          renderPartSuggestForRow(row);
          row.querySelector('.memberSuggestBox')?.classList.add('show');
        }
      }
    });

    editPartRows.addEventListener("focusout", (event) => {
      const row = event.target.closest('.taskEditRow');
      if (!row) return;
      setTimeout(() => {
        if (!row.contains(document.activeElement)) {
          row.querySelector('.memberSuggestBox')?.classList.remove('show');
          const input = row.querySelector('[data-field="assigned_member_id"]');
          const typed = String(input?.value || "").trim();
          const memberId = String(input?.dataset?.memberId || "").trim();
          if (!memberId && typed) {
            if (typed !== "") {
              input.value = "";
            }
          }
          editPartDraftRows = getCurrentPartDraftFromDom().map(item => ({
            ...item,
            assigned_member_name: item.assigned_member_id ? getMemberDisplayNameById(item.assigned_member_id, item.assigned_member_name || "") : ""
          }));
          renderEditPartRows();
        }
      }, 120);
    });
  }

  function populateTaskTypeSelect(currentValue) {
    const options = getTaskTypeOptions(currentValue);
    editTaskType.innerHTML = options.map(item => `<option value="${escapeHtml(item)}" ${item === currentValue ? "selected" : ""}>${escapeHtml(item)}</option>`).join("");
  }

  function getMixerEligibleMembers() {
    return (members || []).filter(member => {
      const skillText = String(member?.skills || member?.skill || "").toLowerCase();
      return skillText.includes("混音") || skillText.includes("mix");
    }).sort((a, b) => {
      const aCode = String(a?.member_code || "");
      const bCode = String(b?.member_code || "");
      return aCode.localeCompare(bCode, "zh-CN", { numeric: true, sensitivity: "base" });
    });
  }

  function renderProducerPicker(selectedId = "") {
    if (!editProducerPicker) return;
    currentEditingProducerMemberId = String(selectedId || "").trim();
    const mixerMembers = getMixerEligibleMembers();

    if (!mixerMembers.length) {
      editProducerPicker.innerHTML = `<div class="taskEditPickerEmpty">暂无带“混音”技能的成员可选</div>`;
      return;
    }

    const options = mixerMembers.map(member => ({
      id: String(member.id || ""),
      label: `${member.nickname || member.name || "未命名成员"}${member.member_code ? `（${member.member_code}）` : ""}`,
      ghost: false
    }));

    editProducerPicker.innerHTML = options.map(item => `
      <button
        type="button"
        class="taskEditPickerBtn ${item.ghost ? "ghost" : ""} ${String(item.id) === currentEditingProducerMemberId ? "active" : ""}"
        data-producer-option="${escapeHtml(item.id)}"
      >${escapeHtml(item.label)}</button>
    `).join("");
  }

  function isEachSingGameProject(projectName, projectType) {
    const safeName = String(projectName || "").trim();
    const safeType = String(projectType || "").trim();
    return safeType === "游戏" && safeName.includes("各唱各");
  }

  function findDefaultYangProducerId() {
    const mixerMembers = getMixerEligibleMembers();
    const exact = mixerMembers.find(member => {
      const nickname = String(member?.nickname || "").trim();
      const name = String(member?.name || "").trim();
      return nickname === "扬" || name === "扬";
    });
    if (exact) return String(exact.id || "");

    const fuzzy = mixerMembers.find(member => {
      const nickname = String(member?.nickname || "").trim();
      const name = String(member?.name || "").trim();
      return nickname.includes("扬") || name.includes("扬");
    });
    return String(fuzzy?.id || "");
  }

  function syncProducerByEachSingRule({ force = false } = {}) {
    const isEachSing = isEachSingGameProject(editTaskName?.value, editTaskType?.value);
    if (!isEachSing) return false;
    const yangId = findDefaultYangProducerId();
    if (!yangId) return false;
    if (force || !String(currentEditingProducerMemberId || "").trim() || String(currentEditingProducerMemberId) !== String(yangId)) {
      currentEditingProducerMemberId = String(yangId);
      renderProducerPicker(currentEditingProducerMemberId);
      return true;
    }
    return false;
  }

  function getMeaningfulPartRows(rows) {
    return (rows || []).filter(row => String(row?.original_name || "").trim() || String(row?.assigned_member_id || "").trim());
  }

  function hasMeaningfulPartContent(rows) {
    return getMeaningfulPartRows(rows).length > 0;
  }

  function getRemovedSingerAssignments(selectedSingerIds, rows) {
    const selectedSet = new Set((selectedSingerIds || []).map(String));
    return (rows || []).filter(row => {
      const assignedId = String(row?.assigned_member_id || "").trim();
      return assignedId && !selectedSet.has(assignedId);
    });
  }

  function setTaskEditMode(isCollective) {
    const special = !!isCollective;
    if (editIsCollectiveTask) editIsCollectiveTask.value = special ? "1" : "0";
    if (editTaskModeNormalBtn) editTaskModeNormalBtn.classList.toggle("active", !special);
    if (editTaskModeSpecialBtn) editTaskModeSpecialBtn.classList.toggle("active", special);
  }

  function buildTaskEditSnapshot(task) {
    const safeTask = task || {};
    return {
      taskId: String(safeTask.id || ""),
      project_code: String(safeTask.project_code || ""),
      project_name: String(safeTask.project_name || ""),
      project_type: String(safeTask.project_type || "其他"),
      is_collective_task: !!safeTask.is_collective_task,
      participant_count: String(Math.max(1, Number(safeTask.participant_count) || 1)),
      project_tone: String(safeTask.project_tone || ""),
      release_date: formatDateForInput(safeTask.release_date),
      producer_member_id: String(safeTask.producer_member_id || ""),
      singer_ids: (safeTask.singers || []).map(item => String(item.member_id || "")).filter(Boolean),
      parts: (safeTask.parts || []).length
        ? (safeTask.parts || []).map((part, index) => ({
            original_name: String(part.original_name || ""),
            assigned_member_id: String(part.assigned_member_id || ""),
            assigned_member_name: String(part.assigned_member_name || ""),
            part_order: index + 1
          }))
        : []
    };
  }

  function applyTaskEditSnapshot(snapshot) {
    if (!snapshot) return;
    currentEditingTaskId = String(snapshot.taskId || "");
    editTaskCode.value = snapshot.project_code || "";
    editTaskName.value = snapshot.project_name || "";
    populateTaskTypeSelect(snapshot.project_type || "其他");
    setTaskEditMode(!!snapshot.is_collective_task);
    editSingerQuota.value = String(snapshot.participant_count || "1");
    editSingerQuota.dataset.prevQuota = String(snapshot.participant_count || "1");
    editProjectTone.value = snapshot.project_tone || "";
    editReleaseDate.value = snapshot.release_date || "";
    currentEditingProducerMemberId = String(snapshot.producer_member_id || "");
    renderProducerPicker(currentEditingProducerMemberId);
    syncProducerByEachSingRule({ force: isEachSingGameProject(snapshot.project_name, snapshot.project_type) });

    renderEditSingerMemberList((snapshot.singer_ids || []).map(String));
    editPartDraftRows = (snapshot.parts || []).map((part, index) => ({
      original_name: String(part.original_name || ""),
      assigned_member_id: String(part.assigned_member_id || ""),
      assigned_member_name: String(part.assigned_member_name || ""),
      part_order: index + 1
    }));

    syncEditPartRowsToQuota(false);
    renderEditPartRows();
    bindEditPartRowButtons();
  }

  function restoreTaskEditOriginalState() {
    if (!taskEditOriginalSnapshot) return;
    const snapshotClone = JSON.parse(JSON.stringify(taskEditOriginalSnapshot));
    applyTaskEditSnapshot(snapshotClone);
  }

  function openTaskEditModal(taskId = activeDetailTaskId) {
    const task = getTaskById(taskId);
    if (!task) {
      showToast("无法编辑", "当前未找到可编辑的项目。");
      return;
    }

    if (!canEditTaskFromDetail(task)) {
      showToast("暂无权限", "当前账号不能修改这个项目。");
      return;
    }

    taskEditOriginalSnapshot = JSON.parse(JSON.stringify(buildTaskEditSnapshot(task)));

    taskEditTitle.textContent = `编辑｜${getTaskDisplayName(task)}`;
    taskEditSubtitle.textContent = "保存后会自动按最新数据重新归类状态";
    applyTaskEditSnapshot(taskEditOriginalSnapshot);

    taskEditMask.classList.add("show");
    taskEditMask.setAttribute("aria-hidden", "false");
  }

  function closeTaskEditModal(shouldRestore = false) {
    if (shouldRestore && taskEditOriginalSnapshot) {
      restoreTaskEditOriginalState();
    }

    taskEditMask.classList.remove("show");
    taskEditMask.setAttribute("aria-hidden", "true");

    currentEditingTaskId = "";
    currentEditingProducerMemberId = "";
    editPartDraftRows = [];
    taskEditOriginalSnapshot = null;
  }

  function collectTaskEditPayload() {
    const task = getTaskById(currentEditingTaskId);
    const singerQuota = Math.max(1, Math.floor(Number(editSingerQuota.value) || 1));
    const selectedSingerIds = getEditableSingerIds();
    const projectName = String(editTaskName.value || "").trim();
    const projectType = String(editTaskType.value || "").trim() || "其他";
    const isSpecialTask = String(editIsCollectiveTask?.value || "0") === "1";
    const isEachSing = isEachSingGameProject(projectName, projectType);

    if (!task) {
      throw new Error("未找到正在编辑的项目。");
    }

    if (!projectName) {
      throw new Error("请先填写歌名。");
    }

    if (selectedSingerIds.length > singerQuota) {
      throw new Error("已勾选的演唱者人数不能超过“演唱人数”。");
    }

    const rawPartRows = getCurrentPartDraftFromDom()
      .map((row, index) => ({
        original_name: String(row.original_name || "").trim(),
        assigned_member_id: String(row.assigned_member_id || "").trim() || null,
        assigned_member_name: String(row.assigned_member_name || "").trim(),
        part_order: index + 1
      }));

    const removedSingerAssignments = getRemovedSingerAssignments(selectedSingerIds, rawPartRows);
    if (removedSingerAssignments.length) {
      throw new Error("你移除了仍在歌词分配中使用的演唱者，请先修改对应分配后再保存。");
    }

    const usedAssignedIds = rawPartRows.map(row => row.assigned_member_id).filter(Boolean);
    if (new Set(usedAssignedIds).size !== usedAssignedIds.length) {
      throw new Error("同一个项目里的歌词分配，演唱成员不能重复。");
    }

    const partRows = rawPartRows.filter(row => row.original_name || row.assigned_member_id);
    const duplicateNames = partRows
      .map(row => String(row.original_name || "").trim())
      .filter(Boolean)
      .filter((name, index, arr) => arr.indexOf(name) !== index);

    if (!isEachSing && duplicateNames.length) {
      throw new Error(`当前项目不是“各唱各”，歌词分配左侧不能重复：${[...new Set(duplicateNames)].join("、")}`);
    }

    const finalProducerId = isEachSing
      ? (findDefaultYangProducerId() || String(currentEditingProducerMemberId || "").trim() || null)
      : (String(currentEditingProducerMemberId || "").trim() || null);

    return {
      projectId: task.id,
      isEachSing,
      projectPayload: {
        project_name: projectName,
        project_type: projectType,
        is_collective_task: isSpecialTask,
        participant_count: singerQuota,
        singer_bonus: getSingerRewardByRule(singerQuota, isSpecialTask),
        producer_bonus: getProducerRewardByRule(projectType, singerQuota, isSpecialTask),
        project_tone: String(editProjectTone.value || "").trim() || null,
        release_date: editReleaseDate.value || null,
        producer_member_id: finalProducerId
      },
      selectedSingerIds,
      existingSingerRecords: task.singers || [],
      partRows,
      singerBonus: getSingerRewardByRule(singerQuota, isSpecialTask),
      producerBonus: getProducerRewardByRule(projectType, singerQuota, isSpecialTask)
    };
  }

  async function saveTaskEditModal() {
    try {
      const payload = collectTaskEditPayload();

      taskEditSaveBtn.disabled = true;
      taskEditSaveBtn.textContent = "保存中...";

      const { error: projectError } = await supabaseClient
        .from("projects")
        .update(payload.projectPayload)
        .eq("id", payload.projectId);

      if (projectError) throw projectError;

      const existingSingerMap = new Map((payload.existingSingerRecords || []).map(item => [String(item.member_id), item]));
      const selectedSet = new Set(payload.selectedSingerIds.map(String));

      const removeSingerRecordIds = (payload.existingSingerRecords || [])
        .filter(item => !selectedSet.has(String(item.member_id)))
        .map(item => item.id);

      if (removeSingerRecordIds.length) {
        const { error: deleteSingerError } = await supabaseClient
          .from("project_singers")
          .delete()
          .in("id", removeSingerRecordIds);

        if (deleteSingerError) throw deleteSingerError;
      }

      const insertSingerRows = payload.selectedSingerIds
        .filter(memberId => !existingSingerMap.has(String(memberId)))
        .map(memberId => ({
          project_id: payload.projectId,
          member_id: memberId,
          is_submitted: false,
          submitted_at: null
        }));

      if (insertSingerRows.length) {
        const { error: insertSingerError } = await supabaseClient
          .from("project_singers")
          .insert(insertSingerRows);

        if (insertSingerError) throw insertSingerError;
      }

      const { error: deletePartsError } = await supabaseClient
        .from("project_parts")
        .delete()
        .eq("project_id", payload.projectId);

      if (deletePartsError) throw deletePartsError;

      if (payload.partRows.length) {
        const insertPartRows = payload.partRows.map(row => ({
          project_id: payload.projectId,
          part_order: row.part_order,
          original_name: row.original_name || null,
          assigned_member_id: row.assigned_member_id || null
        }));

        const { error: insertPartsError } = await supabaseClient
          .from("project_parts")
          .insert(insertPartRows);

        if (insertPartsError) throw insertPartsError;
      }

      const editedProjectId = payload.projectId;
      closeTaskEditModal(false);
      await loadProjectsFromSupabase();
      renderSiteNotifications();

      if (tasks.some(item => String(item.id) === String(editedProjectId))) {
        activeDetailTaskId = editedProjectId;
        renderBrowseList();
        renderBrowseDetail();
        queueStudioJumpFlash(editedProjectId);
        showToast("保存成功", "项目内容已更新。");
      } else {
        writeStudioJumpIntent({
          page: PAGE_LINKS.studioTodo,
          taskId: editedProjectId,
          source: CURRENT_STUDIO_PAGE
        });
        window.location.href = PAGE_LINKS.studioTodo;
        return;
      }
    } catch (err) {
      console.error("保存编辑弹窗失败：", err);
      showToast("保存失败", err?.message || "保存时出现问题。");
    } finally {
      taskEditSaveBtn.disabled = false;
      taskEditSaveBtn.textContent = "保存";
    }
  }

  function buildTaskDetailHtml(task) {
    const singerSplit = splitGold(task.singer_bonus || 0);
    const producerSplit = splitGold(task.producer_bonus || 0);

    const singersHtml = (task.singers || []).length
      ? sortSingersByMemberOrder(task.singers).map(item => buildSingerCardHtml(item, task)).join("")
      : `<div class="taskEmpty">暂无演唱分配</div>`;

    return `
      <div class="sectionCard">
        <div class="sectionHeader">
          <h3 class="sectionTitle">演唱分配</h3>
          <div class="sectionMeta">
            <span class="sectionMetaText">调：${escapeHtml(task.project_tone || "未定调")}</span>
            <span class="sectionMetaText">演唱进度：${escapeHtml(getProgressText(task))}</span>
          </div>
        </div>
        <div class="assignmentList">${singersHtml}</div>
      </div>

      <div class="bottomGrid">
        <div class="sectionCard">
          <div class="sectionHeader">
            <h3 class="sectionTitle">混音负责人</h3>
          </div>
          ${buildProducerCardHtml(task)}
        </div>

        <div class="sectionCard">
          <div class="sectionHeader">
            <h3 class="sectionTitle">奖金</h3>
          </div>
          <div class="goldGrid">
            <div class="goldCard">
              <div class="goldLabel">演唱</div>
              <div class="goldMain">${escapeHtml(String(singerSplit.total))} 金币</div>
              <div class="goldSub">
                <span>交音 ${escapeHtml(String(singerSplit.submit))}</span>
                <span>发布 ${escapeHtml(String(singerSplit.publish))}</span>
              </div>
            </div>

            <div class="goldCard">
              <div class="goldLabel">混音</div>
              <div class="goldMain">${escapeHtml(String(producerSplit.total))} 金币</div>
              <div class="goldSub">
                <span>交付 ${escapeHtml(String(producerSplit.submit))}</span>
                <span>发布 ${escapeHtml(String(producerSplit.publish))}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function bindTaskDetailActionButtons() {
    const currentTask = getTaskById(activeDetailTaskId);

    if (browseEditBtnTask) {
      const canEdit = !!currentTask && canEditTaskFromDetail(currentTask);
      browseEditBtnTask.disabled = !canEdit;
      browseEditBtnTask.style.display = currentTask ? "" : "none";
      browseEditBtnTask.textContent = canEdit ? "编辑" : "不可编辑";
    }

    document.querySelectorAll("[data-singer-record-id]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const singerRecordId = btn.dataset.singerRecordId;
        const current = btn.dataset.current === "1";
        await toggleSingerSubmitted(singerRecordId, current);
      });
    });

    document.querySelectorAll("[data-project-id]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const projectId = btn.dataset.projectId;
        const current = btn.dataset.current === "1";
        await toggleProducerCompleted(projectId, current);
      });
    });
  }

  function renderBrowseDetail() {
    const listData = getFilteredTasks(detailSearchKeyword);
    const task = listData.find(item => item.id === activeDetailTaskId) || listData[0];

    if (!task) {
      setBrowseDetailEmpty("暂无制作中项目");
      return;
    }

    activeDetailTaskId = task.id;
    document.getElementById("browseDetailTitleTask").innerHTML = `
      <div class="detailHero">
        <div class="detailHeroTitleRow">
          <div class="detailHeroTitleMain">
            <div class="detailHeroTitle">${escapeHtml(task.displayName)}</div>
            <div class="detailHeroTags">${buildCommonTaskBadges(task)}</div>
          </div>
        </div>
        <div class="detailHeroMeta">
          <div class="detailHeroMetaLeft">
            <span class="detailMetaChip">调：${escapeHtml(task.project_tone || "未定")}</span>
            <span class="detailMetaChip">演唱进度：${escapeHtml(getProgressText(task))}</span>
          </div>
          <div class="detailHeroMetaRight">
            <span class="detailMetaChip">预计发布：${escapeHtml(task.release_date ? formatDate(task.release_date) : "未定")}</span>
          </div>
        </div>
      </div>
    `;
    document.getElementById("browseDetailStatusTask").textContent = "";
    document.getElementById("browseDetailContentTask").innerHTML = buildTaskDetailHtml(task);
    bindTaskDetailActionButtons();
    renderBrowseList();
  }

  function updateTaskFilterButtons() {
    document.querySelectorAll(".taskFilterBtn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.taskFilter === taskFilterMode);
    });
  }

  async function toggleSingerSubmitted(singerRecordId, currentValue) {
    try {
      const payload = currentValue
        ? { is_submitted: false, submitted_at: null }
        : { is_submitted: true, submitted_at: new Date().toISOString() };

      const { error } = await supabaseClient
        .from("project_singers")
        .update(payload)
        .eq("id", singerRecordId);

      if (error) throw error;

      await loadProjectsFromSupabase();

      if (!currentValue) {
        await runStudioHonorRewardCheck("submit_audio", { singerRecordId });
      }
    } catch (err) {
      console.error("更新交音状态失败：", err);
      showToast("操作失败", err?.message || "更新交音状态失败");
    }
  }

  async function toggleProducerCompleted(projectId, currentValue) {
    try {
      const task = tasks.find(item => String(item.id) === String(projectId));
      const allSingersDone = task && (task.singers || []).length > 0 && (task.singers || []).every(item => !!item.is_submitted);

      if (!allSingersDone && !currentValue) {
        showToast("暂不能交付", "演唱尚未全部交音，暂时不能交付混音。");
        return;
      }

      const payload = currentValue
        ? { producer_completed: false, producer_completed_at: null }
        : { producer_completed: true, producer_completed_at: new Date().toISOString() };

      const { error } = await supabaseClient
        .from("projects")
        .update(payload)
        .eq("id", projectId);

      if (error) throw error;

      await loadProjectsFromSupabase();

      if (!currentValue) {
        await runStudioHonorRewardCheck("producer_completed", { projectId });
      }
    } catch (err) {
      console.error("更新混音状态失败：", err);
      showToast("操作失败", err?.message || "更新混音状态失败");
    }
  }

  if (browseEditBtnTask) {
    browseEditBtnTask.addEventListener("click", () => {
      openTaskEditModal(activeDetailTaskId);
    });
  }

  if (editTaskModeNormalBtn) {
    editTaskModeNormalBtn.addEventListener("click", () => setTaskEditMode(false));
  }
  if (editTaskModeSpecialBtn) {
    editTaskModeSpecialBtn.addEventListener("click", () => setTaskEditMode(true));
  }

  taskEditCancelBtn.addEventListener("click", () => closeTaskEditModal(true));
  taskEditMask.addEventListener("click", (event) => {
    if (event.target === taskEditMask) {
      event.preventDefault();
      event.stopPropagation();
    }
  });
  taskEditSaveBtn.addEventListener("click", saveTaskEditModal);

  if (editProducerPicker) {
    editProducerPicker.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-producer-option]");
      if (!btn || !editProducerPicker.contains(btn) || event.target === editProducerPicker) return;
      event.preventDefault();
      event.stopPropagation();
      currentEditingProducerMemberId = String(btn.dataset.producerOption || "").trim();
      renderProducerPicker(currentEditingProducerMemberId);
    });
  }

  if (editTaskName) {
    editTaskName.addEventListener("input", () => {
      syncProducerByEachSingRule();
    });
  }

  if (editTaskType) {
    editTaskType.addEventListener("change", () => {
      syncProducerByEachSingRule();
    });
  }

  editSingerQuota.addEventListener("change", () => {
    const currentQuota = Math.max(1, Math.floor(Number(editSingerQuota.dataset.prevQuota || editSingerQuota.value) || 1));
    const quota = Math.max(1, Math.floor(Number(editSingerQuota.value) || 1));
    const guard = canResizePartRowsToQuota(quota, { preserveCurrent: true });
    if (!guard.ok) {
      editSingerQuota.value = String(currentQuota);
      showToast("无法减少人数", guard.message || "请先清空将被裁掉行中的内容。");
      return;
    }
    editSingerQuota.value = String(quota);
    editSingerQuota.dataset.prevQuota = String(quota);
    syncEditPartRowsToQuota(true);
    renderEditPartRows();
    bindEditPartRowButtons();
  });

  editSingerMemberList.addEventListener("click", (event) => {
    const btn = event.target.closest(".memberCheckItem[data-member-id]");
    if (!btn) return;
    const memberId = String(btn.dataset.memberId || "");
    const currentIds = getEditableSingerIds();
    const quota = Math.max(1, Math.floor(Number(editSingerQuota.value) || 1));
    const isActive = btn.classList.contains("active");

    if (!isActive && currentIds.length >= quota) {
      showToast("人数超出", "勾选的演唱者人数不能超过“演唱人数”。");
      return;
    }

    if (isActive) {
      const currentRows = getCurrentPartDraftFromDom();
      const stillUsed = currentRows.some(row => String(row.assigned_member_id || "").trim() === memberId);
      if (stillUsed) {
        showToast("无法移除", "该演唱者仍在歌词分配中使用，请先清空对应行右侧成员。")
        return;
      }
    }

    btn.classList.toggle("active");
    const stillSelected = getEditableSingerIds();
    editPartDraftRows = editPartDraftRows.map(row => stillSelected.includes(String(row.assigned_member_id || "")) ? row : { ...row, assigned_member_id: "", assigned_member_name: "" });
    syncEditPartRowsToQuota(false);
    renderEditPartRows();
    bindEditPartRowButtons();
  });

  document.getElementById("browsePrimaryBtnTask").addEventListener("click", async () => {
    await loadProjectsFromSupabase();
  });

  detailSearchInput.addEventListener("input", (e) => {
    detailSearchKeyword = e.target.value;
    const filtered = getFilteredTasks(detailSearchKeyword);
    if (!filtered.some(task => task.id === activeDetailTaskId)) {
      activeDetailTaskId = filtered.length ? filtered[0].id : "";
    }
    renderBrowseList();
    renderBrowseDetail();
  });

  document.querySelectorAll(".taskFilterBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      taskFilterMode = btn.dataset.taskFilter;
      updateTaskFilterButtons();
      const filtered = getFilteredTasks(detailSearchKeyword);
      if (!filtered.some(task => task.id === activeDetailTaskId)) {
        activeDetailTaskId = filtered.length ? filtered[0].id : "";
      }
      renderBrowseList();
      renderBrowseDetail();
    });
  });

  document.getElementById("goClaimBtn").addEventListener("click", () => {
    window.location.href = PAGE_LINKS.studioTodo;
  });

document.getElementById("goProjectBtn").addEventListener("click", () => {
  return;
});

document.getElementById("goTaskBtn").addEventListener("click", () => {
  window.location.href = PAGE_LINKS.studioSubmit;
});

  document.querySelectorAll(".navBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const roomKey = btn.dataset.room;

      if (roomKey === "manager") {
        const role = getCurrentRole();
        const page =
          role === "owner" ? PAGE_LINKS.managerOwner :
          role === "admin" ? PAGE_LINKS.managerAdmin :
          role === "member" ? PAGE_LINKS.managerMember :
          PAGE_LINKS.managerVisitor;

        window.location.href = page;
        return;
      }

      if (PAGE_LINKS[roomKey]) {
        window.location.href = PAGE_LINKS[roomKey];
      }
    });
  });

  document.getElementById("logoutBtn").addEventListener("click", handleLogout);

  bg.addEventListener("load", syncOverlayToImage);
  restartBackgroundNotes();

  window.addEventListener("storage", async (e) => {
    if (e.key === STORAGE_KEYS.studioJumpIntent) {
      pendingStudioJumpIntent = readStudioJumpIntent();
      applyIncomingStudioJumpIntent();
      return;
    }

    if ([STORAGE_KEYS.loggedIn, STORAGE_KEYS.user, STORAGE_KEYS.role, STORAGE_KEYS.memberId].includes(e.key)) {
      const ok = await ensureAuthState();
      if (!ok) return;
      updateTopBarIdentity();
      await loadProjectsFromSupabase();
      renderSiteNotifications();
    }
  });

  document.addEventListener("click", (event) => {
    if (!event.target.closest("#siteNoticeWrap")) {
      toggleSiteNoticePanel(false);
    }
  });

  siteNoticeBtn?.addEventListener("click", (event) => {
    event.stopPropagation();
    renderSiteNotifications();
    toggleSiteNoticePanel();
  });

  window.addEventListener("load", async () => {
    const ok = await ensureAuthState();
    if (!ok) return;
    updateTopBarIdentity();
    syncOverlayToImage();
    updateTaskFilterButtons();
    await loadMembersFromSupabase();
    await loadProjectsFromSupabase();
    renderSiteNotifications();
  });

  window.addEventListener("resize", syncOverlayToImage);
  window.addEventListener("orientationchange", syncOverlayToImage);

  if ("ResizeObserver" in window) {
    const ro = new ResizeObserver(syncOverlayToImage);
    ro.observe(room);
  }
</script>
