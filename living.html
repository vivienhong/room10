<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜客厅</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg-ui-scale:1;
  --nav-scale:1;
  --identity-scale:1;
  --board-scale:1;

  /* 当前页面坐标：客厅页只改这里 */
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-width:calc(232px * var(--identity-scale));
  --identity-height:calc(38px * var(--identity-scale));

  --room-nav-left:27.2%;
  --room-nav-top:6.35%;
  --room-nav-width:45.5%;

  /* 页面可改颜色，不改结构尺寸 */
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);

  --nav-text:#6e4827;
  --nav-border:rgba(145,98,56,.34);
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:#e9dfd1;
}

body{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#6c4523;
  background:
    radial-gradient(circle at top left, rgba(246,238,226,.9) 0%, transparent 36%),
    radial-gradient(circle at top right, rgba(230,217,199,.82) 0%, transparent 38%),
    linear-gradient(180deg,#e9dfd1 0%, #ded1bf 100%);
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

#room{
  position:relative;
  z-index:3;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:transparent;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:#e9dfd1;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  z-index:1;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{
  pointer-events:auto;
}

/* =========================================================
   身份组件：全站统一结构
========================================================= */
#topActions{
  --ui-scale:var(--identity-scale, 1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:var(--identity-width);
  height:var(--identity-height);
  min-width:0;
  min-height:0;
  z-index:65;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:var(--identity-bg);
  border:1px solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--ui-scale)) calc(24px * var(--ui-scale)) var(--identity-shadow),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(7px * var(--ui-scale));
  font-size:calc(12.5px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  flex:0 1 auto;
  min-width:0;
  max-width:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  text-overflow:clip;
  white-space:nowrap;
  line-height:1.18;
  transform:translateY(0.01em);
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
  white-space:nowrap;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  display:block;
  line-height:1;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--ui-scale));
  top:calc(-6px * var(--ui-scale));
  min-width:calc(18px * var(--ui-scale));
  height:calc(18px * var(--ui-scale));
  padding:0 calc(5px * var(--ui-scale));
  border-radius:999px;
  background:#c98c4f;
  color:#fff9f1;
  font-size:calc(9px * var(--ui-scale));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--ui-scale)) solid rgba(255,248,239,0.98);
  box-shadow:0 2px 8px rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice #siteNoticeCount{
  display:flex;
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:min(calc(360px * var(--ui-scale)), 72vw);
  max-height:min(calc(540px * var(--ui-scale)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  background:rgba(255,249,241,0.98);
  border:1px solid rgba(203,167,123,0.28);
  box-shadow:0 16px 36px rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

#siteNoticePanel.show{
  display:block;
}

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--ui-scale));
  font-weight:900;
  margin-bottom:calc(10px * var(--ui-scale));
}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--ui-scale));
  line-height:1.6;
  padding:6px 2px 2px;
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--ui-scale));
}

.siteNoticeItem{
  padding:calc(10px * var(--ui-scale));
  border-radius:calc(12px * var(--ui-scale));
  background:rgba(255,252,247,0.82);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.92),
    0 2px 8px rgba(120,92,63,0.05);
}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1.5;
  margin-bottom:4px;
}

.siteNoticeItemDesc{
  color:#8a6644;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.55;
}

/* =========================================================
   房间切换按钮：客厅页不显示“客厅”按钮
   特效已按房间主题重写
========================================================= */
#topBar{
  --ui-scale:var(--nav-scale, 1);
  position:absolute;
  left:var(--room-nav-left);
  top:var(--room-nav-top);
  width:var(--room-nav-width);
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:55;
  overflow:visible;
  pointer-events:none;

  --nav-btn-height:calc(40px * var(--ui-scale));
  --nav-btn-px:calc(16px * var(--ui-scale));
  --nav-btn-radius:calc(13px * var(--ui-scale));
  --nav-btn-font:calc(14px * var(--ui-scale));
  --nav-gap:calc(8px * var(--ui-scale));
}

#navOuter,
#navScroll{
  overflow:visible;
}

#navOuter{
  flex:0 0 auto;
  min-width:0;
  width:100%;
  pointer-events:auto;
}

#navScroll{
  width:100%;
  white-space:nowrap;
  padding:0;
  margin:0;
}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap);
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height);
  padding:0 var(--nav-btn-px);
  border-radius:var(--nav-btn-radius);
  color:var(--nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  line-height:1;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid var(--nav-border);
  box-shadow:
    0 1px 1px rgba(255,255,255,.48) inset,
    0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease,
    filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:
    linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:
    0 1px 1px rgba(255,255,255,.55) inset,
    0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{
  position:relative;
  z-index:5;
  display:block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 1px 2px rgba(255,250,232,.82),
    0 0 8px rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{
  left:8%;
  top:-54%;
  font-size:calc(var(--nav-btn-font) * .92);
}

.navEffectB{
  right:8%;
  top:-62%;
  font-size:calc(var(--nav-btn-font) * .86);
}

.navEffectC{
  left:50%;
  top:-72%;
  transform:translateX(-50%);
  font-size:calc(var(--nav-btn-font) * 1.02);
}

@keyframes navFloatA{
  0%,100%{ transform:translateY(4px) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(-5px) rotate(6deg) scale(1); opacity:.76; }
}

@keyframes navFloatB{
  0%,100%{ transform:translateY(5px) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(-6px) rotate(-7deg) scale(1); opacity:.68; }
}

@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(6px) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(-6px) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:hover .navEffectA,
.navBtn:focus-visible .navEffectA{
  animation:navFloatA 2.2s ease-in-out infinite;
}

.navBtn:hover .navEffectB,
.navBtn:focus-visible .navEffectB{
  animation:navFloatB 2.5s ease-in-out infinite;
}

.navBtn:hover .navEffectC,
.navBtn:focus-visible .navEffectC{
  animation:navFloatC 2.35s ease-in-out infinite;
}

/* 各房间特效颜色 */
.navBtn[data-room="hall"] .navEffect{
  color:rgba(255,205,96,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.95),
    0 0 10px rgba(255,215,105,.62);
}

.navBtn[data-room="manager"] .navEffect{
  color:rgba(128,91,58,.82);
}

.navBtn[data-room="honor"] .navEffect{
  color:rgba(205,143,45,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.92),
    0 0 8px rgba(255,220,130,.52);
}

.navBtn[data-room="game"] .navEffect{
  color:rgba(117,91,150,.82);
}

.navBtn[data-room="studio"] .navEffect{
  color:rgba(96,112,145,.84);
}

.navBtn[data-room="dorm"] .navEffect{
  color:rgba(143,111,168,.76);
}

.navBtn[data-room="pets"] .navEffect{
  color:rgba(131,111,78,.82);
}

.navBtn[data-room="flower"] .navEffect{
  color:rgba(198,119,145,.82);
}

/* =========================================================
   客厅公告栏主面板：白板分区版
========================================================= */
#livingPanel{
  --ui-scale:var(--board-scale, 1);
  position:absolute;
  left:14.9%;
  top:18.4%;
  width:40.6%;
  height:60.8%;
  min-height:0;
  display:flex;
  flex-direction:column;
  container-type:inline-size;
  padding:calc(19px * var(--ui-scale)) calc(20px * var(--ui-scale)) calc(18px * var(--ui-scale));
  border-radius:calc(30px * var(--ui-scale));
  background:
    radial-gradient(ellipse at 12% 18%, rgba(255,222,202,.28), transparent 38%),
    radial-gradient(ellipse at 88% 20%, rgba(214,231,255,.25), transparent 40%),
    radial-gradient(ellipse at 72% 88%, rgba(217,239,210,.23), transparent 42%),
    linear-gradient(180deg, rgba(255,254,247,.93), rgba(250,246,234,.90));
  border:calc(8px * var(--ui-scale)) solid rgba(214,184,145,.62);
  box-shadow:
    0 calc(16px * var(--ui-scale)) calc(34px * var(--ui-scale)) rgba(92,65,38,.14),
    inset 0 1px 0 rgba(255,255,255,.86);
  pointer-events:auto;
  overflow:hidden;
  isolation:isolate;
}

#livingPanel::before{
  content:"";
  position:absolute;
  pointer-events:none;
  inset:calc(15px * var(--ui-scale));
  z-index:0;
  border-radius:calc(22px * var(--ui-scale));
  background:
    repeating-linear-gradient(
      180deg,
      rgba(174,137,91,.030) 0,
      rgba(174,137,91,.030) 1px,
      transparent 1px,
      transparent calc(28px * var(--ui-scale))
    ),
    radial-gradient(circle at 18% 78%, rgba(236,186,204,.10), transparent 24%),
    radial-gradient(circle at 84% 62%, rgba(170,211,238,.10), transparent 26%);
  opacity:.86;
  animation:boardPaperBreath 9s ease-in-out infinite;
}

@keyframes boardPaperBreath{
  0%,100%{ opacity:.76; filter:saturate(.96) brightness(1); }
  50%{ opacity:.98; filter:saturate(1.08) brightness(1.012); }
}

.boardHeader{
  position:relative;
  z-index:2;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:calc(12px * var(--ui-scale));
  margin-bottom:calc(11px * var(--ui-scale));
}

#livingPanelTitle{
  margin:0;
  color:#5f3f26;
  font-size:calc(29px * var(--ui-scale));
  font-weight:900;
  line-height:1.05;
  letter-spacing:.055em;
  text-shadow:0 1px 0 rgba(255,255,255,.78);
  transform:rotate(-1deg);
}

.boardHeaderNote{
  display:inline-flex;
  align-items:center;
  gap:calc(6px * var(--ui-scale));
  color:#b98658;
  font-size:calc(12px * var(--ui-scale));
  font-weight:900;
  transform:none;
}

.boardHeaderNote::before{
  content:"";
  width:calc(12px * var(--ui-scale));
  height:calc(12px * var(--ui-scale));
  border-radius:999px;
  background:radial-gradient(circle at 35% 30%, #fff7e5, #d79d68 60%, #a86c42);
  box-shadow:0 1px 5px rgba(105,66,34,.23);
}

.boardFloatLayer{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.boardFloat{
  position:absolute;
  z-index:1;
  font-weight:900;
  line-height:1;
  opacity:.70;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.62));
  animation:boardFloatDrift 5.8s ease-in-out infinite, boardFloatTwinkle 2.8s ease-in-out infinite;
}

.boardFloat:nth-child(1){ left:7%; top:19%; font-size:calc(24px * var(--ui-scale)); animation-delay:-.7s, -.4s; color:rgba(214,144,166,.68); }
.boardFloat:nth-child(2){ left:88%; top:17%; font-size:calc(23px * var(--ui-scale)); animation-delay:-2.4s, -1.1s; color:rgba(167,130,196,.64); }
.boardFloat:nth-child(3){ left:72%; top:82%; font-size:calc(27px * var(--ui-scale)); animation-delay:-4.1s, -2.7s; color:rgba(117,171,123,.65); }
.boardFloat:nth-child(4){ left:14%; top:85%; font-size:calc(22px * var(--ui-scale)); animation-delay:-5.3s, -1.9s; color:rgba(220,152,132,.62); }
.boardFloat:nth-child(5){ left:47%; top:17%; font-size:calc(21px * var(--ui-scale)); animation-delay:-3.2s, -3.1s; color:rgba(222,168,76,.64); }
.boardFloat:nth-child(6){ left:90%; top:56%; font-size:calc(30px * var(--ui-scale)); animation-delay:-5.8s, -.8s; color:rgba(118,174,205,.60); }
.boardFloat:nth-child(7){ left:30%; top:86%; font-size:calc(21px * var(--ui-scale)); animation-delay:-1.7s, -2.2s; color:rgba(210,136,166,.58); }
.boardFloat:nth-child(8){ left:57%; top:82%; font-size:calc(24px * var(--ui-scale)); animation-delay:-3.9s, -1.6s; color:rgba(235,183,88,.58); }
.boardFloat:nth-child(9){ left:20%; top:54%; font-size:calc(26px * var(--ui-scale)); animation-delay:-6.1s, -2.9s; color:rgba(137,179,142,.56); }
.boardFloat:nth-child(10){ left:83%; top:38%; font-size:calc(22px * var(--ui-scale)); animation-delay:-1.2s, -2.4s; color:rgba(223,151,181,.54); }
.boardFloat:nth-child(11){ left:38%; top:56%; font-size:calc(28px * var(--ui-scale)); animation-delay:-4.7s, -.9s; color:rgba(137,179,205,.52); }
.boardFloat:nth-child(12){ left:62%; top:29%; font-size:calc(22px * var(--ui-scale)); animation-delay:-2.8s, -1.7s; color:rgba(119,175,135,.54); }
.boardFloat:nth-child(13){ left:9%; top:42%; font-size:calc(20px * var(--ui-scale)); animation-delay:-3.5s, -2.1s; color:rgba(237,184,91,.55); }
.boardFloat:nth-child(14){ left:49%; top:74%; font-size:calc(21px * var(--ui-scale)); animation-delay:-5.2s, -1.2s; color:rgba(172,132,198,.52); }
.boardFloat:nth-child(15){ left:93%; top:78%; font-size:calc(20px * var(--ui-scale)); animation-delay:-6.2s, -2.6s; color:rgba(220,152,132,.52); }

@keyframes boardFloatDrift{
  0%,100%{ transform:translate3d(0,0,0) rotate(-10deg) scale(.94); }
  35%{ transform:translate3d(calc(9px * var(--ui-scale)), calc(-20px * var(--ui-scale)), 0) rotate(10deg) scale(1.10); }
  70%{ transform:translate3d(calc(-7px * var(--ui-scale)), calc(8px * var(--ui-scale)), 0) rotate(-4deg) scale(.98); }
}

@keyframes boardFloatTwinkle{
  0%,100%{ opacity:.36; }
  45%{ opacity:.78; }
  65%{ opacity:.58; }
}

#livingBoard{
  position:relative;
  z-index:2;
  flex:1 1 auto;
  height:auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:calc(5px * var(--ui-scale)) calc(5px * var(--ui-scale)) calc(7px * var(--ui-scale));
  scrollbar-width:thin;
  scrollbar-color:rgba(154,112,72,.24) transparent;
}


#livingBoard::-webkit-scrollbar{ width:6px; }
#livingBoard::-webkit-scrollbar-thumb{ background:rgba(154,112,72,.24); border-radius:999px; }

.boardLayout{
  position:relative;
  min-height:100%;
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  grid-auto-rows:min-content;
  grid-auto-flow:dense;

function isTinyScreen(){

function clearDesktopOverlayStyles(){

  overlay.style.height = "";
}

/* =========================================================
   组件独立缩放
========================================================= */
function getNavScale(baseScale){
  /*
    房间按钮独立缩放：不再使用整组 transform。
    541px–760px 仍属于桌面版，只轻微压缩按钮自身尺寸、间距和字号，避免按钮被窄桌面挤出或裁切。
  */
  const width = window.innerWidth || 0;
  if(width >= 541 && width <= 760){
    return Math.max(0.30, baseScale * 0.86);
  }
  return baseScale;
}

function getBoardScale(baseScale){
  /*
    公告栏内部独立缩放：只补可读性，不影响房间按钮和身份组件。
    不再叠加 CSS 过渡区放大规则，避免字号被重复放大。
  */
  const width = window.innerWidth || 0;
  if(width >= 541 && width <= 760){
    return Math.max(baseScale, 0.50);
  }
  return baseScale;
}

/* =========================================================
   底图贴合坐标系统
========================================================= */
function syncOverlayToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }
  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  // 底图坐标统一用 baseScale；各组件独立缩放，避免相互连带影响。
  const baseScale = Math.max(0.34, displayWidth / 1440);
  const navScale = getNavScale(baseScale);
  const boardScale = getBoardScale(baseScale);

  root.style.setProperty("--bg-ui-scale", String(baseScale));
  root.style.setProperty("--nav-scale", String(navScale));
  root.style.setProperty("--identity-scale", String(baseScale));
  root.style.setProperty("--board-scale", String(boardScale));

}

  const oldUser = localStorage.getItem("room10User") || "";
  const oldRole = localStorage.getItem("room10Role") || "";
  const oldMemberId = localStorage.getItem("room10MemberId") || "";

  if(oldLoggedIn && oldUser){
    return {
      nickname:oldUser,
      role:oldRole || "member",
      member_id:oldMemberId
    };
  }

  try{
    const raw =
      localStorage.getItem("room10_user") ||
      localStorage.getItem("room10_current_user") ||
      localStorage.getItem("currentUser");

    if(!raw) return null;

    const data = JSON.parse(raw);
    if(!data) return null;

    return {
      nickname:data.nickname || data.name || "",
      role:data.role || "",
      member_id:data.member_id || data.id || ""
    };
  }catch(err){
    return null;
  }
}

function getRoleLabel(role){
  const value = String(role || "").toLowerCase();

  if(value === "owner") return "维修工";
  if(value === "admin") return "宿管";
  if(value === "member") return "房客";
  if(value === "applying") return "申请中";

  return "房客";
}

function isLoggedIn(){
  const user = getStoredUser();
  return !!(user && user.nickname);
}

function updateIdentityUI(){
  const user = getStoredUser();

  if(!currentUserText || !loginOpenBtn || !logoutBtn) return;

  if(!user || !user.nickname){
    currentUserText.textContent = "参观者";
    loginOpenBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    return;
  }

  currentUserText.textContent = `${user.nickname} | ${getRoleLabel(user.role)}`;
  loginOpenBtn.classList.add("hidden");
  logoutBtn.classList.remove("hidden");
}

function logout(){
  localStorage.removeItem("room10LoggedIn");
  localStorage.removeItem("room10User");
  localStorage.removeItem("room10Role");
  localStorage.removeItem("room10MemberId");
  localStorage.removeItem("room10MemberCode");
  localStorage.removeItem("room10ApplicantSession");
  localStorage.removeItem("room10ApplicationDraft");

  localStorage.removeItem("room10_user");
  localStorage.removeItem("room10_current_user");
  localStorage.removeItem("currentUser");

  updateIdentityUI();
  renderNoticeList([]);
  loadLivingBoard();
  handleResponsiveLayout();
  window.dispatchEvent(new CustomEvent("room10:logout"));
}

function openLogin(targetPage = ""){
  const detail = { targetPage };
  const event = new CustomEvent("room10:open-login", {
    detail,
    cancelable:true
  });

  const handled = !window.dispatchEvent(event);
  if(handled) return;

  if(targetPage){
    localStorage.setItem("room10PendingTargetPage", targetPage);
  }

  window.location.href = targetPage
    ? `index.html?login=1&target=${encodeURIComponent(targetPage)}`
    : "index.html?login=1";
}

/* =========================================================
   房间跳转
========================================================= */
function getCurrentRole(){
  const user = getStoredUser();
  return user && user.role ? String(user.role).toLowerCase() : "";
}

function getManagerPageByRole(){
  const role = getCurrentRole();

  if(role === "owner") return "manager-owner.html";
  if(role === "admin") return "manager-admin.html";
  if(role === "member") return "manager-member.html";

  return "manager-visitor.html";
}

function enterManagerRoom(){
  window.location.href = getManagerPageByRole();
}

function enterRoom(page, needLogin){
  const targetPage = String(page || "").trim();
  if(!targetPage) return;

  if(needLogin && !isLoggedIn()){
    openLogin(targetPage);
    return;
  }

  if((targetPage === "flower.html" || targetPage === "pets.html") && !isLoggedIn()){
    window.location.href = `${targetPage}?mode=guest`;
    return;
  }

  window.location.href = targetPage;
}


/* =========================================================
   客厅公告栏：数据库读取 + 有内容才显示
========================================================= */
function parseBoardTimeValue(value){
  if(!value) return 0;
  const time = new Date(value).getTime();
  return Number.isNaN(time) ? 0 : time;
}

function formatBoardTime(value){
  if(!value) return "";
  const time = new Date(value).getTime();
  if(Number.isNaN(time)) return "";

  const diff = Date.now() - time;
  const minute = 60 * 1000;
  const hour = 60 * minute;
  const day = 24 * hour;

  if(diff < minute) return "刚刚";
  if(diff < hour) return `${Math.max(1, Math.floor(diff / minute))}分钟前`;
  if(diff < day) return `${Math.floor(diff / hour)}小时前`;
  if(diff < day * 2) return "昨天";
  if(diff < day * 7) return `${Math.floor(diff / day)}天前`;

  const date = new Date(time);
  return `${date.getMonth() + 1}/${date.getDate()}`;
}

function isAnnouncementActiveByTime(row){
  const now = Date.now();
  const start = parseBoardTimeValue(row?.start_at);
  const end = parseBoardTimeValue(row?.end_at);
  if(start && start > now) return false;
  if(end && end < now) return false;
  return true;
}

function isHolidayCloseEnough(row){
  if(String(row?.category || "") !== "holiday") return true;

  const now = Date.now();
  const start = parseBoardTimeValue(row?.start_at || row?.event_at || row?.created_at);
  const end = parseBoardTimeValue(row?.end_at);

  if(end && end < now) return false;
  if(!start) return false;
  if(start <= now) return true;

  return start - now <= HOLIDAY_SHOW_BEFORE_DAYS * ANNOUNCEMENT_DAY;
}

function getEventSortTime(row){
  return parseBoardTimeValue(row?.event_at || row?.created_at);
}

function getCategoryOrder(category){
  const index = BOARD_CATEGORIES.findIndex(item => item.key === category);
  return index >= 0 ? index : 99;
}

function isPlaceholderAnnouncement(row){
  const category = String(row?.category || "");
  const content = String(row?.content || row?.title || "").trim();
  if(category === "honor") return true;
  if(!content) return true;
  if(content.includes("暂无")) return true;
  if(content.includes("暂时没有")) return true;
  if(content.includes("敬请期待")) return true;
  if(content.includes("即将开放")) return true;
  if(content === "荣誉图鉴有新动态。") return true;
  if(content === "有新成员加入十号房。") return true;
  return false;
}

function limitGameRows(rows){
  const resultByScope = new Map();
  const output = [];

  rows.forEach(row => {
    if(row.category !== "game" || row.event_kind !== "game_result"){
      output.push(row);
      return;
    }

    const scope = String(row.event_scope || "game_result");
    const current = resultByScope.get(scope);
    if(!current || getEventSortTime(row) > getEventSortTime(current)){
      resultByScope.set(scope, row);
    }
  });

  return output.concat([...resultByScope.values()]);
}

function isAllowedGameAnnouncement(row){
  if(String(row?.category || "") !== "game") return true;

  const kind = String(row?.event_kind || "").trim();
  const scope = String(row?.event_scope || "").trim();

  if(["game_result", "game_rank", "game_start"].includes(kind) && !scope){
    return false;
  }

  if(kind === "game_rank" && ["bomb_quick", "bomb_free", "bomb"].includes(scope)){
    return false;
  }

  return true;
}

function normalizeBoardRows(rows){
  const safeRows = Array.isArray(rows) ? rows : [];
  return limitGameRows(safeRows)
    .filter(row => row && row.category)
    .filter(row => BOARD_CATEGORIES.some(category => category.key === row.category))
    .filter(row => isAllowedGameAnnouncement(row))
    .filter(row => !isPlaceholderAnnouncement(row))
    .filter(row => isAnnouncementActiveByTime(row))
    .filter(row => isHolidayCloseEnough(row))
    .sort((a, b) => {
      const catDiff = getCategoryOrder(a.category) - getCategoryOrder(b.category);
      if(catDiff !== 0) return catDiff;
      if(Boolean(a.is_pinned) !== Boolean(b.is_pinned)) return a.is_pinned ? -1 : 1;
      const priorityDiff = Number(a.priority || 50) - Number(b.priority || 50);
      if(priorityDiff !== 0) return priorityDiff;
      return getEventSortTime(b) - getEventSortTime(a);
    });
}

function getScopeLabel(row){
  const scope = String(row?.event_scope || "").trim();
  const kind = String(row?.event_kind || "").trim();
  const map = {
    bomb_quick:"拆弹专家快速模式",
    bomb_free:"拆弹专家自由模式",
    bomb:"拆弹专家",
    face_match:"脸萌挑战",
    link_game:"连连看",
    mango_cut:"切芒果"
  };

  if(map[scope]) return map[scope];
  if(kind === "game_start") return "游戏开局";
  if(kind === "game_rank") return "排行榜动态";
  if(kind === "game_result") return "最新战局";
  return "";
}

function groupBoardRows(rows){
  const groups = new Map();
  BOARD_CATEGORIES.forEach(category => groups.set(category.key, []));
  normalizeBoardRows(rows).forEach(row => groups.get(row.category)?.push(row));
  return groups;
}

function renderBoardLine(row){
  const content = escapeHtml(row.content || row.title || "有新动态。");
  const meta = row.category === "game" ? "" : formatBoardTime(row.event_at || row.created_at);
  const scopeLabel = row.category === "game" ? getScopeLabel(row) : "";
  const prefix = scopeLabel ? `<strong>${escapeHtml(scopeLabel)}</strong>：` : "";
  const time = meta ? `<em>${escapeHtml(meta)}</em>` : "";
  return `<li>${prefix}${content}${time}</li>`;
}

function getBoardLink(category, items){
  if(category.key !== "game") return "";
  const target = (items || []).map(item => String(item.link_url || "").trim()).find(Boolean) || "game.html";
  return `<a class="boardGoBtn" href="${escapeHtml(target)}">去看看</a>`;
}

function renderLivingBoard(rows){
  if(!livingBoardLayout) return;

  const groups = groupBoardRows(rows);
  const sections = BOARD_CATEGORIES.map(category => {
    const items = groups.get(category.key) || [];
    if(!items.length) return "";

    const visibleItems = items.slice(0, category.limit || 3);
    const meta = category.meta ? `<small>${escapeHtml(category.meta)}</small>` : "";
    const link = getBoardLink(category, visibleItems);

    return `
      <article class="boardSection ${escapeHtml(category.cls)}" data-category="${escapeHtml(category.key)}">
        <h2 class="boardSectionTitle">
          <span>${escapeHtml(category.icon)} ${escapeHtml(category.label)}</span>
          ${link || meta}
        </h2>
        <ul class="boardList">
          ${visibleItems.map(renderBoardLine).join("")}
        </ul>
      </article>
    `;
  }).filter(Boolean);

  livingBoardLayout.classList.toggle("is-compact", sections.length > 0 && sections.length <= 3);

  if(!sections.length){
    livingBoardLayout.innerHTML = '<div class="boardEmpty">今天白板很干净，暂时没有需要贴出来的新动态。</div>';
  }else{
    livingBoardLayout.innerHTML = sections.join("");
  }

}


async function fetchLivingAnnouncements(){
  if(!client){
    throw new Error("Supabase 客户端没有加载成功");
  }

  const fields = "id, category, event_kind, event_scope, title, content, priority, is_pinned, link_url, event_at, start_at, end_at, created_at";
  let result = await client
    .from("living_announcements_feed")
    .select(fields)
    .order("created_at", { ascending:false });

  if(result.error){
    result = await client
      .from("living_announcements")
      .select(fields)
      .eq("is_active", true)
      .order("created_at", { ascending:false });
  }

  if(result.error) throw result.error;
  return result.data || [];
}

async function loadLivingBoard(){
  if(!livingBoardLayout) return;
  livingBoardLayout.innerHTML = '<div class="boardLoading">正在读取客厅公告……</div>';
  try{
    const rows = await fetchLivingAnnouncements();
    renderLivingBoard(rows);
  }catch(err){
    console.error("读取客厅公告栏失败：", err);
    livingBoardLayout.innerHTML = '<div class="boardError">公告栏还没有连上数据库。请先检查 living_announcements / living_announcements_feed 设置。</div>';
  }
}

/* =========================================================
   提醒面板
========================================================= */
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function setNoticeCount(count){
  const n = Number(count) || 0;
  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);
}

function renderNoticeList(items){
  const list = Array.isArray(items) ? items : [];

  if(!list.length){
    siteNoticeContent.innerHTML = '<div class="siteNoticeEmpty">暂无提醒。</div>';
    setNoticeCount(0);
    return;
  }

  siteNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => `
        <div class="siteNoticeItem">
          <div class="siteNoticeItemTitle">${escapeHtml(item.title || "提醒")}</div>
          <div class="siteNoticeItemDesc">${escapeHtml(item.desc || "")}</div>
        </div>
      `).join("")}
    </div>
  `;

  setNoticeCount(list.length);
}

function toggleNoticePanel(){
  siteNoticePanel.classList.toggle("show");
}

function closeNoticePanel(){
  siteNoticePanel.classList.remove("show");
}

function handleResponsiveLayout(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }
  syncOverlayToImage();
}

/* =========================================================
   初始化
========================================================= */
document.addEventListener("DOMContentLoaded", () => {
  updateBoardTodayDate();
  updateIdentityUI();
  renderNoticeList([]);
  loadLivingBoard();

  if(siteNoticeBtn){
    siteNoticeBtn.addEventListener("click", event => {
      event.stopPropagation();
      toggleNoticePanel();
    });
  }

  if(loginOpenBtn){
    loginOpenBtn.addEventListener("click", event => {
      event.stopPropagation();
      openLogin();
    });
  }

  if(logoutBtn){
    logoutBtn.addEventListener("click", event => {
      event.stopPropagation();
      logout();
    });
  }

  document.addEventListener("click", event => {
    if(siteNoticePanel && siteNoticeBtn){
      if(siteNoticePanel.contains(event.target) || siteNoticeBtn.contains(event.target)) return;
      closeNoticePanel();
    }
  });
});

window.addEventListener("resize", handleResponsiveLayout);

window.addEventListener("storage", event => {
  if(
    event.key === "room10LoggedIn" ||
    event.key === "room10User" ||
    event.key === "room10Role" ||
    event.key === "room10MemberId" ||
    event.key === "room10_user" ||
    event.key === "room10_current_user" ||
    event.key === "currentUser"
  ){
    updateIdentityUI();
  }
});

if(img && img.complete && img.naturalWidth){
  handleResponsiveLayout();
}else if(img){
  img.addEventListener("load", handleResponsiveLayout, { once:true });
}

setTimeout(handleResponsiveLayout, 80);
</script>
