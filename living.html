<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜客厅</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg-ui-scale:1;

  /* 当前页面坐标：客厅页只改这里 */
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-width:calc(232px * var(--bg-ui-scale));
  --identity-height:calc(38px * var(--bg-ui-scale));

  --room-nav-left:27.2%;
  --room-nav-top:6.35%;
  --room-nav-width:45.5%;

  /* 页面可改颜色，不改结构尺寸 */
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);

  --nav-text:#6e4827;
  --nav-border:rgba(145,98,56,.34);
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:#e9dfd1;
}

body{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#6c4523;
  background:
    radial-gradient(circle at top left, rgba(246,238,226,.9) 0%, transparent 36%),
    radial-gradient(circle at top right, rgba(230,217,199,.82) 0%, transparent 38%),
    linear-gradient(180deg,#e9dfd1 0%, #ded1bf 100%);
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

#room{
  position:relative;
  z-index:3;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:transparent;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:#e9dfd1;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  z-index:1;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{
  pointer-events:auto;
}

/* =========================================================
   身份组件：全站统一结构
========================================================= */
#topActions{
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:var(--identity-width);
  height:var(--identity-height);
  min-width:0;
  min-height:0;
  z-index:65;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:var(--identity-bg);
  border:1px solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--ui-scale)) calc(24px * var(--ui-scale)) var(--identity-shadow),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:1;
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
  white-space:nowrap;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  display:block;
  line-height:1;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--ui-scale));
  top:calc(-6px * var(--ui-scale));
  min-width:calc(18px * var(--ui-scale));
  height:calc(18px * var(--ui-scale));
  padding:0 calc(5px * var(--ui-scale));
  border-radius:999px;
  background:#c98c4f;
  color:#fff9f1;
  font-size:calc(9px * var(--ui-scale));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--ui-scale)) solid rgba(255,248,239,0.98);
  box-shadow:0 2px 8px rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice #siteNoticeCount{
  display:flex;
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:min(calc(360px * var(--ui-scale)), 72vw);
  max-height:min(calc(540px * var(--ui-scale)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  background:rgba(255,249,241,0.98);
  border:1px solid rgba(203,167,123,0.28);
  box-shadow:0 16px 36px rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

#siteNoticePanel.show{
  display:block;
}

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--ui-scale));
  font-weight:900;
  margin-bottom:calc(10px * var(--ui-scale));
}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--ui-scale));
  line-height:1.6;
  padding:6px 2px 2px;
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--ui-scale));
}

.siteNoticeItem{
  padding:calc(10px * var(--ui-scale));
  border-radius:calc(12px * var(--ui-scale));
  background:rgba(255,252,247,0.82);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.92),
    0 2px 8px rgba(120,92,63,0.05);
}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1.5;
  margin-bottom:4px;
}

.siteNoticeItemDesc{
  color:#8a6644;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.55;
}

/* =========================================================
   房间切换按钮：客厅页不显示“客厅”按钮
   特效已按房间主题重写
========================================================= */
#topBar{
  position:absolute;
  left:var(--room-nav-left);
  top:var(--room-nav-top);
  width:var(--room-nav-width);
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:55;
  overflow:visible;
  pointer-events:none;

  --nav-btn-height:calc(40px * var(--ui-scale));
  --nav-btn-px:calc(16px * var(--ui-scale));
  --nav-btn-radius:calc(13px * var(--ui-scale));
  --nav-btn-font:calc(14px * var(--ui-scale));
  --nav-gap:calc(8px * var(--ui-scale));
}

#navOuter,
#navScroll{
  overflow:visible !important;
}

#navOuter{
  flex:0 0 auto;
  min-width:0;
  width:100%;
  pointer-events:auto;
}

#navScroll{
  width:100%;
  white-space:nowrap;
  padding:0 !important;
  margin:0 !important;
}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap);
  transform-origin:left center;
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height);
  padding:0 var(--nav-btn-px);
  border-radius:var(--nav-btn-radius);
  color:var(--nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  line-height:1;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid var(--nav-border);
  box-shadow:
    0 1px 1px rgba(255,255,255,.48) inset,
    0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease,
    filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:
    linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:
    0 1px 1px rgba(255,255,255,.55) inset,
    0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{
  position:relative;
  z-index:5;
  display:block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 1px 2px rgba(255,250,232,.82),
    0 0 8px rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{
  left:8%;
  top:-54%;
  font-size:calc(var(--nav-btn-font) * .92);
}

.navEffectB{
  right:8%;
  top:-62%;
  font-size:calc(var(--nav-btn-font) * .86);
}

.navEffectC{
  left:50%;
  top:-72%;
  transform:translateX(-50%);
  font-size:calc(var(--nav-btn-font) * 1.02);
}

@keyframes navFloatA{
  0%,100%{ transform:translateY(4px) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(-5px) rotate(6deg) scale(1); opacity:.76; }
}

@keyframes navFloatB{
  0%,100%{ transform:translateY(5px) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(-6px) rotate(-7deg) scale(1); opacity:.68; }
}

@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(6px) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(-6px) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:hover .navEffectA,
.navBtn:focus-visible .navEffectA{
  animation:navFloatA 2.2s ease-in-out infinite;
}

.navBtn:hover .navEffectB,
.navBtn:focus-visible .navEffectB{
  animation:navFloatB 2.5s ease-in-out infinite;
}

.navBtn:hover .navEffectC,
.navBtn:focus-visible .navEffectC{
  animation:navFloatC 2.35s ease-in-out infinite;
}

/* 各房间特效颜色 */
.navBtn[data-room="hall"] .navEffect{
  color:rgba(255,205,96,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.95),
    0 0 10px rgba(255,215,105,.62);
}

.navBtn[data-room="manager"] .navEffect{
  color:rgba(128,91,58,.82);
}

.navBtn[data-room="honor"] .navEffect{
  color:rgba(205,143,45,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.92),
    0 0 8px rgba(255,220,130,.52);
}

.navBtn[data-room="game"] .navEffect{
  color:rgba(117,91,150,.82);
}

.navBtn[data-room="studio"] .navEffect{
  color:rgba(96,112,145,.84);
}

.navBtn[data-room="dorm"] .navEffect{
  color:rgba(143,111,168,.76);
}

.navBtn[data-room="pets"] .navEffect{
  color:rgba(131,111,78,.82);
}

.navBtn[data-room="flower"] .navEffect{
  color:rgba(198,119,145,.82);
}

/* =========================================================
   客厅内容占位区：用于后续公告 / 排名 / 生日 / 发歌提醒
========================================================= */
#livingPanel{
  position:absolute;
  left:8.8%;
  top:18.5%;
  width:50%;
  min-height:48%;
  padding:calc(26px * var(--ui-scale));
  border-radius:calc(26px * var(--ui-scale));
  background:rgba(255,250,241,0.58);
  border:1px solid rgba(255,255,255,0.62);
  box-shadow:
    0 calc(12px * var(--ui-scale)) calc(34px * var(--ui-scale)) rgba(112,78,45,0.10),
    inset 0 1px 0 rgba(255,255,255,0.68);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
}

#livingPanelTitle{
  margin:0 0 calc(12px * var(--ui-scale));
  color:#714a2d;
  font-size:calc(24px * var(--ui-scale));
  font-weight:900;
  line-height:1.2;
}

#livingPanelDesc{
  margin:0;
  color:#8a6547;
  font-size:calc(14px * var(--ui-scale));
  line-height:1.8;
}

/* =========================================================
   540px 及以下手机版
========================================================= */
@media (max-width:540px){
  html,
  body{
    overflow-x:hidden;
    overflow-y:auto;
    height:auto;
    min-height:100%;
  }

  body{
    display:block;
    background:
      linear-gradient(rgba(243,236,223,.72), rgba(243,236,223,.92)),
      url("room-living.png") center center / cover no-repeat fixed;
  }

  #room{
    width:100%;
    height:auto;
    min-height:100vh;
    min-height:100dvh;
    display:block;
    overflow:visible;
    padding:10px 12px 14px;
  }

  #bgFrame{
    display:none;
  }

  #overlay{
    position:relative !important;
    left:auto !important;
    top:auto !important;
    width:100% !important;
    height:auto !important;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:visible;
    --ui-scale:1;
  }

  #topActions{
    position:sticky;
    top:10px;
    right:auto;
    left:auto;
    width:100%;
    height:40px;
    z-index:30;
    order:0;
  }

  #topIdentityBar{
    gap:6px;
    padding:5px 7px;
    border-radius:14px;
  }

  #topIdentityBadge{
    padding:0 9px;
    font-size:12px;
    border-radius:10px;
  }

  #loginOpenBtn,
  #logoutBtn{
    width:42px;
    min-width:42px;
    flex-basis:42px;
    font-size:11px;
    border-radius:10px;
  }

  #siteNoticeWrap{
    width:34px;
    min-width:34px;
    flex-basis:34px;
  }

  #siteNoticeBtn{
    font-size:14px;
    border-radius:10px;
  }

  #siteNoticePanel{
    position:fixed;
    top:58px;
    right:10px;
    left:10px;
    width:auto;
    max-height:60dvh;
    z-index:999;
  }

  #topBar{
    position:relative;
    left:auto;
    top:auto;
    width:100%;
    order:1;
    z-index:20;

    --nav-btn-height:34px;
    --nav-btn-px:8px;
    --nav-btn-radius:10px;
    --nav-btn-font:12px;
    --nav-gap:7px;
  }

  #roomNav{
    width:100%;
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:7px;
    transform:none !important;
  }

  .navBtn{
    width:100%;
    min-width:0;
    height:34px;
    padding:0 8px;
    font-size:12px;
    border-radius:10px;
    overflow:hidden;
  }

  .navEffect{
    display:none;
  }

  #livingPanel{
    position:relative;
    left:auto;
    top:auto;
    width:100%;
    min-height:320px;
    order:2;
    padding:20px 18px;
    border-radius:22px;
  }

  #livingPanelTitle{
    font-size:22px;
  }

  #livingPanelDesc{
    font-size:13px;
  }
}
</style>
</head>

<body>
<div id="room">
  <div id="bgFrame">
    <img id="bg" src="room-living.png" alt="十号房客厅背景" />
  </div>

  <div id="overlay">
    <!-- 身份组件 -->
    <div id="topActions">
      <div id="topIdentityBar">
        <div id="topIdentityBadge">
          <span class="identityText" id="currentUserText">参观者</span>
        </div>

        <div id="siteNoticeWrap">
          <button id="siteNoticeBtn" type="button" aria-label="查看提醒">
            <span id="siteNoticeIcon">🔔</span>
            <span id="siteNoticeCount">0</span>
          </button>

          <div id="siteNoticePanel" aria-live="polite">
            <div class="siteNoticeTitle">客厅提醒</div>
            <div id="siteNoticeContent">
              <div class="siteNoticeEmpty">暂无提醒。</div>
            </div>
          </div>
        </div>

        <button id="loginOpenBtn" type="button">登录</button>
        <button id="logoutBtn" class="hidden" type="button">登出</button>
      </div>
    </div>

    <!-- 房间切换按钮：客厅页不显示“客厅”按钮 -->
    <div id="topBar" aria-label="房间切换">
      <div id="navOuter">
        <div id="navScroll">
          <nav id="roomNav">
            <button class="navBtn" data-room="hall" type="button" onclick="enterRoom('index.html', false)">
              <span class="navLabel">大堂</span>
              <span class="navEffect navEffectA">✦</span>
              <span class="navEffect navEffectB">✧</span>
              <span class="navEffect navEffectC">★</span>
            </button>

            <button class="navBtn" data-room="manager" type="button" onclick="enterManagerRoom()">
              <span class="navLabel">宿管室</span>
              <span class="navEffect navEffectA">✎</span>
              <span class="navEffect navEffectB">▱</span>
              <span class="navEffect navEffectC">✐</span>
            </button>

            <button class="navBtn" data-room="honor" type="button" onclick="enterRoom('honor.html', false)">
              <span class="navLabel">荣誉墙</span>
              <span class="navEffect navEffectA">🏆</span>
              <span class="navEffect navEffectB">🏅</span>
              <span class="navEffect navEffectC">✦</span>
            </button>

            <button class="navBtn" data-room="game" type="button" onclick="enterRoom('game.html', false)">
              <span class="navLabel">游戏房</span>
              <span class="navEffect navEffectA">🎮</span>
              <span class="navEffect navEffectB">◆</span>
              <span class="navEffect navEffectC">🕹</span>
            </button>

            <button class="navBtn" data-room="studio" type="button" onclick="enterRoom('studio-todo.html', true)">
              <span class="navLabel">工作间</span>
              <span class="navEffect navEffectA">🎙</span>
              <span class="navEffect navEffectB">🎧</span>
              <span class="navEffect navEffectC">◇</span>
            </button>

            <button class="navBtn" data-room="dorm" type="button" onclick="enterRoom('dorm.html', true)">
              <span class="navLabel">宿舍</span>
              <span class="navEffect navEffectA">☁</span>
              <span class="navEffect navEffectB">☾</span>
              <span class="navEffect navEffectC">🛏</span>
            </button>

            <button class="navBtn" data-room="pets" type="button" onclick="enterRoom('pets.html', false)">
              <span class="navLabel">宠物区</span>
              <span class="navEffect navEffectA">🐾</span>
              <span class="navEffect navEffectB">♡</span>
              <span class="navEffect navEffectC">🐱</span>
            </button>

            <button class="navBtn" data-room="flower" type="button" onclick="enterRoom('flower.html', false)">
              <span class="navLabel">花房区</span>
              <span class="navEffect navEffectA">✿</span>
              <span class="navEffect navEffectB">❀</span>
              <span class="navEffect navEffectC">🌸</span>
            </button>
          </nav>
        </div>
      </div>
    </div>

    <!-- 客厅内容占位 -->
    <section id="livingPanel">
      <h1 id="livingPanelTitle">客厅公告栏</h1>
      <p id="livingPanelDesc">
        这里后续可以放生日公告、发歌公告、游戏排名、活动提醒等内容。
      </p>
    </section>
  </div>
</div>

<script>
const img = document.getElementById("bg");
const bgFrame = document.getElementById("bgFrame");
const overlay = document.getElementById("overlay");
const root = document.documentElement;
const roomNav = document.getElementById("roomNav");
const topBar = document.getElementById("topBar");

const currentUserText = document.getElementById("currentUserText");
const loginOpenBtn = document.getElementById("loginOpenBtn");
const logoutBtn = document.getElementById("logoutBtn");

const siteNoticeBtn = document.getElementById("siteNoticeBtn");
const siteNoticePanel = document.getElementById("siteNoticePanel");
const siteNoticeCount = document.getElementById("siteNoticeCount");
const siteNoticeContent = document.getElementById("siteNoticeContent");

function isTinyScreen(){
  return window.innerWidth <= 540;
}

/* =========================================================
   底图贴合坐标系统
========================================================= */
function syncOverlayToImage(){
  if(isTinyScreen()) return;
  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.34, Math.min(1.42, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));

  requestAnimationFrame(fitRoomNavToBar);
}

/* =========================================================
   房间按钮自动缩放，防止散开 / 溢出
========================================================= */
function fitRoomNavToBar(){
  if(!roomNav || !topBar || isTinyScreen()) return;

  roomNav.style.transform = "scale(1)";

  const availableWidth = topBar.clientWidth;
  const neededWidth = roomNav.scrollWidth;

  if(!availableWidth || !neededWidth) return;

  const fitScale = Math.min(1, availableWidth / neededWidth);
  roomNav.style.transform = `scale(${fitScale})`;
}

/* =========================================================
   登录身份读取：兼容旧页面和新页面存储
========================================================= */
function getStoredUser(){
  const oldLoggedIn = localStorage.getItem("room10LoggedIn") === "true";
  const oldUser = localStorage.getItem("room10User") || "";
  const oldRole = localStorage.getItem("room10Role") || "";
  const oldMemberId = localStorage.getItem("room10MemberId") || "";

  if(oldLoggedIn && oldUser){
    return {
      nickname:oldUser,
      role:oldRole || "member",
      member_id:oldMemberId
    };
  }

  try{
    const raw =
      localStorage.getItem("room10_user") ||
      localStorage.getItem("room10_current_user") ||
      localStorage.getItem("currentUser");

    if(!raw) return null;

    const data = JSON.parse(raw);
    if(!data) return null;

    return {
      nickname:data.nickname || data.name || "",
      role:data.role || "",
      member_id:data.member_id || data.id || ""
    };
  }catch(err){
    return null;
  }
}

function getRoleLabel(role){
  const value = String(role || "").toLowerCase();

  if(value === "owner") return "维修工";
  if(value === "admin") return "宿管";
  if(value === "member") return "房客";
  if(value === "applying") return "申请中";

  return "房客";
}

function isLoggedIn(){
  const user = getStoredUser();
  return !!(user && user.nickname);
}

function updateIdentityUI(){
  const user = getStoredUser();

  if(!currentUserText || !loginOpenBtn || !logoutBtn) return;

  if(!user || !user.nickname){
    currentUserText.textContent = "参观者";
    loginOpenBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    return;
  }

  currentUserText.textContent = `${user.nickname} | ${getRoleLabel(user.role)}`;
  loginOpenBtn.classList.add("hidden");
  logoutBtn.classList.remove("hidden");
}

function logout(){
  localStorage.removeItem("room10LoggedIn");
  localStorage.removeItem("room10User");
  localStorage.removeItem("room10Role");
  localStorage.removeItem("room10MemberId");
  localStorage.removeItem("room10MemberCode");
  localStorage.removeItem("room10ApplicantSession");
  localStorage.removeItem("room10ApplicationDraft");

  localStorage.removeItem("room10_user");
  localStorage.removeItem("room10_current_user");
  localStorage.removeItem("currentUser");

  updateIdentityUI();
  renderNoticeList([]);
  window.dispatchEvent(new CustomEvent("room10:logout"));
}

function openLogin(targetPage = ""){
  window.dispatchEvent(new CustomEvent("room10:open-login", {
    detail:{ targetPage }
  }));

  if(!targetPage){
    alert("请从大堂登录，或接入全站登录弹窗后这里会自动打开登录框。");
  }
}

/* =========================================================
   房间跳转
========================================================= */
function getCurrentRole(){
  const user = getStoredUser();
  return user && user.role ? String(user.role).toLowerCase() : "";
}

function getManagerPageByRole(){
  const role = getCurrentRole();

  if(role === "owner") return "manager-owner.html";
  if(role === "admin") return "manager-admin.html";
  if(role === "member") return "manager-member.html";

  return "manager-visitor.html";
}

function enterManagerRoom(){
  window.location.href = getManagerPageByRole();
}

function enterRoom(page, needLogin){
  const targetPage = String(page || "").trim();
  if(!targetPage) return;

  if(needLogin && !isLoggedIn()){
    openLogin(targetPage);
    return;
  }

  if((targetPage === "flower.html" || targetPage === "pets.html") && !isLoggedIn()){
    window.location.href = `${targetPage}?mode=guest`;
    return;
  }

  window.location.href = targetPage;
}

/* =========================================================
   提醒面板
========================================================= */
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function setNoticeCount(count){
  const n = Number(count) || 0;
  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);
}

function renderNoticeList(items){
  const list = Array.isArray(items) ? items : [];

  if(!list.length){
    siteNoticeContent.innerHTML = '<div class="siteNoticeEmpty">暂无提醒。</div>';
    setNoticeCount(0);
    return;
  }

  siteNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => `
        <div class="siteNoticeItem">
          <div class="siteNoticeItemTitle">${escapeHtml(item.title || "提醒")}</div>
          <div class="siteNoticeItemDesc">${escapeHtml(item.desc || "")}</div>
        </div>
      `).join("")}
    </div>
  `;

  setNoticeCount(list.length);
}

function toggleNoticePanel(){
  siteNoticePanel.classList.toggle("show");
}

function closeNoticePanel(){
  siteNoticePanel.classList.remove("show");
}

/* =========================================================
   初始化
========================================================= */
document.addEventListener("DOMContentLoaded", () => {
  updateIdentityUI();
  renderNoticeList([]);

  if(siteNoticeBtn){
    siteNoticeBtn.addEventListener("click", event => {
      event.stopPropagation();
      toggleNoticePanel();
    });
  }

  if(loginOpenBtn){
    loginOpenBtn.addEventListener("click", event => {
      event.stopPropagation();
      openLogin();
    });
  }

  if(logoutBtn){
    logoutBtn.addEventListener("click", event => {
      event.stopPropagation();
      logout();
    });
  }

  document.addEventListener("click", event => {
    if(siteNoticePanel && siteNoticeBtn){
      if(siteNoticePanel.contains(event.target) || siteNoticeBtn.contains(event.target)) return;
      closeNoticePanel();
    }
  });
});

window.addEventListener("resize", syncOverlayToImage);

window.addEventListener("storage", event => {
  if(
    event.key === "room10LoggedIn" ||
    event.key === "room10User" ||
    event.key === "room10Role" ||
    event.key === "room10MemberId" ||
    event.key === "room10_user" ||
    event.key === "room10_current_user" ||
    event.key === "currentUser"
  ){
    updateIdentityUI();
  }
});

if(img && img.complete && img.naturalWidth){
  syncOverlayToImage();
}else if(img){
  img.addEventListener("load", syncOverlayToImage, { once:true });
}

setTimeout(syncOverlayToImage, 80);
</script>
</body>
</html>
