    const message = String(data.message || "").trim();

    const quantityRaw = data.quantity;
    const petNo = Number(petNoRaw);
    const quantity = Number(quantityRaw);

    const missing = [];

    if (!message) missing.push("message");

    }
    if (!Number.isInteger(quantity) || quantity <= 0) {

  async function toggleSingerSubmitted(singerRecordId, currentValue) {
    const singerKey = String(singerRecordId || "").trim();
    if (!singerKey || pendingSingerSubmissionIds.has(singerKey)) return;

    pendingSingerSubmissionIds.add(singerKey);
    setSingerSubmissionBusy(singerKey, true);

    try {
      const task = tasks.find(item => (item.singers || []).some(singer => String(singer.id) === singerKey));
      const singer = task?.singers?.find(item => String(item.id) === singerKey);
      if (!task || !singer) throw new Error("未找到对应的项目演唱记录，请刷新后重试。");
      if (!canEditTaskFromDetail(task)) throw new Error("当前登录状态无效，请重新登录后再试。");

      const currentMemberId = String(getCurrentMemberId() || "").trim();
      const currentMemberCode = getCurrentMemberCode();
      if (!currentMemberId || !currentMemberCode) {
        throw new Error("当前成员身份读取失败，请重新登录后再试。");
      }

      const { data, error } = await supabaseClient.rpc("submit_project_singer_with_reward_v2", {
        p_member_id: currentMemberId,
        p_member_code: currentMemberCode,
        p_project_id: task.id,
        p_singer_record_id: singerKey,
        p_is_submitted: !currentValue
      });
      if (error) throw error;
      if (!data?.ok) throw new Error(data?.message || "交音状态未更新，请刷新后重试。");

      const targetName = String(data?.target_member_name || singer.member_name || "该成员").trim();
      const changedProjectId = String(task.id || "").trim();
      await loadProjectsFromSupabase();
      keepSingerTaskVisibleAfterRefresh(changedProjectId);

      if (!currentValue) {
        const rewardAmount = Number(data?.reward_amount || 0);
        const submissionMessage = data?.reward_granted && rewardAmount > 0
          ? `已为${targetName}记录交音，${rewardAmount} 金币已发放给${targetName}。`
          : `已为${targetName}记录交音。`;

        const encounterDisplay = await showAnimalEncounterModal(data, { submissionMessage });
        if (!encounterDisplay.shown) {
          let message = submissionMessage;

          if (encounterDisplay.triggered) {
            const fallbackData = data?.animal_encounter?.data || data?.animal_encounter_data || {};
            const petName = String(encounterDisplay.encounter?.petName || fallbackData.pet_name || "动物").trim();
            const quantity = Number(encounterDisplay.encounter?.quantity || fallbackData.quantity || 1);
            const safeQuantity = Number.isInteger(quantity) && quantity > 0 ? quantity : 1;
            message += `\n\n同时遇见了${petName}，${petName}图片卡 ×${safeQuantity} 已记录到${targetName}名下。偶遇图片弹窗暂未能显示。`;
          }

          showToast(encounterDisplay.triggered ? "交音成功并触发偶遇" : "交音成功", message);
        }
      } else {
        const retractedAmount = Number(data?.reward_retracted_amount || 0);
        const encounterResult = data?.animal_encounter && typeof data.animal_encounter === "object"
          ? data.animal_encounter
          : {};
        const encounterData = encounterResult.data && typeof encounterResult.data === "object"
          ? encounterResult.data
          : {};
        const animalRetracted = data?.animal_encounter_reward_retracted === true
          || encounterResult.reward_retracted === true;

        let message = data?.reward_retracted && retractedAmount > 0
          ? `已撤回${targetName}的交音，并从${targetName}名下扣回 ${retractedAmount} 金币。`
          : `已撤回${targetName}的交音。当前没有需要扣回的前期奖励。`;

        if (animalRetracted) {
          const petName = String(encounterData.pet_name || "动物偶遇").trim();
          const quantity = Number(encounterData.quantity || 1);
          const safeQuantity = Number.isInteger(quantity) && quantity > 0 ? quantity : 1;
          message += `\n\n同时从${targetName}名下扣回${petName}图片卡 ×${safeQuantity}；以后重新交音时会恢复同一张图片卡。`;
        }

        showToast("已撤回交音", message);
      }
    } catch (err) {
      console.error("更新交音状态失败：", err);
      showToast("操作失败", err?.message || "更新交音状态失败");
    } finally {
      pendingSingerSubmissionIds.delete(singerKey);
      setSingerSubmissionBusy(singerKey, false);
    }
  }

      return;
    }
    const singer = (task.singers || []).find(item => String(item.member_id || "") === memberId);
    if (!singer) {
      showToast("无法修改", "未找到对应演唱者。");
      return;
    }
    const currentLow = String(singer?.vocal_range?.lowest_note_text || "").trim();
    const currentHigh = String(singer?.vocal_range?.highest_note_text || "").trim();
    const lowest = field === "lowest" ? value : currentLow;
    const highest = field === "highest" ? value : currentHigh;
    const currentMemberId = String(getCurrentMemberId() || "").trim();
    const currentMemberCode = getCurrentMemberCode();
    if (!currentMemberId || !currentMemberCode) {
      throw new Error("当前成员身份读取失败，请重新登录后再试。");
    }
    const { data, error } = await supabaseClient.rpc("update_honor_vocal_range_entry", {
      p_actor_member_id: currentMemberId,
      p_actor_member_code: currentMemberCode,
      p_project_id: projectId,
      p_target_public_member_id: memberId,
      p_lowest_note_text: lowest || null,
      p_highest_note_text: highest || null
    });
    if (error) throw error;
    if (data?.ok === false) throw new Error(data?.message || "音域保存失败");
    await loadProjectsFromSupabase();
    activeDetailTaskId = projectId;
    renderBrowseList();
    renderBrowseDetail();
  }
  function beginInlineVocalRangeEdit(button) {
    if (!button || button.dataset.editing === "1") return;
    button.dataset.editing = "1";
    const oldValue = String(button.dataset.currentValue || "").trim();
    const input = document.createElement("input");
    input.type = "text";
    input.maxLength = 12;
    input.className = "inlineVocalRangeInput";
    input.value = oldValue;
    input.setAttribute("aria-label", button.dataset.rangeField === "lowest" ? "最低音" : "最高音");
    let finished = false;
    const cancel = () => {
      if (finished) return;
      finished = true;
      input.replaceWith(button);
      delete button.dataset.editing;
    };
    const commit = async () => {
      if (finished) return;
      finished = true;
      const nextValue = String(input.value || "").trim();
      if (nextValue === oldValue) {
        input.replaceWith(button);
        delete button.dataset.editing;
        return;
      }
      input.disabled = true;
      try {
        await saveInlineVocalRangeValue(button, nextValue);
      } catch (err) {
        console.error("保存音域失败：", err);
        input.replaceWith(button);
        delete button.dataset.editing;
        showToast("保存失败", err?.message || "音域保存失败");
      }
    };
    button.replaceWith(input);
    input.focus();
    input.select();
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        input.blur();
      } else if (event.key === "Escape") {
        event.preventDefault();
        cancel();
      }
    });
    input.addEventListener("blur", commit, { once:true });
  }
  if (browseDetailContentTask) {
    browseDetailContentTask.addEventListener("click", event => {
      const button = event.target.closest('button[data-inline-vocal-range="1"]');
      if (!button || !browseDetailContentTask.contains(button)) return;
      event.preventDefault();
      event.stopPropagation();
      beginInlineVocalRangeEdit(button);
    });
  }
  if (browseEditBtnTask) {
    browseEditBtnTask.addEventListener("click", () => {
      openTaskEditModal(activeDetailTaskId);
    });
  }
  if (editTaskModeNormalBtn) {
    editTaskModeNormalBtn.addEventListener("click", async () => {

  }
  if (editTaskModeSpecialBtn) {

      await refreshTaskEditEligibleMembers();

  taskEditCancelBtn.addEventListener("click", () => closeTaskEditModal(true));
  taskEditMask.addEventListener("click", (event) => {

  if (editProducerPicker) {

      if (!btn || !editProducerPicker.contains(btn) || event.target === editProducerPicker) return;
      event.preventDefault();
      event.stopPropagation();
      const kind = String(btn.dataset.producerKind || "internal");
      if (kind === "external") {
        currentEditingProducerIsExternal = !currentEditingProducerIsExternal;
        currentEditingProducerMemberId = "";
      } else {

      }
      renderProducerPicker(currentEditingProducerMemberId);
    });
  }
  editTaskType?.addEventListener("change", async () => {
    syncToneField();

  });
  editSingerQuota.addEventListener("change", () => {
    const currentQuota = Math.max(1, Math.floor(Number(editSingerQuota.dataset.prevQuota || editSingerQuota.value) || 1));
    const quota = Math.max(1, Math.floor(Number(editSingerQuota.value) || 1));
    const guard = canResizePartRowsToQuota(quota, { preserveCurrent: true });
    if (!guard.ok) {
      editSingerQuota.value = String(currentQuota);
      showToast("无法减少人数", guard.message || "请先清空将被裁掉行中的内容。");
      return;
    }
    editSingerQuota.value = String(quota);
    editSingerQuota.dataset.prevQuota = String(quota);
    syncEditPartRowsToQuota(true);
    renderEditPartRows();
    bindEditPartRowButtons();
  });
  editSingerMemberList.addEventListener("click", (event) => {
    const btn = event.target.closest(".memberCheckItem[data-member-id]");
    if (!btn) return;
    const memberId = String(btn.dataset.memberId || "");
    const currentIds = getEditableSingerIds();
    const quota = Math.max(1, Math.floor(Number(editSingerQuota.value) || 1));
    const isActive = btn.classList.contains("active");
    if (!isActive && currentIds.length >= quota) {
      showToast("人数超出", "勾选的演唱者人数不能超过“演唱人数”。");
      return;
    }
    if (isActive) {
      const currentRows = getCurrentPartDraftFromDom();
      const stillUsed = currentRows.some(row => String(row.assigned_member_id || "").trim() === memberId);
      if (stillUsed) {
        showToast("无法移除", "该演唱者仍在歌词分配中使用，请先清空对应行右侧成员。")
        return;
      }
    }
    btn.classList.toggle("active");
    const stillSelected = getEditableSingerIds();
    editPartDraftRows = editPartDraftRows.map(row => stillSelected.includes(String(row.assigned_member_id || "")) ? row : { ...row, assigned_member_id: "", assigned_member_name: "" });
    syncEditPartRowsToQuota(false);
    renderEditPartRows();
    bindEditPartRowButtons();
  });
  document.getElementById("browsePrimaryBtnTask").addEventListener("click", async () => {
    await loadProjectsFromSupabase();
  });
  detailSearchInput.addEventListener("input", (e) => {
    detailSearchKeyword = e.target.value;
    const filtered = getFilteredTasks(detailSearchKeyword);
    if (!filtered.some(task => task.id === activeDetailTaskId)) {
      activeDetailTaskId = filtered.length ? filtered[0].id : "";
    }
    renderBrowseList();
    renderBrowseDetail();
  });
  document.querySelectorAll(".taskFilterBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      taskFilterMode = btn.dataset.taskFilter;
      updateTaskFilterButtons();
      const filtered = getFilteredTasks(detailSearchKeyword);
      if (!filtered.some(task => task.id === activeDetailTaskId)) {
        activeDetailTaskId = filtered.length ? filtered[0].id : "";
      }
      renderBrowseList();
      renderBrowseDetail();
    });
  });
  document.getElementById("goOverviewBtn").addEventListener("click", () => {
  window.location.href = getRoom10Page("studioOverview");
});
document.getElementById("goClaimBtn").addEventListener("click", () => {

document.getElementById("goProjectBtn").addEventListener("click", () => {
  return;
});
document.getElementById("goTaskBtn").addEventListener("click", () => {
  window.location.href = getRoom10Page("studioSubmit");
});
  document.querySelectorAll(".navBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const roomKey = btn.dataset.room;
      if (roomKey === "manager") {
        const role = getCurrentRole();
        const pageKey =
          role === "owner" ? "managerOwner" :

        window.location.href = getRoom10Page(pageKey);

  document.getElementById("logoutBtn").addEventListener("click", handleLogout);
  bg.addEventListener("load", syncOverlayToImage);

  window.addEventListener("storage", async (e) => {
    if (e.key === STORAGE_KEYS.studioJumpIntent) {
      pendingStudioJumpIntent = readStudioJumpIntent();
      applyIncomingStudioJumpIntent();
      return;
    }
    if ([STORAGE_KEYS.loggedIn, STORAGE_KEYS.user, STORAGE_KEYS.role, STORAGE_KEYS.memberId, STORAGE_KEYS.memberCode].includes(e.key)) {
      const ok = await ensureAuthState();
      if (!ok) return;
      updateTopBarIdentity();
      await loadProjectsFromSupabase();
      renderSiteNotifications();
    }
  });
  document.addEventListener("click", (event) => {
    if (!event.target.closest("#siteNoticeWrap")) {

    }
  });
  siteNoticeBtn?.addEventListener("click", (event) => {
    event.stopPropagation();
    renderSiteNotifications();
    toggleSiteNoticePanel();
  });
  window.addEventListener("DOMContentLoaded", async () => {
    const ok = await ensureAuthState();
    if (!ok) return;
    updateTopBarIdentity();
    syncOverlayToImage();
    updateTaskFilterButtons();
    await loadMembersFromSupabase();
    await loadProjectsFromSupabase();
    renderSiteNotifications();
  });
  window.addEventListener("resize", syncOverlayToImage);
  window.addEventListener("orientationchange", syncOverlayToImage);
  if ("ResizeObserver" in window) {
    const ro = new ResizeObserver(syncOverlayToImage);
    ro.observe(room);
  }</script></body></html>
