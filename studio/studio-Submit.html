  function toChineseDbError(error, fallback = "操作失败，请稍后重试。") {
    const message = String(error?.message || error || "").trim();
    if (!message) return fallback;
    return message
      .replace(/duplicate key value violates unique constraint/gi, "数据已存在")
      .replace(/violates row-level security policy/gi, "当前账号没有操作权限")
      .replace(/invalid input syntax for type uuid/gi, "成员数据格式无效，请刷新页面")
      .replace(/null value in column/gi, "必填资料不完整");
  }

    try {

      return true;
    } catch (error) {
      console.error("登录状态校验失败：", error);
      showToast("读取失败", toChineseDbError(error, "无法验证当前成员身份。"));

  async function loginWithKey(nickname, key) {
    const safeNickname = String(nickname || "").trim();
    const safeKey = String(key || "").trim();

    if (!safeNickname || !safeKey) {
      return { ok: false, message: "请输入昵称和KEY" };
    }

    try {
      const { data, error } = await supabaseClient.rpc("verify_member_login", {
        input_nickname: safeNickname,
        input_code: safeKey
      });

      if (error) {
        console.error("KEY 登录失败：", error);
        return { ok: false, message: error.message || "登录失败，请稍后再试" };
      }

      if (!Array.isArray(data) || !data.length) {
        return { ok: false, message: "昵称或KEY错误" };
      }

      const user = data[0];
      authState.loggedIn = true;
      authState.nickname = String(user.nickname || safeNickname).trim();
      authState.role = String(user.role || "member").toLowerCase();
      authState.memberId = String(user.member_id || "");
      authState.memberCode = String(user.member_code || safeKey).trim();
      authState.initialized = true;

      localStorage.setItem(STORAGE_KEYS.loggedIn, "true");
      localStorage.setItem(STORAGE_KEYS.user, authState.nickname);
      localStorage.setItem(STORAGE_KEYS.role, authState.role);
      localStorage.setItem(STORAGE_KEYS.memberId, authState.memberId);
      localStorage.setItem(STORAGE_KEYS.memberCode, authState.memberCode);

      return { ok: true, user };
    } catch (err) {
      console.error("KEY 登录异常：", err);
      return { ok: false, message: err?.message || "登录失败，请稍后再试" };
    }
  }

  function parseProjectOriginalArtists(value) {
    return [...new Set(
      String(value || "").split(/[\n\r,，、;；]+/).map(item => item.trim()).filter(Boolean)
    )];
  }
  

  function normalizeConfiguredTypeOptions(rawOptions) {
    if (!Array.isArray(rawOptions)) return [];
    const seen = new Set();
    return rawOptions
      .map((item, index) => {
        if (typeof item === "string") {
          const value = item.trim();
          return value ? { value, label: value, sortOrder: 100 + index } : null;
        }
        if (!item || typeof item !== "object") return null;
        const value = String(item.value ?? item.type ?? item.key ?? item.label ?? "").trim();
        const label = String(item.label ?? item.name ?? value).trim() || value;
        const sortOrder = Number(item.sort_order ?? item.sortOrder ?? item.order ?? (100 + index));
        return value ? {
          value,
          label,
          sortOrder: Number.isFinite(sortOrder) ? sortOrder : 100 + index
        } : null;
      })
      .filter(option => {
        if (!option || seen.has(option.value)) return false;
        seen.add(option.value);
        return true;
      })
      .sort((a, b) => {
        if (a.sortOrder !== b.sortOrder) return a.sortOrder - b.sortOrder;
        return a.label.localeCompare(b.label, "zh-Hans-CN", { numeric: true, sensitivity: "base" });
      });
  }

    typeBtnGroup.innerHTML = projectTypes.length

  function pruneInvalidSelections() {
    const singerIds = new Set(members.filter(member => member.canSing).map(member => member.id));
    const mixerIds = new Set(members.filter(member => member.canMix).map(member => member.id));
    const removed = selectedSingerIds.filter(id => !singerIds.has(id));
    selectedSingerIds = selectedSingerIds.filter(id => singerIds.has(id));
    removed.forEach(removeSingerFromLyricRows);
    if (selectedProducerId && !mixerIds.has(selectedProducerId)) selectedProducerId = "";

  async function refreshSubmitFormData({ preserveSelection = true, silent = false } = {}) {
    const requestId = ++submitFormRequestId;
    const memberId = String(authState.memberId || localStorage.getItem(STORAGE_KEYS.memberId) || "").trim();
    const memberCode = String(authState.memberCode || localStorage.getItem(STORAGE_KEYS.memberCode) || "").trim();
    if (!memberId || !memberCode) throw new Error("请重新登录后再试");

    const { data, error } = await supabaseClient.rpc("get_studio_submit_form_data", {
      p_member_id: memberId,
      p_member_code: memberCode,
      p_project_type: selectedType,
      p_game_type: null,
      p_participant_count: getSingerQuota({ write: false }),
      p_is_collective_task: selectedTaskMode === "special"
    });
    if (error) throw error;
    if (requestId !== submitFormRequestId) return false;

    const payload = data && typeof data === "object" ? data : {};
    submitFormState.nextProjectCode = String(payload.next_project_code || "001");
    submitFormState.currentPublicMemberId = String(payload.current_member_id || "");
    submitFormState.toneRequired = payload.tone_required !== false;
    submitFormState.canCreate = payload.can_create !== false;
    submitFormState.permissionMessage = String(payload.permission_message || "");
    submitFormState.rewards = payload.rewards || null;
    submitFormState.projectTypes = normalizeConfiguredTypeOptions(payload.project_types);
    if (!submitFormState.projectTypes.length) {
      throw new Error("数据库项目类型配置缺失，请检查 system_settings.project_type_options。");
    }

    const configuredTypeValues = new Set(
      submitFormState.projectTypes.map(option => option.value)
    );
    const serverSelectedType = String(payload.selected_project_type || "").trim();
    if (!configuredTypeValues.has(selectedType)) {
      selectedType = configuredTypeValues.has(serverSelectedType)
        ? serverSelectedType
        : submitFormState.projectTypes[0].value;
    }


    authState.publicMemberId = submitFormState.currentPublicMemberId;
    authState.nickname = String(payload.current_member_nickname || authState.nickname || "").trim();
    authState.role = String(payload.current_member_role || authState.role || "member").toLowerCase();
    localStorage.setItem(STORAGE_KEYS.user, authState.nickname);
    localStorage.setItem(STORAGE_KEYS.role, authState.role);

    members = normalizeMembers(Array.isArray(payload.members) ? payload.members : []);
    if (!preserveSelection) {
      selectedSingerIds = [];
      selectedProducerId = "";
      selectedProducerIsExternal = false;
    }
    pruneInvalidSelections();
    projectAutoCodeEl.textContent = submitFormState.nextProjectCode;
    renderTypeOptions();
    syncProjectRuleUi();
    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
    updateTopBarIdentity();
    return true;
  }

      .map(memberId => getMemberById(memberId))
      .filter(member => member && (!usedSingerIds.has(member.id) || originalRows.some(row => row.id === rowId && row.assignedSingerId === member.id)));

  function findSingerMemberByText(text, rowId = "") {
    const normalized = String(text || "").trim();
    if (!normalized) return null;
    const exactSelected = getAssignableSingerMembers(rowId).find(member => member.name === normalized || member.nickname === normalized);
    if (exactSelected) return exactSelected;

      .join("");

  function getLyricsLotteryReadyState() {
    const quota = getSingerQuota();
    const rows = originalRows.slice(0, quota);
    const selectedSingerCount = selectedSingerIds.length;
    const projectOriginalPool = parseProjectOriginalArtists(projectOriginalArtistsInput?.value || "");
    const allOriginalFilled = projectOriginalPool.length >= quota
      || (rows.length === quota && rows.every(row => String(row.original || "").trim()));
    const singersFull = selectedSingerCount === quota;

    return {
      quota,
      selectedSingerCount,
      rowsCount: rows.length,
      singersFull,
      allOriginalFilled,
      ready: singersFull && allOriginalFilled
    };
  }

  function getCurrentSingerMember() {
    const currentMemberId = String(authState.publicMemberId || submitFormState.currentPublicMemberId || "").trim();
    if (!currentMemberId) return null;
    if (!selectedSingerIds.includes(currentMemberId)) return null;
    return getMemberById(currentMemberId);
  }

  function getCurrentUserLotteryRow() {
    const currentMemberId = String(authState.publicMemberId || submitFormState.currentPublicMemberId || "").trim();
    if (!currentMemberId) return null;
    return originalRows.find(row => String(row.assignedSingerId || "") === currentMemberId) || null;
  }

  function getPendingLotteryRows() {
    const quota = getSingerQuota();
    return originalRows
      .slice(0, quota)
      .filter(row => String(row.original || "").trim() && !String(row.assignedSingerId || "").trim());
  }

  function getLotteryEnabledHintText() {
    const drawnRow = getCurrentUserLotteryRow();
    if (drawnRow && String(drawnRow.original || "").trim()) {
      return `你抽到：${String(drawnRow.original || "").trim()}。提交后，请提醒其他演唱者去待处理页抽签。`;
    }
    return "提交后，请提醒其他演唱者去待处理页抽签。";
  }

  function syncLyricsLotteryButton() {
    if (!enableLyricsLotteryBtn) return;

    const state = getLyricsLotteryReadyState();

    if (!state.ready) {
      lyricsLotteryEnabled = false;
      enableLyricsLotteryBtn.hidden = true;
      enableLyricsLotteryBtn.classList.remove("active");
      enableLyricsLotteryBtn.textContent = "开启抽签";
      if (lyricsLotteryHint) {
        lyricsLotteryHint.hidden = true;
        lyricsLotteryHint.textContent = "";
      }
      return;
    }

    enableLyricsLotteryBtn.hidden = false;
    enableLyricsLotteryBtn.classList.toggle("active", lyricsLotteryEnabled);
    enableLyricsLotteryBtn.textContent = lyricsLotteryEnabled ? "已抽取" : "开启抽签";

    if (lyricsLotteryHint) {
      lyricsLotteryHint.hidden = !lyricsLotteryEnabled;
      lyricsLotteryHint.textContent = lyricsLotteryEnabled ? getLotteryEnabledHintText() : "";
    }
  }

  function handleEnableLyricsLotteryClick() {
    const state = getLyricsLotteryReadyState();

    if (!state.ready) {
      showToast("暂不能开启", "需要先选满演唱者，并补全所有原唱 / 部分名称。");
      syncLyricsLotteryButton();
      syncSubmitToolButtons();
      return;
    }

    const currentSinger = getCurrentSingerMember();
    if (!currentSinger) {
      showToast("暂不能开启", "开启抽签会先抽取填写人本人的部分。请先把当前登录成员加入演唱者，再开启抽签。");
      syncLyricsLotteryButton();
      return;
    }

    let drawnRow = getCurrentUserLotteryRow();

    if (!drawnRow) {
      const pendingRows = getPendingLotteryRows();
      if (!pendingRows.length) {
        showToast("暂不能开启", "当前没有可抽取的空原唱行，请先清空一个分配给本人抽取。");
        syncLyricsLotteryButton();
        return;
      }

      const pickedRow = pendingRows.length === 1
        ? pendingRows[0]
        : pendingRows[Math.floor(Math.random() * pendingRows.length)];

      originalRows = originalRows.map(row => (
        row.id === pickedRow.id
          ? { ...row, assignedSingerId: currentSinger.id, assignedSingerName: currentSinger.name }
          : row
      ));

      drawnRow = originalRows.find(row => row.id === pickedRow.id) || pickedRow;
      syncOriginalAssignedNames();
      renderOriginalRows();
    }

    lyricsLotteryEnabled = true;
    syncLyricsLotteryButton();

    const partName = String(drawnRow.original || "").trim();
    showToast(
      "已开启抽签",
      `你抽到：${partName || "未命名部分"}。
提交任务后，请提醒其他演唱者去待处理页自行抽签。`
    );
  }

  function getUsedSingerIds(excludeRowId = "") {
    return Array.from(new Set(
      originalRows
        .filter(row => !excludeRowId || row.id !== excludeRowId)
        .map(row => String(row.assignedSingerId || "").trim())
        .filter(Boolean)
    ));
  }

  function keepAtLeastOneRow() {
    if (!originalRows.length) {
      originalRows = [createRow()];
    }
  }

  function syncRowsToQuota() {
    const quota = getSingerQuota();

    if (originalRows.length > quota) {
      originalRows = originalRows.slice(0, quota);
    }

    while (originalRows.length < quota) {
      originalRows.push(createRow());
    }

    keepAtLeastOneRow();
  }

  function removeSingerFromLyricRows(memberId) {
    const nextRows = [];

    for (const row of originalRows) {
      if (row.assignedSingerId !== memberId) {
        nextRows.push(row);
        continue;
      }

      if (String(row.original || "").trim()) {
        nextRows.push({
          ...row,
          assignedSingerId: "",
          assignedSingerName: ""
        });
      }
    }

    originalRows = nextRows;
    keepAtLeastOneRow();
  }

  function trimRowsToQuota(quota) {
    if (originalRows.length > quota) {
      originalRows = originalRows.slice(0, quota);
    }
    keepAtLeastOneRow();
  }

  function applyQuotaConstraints(showLimitToast = false) {
    const quota = getSingerQuota();

    if (selectedSingerIds.length > quota) {
      const removedIds = selectedSingerIds.slice(quota);
      selectedSingerIds = selectedSingerIds.slice(0, quota);
      removedIds.forEach(memberId => removeSingerFromLyricRows(memberId));
      if (showLimitToast && removedIds.length) {
        showToast("已调整", "演唱人数减少后，已自动移除超出上限的演唱者。");
      }
    }

    trimRowsToQuota(quota);
    syncRowsToQuota();
    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
  }

  function handleSingerMemberToggle(memberId) {
    const exists = selectedSingerIds.includes(memberId);

    if (exists) {
      selectedSingerIds = selectedSingerIds.filter(id => id !== memberId);
      removeSingerFromLyricRows(memberId);
    } else {
      const quota = getSingerQuota();
      if (selectedSingerIds.length >= quota) {
        showToast("超过上限", "当前演唱者数量不能超过演唱人数。");
        return;
      }

      selectedSingerIds.push(memberId);
    }

    syncRowsToQuota();
    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
  }

  function handleProducerMemberToggle(memberId) {
    selectedProducerId = selectedProducerId === memberId ? "" : memberId;
    renderProducerMembers();
  }


  function getWheelAssignmentState() {
    const quota = getSingerQuota({ write:false });
    const rows = originalRows.slice(0, quota);
    const selectedSingerSet = new Set(selectedSingerIds.map(String));
    const assignedSingerIds = new Set();
    let assignmentValid = true;

    for (const row of rows) {
      const singerId = String(row.assignedSingerId || "").trim();
      if (!singerId) continue;
      if (!selectedSingerSet.has(singerId) || assignedSingerIds.has(singerId)) {
        assignmentValid = false;
      }
      assignedSingerIds.add(singerId);
    }

    const pendingRows = rows.filter(row => !String(row.assignedSingerId || "").trim());
    const pendingSingerIds = selectedSingerIds.filter(id => !assignedSingerIds.has(String(id)));

    return {
      quota,
      rows,
      assignedSingerIds,
      pendingRows,
      pendingSingerIds,
      assignmentValid,
      hasAssignedRows: assignedSingerIds.size > 0,
      allAssigned: rows.length === quota && pendingRows.length === 0,
      pendingBalanced: pendingRows.length === pendingSingerIds.length
    };
  }

  function getWheelReadyState() {
    const assignment = getWheelAssignmentState();
    const { quota, rows, pendingRows, pendingSingerIds } = assignment;
    const canUseWheel = selectedType === "游戏" || selectedTaskMode === "special";
    const singersFull = selectedSingerIds.length === quota;
    const allOriginalFilled = rows.length === quota && rows.every(row => String(row.original || "").trim());

    let message = "";
    if (!canUseWheel) {
      message = "转盘仅用于游戏类任务或特殊任务。";
    } else if (!singersFull) {
      message = `请先按演唱人数选满演唱者（当前 ${selectedSingerIds.length}/${quota}）。`;
    } else if (!allOriginalFilled) {
      message = "请先填写足够的项目原唱名单，或补全所有原唱 / 部分名称，再打开转盘。";
    } else if (!assignment.assignmentValid) {
      message = "当前分配中有重复成员或成员不在已选演唱者内，请先修正。";
    } else if (assignment.allAssigned) {
      message = "所有演唱者都已分配完成，无需再打开转盘。";
    } else if (!assignment.pendingBalanced) {
      message = `剩余未分配成员与原唱数量不一致（成员 ${pendingSingerIds.length} / 原唱 ${pendingRows.length}）。`;
    }

    return {
      ...assignment,
      canUseWheel,
      singersFull,
      allOriginalFilled,
      ready: canUseWheel
        && singersFull
        && allOriginalFilled
        && assignment.assignmentValid
        && !assignment.allAssigned
        && assignment.pendingBalanced
        && pendingRows.length > 0,
      message
    };
  }

  function syncSubmitToolButtons() {
    if (!openWheelBtn) return;
    const state = getWheelReadyState();

    openWheelBtn.hidden = !state.canUseWheel;
    openWheelBtn.disabled = !state.ready;
    openWheelBtn.classList.toggle("active", state.ready);
    openWheelBtn.title = state.ready ? "打开转盘分配歌词" : (state.message || "暂不能打开转盘");

    if (clearWheelAssignBtn) {
      clearWheelAssignBtn.hidden = !state.canUseWheel;
      clearWheelAssignBtn.disabled = !state.hasAssignedRows;
      clearWheelAssignBtn.title = state.hasAssignedRows ? "清空歌词分配中的成员" : "当前没有可清空的分配";
    }
  }

  function parseQuickOriginalText(text) {
    return String(text || "")
      .split(/[\n,，]+/)
      .map(item => item.trim())
      .filter(Boolean)
      .map(item => {
        const parts = item.split(/\s*[–—-]\s*/);
        const original = String(parts[0] || "").trim();
        const singerText = parts.length > 1 ? String(parts.slice(1).join("–") || "").trim() : "";
        return { original, singerText };
      })
      .filter(item => item.original);
  }

  function applyQuickOriginalText() {
    const entries = parseQuickOriginalText(quickOriginalInput?.value || "");
    if (!entries.length) {
      showToast("没有内容", "请先粘贴或输入原唱名称。");
      return;
    }

    const currentQuota = getSingerQuota({ write:false });
    if (entries.length > currentQuota) {
      singerQuotaInput.value = String(Math.min(99, entries.length));
    }

    const nextRows = entries.slice(0, 99).map(entry => {
      const matched = findSingerMemberByText(entry.singerText, "");
      return createRow({
        original: entry.original,
        assignedSingerId: matched ? matched.id : "",
        assignedSingerName: matched ? matched.name : ""
      });
    });

    originalRows = nextRows.length ? nextRows : [createRow()];
    syncRowsToQuota();
    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();

    const missed = entries.filter(entry => entry.singerText && !findSingerMemberByText(entry.singerText, "")).length;
    showToast("已填入", missed ? `已填入原唱。${missed} 个演唱者未在已选演唱者中找到，未自动分配。` : "已填入原唱分配。");
  }

    }));

  function makeStudioWheelChannelId() {
    return `submit-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
  }

  function buildStudioWheelPayload() {
    const assignment = getWheelAssignmentState();
    const { quota, rows, pendingRows, pendingSingerIds } = assignment;
    studioWheelChannelId = makeStudioWheelChannelId();
    studioWheelPendingPartIds = pendingRows.map(row => String(row.id));

    return {
      type: "ROOM10_WHEEL_INIT",
      mode: "studio_submit",
      integration_mode: "submit",
      channel_id: studioWheelChannelId,
      title: "角色转盘",
      subtitle: songNameInput.value.trim()
        ? `项目委托：${songNameInput.value.trim()}（仅分配剩余 ${pendingRows.length} 组）`
        : `用于项目委托立项前的剩余角色分配（${pendingRows.length} 组）`,
      singers: pendingSingerIds
        .map(id => getMemberById(id))
        .filter(Boolean)
        .map(member => ({
          id: member.id,
          member_id: member.id,
          name: member.name,
          label: member.name
        })),
      roles: pendingRows.map((row, pendingIndex) => {
        const rowIndex = rows.findIndex(item => String(item.id) === String(row.id));
        const pool = parseProjectOriginalArtists(projectOriginalArtistsInput?.value || "");
        const used = new Set(
          rows.filter(item => String(item.assignedSingerId || "").trim())
            .map(item => String(item.original || "").trim()).filter(Boolean)
        );
        const available = pool.filter(name => !used.has(name));
        const originalName = available[pendingIndex] || String(row.original || "").trim();
        return {
          id: row.id,
          part_id: row.id,
          row_index: rowIndex,
          target_row_index: rowIndex,
          original_name: originalName,
          source_original_name: originalName,
          label: originalName
        };
      }),
      context: {
        source: "studio_submit",
        integration_mode: "submit",
        channel_id: studioWheelChannelId,
        task_type: selectedType,
        game_type: null,
        task_mode: selectedTaskMode,
        singer_quota: quota,
        fixed_assignment_count: quota - pendingRows.length,
        pending_assignment_count: pendingRows.length,
        preserve_existing_assignments: true
      }
    };
  }

  function postStudioWheelPayload() {
    if (!studioWheelModalFrame?.contentWindow || !studioWheelPendingPayload) return false;
    try {
      studioWheelModalFrame.contentWindow.postMessage(studioWheelPendingPayload, "*");
      return true;
    } catch (error) {
      console.warn("转盘资料发送失败：", error);
      return false;
    }
  }

  function closeStudioWheelModal() {
    if (studioWheelRetryTimer) {
      clearInterval(studioWheelRetryTimer);
      studioWheelRetryTimer = null;
    }
    if (studioWheelModalFrame) {
      studioWheelModalFrame.onload = null;
      studioWheelModalFrame.dataset.pendingPayload = "";
      studioWheelModalFrame.src = "about:blank";
    }
    studioWheelModalMask?.classList.remove("show");
    studioWheelModalMask?.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    studioWheelPendingPayload = null;
    studioWheelChannelId = "";
    studioWheelReady = false;
    studioWheelPendingPartIds = [];
  }

  function openStudioWheelTool() {
    const state = getWheelReadyState();
    if (!state.ready) {
      showToast("暂不能开启", state.message || "请先补全转盘需要的信息。");
      syncSubmitToolButtons();
      return;
    }

    const payload = buildStudioWheelPayload();
    const wheelPage = String(links.studioWheel || "").trim();
    if (!wheelPage) {
      showToast("路径配置错误", "room10-paths.js 中缺少 studioWheel 页面路径。");
      return;
    }
    if (!studioWheelModalMask || !studioWheelModalFrame) {
      showToast("页面配置错误", "项目委托页缺少转盘弹窗容器。");
      return;
    }

    const params = new URLSearchParams({
      from: "submit",
      mode: "submit",
      embed: "1",
      channel_id: studioWheelChannelId,
      v: "20260726-inpage-modal"
    });

    studioWheelPendingPayload = payload;
    studioWheelReady = false;
    studioWheelModalFrame.dataset.pendingPayload = JSON.stringify(payload);
    studioWheelModalFrame.onload = () => {
      const rawPayload = studioWheelModalFrame.dataset.pendingPayload || "";
      if (!rawPayload) return;
      try {
        studioWheelPendingPayload = JSON.parse(rawPayload);
        postStudioWheelPayload();
      } catch (error) {
        console.warn("转盘资料读取失败：", error);
      }
    };

    studioWheelModalMask.classList.add("show");
    studioWheelModalMask.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    studioWheelModalFrame.src = `${wheelPage}${wheelPage.includes("?") ? "&" : "?"}${params.toString()}`;

    setTimeout(() => { if (!studioWheelReady) postStudioWheelPayload(); }, 180);
    setTimeout(() => { if (!studioWheelReady) postStudioWheelPayload(); }, 500);

    studioWheelRetryTimer = setInterval(() => {
      if (!studioWheelModalMask.classList.contains("show")) {
        closeStudioWheelModal();
        return;
      }
      if (studioWheelReady) {
        clearInterval(studioWheelRetryTimer);
        studioWheelRetryTimer = null;
        return;
      }
      postStudioWheelPayload();
    }, 900);
  }

  function getStudioWheelPairings(result) {
    if (Array.isArray(result?.pairs)) return result.pairs;
    if (Array.isArray(result?.rows)) return result.rows;
    if (Array.isArray(result?.assignments)) return result.assignments;
    if (Array.isArray(result?.results)) return result.results;
    return [];
  }

  function applyWheelResultToRows(result) {
    const pairings = getStudioWheelPairings(result);
    if (!pairings.length) {
      showToast("转盘结果未写入", "没有收到有效的转盘配对结果。");
      return;
    }

    const pendingPartIds = new Set(studioWheelPendingPartIds.map(String));
    if (!pendingPartIds.size) {
      showToast("转盘结果未写入", "当前没有等待转盘分配的原唱。");
      return;
    }

    const nextRows = originalRows.map(row => ({ ...row }));
    const rowIndexById = new Map(nextRows.map((row, index) => [String(row.id), index]));
    const fixedSingerIds = new Set(
      nextRows
        .filter(row => !pendingPartIds.has(String(row.id)))
        .map(row => String(row.assignedSingerId || "").trim())
        .filter(Boolean)
    );
    const resultSingerIds = new Set();
    let updatedCount = 0;

    for (const item of pairings) {
      const role = item?.role || item?.original || item?.part || item;
      const partId = String(
        item?.part_id || role?.part_id || role?.id || item?.id || ""
      ).trim();
      if (!partId || !pendingPartIds.has(partId)) continue;

      const rowIndex = rowIndexById.get(partId);
      if (rowIndex === undefined) continue;
      const existing = nextRows[rowIndex];
      const singerId = String(
        item?.member_id ||
        item?.singer?.member_id ||
        item?.singer?.id ||
        item?.assignedSingerId ||
        ""
      ).trim();
      const singerText = String(
        item?.member_name ||
        item?.singer?.name ||
        item?.singer?.label ||
        item?.assignedSingerName ||
        item?.singerName ||
        item?.memberName ||
        ""
      ).trim();
      const matched = singerId
        ? getMemberById(singerId)
        : findSingerMemberByText(singerText, existing?.id || "");

      if (!matched || !selectedSingerIds.includes(matched.id)) continue;
      if (fixedSingerIds.has(String(matched.id)) || resultSingerIds.has(String(matched.id))) continue;

      nextRows[rowIndex] = {
        ...existing,
        assignedSingerId: matched.id,
        assignedSingerName: matched.name
      };
      resultSingerIds.add(String(matched.id));
      updatedCount += 1;
    }

    if (updatedCount !== pendingPartIds.size) {
      showToast(
        "转盘结果未写入",
        `转盘应返回 ${pendingPartIds.size} 组完整分配，目前只识别到 ${updatedCount} 组。原有分配没有改变。`
      );
      return;
    }

    const fixedCount = nextRows.length - updatedCount;
    originalRows = nextRows;
    lyricsLotteryEnabled = false;
    syncRowsToQuota();
    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
    closeStudioWheelModal();
    showToast("已写入", `已保留原有 ${fixedCount} 组，并完成剩余 ${updatedCount} 组分配。`);
  }

  function validateSignupForm() {
    const taskName = String(songNameInput.value || "").trim();
    if (!taskName) {
      throw new Error("请先填写任务名称。");
    }

    if (isSingerQuotaBlank()) {
      throw new Error("请先填写演唱人数。");
    }

    const singerQuota = getSingerQuota();

    if (!selectedType || !submitFormState.projectTypes.some(option => option.value === selectedType)) {
      throw new Error("数据库项目类型配置缺失，请刷新页面后重试。");
    }

    if (!submitFormState.canCreate) {
      throw new Error(submitFormState.permissionMessage || "当前身份不能委托此类型项目。");
    }


    if (originalRows.length > singerQuota) {
      throw new Error("歌词分配行数不能超过演唱人数。");
    }

    if (selectedSingerIds.length > singerQuota) {
      throw new Error("演唱者数量不能超过演唱人数。");
    }

    const nonEmptyRows = originalRows.filter(row =>
      String(row.original || "").trim() || String(row.assignedSingerId || "").trim()
    );


    const missingOriginalRow = nonEmptyRows.find(row =>
      String(row.assignedSingerId || "").trim() && !String(row.original || "").trim()
    );
    if (missingOriginalRow) {
      throw new Error("原唱空行未填写完全，请先补全原唱 / 部分。");
    }

    const invalidAssigned = nonEmptyRows.find(row =>
      String(row.assignedSingerId || "").trim() && !selectedSingerIds.includes(row.assignedSingerId)
    );
    if (invalidAssigned) {
      throw new Error("歌词分配中的成员必须来自已勾选的演唱者。");
    }

    const usedSingerIds = nonEmptyRows
      .map(row => String(row.assignedSingerId || "").trim())
      .filter(Boolean);

    if (new Set(usedSingerIds).size !== usedSingerIds.length) {
      throw new Error("同一个成员不能在歌词分配中被重复选择。");
    }

    if (lyricsLotteryEnabled && !getLyricsLotteryReadyState().ready) {
      throw new Error("开启抽签需要先选满演唱者，并补全所有原唱 / 部分名称。");
    }
  }

  async function submitSignup() {
    try {
      validateSignupForm();
      signupSubmitBtn.disabled = true;
      signupStatus.textContent = "提交中";

      const parts = originalRows.map(row => ({
        original_name: String(row.original || "").trim() || null,
        assigned_member_id: String(row.assignedSingerId || "").trim() || null
      }));

      const { data, error } = await supabaseClient.rpc("create_studio_project_entry_with_extras", {
        p_member_id: authState.memberId,
        p_member_code: authState.memberCode,
        p_project_name: String(songNameInput.value || "").trim(),
        p_project_type: selectedType,
        p_game_type: null,
        p_participant_count: getSingerQuota(),
        p_is_collective_task: selectedTaskMode === "special",
        p_project_tone: String(projectToneInput.value || "").trim() || null,
        p_producer_public_member_id: selectedProducerIsExternal ? null : (selectedProducerId || null),
        p_producer_is_external: selectedProducerIsExternal,
        p_release_date: null,
        p_lyrics_lottery_enabled: lyricsLotteryEnabled && getLyricsLotteryReadyState().ready,
        p_singer_public_member_ids: selectedSingerIds,
        p_parts: parts,
        p_original_artists: parseProjectOriginalArtists(projectOriginalArtistsInput?.value || "")
      });

      if (error) throw error;
      const result = data && typeof data === "object" ? data : {};
      signupStatus.textContent = "已立项";
      const projectCode = String(result.project_code || getNextProjectCode());
      const projectName = String(result.project_name || songNameInput.value || "").trim();
      const successMessage = lyricsLotteryEnabled
        ? `任务 ${projectCode}.${projectName} 已写入数据库。
你已抽取本人的部分，请提醒其他演唱者去待处理页自行抽签。`
        : `任务 ${projectCode}.${projectName} 已写入数据库。`;
      showToast("立项成功", successMessage);
      resetSignupForm();
    } catch (error) {
      console.error(error);
      showToast("立项失败", toChineseDbError(error, "项目创建失败，所有写入已自动回滚。"));
      signupStatus.textContent = "填写中";
    } finally {
      signupSubmitBtn.disabled = !submitFormState.canCreate;
      if (signupStatus.textContent === "提交中") signupStatus.textContent = "填写中";
    }
  }

  function fitPanelSwitchText() {

    const buttons = Array.from(panelSwitch.querySelectorAll(".switchBtn"));
    buttons.forEach(btn => {
      btn.style.fontSize = "";
      btn.style.lineHeight = "1.05";
      btn.style.whiteSpace = "nowrap";
    });
    buttons.forEach(btn => {

      const available = Math.max(1, btn.clientWidth - 2);
      const needed = Math.max(btn.scrollWidth, btn.getBoundingClientRect().width);
      if (needed > available) {
        const compactFont = Math.max(4.2, baseFont * (available / needed) * 0.96);
        btn.style.fontSize = `${compactFont.toFixed(2)}px`;
      }
    });
  }

  function syncOverlayToImage() {
    if (isMobileLayout()) {
      document.documentElement.style.setProperty("--bg-ui-scale", "1");
      if (overlay) {
        overlay.style.left = "";
        overlay.style.top = "";
        overlay.style.width = "";
        overlay.style.height = "";
        overlay.style.setProperty("--bg-ui-scale", "1");
        overlay.style.setProperty("--ui-scale", "1");
        overlay.style.setProperty("--overlay-ui-scale", "1");
        overlay.style.setProperty("--project-panel-scale", "1");
      }
      requestAnimationFrame(syncTopUiLayout);
      return;
    }

    const roomRect = room.getBoundingClientRect();
    const roomW = roomRect.width;
    const roomH = roomRect.height;

    const naturalW = bg.naturalWidth || 1600;
    const naturalH = bg.naturalHeight || 900;
    const imgRatio = naturalW / naturalH;
    const roomRatio = roomW / roomH;

    let drawW, drawH, drawLeft, drawTop;

    if (roomRatio > imgRatio) {
      drawH = roomH;
      drawW = drawH * imgRatio;
      drawLeft = (roomW - drawW) / 2;
      drawTop = 0;
    } else {
      drawW = roomW;
      drawH = drawW / imgRatio;
      drawLeft = 0;
      drawTop = (roomH - drawH) / 2;
    }

    overlay.style.left = drawLeft + "px";
    overlay.style.top = drawTop + "px";
    overlay.style.width = drawW + "px";
    overlay.style.height = drawH + "px";

    const bgScale = Math.max(0.34, Math.min(3.2, drawW / 1440));

    document.documentElement.style.setProperty("--bg-ui-scale", String(bgScale));
    overlay.style.setProperty("--bg-ui-scale", String(bgScale));
    overlay.style.setProperty("--ui-scale", String(bgScale));
    overlay.style.setProperty("--overlay-ui-scale", String(bgScale));
    overlay.style.setProperty("--project-panel-scale", String(bgScale));

    requestAnimationFrame(syncTopUiLayout);
  }

    syncSubmitToolButtons();
    scheduleSubmitFormRefresh(0);
  });


  submitModeGroup?.addEventListener("click", (e) => {
    const btn = e.target.closest(".submitModeBtn");
    if (!btn) return;
    selectedTaskMode = btn.dataset.mode === "special" ? "special" : "normal";
    document.querySelectorAll(".submitModeBtn").forEach(item => item.classList.toggle("active", item === btn));
    syncSubmitToolButtons();
    scheduleSubmitFormRefresh(0);
  });

  openWheelBtn?.addEventListener("click", openStudioWheelTool);
  studioWheelModalCloseBtn?.addEventListener("click", closeStudioWheelModal);
  studioWheelModalMask?.addEventListener("click", (event) => {
    if (event.target === studioWheelModalMask) closeStudioWheelModal();
  });
  clearWheelAssignBtn?.addEventListener("click", clearOriginalAssignmentsOnly);
  applyQuickOriginalBtn?.addEventListener("click", applyQuickOriginalText);
  clearQuickOriginalBtn?.addEventListener("click", () => {
    if (quickOriginalInput) quickOriginalInput.value = "";
  });

  window.addEventListener("message", (event) => {
    const data = event?.data || {};
    if (!data || typeof data !== "object") return;
    if (studioWheelModalFrame?.contentWindow && event.source !== studioWheelModalFrame.contentWindow) return;
    const incomingChannel = String(data?.context?.channel_id || data?.channel_id || "").trim();
    if (studioWheelChannelId && incomingChannel && incomingChannel !== studioWheelChannelId) return;

    if (data.type === "ROOM10_WHEEL_READY") {
      postStudioWheelPayload();
      studioWheelReady = true;
      if (studioWheelRetryTimer) {
        clearInterval(studioWheelRetryTimer);
        studioWheelRetryTimer = null;
      }
      return;
    }
    if (data.type === "ROOM10_WHEEL_CLOSE") {
      closeStudioWheelModal();
      return;
    }
    if (data.type === "ROOM10_WHEEL_CONFIRM") {
      applyWheelResultToRows(data);
      return;
    }
    if (data.type === "room10-wheel-result" || data.type === "studio-wheel-result") {
      applyWheelResultToRows(data);
    }
  });

  singerMemberGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".memberBtn[data-member-id]");
    if (!btn) return;
    handleSingerMemberToggle(btn.dataset.memberId);
  });

  producerMemberGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".memberBtn");
    if (!btn) return;
    const kind = String(btn.dataset.producerKind || "internal");
    if (kind === "external") {
      selectedProducerIsExternal = !selectedProducerIsExternal;
      selectedProducerId = "";
      renderProducerMembers();
      updateRewardPreview();
      return;
    }
    selectedProducerIsExternal = false;
    handleProducerMemberToggle(btn.dataset.memberId);
  });

  singerQuotaInput.addEventListener("input", () => {
    if (isSingerQuotaBlank()) {
      syncLyricsLotteryButton();
      scheduleSubmitFormRefresh();
      return;
    }
    applyQuotaConstraints(true);
    scheduleSubmitFormRefresh();
  });

  singerQuotaInput.addEventListener("blur", () => {
    singerQuotaInput.value = String(getSingerQuota());
    applyQuotaConstraints(false);
    scheduleSubmitFormRefresh(0);
  });

  projectOriginalArtistsInput?.addEventListener("input", () => syncSubmitToolButtons());

  originalRoleList.addEventListener("input", (e) => {
    const rowEl = e.target.closest(".originalRoleRow");
    if (!rowEl) return;
    const rowId = rowEl.dataset.rowId;
    const field = e.target.dataset.field;

    if (field === "original") {
      originalRows = originalRows.map(row => (
        row.id === rowId ? { ...row, original: e.target.value } : row
      ));
      syncLyricsLotteryButton();
      syncSubmitToolButtons();
      return;
    }

    if (field === "assignedSingerName") {
      originalRows = originalRows.map(row => {
        if (row.id !== rowId) return row;
        const matched = findSingerMemberByText(e.target.value, rowId);
        return {
          ...row,
          assignedSingerId: matched ? matched.id : "",
          assignedSingerName: e.target.value
        };
      });
      syncLyricsLotteryButton();
      syncSubmitToolButtons();
    }
  });

  originalRoleList.addEventListener("keydown", (e) => {
    const input = e.target.closest(".originalInput");
    if (!input) return;

    if (e.key === "Enter" && input.dataset.field === "original") {
      e.preventDefault();
      const currentIndex = Number(input.dataset.rowIndex || "-1");
      if (!Number.isFinite(currentIndex) || currentIndex < 0) return;
      const nextInput = originalRoleList.querySelector(`.originalInput[data-field="original"][data-row-index="${currentIndex + 1}"]`);
      if (nextInput) {
        nextInput.focus();
        nextInput.select();
      }
      return;
    }

    if (e.key !== "Tab") return;

    const inputs = [...originalRoleList.querySelectorAll('.originalInput')];
    const currentIndex = inputs.indexOf(input);
    if (currentIndex < 0) return;

    e.preventDefault();
    const nextIndex = e.shiftKey ? currentIndex - 1 : currentIndex + 1;
    const target = inputs[nextIndex];
    if (target) {
      target.focus();
      if (typeof target.select === 'function') target.select();
    }
  });

  originalRoleList.addEventListener("change", (e) => {
    const rowEl = e.target.closest(".originalRoleRow");
    if (!rowEl) return;
    const rowId = rowEl.dataset.rowId;
    const field = e.target.dataset.field;
    if (field !== "assignedSingerName") return;

    const row = originalRows.find(item => item.id === rowId);
    if (!row) return;

    const previousSingerId = row.assignedSingerId;
    const previousSingerName = row.assignedSingerName;
    const inputText = String(e.target.value || "").trim();
    const matched = findSingerMemberByText(inputText, rowId);
    const nextSingerId = matched ? String(matched.id || "") : "";
    const usedSingerIds = new Set(getUsedSingerIds(rowId));

    if (nextSingerId && usedSingerIds.has(nextSingerId)) {
      e.target.value = previousSingerName || "";
      showToast("重复选择", "同一个成员不能在歌词分配中被重复选择。");
      return;
    }

    if (inputText && !matched) {
      e.target.value = previousSingerName || "";
      showToast("无效成员", "请先在左侧勾选演唱者，再在右侧分配；也可以直接输入已勾选成员的名字。");
      return;
    }

    originalRows = originalRows.map(item => {
      if (item.id !== rowId) return item;
      return {
        ...item,
        assignedSingerId: nextSingerId,
        assignedSingerName: matched ? matched.name : ""
      };
    });

    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
  });

  originalRoleList.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action='delete']");
    if (!btn) return;
    const rowEl = e.target.closest(".originalRoleRow");
    if (!rowEl) return;

    const rowId = rowEl.dataset.rowId;

    originalRows = originalRows.map(item => (
      item.id === rowId
        ? { ...item, assignedSingerId: "", assignedSingerName: "" }
        : item
    ));

    syncOriginalAssignedNames();
    renderSingerMembers();
    renderProducerMembers();
    renderOriginalRows();
    updateRewardPreview();
  });

  enableLyricsLotteryBtn?.addEventListener("click", handleEnableLyricsLotteryClick);
  signupResetBtn.addEventListener("click", resetSignupForm);
  signupSubmitBtn.addEventListener("click", submitSignup);

  panelSwitch?.querySelectorAll(".switchBtn[data-page-key]").forEach(link => {
    const pageKey = String(link.dataset.pageKey || "").trim();
    const target = pageKey ? getRoom10Page(pageKey) : "";
    if (target) link.href = target;
    link.addEventListener("click", event => {
      if (!target || link.classList.contains("active")) {
        event.preventDefault();
        return;
      }
      event.preventDefault();
      window.location.href = target;
    });
  });

  document.querySelectorAll(".navBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const roomKey = btn.dataset.room;

      if (roomKey === "manager") {
        const role = getCurrentRole();
        const page = role === "owner"
          ? getRoom10Page("managerOwner")
          : role === "admin"
            ? getRoom10Page("managerAdmin")
            : (role === "member" || role === "trainee")
              ? getRoom10Page("managerMember")
              : getRoom10Page("managerVisitor");
        window.location.href = page;
        return;
      }

      if (links[roomKey]) {
        window.location.href = links[roomKey];
      }
    });
  });

  document.addEventListener("click", (event) => {
    if (!event.target.closest("#siteNoticeWrap")) {
      toggleSiteNoticePanel(false);
    }
  });

  siteNoticeBtn?.addEventListener("click", (event) => {
    event.stopPropagation();
    renderSiteNotifications();
    toggleSiteNoticePanel();
  });

  identityAuthBtn?.addEventListener("click", () => {
    if (identityAuthBtn.dataset.action === "login") {
      window.location.href = getRoom10Page("index");
      return;
    }
    handleLogout();
  });

  bg.addEventListener("load", syncOverlayToImage);
  window.addEventListener("resize", syncOverlayToImage);
  window.addEventListener("orientationchange", syncOverlayToImage);
  window.addEventListener("load", syncTopUiLayout);

  if ("ResizeObserver" in window) {
    const ro = new ResizeObserver(syncOverlayToImage);
    ro.observe(room);
  }

  window.addEventListener("storage", async (e) => {
    if ([STORAGE_KEYS.loggedIn, STORAGE_KEYS.user, STORAGE_KEYS.role, STORAGE_KEYS.memberId, STORAGE_KEYS.memberCode].includes(e.key)) {
      const ok = await ensureAuthState();
      if (!ok) return;
      updateTopBarIdentity();
      renderSiteNotifications();
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && studioWheelModalMask?.classList.contains("show")) {
      event.preventDefault();
      closeStudioWheelModal();
    }
  });

  async function init() {
    updateTopBarIdentity();
    renderSiteNotifications();
    updateRewardPreview();
    syncSubmitToolButtons();
    syncOverlayToImage();

    const ok = await ensureAuthState();
    if (!ok) return;

    syncOverlayToImage();
    renderSiteNotifications();

    projectAutoCodeEl.textContent = getNextProjectCode();
    singerQuotaInput.value = String(getSingerQuota());
    syncRowsToQuota();
    applyQuotaConstraints(false);
  }

  init();
</script></body></html>
