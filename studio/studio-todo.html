[/foreign key|violates foreign key|关联记录/i, "保存失败：关联的项目或成员记录不存在，请刷新后重试。"],
[/failed to fetch|networkerror|network request|load failed|网络/i, "网络连接失败，请检查网络后重试。"],
[/timeout|timed out|statement timeout|超时/i, "操作超时，请稍后重试。"],
[/function .* does not exist|could not find the function|rpc.*not found|schema cache/i, "数据库功能尚未同步，请刷新数据库接口后重试。"],
[/invalid input syntax for type uuid|uuid/i, "成员或项目标识无效，请重新登录并刷新页面。"],
[/check constraint|not-null constraint|null value in column/i, "资料不完整，无法保存。请检查必填内容。"],
[/歌词分配中的成员必须|同一成员不能|演唱者数量不能|调只能填/i, raw],
[/成员未匹配|混音负责人未匹配/i, raw]

function normalizeProjectTypeOptions(rawValue) {
const fallback = [...FALLBACK_PROJECT_TYPE_OPTIONS];
const source = Array.isArray(rawValue) ? rawValue : [];
const prepared = source
.map((item, index) => {
if (typeof item === "string") {
const value = item.trim();
return value ? { value, label: value, sort_order: 100 + index, is_active: true } : null;
}
if (!item || typeof item !== "object") return null;
const value = String(item.value ?? item.type ?? item.key ?? item.label ?? "").trim();
const label = String(item.label ?? item.name ?? value).trim() || value;
const active = item.is_active !== false && item.active !== false && item.enabled !== false;
const sortOrder = Number(item.sort_order ?? item.order ?? item.sort ?? (100 + index));
if (!value || !active) return null;
return {
value,
label,
sort_order: Number.isFinite(sortOrder) ? sortOrder : 100 + index,
is_active: true
};
})
.filter(Boolean)
.sort((a, b) => {
if (a.sort_order !== b.sort_order) return a.sort_order - b.sort_order;
return a.label.localeCompare(b.label, "zh-Hans-CN", { numeric: true, sensitivity: "base" });
});
const seen = new Set();
const unique = [];
prepared.forEach(option => {
if (seen.has(option.value)) return;
seen.add(option.value);
unique.push(option);
});
return unique.length ? unique : fallback;
}

function syncOverlayToImage() {
if (!overlay || !room) return;
if (window.innerWidth <= 540) {
overlay.style.left = "";
overlay.style.top = "";
overlay.style.width = "";
overlay.style.height = "";
for (const target of [document.documentElement, overlay]) {

target.style.setProperty("--bg-ui-scale", "1");
target.style.setProperty("--room-nav-scale", "1");
target.style.setProperty("--identity-scale", "1");
target.style.setProperty("--project-panel-scale", "1");
}
positionIdentityNoticePanel();

}
const roomRect = room.getBoundingClientRect();
const roomW = roomRect.width;
const roomH = roomRect.height;
const naturalW = bg?.naturalWidth || 1600;
const naturalH = bg?.naturalHeight || 900;
const imageRatio = naturalW / naturalH;
const roomRatio = roomW / roomH;
let drawW, drawH, drawLeft, drawTop;
if (roomRatio > imageRatio) {
drawH = roomH;
drawW = drawH * imageRatio;
drawLeft = (roomW - drawW) / 2;
drawTop = 0;
} else {
drawW = roomW;
drawH = drawW / imageRatio;
drawLeft = 0;
drawTop = (roomH - drawH) / 2;
}
overlay.style.left = `${drawLeft}px`;
overlay.style.top = `${drawTop}px`;
overlay.style.width = `${drawW}px`;
overlay.style.height = `${drawH}px`;
const scale = Math.max(0.34, Math.min(3.2, drawW / 1440));
for (const target of [document.documentElement, overlay]) {
target.style.setProperty("--ui-scale", String(scale));
target.style.setProperty("--bg-ui-scale", String(scale));
target.style.setProperty("--room-nav-scale", String(scale));
target.style.setProperty("--identity-scale", String(scale));
target.style.setProperty("--project-panel-scale", String(scale));
}
positionIdentityNoticePanel();
}

function syncBackgroundBlendFromImage() {
if (!bg?.naturalWidth || !bg?.naturalHeight) {
applyDefaultBackgroundBlend();
return;
}
if (IS_FILE_PROTOCOL) {
applyDefaultBackgroundBlend();
return;
}
try {
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently:true });
if (!ctx) {
applyDefaultBackgroundBlend();
return;
}
const sampleW = 48;
const sampleH = 48;
canvas.width = sampleW;
canvas.height = sampleH;
ctx.drawImage(bg, 0, 0, sampleW, sampleH);
let data;
try {
data = ctx.getImageData(0, 0, sampleW, sampleH).data;
} catch (err) {
applyDefaultBackgroundBlend();
return;
}
function avgColor(points) {
let r = 0, g = 0, b = 0, count = 0;
for (const [x, y] of points) {
const i = (y * sampleW + x) * 4;
r += data[i];
g += data[i + 1];
b += data[i + 2];
count += 1;
}
if (!count) return 'rgb(226,216,203)';
return `rgb(${Math.round(r / count)}, ${Math.round(g / count)}, ${Math.round(b / count)})`;
}
const topPoints = [];
const bottomPoints = [];
const leftPoints = [];
const rightPoints = [];
for (let x = 4; x < sampleW - 4; x += 2) {
topPoints.push([x, 4], [x, 6]);
bottomPoints.push([x, sampleH - 5], [x, sampleH - 7]);
}
for (let y = 6; y < sampleH - 6; y += 2) {
leftPoints.push([4, y], [6, y]);
rightPoints.push([sampleW - 5, y], [sampleW - 7, y]);
}
const root = document.documentElement;
root.style.setProperty('--bg-top', avgColor(topPoints));
root.style.setProperty('--bg-bottom', avgColor(bottomPoints));
root.style.setProperty('--bg-side-left', avgColor(leftPoints));
root.style.setProperty('--bg-side-right', avgColor(rightPoints));
root.style.setProperty('--bg-mid', avgColor([...topPoints.slice(0, 10), ...bottomPoints.slice(0, 10), [24, 24], [22, 24], [26, 24]]));
} catch (err) {
applyDefaultBackgroundBlend();
}
}

// 待处理页只允许保留既有交音状态或撤回交音；首次交音必须在任务详情页完成。
const previousSingerSubmitted = new Map(
(task.singers || [])
.filter(item => item?.member_id)
.map(item => [String(item.member_id), !!item.is_submitted])
);
for (const singer of singers) {
const singerId = String(singer?.member_id || "").trim();
if (!singerId) continue;
const wasSubmitted = previousSingerSubmitted.get(singerId) === true;
const willSubmit = !!singer?.is_submitted;
if (!wasSubmitted && willSubmit) {
throw new Error("待处理页不能执行首次交音，请前往任务详情页完成交音。");
}
}

const { error } = await supabaseClient.rpc(STUDIO_RPC.saveBundle, {
p_member_id: memberId,
p_member_code: memberCode,
p_project_id: task.id,
p_task_code: payload.project_code ?? task.project_code ?? "",
p_task_name: payload.project_name ?? task.project_name ?? "",
p_release_date: payload.release_date ?? task.release_date ?? null,
p_task_type: payload.project_type ?? task.project_type ?? "",
p_game_type: payload.game_type ?? task.game_type ?? "",
p_is_collective_task: payload.is_collective_task ?? !!task.is_collective_task,
p_project_tone: payload.project_tone ?? task.project_tone ?? null,
p_producer_member_id: producerMemberId || null,
p_singer_quota: Number(payload.participant_count ?? task.participant_count ?? 1),
p_singer_bonus: Number(payload.singer_bonus ?? task.singer_bonus ?? 0),
p_producer_bonus: Number(payload.producer_bonus ?? task.producer_bonus ?? 0),
p_parts: parts.map((item, index) => ({
part_order: Number(item?.part_order || index + 1),
original_name: String(item?.original_name || "").trim() || null,
assigned_member_id: String(item?.assigned_member_id || "").trim() || null
})),
p_singers: singers.map(item => ({
member_id: String(item?.member_id || "").trim(),
is_submitted: !!item?.is_submitted,
submitted_at: item?.submitted_at || null
})).filter(item => item.member_id)
});
if (error) throw error;
if (Object.prototype.hasOwnProperty.call(payload, "display_link")) {
const { error: linkError } = await supabaseClient.rpc(STUDIO_RPC.setDisplayLink, {
p_member_id: memberId,
p_member_code: memberCode,
p_project_id: task.id,
p_display_link: payload.display_link || null
});
if (linkError) throw linkError;
}
if (Object.prototype.hasOwnProperty.call(payload, "producer_completed")) {
const { error: completedError } = await supabaseClient.rpc(STUDIO_RPC.setProducerCompleted, {
p_member_id: memberId,
p_member_code: memberCode,
p_project_id: task.id,
p_completed: !!payload.producer_completed
});
if (completedError) throw completedError;
}
}
async function saveTaskBundleWithRpc(task, snapshot, projectPayload, partResult, singerPayload) {
await saveProjectBundleViaRpc(task, {
...projectPayload,
game_type: snapshot.gameType || null,
parts: partResult.payload,
singers: singerPayload
});
}
function scheduleAutoSave(mode = "auto") {
if (suppressAutoSave || !canEditCurrentPage()) return;
clearTimeout(autoSaveTimer);
pendingSaveMode = mode;
hasPendingLocalChanges = true;
if (mode === "manual") {
setAutoSaveStatus("saving", "保存中...");
saveCurrentTaskEdits("manual");
return;
}
setAutoSaveStatus("", "有未保存修改");
autoSaveTimer = setTimeout(() => {
saveCurrentTaskEdits("auto");
}, 500);
}
async function saveCurrentTaskEdits(mode = "auto") {
if (!canEditCurrentPage()) return;
const task = tasks.find(item => item.id === activeClaimTaskId);
if (!task) return;
applyDeferredLastRemainingSingerFill();
if (saveInFlight) {
pendingSaveAfterCurrent = true;
pendingSaveMode = mode === "manual" ? "manual" : pendingSaveMode;
return;
}
const snapshot = buildTaskFromDom(task);
const { task: nextTask, partResult, singerPayload, toneResult, taskCode, songName, releaseDate, videoLink, taskType, gameType, isCollectiveTask, producerName, singerQuota } = snapshot;
const activeFilterBeforeSave = getCurrentMainFilter();
if (taskType === "游戏" && !gameType) {
setAutoSaveStatus("error", "请选择游戏类型");
return;
}
if (!toneResult.ok) {
setAutoSaveStatus("error", "调只能填 -2 / 原调 / +6 这种格式");
return;
}
if (partResult.validationError) {
setAutoSaveStatus("error", partResult.validationError);
return;
}
if (partResult.unresolved.length) {
setAutoSaveStatus("error", `成员未匹配：${partResult.unresolved[0]}`);
return;
}
const selectedSingerIds = new Set(getSelectedSingerIdsFromDom().filter(Boolean).map(String));
if (selectedSingerIds.size > singerQuota) {
setAutoSaveStatus("error", "演唱者数量不能超过演唱人数");
return;
}
let producerMemberId = null;
if (producerName) {
const mixerMatched = findMixerByName(producerName) || findMemberByName(producerName);
if (!mixerMatched) {
setAutoSaveStatus("error", `混音负责人未匹配：${producerName}`);
return;
}
producerMemberId = mixerMatched.id;
nextTask.producer_member_id = String(mixerMatched.id);
}
const hasDeferredSingerWithdraw = hasDeferredSingerWithdrawFromDom();
const projectPayload = {
project_code: taskCode || null,
project_name: songName || null,
release_date: releaseDate || null,
display_link: videoLink || null,
project_type: taskType || null,
is_collective_task: isCollectiveTask,
project_tone: toneResult.value,
producer_member_id: producerMemberId,
participant_count: singerQuota,
singer_bonus: Number.isFinite(Number(task.singer_bonus)) ? Number(task.singer_bonus) : 0,
producer_bonus: Number.isFinite(Number(task.producer_bonus)) ? Number(task.producer_bonus) : 0
};
if (hasDeferredSingerWithdraw) {
projectPayload.producer_completed = false;
projectPayload.producer_completed_at = null;
}
saveInFlight = true;
try {
setAutoSaveStatus("saving", mode === "manual" ? "保存中..." : "自动保存中...");
await saveTaskBundleWithRpc(task, snapshot, projectPayload, partResult, singerPayload);
await loadProjectsFromSupabase({ keepSelection: true });
const refreshedTask = tasks.find(item => String(item.id || "") === String(task.id || ""));
const refreshedTags = refreshedTask ? getTaskTodoTags(refreshedTask) : [];
const movedToAnotherTodoStage = !!refreshedTask
&& !!activeFilterBeforeSave
&& !refreshedTags.includes(activeFilterBeforeSave);
if (movedToAnotherTodoStage) {
pinActiveTaskInCurrentView(refreshedTask.id, "stage-changed");
} else if (String(stickyTaskIdInCurrentView || "") === String(task.id || "")) {
clearPinnedTaskInCurrentView(task.id);
}
hasPendingLocalChanges = false;
const taskStillInTodoView = !!refreshedTask;
const savedHasVideoLink = !!String(videoLink || "").trim();
if (!taskStillInTodoView && savedHasVideoLink) {
setAutoSaveStatus("saved", "已保存，任务可能已移出待处理");
if (mode === "manual") {
showToast("已保存", "视频链接已保存。若该任务已满足发布条件，它会从待处理页移出。");
}
} else {
setAutoSaveStatus("saved", mode === "manual" ? "已保存" : "已同步");
}
renderBrowseList();
renderBrowseDetail();
} catch (err) {
console.error("保存失败：", err);
const message = mapStudioErrorMessage(err, "保存失败，请刷新页面后重试。");
setAutoSaveStatus("error", message);
if (mode === "manual") {
showToast("保存失败", message);
}
} finally {
saveInFlight = false;
if (pendingSaveAfterCurrent) {
const nextMode = pendingSaveMode;
pendingSaveAfterCurrent = false;
pendingSaveMode = "auto";
scheduleAutoSave(nextMode);
}
}
}
async function handleLeaveTask(taskId) {
const task = tasks.find(item => item.id === taskId);
if (!task) return;
const currentUiMemberId = getCurrentUiMemberId();
if (!currentUiMemberId) {
showToast("无法退出", "当前登录信息不完整，请重新登录后再试。");
return;
}
if (!isCurrentUserSingerInTask(task)) return;
const ok = await showConfirmToast("确认退出", "确定要取消加入这个任务吗？", "确认退出", "取消");
if (!ok) return;
try {
setAutoSaveStatus("saving", "退出中...");
const singers = (task.singers || []).filter(row => String(row.member_id || "").trim() !== currentUiMemberId);
const parts = (task.parts || []).map(row => {
if (String(row.assigned_member_id || "").trim() !== currentUiMemberId) return row;
return {
...row,
assigned_member_id: "",
assigned_member_name: ""
};
});
await saveProjectBundleViaRpc(task, {
singers,
parts,
producer_completed: false
});
await loadProjectsFromSupabase({keepSelection:true});
const latestTask = tasks.find(item => item.id === taskId);
if (latestTask) {
activeClaimTaskId = latestTask.id;
renderBrowseList();
renderBrowseDetail();
}
setAutoSaveStatus("saved", "已退出");
} catch (err) {
console.error("退出任务失败：", err);
setAutoSaveStatus("error", "退出失败");
showToast("退出失败", mapStudioErrorMessage(err, "退出任务失败，请刷新后重试。"));
}
}
async function handleJoinTask(taskId) {
const task = tasks.find(item => item.id === taskId);
if (!task) return;
const currentUiMemberId = getCurrentUiMemberId();
const currentMemberName = getCurrentMemberName();
if (!currentUiMemberId || !currentMemberName) {
showToast("无法加入", "当前登录信息不完整，请重新登录后再试。");
return;
}
if (!canCurrentUserJoinTask(task)) return;
try {
setAutoSaveStatus("saving", "加入中...");
const singerMap = new Map((task.singers || []).map(item => [String(item.member_id || "").trim(), item]));
if (!singerMap.has(currentUiMemberId)) {
singerMap.set(currentUiMemberId, {
member_id: currentUiMemberId,
is_submitted: false,
submitted_at: null
});
}
await saveProjectBundleViaRpc(task, {
singers: [...singerMap.values()],
parts: task.parts || []
});
await loadProjectsFromSupabase({keepSelection:true});
const joinedTask = tasks.find(item => item.id === taskId);
if (joinedTask) {
activeClaimTaskId = joinedTask.id;
renderBrowseList();
renderBrowseDetail();
}
setAutoSaveStatus("saved", "已加入");
} catch (err) {
console.error("加入任务失败：", err);
setAutoSaveStatus("error", "加入失败");
showToast("加入失败", mapStudioErrorMessage(err, "加入任务失败，请刷新后重试。"));
}
}
async function deleteCurrentTask() {
const task = getCurrentTaskSafe(activeClaimTaskId) || tasks.find(item => String(item.id || "") === String(activeClaimTaskId || ""));
if (!task || !task.id) {
showToast("无法删除", "当前没有选中的任务。");
return;
}
const currentRole = getCurrentRole();
if (!["owner", "admin"].includes(currentRole)) {
showToast("无法删除", "只有管理员可以删除整个任务。\n如果只是想退出演唱，请使用任务列表里的退出按钮。\n如果只是想清空成员，请在演唱者或歌词分配里单独调整。");
return;
}
const memberName = getCurrentMemberName();
const memberCode = getCurrentMemberCode();
if (!memberName || !memberCode) {
showToast("无法删除", "当前登录信息不完整，请重新登录后再试。");
return;
}
const taskName = String(task.project_name || task.displayName || task.project_code || "这个任务").trim();
const ok = await showConfirmToast(
"确认删除整个任务",
`确定要删除「${taskName}」吗？

这个操作会删除整条任务记录，并联动删除该任务的演唱者、歌词分配和混音负责人记录。
这不是清空成员，也不是退出任务。`,
"确认删除",
"取消"
);
if (!ok) return;
const deleteBtn = document.getElementById("deleteTaskBtn");
if (deleteBtn) deleteBtn.disabled = true;
try {
setAutoSaveStatus("saving", "删除中...");
const { error } = await supabaseClient.rpc("secure_delete_project", {
p_nickname: memberName,
p_member_code: memberCode,
p_project_id: task.id
});
if (error) throw error;
clearPinnedTaskInCurrentView(task.id);
clearUndoSnapshots();
hasPendingLocalChanges = false;
preserveActiveTaskInCurrentView = false;
activeClaimTaskId = "";
await loadProjectsFromSupabase({ keepSelection: false });
preserveActiveTaskInCurrentView = true;
setAutoSaveStatus("saved", "已删除");
showToast("已删除", `「${taskName}」已删除。`);
} catch (err) {
console.error("删除整个任务失败：", err);
preserveActiveTaskInCurrentView = true;
const message = mapStudioErrorMessage(err, "删除任务失败，请确认管理员权限后重试。");
setAutoSaveStatus("error", "删除失败");
showToast("删除失败", message);
} finally {
if (deleteBtn) deleteBtn.disabled = false;
}
}
const CURRENT_STUDIO_PAGE = "studio-todo.html";
function normalizeStudioPageName(fileName) {
const name = String(fileName || "").trim();
if (!name) return CURRENT_STUDIO_PAGE;
if (/studio[_-]?todo/i.test(name) || /粘贴的文本/.test(name)) return "studio-todo.html";
if (/studio[_-]?project/i.test(name)) return "studio-project.html";
if (/studio[_-]?submit/i.test(name)) return "studio-Submit.html";
return name;
}
function syncPanelSwitchActive() {
const currentPage = normalizeStudioPageName(getCurrentPageFileName());
document.querySelectorAll("#panelSwitch .switchBtn").forEach(btn => {
const pageKey = String(btn.dataset.pageKey || "").trim();
const targetPage = pageKey ? getRoom10Page(pageKey) : "";
if (targetPage) btn.href = targetPage;
btn.classList.toggle("active", normalizeStudioPageName(btn.dataset.page) === currentPage);
if (btn.classList.contains("active")) btn.setAttribute("aria-current", "page");
else btn.removeAttribute("aria-current");
});
}
function syncRoomNavActive() {
document.querySelectorAll(".roomNavLayer .navBtn").forEach(btn => {
const isCurrentRoom = btn.dataset.room === "studio";
btn.classList.toggle("is-current", isCurrentRoom);
if (isCurrentRoom) {
btn.setAttribute("aria-current", "page");
btn.setAttribute("tabindex", "-1");
} else {
btn.removeAttribute("aria-current");
btn.removeAttribute("tabindex");
}
});
}
function getCurrentPageFileName() {
const pathName = String(window.location.pathname || "").split("/").pop();
return pathName || "";
}
async function goStudioPage(page) {
const targetPage = String(page || "").trim();
if (!targetPage) return;
if (studioPageNavigationInFlight) return;
const currentFile = getCurrentPageFileName();
const targetFile = new URL(targetPage, window.location.href).pathname.split("/").pop() || "";
if (targetFile === currentFile) return;
studioPageNavigationInFlight = true;
clearPinnedTaskInCurrentView();
if (hasPendingLocalChanges) {
try {
await saveCurrentTaskEdits("manual");
} catch (err) {
console.error("跳转前保存失败，继续跳转：", err);
}
}
window.location.assign(targetPage);
}

function spawnMusicNote() {
if (!musicNotesLayer) return;
if (document.hidden) return;
const note = document.createElement('span');
const symbols = ['♪','♫','♩','♬','♭','♮'];
const symbol = symbols[Math.floor(Math.random() * symbols.length)];
const layerWidth = musicNotesLayer.clientWidth || window.innerWidth || 1200;
const layerHeight = musicNotesLayer.clientHeight || window.innerHeight || 800;
const startX = Math.random() * layerWidth;
const startY = Math.max(layerHeight * 0.45, Math.random() * layerHeight);
const size = 14 + Math.random() * 24;
const driftX = (Math.random() * 180 - 90).toFixed(0) + 'px';
const floatY = (160 + Math.random() * 260).toFixed(0) + 'px';
const rotate = (Math.random() * 32 - 16).toFixed(0) + 'deg';
const duration = (5.2 + Math.random() * 4.2).toFixed(2) + 's';
note.className = 'musicNote';
note.textContent = symbol;
note.style.left = `${startX}px`;
note.style.top = `${startY}px`;
note.style.fontSize = `${size}px`;
note.style.animationDuration = duration;
note.style.setProperty('--float-x', driftX);
note.style.setProperty('--float-y', floatY);
note.style.setProperty('--float-rotate', rotate);
musicNotesLayer.appendChild(note);
note.addEventListener('animationend', () => note.remove(), { once: true });
}
function startMusicNotes() {
if (!musicNotesLayer) return;
for (let i = 0; i < 12; i += 1) {
window.setTimeout(spawnMusicNote, i * 180);
}
window.setInterval(() => {
if (musicNotesLayer.childElementCount > 42) return;
spawnMusicNote();
}, 260);
}
window.addEventListener("error", event => {
const message = mapStudioErrorMessage(event?.error || event?.message, "页面运行错误，请刷新后重试。");
console.error("工作间页面错误：", event?.error || event);
if (toastMask && !toastMask.classList.contains("show")) {
showToast("页面运行错误", message);
}
});
window.addEventListener("unhandledrejection", event => {
const reason = event?.reason;
const message = mapStudioErrorMessage(reason, "页面操作失败，请刷新后重试。");
console.error("工作间未处理的异步错误：", reason);
if (toastMask && !toastMask.classList.contains("show")) {
showToast("页面操作失败", message);
}
});
