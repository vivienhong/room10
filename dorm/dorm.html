      <button class="collectionBookCard" type="button" onclick="openCollectionBook()" aria-label="${tHtml("inventory.book_button")}" data-hover-text="${tHtml("inventory.book_hover")}">
        <img src="${escapeHtml(requireAssetUrl("dorm.book"))}" alt="" loading="lazy">
      </button>
    </div>
  `;
}

function itemValue(item,keys){
  for(const key of keys){
    const value = item?.[key];
    if(value !== null && value !== undefined && String(value).trim() !== "") return value;
  }
  return "";
}

function itemDisplayName(item){
  const directName = itemValue(item,["item_name","item_display_name","display_name","name","title","resource_name"]);
  if(directName) return String(directName);
  const key = itemValue(item,["item_key","item_code","code","resource_key"]);
  if(key) throw new Error(`${t("common.config_error")}：item_types.item_name(${key})`);
  throw new Error(`${t("common.config_error")}：item_key`);
}

function isKeyFallbackName(item){
  const directName = itemValue(item,["item_name","item_display_name","display_name","name","title","resource_name"]);
  return !directName;
}

function itemQuantity(item){
  const value = itemValue(item,["quantity","qty","count","amount","item_count","balance","total"]);
  const number = Number(value || 0);
  return Number.isFinite(number) ? number : 0;
}

function itemSortOrder(item){
  const number = Number(item?.sort_order ?? 9999);
  return Number.isFinite(number) ? number : 9999;
}

function itemCategorySortOrder(item){
  const number = Number(item?.category_sort_order ?? 9999);
  return Number.isFinite(number) ? number : 9999;
}

function inventoryFallbackEmoji(item){
  throw new Error(`${t("common.config_error")}：item_icon(${item?.item_key || "unknown"})`);
}

function htmlAttrJson(value){
  return escapeHtml(JSON.stringify(value || []));
}

function normalizeIconPath(value){
  return String(value || "").trim().replace(/\\/g,"/");
}

function uniqueList(list){
  return Array.from(new Set((Array.isArray(list) ? list : []).map(v => String(v || "").trim()).filter(Boolean)));
}

function iconSourceCandidates(rawIcon){
  const icon = normalizeIconPath(rawIcon);
  if(!icon) return [];

  if(/^https?:\/\//i.test(icon) || /^data:image\//i.test(icon) || icon.startsWith("/")){
    return [icon];
  }

  if(icon.length <= 4 && !/\.(png|jpe?g|gif|webp|svg)$/i.test(icon)){
    return [];
  }

  const candidates = [];

  if(typeof window.room10Asset === "function"){
    const assetUrl = window.room10Asset(icon);
    if(assetUrl) candidates.push(assetUrl);
  }

  const clean = icon.replace(/^\.\//,"").replace(/^\.\.\//,"");
  if(/\.(png|jpe?g|gif|webp|svg)$/i.test(clean)){
    if(icon.startsWith("../") || icon.startsWith("./")){
      candidates.push(icon);
    }else{
      candidates.push(icon);
      candidates.push("../" + clean);
    }
  }

  return uniqueList(candidates);
}

function imageFallbackHtml(fallback, className="inventoryEmoji"){
  return `<span class="${escapeHtml(className)}">${escapeHtml(fallback)}</span>`;
}

function safeIconImgHtml(candidates, fallback, className="inventoryEmoji"){
  const list = uniqueList(candidates);
  if(!list.length) return imageFallbackHtml(fallback,className);

  return `<img src="${escapeHtml(list[0])}" alt="" loading="lazy" data-src-index="0" data-src-list="${htmlAttrJson(list)}" data-fallback="${escapeHtml(fallback)}" data-fallback-class="${escapeHtml(className)}" onerror="tryNextDormImgSource(this)">`;
}

function tryNextDormImgSource(img){
  let list = [];
  try{
    list = JSON.parse(img.dataset.srcList || "[]");
  }catch(error){
    list = [];
  }

  const nextIndex = Number(img.dataset.srcIndex || 0) + 1;
  if(nextIndex < list.length){
    img.dataset.srcIndex = String(nextIndex);
    img.src = list[nextIndex];
    return;
  }

  const span = document.createElement("span");
  span.className = img.dataset.fallbackClass || "inventoryEmoji";
  span.textContent = `${t("common.asset_missing")}：${img.getAttribute("src") || "item_icon"}`;
  img.replaceWith(span);
}

function ledgerIconHtml(isIn){
  const fallback = isIn ? "↑" : "↓";
  return safeIconImgHtml([requireAssetUrl("root.coin")], fallback, "inventoryEmoji");
}

function itemIconHtml(item){
  const rawIcon = String(itemValue(item,["item_icon","icon","emoji","image","image_url","icon_url"])).trim();
  const fallback = "";

  if(rawIcon && rawIcon.length <= 4 && !/\.(png|jpe?g|gif|webp|svg)$/i.test(rawIcon)){
    return imageFallbackHtml(rawIcon);
  }

  const candidates = iconSourceCandidates(rawIcon);
  if(candidates.length){
    return safeIconImgHtml(candidates, fallback, "inventoryEmoji");
  }

  throw new Error(`${t("common.config_error")}：item_icon(${item?.item_key || "unknown"})`);
}

function mergeInventoryRows(memberItems,itemTypes,itemCategories){
  const typeMap = new Map((Array.isArray(itemTypes) ? itemTypes : []).map(type => [String(type.item_key || "").trim(), type]));
  const categoryMap = new Map((Array.isArray(itemCategories) ? itemCategories : []).map(category => [String(category.category_key || "").trim(), category]));

  return (Array.isArray(memberItems) ? memberItems : []).map(row => {
    const itemKey = String(row.item_key || "").trim();
    const type = typeMap.get(itemKey);
    if(!type) throw new Error(`${t("inventory.item_types_failed")}：${itemKey}`);

    /*
      背包分类与图鉴分类分离：
      - 背包只看 item_types.inventory_category
      - 图鉴继续由 collection_book_items.book_category 控制
      - inventory_category 为空的物品，只用于图鉴/系统记录，不显示在“我的背包”
    */
    const categoryKey = String(type.inventory_category || "").trim();
    if(!categoryKey) return null;

    const category = categoryMap.get(categoryKey);
    if(!category) throw new Error(`${inventoryCategoryErrorLabel()}：${categoryKey}`);

    const categoryName = String(category.category_name || "").trim();
    if(!categoryName) throw new Error(`${inventoryCategoryErrorLabel()}：${categoryKey}.category_name`);

    return {
      ...row,
      ...type,
      inventory_category: categoryKey,
      item_category: categoryKey,
      category_name: categoryName,
      category_sort_order: Number.isFinite(Number(category.sort_order)) ? Number(category.sort_order) : 9999
    };
  }).filter(Boolean);
}

  if(desc) desc.textContent = t("gacha.quantity", { count:quantity });

async function openStoredGachaBall(mode){
  if(!currentStoredGachaBall || !authState.memberId) return;

  const openMode = mode === "all" ? "all" : "one";
  setStoredGachaButtonsDisabled(true);
  showStoredGachaResult(openMode === "all" ? t("gacha.opening_all") : t("gacha.opening_one"));

  try{
    const { data,error } = await supabaseClient.rpc("open_stored_gacha_balls",{
      p_member_id:authState.memberId,
      p_tier_key:currentStoredGachaBall.tierKey,
      p_open_mode:openMode
    });

    if(error) throw error;

    const result = Array.isArray(data) ? data[0] : data;
    if(!result || result.success !== true){
      showStoredGachaResult(result?.message || t("gacha.open_failed"));
      setStoredGachaButtonsDisabled(false);
      await loadInventory();
      return;
    }

    const rewardHtml = renderStoredGachaRewards(result.rewards);
    showStoredGachaResult(`${escapeHtml(t("gacha.success", { count:Number(result.opened_count || 0) }))}<br>${rewardHtml}`, true);

    await loadInventory();
    await refreshDormWalletAfterStoredGacha();

    const nextQuantity = Math.max(0, Number(currentStoredGachaBall.quantity || 0) - Number(result.opened_count || 0));
    currentStoredGachaBall.quantity = nextQuantity;

    const desc = document.getElementById("gachaStoredBallDesc");
    const openAllBtn = document.getElementById("gachaOpenAllBtn");
    if(desc){
      desc.textContent = nextQuantity > 0
        ? t("gacha.remaining", { count:nextQuantity })
        : t("gacha.empty_after_open");
    }
    if(openAllBtn){
      openAllBtn.textContent = nextQuantity > 1 ? t("gacha.open_all_count", { count:nextQuantity }) : t("gacha.open_all");
    }

    setStoredGachaButtonsDisabled(nextQuantity <= 0);
  }catch(error){
    console.error(error);
    showStoredGachaResult(`${t("gacha.open_failed")}：${error.message || "open_stored_gacha_balls"}`);
    setStoredGachaButtonsDisabled(false);
  }
}

  const mask = document.getElementById("gachaStoredBallModalMask");
  const closeBtn = document.getElementById("gachaStoredBallCloseBtn");
  const openOneBtn = document.getElementById("gachaOpenOneBtn");
  const openAllBtn = document.getElementById("gachaOpenAllBtn");

function renderInventory(items){
  const wrap = document.getElementById("inventoryList");
  if(!wrap) return;

  const rows = (Array.isArray(items) ? items : [])
    .map(item => ({ item, qty:itemQuantity(item) }))
    .filter(row => row.qty > 0)
    .sort((a,b) => {
      const ca = itemCategorySortOrder(a.item);
      const cb = itemCategorySortOrder(b.item);
      if(ca !== cb) return ca - cb;
      return itemSortOrder(a.item) - itemSortOrder(b.item);
    });

  const bookCard = collectionBookCardHtml();

  if(!rows.length){
    wrap.innerHTML = `${bookCard}<div class="emptyText inventoryEmptyNote">${tHtml("inventory.empty")}</div>`;
    return;
  }

  const groups = new Map();
  rows.forEach(row => {
    const key = inventoryCategoryKey(row.item);
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(row);
  });

  const groupHtml = Array.from(groups.entries())
    .sort((a,b) => itemCategorySortOrder(a[1][0]?.item || {}) - itemCategorySortOrder(b[1][0]?.item || {}))
    .map(([key, groupRows]) => renderInventoryGroup(key, groupRows))
    .join("");

  wrap.innerHTML = bookCard + groupHtml;
}


function escapeRegExp(value){
  return String(value || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function recentSourceLabel(row){
  const directLabel = itemValue(row,[
    "source_label",
    "source_display_name",
    "source_name",
    "display_source",
    "recent_source_label",
    "recent_source"
  ]);

  if(directLabel) return String(directLabel).trim();

  const sourceType = String(row?.source_type || "").trim();
  const sourceDetail = String(row?.source_detail || "").trim();
  const note = String(row?.note || "").trim();

  for(const value of [sourceDetail, sourceType, note]){
    if(/[\u4e00-\u9fff]/.test(value)) return value;
  }

  return "";
}

function cleanRecentSourceLabel(sourceLabel, itemName, qty){
  let source = String(sourceLabel || "").trim();
  const name = String(itemName || "").trim();

  if(!source || !name) return source;

  const count = Number(qty || 0);
  const qtyPart = count > 0 ? escapeRegExp(String(count)) : "\\d+";
  const nameWithQtyRe = new RegExp(`${escapeRegExp(name)}\\s*(?:×|x|X)\\s*${qtyPart}`, "g");

  source = source.replace(nameWithQtyRe, "").trim();

  if(source.includes("：")){
    const parts = source.split("：");
    const prefix = parts.shift().trim();
    const rest = parts.join("：").trim();

    if(!rest || rest === name || rest.includes(name)){
      source = prefix;
    }
  }

  if(source === name){
    source = "";
  }

  const unopenedGachaName = t("gacha.title");
  const gachaCleanName = t("inventory.gacha_open_badge");
  if(name === unopenedGachaName && source.includes(unopenedGachaName)){
    source = source.replaceAll(unopenedGachaName, gachaCleanName).trim();
  }

  source = source
    .replace(new RegExp(`^${escapeRegExp(name)}$`), "")
    .replace(/\s*·\s*$/,"")
    .replace(/[:：]\s*$/,"")
    .replace(/\s+/g," ")
    .trim();

  return source;
}


function formatRecentTime(value){
  const time = new Date(value);
  if(Number.isNaN(time.getTime())) return t("recent.just_now");

  const diffMs = Date.now() - time.getTime();
  const diffMin = Math.floor(diffMs / 60000);
  if(diffMin < 1) return t("recent.just_now");
  if(diffMin < 60) return t("recent.minutes_ago", { count:diffMin });

  const diffHour = Math.floor(diffMin / 60);
  if(diffHour < 24) return t("recent.hours_ago", { count:diffHour });

  const diffDay = Math.floor(diffHour / 24);
  if(diffDay < 7) return t("recent.days_ago", { count:diffDay });

  const month = time.getMonth() + 1;
  const day = time.getDate();
  return `${month}/${day}`;
}

function shouldHideRecentItemKey(itemKey){

async function loadRecentObtained(memberId){
  const wrap = document.getElementById("recentObtainedList");
  if(!wrap) return;

  if(!memberId){
    wrap.innerHTML = `<div class="recentObtainedEmpty">${tHtml("recent.login_required")}</div>`;
    return;
  }

  wrap.innerHTML = `<div class="recentObtainedEmpty" data-text-key="recent.loading"></div>`;

  try{
    const { data,error } = await supabaseClient.rpc("get_recent_obtained_items", {
      p_member_id:memberId,
      p_limit:3
    });

    if(error) throw error;

    const rows = (Array.isArray(data) ? data : [])
      .filter(row => !shouldHideRecentItemKey(row.item_key))
      .map(row => ({
        ...row,
        quantity:Number(row.quantity || 0),
        item_name:row.item_name,
        item_icon:row.item_icon || "",
        item_category:row.item_category,
        recent_source_label:cleanRecentSourceLabel(recentSourceLabel(row), isStoredGachaBallItem(row) ? storedGachaBallLabel(row.item_key) : itemDisplayName(row), Number(row.quantity || 0)),
        recent_time_label:formatRecentTime(row.created_at)
      }))
      .filter(row => row.item_key && row.quantity > 0)
      .slice(0,3);

    renderRecentObtained(rows);
  }catch(error){
    console.error(error);
    wrap.innerHTML = `<div class="recentObtainedEmpty">${tHtml("recent.read_failed")}：${escapeHtml(error.message || "get_recent_obtained_items")}</div>`;
  }
}

async function loadInventory(){
  const wrap = document.getElementById("inventoryList");
  if(!wrap) return;

  const memberId = currentMemberProfile?.id || authState.memberId;
  if(!memberId){
    wrap.innerHTML = `<div class="errorText">${tHtml("inventory.login_required")}</div>`;
    await loadRecentObtained(null);
    return;
  }

  wrap.innerHTML = '<div class="emptyText" data-text-key="inventory.loading"></div>';
  await loadRecentObtained(memberId);

  try{
    const { data:memberItems,error:itemError } = await supabaseClient
      .from("member_items")
      .select("item_key,quantity,updated_at")
      .eq("member_id",memberId)
      .order("updated_at",{ ascending:false });

    if(itemError) throw itemError;

    const itemKeys = Array.from(new Set((memberItems || []).map(item => item.item_key).filter(Boolean)));
    let itemTypes = [];
    let itemCategories = [];

    if(itemKeys.length){
      const { data:typeRows,error:typeError } = await supabaseClient
        .from("item_types")
        .select("item_key,item_name,item_category,inventory_category,item_desc,item_icon,sort_order")
        .in("item_key",itemKeys);

      if(typeError){
        throw new Error(`${t("inventory.item_types_failed")}：${typeError.message || "item_types"}`);
      }else{
        itemTypes = Array.isArray(typeRows) ? typeRows : [];
      }

      const { data:categoryRows,error:categoryError } = await supabaseClient
        .from("item_inventory_categories")
        .select("category_key,category_name,sort_order,is_visible")
        .order("sort_order",{ ascending:true });

      if(categoryError){
        throw new Error(`${inventoryCategoryErrorLabel()}：${categoryError.message || "item_inventory_categories"}`);
      }else{
        itemCategories = (Array.isArray(categoryRows) ? categoryRows : []).filter(category => category.is_visible !== false);
        if(!itemCategories.length){
          throw new Error(`${inventoryCategoryErrorLabel()}：item_inventory_categories`);
        }
      }
    }

    renderInventory(mergeInventoryRows(memberItems,itemTypes,itemCategories));
  }catch(error){
    console.error(error);
    wrap.innerHTML = `<div class="errorText">${tHtml("inventory.read_failed")}：${escapeHtml(error.message || "member_items / item_types / item_inventory_categories")}</div>`;
  }
}

  if(!month || !day) return t("profile.unfilled");
  return `${Number(month)}${t("date.month_suffix")}${Number(day)}${t("date.day_suffix")}`;
}

function normalizeSkills(value){
  if(Array.isArray(value)) return value.map(v => String(v).trim()).filter(Boolean);
  return String(value || "")
    .split(/[，,、/|\s]+/)
    .map(v => v.trim())
    .filter(Boolean);
}

function uniqueSkills(list){
  const seen = new Set();
  const result = [];
  list.forEach(item => {
    const value = String(item || "").trim();
    if(!value) return;
    const key = value.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    result.push(value);
  });
  return result;
}

}

}

  return html;
}

function dayOptions(selected){
  let html = `<option value="">${tHtml("profile.field.birthday")}</option>`;
  for(let i=1;i<=31;i++) html += `<option value="${i}" ${Number(selected) === i ? "selected" : ""}>${i}${tHtml("date.day_suffix")}</option>`;
  return html;
}

  return list.map(item => `<option value="${escapeHtml(item)}" ${item === String(selected || "") ? "selected" : ""}>${item || tHtml("profile.unfilled")}</option>`).join("");
}

function openProfileEdit(){
  profileEditMode = true;
  renderProfileView(currentMemberProfile);
}

function cancelProfileEdit(){
  profileEditMode = false;
  renderProfileView(currentMemberProfile);
}

function setProfileStatus(message,type=""){
  const el = document.getElementById("profileStatus");
  if(!el) return;
  el.textContent = message || "";
  el.className = "profileStatus" + (type ? ` ${type}` : "");
}

function validateProfileName(value){
  const text = String(value || "").trim();
  return text.length >= 1 && text.length <= 20;
}

function validateProfileLocation(value){
  const text = String(value || "").trim();
  if(!text) return true;
  return dormConfig.allowedLocations.includes(text);
}

function standardSkillName(raw){
  const value = String(raw || "").trim().toLowerCase();
  if(!value) return { input:"", matched:"", status:"empty" };

  const found = dormConfig.skillAliases.find(group => group.values.some(item => String(item || "").trim().toLowerCase() === value));
  if(found) return { input:raw.trim(), matched:found.name, status:"matched" };
  return { input:raw.trim(), matched:"", status:"unmatched" };
}

function collectProfilePayload(){
  return {
    name:document.getElementById("profileNameInput")?.value.trim() || "",
    location:document.getElementById("profileLocationInput")?.value.trim() || null,
    birthday_month:document.getElementById("profileBirthdayMonth")?.value ? Number(document.getElementById("profileBirthdayMonth").value) : null,
    birthday_day:document.getElementById("profileBirthdayDay")?.value ? Number(document.getElementById("profileBirthdayDay").value) : null,
    mbti:document.getElementById("profileMbtiInput")?.value || null,
    social_xiaohongshu:document.getElementById("profileXhsInput")?.value.trim() || null,
    social_douyin:document.getElementById("profileDouyinInput")?.value.trim() || null,
    social_bilibili:document.getElementById("profileBilibiliInput")?.value.trim() || null,
    social_weibo:document.getElementById("profileWeiboInput")?.value.trim() || null,
    public_message:document.getElementById("profileMessageInput")?.value.trim() || null
  };
}

function fieldLabel(key){
  const labels = {
    name:t("profile.field.name"),
    location:t("profile.field.location"),
    birthday_month:t("profile.field.birthday"),
    birthday_day:t("profile.field.birthday"),
    mbti:t("profile.field.mbti"),
    social_xiaohongshu:t("profile.field.xiaohongshu"),
    social_douyin:t("profile.field.douyin"),
    social_bilibili:t("profile.field.bilibili"),
    social_weibo:t("profile.field.weibo"),
    public_message:t("profile.section.message"),
    skills:t("profile.section.skills"),
    skill_request:t("profile.field.skill_request")
  };
  return labels[key] || key;
}

function stringifyFieldValue(value){
  if(value === null || value === undefined || value === "") return "";
  if(Array.isArray(value)) return value.join("、");
  return String(value);
}

function diffProfileFields(oldMember,payload){
  const changes = [];
  Object.entries(payload).forEach(([key,newValue]) => {
    const oldValue = oldMember ? oldMember[key] : null;
    if(stringifyFieldValue(oldValue) !== stringifyFieldValue(newValue)){
      changes.push({
        field_key:key,
        field_label:fieldLabel(key),
        old_value:stringifyFieldValue(oldValue),
        new_value:stringifyFieldValue(newValue),
        change_type:"profile_update",
        status:"logged"
      });
    }
  });
  return changes;
}

async function logProfileChanges(changes){
  if(!changes.length) return;

  const rows = changes.map(item => ({
    member_id:authState.memberId,
    member_code:authState.memberCode,
    nickname:authState.nickname,
    field_key:item.field_key,
    field_label:item.field_label,
    old_value:item.old_value,
    new_value:item.new_value,
    change_type:item.change_type || "profile_update",
    status:item.status || "logged"
  }));

  try{
    const { error } = await supabaseClient.from("member_profile_change_logs").insert(rows);
    if(error) throw error;
  }catch(error){
    throw new Error(`${t("profile.save_log_failed")}：${error.message || "member_profile_change_logs"}`);
  }
}

async function checkProfileNameDuplicate(name){
  const { data,error } = await supabaseClient
    .from("members")
    .select("id")
    .eq("name",name)
    .neq("id",authState.memberId)
    .limit(1);

  if(error) throw error;
  return Array.isArray(data) && data.length > 0;
}

async function saveProfileEdit(){
  if(!currentMemberProfile) return;
  const payload = collectProfilePayload();
  const skillInput = document.getElementById("profileSkillInput")?.value.trim() || "";
  const skillMatch = standardSkillName(skillInput);
  let changes = diffProfileFields(currentMemberProfile,payload);
  let skillMessage = "";

  if(!validateProfileName(payload.name)){
    setProfileStatus(t("profile.name_invalid"),"error");
    return;
  }

  if(!validateProfileLocation(payload.location)){
    setProfileStatus(t("profile.location_invalid"),"error");
    return;
  }

  if((payload.birthday_month && !payload.birthday_day) || (!payload.birthday_month && payload.birthday_day)){
    setProfileStatus(t("profile.birthday_invalid"),"error");
    return;
  }

  setProfileStatus(t("profile.save_loading"));

  try{
    const duplicated = await checkProfileNameDuplicate(payload.name);
    if(duplicated){
      setProfileStatus(t("profile.name_duplicate"),"error");
      return;
    }

    const currentSkills = uniqueSkills(normalizeSkills(currentMemberProfile.skills));
    if(skillMatch.status === "matched"){
      if(!currentSkills.some(item => item === skillMatch.matched)){
        const nextSkills = uniqueSkills([...currentSkills, skillMatch.matched]);
        payload.skills = nextSkills.join(",");
        changes.push({
          field_key:"skills",
          field_label:t("profile.log_label.skills"),
          old_value:currentSkills.join("、"),
          new_value:nextSkills.join("、"),
          change_type:"skill_auto_matched",
          status:"logged"
        });
        skillMessage = t("profile.skill_normalized", { input:skillMatch.input, skill:skillMatch.matched });
      }else{
        skillMessage = t("profile.skill_existing", { skill:skillMatch.matched });
      }
    }else if(skillMatch.status === "unmatched"){
      changes.push({
        field_key:"skill_request",
        field_label:t("profile.log_label.skill_request"),
        old_value:"",
        new_value:skillMatch.input,
        change_type:"skill_request",
        status:"logged"
      });
      skillMessage = t("profile.skill_request", { input:skillMatch.input });
    }

    if(!changes.length){
      setProfileStatus(skillMessage || t("profile.save_no_change"),"success");
      return;
    }

    const { error } = await supabaseClient
      .from("members")
      .update(payload)
      .eq("id",authState.memberId)
      .eq("member_code",authState.memberCode);

    if(error) throw error;

    await logProfileChanges(changes);
    const fresh = await fetchCurrentMember();
    currentMemberProfile = fresh || { ...currentMemberProfile, ...payload };
    if(currentMemberProfile.nickname) authState.nickname = currentMemberProfile.nickname;
    if(currentMemberProfile.role) authState.role = currentMemberProfile.role;
    updateIdentity(currentMemberProfile);
    profileEditMode = false;
    honorSummaryState = honorSummaryState;
    renderProfileView(currentMemberProfile);
  }catch(error){
    console.error(error);
    setProfileStatus(`${t("profile.save_failed")}：${error.message || "members"}`,"error");
  }
}

async function loadHonorSummary(memberId){
  if(!memberId) return;

  try{
    const [{ data:titleRows,error:titleError,count:titleCount }, { data:achievementRows,error:achievementError,count:achievementCount }] = await Promise.all([
      supabaseClient
        .from("member_titles")
        .select("obtained_at,titles(name)", { count:"exact" })
        .eq("member_id",memberId)
        .order("obtained_at",{ ascending:false })
        .limit(1),
      supabaseClient
        .from("member_achievements")
        .select("obtained_at,achievements(name,description)", { count:"exact" })
        .eq("member_id",memberId)
        .order("obtained_at",{ ascending:false })
        .limit(1)
    ]);

    if(titleError || achievementError) throw (titleError || achievementError);

    const latestTitleTime = titleRows?.[0]?.obtained_at ? new Date(titleRows[0].obtained_at).getTime() : 0;
    const latestAchievementTime = achievementRows?.[0]?.obtained_at ? new Date(achievementRows[0].obtained_at).getTime() : 0;
    const latestTitleName = titleRows?.[0]?.titles?.name || "";
    const latestAchievementName = achievementRows?.[0]?.achievements?.name || achievementRows?.[0]?.achievements?.description || "";

    honorSummaryState = {
      titles:Number(titleCount || 0),
      achievements:Number(achievementCount || 0),
      recent:latestTitleTime >= latestAchievementTime ? latestTitleName : latestAchievementName
    };
  }catch(error){
    console.error(error);
    honorSummaryState = { error:`${t("honor.read_failed")}：${error.message || "member_titles/member_achievements"}` };
  }

  if(!profileEditMode) renderProfileView(currentMemberProfile);
}

function bindSideTabs(){
  const buttons = document.querySelectorAll(".sideBtn");

  buttons.forEach(btn => {
    btn.addEventListener("click",() => {
      activateDormView(btn.dataset.view);
    });
  });
}

function setMascotBubbleOnce(){
  const bubble = document.getElementById("mascotBubble");
  if(!bubble) return;

  const item = mascotLines[Math.floor(Math.random()*mascotLines.length)];
  bubble.textContent = t(item.key);
  bubble.className = `bubble-${item.style}`;
}


/* =========================================================
   初始化
========================================================= */
async function initDormPage(){
  try{
    await loadDormPageTexts();
    applyDormStaticTexts();
    applyDormAssets();
  }catch(error){
    console.error(error);
    showDormFatalError(error);
    return;
  }

  if(!readLocalAuth()) return;

  setupRoomNav(CURRENT_ROOM);

  updateIdentity({
    nickname:authState.nickname,
    role:authState.role
  });

  bindSideTabs();
  restoreDormView();
  bindDormTaskActions();
  bindStoredGachaBallModal();
  setMascotBubbleOnce();

  if(siteNoticeBtn){
    siteNoticeBtn.addEventListener("click", event => {
      event.stopPropagation();
      jumpToSystemNotice();
    });
  }

  if(identityAuthBtn){
    identityAuthBtn.addEventListener("click", event => {
      event.stopPropagation();
      if(authState.loggedIn){
        handleLogout();
      }else{
        window.location.href = requirePageUrl("index");
      }
    });
  }

  syncDormResponsiveLayout();

  /*
    先读取 members 表，回填 member_code / role / nickname 后，
    再读取系统通知和我的任务。
    这样即使登录缓存里缺少 room10MemberCode，也不会被误判为未登录。
  */
  await loadGoldInfo();

  await Promise.all([
    loadSystemNotices(),
    loadDormTasks()
  ]);
}

document.addEventListener("DOMContentLoaded", () => {
  initDormPage();
});

window.addEventListener("resize", syncDormResponsiveLayout);

window.addEventListener("storage", event => {
  if(
    event.key === STORAGE_KEYS.loggedIn ||
    event.key === STORAGE_KEYS.user ||
    event.key === STORAGE_KEYS.role ||
    event.key === STORAGE_KEYS.memberId
  ){
    updateIdentity({
      nickname:localStorage.getItem(STORAGE_KEYS.user) || "",
      role:localStorage.getItem(STORAGE_KEYS.role) || ""
    });
  }
});

if(img && img.complete && img.naturalWidth){
  syncDormResponsiveLayout();
}else if(img){
  img.addEventListener("load", syncDormResponsiveLayout, { once:true });
}

setTimeout(syncDormResponsiveLayout, 120);
