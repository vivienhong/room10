<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜宿舍</title>
<!-- dorm clean db-driven v16: 通用模板路径同步 + 文案/配置数据库驱动 + 移除前端固定文案清单 -->

<script src="../room10-paths.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --bg-ui-scale:1;

  --ui-scale:var(--bg-ui-scale);
  --room-nav-scale:var(--ui-scale);
  --identity-scale:var(--ui-scale);

  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);
  --identity-name-y:0em;
  --identity-separator-y:0em;
  --identity-role-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;

  --identity-mobile-name-y:0em;
  --identity-mobile-separator-y:0em;
  --identity-mobile-role-y:0em;
  --identity-mobile-notice-y:0em;
  --identity-mobile-button-y:0em;
  --identity-notice-mobile-top:58px;

  --room-nav-top:6.35%;
  --room-nav-start-left:25.83%;
  --room-nav-btn-width:4.72%;
  --room-nav-btn-height:5.10%;
  --room-nav-gap:0.486%;

  --room-nav-hall-left:var(--room-nav-start-left);
  --room-nav-living-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 1);
  --room-nav-manager-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 2);
  --room-nav-honor-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 3);
  --room-nav-studio-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 4);
  --room-nav-game-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 5);
  --room-nav-dorm-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 6);
  --room-nav-flower-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 7);
  --room-nav-pets-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 8);

  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);

  --dorm-app-left:8.8%;
  --dorm-app-top:22.2%;
  --dorm-app-width:60.8%;
  --dorm-app-height:58.5%;

  --recent-panel-left:71.8%;
  --recent-panel-top:23.3%;
  --recent-panel-width:15.3%;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at top left,#f5ecdb 0%,transparent 44%),
    linear-gradient(180deg,#efe2cc 0%,#e9d8bd 100%);
  color:#6f4726;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{pointer-events:auto;}

#overlay .roomNavLayer{
  pointer-events:none!important;
}

#overlay .roomNavLayer .navBtn{
  pointer-events:auto!important;
}

#overlay .roomIdentity{
  pointer-events:none!important;
}

#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{
  pointer-events:auto!important;
}

.roomNavLayer{
  position:absolute;
  inset:0;
  z-index:55;
  pointer-events:none;
  --s:var(--room-nav-scale,1);
  --nav-btn-radius:calc(15px * var(--s));
  --nav-btn-font:calc(15px * var(--s));
  --nav-btn-border:calc(1px * var(--s));
  --nav-btn-shadow-y:calc(3px * var(--s));
  --nav-btn-shadow-blur:calc(8px * var(--s));
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:absolute;
  top:var(--room-nav-top);
  width:var(--room-nav-btn-width);
  height:var(--room-nav-btn-height);
  min-width:0;
  min-height:0;
  padding:0;
  border-radius:var(--nav-btn-radius);
  color:var(--room-nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.56), transparent 40%),
    radial-gradient(circle at 78% 74%, var(--room-nav-wash), transparent 48%),
    linear-gradient(180deg, var(--room-nav-paper) 0%, var(--room-nav-paper-2) 100%);
  border:var(--nav-btn-border) solid var(--room-nav-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.64),
    0 calc(2px * var(--s)) calc(7px * var(--s)) rgba(96,70,48,.10);
  text-shadow:0 calc(1px * var(--s)) 0 rgba(255,255,255,.38);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  pointer-events:auto;
}

.navBtn[data-room="hall"]{left:var(--room-nav-hall-left);}
.navBtn[data-room="living"]{left:var(--room-nav-living-left);}
.navBtn[data-room="manager"]{left:var(--room-nav-manager-left);}
.navBtn[data-room="honor"]{left:var(--room-nav-honor-left);}
.navBtn[data-room="studio"]{left:var(--room-nav-studio-left);}
.navBtn[data-room="game"]{left:var(--room-nav-game-left);}
.navBtn[data-room="dorm"]{left:var(--room-nav-dorm-left);}
.navBtn[data-room="flower"]{left:var(--room-nav-flower-left);}
.navBtn[data-room="pets"]{left:var(--room-nav-pets-left);}

.navBtn:not(.is-current):hover,
.navBtn:not(.is-current):focus-visible{
  color:#5f3d22;
  background:
    radial-gradient(circle at 20% 24%, rgba(255,255,255,.66), transparent 42%),
    radial-gradient(circle at 80% 78%, rgba(207,170,143,.24), transparent 50%),
    linear-gradient(180deg, rgba(255,252,246,.88) 0%, rgba(239,226,210,.82) 100%);
  border-color:rgba(151,112,84,.36);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.70),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.12);
  filter:saturate(1.02);
}

.navBtn.is-current{
  cursor:default;
  color:var(--room-nav-current-text);
  background:
    radial-gradient(circle at 22% 22%, rgba(255,255,255,.62), transparent 42%),
    radial-gradient(circle at 80% 80%, rgba(190,151,126,.26), transparent 50%),
    linear-gradient(180deg, rgba(246,235,222,.94) 0%, var(--room-nav-current-bg) 100%);
  border-color:var(--room-nav-current-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.68),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.13),
    0 0 0 calc(2px * var(--s)) rgba(255,253,248,.46);
  filter:none;
}

.navLabel{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.82),
    0 0 calc(8px * var(--s)) rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{ transform:translateY(calc(4px * var(--s))) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(calc(-5px * var(--s))) rotate(6deg) scale(1); opacity:.76; }
}
@keyframes navFloatB{
  0%,100%{ transform:translateY(calc(5px * var(--s))) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(calc(-6px * var(--s))) rotate(-7deg) scale(1); opacity:.68; }
}
@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(calc(6px * var(--s))) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(calc(-6px * var(--s))) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:not(.is-current):hover .navEffectA,
.navBtn:not(.is-current):focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectB,
.navBtn:not(.is-current):focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectC,
.navBtn:not(.is-current):focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}
.navBtn.is-current .navEffect{display:none;}

.navBtn[data-room="hall"] .navEffect{color:rgba(255,205,96,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.95),0 0 calc(10px * var(--s)) rgba(255,215,105,.62);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="honor"] .navEffect{color:rgba(205,143,45,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.92),0 0 calc(8px * var(--s)) rgba(255,220,130,.52);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}

.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}

.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}

.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}

.identityNamePart{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  line-height:1;
  white-space:nowrap;
  font:inherit;
}

.identityNickname{transform:translateY(var(--identity-name-y));}
.identitySeparator{
  margin:0 .08em;
  color:rgba(111,87,70,.78);
  font-weight:800;
  transform:translateY(var(--identity-separator-y));
}
.identityRole{transform:translateY(var(--identity-role-y));}

.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}

.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:950;
  text-align:left;
}

.identityNoticePanel.show{display:block;}

.identityNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
  margin-bottom:calc(10px * var(--s));
}

.identityNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}

#dormShell{
  position:absolute;
  left:50%;
  top:52.5%;
  transform:translate(-50%,-50%);
  width:min(1180px,78%);
  height:min(650px,68%);
  display:grid;
  grid-template-columns:230px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  gap:22px;
  z-index:20;
}

.glassPanel{
  border-radius:28px;
  background:rgba(255,250,240,.76);
  border:1px solid rgba(198,145,79,.22);
  box-shadow:
    0 18px 40px rgba(116,86,54,.13),
    inset 0 1px 0 rgba(255,255,255,.75);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

#sidePanel{
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

.sideBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  width:100%;
  min-height:50px;
  padding:0 15px;
  border-radius:17px;
  background:transparent;
  display:flex;
  align-items:center;
  gap:11px;
  color:#7a4f27;
  font-size:15px;
  font-weight:900;
  text-align:left;
}

.sideBtn:hover{background:rgba(255,246,231,.58);}

.sideBtn.active{
  background:rgba(255,246,231,.96);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    0 4px 12px rgba(120,80,35,.08);
}

.sideIcon{
  width:24px;
  text-align:center;
  font-size:18px;
}

.sideIcon img{
  width:20px;
  height:20px;
  object-fit:contain;
  display:block;
  margin:0 auto;
}

#mascotBox{
  margin-top:12px;
  flex:1 1 auto;
  min-height:0;
  border-radius:20px;
  background:
    linear-gradient(180deg,rgba(255,249,232,.76),rgba(255,238,206,.58));
  border:1px dashed rgba(170,117,62,.28);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px 12px 14px;
  overflow:hidden;
  position:relative;
}

#mascotBox img{
  width:88%;
  max-width:172px;
  max-height:150px;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 8px 12px rgba(120,80,35,.13));
  animation:mascotFloat 3.2s ease-in-out infinite;
}

#mascotBubble{
  position:absolute;
  right:10px;
  top:14px;
  max-width:150px;
  min-height:30px;
  padding:6px 13px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  text-align:center;
  white-space:nowrap;
  border:1px solid rgba(206,151,82,.22);
  box-shadow:
    0 6px 14px rgba(120,80,35,.10),
    inset 0 1px 0 rgba(255,255,255,.85);
}

#mascotBubble::after{
  content:"";
  position:absolute;
  right:18px;
  bottom:-6px;
  width:10px;
  height:10px;
  background:inherit;
  border-right:1px solid rgba(206,151,82,.22);
  border-bottom:1px solid rgba(206,151,82,.22);
  transform:rotate(45deg);
}

@keyframes mascotFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}

.bubble-work{background:#fff6e5;color:#c77b2a;animation:workShake 1.6s ease-in-out infinite;}
.bubble-ok{background:#e8fff1;color:#2e9b5f;}
.bubble-calm{background:#eef6ff;color:#4c7ecf;animation:calmFloat 2.6s ease-in-out infinite;}
.bubble-energy{background:#ffe9e9;color:#d94a4a;animation:energyJump .62s ease-in-out infinite alternate;}
.bubble-wait{background:#fffbe8;color:#b59b2a;}
.bubble-plan{background:#f3ecff;color:#7a57d1;}
.bubble-busy{background:#fff0f6;color:#c84a7a;animation:busyWiggle 1.5s ease-in-out infinite;}
.bubble-cheer{background:#fff4e6;color:#d9812c;animation:energyJump .78s ease-in-out infinite alternate;}
.bubble-thinking{background:#eef0ff;color:#5b63d6;animation:thinkingBlink 1.2s ease-in-out infinite;}
.bubble-soft{background:#f6fff3;color:#6fa35a;animation:calmFloat 3s ease-in-out infinite;}

@keyframes workShake{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-3px);}
}

@keyframes calmFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}

@keyframes energyJump{
  from{transform:translateY(0) scale(1);}
  to{transform:translateY(-7px) scale(1.03);}
}

@keyframes busyWiggle{
  0%,100%{transform:rotate(0deg);}
  33%{transform:rotate(2deg);}
  66%{transform:rotate(-2deg);}
}

@keyframes thinkingBlink{
  0%,100%{opacity:1;}
  50%{opacity:.56;}
}

#mainPanel{
  padding:26px;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

.view{
  display:none;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

.view.active{
  display:flex;
  flex-direction:column;
}

.walletHeader{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:18px;
  min-width:0;
  flex:0 0 auto;
}

.walletHeader > div:last-child{
  min-width:0;
}

.walletIcon{
  width:56px;
  height:56px;
  min-width:56px;
  border-radius:18px;
  background:
    radial-gradient(circle at 40% 22%,rgba(255,255,255,.72),transparent 30%),
    linear-gradient(180deg,#ffe7b8,#d89c58);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    0 8px 18px rgba(130,82,28,.14);
  position:relative;
  overflow:hidden;
}

.walletIcon img{
  width:78%;
  height:78%;
  object-fit:contain;
  display:block;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 4px 7px rgba(130,82,28,.16));
}

.walletTitle{
  margin:0;
  font-size:30px;
  line-height:1.1;
  font-weight:900;
  color:#6f4726;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.walletSub{
  margin:5px 0 0;
  font-size:13px;
  line-height:1.3;
  color:#9b7656;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.balanceCard{
  position:relative;
  flex:0 0 auto;
  min-height:145px;
  border-radius:26px;
  padding:24px 28px;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% 8%,rgba(255,239,183,.95),transparent 48%),
    linear-gradient(135deg,rgba(255,247,218,.96),rgba(255,255,250,.82));
  border:1px solid rgba(214,166,86,.25);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 12px 26px rgba(151,105,35,.12);
}

.balanceCard::after{
  content:"";
  position:absolute;
  right:38px;
  top:22px;
  width:70px;
  height:70px;
  background:var(--dorm-coin-bg, none) center center / contain no-repeat;
  opacity:.34;
  pointer-events:none;
}

.goldLabel{
  color:#8a6843;
  font-size:15px;
  font-weight:900;
  margin-bottom:12px;
}

.goldNumber{
  color:#d88118;
  font-size:58px;
  line-height:1;
  font-weight:900;
}

.goldUnit{
  color:#9b6422;
  font-size:19px;
  font-weight:900;
  margin-left:8px;
}

.goldStats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:16px;
  flex:0 0 auto;
}

.statCard{
  min-width:0;
  padding:17px;
  border-radius:18px;
  background:rgba(255,252,247,.68);
  border:1px solid rgba(255,255,255,.62);
}

.statLabel{
  color:#92745a;
  font-size:12px;
  font-weight:900;
  margin-bottom:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.statValue{
  color:#6f4726;
  font-size:24px;
  font-weight:900;
}

.todayValue.income{color:#3f984d;}
.todayValue.none{color:#8a6a4e;}

.sectionTitle{
  margin:0 0 14px;
  color:#6f4726;
  font-size:26px;
  line-height:1.2;
  font-weight:900;
}

.sectionDesc{
  margin:0 0 18px;
  color:#9b7656;
  font-size:13px;
  line-height:1.4;
  font-weight:800;
}

.collectionBookCard{
  appearance:none;
  border:1px solid rgba(255,255,255,.58);
  cursor:pointer;
  position:relative;
  min-width:0;
  min-height:118px;
  border-radius:18px;
  background:rgba(255,252,247,.64);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.68);
  padding:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.collectionBookCard:hover,
.collectionBookCard:focus-visible{
  background:rgba(255,252,247,.78);
}

.collectionBookCard img{
  width:100%;
  height:100%;
  max-width:132px;
  max-height:104px;
  object-fit:contain;
  display:block;
  user-select:none;
  pointer-events:none;
}

.collectionBookCard::after{
  content:attr(data-hover-text);
  position:absolute;
  left:50%;
  bottom:7px;
  transform:translateX(-50%) translateY(4px);
  max-width:calc(100% - 14px);
  padding:3px 8px;
  border-radius:999px;
  background:rgba(255,250,240,.92);
  border:1px solid rgba(201,140,79,.16);
  color:#84582f;
  font-size:11px;
  font-weight:900;
  line-height:1.2;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .16s ease, transform .16s ease;
}

.collectionBookCard:hover::after,
.collectionBookCard:focus-visible::after{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.inventoryEmptyNote{
  grid-column:1 / -1;
}

.walletLedgerBlock{
  margin-top:18px;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-top:16px;
  border-top:1px dashed rgba(170,117,62,.24);
  overflow:hidden;
}

.walletLedgerHead{
  flex:0 0 auto;
}

.walletLedgerHead .sectionTitle{
  margin-bottom:6px;
  font-size:22px;
}

.walletLedgerHead .sectionDesc{
  margin-bottom:0;
}

.ledgerList{
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding-right:4px;
}

.ledgerItem{
  display:grid;
  grid-template-columns:28px minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  padding:11px 13px;
  border-radius:15px;
  background:rgba(255,255,255,.58);
  color:#72533c;
  font-size:13px;
}

.ledgerArrow{
  width:24px;
  height:24px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:900;
}

.ledgerArrow.in{
  background:rgba(100,180,90,.18);
  color:#4b9b48;
}

.ledgerArrow.out{
  background:rgba(226,91,64,.14);
  color:#d45138;
}

.ledgerItem strong{
  display:block;
  color:#6f4726;
  font-size:13px;
  margin-bottom:3px;
}

.ledgerMeta{
  color:#9a7b62;
  font-size:11px;
}

.ledgerItem strong,
.ledgerMeta{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.ledgerAmount{
  font-weight:900;
  font-size:16px;
}

.ledgerAmount.in{color:#7aa02d;}
.ledgerAmount.out{color:#d84f35;}

.inventoryList{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding-right:4px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  align-content:start;
  gap:10px;
}

.inventoryItem{
  min-width:0;
  border-radius:18px;
  background:rgba(255,252,247,.64);
  border:1px solid rgba(255,255,255,.58);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.68);
  padding:13px;
  display:grid;
  grid-template-columns:34px minmax(0,1fr);
  gap:10px;
  align-items:center;
}

.inventoryIcon{
  width:34px;
  height:34px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,246,231,.86);
  border:1px solid rgba(201,140,79,.16);
  font-size:18px;
  overflow:hidden;
  flex:0 0 34px;
}

.inventoryIcon img{
  width:72%;
  height:72%;
  object-fit:contain;
  display:block;
}

.inventoryIcon .inventoryEmoji{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  line-height:1;
}

.inventoryName{
  min-width:0;
  color:#6f4726;
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.inventoryQty{
  margin-left:5px;
  color:#c27932;
  font-weight:900;
}

.noticeCenter{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding-right:4px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.noticeRoomGroup{
  flex:0 0 auto;
  border-radius:18px;
  background:rgba(255,252,247,.62);
  border:1px solid rgba(255,255,255,.58);
  overflow:hidden;
}

.noticeRoomHeader{
  appearance:none;
  width:100%;
  min-height:44px;
  border:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  color:#744b25;
  font-size:15px;
  font-weight:900;
  line-height:1.15;
  text-align:left;
  background:rgba(255,246,231,.68);
  border-bottom:1px dashed rgba(170,117,62,.18);
}

.noticeRoomToggle,
.noticeRoomFoldBtn{
  appearance:none;
  border:0;
  background:transparent;
  font-family:inherit;
  cursor:pointer;
  padding:0;
}

.noticeRoomToggle{
  min-width:0;
  color:#744b25;
  font-size:inherit;
  font-weight:900;
  line-height:1.15;
  text-align:left;
  display:flex;
  align-items:center;
}

.noticeRoomToggle span{
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.noticeRoomFoldBtn{
  color:#a8753f;
  font-size:11px;
  font-weight:900;
  opacity:.78;
  white-space:nowrap;
}

.noticeRoomGroup.open .noticeRoomFoldBtn{

}

.noticeRoomCount{
  flex:0 0 auto;
  min-width:24px;
  height:22px;
  padding:0 8px;
  border-radius:999px;
  background:rgba(201,140,79,.16);
  color:#9b6422;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.noticeRoomBody{
  display:none;
  padding:11px 14px 13px;
}

.noticeRoomGroup.open .noticeRoomBody{
  display:block;
}

.noticeRoomEmpty{
  color:#92745a;
  font-size:12px;
  line-height:1.6;
}

.noticeRoomItem{
  padding:9px 0;
  border-bottom:1px dashed rgba(170,117,62,.16);
}

.noticeRoomItem:last-child{
  border-bottom:none;
}

.noticeRoomTitleLine{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  min-width:0;
}

.noticeRoomItemTitle{
  min-width:0;
  color:#6f4726;
  font-size:13px;
  font-weight:900;
  line-height:1.45;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.noticeRoomItemDesc{
  margin-top:3px;
  color:#8a6644;
  font-size:12px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.noticeRoomTime{
  flex:0 0 auto;
  color:#b18a65;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.emptyText,.errorText{
  font-size:13px;
  line-height:1.7;
  padding:12px;
}

.emptyText{color:#947256;}
.errorText{color:#9b4a35;}

.taskList,
.profileScroll{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding-right:4px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.taskTabs{
  display:flex;
  align-items:center;
  gap:6px;
  margin:0 0 10px;
  padding:3px;
  border-radius:999px;
  background:rgba(255,252,247,.46);
  border:1px solid rgba(255,255,255,.50);
  flex:0 0 auto;
}

.taskTab{
  appearance:none;
  border:1px solid transparent;
  border-radius:999px;
  min-height:28px;
  padding:0 11px;
  cursor:pointer;
  color:#7b583a;
  font-size:12px;
  font-weight:900;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:background .18s ease,color .18s ease,border-color .18s ease,box-shadow .18s ease;
  white-space:nowrap;
}

.taskTab:hover{
  background:rgba(255,248,238,.68);
}

.taskTab.active{
  color:#704622;
  background:rgba(255,244,226,.90);
  border-color:rgba(201,140,79,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 3px 8px rgba(135,86,40,.08);
}

.taskTab span{
  min-width:17px;
  height:17px;
  border-radius:999px;
  padding:0 5px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  line-height:1;

}

.taskTab.active span{

}

.taskCardCompact{

}

.taskCompactLine{

  grid-template-columns:minmax(105px,.95fr) minmax(0,1.8fr) auto;
  align-items:center;
  gap:10px;

}

.taskCompactLine .taskCardTitle{
  margin:0;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.taskMetaInline{
  min-width:0;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  column-gap:9px;
  row-gap:2px;
  color:#92745a;
  font-size:12px;
  line-height:1.35;
  font-weight:800;
  white-space:normal;
  overflow:visible;
}

.taskMetaInline span{
  flex:0 1 auto;
  max-width:100%;
  min-width:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}

.taskCompactLine .taskActionRow{
  margin:0;
  flex:0 0 auto;
  justify-content:flex-end;
}

.taskDoneText{

  line-height:1.35;
  font-weight:800;
  white-space:nowrap;
}

.taskCard,
.profileCard{
  border-radius:18px;
  background:rgba(255,252,247,.64);
  border:1px solid rgba(255,255,255,.58);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.68);
  padding:14px;
}

.taskCardTitle,
.profileCardTitle{
  margin:0 0 10px;
  color:#6f4726;
  font-size:15px;
  line-height:1.25;
  font-weight:900;
}

.taskHint,
.profileHint{
  margin:0;
  color:#92745a;
  font-size:12px;
  line-height:1.65;
}

.taskActionRow,
.profileActionRow{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.dormMiniBtn,
.dormSubBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  min-height:34px;
  padding:0 14px;
  border-radius:12px;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  transition:transform .16s ease, background .16s ease, box-shadow .16s ease;
}

.dormMiniBtn{
  background:#c98c4f;
  color:#fffaf3;
  box-shadow:0 4px 10px rgba(139,89,36,.12);
}

.dormMiniBtn:hover{background:#b9793f;transform:translateY(-1px);}

.dormSubBtn{
  background:rgba(239,219,190,.88);
  color:#6f4726;
}

.dormSubBtn:hover{background:rgba(229,204,169,.96);transform:translateY(-1px);}

.profileTop{
  display:grid;
  grid-template-columns:auto minmax(150px,1.05fr) minmax(180px,1fr) auto;
  gap:14px;
  align-items:center;
}

.profileTopInfo{
  min-width:0;
}

.profileTopHonor{
  min-width:0;
  align-self:stretch;

  align-items:center;
  padding:10px 12px;
  border-radius:16px;
  background:rgba(255,246,231,.54);

}

.profileTopHonor .honorPills{

}

.profileTopHonor .honorPill{
  min-height:22px;
  padding:0 8px;

}

.profileTopAction{
  display:flex;
  justify-content:flex-end;
  align-items:center;
}

.profileAvatar{
  width:72px;
  height:72px;
  border-radius:22px;
  object-fit:cover;
  background:rgba(255,244,226,.9);
  border:1px solid rgba(184,132,75,.18);
  box-shadow:0 8px 18px rgba(116,86,54,.12);
}

.profileNameLine{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.profileName{
  color:#6f4726;
  font-size:20px;
  font-weight:900;
  line-height:1.2;
}

.profileBadge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:24px;
  padding:0 9px;
  border-radius:999px;
  background:rgba(201,140,79,.14);
  color:#9b6422;
  font-size:11px;
  font-weight:900;
}

.profileMeta{
  margin-top:6px;
  color:#9b7656;
  font-size:12px;
  line-height:1.55;
  font-weight:800;
}

.profileGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.profileField{
  min-width:0;
  border-radius:14px;
  background:rgba(255,255,255,.48);
  border:1px solid rgba(255,255,255,.56);
  padding:10px 11px;
}

.profileField.full{grid-column:1 / -1;}

.profileLabel{
  color:#9b7656;
  font-size:11px;
  font-weight:900;
  margin-bottom:5px;
}

.profileValue{
  color:#6f4726;
  font-size:13px;
  font-weight:800;
  line-height:1.45;
  word-break:break-word;
  white-space:pre-wrap;
}

.skillPills,
.honorPills{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.skillPill,
.honorPill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:25px;
  padding:0 9px;
  border-radius:999px;
  background:rgba(255,246,231,.86);
  border:1px solid rgba(201,140,79,.16);
  color:#84582f;
  font-size:11px;
  font-weight:900;
}

.profileForm{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.profileForm label{
  display:flex;
  flex-direction:column;
  gap:5px;
  color:#8a6644;
  font-size:11px;
  font-weight:900;
}

.profileForm label.full{grid-column:1 / -1;}

.profileForm input,
.profileForm select,
.profileForm textarea{
  width:100%;
  border:1px solid rgba(201,140,79,.22);
  border-radius:12px;
  background:rgba(255,255,255,.72);
  color:#6f4726;

  padding:9px 10px;
  font-size:12px;
  font-weight:800;
  font-family:inherit;
}

.profileForm textarea{
  min-height:76px;
  resize:vertical;
  line-height:1.55;
}

.profileForm input:focus,
.profileForm select:focus,
.profileForm textarea:focus{
  border-color:rgba(201,140,79,.58);
  box-shadow:0 0 0 3px rgba(201,140,79,.10);
  background:rgba(255,255,255,.92);
}

.profileEditNote,
.profileStatus{
  color:#9b7656;
  font-size:12px;
  line-height:1.6;

#view-inventory .inventoryMainCol{
  flex:1 1 auto;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

#view-inventory .inventoryList{
  flex:1 1 auto;
  min-height:0;
}

.recentObtainedPanel{
  position:absolute;
  left:var(--recent-panel-left);
  top:var(--recent-panel-top);
  width:var(--recent-panel-width);
  min-width:calc(190px * var(--ui-scale));
  max-width:calc(274px * var(--ui-scale));
  padding:calc(13px * var(--ui-scale)) calc(13px * var(--ui-scale)) calc(12px * var(--ui-scale));
  border-radius:calc(20px * var(--ui-scale));
  background:linear-gradient(180deg, rgba(255,251,243,.64), rgba(255,244,225,.44));
  border:1px solid rgba(184,127,69,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72), 0 12px 26px rgba(116,76,38,.075);
  color:#704721;
  z-index:34;
  pointer-events:auto;
  display:none;
}

body.recent-obtained-visible .recentObtainedPanel{
  display:block;
}

.recentObtainedHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:calc(9px * var(--ui-scale));
}

.recentObtainedTitle{
  display:flex;
  align-items:center;
  gap:6px;
  color:#704721;
  font-size:calc(13px * var(--ui-scale));
  font-weight:900;
  line-height:1.1;
  letter-spacing:.03em;
  white-space:nowrap;
}

.recentObtainedTitle::before{
  content:"✦";
  color:#c98c4f;
  font-size:calc(12px * var(--ui-scale));
}

.recentObtainedHint{
  color:#b08355;
  font-size:calc(10px * var(--ui-scale));
  font-weight:900;
  white-space:nowrap;
}

.recentObtainedList{
  display:flex;
  flex-direction:column;
  gap:calc(7px * var(--ui-scale));
  min-height:calc(134px * var(--ui-scale));
}

.recentObtainedItem{
  display:grid;
  grid-template-columns:calc(30px * var(--ui-scale)) minmax(0,1fr);
  gap:calc(8px * var(--ui-scale));
  align-items:center;
  min-height:calc(42px * var(--ui-scale));
  padding:calc(7px * var(--ui-scale)) calc(8px * var(--ui-scale));
  border-radius:calc(14px * var(--ui-scale));
  background:rgba(255,252,246,.60);
  border:1px solid rgba(190,132,72,.11);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.62);
}

.recentObtainedIcon{
  width:calc(30px * var(--ui-scale));
  height:calc(30px * var(--ui-scale));
  border-radius:calc(10px * var(--ui-scale));
  display:grid;
  place-items:center;
  background:rgba(255,246,231,.72);
  overflow:hidden;
}

.recentObtainedIcon img{
  width:calc(23px * var(--ui-scale));
  height:calc(23px * var(--ui-scale));
  object-fit:contain;
  display:block;
}

.recentObtainedIcon .inventoryEmoji{
  font-size:calc(15px * var(--ui-scale));
  line-height:1;
}

.recentObtainedBody{
  min-width:0;
}

.recentObtainedName{
  color:#6f4726;
  font-size:calc(11.5px * var(--ui-scale));
  line-height:1.15;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.recentObtainedMeta{
  margin-top:calc(3px * var(--ui-scale));
  color:#9a704b;
  font-size:calc(10px * var(--ui-scale));
  line-height:1.2;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.recentObtainedEmpty{
  min-height:calc(126px * var(--ui-scale));
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(14px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  border:1px dashed rgba(184,127,69,.20);
  background:rgba(255,251,244,.36);
  color:#9a704b;
  text-align:center;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.55;
  font-weight:850;
}

@media(max-width:540px){
  .recentObtainedPanel{
    position:static!important;
    left:auto!important;
    top:auto!important;
    width:100%;
    min-width:0;
    max-width:none;
    margin-top:12px;
    padding:12px;
    border-radius:18px;
    z-index:auto;
  }

  body:not(.recent-obtained-visible) .recentObtainedPanel{
    display:none;
  }

  .recentObtainedList{
    min-height:0;
    gap:7px;
  }

  .recentObtainedItem:nth-child(n+4){
    display:none;
  }

  .recentObtainedEmpty{
    min-height:86px;
  }
}

<script>
const SUPABASE_URL = "https://tfevitwoqmxwaguvtyms.supabase.co";
const SUPABASE_KEY = "sb_publishable_0cFYhwx_9uEcrXnMJzzNMQ_cEng8xmI";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CURRENT_ROOM = "dorm";


const dormTexts = Object.create(null);

const dormConfig = {
  noticeRooms: [],
  noticeRoomAliases: {},
  noticeFinishedStatuses: new Set(),
  noticeStudioTaskTypes: new Set(),
  noticeStudioTaskKeywords: [],
  noticeReleasedProjectStatuses: new Set(),
  storedGachaBallTiers: {},
  allowedLocations: [],
  skillAliases: [],
  mbtiOptions: []
};

function parseDormJsonText(key){
  const raw = String(dormTexts[key] || "").trim();
  try{
    return JSON.parse(raw);
  }catch(error){
    throw new Error(`宿舍页数据库配置不是有效 JSON：${key}`);
  }
}

function requireDormJsonArray(key){
  const value = parseDormJsonText(key);
  if(!Array.isArray(value)){
    throw new Error(`宿舍页数据库配置必须是数组：${key}`);
  }
  return value;
}

function requireDormJsonObject(key){
  const value = parseDormJsonText(key);
  if(!value || Array.isArray(value) || typeof value !== "object"){
    throw new Error(`宿舍页数据库配置必须是对象：${key}`);
  }
  return value;
}

function loadDormConfigFromTexts(){
  const noticeRooms = requireDormJsonArray("notice.config.rooms_json")
    .map(item => ({
      key:String(item?.key || "").trim(),
      labelKey:String(item?.labelKey || "").trim(),
      icon:String(item?.icon || "").trim()
    }))
    .filter(item => item.key && item.labelKey);

  if(!noticeRooms.length){
    throw new Error("宿舍页数据库配置缺失：notice.config.rooms_json");
  }

  const noticeAliases = requireDormJsonObject("notice.config.room_aliases_json");
  const storedGachaBallTiers = requireDormJsonObject("gacha.config.stored_ball_tiers_json");
  const allowedLocations = requireDormJsonArray("profile.config.allowed_locations_json").map(item => String(item || "").trim()).filter(Boolean);
  const skillAliases = requireDormJsonArray("profile.config.skill_aliases_json")
    .map(group => ({
      name:String(group?.name || "").trim(),
      values:Array.isArray(group?.values) ? group.values.map(item => String(item || "").trim()).filter(Boolean) : []
    }))
    .filter(group => group.name && group.values.length);
  const mbtiOptions = requireDormJsonArray("profile.config.mbti_options_json").map(item => String(item ?? "").trim());

  if(!allowedLocations.length){
    throw new Error("宿舍页数据库配置缺失：profile.config.allowed_locations_json");
  }
  if(!skillAliases.length){
    throw new Error("宿舍页数据库配置缺失：profile.config.skill_aliases_json");
  }
  if(!mbtiOptions.length){
    throw new Error("宿舍页数据库配置缺失：profile.config.mbti_options_json");
  }

  dormConfig.noticeRooms = noticeRooms;
  dormConfig.noticeRoomAliases = noticeAliases;
  dormConfig.noticeFinishedStatuses = new Set(requireDormJsonArray("notice.config.finished_statuses_json").map(item => String(item || "").trim().toLowerCase()).filter(Boolean));
  dormConfig.noticeStudioTaskTypes = new Set(requireDormJsonArray("notice.config.studio_task_types_json").map(item => String(item || "").trim().toLowerCase()).filter(Boolean));
  dormConfig.noticeStudioTaskKeywords = requireDormJsonArray("notice.config.studio_task_keywords_json").map(item => String(item || "").trim()).filter(Boolean);

function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";

  root.style.setProperty("--bg-ui-scale","1");
  root.style.setProperty("--ui-scale","1");
  root.style.setProperty("--room-nav-scale","1");
  root.style.setProperty("--identity-scale","1");
}

function syncOverlayToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.45, Math.min(3.2, displayWidth / 1440));
  const navScale = Math.max(0.38, Math.min(3.2, displayWidth / 1440));

  root.style.setProperty("--bg-ui-scale", String(scale));
  root.style.setProperty("--ui-scale", String(scale));
  root.style.setProperty("--room-nav-scale", String(navScale));
  root.style.setProperty("--identity-scale", String(scale));
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function roleLabel(role){
  const r = String(role || "visitor").toLowerCase();
  const key = `role.${r}`;
  return Object.prototype.hasOwnProperty.call(dormTexts, key) ? t(key) : t("role.visitor");
}

}

function ledgerLabel(item){

}

function formatDate(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function cleanNoticeSongText(value){
  return String(value ?? "")
    .replace(/《\s*(?:编号|项目编号|歌曲编号)?\s*[A-Za-z]*\d+[.．。]\s*([^》]+?)\s*》/g,"《$1》")
    .replace(/(^|[：:\s])(?:编号|项目编号|歌曲编号)?\s*[A-Za-z]*\d+[.．。]\s*(?=《)/g,"$1")
    .replace(/(^|[：:\s])(?:编号|项目编号|歌曲编号)[.．。]\s*(?=《)/g,"$1");
}

function isToday(value){
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return false;
  const now = new Date();
  return d.getFullYear() === now.getFullYear()
    && d.getMonth() === now.getMonth()
    && d.getDate() === now.getDate();
}

/* 身份与登录状态 */
function readLocalAuth(){
  authState.loggedIn = localStorage.getItem(STORAGE_KEYS.loggedIn) === "true";
  authState.nickname = String(localStorage.getItem(STORAGE_KEYS.user) || "").trim();
  authState.role = String(localStorage.getItem(STORAGE_KEYS.role) || "visitor").toLowerCase();
  authState.memberId = localStorage.getItem(STORAGE_KEYS.memberId) || null;
  authState.memberCode = localStorage.getItem(STORAGE_KEYS.memberCode) || "";

  if(!authState.loggedIn || !authState.nickname || !authState.memberId){
    window.location.href = requirePageUrl("index");
    return false;
  }

  return true;
}

function updateIdentity(member){
  const name = member?.nickname || authState.nickname || "";
  const role = roleLabel(member?.role || authState.role);

  if(!currentUserText) return;

  if(!name){
    if(identityNickname) identityNickname.textContent = t("role.visitor");
    if(identitySeparator) identitySeparator.classList.add("hidden");
    if(identityRole){
      identityRole.classList.add("hidden");
      identityRole.textContent = t("role.visitor");
    }
    if(!identityNickname) currentUserText.textContent = t("role.visitor");
    if(identityAuthText) identityAuthText.textContent = t("identity.login_button");
    return;
  }

  if(identityNickname && identitySeparator && identityRole){
    identityNickname.textContent = name;
    identitySeparator.classList.remove("hidden");
    identityRole.classList.remove("hidden");
    identityRole.textContent = role;
  }else{
    currentUserText.textContent = `${name}｜${role}`;
  }

  if(identityAuthText) identityAuthText.textContent = t("identity.logout_button");
}

function handleLogout(){

  localStorage.removeItem(STORAGE_KEYS.user);
  localStorage.removeItem(STORAGE_KEYS.role);
  localStorage.removeItem(STORAGE_KEYS.memberId);
  localStorage.removeItem(STORAGE_KEYS.memberCode);

  localStorage.removeItem("room10_user");
  localStorage.removeItem("room10_current_user");

}

function getManagerPageByRole(){
  const role = String(authState.role || localStorage.getItem(STORAGE_KEYS.role) || "visitor").toLowerCase();

  if(role === "owner") return requirePageUrl("managerOwner");
  if(role === "admin") return requirePageUrl("managerAdmin");
  if(role === "member" || role === "applying") return requirePageUrl("managerMember");

  return requirePageUrl("managerVisitor");
}

function enterManagerRoom(){
  window.location.href = getManagerPageByRole();
}

function enterRoom(page, needLogin, room){
  const targetPage = String(page || "").trim();
  const targetRoom = String(room || "").trim();
  if(!targetPage) return;

  if(needLogin && !readLocalAuth()){
    return;
  }

  if(targetRoom === "dorm" && authState.role === "applying"){
    window.location.href = getManagerPageByRole();
    return;
  }

  if((targetRoom === "flower" || targetRoom === "pets") && !authState.loggedIn){
    window.location.href = `${targetPage}?mode=guest`;
    return;
  }

  window.location.href = targetPage;
}

function setupRoomNav(currentRoom){
  const buttons = document.querySelectorAll(".roomNavLayer .navBtn");
  const current = String(currentRoom || "").trim();

  buttons.forEach(btn => {
    const room = btn.dataset.room || "";
    const isCurrent = room === current;

    btn.classList.toggle("is-current", isCurrent);

    if(isCurrent){
      btn.setAttribute("aria-current","page");
      btn.setAttribute("tabindex","-1");
    }else{
      btn.removeAttribute("aria-current");
      btn.removeAttribute("tabindex");
    }

    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();

      if(btn.classList.contains("is-current")) return;

      if(btn.dataset.manager === "true"){
        enterManagerRoom();
        return;
      }

      const targetUrl = requirePageUrl(btn.dataset.page);
      enterRoom(targetUrl, btn.dataset.login === "true", btn.dataset.room);
    });
  });
}

   铃铛提醒

function noticeRoomKey(value){
  const raw = String(value || "").trim().toLowerCase();
  const aliases = dormConfig.noticeRoomAliases || {};
  const key = String(aliases[raw] || raw).trim();
  return allowedNoticeRooms().has(key) ? key : "";
}

function normalizeNoticeItem(item){
  const roomKey = noticeRoomKey(item.room || item.room_key || item.roomKey || item.category || item.notice_room || item.source_room);

  const rawTitle = item.title || item.notice_title || item.subject || item.name || t("notice.default_title");
  const rawDesc = item.desc || item.description || item.content || item.message || item.body || item.notice_content || "";

  return {
    room:roomKey,
    title:cleanNoticeSongText(rawTitle),
    desc:cleanNoticeSongText(rawDesc),
    created_at:item.created_at || item.createdAt || item.updated_at || item.time || null
  };
}

function noticeVisibleToCurrentUser(item){
  if(!item) return false;

  const targetMemberId = item.member_id || item.target_member_id || item.to_member_id || item.receiver_member_id || null;
  const targetRole = String(item.role || item.target_role || item.receiver_role || "").toLowerCase();
  const targetNickname = String(item.nickname || item.target_nickname || item.to_nickname || "").trim();

  if(targetMemberId && authState.memberId && String(targetMemberId) !== String(authState.memberId)) return false;
  if(targetRole && targetRole !== "all" && targetRole !== "member" && targetRole !== String(authState.role || "").toLowerCase()) return false;
  if(targetNickname && authState.nickname && targetNickname !== authState.nickname) return false;

  const status = String(item.status || item.notice_status || item.state || "").toLowerCase();
  const isHidden = item.is_hidden === true || item.hidden === true || status === "hidden";
  const isDeleted = item.is_deleted === true || item.deleted === true || status === "deleted";

  return !isHidden && !isDeleted;
}

function noticeStillUseful(item){
  if(!noticeVisibleToCurrentUser(item)) return false;

  const status = String(item.status || item.notice_status || item.state || "").toLowerCase();
  if(dormConfig.noticeFinishedStatuses.has(status)) return false;

  const expiresAt = item.expires_at || item.expire_at || item.valid_until || item.end_at || item.ended_at || null;
  if(expiresAt){
    const expires = new Date(expiresAt);
    if(!Number.isNaN(expires.getTime()) && expires.getTime() < Date.now()) return false;
  }

  const roomKey = noticeRoomKey(item.room || item.room_key || item.roomKey || item.category || item.notice_room || item.source_room);
  const type = String(item.type || item.notice_type || item.event_type || item.task_type || item.subcategory || "").toLowerCase();
  const title = String(item.title || item.notice_title || item.subject || item.name || "");
  const desc = String(item.desc || item.description || item.content || item.message || item.body || item.notice_content || "");
  const text = `${title} ${desc}`;

  /* 个人任务类只留在“我的任务”，不重复进入系统通知。 */
  if(roomKey === "studio"){
    if(dormConfig.noticeStudioTaskTypes.has(type)) return false;
    if(dormConfig.noticeStudioTaskKeywords.some(keyword => keyword && text.includes(keyword))) return false;

    const releaseDateRaw = item.release_date || item.publish_at || item.scheduled_at || item.release_at || null;
    const projectStatus = String(item.project_status || item.work_status || item.publish_status || "").toLowerCase();
    if(releaseDateRaw){
      const releaseDate = new Date(releaseDateRaw);
      if(!Number.isNaN(releaseDate.getTime())){
        const isPastRelease = releaseDate.getTime() < Date.now();
        const isReleased = dormConfig.noticeReleasedProjectStatuses.has(projectStatus);
        if(isPastRelease || isReleased) return false;
      }
    }
  }

  return true;
}

function renderDormNoticeCenter(items){
  const wrap = document.getElementById("dormNoticeCenter");
  if(!wrap) return;

  const list = (Array.isArray(items) ? items : [])
    .filter(noticeStillUseful)
    .map(normalizeNoticeItem)
    .filter(item => item.room && allowedNoticeRooms().has(item.room) && (item.title || item.desc));

  const byRoom = new Map();
  roomNoticeGroups().forEach(room => byRoom.set(room.key, []));

  list.forEach(item => {
    if(byRoom.has(item.room)){
      byRoom.get(item.room).push(item);
    }
  });

  wrap.innerHTML = roomNoticeGroups().map(room => {
    const roomItems = byRoom.get(room.key) || [];
    const shouldOpen = false;

    const body = roomItems.length
      ? roomItems.map(item => {
        const desc = item.desc || t("notice.default_desc_missing");
        const time = item.created_at ? formatDate(item.created_at) : "";

        return `
          <div class="noticeRoomItem">
            <div class="noticeRoomTitleLine">
              <div class="noticeRoomItemTitle">${escapeHtml(item.title || t("notice.default_title"))}</div>
              ${time ? `<div class="noticeRoomTime">${escapeHtml(time)}</div>` : ""}
            </div>
            <div class="noticeRoomItemDesc">${escapeHtml(desc)}</div>
          </div>
        `;
      }).join("")
      : `<div class="noticeRoomEmpty">${tHtml("notice.empty")}</div>`;

    return `
      <section class="noticeRoomGroup${shouldOpen ? " open" : ""}" data-room="${escapeHtml(room.key)}">
        <div class="noticeRoomHeader">
          <button class="noticeRoomToggle" type="button">
            <span>${escapeHtml(room.icon)} ${tHtml(room.labelKey)}</span>
          </button>
          <span class="noticeRoomCount">${roomItems.length}</span>
          <button class="noticeRoomFoldBtn" type="button">${shouldOpen ? tHtml("notice.fold_close") : tHtml("notice.fold_open")}</button>
        </div>
        <div class="noticeRoomBody">${body}</div>
      </section>
    `;
  }).join("");

  wrap.querySelectorAll(".noticeRoomToggle, .noticeRoomFoldBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const group = btn.closest(".noticeRoomGroup");
      if(!group) return;

      group.classList.toggle("open");
      const foldBtn = group.querySelector(".noticeRoomFoldBtn");
      if(foldBtn){
        foldBtn.textContent = group.classList.contains("open") ? t("notice.fold_close") : t("notice.fold_open");
      }
    });
  });
}

async function fetchSystemNoticesByRpc(){
  const { data,error } = await supabaseClient.rpc("get_room10_system_notifications",{
    p_member_id:authState.memberId,
    p_member_code:authState.memberCode
  });

  if(error) throw error;
  return Array.isArray(data) ? data : [];
}

async function loadSystemNotices(){
  const wrap = document.getElementById("dormNoticeCenter");
  if(!wrap) return;

  if(!authState.memberId || !authState.memberCode){
    wrap.innerHTML = `<div class="errorText">${tHtml("notice.read_failed")}</div>`;
    return;
  }

  try{
    /*
      通知可见权限统一交给 get_room10_system_notifications RPC 处理。
      前端不再按 localStorage 里的 role 做二次过滤，避免以下情况误删通知：
      1. localStorage 角色缓存旧了；
      2. owner 需要看到 creator/owner 类管理通知；
      3. 数据库已经判定可见，但前端角色别名不一致。
    */
    const rows = await fetchSystemNoticesByRpc();
    renderDormNoticeCenter(rows);
  }catch(error){
    console.error(error);
    wrap.innerHTML = `<div class="errorText">${tHtml("notice.read_failed")}：${escapeHtml(error.message || "get_room10_system_notifications")}</div>`;
  }
}

  const panel = document.getElementById("recentObtainedPanel");
  const inventoryView = document.getElementById("view-inventory");
  const overlayEl = document.getElementById("overlay");
  if(!panel || !inventoryView || !overlayEl) return;

  if(isDormMobileLayout()){
    if(panel.parentElement !== inventoryView){
      inventoryView.appendChild(panel);
    }
    panel.style.left = "";
    panel.style.top = "";
    panel.style.width = "";
    return;
  }

  if(panel.parentElement !== overlayEl){
    overlayEl.appendChild(panel);
  }

  panel.style.left = "";
  panel.style.top = "";
  panel.style.width = "";
}

function activateDormView(target, saveState=true){
  const nextView = DORM_VIEW_KEYS.has(target) ? target : "tasks";
  const buttons = document.querySelectorAll(".sideBtn");
  const views = document.querySelectorAll(".view");

  buttons.forEach(item => item.classList.toggle("active", item.dataset.view === nextView));
  views.forEach(view => view.classList.toggle("active", view.id === `view-${nextView}`));
  document.body.classList.toggle("recent-obtained-visible", nextView === "inventory");
  syncRecentObtainedPanelPlacement();
  if(nextView === "inventory"){
    loadRecentObtained(currentMemberProfile?.id || authState.memberId || null);
  }

  if(saveState){
    localStorage.setItem(DORM_ACTIVE_VIEW_KEY,nextView);
  }
}

function restoreDormView(){
  const saved = localStorage.getItem(DORM_ACTIVE_VIEW_KEY) || "tasks";
  activateDormView(saved,false);
}

function jumpToSystemNotice(){
  activateDormView("notice");
}

/* =========================================================
   我的任务：读取 / 渲染 / 快捷操作
========================================================= */
function taskTypeLabel(type){
  if(type === "vocal_submit" || type === "vocal_submitted") return t("tasks.tab.vocal_submit");
  if(type === "mix_submit" || type === "mix_submitted") return t("tasks.tab.mix_submit");
  if(type === "claim" || type === "singer_claim" || type === "mix_claim" || type === "singer_claimed" || type === "mix_claimed") return t("tasks.tab.claim");
  return t("tasks.title");
}

function taskTabKey(type){
  if(type === "vocal_submitted") return "vocal_submit";
  if(type === "mix_submitted") return "mix_submit";
  if(type === "singer_claim" || type === "mix_claim" || type === "singer_claimed" || type === "mix_claimed") return "claim";
  return type;
}

function taskToneText(task){
  const tone = String(task.project_tone || "").trim();
  if(!tone) return "";

  const key = taskTabKey(task.task_type);
  if(key === "vocal_submit" || key === "mix_submit"){
    return escapeHtml(tone);
  }

  return `${tHtml("tasks.meta.tone_label")}：${escapeHtml(tone)}`;
}

function firstTaskText(task,keys){
  for(const key of keys){
    const value = task?.[key];
    if(Array.isArray(value)){
      const joined = value.map(item => String(item ?? "").trim()).filter(Boolean).join("、");
      if(joined) return joined;
      continue;
    }

    const text = String(value ?? "").trim();
    if(text) return text;
  }
  return "";
}

function firstTaskNumber(task,keys,defaultValue=0){
  for(const key of keys){
    const value = task?.[key];
    if(value === null || value === undefined || value === "") continue;
    const num = Number(value);
    if(Number.isFinite(num)) return num;
  }
  return defaultValue;
}

function taskDateLine(task){
  const releaseDate = firstTaskText(task,[
    "release_date",
    "project_release_date",
    "scheduled_release_date",
    "publish_date",
    "publish_at",
    "scheduled_at",
    "release_at"
  ]);

  return releaseDate ? `${tHtml("tasks.meta.release_date")}：${escapeHtml(releaseDate)}` : "";
}

function taskOriginalLine(task){
  const originalNames = firstTaskText(task,[
    "my_original_names",
    "my_original_name",
    "assigned_original_names",
    "assigned_original_name",
    "original_names",
    "original_name",
    "part_names",
    "part_name",
    "my_part_names",
    "my_part_name"
  ]);

  return originalNames ? `${tHtml("tasks.meta.original")}：${escapeHtml(originalNames)}` : "";
}

function taskSingerNeedLine(task){
  const current = firstTaskNumber(task,["singer_count","current_singer_count","claimed_singer_count"],0);
  const target = firstTaskNumber(task,["target_singer_count","required_singer_count","need_singer_count"],0);
  const missing = firstTaskNumber(task,["missing_singer_count","need_claim_count"],Math.max(target - current, 0));
  if(target > 0) return `${tHtml("tasks.meta.singer_count")}：${current}/${target}${missing > 0 ? `，${t("tasks.meta.singer_missing", { count:missing })}` : ""}`;
  return `${tHtml("tasks.meta.singer_count")}：${current}`;
}

function taskSingerCountLine(task){
  const singerCount = firstTaskNumber(task,["singer_count","current_singer_count","claimed_singer_count"],0);
  return `${tHtml("tasks.meta.singer_count")}：${singerCount}`;
}

function taskMainButtonHtml(task){
  const projectId = escapeHtml(task.project_id);

  if(task.task_type === "vocal_submit"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="submit_vocal" data-project-id="${projectId}">${tHtml("tasks.action.submit_vocal")}</button>`;
  }

  if(task.task_type === "mix_submit"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="submit_mix" data-project-id="${projectId}">${tHtml("tasks.action.submit_mix")}</button>`;
  }

  if(task.task_type === "singer_claim"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="claim_singer" data-project-id="${projectId}">${tHtml("tasks.action.claim_singer")}</button>`;
  }

  if(task.task_type === "mix_claim"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="claim_mix" data-project-id="${projectId}">${tHtml("tasks.action.claim_mix")}</button>`;
  }

  if(task.task_type === "vocal_submitted"){
    return `<button class="dormSubBtn dormTaskActionBtn" type="button" data-action="undo_vocal" data-project-id="${projectId}">${tHtml("tasks.action.undo_vocal")}</button>`;
  }

  if(task.task_type === "mix_submitted"){
    return `<button class="dormSubBtn dormTaskActionBtn" type="button" data-action="undo_mix" data-project-id="${projectId}">${tHtml("tasks.action.undo_mix")}</button>`;
  }

  if(task.task_type === "singer_claimed"){
    return `<span class="taskDoneText">${tHtml("tasks.claimed_singer_hint")}</span>`;
  }

  if(task.task_type === "mix_claimed"){
    return `<span class="taskDoneText">${tHtml("tasks.claimed_mix_hint")}</span>`;
  }

  return "";
}

function taskMetaItems(task){
  const items = [];

  const tone = taskToneText(task);
  if(tone) items.push(tone);

  const original = taskOriginalLine(task);
  if(original) items.push(original);

  if(task.task_type === "singer_claim" || task.task_type === "singer_claimed"){
    items.push(taskSingerNeedLine(task));
  }

  if(task.task_type === "mix_claim" || task.task_type === "mix_claimed"){
    items.push(taskSingerCountLine(task));
  }

  const dateLine = taskDateLine(task);
  if(dateLine) items.push(dateLine);

  const extraText = firstTaskText(task,[
    "task_desc",
    "task_description",
    "project_desc",
    "project_description",
    "remark",
    "remarks",
    "note",
    "notes"
  ]);
  if(extraText) items.push(escapeHtml(extraText));

  return Array.from(new Set(items.filter(Boolean)));
}

function formatTaskTitle(task){
  const rawCode = firstTaskText(task,["project_code","code","project_no","project_number"]);
  const rawName = firstTaskText(task,["project_name","name","title","song_name","work_name"]);
  if(!rawName) throw new Error(`${t("common.config_error")}：project_name`);
  const name = escapeHtml(rawName);

  if(!rawCode) return name;

  const code = escapeHtml(rawCode.replace(/[.．。\s]+$/g,""));
  return `${code}.${name}`;
}

function taskCardHtml(task){
  const title = formatTaskTitle(task);
  const mainButton = taskMainButtonHtml(task);
  const metaItems = taskMetaItems(task);

  return `
    <div class="taskCard taskCardCompact" data-task-type="${escapeHtml(task.task_type)}" data-project-id="${escapeHtml(task.project_id)}">
      <div class="taskCompactLine">
        <h3 class="taskCardTitle">${title}</h3>
        <div class="taskMetaInline">
          ${metaItems.map(item => `<span>${item}</span>`).join("")}
        </div>
        <div class="taskActionRow">
          ${mainButton}
        </div>
      </div>
    </div>
  `;
}

function compareProjectCode(a,b){
  return String(a.project_code || "").localeCompare(String(b.project_code || ""), "zh-Hans-CN", { numeric:true });
}

function sortDormTaskRows(rows,tabKey){
  const list = rows.slice();

  if(tabKey === "vocal_submit"){
    return list.sort((a,b) => {
      const diff = Number(a.unsubmitted_count || 999999) - Number(b.unsubmitted_count || 999999);
      return diff || compareProjectCode(a,b);
    });
  }

  if(tabKey === "mix_submit"){
    return list.sort((a,b) => {
      const ad = a.release_date || "";
      const bd = b.release_date || "";
      if(ad && bd && ad !== bd) return ad.localeCompare(bd);
      if(ad && !bd) return -1;
      if(!ad && bd) return 1;
      return compareProjectCode(a,b);
    });
  }

  if(tabKey === "claim"){
    return list.sort((a,b) => {
      const ag = a.task_type === "singer_claim" || a.task_type === "singer_claimed" ? 1 : 2;
      const bg = b.task_type === "singer_claim" || b.task_type === "singer_claimed" ? 1 : 2;
      if(ag !== bg) return ag - bg;

      const diff = Number(b.singer_count || 0) - Number(a.singer_count || 0);
      return diff || compareProjectCode(a,b);
    });
  }

  return list;
}

function mergedDormTaskRows(){
  const recentRows = Array.from(recentDormTaskActions.values());
  const recentIds = new Set(recentRows.map(item => String(item.project_id)));
  const normalRows = (Array.isArray(dormTaskRows) ? dormTaskRows : []).filter(item => !recentIds.has(String(item.project_id)));
  return recentRows.concat(normalRows);
}

function updateDormTaskTabs(rows){
  const counts = { vocal_submit:0, mix_submit:0, claim:0 };
  rows.forEach(item => {
    const key = taskTabKey(item.task_type);
    if(Object.prototype.hasOwnProperty.call(counts,key)) counts[key] += 1;
  });

  document.querySelectorAll(".taskTab").forEach(btn => {
    const key = btn.dataset.taskTab;
    btn.classList.toggle("active", key === activeDormTaskTab);
    const badge = btn.querySelector("span:last-child");
    if(badge) badge.textContent = String(counts[key] || 0);
  });
}

function normalizeDormTaskRows(rows){
  return (Array.isArray(rows) ? rows : []).map(row => {
    const item = { ...row };

    item.project_id = firstTaskText(item,["project_id","id","projectId","project_code"]);
    item.project_code = firstTaskText(item,["project_code","code","project_no","project_number"]);
    item.project_name = firstTaskText(item,["project_name","name","title","song_name","work_name"]);
    item.project_tone = firstTaskText(item,["project_tone","tone","key","song_key"]);
    item.release_date = firstTaskText(item,["release_date","project_release_date","scheduled_release_date","publish_date","publish_at","scheduled_at","release_at"]);
    item.my_original_names = firstTaskText(item,["my_original_names","my_original_name","assigned_original_names","assigned_original_name","original_names","original_name","part_names","part_name","my_part_names","my_part_name"]);

    return item;
  }).filter(item => item.project_id || item.project_code || item.project_name);
}

function renderDormTasks(rows){
  const list = document.getElementById("taskList");
  if(!list) return;

  const allRows = mergedDormTaskRows();
  updateDormTaskTabs(allRows);

  if(!allRows.length){
    list.innerHTML = `
      <div class="taskCard">
        <h3 class="taskCardTitle">${tHtml("tasks.empty_by_type", { type:t("tasks.title") })}</h3>
      </div>
    `;
    return;
  }

  const currentRows = sortDormTaskRows(
    allRows.filter(item => taskTabKey(item.task_type) === activeDormTaskTab),
    activeDormTaskTab
  );

  if(!currentRows.length){
    list.innerHTML = `<div class="emptyText">${tHtml("tasks.empty_by_type", { type:taskTypeLabel(activeDormTaskTab) })}</div>`;
    return;
  }

  list.innerHTML = currentRows.map(taskCardHtml).join("");
}

async function loadDormTasks(){
  const list = document.getElementById("taskList");
  if(!list) return;

  if(!authState.memberId || !authState.memberCode){
    updateDormTaskTabs([]);
    list.innerHTML = `<div class="errorText">${tHtml("tasks.login_required")}</div>`;
    return;
  }

  list.innerHTML = '<div class="emptyText" data-text-key="tasks.loading"></div>';

  try{
    const { data,error } = await supabaseClient.rpc("get_dorm_work_tasks",{
      p_member_id:authState.memberId,
      p_member_code:authState.memberCode
    });

    if(error) throw error;

    dormTaskRows = normalizeDormTaskRows(Array.isArray(data) ? data : []);
    renderDormTasks(dormTaskRows);
  }catch(error){
    console.error(error);
    list.innerHTML = `<div class="errorText">${tHtml("tasks.read_failed")}：${escapeHtml(error.message || "get_dorm_work_tasks")}</div>`;
  }
}

function findDormTask(projectId){
  return dormTaskRows.find(item => String(item.project_id) === String(projectId))
    || recentDormTaskActions.get(String(projectId))
    || null;
}

async function runDormTaskAction(action,projectId){
  if(!action || !projectId) return;

  const task = findDormTask(projectId);
  const fnMap = {
    submit_vocal:"submit_dorm_vocal",
    undo_vocal:"undo_dorm_vocal_submit",
    submit_mix:"submit_dorm_mix",
    undo_mix:"undo_dorm_mix_submit",
    claim_singer:"claim_dorm_singer",
    claim_mix:"claim_dorm_mix"
  };

  const fn = fnMap[action];
  if(!fn) return;

  try{
    const { data,error } = await supabaseClient.rpc(fn,{
      p_member_id:authState.memberId,
      p_member_code:authState.memberCode,
      p_project_id:projectId
    });

    if(error) throw error;

    const result = Array.isArray(data) ? data[0] : data;
    if(!result || result.ok !== true){
      alert(result?.message || t("tasks.action_failed"));
      await loadDormTasks();
      return;
    }

    if(action === "submit_vocal" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"vocal_submitted",
        my_singer_submitted:true
      });
    }

    if(action === "submit_mix" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"mix_submitted",
        producer_completed:true
      });
    }

    if(action === "claim_singer" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"singer_claimed",
        singer_count:Number(task.singer_count || 0) + 1,
        missing_singer_count:Math.max(Number(task.missing_singer_count || 0) - 1, 0)
      });
    }

    if(action === "claim_mix" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"mix_claimed",
        producer_member_id:authState.memberId,
        producer_nickname:authState.nickname
      });
    }

    if(action === "undo_vocal" || action === "undo_mix"){
      recentDormTaskActions.delete(String(projectId));
    }

    await loadDormTasks();
  }catch(error){
    console.error(error);
    alert(`${t("tasks.rpc_failed")}：${error.message || fn}`);
    await loadDormTasks();
  }
}

function bindDormTaskActions(){
  const list = document.getElementById("taskList");
  if(list){
    list.addEventListener("click", event => {
      const btn = event.target.closest(".dormTaskActionBtn");
      if(!btn) return;

      event.preventDefault();
      event.stopPropagation();

      const action = btn.dataset.action;
      const projectId = btn.dataset.projectId;
      runDormTaskAction(action,projectId);
    });
  }

  const tabs = document.getElementById("taskTabs");
  if(tabs){
    tabs.addEventListener("click", event => {
      const btn = event.target.closest(".taskTab");
      if(!btn) return;

      activeDormTaskTab = btn.dataset.taskTab || "vocal_submit";
      renderDormTasks(dormTaskRows);
    });
  }
}

async function loadGoldLedger(memberId){
  const { data,error } = await supabaseClient
    .from("gold_ledger")
    .select("direction,amount,category,subcategory,note,created_at")
    .eq("member_id",memberId)
    .order("created_at",{ ascending:false })
    .limit(30);

  if(error){
    console.error(error);
    setLedgerMessage(`${t("wallet.ledger_read_failed")}：${error.message || "gold_ledger"}`, true);
    return;
  }

  if(!data || !data.length){
    setLedgerMessage(t("wallet.ledger_empty"));
    setText("todayGold","0");
    return;
  }

  const todayIncome = data
    .filter(item => item.direction === "in" && isToday(item.created_at))
    .reduce((sum,item) => sum + Number(item.amount || 0),0);

  const todayEl = document.getElementById("todayGold");
  if(todayEl){
    todayEl.textContent = todayIncome > 0 ? `+${todayIncome}` : "0";
    todayEl.className = todayIncome > 0 ? "statValue todayValue income" : "statValue todayValue none";
  }

  const list = document.getElementById("ledgerList");
  list.innerHTML = data.map(item => {
    const isIn = item.direction === "in";
    const sign = isIn ? "+" : "-";
    const title = ledgerLabel(item);
    const cleanedNote = cleanGoldLedgerNote(item.note);
    const note = cleanedNote && cleanedNote !== title ? cleanedNote : "";

    return `
      <div class="ledgerItem">
        <div class="ledgerArrow ${isIn ? "in" : "out"}">${ledgerIconHtml(isIn)}</div>
        <div>
          <strong>${escapeHtml(title)}</strong>
          <div class="ledgerMeta">
            ${escapeHtml(formatDate(item.created_at))}
            ${note ? `｜${escapeHtml(note)}` : ""}
          </div>
        </div>
        <div class="ledgerAmount ${isIn ? "in" : "out"}">
          ${sign}${Number(item.amount || 0)}
        </div>
      </div>
    `;
  }).join("");
}

function openCollectionBook(){

function collectionBookCardHtml(){
