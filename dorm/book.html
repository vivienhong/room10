<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜收集图鉴</title>
<!-- book clean db-driven v3: 固定素材走 room10-paths.js；图鉴分类/页面文案走数据库；个人图鉴状态统一使用 member_id + member_code 安全 RPC；清减旧缓存兼容读取 -->
<script src="../room10-paths.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{ box-sizing:border-box; }
:root{
  --ink:#704721;
  --book-scale:1;
  --book-left-grid-left:16.89%;
  --book-left-grid-top:28.89%;
  --book-left-grid-width:30.2%;
  --book-left-grid-height:54.0%;
  --book-left-grid-row-gap:3.85%;
  --book-left-grid-column-gap:3.0%;
  --book-left-card-base-height:86px;
  --book-right-grid-left:52.62%;
  --book-right-grid-top:28.89%;
  --book-right-grid-width:33.7%;
  --book-right-grid-height:25.1%;
  --book-right-grid-row-gap:8.0%;
  --book-right-grid-column-gap:3.0%;
  --book-right-card-base-height:86px;
}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  background:
    linear-gradient(rgba(255,248,238,.14), rgba(255,248,238,.24)),
    var(--book-body-bg, none) center center / cover no-repeat fixed;
}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  overflow:hidden;
}
button{ font-family:inherit; }

/* =========================================================
   图鉴弹窗：四角定位基准
   所有内容、按钮、标签都只绑定 .bookOverlayLayer，也就是底图实际显示区域。
========================================================= */
.collectionBookModal{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  background:rgba(67,45,26,.10);
  backdrop-filter:blur(1.5px);
  -webkit-backdrop-filter:blur(1.5px);
}
.collectionBookModal.show{ display:flex; }

.bookStage{
  position:relative;
  width:min(1180px,100vw,calc(100dvh * 1448 / 1086));
  aspect-ratio:1448 / 1086;
  max-height:100dvh;
  filter:drop-shadow(0 22px 42px rgba(68,45,24,.22));
}
.bookBg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}
.bookOverlayLayer{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
}
.bookOverlayLayer *{ pointer-events:auto; }

.bookLeftPanel,
.bookLeftGridPanel,
.bookGridPanel,
.bookTags,
.bookControl{
  position:absolute;
}

/* 左页信息区：按 book-open.png 四角定位 */
.bookPageHeading{
  position:absolute;
  left:24.58%;
  top:15.93%;
  width:21.2%;
  margin:0;
  font-size:calc(29px * var(--book-scale));
  line-height:1.08;
  font-weight:900;
  letter-spacing:.04em;
  color:#6d431f;
  text-align:left;
  z-index:4;
}

.bookLeftPanel{
  left:55.20%;
  top:60.20%;
  width:23.0%;
  height:10.4%;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:0;
  overflow:hidden;
}

/* 左页收集格：按 book-open.png 四角定位 */
.bookLeftGridPanel{
  left:var(--book-left-grid-left)!important;
  top:var(--book-left-grid-top)!important;
  width:var(--book-left-grid-width)!important;
  height:var(--book-left-grid-height)!important;
  overflow:hidden;
}

.leftItemGrid{
  grid-template-columns:repeat(4,minmax(0,1fr));
  column-gap:var(--book-left-grid-column-gap)!important;
  row-gap:var(--book-left-grid-row-gap)!important;
  justify-content:stretch;
  align-content:start;
  padding:0 1.0%;
}

.leftItemGrid .itemCard{
  height:calc(var(--book-left-card-base-height) * var(--book-scale));
  min-height:calc(var(--book-left-card-base-height) * var(--book-scale));
  padding:calc(7px * var(--book-scale)) calc(5px * var(--book-scale));
}

.leftItemGrid .itemIcon{
  width:calc(36px * var(--book-scale));
  height:calc(36px * var(--book-scale));
  border-radius:calc(12px * var(--book-scale));
  font-size:calc(23px * var(--book-scale));
}

.leftItemGrid .itemName{
  font-size:calc(11px * var(--book-scale));
}

.gridSpacer{
  min-width:0;
  height:calc(var(--book-left-card-base-height) * var(--book-scale));
  min-height:calc(var(--book-left-card-base-height) * var(--book-scale));
  visibility:hidden;
  pointer-events:none;
}

/* 右页物品区：按 book-open.png 四角定位 */
.bookGridPanel{
  left:var(--book-right-grid-left)!important;
  top:var(--book-right-grid-top)!important;
  width:var(--book-right-grid-width)!important;
  height:var(--book-right-grid-height)!important;
  overflow:hidden;
}

.rightItemGrid{
  column-gap:var(--book-right-grid-column-gap)!important;
  row-gap:var(--book-right-grid-row-gap)!important;
}

.rightItemGrid .itemCard{
  height:calc(var(--book-right-card-base-height) * var(--book-scale));
  min-height:calc(var(--book-right-card-base-height) * var(--book-scale));
}

.progressCard{
  border:1px solid rgba(171,116,64,.16);
  background:rgba(255,251,242,.50);
  border-radius:calc(14px * var(--book-scale));
  padding:calc(6px * var(--book-scale)) calc(12px * var(--book-scale)) calc(7px * var(--book-scale));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
  text-align:left;
}
.progressLabel{ font-size:calc(13px * var(--book-scale)); font-weight:900; color:#8a613e; margin-bottom:6px; }
.progressText{ font-size:calc(22px * var(--book-scale)); font-weight:900; color:#6c4220; }
.progressBar{ margin-top:calc(8px * var(--book-scale)); height:calc(8px * var(--book-scale)); border-radius:99px; background:rgba(202,151,91,.18); overflow:hidden; }
.progressFill{ height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,#c98c4f,#e7bd7b); }
.bookNote{
  position:absolute;
  left:15.40%;
  top:22.30%;
  width:29.7%;
  min-height:4.2%;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 .8%;
  font-size:calc(12px * var(--book-scale));
  line-height:1.45;
  color:#8d6748;
  font-weight:800;
  text-align:center;
  z-index:4;
  pointer-events:none;
}
.bookTotalProgress{
  position:absolute;
  left:54.30%;
  top:74.90%;
  width:17.8%;
  min-height:4.1%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 .5%;
  font-size:calc(13px * var(--book-scale));
  line-height:1.1;
  color:#805633;
  font-weight:900;
  text-align:center;
  z-index:4;
  pointer-events:none;
}
.mobileTabs{ display:none; }

.itemGrid{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  column-gap:2.8%;
  row-gap:8.0%;
  align-content:start;
  overflow:hidden;
  padding:0 1.0%;
  scrollbar-width:thin;
  scrollbar-color:rgba(166,109,55,.28) transparent;
}
.itemCard{
  min-width:0;
  min-height:calc(92px * var(--book-scale));
  border-radius:calc(16px * var(--book-scale));
  padding:calc(4px * var(--book-scale)) calc(3px * var(--book-scale));
  background:rgba(255,251,244,.62);
  border:1px solid rgba(178,121,64,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65), 0 6px 12px rgba(106,68,34,.06);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:calc(5px * var(--book-scale));
  text-align:center;
}
.itemIcon{
  width:calc(56px * var(--book-scale));
  height:calc(56px * var(--book-scale));
  border-radius:calc(14px * var(--book-scale));
  display:grid;
  place-items:center;
  font-size:calc(26px * var(--book-scale));
  background:rgba(255,246,228,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}
.itemIcon img{
  width:92%;
  height:92%;
  object-fit:contain;
  display:block;
}
.itemName{
  max-width:100%;
  color:#6f4726;
  font-size:calc(12px * var(--book-scale));
  line-height:1.25;
  font-weight:900;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.itemCard.locked{ opacity:.68; filter:saturate(.55); }
.itemCard.locked .itemIcon{ color:#a9896b; background:rgba(230,214,195,.52); font-size:calc(30px * var(--book-scale)); }
.emptySpecial{
  grid-column:1 / -1;
  min-height:calc(220px * var(--book-scale));
  border-radius:calc(20px * var(--book-scale));
  background:rgba(255,251,244,.52);
  border:1px dashed rgba(178,121,64,.22);
  display:grid;
  place-items:center;
  text-align:center;
  color:#8f6848;
  font-size:calc(16px * var(--book-scale));
  font-weight:900;
  line-height:1.8;
}

/* 电脑版右侧标签：文字位置与点击范围分离 */
.bookTags{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:5;
  pointer-events:none;
}
.tagText{
  position:absolute;
  width:5.6%;
  height:9.2%;
  color:rgba(111,71,38,.82);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:3px 2px 3px 8px;
  letter-spacing:.03em;
  font-size:calc(13px * var(--book-scale));
  font-weight:900;
  line-height:1.05;
  text-align:center;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 1px 0 rgba(255,255,255,.42);
}
.tagFestival{ left:90.72%; top:20.89%; }
.tagMaterial{ left:91.02%; top:33.37%; }
.tagPet{ left:91.50%; top:45.17%; }

.tagHit{
  appearance:none;
  border:0;
  cursor:pointer;
  position:absolute;
  background:rgba(255,90,70,0);
  border-radius:calc(18px * var(--book-scale)) 999px 999px calc(18px * var(--book-scale));
  pointer-events:auto;
}
.tagFestivalRange{ left:91.50%; top:23.46%; width:7.77%; height:11.20%; }
.tagMaterialRange{ left:92.40%; top:35.79%; width:7.77%; height:11.20%; }
.tagPetRange{ left:92.47%; top:47.81%; width:7.77%; height:11.20%; }

.tagHit:hover ~ .tagText,
.tagHit.active ~ .tagText{ text-shadow:0 1px 0 rgba(255,255,255,.72); }
.tagFestivalRange:hover ~ .tagFestival,
.tagFestivalRange.active ~ .tagFestival,
.tagMaterialRange:hover ~ .tagMaterial,
.tagMaterialRange.active ~ .tagMaterial,
.tagPetRange:hover ~ .tagPet,
.tagPetRange.active ~ .tagPet{
  color:rgba(111,71,38,1);
}

.bookControl{
  appearance:none;
  border:0;
  background:transparent;
  z-index:8;
  cursor:pointer;
  padding:0;
  display:grid;
  place-items:center;
  transition:transform .16s ease, filter .16s ease;
}
.bookControl:hover{ transform:translateY(calc(-2px * var(--book-scale))); filter:brightness(1.04); }
.bookControl img{ width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }

.otherCategoryBtn{
  position:absolute;
  left:20.19%;
  top:82.90%;
  width:6.42%;
  height:4.89%;
  z-index:7;
  appearance:none;
  border:0;
  background:transparent;
  color:rgba(111,71,38,.92);
  font-size:calc(13.5px * var(--book-scale));
  font-weight:900;
  letter-spacing:.04em;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  text-shadow:0 1px 0 rgba(255,255,255,.62);
}
.otherCategoryBtn:hover,
.otherCategoryBtn.active{
  color:#6d431f;
  text-shadow:0 1px 0 rgba(255,255,255,.85);
}

/* 控制按钮全部按底图百分比定位，不用 fixed/bottom/right */
.closeBtn{ left:81.82%; top:12.53%; width:8.57%; 
  height:11.43%;}
.prevBtn{ left:13.75%; top:72.30%; width:10.60%; 
  height:10.60%;}
.nextBtn{ left:78.92%; top:73.09%; width:10.60%; 
  height:10.60%;}
.gachaBtn{
  left:66.13%;
  top:14.11%;
  width:8.80%;
  border-radius:999px;
  background:rgba(255,246,221,.42);
  box-shadow:0 0 0 2px rgba(255,255,255,.55), 0 0 14px rgba(199,139,75,.42);

  height:11.73%;}
.gachaBtn img{ filter:drop-shadow(0 4px 8px rgba(110,70,34,.28)); }
.gachaBtn.is-hidden{ display:none; }

.itemCard.is-previewable{ cursor:zoom-in; }
.imagePreviewModal{
  position:fixed;
  inset:0;
  z-index:900;
  display:none;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:rgba(58,38,22,.34);
}
.imagePreviewModal.show{ display:flex; }
.imagePreviewCard{
  width:min(360px,88vw);
  border-radius:26px;
  padding:24px 22px 20px;
  text-align:center;
  background:rgba(255,249,239,.97);
  border:1px solid rgba(198,140,75,.25);
  box-shadow:0 18px 42px rgba(81,52,27,.22), inset 0 1px 0 rgba(255,255,255,.8);
}
.imagePreviewCard img{
  width:min(220px,58vw);
  height:min(220px,58vw);
  object-fit:contain;
  display:block;
  margin:0 auto 12px;
  filter:drop-shadow(0 8px 16px rgba(110,70,34,.18));
}
.imagePreviewTitle{
  color:#704721;
  font-size:18px;
  font-weight:900;
  line-height:1.25;
  margin-bottom:14px;
}
.imagePreviewClose{
  appearance:none;
  border:0;
  cursor:pointer;
  border-radius:999px;
  padding:9px 24px;
  background:#c98c4f;
  color:#fff9f2;
  font-weight:900;
}



body.gachaPopupOpen{
  overflow:hidden;
}

.gachaPopupModal{
  position:fixed;
  inset:0;
  z-index:860;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,246,230,.20), transparent 34%),
    rgba(67,45,26,.26);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.gachaPopupModal.show{
  display:flex;
}
.gachaPopupStage{
  position:relative;
  width:min(520px, 92vw);
  height:min(730px, 88vh);
  border-radius:30px;
  padding:10px;
  background:
    radial-gradient(circle at 18% 14%, rgba(255,255,255,.70), transparent 34%),
    linear-gradient(180deg, rgba(255,251,244,.96), rgba(247,232,211,.92));
  border:1px solid rgba(184,127,69,.24);
  box-shadow:
    0 26px 58px rgba(74,49,26,.28),
    inset 0 1px 0 rgba(255,255,255,.86);
  overflow:hidden;
}
.gachaPopupStage::before,
.gachaPopupStage::after{
  content:"";
  position:absolute;
  pointer-events:none;
  border-radius:999px;
}
.gachaPopupStage::before{
  left:18px;
  top:16px;
  width:138px;
  height:72px;
  background:rgba(255,240,210,.42);
  filter:blur(18px);
}
.gachaPopupStage::after{
  right:18px;
  bottom:16px;
  width:160px;
  height:86px;
  background:rgba(222,188,145,.24);
  filter:blur(20px);
}
.gachaPopupInner{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  border-radius:22px;
  overflow:hidden;
  background:rgba(255,250,242,.62);
  border:1px solid rgba(180,126,73,.16);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.76),
    0 8px 18px rgba(108,70,34,.07);
}
.gachaPopupInner iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:transparent;
}
.gachaPopupClose{
  position:absolute;
  z-index:5;
  top:8px;
  right:8px;
  width:40px;
  height:40px;
  border:0;
  border-radius:999px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  background:rgba(255,249,239,.94);
  color:#76502f;
  font-size:24px;
  line-height:1;
  font-weight:900;
  box-shadow:
    0 8px 18px rgba(86,57,31,.16),
    inset 0 1px 0 rgba(255,255,255,.92);
  border:1px solid rgba(184,127,69,.20);
}
.gachaPopupClose:hover{
  transform:translateY(-1px);
  filter:brightness(1.02);
}

@media (max-width:540px){
  .gachaPopupModal{
    padding:8px;
  }
  .gachaPopupStage{
    width:min(430px, 96vw);
    height:min(92vh, 92dvh);
    border-radius:22px;
    padding:7px;
  }
  .gachaPopupInner{
    border-radius:17px;
  }
  .gachaPopupClose{
    top:6px;
    right:6px;
    width:36px;
    height:36px;
    font-size:22px;
  }
}

@media (max-width:540px){
  body{ padding:0; align-items:center; overflow:hidden; }
  .collectionBookModal{ padding:calc(8px * var(--book-scale)); align-items:center; }
  .bookStage{
    width:min(96vw,500px,calc(95vh * 941 / 1672));
    aspect-ratio:941 / 1672;
    max-height:95vh;
  }
  .bookBg{ content:normal; }
  .bookPageHeading{
    left:25.15%;
    top:13.84%;

    height:3.28%;

  }
  .bookLeftPanel{
    left:20.49%;
    top:18.40%;
    width:62.0%;
    height:18.2%;

    gap:calc(7px * var(--book-scale));
  }
  .bookLeftGridPanel{ display:none!important; }
  .bookGridPanel{
    left:19.47%!important;

  }
  .rightItemGrid{
    column-gap:calc(7px * var(--book-scale))!important;

  }
  .progressCard{ padding:calc(8px * var(--book-scale)) calc(10px * var(--book-scale)); border-radius:calc(14px * var(--book-scale)); }
  .progressLabel{ display:none; }
  .progressText{ font-size:calc(16px * var(--book-scale)); }
  .progressBar{ height:calc(7px * var(--book-scale)); margin-top:calc(6px * var(--book-scale)); }
  .bookNote{ display:none; }
  .bookTotalProgress{
    display:flex;
    left:30.00%;
    top:85.18%;
    width:42.00%;
    min-height:3.20%;
    height:3.20%;
    padding:0 .5%;
    font-size:calc(10px * var(--book-scale));
    line-height:1.05;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:6;
    white-space:nowrap;
  }
  .mobileTabs{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:calc(5px * var(--book-scale));
    margin-top:calc(2px * var(--book-scale));
  }
  .mobileTab{
    appearance:none;
    border:1px solid rgba(178,121,64,.15);
    border-radius:999px;
    padding:calc(6px * var(--book-scale)) calc(4px * var(--book-scale));
    background:rgba(255,250,238,.66);
    color:#7b512b;
    font-size:calc(15px * var(--book-scale));
    font-weight:900;
    cursor:pointer;
  }
  .mobileTab.active{ background:rgba(232,194,135,.72); }
  .itemGrid{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:calc(7px * var(--book-scale)); padding:0 calc(1px * var(--book-scale)) calc(18px * var(--book-scale)) 0; }
  .itemCard{ min-height:calc(78px * var(--book-scale)); border-radius:calc(13px * var(--book-scale)); padding:calc(6px * var(--book-scale)) calc(4px * var(--book-scale)); }
  .itemIcon{ width:calc(46px * var(--book-scale)); height:calc(46px * var(--book-scale)); border-radius:calc(11px * var(--book-scale)); font-size:calc(22px * var(--book-scale)); }
   .itemIcon img{ width:92%; height:92%; }
  .itemName{ font-size:calc(10.5px * var(--book-scale)); }
  .emptySpecial{ min-height:calc(250px * var(--book-scale)); font-size:calc(14px * var(--book-scale)); }
  .bookTags{ display:none; }
  .otherCategoryBtn{ display:none; }

  .closeBtn{
    left:66.77%;
    top:10.09%;
    width:14.80%;
    height:8.33%;
    aspect-ratio:auto;
  }
  .prevBtn,
  .nextBtn{
    top:35.2%;

<script>
const SUPABASE_URL = "https://tfevitwoqmxwaguvtyms.supabase.co";
const SUPABASE_KEY = "sb_publishable_0cFYhwx_9uEcrXnMJzzNMQ_cEng8xmI";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.room10Supabase = supabaseClient;

const ROOM10_ROOT_PREFIX = window.ROOM10_ROOT || "../";

function room10Url(path){
  const raw = String(path || "").trim();
  if(!raw) return "";
  if(/^(https?:|data:|blob:|mailto:|tel:|#|\/)/i.test(raw)) return raw;
  if(raw.startsWith("./") || raw.startsWith("../")) return raw;
  if(typeof window.room10Path === "function") return window.room10Path(raw);
  return `${ROOM10_ROOT_PREFIX}${raw}`;
}

function room10PageUrl(key){
  const pageKey = String(key || "").trim();
  if(pageKey && typeof window.room10Page === "function"){
    const url = window.room10Page(pageKey);
    if(url) return url;
  }
  throw new Error(`收集图鉴页面路径配置缺失：${pageKey || "empty page key"}`);
}

function room10AssetUrl(keyPath, fallbackPath = ""){
  const assetKey = String(keyPath || "").trim();
  if(assetKey && typeof window.room10Asset === "function"){
    const url = window.room10Asset(assetKey);
    if(url) return url;
  }
  return fallbackPath ? room10Url(fallbackPath) : "";
}

function requireBookAssetUrl(keyPath){
  const assetKey = String(keyPath || "").trim();
  const url = room10AssetUrl(assetKey);
  if(!url){
    throw new Error(`收集图鉴固定素材配置缺失：${assetKey || "empty asset key"}`);
  }
  return url;
}

const BOOK_REQUIRED_TEXT_KEYS = [
  "book.document_title",
  "book.dialog_aria",
  "book.progress_label",
  "book.category_progress_loading",
  "book.category_progress_closed",
  "book.total_progress_template",
  "book.total_progress_loading",
  "book.total_progress_empty",
  "book.loading",
  "book.read_failed",
  "book.empty_html",
  "book.locked_placeholder",
  "book.locked_icon_placeholder",
  "book.tags_aria",
  "book.close_aria",
  "book.prev_aria",
  "book.next_aria",
  "book.prev_mobile_label",
  "book.next_mobile_label",
  "book.gacha_aria",
  "book.preview_default_title",
  "book.preview_default_alt",
  "book.preview_close",
  "book.gacha_popup_aria",
  "book.gacha_popup_close_aria",
  "book.gacha_popup_close_text",
  "book.gacha_iframe_title",
  "book.config.categories_json"
];

const bookTexts = {};
let CATEGORY_META = [];

function t(key){
  return Object.prototype.hasOwnProperty.call(bookTexts, key) ? String(bookTexts[key] ?? "") : "";
}

function tHtml(key){
  return escapeHtml(t(key));
}

function formatTemplate(value, params = {}){
  return String(value ?? "").replace(/\{([a-zA-Z0-9_]+)\}/g, (_, key) => {
    return Object.prototype.hasOwnProperty.call(params, key) ? String(params[key]) : "";
  });
}

function parseBookJsonText(key){
  const raw = String(bookTexts[key] || "").trim();
  try{
    return JSON.parse(raw);
  }catch(error){
    throw new Error(`收集图鉴数据库配置不是有效 JSON：${key}`);
  }
}

function loadBookConfigFromTexts(){
  const categories = parseBookJsonText("book.config.categories_json");
  if(!Array.isArray(categories) || !categories.length){
    throw new Error("收集图鉴数据库配置缺失：book.config.categories_json");
  }

  CATEGORY_META = categories.map(item => ({
    key:String(item?.key || "").trim(),
    title:String(item?.title || "").trim(),
    shortTitle:String(item?.shortTitle || item?.title || "").trim(),
    note:String(item?.note || "").trim()
  })).filter(item => item.key && item.title);

  if(!CATEGORY_META.length){
    throw new Error("收集图鉴数据库配置无有效分类：book.config.categories_json");
  }
}

async function loadBookPageTexts(){
  const { data, error } = await supabaseClient
    .from("room10_page_texts")
    .select("text_key,text_value")
    .eq("page_key", "book")
    .eq("is_active", true);

  if(error) throw error;

  (data || []).forEach(row => {
    bookTexts[row.text_key] = row.text_value;
  });

  const missing = BOOK_REQUIRED_TEXT_KEYS.filter(key => !Object.prototype.hasOwnProperty.call(bookTexts, key));
  if(missing.length){
    throw new Error(`收集图鉴文案配置缺失：${missing.join(", ")}`);
  }

  loadBookConfigFromTexts();
}

const STORAGE_KEYS = {
  loggedIn:"room10LoggedIn",
  user:"room10User",
  role:"room10Role",
  memberId:"room10MemberId",
  memberCode:"room10MemberCode"
};

let categories = [];
let currentCategory = 0;
let currentBookPage = 0;
let isLoadingBookData = false;
let bookLoadError = "";

const root = document.documentElement;
const bookStageEl = document.querySelector(".bookStage");
const bookBg = document.getElementById("bookBg");
const bookDialog = document.getElementById("bookDialog");
const progressLabel = document.getElementById("progressLabel");

function syncBookScale(){
  const stageWidth = bookStageEl?.getBoundingClientRect().width || 0;

  /*
    图鉴有电脑 / 手机两套不同底图与定位：
    - 电脑：book-open.png，当前设计最大宽度 1180
    - 手机：book-open2.png，当前设计最大宽度 500
    两套都按同一规则缩放：当前书本实际宽度 / 当前版本设计宽度。
  */
  const baseWidth = isMobileLayout() ? 500 : 1180;
  const safeWidth = stageWidth || baseWidth;
  const scale = Math.max(0.36, Math.min(1, safeWidth / baseWidth));

  root.style.setProperty("--book-scale", String(scale));
}

const modal = document.getElementById("collectionBookModal");
const gachaPopupModal = document.getElementById("gachaPopupModal");
const gachaPopupFrame = document.getElementById("gachaPopupFrame");
const bookTitle = document.getElementById("bookTitle");
const categoryProgress = document.getElementById("categoryProgress");
const categoryProgressFill = document.getElementById("categoryProgressFill");
const bookNote = document.getElementById("bookNote");
const totalProgress = document.getElementById("totalProgress");
const itemGrid = document.getElementById("itemGrid");
const leftItemGrid = document.getElementById("leftItemGrid");
const mobileTabs = document.getElementById("mobileTabs");

function unlockedCount(items){ return items.filter(item => item.isUnlocked).length; }
function totalUnlocked(){ return categories.reduce((sum,category) => sum + unlockedCount(category.items), 0); }
function totalItems(){ return categories.reduce((sum,category) => sum + category.items.length, 0); }
function isMobileLayout(){ return window.matchMedia("(max-width:540px)").matches; }
function perBookPage(){ return isMobileLayout() ? 12 : 22; }
function categoryPageCount(category){
  return Math.max(1, Math.ceil(category.items.length / perBookPage()));
}
function currentCategoryData(){
  return categories[currentCategory] || categories[0] || { key:"", title:"", shortTitle:"", note:"", items:[] };
}
function currentPageItems(category){
  const size = perBookPage();
  const start = currentBookPage * size;
  return category.items.slice(start, start + size);
}
function normalizeBookPage(){
  const count = categoryPageCount(currentCategoryData());
  currentBookPage = ((currentBookPage % count) + count) % count;
}
function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "\"":"&quot;",
    "'":"&#39;"
  }[char]));
}
function isImageIcon(icon){
  return /\.(png|jpe?g|webp|gif|svg)(\?.*)?$/i.test(String(icon || ""));
}

function isAssetKey(value){
  return /^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$/.test(String(value || "").trim());
}

function isDatabaseImageIcon(icon){
  const raw = String(icon || "").trim();
  if(!raw) return false;
  return isImageIcon(raw) || isAssetKey(raw) || /^(https?:|data:|blob:|\/)/i.test(raw);
}

function uniquePaths(paths){
  const seen = new Set();
  return paths.filter(path => {
    const value = String(path || "").trim();
    if(!value || seen.has(value)) return false;
    seen.add(value);
    return true;
  });
}

function resolveBookIconPath(item){
  const icon = String(item?.icon || "").trim();
  if(!icon || !isDatabaseImageIcon(icon)) return icon;

  if(/^(https?:|data:|blob:|\/)/i.test(icon)){
    return icon;
  }

  if(isAssetKey(icon)){
    return room10AssetUrl(icon);
  }

  if(icon.startsWith("../") || icon.startsWith("./")){
    return icon;
  }

  return room10Url(icon);
}

function getBookIconFallbackPaths(item){
  const icon = String(item?.icon || "").trim();
  if(!icon || !isDatabaseImageIcon(icon)) return [];

  if(isAssetKey(icon)){
    return [];
  }

  const resolved = resolveBookIconPath(item);
  return uniquePaths([
    resolved,
    icon,
    icon.replace(/^\.\//, "")
  ]).filter(path => path !== resolved);
}

function handleBookIconError(img){
  if(!img) return;

  const fallbacks = String(img.dataset.fallbacks || "")
    .split("|")
    .map(value => value.trim())
    .filter(Boolean);
  const currentIndex = Number(img.dataset.fallbackIndex || 0);

  if(currentIndex < fallbacks.length){
    img.dataset.fallbackIndex = String(currentIndex + 1);
    img.src = fallbacks[currentIndex];
    return;
  }

  const box = img.closest(".itemIcon");
  if(box){
    box.textContent = "?";
  }
}

function renderIcon(item){
  const icon = item?.icon || "";
  if(!icon) return "?";
  if(isDatabaseImageIcon(icon)){
    const resolvedIcon = resolveBookIconPath(item);
    const fallbacks = getBookIconFallbackPaths(item).filter(path => path !== resolvedIcon);
    const safeIcon = escapeHtml(resolvedIcon);
    const safeFallbacks = escapeHtml(fallbacks.join("|"));
    return `<img src="${safeIcon}" alt="" loading="lazy" data-fallbacks="${safeFallbacks}" data-fallback-index="0" onerror="handleBookIconError(this)">`;
  }
  return escapeHtml(icon);
}
function displayItemName(name){
  return String(name ?? "").replace(/徽章/g, "").trim();
}
function renderMobileTabs(){
  mobileTabs.innerHTML = (categories || []).map((category,index) =>
    `<button class="mobileTab ${index === currentCategory ? "active" : ""}" type="button" data-category="${index}">${escapeHtml(category.shortTitle || category.title)}</button>`
  ).join("");
}


function getCurrentMemberIdentity(){
  return {
    loggedIn:localStorage.getItem(STORAGE_KEYS.loggedIn) === "true",
    memberId:String(localStorage.getItem(STORAGE_KEYS.memberId) || "").trim(),
    memberCode:String(localStorage.getItem(STORAGE_KEYS.memberCode) || "").trim()
  };
}

function clearBookAuthCache(){
  Object.values(STORAGE_KEYS).forEach(key => localStorage.removeItem(key));
  localStorage.removeItem("room10_user");
  localStorage.removeItem("room10_current_user");
}

function requireBookMemberIdentity(){
  const identity = getCurrentMemberIdentity();
  if(!identity.loggedIn || !identity.memberId || !identity.memberCode){
    clearBookAuthCache();
    window.location.href = room10PageUrl("index");
    return null;
  }
  return identity;
}

function normalizeBookItem(row){
  return {
    key: row.item_key,
    name: row.item_name,
    category: row.item_category,
    bookCategory: row.book_category || "other",
    desc: row.item_desc || "",
    icon: row.item_icon || "",
    sortOrder: Number(row.sort_order || 0),
    isUnlocked: row.is_unlocked === true
  };
}

function buildCategoriesFromRows(rows){
  const grouped = new Map(CATEGORY_META.map(category => [category.key, []]));
  const fallbackKey = CATEGORY_META.some(category => category.key === "other") ? "other" : CATEGORY_META[0]?.key;

  (rows || []).forEach(row => {
    const item = normalizeBookItem(row);
    const key = grouped.has(item.bookCategory) ? item.bookCategory : fallbackKey;
    if(key && grouped.has(key)) grouped.get(key).push(item);
  });

  categories = CATEGORY_META.map(category => ({
    ...category,
    items:(grouped.get(category.key) || []).sort((a,b) =>
      (a.sortOrder - b.sortOrder) || String(a.key).localeCompare(String(b.key), "zh-Hans-CN")
    )
  }));
}

function applyBookAssets(){
  document.body.style.setProperty("--book-body-bg", `url("${requireBookAssetUrl("dorm.roomDorm")}")`);

  document.querySelectorAll("[data-asset-key]").forEach(img => {
    const key = img.getAttribute("data-asset-key");
    img.src = requireBookAssetUrl(key);
  });

  updateBookBackground();
}

function updateBookBackground(){
  if(!bookBg) return;
  const key = isMobileLayout() ? "dorm.bookOpen2" : "dorm.bookOpen";
  const url = requireBookAssetUrl(key);
  if(bookBg.getAttribute("src") !== url){
    bookBg.setAttribute("src", url);
  }
}

function applyBookStaticTexts(){
  document.title = t("book.document_title");
  if(bookDialog) bookDialog.setAttribute("aria-label", t("book.dialog_aria"));
  if(progressLabel) progressLabel.textContent = t("book.progress_label");

  const bookTags = document.getElementById("bookTags");
  if(bookTags) bookTags.setAttribute("aria-label", t("book.tags_aria"));

  const closeBookBtn = document.getElementById("closeBookBtn");
  const prevBookBtn = document.getElementById("prevBookBtn");
  const nextBookBtn = document.getElementById("nextBookBtn");
  const bookGachaBtn = document.getElementById("bookGachaBtn");
  if(closeBookBtn) closeBookBtn.setAttribute("aria-label", t("book.close_aria"));
  if(prevBookBtn){
    prevBookBtn.setAttribute("aria-label", t("book.prev_aria"));
    prevBookBtn.setAttribute("data-mobile-label", t("book.prev_mobile_label"));
  }
  if(nextBookBtn){
    nextBookBtn.setAttribute("aria-label", t("book.next_aria"));
    nextBookBtn.setAttribute("data-mobile-label", t("book.next_mobile_label"));
  }
  if(bookGachaBtn) bookGachaBtn.setAttribute("aria-label", t("book.gacha_aria"));

  const gachaDialog = document.getElementById("gachaPopupDialog");
  const gachaClose = document.getElementById("gachaPopupCloseBtn");
  if(gachaDialog) gachaDialog.setAttribute("aria-label", t("book.gacha_popup_aria"));
  if(gachaClose){
    gachaClose.setAttribute("aria-label", t("book.gacha_popup_close_aria"));
    gachaClose.textContent = t("book.gacha_popup_close_text");
  }
  if(gachaPopupFrame) gachaPopupFrame.setAttribute("title", t("book.gacha_iframe_title"));

  const previewClose = document.getElementById("imagePreviewCloseBtn");
  if(previewClose) previewClose.textContent = t("book.preview_close");

  renderCategoryControls();
}

function renderCategoryControls(){
  const desktopButtons = Array.from(document.querySelectorAll(".tagHit"));
  const desktopTexts = [
    document.querySelector(".tagFestival"),
    document.querySelector(".tagMaterial"),
    document.querySelector(".tagPet")
  ];

  desktopButtons.forEach((btn, index) => {
    const category = categories[index] || CATEGORY_META[index];
    if(!category){
      btn.classList.add("hidden");
      if(desktopTexts[index]) desktopTexts[index].textContent = "";
      return;
    }

    btn.classList.remove("hidden");
    btn.dataset.page = String(index);
    btn.title = category.title;
    btn.setAttribute("aria-label", category.title);
    if(desktopTexts[index]) desktopTexts[index].textContent = category.shortTitle || category.title;
  });

  const otherBtn = document.querySelector(".otherCategoryBtn");
  const otherCategory = categories[3] || CATEGORY_META[3];
  if(otherBtn){
    if(otherCategory){
      otherBtn.classList.remove("hidden");
      otherBtn.dataset.page = "3";
      otherBtn.title = otherCategory.title;
      otherBtn.textContent = otherCategory.shortTitle || otherCategory.title;
    }else{
      otherBtn.classList.add("hidden");
      otherBtn.textContent = "";
    }
  }
}

async function loadCollectionBookItems(options = {}){
  if(isLoadingBookData) return;

  const shouldKeepPosition = options.keepPosition === true;
  const oldCategory = currentCategory;
  const oldPage = currentBookPage;

  isLoadingBookData = true;
  bookLoadError = "";
  renderBook();

  try{
    const identity = requireBookMemberIdentity();
    if(!identity) return;

    const { data, error } = await supabaseClient.rpc("get_collection_book_items", {
      p_member_id:identity.memberId,
      p_member_code:identity.memberCode
    });
    if(error) throw error;

    buildCategoriesFromRows(data || []);

    if(shouldKeepPosition){
      currentCategory = Math.min(oldCategory, Math.max(0, categories.length - 1));
      currentBookPage = oldPage;
      normalizeBookPage();
    }else{
      currentBookPage = 0;
    }
  }catch(error){
    console.error("读取图鉴数据失败：", error);
    bookLoadError = `${t("book.read_failed")}${error?.message ? `：${error.message}` : ""}`;
  }finally{
    isLoadingBookData = false;
    renderBook();
  }
}

function renderBook(){
  syncBookScale();
  updateBookBackground();
  const category = currentCategoryData();
  normalizeBookPage();

  const unlocked = unlockedCount(category.items);
  const total = category.items.length;
  const visibleItems = currentPageItems(category);

  bookTitle.textContent = category.title;
  categoryProgress.textContent = total ? `${unlocked} / ${total}` : (isLoadingBookData ? t("book.category_progress_loading") : t("book.category_progress_closed"));
  categoryProgressFill.style.width = total ? `${Math.round(unlocked / total * 100)}%` : "0%";
  bookNote.textContent = bookLoadError || category.note;
  totalProgress.textContent = totalItems()
    ? formatTemplate(t("book.total_progress_template"), { unlocked:totalUnlocked(), total:totalItems() })
    : (isLoadingBookData ? t("book.total_progress_loading") : t("book.total_progress_empty"));

  const cardHtml = item => {
    const previewable = item.isUnlocked && isDatabaseImageIcon(item.icon);
    const safeKey = escapeHtml(item.key);
    const safeName = escapeHtml(displayItemName(item.name));
    const safeIcon = escapeHtml(resolveBookIconPath(item));
    return `
    <div class="itemCard ${item.isUnlocked ? "" : "locked"} ${previewable ? "is-previewable" : ""}" data-key="${safeKey}" data-preview-icon="${previewable ? safeIcon : ""}" data-preview-name="${previewable ? safeName : ""}">
      <div class="itemIcon">${item.isUnlocked ? renderIcon(item) : tHtml("book.locked_icon_placeholder")}</div>
      <div class="itemName">${item.isUnlocked ? safeName : tHtml("book.locked_placeholder")}</div>
    </div>`;
  };

  if(isLoadingBookData){
    leftItemGrid.innerHTML = "";
    itemGrid.innerHTML = `<div class="emptySpecial">${tHtml("book.loading")}</div>`;
  }else if(bookLoadError){
    leftItemGrid.innerHTML = "";
    itemGrid.innerHTML = `<div class="emptySpecial">${escapeHtml(bookLoadError)}</div>`;
  }else if(visibleItems.length){
    if(isMobileLayout()){
      leftItemGrid.innerHTML = "";
      itemGrid.innerHTML = visibleItems.map(cardHtml).join("");
    }else{
      const leftItems = visibleItems.slice(0, 14);
      const rightItems = visibleItems.slice(14);
      const firstTwoRows = leftItems.slice(0, 8).map(cardHtml).join("");
      const thirdRow = leftItems.slice(8, 11).map(cardHtml).join("");
      const fourthRow = leftItems.slice(11, 14).map(cardHtml).join("");
      leftItemGrid.innerHTML =
        firstTwoRows +
        (thirdRow ? '<div class="gridSpacer" aria-hidden="true"></div>' + thirdRow : "") +
        (fourthRow ? '<div class="gridSpacer" aria-hidden="true"></div>' + fourthRow : "");
      itemGrid.innerHTML = rightItems.map(cardHtml).join("");
    }
  }else{
    leftItemGrid.innerHTML = "";
    itemGrid.innerHTML = `<div class="emptySpecial">${tHtml("book.empty_html").replace(/\\n/g, "<br>")}</div>`;
  }

  document.querySelectorAll(".tagHit").forEach(btn => {
    btn.classList.toggle("active", Number(btn.dataset.page) === currentCategory);
  });
  const otherBtn = document.querySelector(".otherCategoryBtn");
  if(otherBtn){
    otherBtn.classList.toggle("active", Number(otherBtn.dataset.page) === currentCategory);
  }

  const gachaBtn = document.getElementById("bookGachaBtn");
  if(gachaBtn){
    gachaBtn.classList.toggle("is-hidden", category.key !== "materials");
  }

  renderMobileTabs();
}

function openGachaPopup(){
  if(!gachaPopupModal || !gachaPopupFrame) return;
  gachaPopupFrame.src = `${room10PageUrl("gameGacha")}?from=popup&modal=1`;
  gachaPopupModal.classList.add("show");
  gachaPopupModal.setAttribute("aria-hidden","false");
  document.body.classList.add("gachaPopupOpen");
}

function closeGachaPopup(){
  if(!gachaPopupModal || !gachaPopupFrame) return;
  gachaPopupModal.classList.remove("show");
  gachaPopupModal.setAttribute("aria-hidden","true");
  document.body.classList.remove("gachaPopupOpen");
  window.setTimeout(() => {
    if(!gachaPopupModal.classList.contains("show")){
      gachaPopupFrame.src = "about:blank";
    }
  }, 120);
  loadCollectionBookItems({ keepPosition:true });
}

function closeBook(){
  try{
    localStorage.setItem("room10DormActiveView","inventory");
  }catch(error){
    console.warn("无法写入宿舍当前版块。", error);
  }
  window.location.href = room10PageUrl("dorm");
}
function goCategory(index){
  if(!categories.length) return;
  currentCategory = ((index % categories.length) + categories.length) % categories.length;
  currentBookPage = 0;
  renderBook();
}
function turnBookPage(delta){
  const count = categoryPageCount(currentCategoryData());
  currentBookPage = (currentBookPage + delta + count) % count;
  renderBook();
}
function openImagePreview(icon,name){
  if(!icon) return;
  document.getElementById("imagePreviewImg").src = icon;
  document.getElementById("imagePreviewImg").alt = name || t("book.preview_default_alt");
  document.getElementById("imagePreviewTitle").textContent = name || t("book.preview_default_title");
  document.getElementById("imagePreviewModal").classList.add("show");
  document.getElementById("imagePreviewModal").setAttribute("aria-hidden","false");
}
function closeImagePreview(){
  const previewModal = document.getElementById("imagePreviewModal");
  previewModal.classList.remove("show");
  previewModal.setAttribute("aria-hidden","true");
  document.getElementById("imagePreviewImg").removeAttribute("src");
}

document.getElementById("closeBookBtn").addEventListener("click", closeBook);
document.getElementById("prevBookBtn").addEventListener("click", () => turnBookPage(-1));
document.getElementById("nextBookBtn").addEventListener("click", () => turnBookPage(1));
document.getElementById("bookGachaBtn").addEventListener("click", openGachaPopup);
document.getElementById("imagePreviewCloseBtn").addEventListener("click", closeImagePreview);
document.getElementById("gachaPopupCloseBtn").addEventListener("click", closeGachaPopup);
gachaPopupModal.addEventListener("click", event => {
  if(event.target === gachaPopupModal) closeGachaPopup();
});
document.getElementById("imagePreviewModal").addEventListener("click", event => {
  if(event.target.id === "imagePreviewModal") closeImagePreview();
});
[itemGrid,leftItemGrid].forEach(grid => {
  grid.addEventListener("click", event => {
    const card = event.target.closest(".itemCard.is-previewable");
    if(!card) return;
    openImagePreview(card.dataset.previewIcon, card.dataset.previewName);
  });
});
document.querySelectorAll(".tagHit").forEach(btn => btn.addEventListener("click", () => goCategory(Number(btn.dataset.page))));
const otherCategoryBtn = document.querySelector(".otherCategoryBtn");
if(otherCategoryBtn){
  otherCategoryBtn.addEventListener("click", () => goCategory(Number(otherCategoryBtn.dataset.page)));
}
mobileTabs.addEventListener("click", event => {
  const btn = event.target.closest(".mobileTab");
  if(btn) goCategory(Number(btn.dataset.category));
});
document.addEventListener("keydown", event => {
  if(event.key === "Escape"){
    const previewModal = document.getElementById("imagePreviewModal");
    if(previewModal.classList.contains("show")) closeImagePreview();
    else if(gachaPopupModal.classList.contains("show")) closeGachaPopup();
    else closeBook();
  }
  if(modal.classList.contains("show") && !gachaPopupModal.classList.contains("show")){
    if(event.key === "ArrowLeft") turnBookPage(-1);
    if(event.key === "ArrowRight") turnBookPage(1);
  }
});
let bookResizeTimer = null;
function requestBookRender(){
  window.clearTimeout(bookResizeTimer);
  bookResizeTimer = window.setTimeout(renderBook, 40);
}

window.addEventListener("resize", requestBookRender);
window.addEventListener("orientationchange", requestBookRender);

async function initCollectionBookPage(){
  try{
    if(!requireBookMemberIdentity()) return;
    await loadBookPageTexts();
    buildCategoriesFromRows([]);
    applyBookAssets();
    applyBookStaticTexts();
    await loadCollectionBookItems();
  }catch(error){
    console.error("收集图鉴初始化失败：", error);
    bookLoadError = error?.message || "收集图鉴初始化失败。";
    if(!categories.length && CATEGORY_META.length){
      buildCategoriesFromRows([]);
    }
    renderBook();
  }
}

initCollectionBookPage();
</script>

</body>
</html>
