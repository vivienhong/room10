<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜客厅</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../room10-paths.js"></script>

<style>

*{box-sizing:border-box;}

:root{

  --ui-scale:1;
  --room-nav-scale:var(--ui-scale);
  --identity-scale:var(--ui-scale);

  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);
  --identity-name-y:0em;
  --identity-separator-y:0em;
  --identity-role-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;

  --identity-mobile-name-y:0em;
  --identity-mobile-separator-y:0em;
  --identity-mobile-role-y:0em;
  --identity-mobile-notice-y:0em;
  --identity-mobile-button-y:0em;
  --identity-notice-mobile-top:58px;

  --room-nav-top:6.35%;
  --room-nav-start-left:25.83%;
  --room-nav-btn-width:4.72%;
  --room-nav-btn-height:5.10%;
  --room-nav-gap:0.486%;

  --room-nav-hall-left:var(--room-nav-start-left);
  --room-nav-living-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 1);
  --room-nav-manager-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 2);
  --room-nav-honor-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 3);
  --room-nav-studio-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 4);
  --room-nav-game-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 5);
  --room-nav-dorm-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 6);
  --room-nav-flower-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 7);
  --room-nav-pets-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 8);

  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);

}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:#5b4632;
  background:#e7dfd4;
}

button,input{font-family:inherit;}
.hidden{display:none!important;}
body.room10ModalOpen{overflow:hidden!important;}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at top left,rgba(246,238,226,.9),transparent 36%),
    radial-gradient(circle at top right,rgba(230,217,199,.82),transparent 38%),
    linear-gradient(180deg,#e9dfd1,#ded1bf);
}

#bgFrame{
  position:absolute;
  background:#e9dfd1;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
}

#overlay *{pointer-events:auto;}

#overlay .roomNavLayer{
  pointer-events:none!important;
}

#overlay .roomNavLayer .navBtn{
  pointer-events:auto!important;
}

#overlay .roomIdentity{
  pointer-events:none!important;
}

#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{
  pointer-events:auto!important;
}

.roomNavLayer{
  position:absolute;
  inset:0;
  z-index:55;
  pointer-events:none;
  --s:var(--room-nav-scale,1);
  --nav-btn-radius:calc(15px * var(--s));
  --nav-btn-font:calc(15px * var(--s));
  --nav-btn-border:calc(1px * var(--s));
}

.navBtn{
  appearance:none;
  cursor:pointer;
  position:absolute;
  top:var(--room-nav-top);
  width:var(--room-nav-btn-width);
  height:var(--room-nav-btn-height);
  min-width:0;
  min-height:0;
  padding:0;
  border-radius:var(--nav-btn-radius);
  color:var(--room-nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.56), transparent 40%),
    radial-gradient(circle at 78% 74%, var(--room-nav-wash), transparent 48%),
    linear-gradient(180deg, var(--room-nav-paper) 0%, var(--room-nav-paper-2) 100%);
  border:var(--nav-btn-border) solid var(--room-nav-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.64),
    0 calc(2px * var(--s)) calc(7px * var(--s)) rgba(96,70,48,.10);
  text-shadow:0 calc(1px * var(--s)) 0 rgba(255,255,255,.38);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  pointer-events:auto;
}

.navBtn[data-room="hall"]{left:var(--room-nav-hall-left);}
.navBtn[data-room="living"]{left:var(--room-nav-living-left);}
.navBtn[data-room="manager"]{left:var(--room-nav-manager-left);}
.navBtn[data-room="honor"]{left:var(--room-nav-honor-left);}
.navBtn[data-room="studio"]{left:var(--room-nav-studio-left);}
.navBtn[data-room="game"]{left:var(--room-nav-game-left);}
.navBtn[data-room="dorm"]{left:var(--room-nav-dorm-left);}
.navBtn[data-room="flower"]{left:var(--room-nav-flower-left);}
.navBtn[data-room="pets"]{left:var(--room-nav-pets-left);}

.navBtn:not(.is-current):hover,
.navBtn:not(.is-current):focus-visible{
  color:#5f3d22;
  background:
    radial-gradient(circle at 20% 24%, rgba(255,255,255,.66), transparent 42%),
    radial-gradient(circle at 80% 78%, rgba(207,170,143,.24), transparent 50%),
    linear-gradient(180deg, rgba(255,252,246,.88) 0%, rgba(239,226,210,.82) 100%);
  border-color:rgba(151,112,84,.36);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.70),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.12);
  filter:saturate(1.02);
}

.navBtn.is-current{
  cursor:default;
  color:var(--room-nav-current-text);
  background:
    radial-gradient(circle at 22% 22%, rgba(255,255,255,.62), transparent 42%),
    radial-gradient(circle at 80% 80%, rgba(190,151,126,.26), transparent 50%),
    linear-gradient(180deg, rgba(246,235,222,.94) 0%, var(--room-nav-current-bg) 100%);
  border-color:var(--room-nav-current-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.68),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.13),
    0 0 0 calc(2px * var(--s)) rgba(255,253,248,.46);
  filter:none;
}

.navLabel{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.82),
    0 0 calc(8px * var(--s)) rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{ transform:translateY(calc(4px * var(--s))) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(calc(-5px * var(--s))) rotate(6deg) scale(1); opacity:.76; }
}
@keyframes navFloatB{
  0%,100%{ transform:translateY(calc(5px * var(--s))) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(calc(-6px * var(--s))) rotate(-7deg) scale(1); opacity:.68; }
}
@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(calc(6px * var(--s))) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(calc(-6px * var(--s))) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:not(.is-current):hover .navEffectA,
.navBtn:not(.is-current):focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectB,
.navBtn:not(.is-current):focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectC,
.navBtn:not(.is-current):focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}
.navBtn.is-current .navEffect{display:none;}

.navBtn[data-room="hall"] .navEffect{color:rgba(255,205,96,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.95),0 0 calc(10px * var(--s)) rgba(255,215,105,.62);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="honor"] .navEffect{color:rgba(205,143,45,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.92),0 0 calc(8px * var(--s)) rgba(255,220,130,.52);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}

.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}

.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}

.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}

.identityNamePart{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  line-height:1;
  white-space:nowrap;
  font:inherit;
}

.identityNickname{transform:translateY(var(--identity-name-y));}
.identitySeparator{
  margin:0 .08em;
  color:rgba(111,87,70,.78);
  font-weight:800;
  transform:translateY(var(--identity-separator-y));
}
.identityRole{transform:translateY(var(--identity-role-y));}

.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}

.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:950;
  text-align:left;
}

.identityNoticePanel.show{display:block;}

.identityNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
  margin-bottom:calc(10px * var(--s));
}

.identityNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}

@media(max-width:540px){
  html,body{
    overflow-x:hidden;
    overflow-y:auto;
    height:auto;
    min-height:100%;
  }

  #room{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    height:auto;
    display:block;
    overflow:visible;
    padding:10px 12px 14px;
    background:transparent;
  }

  #bgFrame{display:none;}

  #overlay{
    position:relative;
    left:auto!important;
    top:auto!important;
    width:100%!important;
    height:auto!important;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:0!important;
    padding:0!important;
    overflow:visible;
    pointer-events:auto;
  }

  .roomNavLayer{
    position:relative;
    inset:auto;
    width:100%;
    height:106px;
    min-height:106px;
    max-height:106px;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(3,32px);
    gap:5px;
    margin:0!important;
    padding:0!important;
    align-content:start;
    order:0;
    z-index:20;
    pointer-events:auto;
    --s:1;
  }

  .roomNavLayer .navBtn{
    position:relative;
    left:auto!important;
    top:auto!important;
    display:flex!important;
    align-items:center;
    justify-content:center;
    width:100%;
    height:32px;
    min-width:0;
    min-height:32px;
    max-height:32px;
    margin:0!important;
    padding:0!important;
    border-radius:10px;
    font-size:12px;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
  }

  .roomNavLayer .navBtn.is-current{
    display:flex!important;
    visibility:visible!important;
  }

  .roomNavLayer .navLabel{
    height:100%;
    padding-top:.04em;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
  }

  .roomNavLayer .navEffect{display:none;}

  .roomIdentity{
    --s:1;
    position:relative;
    right:auto;
    top:auto;
    width:100%;
    min-width:0;
    height:40px;
    min-height:40px;
    order:1;
    z-index:90;
  }

  .roomIdentityBar{
    grid-template-columns:minmax(0,1fr) 34px 42px;
    gap:6px;
    padding:5px 7px;
    border-radius:14px;
  }

  .identityNameBox{
    padding:0 9px;
    border-radius:10px;
    overflow:visible;
  }

  .identityNameText{
    font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif!important;
    font-size:12px;
    font-weight:850;
    line-height:1;
    letter-spacing:0;
    white-space:nowrap;
    overflow:visible;
  }

  .identityNamePart{
    line-height:1;
    white-space:nowrap;
  }

  .identityNickname{transform:translateY(var(--identity-mobile-name-y));}
  .identitySeparator{
    margin:0 .08em;
    color:rgba(111,87,70,.78);
    font-size:12px;
    font-weight:800;
    transform:translateY(var(--identity-mobile-separator-y));
  }
  .identityRole{transform:translateY(var(--identity-mobile-role-y));}

  .identityNoticeBtn{
    font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif!important;
    font-size:14px;
    border-radius:10px;
  }

  .identityNoticeIcon{transform:translateY(var(--identity-mobile-notice-y));}

  .identityAuthBtn{
    font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif!important;
    font-size:11px;
    font-weight:850;
    line-height:1;
    border-radius:10px;
  }

  .identityAuthText{
    line-height:1;
    transform:translateY(var(--identity-mobile-button-y));
  }

  .identityNoticePanel{
    position:fixed!important;
    top:var(--identity-notice-mobile-top,58px)!important;
    left:auto!important;
    right:max(20px, env(safe-area-inset-right))!important;
    width:min(320px, calc(100% - 40px))!important;
    min-width:0!important;
    max-width:320px!important;
    max-height:calc(100dvh - var(--identity-notice-mobile-top,58px) - 14px)!important;
    padding:14px;
    border-radius:18px;
    z-index:990;
    box-sizing:border-box;
    overflow-x:hidden;
    overflow-y:auto;
    background:
      radial-gradient(circle at 14% 12%, rgba(255,255,255,.82), transparent 38%),

<script>

const CURRENT_ROOM = "living";

const STORAGE_KEYS = {
  loggedIn:"room10LoggedIn",
  user:"room10User",
  role:"room10Role",
  memberId:"room10MemberId",
  memberCode:"room10MemberCode"
};

const ROOM10_ROOT_PREFIX = window.ROOM10_ROOT || "../";

function room10Url(path){
  const raw = String(path || "").trim();
  if(!raw) return "";
  if(/^(javascript:|data:|vbscript:|file:|blob:)/i.test(raw)) return "";
  if(/^(https:|mailto:|tel:|#|\/)/i.test(raw)) return raw;
  if(/^http:/i.test(raw)) return "";
  if(raw.startsWith("./") || raw.startsWith("../")) return raw;
  if(typeof window.room10Path === "function") return window.room10Path(raw);
  return `${ROOM10_ROOT_PREFIX}${raw}`;
}

function room10PageUrl(key, fallbackPath = ""){
  const pageKey = String(key || "").trim();
  if(pageKey && typeof window.room10Page === "function"){
    const configured = window.room10Page(pageKey);
    if(configured) return configured;
  }
  return room10Url(fallbackPath);
}

function room10AssetUrl(key, fallbackPath = ""){
  const assetKey = String(key || "").trim();
  if(assetKey && typeof window.room10Asset === "function"){
    const configured = window.room10Asset(assetKey);
    if(configured) return configured;
  }
  return room10Url(fallbackPath);
}

const img = document.getElementById("bg");
const bgFrame = document.getElementById("bgFrame");
const overlay = document.getElementById("overlay");
const root = document.documentElement;

const identityNameText = document.getElementById("identityNameText");
const identityNickname = document.getElementById("identityNickname");
const identitySeparator = document.getElementById("identitySeparator");
const identityRole = document.getElementById("identityRole");
const identityNoticeBtn = document.getElementById("identityNoticeBtn");
const identityNoticeWrap = document.querySelector(".identityNoticeWrap");
const identityNoticePanel = document.getElementById("identityNoticePanel");
const identityAuthBtn = document.getElementById("identityAuthBtn");
const identityNoticeCount = document.getElementById("identityNoticeCount");
const identityNoticeContent = document.getElementById("identityNoticeContent");
const identityNoticeClear = document.getElementById("identityNoticeClear");

const supabaseUrl = "https://tfevitwoqmxwaguvtyms.supabase.co";
const supabaseKey = "sb_publishable_0cFYhwx_9uEcrXnMJzzNMQ_cEng8xmI";
const client = window.supabase?.createClient
  ? window.supabase.createClient(supabaseUrl, supabaseKey)
  : null;
const livingBoardLayout = document.getElementById("livingBoardLayout");
const livingLoginMask = document.getElementById("livingLoginMask");
const livingLoginImage = document.getElementById("livingLoginImage");
const livingLoginNickname = document.getElementById("livingLoginNickname");
const livingLoginCode = document.getElementById("livingLoginCode");
const livingLoginMessage = document.getElementById("livingLoginMessage");
const livingLoginSubmit = document.getElementById("livingLoginSubmit");
let pendingLoginTarget = "";
let currentNoticeIds = [];
let currentMember = null;
let loginRequiredForPage = false;

if(livingLoginImage){
  const loginFrame = room10AssetUrl("root.login", "../login.png");
  if(loginFrame) livingLoginImage.src = loginFrame;
}

if(img){
  const configuredBackground = room10AssetUrl("living.roomLiving", "room-living.png");
  if(configuredBackground){
    img.src = configuredBackground;
    const safeCssUrl = configuredBackground.replace(/["\\]/g, "");
    root.style.setProperty("--living-mobile-bg", `url("${safeCssUrl}")`);
  }
}

function isMobileLayout(){
  return window.innerWidth <= 540;
}

function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";

  root.style.setProperty("--ui-scale","1");
  root.style.setProperty("--room-nav-scale","1");
  root.style.setProperty("--identity-scale","1");
  root.style.setProperty("--board-scale","1");
}

function syncOverlayToImage(){
  if(isMobileLayout()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.45, Math.min(3.2, displayWidth / 1440));
  const navScale = Math.max(0.38, Math.min(3.2, displayWidth / 1440));

  root.style.setProperty("--ui-scale", String(scale));
  root.style.setProperty("--room-nav-scale", String(navScale));
  root.style.setProperty("--identity-scale", String(scale));
  root.style.setProperty("--board-scale", String(scale));
}

function refreshTemplateLayout(){
  syncOverlayToImage();

  if(identityNoticePanel && (identityNoticePanel.classList.contains("show") || !isMobileLayout())){
    positionIdentityNoticePanel();
  }
}

function normalizeRole(role){
  const value = String(role || "").trim().toLowerCase();
  return value === "roomer" ? "member" : value;
}

function roleLabel(role){
  const map = {
    owner:"维修工",
    admin:"宿管",
    member:"房客",
    trainee:"练习生",
    applying:"参观者",
    visitor:"参观者"
  };
  return map[normalizeRole(role)] || "身份异常";
}

function getStoredUser(){
  if(localStorage.getItem(STORAGE_KEYS.loggedIn) !== "true") return null;
  const nickname = String(localStorage.getItem(STORAGE_KEYS.user) || "").trim();
  const role = normalizeRole(localStorage.getItem(STORAGE_KEYS.role));
  const memberId = String(localStorage.getItem(STORAGE_KEYS.memberId) || "").trim();
  const memberCode = String(localStorage.getItem(STORAGE_KEYS.memberCode) || "").trim();
  if(!nickname || !memberId || !memberCode) return null;
  return { nickname, role, member_id:memberId, member_code:memberCode };
}

function saveStoredUser(user){
  localStorage.setItem(STORAGE_KEYS.loggedIn, "true");
  localStorage.setItem(STORAGE_KEYS.user, user.nickname);
  localStorage.setItem(STORAGE_KEYS.role, user.role);
  localStorage.setItem(STORAGE_KEYS.memberId, user.member_id);
  localStorage.setItem(STORAGE_KEYS.memberCode, user.member_code);
}

function clearStoredLogin(){
  Object.values(STORAGE_KEYS).forEach(key => localStorage.removeItem(key));
  ["room10ApplicantSession","room10ApplicationDraft","room10_user","room10_current_user","currentUser"].forEach(key => localStorage.removeItem(key));
  currentMember = null;
}

function isLoggedIn(){
  return Boolean(currentMember && currentMember.member_id && currentMember.member_code);
}

async function fetchCurrentMember(){
  const stored = getStoredUser();
  if(!stored){
    clearStoredLogin();
    return null;
  }
  if(!client) throw new Error("Supabase 客户端没有加载成功");

  const { data, error } = await client.rpc("get_index_member_identity", {
    p_member_id:stored.member_id,
    p_member_code:stored.member_code
  });
  if(error) throw error;
  if(!data){
    clearStoredLogin();
    return null;
  }

  const row = Array.isArray(data) ? data[0] : data;
  const member = {
    nickname:String(row?.nickname || "").trim(),
    role:normalizeRole(row?.role),
    member_id:String(row?.id || row?.member_id || "").trim(),
    member_code:String(row?.member_code || row?.memberCode || row?.code || "").trim()
  };
  if(!member.nickname || !member.member_id || !member.member_code){
    clearStoredLogin();
    return null;
  }
  currentMember = member;
  saveStoredUser(member);
  return member;
}

function updateIdentityUI(){
  const user = currentMember;
  if(!identityNickname || !identitySeparator || !identityRole || !identityAuthBtn) return;

  if(!user){
    identityNickname.textContent = "参观者";
    identitySeparator.classList.add("hidden");
    identityRole.classList.add("hidden");
    identityRole.textContent = "参观者";
    identityAuthBtn.querySelector(".identityAuthText").textContent = "登录";
    identityNameText?.classList.remove("isOverflowSafe");
    return;
  }

  identityNickname.textContent = user.nickname;
  identitySeparator.classList.remove("hidden");
  identityRole.classList.remove("hidden");
  identityRole.textContent = roleLabel(user.role);
  identityAuthBtn.querySelector(".identityAuthText").textContent = "退出";
  identityNameText?.classList.toggle("isOverflowSafe", String(user.nickname || "").length > 8);
}

function syncRoom10BodyLock(){
  const hasOpenModal = Boolean(livingLoginMask?.classList.contains("show"));
  document.body.classList.toggle("room10ModalOpen", hasOpenModal);
}

function goHome(){
  const home = room10PageUrl("index", "../index.html");
  if(home) window.location.href = home;
}

function logout(){
  clearStoredLogin();
  pendingLoginTarget = "";
  currentNoticeIds = [];
  closeLogin(false);
  updateIdentityUI();
  renderNoticeList([]);
  refreshTemplateLayout();
  window.dispatchEvent(new CustomEvent("room10:logout"));
  goHome();
}

function normalizeLoginInput(value){
  return String(value || "").replace(/\u3000/g, " ").trim();
}

function setLoginMessage(message, success = false){
  if(!livingLoginMessage) return;
  livingLoginMessage.classList.toggle("is-success", Boolean(success && message));
  livingLoginMessage.style.color = success ? "#5f7d3a" : "#8b4a2d";
  livingLoginMessage.textContent = String(message || "");
}

function openLogin(targetPage = "", requiredForPage = false){
  if(isLoggedIn()){
    if(targetPage) window.location.href = targetPage;
    return;
  }
  loginRequiredForPage = Boolean(requiredForPage);
  pendingLoginTarget = normalizeInternalLink(targetPage);
  setLoginMessage("");
  livingLoginMask?.classList.add("show");
  livingLoginMask?.setAttribute("aria-hidden", "false");
  syncRoom10BodyLock();
  setTimeout(() => livingLoginNickname?.focus(), 30);
}

function closeLogin(redirectWhenRequired = true){
  livingLoginMask?.classList.remove("show");
  livingLoginMask?.setAttribute("aria-hidden", "true");
  setLoginMessage("");
  syncRoom10BodyLock();
  if(redirectWhenRequired && loginRequiredForPage && !isLoggedIn()) goHome();
}

function toggleLoginCode(){
  if(!livingLoginCode) return;
  livingLoginCode.type = livingLoginCode.type === "password" ? "text" : "password";
}

async function submitLogin(){
  if(!client || !livingLoginNickname || !livingLoginCode || !livingLoginSubmit) return;
  const nickname = normalizeLoginInput(livingLoginNickname.value);
  const code = normalizeLoginInput(livingLoginCode.value);
  if(!nickname || !code){
    setLoginMessage("还没填写完整呢");
    return;
  }

  livingLoginSubmit.disabled = true;
  setLoginMessage("正在验证……");
  try{
    const { data, error } = await client.rpc("verify_member_login", {
      input_nickname:nickname,
      input_code:code
    });
    if(error) throw error;
    const user = Array.isArray(data) ? data[0] : data;
    if(!user || !(user.member_id || user.id)){
      setLoginMessage("没有找到你的记录哎");
      return;
    }

    currentMember = {
      nickname:String(user.nickname || nickname).trim(),
      role:normalizeRole(user.role || "member"),
      member_id:String(user.member_id || user.id || "").trim(),
      member_code:String(user.member_code || user.memberCode || user.code || code).trim()
    };
    saveStoredUser(currentMember);

    const roleMessages = {
      owner:"维修工已上线",
      admin:"宿管已上线",
      member:"房客已登录",
      trainee:"练习生已登录",
      applying:"当前身份为申请中"
    };
    setLoginMessage(roleMessages[String(user.role || "member").toLowerCase()] || "登录成功", true);
    updateIdentityUI();
    await loadMemberNotifications();
    await loadLivingBoard();

    const target = pendingLoginTarget;
    pendingLoginTarget = "";
    setTimeout(() => {
      livingLoginNickname.value = "";
      livingLoginCode.value = "";
      loginRequiredForPage = false;
      closeLogin(false);
      if(target) window.location.href = target;
    }, 450);
  }catch(err){
    console.error("登录失败：", err);
    setLoginMessage(`登录失败：${err?.message || "请稍后再试"}`);
  }finally{
    livingLoginSubmit.disabled = false;
  }
}

function goRegisterFromLiving(){
  const returnPath = room10PageUrl("living", "../living/living.html");
  const registerPath = room10PageUrl("managerRegister", "../manager/register.html");
  if(!registerPath) return;
  sessionStorage.setItem("room10RegisterReturn", returnPath);
  window.location.href = `${registerPath}?from=${encodeURIComponent(returnPath)}`;
}

function getCurrentRole(){
  return currentMember?.role || "";
}

function getManagerPageByRole(){
  const role = getCurrentRole();
  if(role === "owner" || role === "admin") return room10PageUrl("managerAdmin", "../manager/manager-admin.html");
  if(role === "member" || role === "trainee" || role === "applying") return room10PageUrl("managerMember", "../manager/manager-member.html");
  return room10PageUrl("managerVisitor", "../manager/manager-visitor.html");
}

function enterManagerRoom(){
  window.location.href = getManagerPageByRole();
}

function normalizeInternalLink(url){
  const raw = String(url || "").trim();
  if(!raw) return "";
  if(/^(javascript:|data:|vbscript:|file:|blob:|http:)/i.test(raw)) return "";
  if(/^(https:|mailto:|tel:|#)/i.test(raw)) return raw;
  if(raw.startsWith("../") || raw.startsWith("./")) return raw;
  return room10Url(raw.replace(/^\//, ""));
}

function enterRoom(page, needLogin, room = ""){
  const targetPage = normalizeInternalLink(page);
  if(!targetPage) return;

  if(needLogin && !isLoggedIn()){
    openLogin(targetPage);
    return;
  }

  if(room === "dorm" && getCurrentRole() === "applying"){
    window.location.href = getManagerPageByRole();
    return;
  }

  if((room === "flower" || room === "pets") && !isLoggedIn()){
    window.location.href = `${targetPage}?mode=guest`;
    return;
  }

  window.location.href = targetPage;
}

function setupRoomNav(currentRoom){
  const buttons = document.querySelectorAll(".navBtn");
  const current = String(currentRoom || "").trim();

  buttons.forEach(btn => {
    const room = btn.dataset.room || "";
    const isCurrent = room === current;

    btn.classList.toggle("is-current", isCurrent);

    if(isCurrent){
      btn.setAttribute("aria-current","page");
      btn.setAttribute("tabindex","-1");
    }else{
      btn.removeAttribute("aria-current");
      btn.removeAttribute("tabindex");
    }

    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();

      if(btn.classList.contains("is-current")) return;

      if(btn.dataset.manager === "true"){
        enterManagerRoom();
        return;
      }

      const page = room10PageUrl(btn.dataset.page, btn.dataset.fallback || "");
      enterRoom(page, btn.dataset.login === "true", room);
    });
  });
}

function positionIdentityNoticePanel(){
  if(!identityNoticePanel) return;

  if(!isMobileLayout()){
    if(identityNoticeWrap && identityNoticePanel.parentNode !== identityNoticeWrap){
      identityNoticeWrap.appendChild(identityNoticePanel);
    }
    root.style.setProperty("--identity-notice-mobile-top", "58px");
    return;
  }

  if(identityNoticePanel.parentNode !== document.body){
    document.body.appendChild(identityNoticePanel);
  }

  const bar = document.querySelector(".roomIdentityBar") || document.getElementById("roomIdentity") || identityNoticeBtn;
  const rect = bar ? bar.getBoundingClientRect() : { bottom: 50 };
  const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 640;
  const gap = 8;
  const safeTop = Math.max(8, Math.round(rect.bottom + gap));
  const top = Math.min(safeTop, Math.max(58, viewportHeight - 120));

  root.style.setProperty("--identity-notice-mobile-top", `${top}px`);
}

const REQUIRED_PAGE_TEXT_KEYS = [
  "panel_title",
  "panel_aria_label",
  "today_prefix",
  "loading_text",
  "empty_text",
  "error_text",
  "notice_title",
  "notice_empty",
  "notice_default_title",
  "go_button",
  "database_error_hint"
];

const DEFAULT_PAGE_TEXTS = Object.freeze({
  panel_title:"客厅公告栏",
  panel_aria_label:"客厅公告栏",
  today_prefix:"今天",
  loading_text:"读取中",
  empty_text:"暂时没有新公告",
  error_text:"读取错误",
  notice_title:"通知",
  notice_empty:"暂时没有新通知",
  notice_default_title:"站内通知",
  go_button:"去看看",
  database_error_hint:"请检查数据库配置或稍后再试。"
});

let boardCategories = [];
let boardCategoryMap = new Map();
let pageTexts = {};

const ANNOUNCEMENT_DAY = 24 * 60 * 60 * 1000;

function toInt(value, fallback){
  const n = Number(value);
  return Number.isFinite(n) ? Math.trunc(n) : fallback;
}

function toBool(value, fallback = false){
  if(value === true || value === false) return value;
  if(value === 1 || value === "1") return true;
  if(value === 0 || value === "0") return false;
  if(typeof value === "string"){
    const v = value.trim().toLowerCase();
    if(["true", "t", "yes", "y", "on"].includes(v)) return true;
    if(["false", "f", "no", "n", "off"].includes(v)) return false;
  }
  return fallback;
}

function textValue(key){
  return Object.prototype.hasOwnProperty.call(pageTexts, key) ? String(pageTexts[key] ?? "") : "";
}

function requirePageText(key){
  const value = textValue(key);
  if(value) return value;

  const fallback = String(DEFAULT_PAGE_TEXTS[key] ?? "").trim();
  if(fallback){
    console.warn(`缺少 page_text_settings 配置：living.${key}，已使用页面兜底`);
    return fallback;
  }

  throw new Error(`缺少 page_text_settings 配置：living.${key}`);
}

function normalizeCategoryRow(row = {}){
  const key = String(row.category_key || row.key || row.category || "").trim();
  if(!key) return null;

  return {
    key,
    label:String(row.label || row.category_label || key).trim(),
    icon:String(row.icon || "").trim(),
    meta:String(row.meta_text || row.meta || "").trim(),
    cls:String(row.style_class || row.cls || "quick").trim(),
    limit:Math.max(1, toInt(row.item_limit ?? row.limit, 3)),
    display_order:toInt(row.display_order, 999),
    // 分区时间和“去看看”都以 living_board_categories 为准。
    // 不再按 category=game 做前端特殊兜底。
    show_time:toBool(row.show_time, true),
    show_go_button:toBool(row.show_go_button, false),
    default_link_url:String(row.default_link_url || "").trim(),
    display_before_days:row.display_before_days === null || row.display_before_days === undefined
      ? null
      : Math.max(0, toInt(row.display_before_days, 0))
  };
}

function setBoardCategories(categories){
  const normalized = (Array.isArray(categories) ? categories : [])
    .map(normalizeCategoryRow)
    .filter(Boolean)
    .sort((a, b) => {
      const orderDiff = Number(a.display_order ?? 999) - Number(b.display_order ?? 999);
      if(orderDiff !== 0) return orderDiff;
      return String(a.key).localeCompare(String(b.key));
    });

  if(!normalized.length){
    throw new Error("living_board_categories 没有可用配置");
  }

  boardCategories = normalized;
  boardCategoryMap = new Map(boardCategories.map(item => [item.key, item]));
}

async function fetchPageTexts(){
  if(!client) throw new Error("Supabase 客户端没有加载成功");

  const { data, error } = await client.rpc("get_room10_page_texts", {
    p_page_key:"living",
    p_include_inactive:false
  });

  if(error) throw error;

  const loaded = {};
  (data || []).forEach(row => {
    const key = String(row.text_key || "").trim();
    if(!key) return;
    loaded[key] = String(row.text_value ?? "");
  });

  const missing = REQUIRED_PAGE_TEXT_KEYS.filter(key => !String(loaded[key] ?? "").trim());
  if(missing.length){
    console.warn(`page_text_settings 缺少 living 配置，已使用页面兜底：${missing.join(", ")}`);
  }

  return {
    ...DEFAULT_PAGE_TEXTS,
    ...loaded
  };
}

async function fetchBoardCategories(){
  if(!client) throw new Error("Supabase 客户端没有加载成功");

  const { data, error } = await client
    .from("living_board_categories")
    .select("category_key, label, icon, meta_text, style_class, display_order, item_limit, show_time, show_go_button, default_link_url, display_before_days, is_active")
    .eq("is_active", true)
    .order("display_order", { ascending:true });

  if(error) throw error;
  return data || [];
}

async function loadLivingPageConfig(){
  const [loadedTexts, loadedCategories] = await Promise.all([
    fetchPageTexts(),
    fetchBoardCategories()
  ]);

  pageTexts = loadedTexts;
  setBoardCategories(loadedCategories);
  applyLivingTextSettings();
}

function renderLivingConfigError(error){
  console.error("客厅页面配置读取失败：", error);

  const title = document.getElementById("livingPanelTitle");
  const panel = document.getElementById("livingPanel");
  const noticeTitle = document.querySelector(".identityNoticeTitle");
  const noticeContent = document.getElementById("identityNoticeContent");

  if(title) title.textContent = "读取错误";
  if(panel) panel.setAttribute("aria-label", "读取错误");
  if(noticeTitle) noticeTitle.textContent = "读取错误";
  if(noticeContent) noticeContent.innerHTML = '<div class="identityNoticeEmpty">读取错误</div>';
  if(livingBoardLayout) livingBoardLayout.innerHTML = '<div class="boardError">读取错误</div>';
}

function applyLivingTextSettings(){
  const title = document.getElementById("livingPanelTitle");
  const panel = document.getElementById("livingPanel");
  const noticeTitle = document.querySelector(".identityNoticeTitle");
  const noticeEmpty = document.querySelector(".identityNoticeEmpty");

  if(title) title.textContent = requirePageText("panel_title");
  if(panel) panel.setAttribute("aria-label", requirePageText("panel_aria_label"));
  if(noticeTitle) noticeTitle.textContent = requirePageText("notice_title");
  if(noticeEmpty) noticeEmpty.textContent = requirePageText("notice_empty");
}

function formatTodayDate(){
  const now = new Date();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const weekdays = ["周日","周一","周二","周三","周四","周五","周六"];
  return `${textValue("today_prefix")}${month}月${day}日 ${weekdays[now.getDay()]}`;
}

function updateBoardTodayDate(){
  const target = document.getElementById("boardTodayDate");
  if(!target) return;
  target.textContent = formatTodayDate();
}

function parseBoardTimeValue(value){
  if(!value) return 0;
  const time = new Date(value).getTime();
  return Number.isNaN(time) ? 0 : time;
}

function localCalendarDayDiff(fromDate, toDate){
  const from = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
  const to = new Date(toDate.getFullYear(), toDate.getMonth(), toDate.getDate());
  return Math.round((to - from) / ANNOUNCEMENT_DAY);
}

function formatBoardTime(value){
  if(!value) return "";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "";

  const now = new Date();
  const diff = now.getTime() - date.getTime();
  const minute = 60 * 1000;
  const hour = 60 * minute;
  const dayDiff = localCalendarDayDiff(date, now);

  if(diff >= 0 && diff < minute) return textValue("time_just_now") || "刚刚";
  if(dayDiff === 0 && diff >= 0 && diff < hour) return `${Math.max(1, Math.floor(diff / minute))}分钟前`;
  if(dayDiff === 0 && diff >= 0) return `${Math.max(1, Math.floor(diff / hour))}小时前`;
  if(dayDiff === 1) return textValue("time_yesterday") || "昨天";
  if(dayDiff > 1 && dayDiff < 7) return `${dayDiff}天前`;

  return `${date.getMonth() + 1}/${date.getDate()}`;
}

function isAnnouncementActiveByTime(row){
  const now = Date.now();
  const start = parseBoardTimeValue(row?.start_at);
  const end = parseBoardTimeValue(row?.end_at);
  if(start && start > now) return false;
  if(end && end < now) return false;
  return true;
}

function isCategoryCloseEnough(row){
  const category = boardCategoryMap.get(String(row?.category || ""));
  const beforeDays = category?.display_before_days;
  if(beforeDays === null || beforeDays === undefined) return true;

  const now = Date.now();
  const start = parseBoardTimeValue(row?.start_at || row?.event_at || row?.created_at);
  const end = parseBoardTimeValue(row?.end_at);

  if(end && end < now) return false;
  if(!start) return false;
  if(start <= now) return true;

  return start - now <= Number(beforeDays) * ANNOUNCEMENT_DAY;
}

function getEventSortTime(row){
  return parseBoardTimeValue(row?.event_at || row?.created_at);
}

function getCategoryOrder(category){
  const item = boardCategoryMap.get(String(category || ""));
  return item ? Number(item.display_order ?? 999) : 999;
}

function normalizeBoardRows(rows){
  const safeRows = Array.isArray(rows) ? rows : [];
  return safeRows
    .filter(row => row && row.category)
    .filter(row => boardCategoryMap.has(String(row.category || "")))
    .filter(row => String(row.content || row.title || "").trim())
    .filter(row => isAnnouncementActiveByTime(row))
    .filter(row => isCategoryCloseEnough(row))
    .sort((a, b) => {
      const catDiff = getCategoryOrder(a.category) - getCategoryOrder(b.category);
      if(catDiff !== 0) return catDiff;
      if(Boolean(a.is_pinned) !== Boolean(b.is_pinned)) return a.is_pinned ? -1 : 1;
      const priorityDiff = Number(a.priority ?? 50) - Number(b.priority ?? 50);
      if(priorityDiff !== 0) return priorityDiff;
      return getEventSortTime(b) - getEventSortTime(a);
    });
}

function groupBoardRows(rows){
  const groups = new Map();
  boardCategories.forEach(category => groups.set(category.key, []));
  normalizeBoardRows(rows).forEach(row => groups.get(String(row.category || ""))?.push(row));
  return groups;
}

function renderBoardLine(row, options = {}){
  const category = boardCategoryMap.get(String(row.category || ""));
  const content = escapeHtml(row.content || row.title || "");

  // 公告正文必须来自数据库的 title/content/link_url。
  // 前端不再为“游戏通知”“发歌提醒”等事件拼接文案或补游戏名。
  const shouldShowTime = category ? category.show_time !== false : true;
  const meta = shouldShowTime ? formatBoardTime(row.event_at || row.created_at) : "";
  const time = meta ? `<em>${escapeHtml(meta)}</em>` : "";

  const safeTarget = normalizeInternalLink(row.link_url);
  const itemLink = options.showItemLink && safeTarget
    ? `<a class="boardGoBtn boardGoBtnInline" href="${escapeHtml(safeTarget)}">${escapeHtml(requirePageText("go_button"))}</a>`
    : "";

  return `<li>${content}${time}${itemLink}</li>`;
}

function getBoardLink(category){
  if(!category?.show_go_button) return "";
  const safeTarget = normalizeInternalLink(category.default_link_url);
  if(!safeTarget) return "";
  return `<a class="boardGoBtn" href="${escapeHtml(safeTarget)}">${escapeHtml(requirePageText("go_button"))}</a>`;
}

function renderLivingBoard(rows){
  if(!livingBoardLayout) return;

  const groups = groupBoardRows(rows);
  const sections = boardCategories.map(category => {
    const items = groups.get(category.key) || [];
    if(!items.length) return "";

    const visibleItems = items.slice(0, category.limit || 3);
    const meta = category.meta ? `<small>${escapeHtml(category.meta)}</small>` : "";
    const link = getBoardLink(category);
    const headerAside = link || meta;
    const showItemLink = Boolean(category.show_go_button && !link);
    const titleText = `${category.icon ? `${category.icon} ` : ""}${category.label}`;

    return `
      <article class="boardSection ${escapeHtml(category.cls)}" data-category="${escapeHtml(category.key)}">
        <h2 class="boardSectionTitle">
          <span>${escapeHtml(titleText)}</span>
          ${headerAside}
        </h2>
        <ul class="boardList">
          ${visibleItems.map(item => renderBoardLine(item, { showItemLink })).join("")}
        </ul>
      </article>
    `;
  }).filter(Boolean);

  if(!sections.length){
    livingBoardLayout.innerHTML = `<div class="boardEmpty">${escapeHtml(requirePageText("empty_text"))}</div>`;
  }else{
    livingBoardLayout.innerHTML = sections.join("");
  }
}

async function fetchLivingAnnouncements(){
  if(!client){
    throw new Error("Supabase 客户端没有加载成功");
  }

  const fields = "id, category, event_kind, event_scope, title, content, priority, is_pinned, link_url, event_at, start_at, end_at, created_at";
  const result = await client
    .from("living_announcements_feed")
    .select(fields)
    .order("created_at", { ascending:false });

  if(result.error) throw result.error;
  return result.data || [];
}

async function loadLivingBoard(){
  if(!livingBoardLayout) return;
  livingBoardLayout.innerHTML = `<div class="boardLoading">${escapeHtml(requirePageText("loading_text"))}</div>`;
  try{
    const rows = await fetchLivingAnnouncements();
    renderLivingBoard(rows);
  }catch(err){
    console.error("读取客厅公告栏失败：", err);
    livingBoardLayout.innerHTML = `<div class="boardError">${escapeHtml(requirePageText("error_text"))}<br>${escapeHtml(requirePageText("database_error_hint"))}</div>`;
  }
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function setNoticeCount(count){
  const n = Number(count) || 0;
  if(identityNoticeCount) identityNoticeCount.textContent = n > 99 ? "99+" : String(n);
  identityNoticeBtn?.classList.toggle("hasNotice", n > 0);
}

function formatNoticeTime(value){
  if(!value) return "";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "";
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  const hour = String(date.getHours()).padStart(2, "0");
  const minute = String(date.getMinutes()).padStart(2, "0");
  return `${month}-${day} ${hour}:${minute}`;
}

function renderNoticeList(items){
  const list = Array.isArray(items) ? items : [];
  currentNoticeIds = list.map(item => String(item.notice_id || item.id || "").trim()).filter(Boolean);
  if(identityNoticeClear) identityNoticeClear.disabled = currentNoticeIds.length === 0;

  if(!list.length){
    identityNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(textValue("notice_empty") || "暂时还没有新的通知")}</div>`;
    setNoticeCount(0);
    return;
  }

  identityNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => `
        <div class="siteNoticeItem">
          <div class="siteNoticeItemTitle">${escapeHtml(item.title || textValue("notice_default_title") || "站内通知")}</div>
          <div class="siteNoticeItemDesc">${escapeHtml(item.message || item.desc || "")}</div>
          ${item.created_at ? `<div class="siteNoticeItemTime">${escapeHtml(formatNoticeTime(item.created_at))}</div>` : ""}
        </div>
      `).join("")}
    </div>
  `;
  setNoticeCount(list.length);
}

async function loadMemberNotifications(){
  const user = currentMember;
  if(!client || !user?.member_id || !user?.member_code){
    renderNoticeList([]);
    return;
  }

  identityNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(textValue("loading_text") || "读取中")}</div>`;
  try{
    const { data, error } = await client.rpc("get_member_notifications", {
      p_member_id:user.member_id,
      p_member_code:user.member_code,
      p_channel:"site",
      p_limit:20
    });
    if(error) throw error;
    renderNoticeList(Array.isArray(data) ? data : []);
  }catch(err){
    console.error("读取成员通知失败：", err);
    currentNoticeIds = [];
    setNoticeCount(0);
    if(identityNoticeClear) identityNoticeClear.disabled = true;
    identityNoticeContent.innerHTML = `<div class="siteNoticeError">通知读取失败，请稍后再试。</div>`;
  }
}

async function markAllNoticesRead(){
  const user = currentMember;
  if(!client || !user?.member_id || !user?.member_code || !currentNoticeIds.length) return;
  if(identityNoticeClear) identityNoticeClear.disabled = true;
  try{
    const { error } = await client.rpc("mark_member_notifications_read", {
      p_member_id:user.member_id,
      p_member_code:user.member_code,
      p_notice_ids:currentNoticeIds
    });
    if(error) throw error;
    await loadMemberNotifications();
  }catch(err){
    console.error("通知标记已读失败：", err);
    if(identityNoticeClear) identityNoticeClear.disabled = false;
  }
}

async function initLivingPage(){
  setupRoomNav(CURRENT_ROOM);
  refreshTemplateLayout();

  try{
    await loadLivingPageConfig();
    updateBoardTodayDate();
    try{
      await fetchCurrentMember();
    }catch(identityError){
      console.error("读取当前身份失败：", identityError);
      clearStoredLogin();
    }
    updateIdentityUI();

    if(!isLoggedIn()){
      renderNoticeList([]);
      livingBoardLayout.innerHTML = `<div class="boardEmpty">${escapeHtml(requirePageText("empty_text"))}</div>`;
      openLogin("", true);
    }else{
      await Promise.all([loadLivingBoard(), loadMemberNotifications()]);
    }
  }catch(err){
    renderLivingConfigError(err);
  }

  identityNoticeBtn?.addEventListener("click", event => {
    event.stopPropagation();
    if(!isLoggedIn()){
      openLogin("", true);
      return;
    }
    const willShow = !identityNoticePanel.classList.contains("show");
    if(willShow){
      positionIdentityNoticePanel();
      identityNoticePanel.classList.add("show");
      loadMemberNotifications();
    }else{
      identityNoticePanel.classList.remove("show");
    }
  });

  identityNoticeClear?.addEventListener("click", event => {
    event.stopPropagation();
    markAllNoticesRead();
  });

  identityAuthBtn?.addEventListener("click", event => {
    event.stopPropagation();
    if(isLoggedIn()) logout();
    else openLogin("", true);
  });

  document.getElementById("livingLoginClose")?.addEventListener("click", () => closeLogin(true));
  document.getElementById("livingLoginToggle")?.addEventListener("click", toggleLoginCode);
  document.getElementById("livingLoginSubmit")?.addEventListener("click", submitLogin);
  document.getElementById("livingRegisterLink")?.addEventListener("click", goRegisterFromLiving);
  [livingLoginNickname, livingLoginCode].forEach(input => input?.addEventListener("keydown", event => {
    if(event.key === "Enter") submitLogin();
  }));
  livingLoginMask?.addEventListener("click", event => {
    if(event.target === livingLoginMask) closeLogin(true);
  });

  document.addEventListener("click", event => {
    if(identityNoticePanel && identityNoticeBtn){
      if(identityNoticePanel.contains(event.target) || identityNoticeBtn.contains(event.target)) return;
      identityNoticePanel.classList.remove("show");
    }
  });

  document.addEventListener("keydown", event => {
    if(event.key === "Escape"){
      closeLogin(true);
      identityNoticePanel?.classList.remove("show");
    }
  });
}

document.addEventListener("DOMContentLoaded", initLivingPage);

window.addEventListener("resize", refreshTemplateLayout);
window.addEventListener("orientationchange", () => setTimeout(refreshTemplateLayout, 80));
window.addEventListener("pageshow", async () => {
  try{ await fetchCurrentMember(); }catch(_){ clearStoredLogin(); }
  updateIdentityUI();
  if(isLoggedIn()) loadMemberNotifications();
});

window.addEventListener("storage", event => {
  if(Object.values(STORAGE_KEYS).includes(event.key) || ["room10_user","room10_current_user","currentUser"].includes(event.key)){
    updateIdentityUI();
    loadMemberNotifications();
  }
});

if(img && img.complete && img.naturalWidth){
  refreshTemplateLayout();
}else if(img){
  img.addEventListener("load", refreshTemplateLayout, { once:true });
}

setTimeout(refreshTemplateLayout, 80);
</script>
