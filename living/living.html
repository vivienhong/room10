<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜客厅</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../room10-paths.js"></script>

<style>

*{box-sizing:border-box;}

:root{

  --ui-scale:1;
  --room-nav-scale:var(--ui-scale);
  --identity-scale:var(--ui-scale);

  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);
  --identity-name-y:0em;
  --identity-separator-y:0em;
  --identity-role-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;

  --identity-mobile-name-y:0em;
  --identity-mobile-separator-y:0em;
  --identity-mobile-role-y:0em;
  --identity-mobile-notice-y:0em;
  --identity-mobile-button-y:0em;
  --identity-notice-mobile-top:58px;

  --room-nav-top:6.35%;
  --room-nav-start-left:25.83%;
  --room-nav-btn-width:4.72%;
  --room-nav-btn-height:5.10%;
  --room-nav-gap:0.486%;

  --room-nav-hall-left:var(--room-nav-start-left);
  --room-nav-living-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 1);
  --room-nav-manager-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 2);
  --room-nav-honor-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 3);
  --room-nav-studio-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 4);
  --room-nav-game-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 5);
  --room-nav-dorm-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 6);
  --room-nav-flower-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 7);
  --room-nav-pets-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 8);

  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);

}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:#5b4632;
  background:#e7dfd4;
}

button,input{font-family:inherit;}
.hidden{display:none!important;}
body.room10ModalOpen{overflow:hidden!important;}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at top left,rgba(246,238,226,.9),transparent 36%),
    radial-gradient(circle at top right,rgba(230,217,199,.82),transparent 38%),
    linear-gradient(180deg,#e9dfd1,#ded1bf);
}

#bgFrame{
  position:absolute;
  background:#e9dfd1;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
}

#overlay *{pointer-events:auto;}

#overlay .roomNavLayer{
  pointer-events:none!important;
}

#overlay .roomNavLayer .navBtn{
  pointer-events:auto!important;
}

#overlay .roomIdentity{
  pointer-events:none!important;
}

#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{
  pointer-events:auto!important;
}

.roomNavLayer{
  position:absolute;
  inset:0;
  z-index:55;
  pointer-events:none;
  --s:var(--room-nav-scale,1);
  --nav-btn-radius:calc(15px * var(--s));
  --nav-btn-font:calc(15px * var(--s));
  --nav-btn-border:calc(1px * var(--s));
}

.navBtn{
  appearance:none;
  cursor:pointer;
  position:absolute;
  top:var(--room-nav-top);
  width:var(--room-nav-btn-width);
  height:var(--room-nav-btn-height);
  min-width:0;
  min-height:0;
  padding:0;
  border-radius:var(--nav-btn-radius);
  color:var(--room-nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.56), transparent 40%),
    radial-gradient(circle at 78% 74%, var(--room-nav-wash), transparent 48%),
    linear-gradient(180deg, var(--room-nav-paper) 0%, var(--room-nav-paper-2) 100%);
  border:var(--nav-btn-border) solid var(--room-nav-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.64),
    0 calc(2px * var(--s)) calc(7px * var(--s)) rgba(96,70,48,.10);
  text-shadow:0 calc(1px * var(--s)) 0 rgba(255,255,255,.38);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  pointer-events:auto;
}

.navBtn[data-room="hall"]{left:var(--room-nav-hall-left);}
.navBtn[data-room="living"]{left:var(--room-nav-living-left);}
.navBtn[data-room="manager"]{left:var(--room-nav-manager-left);}
.navBtn[data-room="honor"]{left:var(--room-nav-honor-left);}
.navBtn[data-room="studio"]{left:var(--room-nav-studio-left);}
.navBtn[data-room="game"]{left:var(--room-nav-game-left);}
.navBtn[data-room="dorm"]{left:var(--room-nav-dorm-left);}
.navBtn[data-room="flower"]{left:var(--room-nav-flower-left);}
.navBtn[data-room="pets"]{left:var(--room-nav-pets-left);}

.navBtn:not(.is-current):hover,
.navBtn:not(.is-current):focus-visible{
  color:#5f3d22;
  background:
    radial-gradient(circle at 20% 24%, rgba(255,255,255,.66), transparent 42%),
    radial-gradient(circle at 80% 78%, rgba(207,170,143,.24), transparent 50%),
    linear-gradient(180deg, rgba(255,252,246,.88) 0%, rgba(239,226,210,.82) 100%);
  border-color:rgba(151,112,84,.36);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.70),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.12);
  filter:saturate(1.02);
}

.navBtn.is-current{
  cursor:default;
  color:var(--room-nav-current-text);
  background:
    radial-gradient(circle at 22% 22%, rgba(255,255,255,.62), transparent 42%),
    radial-gradient(circle at 80% 80%, rgba(190,151,126,.26), transparent 50%),
    linear-gradient(180deg, rgba(246,235,222,.94) 0%, var(--room-nav-current-bg) 100%);
  border-color:var(--room-nav-current-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.68),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.13),
    0 0 0 calc(2px * var(--s)) rgba(255,253,248,.46);
  filter:none;
}

.navLabel{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.82),
    0 0 calc(8px * var(--s)) rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{ transform:translateY(calc(4px * var(--s))) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(calc(-5px * var(--s))) rotate(6deg) scale(1); opacity:.76; }
}
@keyframes navFloatB{
  0%,100%{ transform:translateY(calc(5px * var(--s))) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(calc(-6px * var(--s))) rotate(-7deg) scale(1); opacity:.68; }
}
@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(calc(6px * var(--s))) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(calc(-6px * var(--s))) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:not(.is-current):hover .navEffectA,
.navBtn:not(.is-current):focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectB,
.navBtn:not(.is-current):focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectC,
.navBtn:not(.is-current):focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}
.navBtn.is-current .navEffect{display:none;}

.navBtn[data-room="hall"] .navEffect{color:rgba(255,205,96,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.95),0 0 calc(10px * var(--s)) rgba(255,215,105,.62);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="honor"] .navEffect{color:rgba(205,143,45,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.92),0 0 calc(8px * var(--s)) rgba(255,220,130,.52);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}

.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}

.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}

.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}

.identityNamePart{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  line-height:1;
  white-space:nowrap;
  font:inherit;
}

.identityNickname{transform:translateY(var(--identity-name-y));}
.identitySeparator{
  margin:0 .08em;
  color:rgba(111,87,70,.78);
  font-weight:800;
  transform:translateY(var(--identity-separator-y));
}
.identityRole{transform:translateY(var(--identity-role-y));}

.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}

.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:950;
  text-align:left;
}

.identityNoticePanel.show{display:block;}

.identityNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
  margin-bottom:calc(10px * var(--s));
}

.identityNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}

@media(max-width:540px){
  html,body{
    overflow-x:hidden;
    overflow-y:auto;
    height:auto;
    min-height:100%;
  }

  #room{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    height:auto;
    display:block;
    overflow:visible;
    padding:10px 12px 14px;
    background:transparent;
  }

  #bgFrame{display:none;}

  #overlay{
    position:relative;
    left:auto!important;
    top:auto!important;
    width:100%!important;
    height:auto!important;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:0!important;
    padding:0!important;
    overflow:visible;
    pointer-events:auto;
  }

  .roomNavLayer{
    position:relative;
    inset:auto;
    width:100%;
    height:106px;
    min-height:106px;
    max-height:106px;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(3,32px);
    gap:5px;
    margin:0!important;
    padding:0!important;
    align-content:start;
    order:0;
    z-index:20;
    pointer-events:auto;
    --s:1;
  }

  .roomNavLayer .navBtn{
    position:relative;
    left:auto!important;
    top:auto!important;
    display:flex!important;
    align-items:center;
    justify-content:center;
    width:100%;
    height:32px;
    min-width:0;
    min-height:32px;
    max-height:32px;
    margin:0!important;
    padding:0!important;
    border-radius:10px;
    font-size:12px;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
  }

  .roomNavLayer .navBtn.is-current{
    display:flex!important;
    visibility:visible!important;
  }

  .roomNavLayer .navLabel{
    height:100%;
    padding-top:.04em;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
  }

  .roomNavLayer .navEffect{display:none;}

  .roomIdentity{
    --s:1;
    position:relative;
    right:auto;
    top:auto;
    width:100%;
    min-width:0;
    height:40px;
    min-height:40px;
    order:1;
    z-index:90;
  }

  .roomIdentityBar{
    grid-template-columns:minmax(0,1fr) 34px 42px;
    gap:6px;
    padding:5px 7px;
    border-radius:14px;
  }

  .identityNameBox{
    padding:0 9px;
    border-radius:10px;
    overflow:visible;
  }

  .identityNameText{
    font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif!important;
    font-size:12px;
    font-weight:850;
    line-height:1;
    letter-spacing:0;
    white-space:nowrap;
    overflow:visible;
  }

  .identityNamePart{
    line-height:1;
    white-space:nowrap;
  }

  .identityNickname{transform:translateY(var(--identity-mobile-name-y));}
  .identitySeparator{
    margin:0 .08em;
    color:rgba(111,87,70,.78);
    font-size:12px;
    font-weight:800;
    transform:translateY(var(--identity-mobile-separator-y));
  }
  .identityRole{transform:translateY(var(--identity-mobile-role-y));}

  .identityNoticeBtn{
    font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif!important;
    font-size:14px;
    border-radius:10px;
  }

  .identityNoticeIcon{transform:translateY(var(--identity-mobile-notice-y));}

  .identityAuthBtn{
    font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif!important;
    font-size:11px;
    font-weight:850;
    line-height:1;
    border-radius:10px;
  }

  .identityAuthText{
    line-height:1;
    transform:translateY(var(--identity-mobile-button-y));
  }

  .identityNoticePanel{
    position:fixed!important;
    top:var(--identity-notice-mobile-top,58px)!important;
    left:auto!important;
    right:max(20px, env(safe-area-inset-right))!important;
    width:min(320px, calc(100% - 40px))!important;
    min-width:0!important;
    max-width:320px!important;
    max-height:calc(100dvh - var(--identity-notice-mobile-top,58px) - 14px)!important;
    padding:14px;
    border-radius:18px;
    z-index:990;
    box-sizing:border-box;
    overflow-x:hidden;
    overflow-y:auto;
    background:
      radial-gradient(circle at 14% 12%, rgba(255,255,255,.82), transparent 38%),

/* =========================================================
   WALL-MOUNTED LIVING BOARD
   日历与公告直接作为墙面挂件，不再使用“大公告栏”外框
   ========================================================= */

.boardHeader{display:none!important;}
.boardViewSwitch{display:none!important;}

#livingPanel{
  left:13.2%;
  top:16.1%;
  width:43.3%;
  height:64.8%;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  overflow:visible;
  isolation:auto;
}

#livingPanel::before{display:none!important;}

#livingBoard{
  height:100%;
  padding:0 3px 6px;
  overflow-y:auto;
  overflow-x:visible;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
#livingBoard::-webkit-scrollbar{display:none;}

.boardLayout{
  min-height:0;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:calc(12px * var(--ui-scale));
  padding:calc(8px * var(--ui-scale)) calc(7px * var(--ui-scale)) calc(18px * var(--ui-scale));
}

.boardSection{
  animation:none!important;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  box-shadow:
    0 calc(8px * var(--ui-scale)) calc(17px * var(--ui-scale)) rgba(92,67,42,.13),
    inset 0 1px 0 rgba(255,255,255,.78);
}

/* 主挂历纸 */
.boardCalendarCard{
  grid-column:1 / -1;
  position:relative;
  padding:calc(15px * var(--ui-scale)) calc(15px * var(--ui-scale)) calc(14px * var(--ui-scale));
  border:calc(1px * var(--ui-scale)) solid rgba(170,126,83,.18);
  border-radius:calc(10px * var(--ui-scale)) calc(13px * var(--ui-scale)) calc(11px * var(--ui-scale)) calc(9px * var(--ui-scale));
  background:
    repeating-linear-gradient(0deg,rgba(164,122,78,.024) 0,rgba(164,122,78,.024) 1px,transparent 1px,transparent calc(22px * var(--ui-scale))),
    radial-gradient(circle at 16% 8%,rgba(255,255,255,.76),transparent 30%),
    linear-gradient(180deg,rgba(255,253,244,.97),rgba(252,246,232,.96));
  transform:rotate(-.18deg);
  overflow:visible;
}

.boardCalendarCard::before{
  content:""!important;
  display:block!important;
  position:absolute!important;
  left:50%!important;
  right:auto!important;
  top:calc(-8px * var(--ui-scale))!important;
  width:calc(78px * var(--ui-scale))!important;
  height:calc(16px * var(--ui-scale))!important;
  transform:translateX(-50%) rotate(-2deg)!important;
  border-radius:calc(2px * var(--ui-scale))!important;
  background:linear-gradient(90deg,rgba(226,203,159,.78),rgba(246,226,187,.86),rgba(219,194,151,.76))!important;
  border:1px solid rgba(149,112,73,.10)!important;
  box-shadow:0 2px 5px rgba(82,58,36,.08)!important;
  opacity:.92!important;
  z-index:4!important;
}

.boardCalendarCard::after{
  content:"";
  position:absolute;
  left:50%;
  top:calc(-3px * var(--ui-scale));
  width:calc(5px * var(--ui-scale));
  height:calc(5px * var(--ui-scale));
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff2cf,#b97b48 60%,#805331);
  box-shadow:0 1px 3px rgba(73,48,28,.28);
  z-index:5;
}

.boardCalendarCard > .boardSectionTitle{
  margin:0 0 calc(7px * var(--ui-scale));
  padding:0 calc(2px * var(--ui-scale));
  font-size:calc(15px * var(--ui-scale));
  color:#68452d;
}

.boardCalendarCard > .boardSectionTitle small{display:none;}

.boardCalendarCard .calendarView{
  gap:calc(6px * var(--ui-scale));
}

.calendarToolbar{
  grid-template-columns:calc(30px * var(--ui-scale)) minmax(0,1fr) calc(30px * var(--ui-scale)) auto;
  gap:calc(5px * var(--ui-scale));
  padding:0 calc(1px * var(--ui-scale));
}

.calendarMonthLabel{
  font-size:calc(14px * var(--ui-scale));
  letter-spacing:.035em;
}

.calendarNavBtn,.calendarTodayBtn{
  min-height:calc(25px * var(--ui-scale));
  border-color:rgba(139,98,60,.13);
  background:rgba(255,251,242,.76);
  box-shadow:0 1px 3px rgba(95,67,39,.05);
}

.calendarNavBtn{
  width:calc(28px * var(--ui-scale));
  font-size:calc(16px * var(--ui-scale));
}

.calendarTodayBtn{
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(10px * var(--ui-scale));
}

.calendarWeekdays{
  padding-top:calc(1px * var(--ui-scale));
  color:#987050;
  font-size:calc(9px * var(--ui-scale));
}

.boardCalendarCard .calendarGrid{
  grid-auto-rows:minmax(calc(58px * var(--ui-scale)),auto);
  gap:calc(3px * var(--ui-scale));
}

.calendarDay{

/* 发歌提醒：像贴在主日历下方的窄便签 */
.boardReleaseNoteCard{
  grid-column:1 / -1;
  position:relative;
  padding:calc(10px * var(--ui-scale)) calc(14px * var(--ui-scale)) calc(11px * var(--ui-scale));
  border:1px solid rgba(185,132,89,.16);
  border-radius:calc(5px * var(--ui-scale)) calc(8px * var(--ui-scale)) calc(6px * var(--ui-scale)) calc(7px * var(--ui-scale));

    linear-gradient(180deg,rgba(255,244,212,.96),rgba(255,238,199,.93));
  transform:rotate(.28deg);
  box-shadow:0 calc(5px * var(--ui-scale)) calc(12px * var(--ui-scale)) rgba(91,64,39,.11);

.boardReleaseNoteCard::before{

  display:block!important;
  position:absolute!important;
  left:calc(24px * var(--ui-scale))!important;
  right:auto!important;

const ROOM10_ROOT_PREFIX = window.ROOM10_ROOT || "../";

function room10Url(path){
  const raw = String(path || "").trim();
  if(!raw) return "";
  if(/^(javascript:|data:|vbscript:|file:|blob:)/i.test(raw)) return "";
  if(/^(https:|mailto:|tel:|#|\/)/i.test(raw)) return raw;
  if(/^http:/i.test(raw)) return "";
  if(raw.startsWith("./") || raw.startsWith("../")) return raw;
  if(typeof window.room10Path === "function") return window.room10Path(raw);
  return `${ROOM10_ROOT_PREFIX}${raw}`;
}

function room10PageUrl(key, fallbackPath = ""){
  const pageKey = String(key || "").trim();
  if(pageKey && typeof window.room10Page === "function"){
    const configured = window.room10Page(pageKey);
    if(configured) return configured;
  }
  return room10Url(fallbackPath);
}

function room10AssetUrl(key, fallbackPath = ""){
  const assetKey = String(key || "").trim();
  if(assetKey && typeof window.room10Asset === "function"){
    const configured = window.room10Asset(assetKey);
    if(configured) return configured;
  }
  return room10Url(fallbackPath);
}

function isMobileLayout(){

function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";

  root.style.setProperty("--ui-scale","1");
  root.style.setProperty("--room-nav-scale","1");
  root.style.setProperty("--identity-scale","1");
  root.style.setProperty("--board-scale","1");
}

function syncOverlayToImage(){
  if(isMobileLayout()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.45, Math.min(3.2, displayWidth / 1440));
  const navScale = Math.max(0.38, Math.min(3.2, displayWidth / 1440));

  root.style.setProperty("--ui-scale", String(scale));
  root.style.setProperty("--room-nav-scale", String(navScale));
  root.style.setProperty("--identity-scale", String(scale));
  root.style.setProperty("--board-scale", String(Math.max(0.86, scale)));
}

function normalizeRole(role){
  const value = String(role || "").trim().toLowerCase();

  const map = {

    admin:"宿管",
    member:"房客",
    trainee:"练习生",
    applying:"参观者",
    visitor:"参观者"
  };
  return map[normalizeRole(role)] || "身份异常";
}

function getStoredUser(){
  if(localStorage.getItem(STORAGE_KEYS.loggedIn) !== "true") return null;
  const nickname = String(localStorage.getItem(STORAGE_KEYS.user) || "").trim();
  const role = normalizeRole(localStorage.getItem(STORAGE_KEYS.role));
  const memberId = String(localStorage.getItem(STORAGE_KEYS.memberId) || "").trim();
  const memberCode = String(localStorage.getItem(STORAGE_KEYS.memberCode) || "").trim();
  if(!nickname || !memberId || !memberCode) return null;
  return { nickname, role, member_id:memberId, member_code:memberCode };
}

function saveStoredUser(user){
  localStorage.setItem(STORAGE_KEYS.loggedIn, "true");
  localStorage.setItem(STORAGE_KEYS.user, user.nickname);
  localStorage.setItem(STORAGE_KEYS.role, user.role);
  localStorage.setItem(STORAGE_KEYS.memberId, user.member_id);
  localStorage.setItem(STORAGE_KEYS.memberCode, user.member_code);
}

function clearStoredLogin(){
  Object.values(STORAGE_KEYS).forEach(key => localStorage.removeItem(key));
  ["room10ApplicantSession","room10ApplicationDraft","room10_user","room10_current_user","currentUser"].forEach(key => localStorage.removeItem(key));
  currentMember = null;
}

function isLoggedIn(){
  return Boolean(currentMember && currentMember.member_id && currentMember.member_code);
}

async function fetchCurrentMember(){
  const stored = getStoredUser();
  if(!stored){
    clearStoredLogin();
    return null;
  }
  if(!client) throw new Error("Supabase 客户端没有加载成功");

  const { data, error } = await client.rpc("get_index_member_identity", {
    p_member_id:stored.member_id,
    p_member_code:stored.member_code
  });
  if(error) throw error;
  if(!data){
    clearStoredLogin();
    return null;
  }

  const row = Array.isArray(data) ? data[0] : data;
  const member = {
    nickname:String(row?.nickname || "").trim(),
    role:normalizeRole(row?.role),
    member_id:String(row?.id || row?.member_id || "").trim(),
    member_code:String(row?.member_code || row?.memberCode || row?.code || "").trim()
  };
  if(!member.nickname || !member.member_id || !member.member_code){
    clearStoredLogin();
    return null;
  }
  currentMember = member;
  saveStoredUser(member);
  return member;
}

function updateIdentityUI(){

  identityNickname.textContent = user.nickname;

function normalizeLoginInput(value){
  return String(value || "").replace(/\u3000/g, " ").trim();
}

function setLoginMessage(message, success = false){
  if(!livingLoginMessage) return;
  livingLoginMessage.classList.toggle("is-success", Boolean(success && message));
  livingLoginMessage.style.color = success ? "#5f7d3a" : "#8b4a2d";
  livingLoginMessage.textContent = String(message || "");
}

function openLogin(targetPage = "", requiredForPage = false){
  if(isLoggedIn()){
    if(targetPage) window.location.href = targetPage;
    return;
  }
  loginRequiredForPage = Boolean(requiredForPage);
  pendingLoginTarget = normalizeInternalLink(targetPage);
  setLoginMessage("");
  livingLoginMask?.classList.add("show");
  livingLoginMask?.setAttribute("aria-hidden", "false");
  syncRoom10BodyLock();
  setTimeout(() => livingLoginNickname?.focus(), 30);
}

function closeLogin(redirectWhenRequired = true){
  livingLoginMask?.classList.remove("show");
  livingLoginMask?.setAttribute("aria-hidden", "true");
  setLoginMessage("");
  syncRoom10BodyLock();
  if(redirectWhenRequired && loginRequiredForPage && !isLoggedIn()) goHome();
}

function toggleLoginCode(){

  livingLoginCode.type = livingLoginCode.type === "password" ? "text" : "password";
}

async function submitLogin(){
  if(!client || !livingLoginNickname || !livingLoginCode || !livingLoginSubmit) return;
  const nickname = normalizeLoginInput(livingLoginNickname.value);
  const code = normalizeLoginInput(livingLoginCode.value);
  if(!nickname || !code){
    setLoginMessage("还没填写完整呢");
    return;
  }

  livingLoginSubmit.disabled = true;
  setLoginMessage("正在验证……");
  try{
    const { data, error } = await client.rpc("verify_member_login", {
      input_nickname:nickname,
      input_code:code
    });
    if(error) throw error;
    const user = Array.isArray(data) ? data[0] : data;
    if(!user || !(user.member_id || user.id)){
      setLoginMessage("没有找到你的记录哎");
      return;
    }

    currentMember = {
      nickname:String(user.nickname || nickname).trim(),
      role:normalizeRole(user.role || "member"),
      member_id:String(user.member_id || user.id || "").trim(),
      member_code:String(user.member_code || user.memberCode || user.code || code).trim()
    };
    saveStoredUser(currentMember);

    const roleMessages = {
      owner:"维修工已上线",
      admin:"宿管已上线",
      member:"房客已登录",
      trainee:"练习生已登录",
      applying:"当前身份为申请中"
    };
    setLoginMessage(roleMessages[String(user.role || "member").toLowerCase()] || "登录成功", true);
    updateIdentityUI();
    await loadMemberNotifications();
    await loadLivingBoard();

    const target = pendingLoginTarget;
    pendingLoginTarget = "";
    setTimeout(() => {
      livingLoginNickname.value = "";
      livingLoginCode.value = "";
      loginRequiredForPage = false;
      closeLogin(false);
      if(target) window.location.href = target;
    }, 450);
  }catch(err){
    console.error("登录失败：", err);
    setLoginMessage(`登录失败：${err?.message || "请稍后再试"}`);
  }finally{
    livingLoginSubmit.disabled = false;
  }
}

function normalizeInternalLink(url){
  const raw = String(url || "").trim();
  if(!raw) return "";
  if(/^(javascript:|data:|vbscript:|file:|blob:|http:)/i.test(raw)) return "";
  if(/^(https:|mailto:|tel:|#)/i.test(raw)) return raw;
  if(raw.startsWith("../") || raw.startsWith("./")) return raw;
  return room10Url(raw.replace(/^\//, ""));
}

function enterRoom(page, needLogin, room = ""){
  const targetPage = normalizeInternalLink(page);
  if(!targetPage) return;

  if(needLogin && !isLoggedIn()){
    openLogin(targetPage);
    return;
  }

  if(room === "dorm" && getCurrentRole() === "applying"){
    window.location.href = getManagerPageByRole();
    return;
  }

  if((room === "flower" || room === "pets") && !isLoggedIn()){
    window.location.href = `${targetPage}?mode=guest`;
    return;
  }

  window.location.href = targetPage;
}

function setupRoomNav(currentRoom){
  const buttons = document.querySelectorAll(".navBtn");
  const current = String(currentRoom || "").trim();

  buttons.forEach(btn => {
    const room = btn.dataset.room || "";
    const isCurrent = room === current;

    btn.classList.toggle("is-current", isCurrent);

    if(isCurrent){
      btn.setAttribute("aria-current","page");
      btn.setAttribute("tabindex","-1");
    }else{
      btn.removeAttribute("aria-current");
      btn.removeAttribute("tabindex");
    }

    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();

      if(btn.classList.contains("is-current")) return;

      if(btn.dataset.manager === "true"){
        enterManagerRoom();
        return;
      }

      const page = room10PageUrl(btn.dataset.page, btn.dataset.fallback || "");
      enterRoom(page, btn.dataset.login === "true", room);
    });
  });
}

function toInt(value, fallback){
  const n = Number(value);
  return Number.isFinite(n) ? Math.trunc(n) : fallback;
}

function toBool(value, fallback = false){
  if(value === true || value === false) return value;
  if(value === 1 || value === "1") return true;
  if(value === 0 || value === "0") return false;
  if(typeof value === "string"){
    const v = value.trim().toLowerCase();
    if(["true", "t", "yes", "y", "on"].includes(v)) return true;
    if(["false", "f", "no", "n", "off"].includes(v)) return false;
  }
  return fallback;
}

function textValue(key){
  return Object.prototype.hasOwnProperty.call(pageTexts, key) ? String(pageTexts[key] ?? "") : "";
}

function requirePageText(key){
  const value = textValue(key);
  if(value) return value;

  const fallback = String(DEFAULT_PAGE_TEXTS[key] ?? "").trim();
  if(fallback){
    console.warn(`缺少 page_text_settings 配置：living.${key}，已使用页面兜底`);
    return fallback;
  }

  throw new Error(`缺少 page_text_settings 配置：living.${key}`);
}

function normalizeCategoryRow(row = {}){
  const key = String(row.category_key || row.key || row.category || "").trim();
  if(!key) return null;

  return {
    key,
    label:String(row.label || row.category_label || key).trim(),
    icon:String(row.icon || "").trim(),
    meta:String(row.meta_text || row.meta || "").trim(),
    cls:String(row.style_class || row.cls || "quick").trim(),
    limit:Math.max(1, toInt(row.item_limit ?? row.limit, 3)),
    display_order:toInt(row.display_order, 999),
    // 分区时间和“去看看”都以 living_board_categories 为准。
    // 不再按 category=game 做前端特殊兜底。
    show_time:toBool(row.show_time, true),
    show_go_button:toBool(row.show_go_button, false),
    default_link_url:String(row.default_link_url || "").trim(),
    display_before_days:row.display_before_days === null || row.display_before_days === undefined
      ? null
      : Math.max(0, toInt(row.display_before_days, 0))
  };
}

function setBoardCategories(categories){
  const normalized = (Array.isArray(categories) ? categories : [])
    .map(normalizeCategoryRow)
    .filter(Boolean)
    .sort((a, b) => {
      const orderDiff = Number(a.display_order ?? 999) - Number(b.display_order ?? 999);
      if(orderDiff !== 0) return orderDiff;
      return String(a.key).localeCompare(String(b.key));
    });

  if(!normalized.length){
    throw new Error("living_board_categories 没有可用配置");
  }

  boardCategories = normalized;
  boardCategoryMap = new Map(boardCategories.map(item => [item.key, item]));
}

async function fetchPageTexts(){
  if(!client) throw new Error("Supabase 客户端没有加载成功");

  const { data, error } = await client.rpc("get_room10_page_texts", {
    p_page_key:"living",
    p_include_inactive:false
  });

  if(error) throw error;

  const loaded = {};
  (data || []).forEach(row => {
    const key = String(row.text_key || "").trim();
    if(!key) return;
    loaded[key] = String(row.text_value ?? "");
  });

  const missing = REQUIRED_PAGE_TEXT_KEYS.filter(key => !String(loaded[key] ?? "").trim());
  if(missing.length){
    console.warn(`page_text_settings 缺少 living 配置，已使用页面兜底：${missing.join(", ")}`);
  }

  return {
    ...DEFAULT_PAGE_TEXTS,
    ...loaded
  };
}

async function fetchBoardCategories(){
  if(!client) throw new Error("Supabase 客户端没有加载成功");

  const { data, error } = await client
    .from("living_board_categories")
    .select("category_key, label, icon, meta_text, style_class, display_order, item_limit, show_time, show_go_button, default_link_url, display_before_days, is_active")
    .eq("is_active", true)
    .order("display_order", { ascending:true });

  if(error) throw error;
  return data || [];
}

async function loadLivingPageConfig(){
  const [loadedTexts, loadedCategories] = await Promise.all([
    fetchPageTexts(),
    fetchBoardCategories()
  ]);

  pageTexts = loadedTexts;
  setBoardCategories(loadedCategories);
  applyLivingTextSettings();
}

function formatTodayDate(){
  const now = new Date();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const weekdays = ["周日","周一","周二","周三","周四","周五","周六"];
  return `${textValue("today_prefix")}${month}月${day}日 ${weekdays[now.getDay()]}`;
}

function updateBoardTodayDate(){
  const target = document.getElementById("boardTodayDate");
  if(!target) return;
  target.textContent = formatTodayDate();
}

function parseBoardTimeValue(value){
  if(!value) return 0;
  const time = new Date(value).getTime();
  return Number.isNaN(time) ? 0 : time;
}

function localCalendarDayDiff(fromDate, toDate){
  const from = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
  const to = new Date(toDate.getFullYear(), toDate.getMonth(), toDate.getDate());
  return Math.round((to - from) / ANNOUNCEMENT_DAY);
}

function formatBoardTime(value){
  if(!value) return "";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "";

  const now = new Date();
  const diff = now.getTime() - date.getTime();
  const minute = 60 * 1000;
  const hour = 60 * minute;
  const dayDiff = localCalendarDayDiff(date, now);

  if(diff >= 0 && diff < minute) return textValue("time_just_now") || "刚刚";
  if(dayDiff === 0 && diff >= 0 && diff < hour) return `${Math.max(1, Math.floor(diff / minute))}分钟前`;
  if(dayDiff === 0 && diff >= 0) return `${Math.max(1, Math.floor(diff / hour))}小时前`;
  if(dayDiff === 1) return textValue("time_yesterday") || "昨天";
  if(dayDiff > 1 && dayDiff < 7) return `${dayDiff}天前`;

  return `${date.getMonth() + 1}/${date.getDate()}`;
}

function isAnnouncementActiveByTime(row){
  const now = Date.now();
  const start = parseBoardTimeValue(row?.start_at);
  const end = parseBoardTimeValue(row?.end_at);
  if(start && start > now) return false;
  if(end && end < now) return false;
  return true;
}

function isCategoryCloseEnough(row){
  const category = boardCategoryMap.get(String(row?.category || ""));
  const beforeDays = category?.display_before_days;
  if(beforeDays === null || beforeDays === undefined) return true;

  const now = Date.now();
  const start = parseBoardTimeValue(row?.start_at || row?.event_at || row?.created_at);
  const end = parseBoardTimeValue(row?.end_at);

  if(end && end < now) return false;
  if(!start) return false;
  if(start <= now) return true;

  return start - now <= Number(beforeDays) * ANNOUNCEMENT_DAY;
}

function getEventSortTime(row){
  return parseBoardTimeValue(row?.event_at || row?.created_at);
}

function getCategoryOrder(category){
  const item = boardCategoryMap.get(String(category || ""));
  return item ? Number(item.display_order ?? 999) : 999;
}

function normalizeBoardRows(rows){
  const safeRows = Array.isArray(rows) ? rows : [];
  return safeRows
    .filter(row => row && row.category)
    .filter(row => boardCategoryMap.has(String(row.category || "")))
    .filter(row => String(row.content || row.title || "").trim())
    .filter(row => isAnnouncementActiveByTime(row))
    .filter(row => isCategoryCloseEnough(row))
    .sort((a, b) => {
      const catDiff = getCategoryOrder(a.category) - getCategoryOrder(b.category);
      if(catDiff !== 0) return catDiff;
      if(Boolean(a.is_pinned) !== Boolean(b.is_pinned)) return a.is_pinned ? -1 : 1;
      const priorityDiff = Number(a.priority ?? 50) - Number(b.priority ?? 50);
      if(priorityDiff !== 0) return priorityDiff;
      return getEventSortTime(b) - getEventSortTime(a);
    });
}

function groupBoardRows(rows){
  const groups = new Map();
  boardCategories.forEach(category => groups.set(category.key, []));
  normalizeBoardRows(rows).forEach(row => groups.get(String(row.category || ""))?.push(row));
  return groups;
}

function renderBoardLine(row, options = {}){
  const category = boardCategoryMap.get(String(row.category || ""));
  const content = escapeHtml(row.content || row.title || "");

  // 公告正文必须来自数据库的 title/content/link_url。
  // 前端不再为“游戏通知”“发歌提醒”等事件拼接文案或补游戏名。
  const shouldShowTime = category ? category.show_time !== false : true;
  const meta = shouldShowTime ? formatBoardTime(row.event_at || row.created_at) : "";
  const time = meta ? `<em>${escapeHtml(meta)}</em>` : "";

  const safeTarget = normalizeInternalLink(row.link_url);
  const itemLink = options.showItemLink && safeTarget
    ? `<a class="boardGoBtn boardGoBtnInline" href="${escapeHtml(safeTarget)}">${escapeHtml(requirePageText("go_button"))}</a>`
    : "";

  return `<li>${content}${time}${itemLink}</li>`;
}

function getBoardLink(category){
  if(!category?.show_go_button) return "";
  const safeTarget = normalizeInternalLink(category.default_link_url);
  if(!safeTarget) return "";
  return `<a class="boardGoBtn" href="${escapeHtml(safeTarget)}">${escapeHtml(requirePageText("go_button"))}</a>`;
}

function renderCategorySections(rows, options = {}){
  const groups = groupBoardRows(rows);
  const excluded = new Set(options.excludeKeys || []);
  const included = new Set(options.includeKeys || []);
  const excludedClasses = new Set(options.excludeClasses || []);
  const includedClasses = new Set(options.includeClasses || []);
  const hasIncludeFilter = included.size > 0 || includedClasses.size > 0;
  return boardCategories.map(category => {
    if(excluded.has(category.key) || excludedClasses.has(category.cls)) return "";
    if(hasIncludeFilter && !included.has(category.key) && !includedClasses.has(category.cls)) return "";
    const items = groups.get(category.key) || [];
    if(!items.length) return "";

    const visibleItems = items.slice(0, category.limit || 3);
    const meta = category.meta ? `<small>${escapeHtml(category.meta)}</small>` : "";
    const link = getBoardLink(category);
    const headerAside = link || meta;
    const showItemLink = Boolean(category.show_go_button && !link);
    const titleText = `${category.icon ? `${category.icon} ` : ""}${category.label}`;

    return `
      <article class="boardSection boardMiniCard ${escapeHtml(category.cls)}" data-category="${escapeHtml(category.key)}">
        <h2 class="boardSectionTitle">
          <span>${escapeHtml(titleText)}</span>
          ${headerAside}
        </h2>
        <ul class="boardList">
          ${visibleItems.map(item => renderBoardLine(item, { showItemLink })).join("")}
        </ul>
      </article>
    `;
  }).filter(Boolean).join("");
}

function formatMonthDayText(date){
  const d = calendarDateValue(date);
  return d ? `${d.getMonth() + 1}/${d.getDate()}` : "--";
}

function calendarProjectsForMonth(){
  const year = calendarCursor.getFullYear();
  const month = calendarCursor.getMonth();
  return livingCalendarProjects.map(project => {
    const date = calendarDateValue(project.release_date);
    if(!date) return null;
    if(date.getFullYear() !== year || date.getMonth() !== month) return null;
    return {
      project,
      date,
      singers:calendarProjectSingerNames(project),
      published:calendarProjectIsPublished(project)
    };
  }).filter(Boolean).sort((a, b) => {
    const diff = a.date - b.date;
    if(diff !== 0) return diff;
    return String(a.project?.project_name || "").localeCompare(String(b.project?.project_name || ""), "zh-CN");
  });
}

function calendarBirthdaysForMonth(){
  const month = calendarCursor.getMonth() + 1;
  return livingCalendarBirthdays
    .filter(member => member.birthday_month === month)
    .slice()
    .sort((a, b) => a.birthday_day - b.birthday_day || String(a.nickname || "").localeCompare(String(b.nickname || ""), "zh-CN"));
}

function calendarHolidaysForMonth(){
  const year = calendarCursor.getFullYear();
  const month = calendarCursor.getMonth();
  const lastDay = new Date(year, month + 1, 0).getDate();
  const result = [];
  for(let day = 1; day <= lastDay; day += 1){
    const date = new Date(year, month, day);
    calendarHolidayItems(date).forEach(item => {
      result.push({ date, ...item });
    });
  }
  return result;
}

function upcomingReleaseProjects(limit = 4){
  const today = new Date();
  today.setHours(0,0,0,0);

  return livingCalendarProjects.map(project => {
    const date = calendarDateValue(project.release_date);
    if(!date) return null;
    const localDate = calendarLocalDay(date);
    return {
      project,
      date:localDate,
      singers:calendarProjectSingerNames(project),
      published:calendarProjectIsPublished(project)
    };
  }).filter(item => item && !item.published && item.date >= today)
    .sort((a,b) => a.date - b.date || String(a.project?.project_name || "").localeCompare(String(b.project?.project_name || ""), "zh-CN"))
    .slice(0, limit);
}

function buildReleaseNoteCard(rows = []){
  // 发歌提醒只保留一句话。优先使用数据库 living_announcements_feed 中原有文案，
  // 避免与日历里的“日期 + 歌名 + 参与人”详细信息重复。
  const normalizedRows = normalizeBoardRows(rows);
  const releaseRow = normalizedRows.find(row => {
    const category = boardCategoryMap.get(String(row?.category || ""));
    return category?.key === "release" || category?.cls === "release" || String(row?.event_kind || "") === "song_release";
  });

  let sentence = String(releaseRow?.content || releaseRow?.title || "").trim();

  // 数据库当前没有可展示的发歌公告时，仅用最近一首计划做一句话兜底。
  if(!sentence){
    const next = upcomingReleaseProjects(1)[0];
    if(next){
      const title = String(next.project?.project_name || "未命名作品").trim();
      sentence = `《${title}》将在 ${next.date.getMonth() + 1}月${next.date.getDate()}日 发布，记得来听~`;
    }else{
      sentence = "近期没有新的发歌安排。";
    }
  }

  return `
    <article class="boardSection boardReleaseNoteCard">
      <h2 class="boardSectionTitle"><span>♪ 发歌提醒</span></h2>
      <div class="boardReleaseSentence">${escapeHtml(sentence)}</div>
    </article>
  `;
}

function buildBirthdayCard(){
  const items = calendarBirthdaysForMonth();

          <div class="boardMiniBody">

      ${body}
    </article>
  `;
}

function buildHolidayCard(){
  const items = calendarHolidaysForMonth();
  const body = items.length
    ? `<ul class="boardMiniList">${items.map(item => `
        <li>
          <span class="boardDateBadge">${escapeHtml(formatMonthDayText(item.date))}</span>

function buildCalendarViewHtml(){
  const year = calendarCursor.getFullYear();
  const month = calendarCursor.getMonth();
  const first = new Date(year, month, 1);
  const leadingBlankCount = (first.getDay() + 6) % 7;
  const monthDayCount = new Date(year, month + 1, 0).getDate();
  const totalCells = Math.ceil((leadingBlankCount + monthDayCount) / 7) * 7;
  const todayKey = calendarDayKey(new Date());
  const projectMap = calendarProjectItemsByDay();

  const days = Array.from({length:totalCells}, (_,index) => {
    const dayNumber = index - leadingBlankCount + 1;
    if(dayNumber < 1 || dayNumber > monthDayCount){
      return `<div class="calendarDay is-empty" aria-hidden="true"></div>`;
    }

    const date = new Date(year, month, dayNumber);
    const key = calendarDayKey(date);
    const items = [
      ...(projectMap.get(key) || []),
      ...calendarBirthdayItems(date),
      ...calendarHolidayItems(date)
    ];
    const visible = items.map(renderCalendarItem).join("");
    const classes = ["calendarDay"];

    // 日历维持七列对齐，但每个日期格按内容密度决定自身高度。
    // 同一周由内容最多的日期决定行高；空日期不会再被强行拉满。
    if(items.length === 0){
      classes.push("is-quiet");
    }else if(items.length === 1){
      classes.push("has-one-event");
    }else if(items.length === 2){
      classes.push("has-two-events");
    }else{
      classes.push("has-many-events");
    }

    if(key === todayKey) classes.push("is-today");
    const dayLabel = `${year}年${month + 1}月${dayNumber}日`;
    return `<div class="${classes.join(" ")}" data-event-count="${items.length}" aria-label="${dayLabel}"><span class="calendarDayNum">${dayNumber}</span><div class="calendarEvents">${visible}</div></div>`;
  }).join("");

  return `
    <div class="calendarView">
      <div class="calendarToolbar">
        <button class="calendarNavBtn" type="button" data-calendar-shift="-1" aria-label="上个月">‹</button>
        <strong class="calendarMonthLabel">${year}年${month + 1}月</strong>
        <button class="calendarNavBtn" type="button" data-calendar-shift="1" aria-label="下个月">›</button>
        <button class="calendarTodayBtn" type="button" data-calendar-today>今天</button>
      </div>
      <div class="calendarWeekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="calendarGrid">${days}</div>
    </div>`;
}


function boardCategoryMatches(category, keyOrClass){
  if(!category) return false;
  const target = String(keyOrClass || "").trim();
  return category.key === target || category.cls === target;
}

function findBoardCategory(keyOrClass){
  return boardCategories.find(category => boardCategoryMatches(category, keyOrClass)) || null;
}

function compactGameAnnouncementRows(items){
  const rows = Array.isArray(items) ? items : [];
  const grouped = new Map();
  const leftovers = [];

  rows.forEach(row => {
    const content = String(row?.content || row?.title || "").trim();
    const match = content.match(/^\s*([^：:]+)[：:]\s*(.+?)模式已开始[，,]?\s*快来加入吧[。！!]?\s*$/);
    if(!match){
      leftovers.push(row);
      return;
    }

    const gameName = match[1].trim();
    const modeName = match[2].trim();
    if(!gameName || !modeName){
      leftovers.push(row);
      return;
    }

    if(!grouped.has(gameName)){
      grouped.set(gameName, {
        ...row,
        _gameName:gameName,
        _modes:[],
        _latestTime:getEventSortTime(row)
      });
    }

    const group = grouped.get(gameName);
    if(!group._modes.includes(modeName)) group._modes.push(modeName);
    if(getEventSortTime(row) > group._latestTime){
      group._latestTime = getEventSortTime(row);
      group.event_at = row.event_at;
      group.created_at = row.created_at;
      group.link_url = row.link_url || group.link_url;
    }
  });

  const merged = Array.from(grouped.values()).map(group => ({
    ...group,
    content:`${group._gameName}：${group._modes.join("、")}模式已开始，快来加入吧。`
  }));

  return [...merged, ...leftovers]
    .sort((a,b) => getEventSortTime(b) - getEventSortTime(a))
    .slice(0, 3);
}

function compactMemberAnnouncementRows(items){
  const rows = Array.isArray(items) ? items : [];
  const achievementGroups = new Map();
  const others = [];

  rows.forEach(row => {
    const content = String(row?.content || row?.title || "").trim();
    const match = content.match(/^\s*(.+?)\s*达成成就[「『](.+?)[」』][。！!]?\s*$/);
    if(!match){
      others.push(row);
      return;
    }

    const name = match[1].trim();
    const achievement = match[2].trim();
    if(!name || !achievement){
      others.push(row);
      return;
    }

    if(!achievementGroups.has(name)){
      achievementGroups.set(name, {
        ...row,
        _name:name,
        _achievements:[],
        _latestTime:getEventSortTime(row)
      });
    }

    const group = achievementGroups.get(name);
    if(!group._achievements.includes(achievement)) group._achievements.push(achievement);
    if(getEventSortTime(row) > group._latestTime){
      group._latestTime = getEventSortTime(row);
      group.event_at = row.event_at;
      group.created_at = row.created_at;
      group.link_url = row.link_url || group.link_url;
    }
  });

  const mergedAchievements = Array.from(achievementGroups.values()).map(group => {
    const names = group._achievements.map(item => `「${item}」`).join("、");
    return {
      ...group,
      content:`${group._name} 达成成就 ${names}`
    };
  });

  return [...mergedAchievements, ...others]
    .sort((a,b) => getEventSortTime(b) - getEventSortTime(a))
    .slice(0, 3);
}

function renderCompactSideCategory(rows, keyOrClass){
  const category = findBoardCategory(keyOrClass);
  if(!category) return "";

  const groups = groupBoardRows(rows);
  const originalItems = groups.get(category.key) || [];
  if(!originalItems.length) return "";

  const items = boardCategoryMatches(category, "game")
    ? compactGameAnnouncementRows(originalItems)
    : boardCategoryMatches(category, "member")
      ? compactMemberAnnouncementRows(originalItems)
      : originalItems.slice(0, Math.min(category.limit || 3, 3));

  const meta = category.meta ? `<small>${escapeHtml(category.meta)}</small>` : "";
  const link = getBoardLink(category);
  const headerAside = link || meta;
  const showItemLink = Boolean(category.show_go_button && !link);
  const titleText = `${category.icon ? `${category.icon} ` : ""}${category.label}`;

  return `
    <article class="boardSection boardMiniCard ${escapeHtml(category.cls)}" data-category="${escapeHtml(category.key)}">
      <h2 class="boardSectionTitle">
        <span>${escapeHtml(titleText)}</span>
        ${headerAside}
      </h2>
      <ul class="boardList">
        ${items.map(item => renderBoardLine(item, { showItemLink })).join("")}
      </ul>
    </article>
  `;
}

function renderCompactSideNotices(rows){
  return [
    renderCompactSideCategory(rows, "game"),
    renderCompactSideCategory(rows, "member")
  ].filter(Boolean).join("");
}

function renderLivingBoard(rows){
  if(!livingBoardLayout) return;

  // 右侧公告采用紧凑版：游戏同类模式合并，成员同人成就合并。
  const sideNoticesHtml = renderCompactSideNotices(rows);

          ${buildCalendarViewHtml()}

        ${buildReleaseNoteCard(rows)}

      <aside class="wallSideColumn" aria-label="客厅公告">
        ${sideNoticesHtml || `<article class="boardSection boardMiniCard quick"><h2 class="boardSectionTitle"><span>📌 公告</span></h2><div class="boardMiniEmpty">暂时没有新的动态。</div></article>`}
      </aside>

      ${otherNoticesHtml ? `<div class="wallOtherNotices">${otherNoticesHtml}</div>` : ""}
    </div>
  `;
}

function calendarDateValue(value){
  if(!value) return null;
  if(value instanceof Date){
    return Number.isNaN(value.getTime()) ? null : new Date(value);
  }

  const text = String(value).trim();
  const dateOnly = text.match(/^(\d{4})-(\d{2})-(\d{2})(?:$|T|\s)/);
  if(dateOnly){
    const date = new Date(Number(dateOnly[1]), Number(dateOnly[2]) - 1, Number(dateOnly[3]));
    return Number.isNaN(date.getTime()) ? null : date;
  }

  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? null : date;
}

function calendarLocalDay(date){
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function calendarDayKey(date){
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

function uniqueCalendarNames(values){
  const seen = new Set();
  const result = [];
  (values || []).forEach(value => {
    const name = String(value || "").trim();
    if(!name || seen.has(name)) return;
    seen.add(name);
    result.push(name);
  });
  return result;
}

function calendarProjectSingerNames(project){
  const names = [];
  (project?.singers || []).forEach(item => names.push(item.member_name));
  (project?.parts || []).forEach(item => names.push(item.assigned_member_name));
  return uniqueCalendarNames(names);
}

function calendarProjectIsPublished(project){
  const singerQuota = Math.max(1, Number(project?.participant_count ?? project?.singer_quota) || 1);
  const singers = Array.isArray(project?.singers) ? project.singers : [];
  const parts = Array.isArray(project?.parts) ? project.parts : [];
  const singerCount = singers.length;
  const normalizedPartNames = parts.map(part => String(part?.original_name || "").trim());
  const filledPartNames = normalizedPartNames.filter(Boolean);
  const hasPartText = filledPartNames.length > 0;
  const hasEnoughPartRows = parts.length >= singerQuota;
  const hasPlaceholderPart = filledPartNames.some(name => /^(待分配|未分配)$/i.test(name));
  const hasIncompletePartRow = parts.some(part => {
    const originalName = String(part?.original_name || "").trim();
    const assignedId = String(part?.assigned_member_id || "").trim();
    return !originalName || !assignedId;
  });
  const assignedIds = new Set(parts.map(part => String(part?.assigned_member_id || "").trim()).filter(Boolean));
  const allSubmitted = singerCount > 0 && singers.every(item => !!item.is_submitted);

  return Boolean(
    String(project?.display_link || "").trim() &&
    singerCount >= singerQuota &&
    String(project?.project_tone || "").trim() &&
    hasPartText &&
    hasEnoughPartRows &&
    !hasPlaceholderPart &&
    !hasIncompletePartRow &&
    assignedIds.size >= singerCount &&
    allSubmitted &&
    String(project?.producer_member_id || "").trim() &&
    project?.producer_completed &&
    String(project?.release_date || "").trim()
  );
}

async function fetchLivingCalendarData(){
  if(!client) throw new Error("Supabase 客户端没有加载成功");

  const user = currentMember || getStoredUser();
  if(!user?.member_id || !user?.member_code){
    throw new Error("请重新登录后再试");
  }

  const { data, error } = await client.rpc("get_living_calendar_data", {
    p_member_id:user.member_id,
    p_member_code:user.member_code
  });

  if(error) throw error;

  const payload = data && typeof data === "object" && !Array.isArray(data)
    ? data
    : (Array.isArray(data) && data[0] && typeof data[0] === "object" ? data[0] : {});

  const birthdays = (Array.isArray(payload.member_birthdays) ? payload.member_birthdays : []).map(row => ({
    id:String(row?.id || ""),
    nickname:String(row?.nickname || "").trim(),
    role:String(row?.role || "").trim().toLowerCase(),
    birthday_month:Number(row?.birthday_month),
    birthday_day:Number(row?.birthday_day)
  })).filter(row =>
    row.nickname &&
    row.birthday_month >= 1 && row.birthday_month <= 12 &&
    row.birthday_day >= 1 && row.birthday_day <= 31
  );

  const idolBirthdays = (Array.isArray(payload.idol_birthdays) ? payload.idol_birthdays : []).map((row, index) => ({
    id:String(row?.id || ""),
    idol_name:String(row?.idol_name || "").trim(),
    birthday_month:Number(row?.birthday_month),
    birthday_day:Number(row?.birthday_day),
    sort_order:Number.isFinite(Number(row?.sort_order)) ? Number(row.sort_order) : index + 1
  })).filter(row =>
    row.idol_name &&
    row.birthday_month >= 1 && row.birthday_month <= 12 &&
    row.birthday_day >= 1 && row.birthday_day <= 31
  );

  const cancelledStatuses = new Set(["已取消", "取消", "作废"]);
  const projects = (Array.isArray(payload.projects) ? payload.projects : []).map(project => ({
    ...project,
    id:String(project?.id || ""),
    project_name:String(project?.project_name || project?.task_name || "").trim(),
    release_date:project?.release_date || null,
    singers:Array.isArray(project?.singers) ? project.singers.map(item => ({
      member_id:String(item?.member_id || ""),
      member_name:String(item?.member_name || "").trim(),
      is_submitted:!!item?.is_submitted
    })) : [],
    parts:Array.isArray(project?.parts) ? project.parts.map(item => ({
      part_order:Number(item?.part_order || 0),
      original_name:String(item?.original_name || "").trim(),
      assigned_member_id:String(item?.assigned_member_id || ""),
      assigned_member_name:String(item?.assigned_member_name || "").trim()
    })).sort((a,b) => a.part_order - b.part_order) : []
  })).filter(project =>
    project.project_name &&
    calendarDateValue(project.release_date) &&
    !cancelledStatuses.has(String(project.status || "").trim())
  );

  console.info("[客厅日历] 数据读取完成", {
    projects:projects.length,
    memberBirthdays:birthdays.length,
    idolBirthdays:idolBirthdays.length
  });

  return { projects, birthdays, idolBirthdays };
}

function qingmingDay(year){
  if(year >= 2000 && year <= 2099){
    const y = year % 100;
    const corrections = {2008:-1};
    return Math.floor(y * 0.2422 + 4.81) - Math.floor(y / 4) + (corrections[year] || 0);
  }
  if(year >= 1900 && year <= 1999){
    const y = year % 100;
    return Math.floor(y * 0.2422 + 5.59) - Math.floor(y / 4);
  }
  return 5;
}

function nthWeekdayDay(year, monthIndex, weekday, nth){
  const firstWeekday = new Date(year, monthIndex, 1).getDay();
  return 1 + ((weekday - firstWeekday + 7) % 7) + (nth - 1) * 7;
}

let chineseCalendarFormatter = null;
try{
  chineseCalendarFormatter = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", { month:"numeric", day:"numeric" });
}catch(err){
  console.warn("当前浏览器不支持农历节日计算：", err);
}

function chineseCalendarMonthDay(date){
  if(!chineseCalendarFormatter) return null;
  try{
    const parts = chineseCalendarFormatter.formatToParts(date);
    const month = Number(parts.find(part => part.type === "month")?.value);
    const day = Number(parts.find(part => part.type === "day")?.value);
    return Number.isFinite(month) && Number.isFinite(day) ? { month, day } : null;
  }catch(err){
    return null;
  }
}

function calendarHolidayItems(date){
  const year = date.getFullYear();
  const month = date.getMonth() + 1;
  const day = date.getDate();
  const items = [];

  const fixed = new Map([
    ["1-1", { icon:"🎆", label:"元旦" }],
    ["2-14", { icon:"💝", label:"情人节" }],
    ["6-1", { icon:"🎈", label:"儿童节" }],
    ["7-4", { flag:"us", label:"美国独立日" }],
    ["10-1", { flag:"cn", label:"中国国庆节" }],
    ["10-31", { icon:"🎃", label:"万圣节" }],
    ["12-24", { icon:"✨", label:"平安夜" }],
    ["12-25", { icon:"🎄", label:"圣诞节" }]
  ]);

  const fixedItem = fixed.get(`${month}-${day}`);
  if(fixedItem) items.push({ type:"holiday", ...fixedItem });

  if(month === 4 && day === qingmingDay(year)){
    items.push({ type:"holiday", icon:"🌿", label:"清明节" });
  }

  if(month === 11 && day === nthWeekdayDay(year, 10, 4, 4)){
    items.push({ type:"holiday", icon:"🦃", label:"感恩节" });
  }

  const lunar = chineseCalendarMonthDay(date);
  if(lunar){
    const lunarLabels = new Map([
      ["1-1", { icon:"🧧", label:"春节" }],
      ["1-15", { icon:"🏮", label:"元宵节" }],
      ["5-5", { icon:"🐉", label:"端午节" }],
      ["7-7", { icon:"🌌", label:"七夕" }],
      ["8-15", { icon:"🥮", label:"中秋节" }]
    ]);
    const lunarItem = lunarLabels.get(`${lunar.month}-${lunar.day}`);
    if(lunarItem) items.push({ type:"holiday", ...lunarItem });
  }

  return items;
}

function holidayPlainText(item){
  return `${item?.icon ? `${item.icon} ` : ""}${String(item?.label || "").trim()}`.trim();
}

function renderHolidayLabel(item){
  const label = escapeHtml(String(item?.label || "").trim());
  if(item?.flag === "cn"){
    return `<span class="calendarHolidayLine"><span class="calendarFlag calendarFlag-cn" aria-hidden="true"></span><span class="calendarHolidayText">${label}</span></span>`;
  }
  if(item?.flag === "us"){
    return `<span class="calendarHolidayLine"><span class="calendarFlag calendarFlag-us" aria-hidden="true"></span><span class="calendarHolidayText">${label}</span></span>`;
  }
  const icon = item?.icon ? `<span aria-hidden="true">${escapeHtml(item.icon)}</span>` : "";
  return `<span class="calendarHolidayLine">${icon}<span class="calendarHolidayText">${label}</span></span>`;
}

function calendarBirthdayItems(date){
  const month = date.getMonth() + 1;
  const day = date.getDate();

  const memberItems = livingCalendarBirthdays
    .filter(member => member.birthday_month === month && member.birthday_day === day)
    .map(member => ({
      type:"birthday",
      birthdayKind:"member",
      label:`🎂 ${member.nickname} 生日`,
      member
    }));

  const idolItems = livingCalendarIdolBirthdays
    .filter(idol => idol.birthday_month === month && idol.birthday_day === day)
    .sort((a,b) => a.sort_order - b.sort_order || String(a.idol_name).localeCompare(String(b.idol_name), "zh-CN"))
    .map(idol => ({
      type:"birthday",
      birthdayKind:"idol",
      label:`🎂 ${idol.idol_name} 生日`,
      idol
    }));

  return [...memberItems, ...idolItems];
}

function calendarProjectItemsByDay(){
  const grouped = new Map();
  livingCalendarProjects.forEach(project => {
    const date = calendarDateValue(project.release_date);
    if(!date) return;
    const key = calendarDayKey(calendarLocalDay(date));
    if(!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push({
      type:"project",
      project,
      published:calendarProjectIsPublished(project),
      singers:calendarProjectSingerNames(project)
    });
  });
  return grouped;
}

function renderCalendarItem(item){
  if(item.type === "project"){
    const project = item.project || {};
    const title = String(project.project_name || "未命名作品").trim();
    const singers = (item.singers || []).join(" · ");
    const target = normalizeInternalLink(project.display_link);
    const tag = target ? "a" : "span";
    const href = target ? ` href="${escapeHtml(target)}"` : "";
    const stateClass = item.published ? "is-published" : "is-planned";
    const stateTitle = item.published ? "已发布" : "预计发布";
    const singersHtml = singers ? `<span class="calendarSongSingers">${escapeHtml(singers)}</span>` : "";
    const tooltip = singers ? `${stateTitle}｜${title}｜${singers}` : `${stateTitle}｜${title}`;
    return `<${tag} class="calendarEvent is-project ${stateClass}"${href} title="${escapeHtml(tooltip)}"><span class="calendarSongTitle">${escapeHtml(title)}</span>${singersHtml}</${tag}>`;
  }

  if(item.type === "birthday"){
    const extraClass = item.birthdayKind === "idol" ? " is-idol-birthday" : "";
    return `<span class="calendarEvent is-birthday${extraClass}" title="${escapeHtml(item.label)}">${escapeHtml(item.label)}</span>`;
  }

  const holidayTitle = holidayPlainText(item);
  return `<span class="calendarEvent is-holiday" title="${escapeHtml(holidayTitle)}">${renderHolidayLabel(item)}</span>`;
}

function renderLivingCalendar(){
  renderLivingBoard(livingAnnouncements);
}

function renderLivingView(){
  renderLivingBoard(livingAnnouncements);
}

function setBoardView(){
  renderLivingView();
}

async function fetchLivingAnnouncements(){
  if(!client) throw new Error("Supabase 客户端没有加载成功");

  const fields = "id, category, event_kind, event_scope, title, content, priority, is_pinned, link_url, event_at, start_at, end_at, created_at";
  const { data, error } = await client
    .from("living_announcements_feed")
    .select(fields)
    .order("created_at", { ascending:false });

  if(error) throw error;
  return data || [];
}

async function loadLivingBoard(){
  if(!livingBoardLayout) return;
  livingBoardLayout.innerHTML = `<div class="boardLoading">${escapeHtml(requirePageText("loading_text"))}</div>`;
  try{
    const [announcements, calendarData] = await Promise.all([
      fetchLivingAnnouncements(),
      fetchLivingCalendarData()
    ]);
    livingAnnouncements = announcements;
    livingCalendarProjects = calendarData.projects || [];
    livingCalendarBirthdays = calendarData.birthdays || [];
    livingCalendarIdolBirthdays = calendarData.idolBirthdays || [];
    renderLivingView();
  }catch(err){
    console.error("读取客厅公告栏失败：", err);
    livingAnnouncements = [];
    livingCalendarProjects = [];
    livingCalendarBirthdays = [];
    livingCalendarIdolBirthdays = [];
    livingBoardLayout.innerHTML = `<div class="boardError">${escapeHtml(requirePageText("error_text"))}<br>${escapeHtml(requirePageText("database_error_hint"))}</div>`;
  }
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function setNoticeCount(count){
  const n = Number(count) || 0;
  if(identityNoticeCount) identityNoticeCount.textContent = n > 99 ? "99+" : String(n);
  identityNoticeBtn?.classList.toggle("hasNotice", n > 0);
}

function formatNoticeTime(value){
  if(!value) return "";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "";
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  const hour = String(date.getHours()).padStart(2, "0");
  const minute = String(date.getMinutes()).padStart(2, "0");
  return `${month}-${day} ${hour}:${minute}`;
}

function renderNoticeList(items){
  const list = Array.isArray(items) ? items : [];
  currentNoticeIds = list.map(item => String(item.notice_id || item.id || "").trim()).filter(Boolean);
  if(identityNoticeClear) identityNoticeClear.disabled = currentNoticeIds.length === 0;

  if(!list.length){
    identityNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(textValue("notice_empty") || "暂时还没有新的通知")}</div>`;
    setNoticeCount(0);
    return;
  }

  identityNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => `
        <div class="siteNoticeItem">
          <div class="siteNoticeItemTitle">${escapeHtml(item.title || textValue("notice_default_title") || "站内通知")}</div>
          <div class="siteNoticeItemDesc">${escapeHtml(item.message || item.desc || "")}</div>
          ${item.created_at ? `<div class="siteNoticeItemTime">${escapeHtml(formatNoticeTime(item.created_at))}</div>` : ""}
        </div>
      `).join("")}
    </div>
  `;
  setNoticeCount(list.length);
}

async function loadMemberNotifications(){
  const user = currentMember;
  if(!client || !user?.member_id || !user?.member_code){
    renderNoticeList([]);
    return;
  }

  identityNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(textValue("loading_text") || "读取中")}</div>`;
  try{
    const { data, error } = await client.rpc("get_member_notifications", {
      p_member_id:user.member_id,
      p_member_code:user.member_code,
      p_channel:"site",
      p_limit:20
    });
    if(error) throw error;
    renderNoticeList(Array.isArray(data) ? data : []);
  }catch(err){
    console.error("读取成员通知失败：", err);
    currentNoticeIds = [];
    setNoticeCount(0);
    if(identityNoticeClear) identityNoticeClear.disabled = true;
    identityNoticeContent.innerHTML = `<div class="siteNoticeError">通知读取失败，请稍后再试。</div>`;
  }
}

async function markAllNoticesRead(){
  const user = currentMember;
  if(!client || !user?.member_id || !user?.member_code || !currentNoticeIds.length) return;
  if(identityNoticeClear) identityNoticeClear.disabled = true;
  try{
    const { error } = await client.rpc("mark_member_notifications_read", {
      p_member_id:user.member_id,
      p_member_code:user.member_code,
      p_notice_ids:currentNoticeIds
    });
    if(error) throw error;
    await loadMemberNotifications();
  }catch(err){
    console.error("通知标记已读失败：", err);
    if(identityNoticeClear) identityNoticeClear.disabled = false;
  }
}

async function initLivingPage(){
  setupRoomNav(CURRENT_ROOM);
  refreshTemplateLayout();

  try{
    await loadLivingPageConfig();
    updateBoardTodayDate();
    try{
      await fetchCurrentMember();
    }catch(identityError){
      console.error("读取当前身份失败：", identityError);
      clearStoredLogin();
    }
    updateIdentityUI();

    if(!isLoggedIn()){
      renderNoticeList([]);
      livingBoardLayout.innerHTML = `<div class="boardEmpty">${escapeHtml(requirePageText("empty_text"))}</div>`;
      openLogin("", true);
    }else{
      await Promise.all([loadLivingBoard(), loadMemberNotifications()]);
    }
  }catch(err){
    renderLivingConfigError(err);
  }

  livingBoardLayout?.addEventListener("click", event => {
    const shiftBtn = event.target.closest("[data-calendar-shift]");
    if(shiftBtn){
      calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + Number(shiftBtn.dataset.calendarShift || 0), 1);
      renderLivingView();
      return;
    }
    if(event.target.closest("[data-calendar-today]")){
      const now = new Date();
      calendarCursor = new Date(now.getFullYear(), now.getMonth(), 1);
      renderLivingView();
    }
  });

  identityNoticeBtn?.addEventListener("click", event => {
    event.stopPropagation();
    if(!isLoggedIn()){
      openLogin("", true);
      return;
    }
    const willShow = !identityNoticePanel.classList.contains("show");
    if(willShow){
      positionIdentityNoticePanel();
      identityNoticePanel.classList.add("show");
      loadMemberNotifications();
    }else{
      identityNoticePanel.classList.remove("show");
    }
  });

  identityNoticeClear?.addEventListener("click", event => {
    event.stopPropagation();
    markAllNoticesRead();
  });

  identityAuthBtn?.addEventListener("click", event => {
    event.stopPropagation();
    if(isLoggedIn()) logout();
    else openLogin("", true);
  });

  document.getElementById("livingLoginClose")?.addEventListener("click", () => closeLogin(true));
  document.getElementById("livingLoginToggle")?.addEventListener("click", toggleLoginCode);
  document.getElementById("livingLoginSubmit")?.addEventListener("click", submitLogin);
  document.getElementById("livingRegisterLink")?.addEventListener("click", goRegisterFromLiving);
  [livingLoginNickname, livingLoginCode].forEach(input => input?.addEventListener("keydown", event => {
    if(event.key === "Enter") submitLogin();
  }));
  livingLoginMask?.addEventListener("click", event => {
    if(event.target === livingLoginMask) closeLogin(true);
  });

  document.addEventListener("click", event => {
    if(identityNoticePanel && identityNoticeBtn){
      if(identityNoticePanel.contains(event.target) || identityNoticeBtn.contains(event.target)) return;
      identityNoticePanel.classList.remove("show");
    }
  });

  document.addEventListener("keydown", event => {
    if(event.key === "Escape"){
      closeLogin(true);
      identityNoticePanel?.classList.remove("show");
    }
  });
}

document.addEventListener("DOMContentLoaded", initLivingPage);

window.addEventListener("resize", refreshTemplateLayout);
window.addEventListener("orientationchange", () => setTimeout(refreshTemplateLayout, 80));
window.addEventListener("pageshow", async () => {
  try{ await fetchCurrentMember(); }catch(_){ clearStoredLogin(); }
  updateIdentityUI();
  if(isLoggedIn()) loadMemberNotifications();
});

window.addEventListener("storage", event => {
  if(Object.values(STORAGE_KEYS).includes(event.key) || ["room10_user","room10_current_user","currentUser"].includes(event.key)){
    updateIdentityUI();
    loadMemberNotifications();
  }
});

if(img && img.complete && img.naturalWidth){
  refreshTemplateLayout();
}else if(img){
  img.addEventListener("load", refreshTemplateLayout, { once:true });
}

setTimeout(refreshTemplateLayout, 80);
