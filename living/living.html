<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜客厅</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box;}

:root{
  /* =========================================================
     全站底图 / 组件缩放
     - 541px 及以上：#overlay 绑定到底图实际显示区域
     - 540px 以下：手机流式布局
  ========================================================= */
  --ui-scale:1;
  --room-nav-scale:var(--ui-scale);
  --identity-scale:var(--ui-scale);

  /* =========================================================
     身份组件坐标
     位置参考最新身份组件测试版
  ========================================================= */
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);
  --identity-name-y:0em;
  --identity-separator-y:0em;
  --identity-role-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;

  /* 手机版身份文字独立校准：昵称 / 分隔符 / 身份 / 铃铛 / 登录按钮 */
  --identity-mobile-name-y:0em;
  --identity-mobile-separator-y:0em;
  --identity-mobile-role-y:0em;
  --identity-mobile-notice-y:0em;
  --identity-mobile-button-y:0em;
  --identity-notice-mobile-top:58px;

  /* =========================================================
     房间按钮坐标
     默认位置参考游戏房顶部安全区：
     避开左上门牌，也避开右侧身份组件。
     9 个按钮固定显示，等宽、等高、等间隔。
  ========================================================= */
  /*
     外框位置改为底图百分比绑定，不再使用 px × scale。
     原来的 px × scale 在 541px–650px 会被最小缩放值卡住，导致整排按钮相对底图向右漂移。
     百分比只控制按钮外框位置和尺寸；--room-nav-scale 只控制内部文字、圆角、阴影和特效。
  */
  --room-nav-top:6.35%;
  --room-nav-start-left:25.83%;
  --room-nav-btn-width:4.72%;
  --room-nav-btn-height:5.10%;
  --room-nav-gap:0.486%;

  --room-nav-hall-left:var(--room-nav-start-left);
  --room-nav-living-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 1);
  --room-nav-manager-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 2);
  --room-nav-honor-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 3);
  --room-nav-studio-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 4);
  --room-nav-game-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 5);
  --room-nav-dorm-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 6);
  --room-nav-flower-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 7);
  --room-nav-pets-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 8);

  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);

}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:#5b4632;
  background:#e7dfd4;
}

button{font-family:inherit;}
.hidden{display:none!important;}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 16% 12%,rgba(255,246,238,.72),transparent 34%),
    radial-gradient(circle at 86% 18%,rgba(226,215,201,.42),transparent 38%),
    linear-gradient(180deg,#efe7dc 0%,#e5d8c8 100%);
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
}

#overlay *{pointer-events:auto;}

/* 修复：#overlay * 的 pointer-events:auto 会把整层 roomNavLayer 变成透明遮罩，挡住主面板按钮 */
#overlay .roomNavLayer{
  pointer-events:none!important;
}

#overlay .roomNavLayer .navBtn{
  pointer-events:auto!important;
}

#overlay .roomIdentity{
  pointer-events:none!important;
}

#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{
  pointer-events:auto!important;
}


/* =========================================================
   房间按钮组件
========================================================= */
.roomNavLayer{
  position:absolute;
  inset:0;
  z-index:55;
  pointer-events:none;
  --s:var(--room-nav-scale,1);
  --nav-btn-radius:calc(15px * var(--s));
  --nav-btn-font:calc(15px * var(--s));
  --nav-btn-border:calc(1px * var(--s));
  --nav-btn-shadow-y:calc(3px * var(--s));
  --nav-btn-shadow-blur:calc(8px * var(--s));
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:absolute;
  top:var(--room-nav-top);
  width:var(--room-nav-btn-width);
  height:var(--room-nav-btn-height);
  min-width:0;
  min-height:0;
  padding:0;
  border-radius:var(--nav-btn-radius);
  color:var(--room-nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.56), transparent 40%),
    radial-gradient(circle at 78% 74%, var(--room-nav-wash), transparent 48%),
    linear-gradient(180deg, var(--room-nav-paper) 0%, var(--room-nav-paper-2) 100%);
  border:var(--nav-btn-border) solid var(--room-nav-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.64),
    0 calc(2px * var(--s)) calc(7px * var(--s)) rgba(96,70,48,.10);
  text-shadow:0 calc(1px * var(--s)) 0 rgba(255,255,255,.38);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  pointer-events:auto;
}

.navBtn[data-room="hall"]{left:var(--room-nav-hall-left);}
.navBtn[data-room="living"]{left:var(--room-nav-living-left);}
.navBtn[data-room="manager"]{left:var(--room-nav-manager-left);}
.navBtn[data-room="honor"]{left:var(--room-nav-honor-left);}
.navBtn[data-room="studio"]{left:var(--room-nav-studio-left);}
.navBtn[data-room="game"]{left:var(--room-nav-game-left);}
.navBtn[data-room="dorm"]{left:var(--room-nav-dorm-left);}
.navBtn[data-room="flower"]{left:var(--room-nav-flower-left);}
.navBtn[data-room="pets"]{left:var(--room-nav-pets-left);}

.navBtn:not(.is-current):hover,
.navBtn:not(.is-current):focus-visible{
  color:#5f3d22;
  background:
    radial-gradient(circle at 20% 24%, rgba(255,255,255,.66), transparent 42%),
    radial-gradient(circle at 80% 78%, rgba(207,170,143,.24), transparent 50%),
    linear-gradient(180deg, rgba(255,252,246,.88) 0%, rgba(239,226,210,.82) 100%);
  border-color:rgba(151,112,84,.36);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.70),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.12);
  filter:saturate(1.02);
}

.navBtn.is-current{
  cursor:default;
  color:var(--room-nav-current-text);
  background:
    radial-gradient(circle at 22% 22%, rgba(255,255,255,.62), transparent 42%),
    radial-gradient(circle at 80% 80%, rgba(190,151,126,.26), transparent 50%),
    linear-gradient(180deg, rgba(246,235,222,.94) 0%, var(--room-nav-current-bg) 100%);
  border-color:var(--room-nav-current-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.68),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.13),
    0 0 0 calc(2px * var(--s)) rgba(255,253,248,.46);
  filter:none;
}

.navLabel{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.82),
    0 0 calc(8px * var(--s)) rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{ transform:translateY(calc(4px * var(--s))) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(calc(-5px * var(--s))) rotate(6deg) scale(1); opacity:.76; }
}
@keyframes navFloatB{
  0%,100%{ transform:translateY(calc(5px * var(--s))) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(calc(-6px * var(--s))) rotate(-7deg) scale(1); opacity:.68; }
}
@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(calc(6px * var(--s))) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(calc(-6px * var(--s))) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:not(.is-current):hover .navEffectA,
.navBtn:not(.is-current):focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectB,
.navBtn:not(.is-current):focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectC,
.navBtn:not(.is-current):focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}
.navBtn.is-current .navEffect{display:none;}

.navBtn[data-room="hall"] .navEffect{color:rgba(255,205,96,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.95),0 0 calc(10px * var(--s)) rgba(255,215,105,.62);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="honor"] .navEffect{color:rgba(205,143,45,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.92),0 0 calc(8px * var(--s)) rgba(255,220,130,.52);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}

/* =========================================================
   身份组件
========================================================= */
.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}

.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}

.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}

.identityNamePart{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  line-height:1;
  white-space:nowrap;
  font:inherit;
}

.identityNickname{transform:translateY(var(--identity-name-y));}
.identitySeparator{
  margin:0 .08em;
  color:rgba(111,87,70,.78);
  font-weight:800;
  transform:translateY(var(--identity-separator-y));
}
.identityRole{transform:translateY(var(--identity-role-y));}

.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}

.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:950;
  text-align:left;
}

.identityNoticePanel.show{display:block;}

.identityNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
  margin-bottom:calc(10px * var(--s));
}

.identityNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}

/* =========================================================
   页面主内容占位：正式页面替换这里即可
========================================================= */
.templateMainPanel{
  position:absolute;
  left:8.8%;
  top:22.2%;
  width:60.8%;
  height:58.5%;
  z-index:20;
  border-radius:calc(24px * var(--ui-scale));
  background:rgba(255,250,240,.58);
  border:calc(1px * var(--ui-scale)) dashed rgba(170,122,82,.24);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:calc(12px * var(--ui-scale));
  color:#8a6544;
  font-weight:900;
  font-size:calc(18px * var(--ui-scale));
  text-align:center;
  padding:calc(20px * var(--ui-scale));
}

.templateMainPanel p{
  margin:0;
  max-width:calc(620px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  line-height:1.7;
  font-weight:800;
  color:#9a7656;
}


.templatePreviewNote{
  margin:0;
  max-width:calc(650px * var(--ui-scale));
  font-size:calc(12px * var(--ui-scale));
  line-height:1.65;
  font-weight:800;
  color:#9a7656;
}

.templatePreviewBtns{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:calc(8px * var(--ui-scale));
  max-width:calc(720px * var(--ui-scale));
}

.templatePreviewBtn{
  min-height:calc(34px * var(--ui-scale));
  padding:0 calc(14px * var(--ui-scale));
  border:1px solid rgba(153,104,62,.22);
  border-radius:999px;
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.58), transparent 42%),
    linear-gradient(180deg, rgba(255,252,247,.88), rgba(238,226,214,.82));
  color:#6f5746;
  font-size:calc(12px * var(--ui-scale));
  font-weight:950;
  cursor:pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.70),
    0 calc(3px * var(--ui-scale)) calc(9px * var(--ui-scale)) rgba(96,70,48,.08);
}

.templatePreviewBtn:hover{
  filter:brightness(1.02);
}




/* =========================================================
   手机布局
========================================================= */
@media(max-width:540px){
  html,body{
    overflow-x:hidden;
    overflow-y:auto;
    height:auto;
    min-height:100%;
  }

  #room{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    height:auto;
    display:block;
    overflow:visible;
    padding:10px 12px 14px;
    background:
      linear-gradient(rgba(242,236,229,.74), rgba(238,231,222,.92)),
      #e7dfd4;
  }

  #bgFrame{display:none;}

  #overlay{
    position:relative;
    left:auto!important;
    top:auto!important;
    width:100%!important;

    radial-gradient(ellipse at 12% 18%, rgba(255,222,202,.28), transparent 38%),
    radial-gradient(ellipse at 88% 20%, rgba(214,231,255,.25), transparent 40%),
    radial-gradient(ellipse at 72% 88%, rgba(217,239,210,.23), transparent 42%),

  border:calc(8px * var(--ui-scale)) solid rgba(214,184,145,.62);

    0 calc(16px * var(--ui-scale)) calc(34px * var(--ui-scale)) rgba(92,65,38,.14),
    inset 0 1px 0 rgba(255,255,255,.86);

  overflow:hidden;

}

#livingPanel::before{
  content:"";
  position:absolute;
  pointer-events:none;
  inset:calc(15px * var(--ui-scale));
  z-index:0;
  border-radius:calc(22px * var(--ui-scale));
  background:
    repeating-linear-gradient(
      180deg,
      rgba(174,137,91,.030) 0,
      rgba(174,137,91,.030) 1px,
      transparent 1px,
      transparent calc(28px * var(--ui-scale))
    ),
    radial-gradient(circle at 18% 78%, rgba(236,186,204,.10), transparent 24%),
    radial-gradient(circle at 84% 62%, rgba(170,211,238,.10), transparent 26%);
  opacity:.86;
  animation:boardPaperBreath 9s ease-in-out infinite;
}

@keyframes boardPaperBreath{
  0%,100%{ opacity:.76; filter:saturate(.96) brightness(1); }
  50%{ opacity:.98; filter:saturate(1.08) brightness(1.012); }
}

.boardHeader{
  position:relative;

}

#livingPanelTitle{
  margin:0;

  font-size:calc(29px * var(--ui-scale));

}

.boardHeaderNote{
  display:inline-flex;
  align-items:center;
  gap:calc(6px * var(--ui-scale));
  color:#b98658;
  font-size:calc(12px * var(--ui-scale));
  font-weight:900;

}

.boardHeaderNote::before{
  content:"";
  width:calc(12px * var(--ui-scale));
  height:calc(12px * var(--ui-scale));
  border-radius:999px;
  background:radial-gradient(circle at 35% 30%, #fff7e5, #d79d68 60%, #a86c42);
  box-shadow:0 1px 5px rgba(105,66,34,.23);
}

.boardFloatLayer{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.boardFloat{
  position:absolute;
  z-index:1;
  font-weight:900;
  line-height:1;
  opacity:.70;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.62));
  animation:boardFloatDrift 5.8s ease-in-out infinite, boardFloatTwinkle 2.8s ease-in-out infinite;
}

.boardFloat:nth-child(1){ left:7%; top:19%; font-size:calc(24px * var(--ui-scale)); animation-delay:-.7s, -.4s; color:rgba(214,144,166,.68); }
.boardFloat:nth-child(2){ left:88%; top:17%; font-size:calc(23px * var(--ui-scale)); animation-delay:-2.4s, -1.1s; color:rgba(167,130,196,.64); }
.boardFloat:nth-child(3){ left:72%; top:82%; font-size:calc(27px * var(--ui-scale)); animation-delay:-4.1s, -2.7s; color:rgba(117,171,123,.65); }
.boardFloat:nth-child(4){ left:14%; top:85%; font-size:calc(22px * var(--ui-scale)); animation-delay:-5.3s, -1.9s; color:rgba(220,152,132,.62); }
.boardFloat:nth-child(5){ left:47%; top:17%; font-size:calc(21px * var(--ui-scale)); animation-delay:-3.2s, -3.1s; color:rgba(222,168,76,.64); }
.boardFloat:nth-child(6){ left:90%; top:56%; font-size:calc(30px * var(--ui-scale)); animation-delay:-5.8s, -.8s; color:rgba(118,174,205,.60); }
.boardFloat:nth-child(7){ left:30%; top:86%; font-size:calc(21px * var(--ui-scale)); animation-delay:-1.7s, -2.2s; color:rgba(210,136,166,.58); }
.boardFloat:nth-child(8){ left:57%; top:82%; font-size:calc(24px * var(--ui-scale)); animation-delay:-3.9s, -1.6s; color:rgba(235,183,88,.58); }
.boardFloat:nth-child(9){ left:20%; top:54%; font-size:calc(26px * var(--ui-scale)); animation-delay:-6.1s, -2.9s; color:rgba(137,179,142,.56); }
.boardFloat:nth-child(10){ left:83%; top:38%; font-size:calc(22px * var(--ui-scale)); animation-delay:-1.2s, -2.4s; color:rgba(223,151,181,.54); }
.boardFloat:nth-child(11){ left:38%; top:56%; font-size:calc(28px * var(--ui-scale)); animation-delay:-4.7s, -.9s; color:rgba(137,179,205,.52); }
.boardFloat:nth-child(12){ left:62%; top:29%; font-size:calc(22px * var(--ui-scale)); animation-delay:-2.8s, -1.7s; color:rgba(119,175,135,.54); }
.boardFloat:nth-child(13){ left:9%; top:42%; font-size:calc(20px * var(--ui-scale)); animation-delay:-3.5s, -2.1s; color:rgba(237,184,91,.55); }
.boardFloat:nth-child(14){ left:49%; top:74%; font-size:calc(21px * var(--ui-scale)); animation-delay:-5.2s, -1.2s; color:rgba(172,132,198,.52); }
.boardFloat:nth-child(15){ left:93%; top:78%; font-size:calc(20px * var(--ui-scale)); animation-delay:-6.2s, -2.6s; color:rgba(220,152,132,.52); }

@keyframes boardFloatDrift{
  0%,100%{ transform:translate3d(0,0,0) rotate(-10deg) scale(.94); }
  35%{ transform:translate3d(calc(9px * var(--ui-scale)), calc(-20px * var(--ui-scale)), 0) rotate(10deg) scale(1.10); }
  70%{ transform:translate3d(calc(-7px * var(--ui-scale)), calc(8px * var(--ui-scale)), 0) rotate(-4deg) scale(.98); }
}

@keyframes boardFloatTwinkle{
  0%,100%{ opacity:.36; }
  45%{ opacity:.78; }
  65%{ opacity:.58; }
}

#livingBoard{
  position:relative;
  z-index:2;
  flex:1 1 auto;
  height:auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:calc(5px * var(--ui-scale)) calc(5px * var(--ui-scale)) calc(7px * var(--ui-scale));
  scrollbar-width:thin;
  scrollbar-color:rgba(154,112,72,.24) transparent;
}

#livingBoard::-webkit-scrollbar{ width:6px; }
#livingBoard::-webkit-scrollbar-thumb{ background:rgba(154,112,72,.24); border-radius:999px; }

.boardLayout{
  position:relative;
  min-height:100%;
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  grid-auto-rows:min-content;
  grid-auto-flow:dense;
  align-content:start;
  gap:calc(12px * var(--ui-scale)) calc(12px * var(--ui-scale));
}

.boardLayout.is-compact{
  align-content:start;
}

.boardSection{
  position:relative;
  min-width:0;
  padding:calc(12px * var(--ui-scale)) calc(14px * var(--ui-scale));
  color:#765234;
  background:var(--section-bg, rgba(255,252,244,.46));
  border:1px solid var(--section-border, rgba(156,112,72,.16));
  border-radius:var(--section-radius, calc(17px * var(--ui-scale)));
  box-shadow:
    0 calc(6px * var(--ui-scale)) calc(14px * var(--ui-scale)) rgba(104,78,50,.055),
    inset 0 1px 0 rgba(255,255,255,.58);
  backdrop-filter:blur(1.2px);
  -webkit-backdrop-filter:blur(1.2px);
  transform:none;
  animation:sectionFloatIn .42s ease both, sectionBreath 7.2s ease-in-out infinite;
}

.boardSection:nth-child(2){ animation-delay:.04s, -1.6s; }
.boardSection:nth-child(3){ animation-delay:.08s, -3.1s; }
.boardSection:nth-child(4){ animation-delay:.12s, -2.2s; }
.boardSection:nth-child(5){ animation-delay:.16s, -4.2s; }
.boardSection:nth-child(6){ animation-delay:.20s, -5.1s; }

@keyframes sectionFloatIn{
  from{ opacity:0; transform:translateY(calc(8px * var(--ui-scale))); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes sectionBreath{
  0%,100%{ box-shadow:0 calc(6px * var(--ui-scale)) calc(14px * var(--ui-scale)) rgba(104,78,50,.055), inset 0 1px 0 rgba(255,255,255,.58); }
  50%{ box-shadow:0 calc(8px * var(--ui-scale)) calc(18px * var(--ui-scale)) rgba(104,78,50,.075), inset 0 1px 0 rgba(255,255,255,.68); }
}

.boardSection::before{
  content:"";
  position:absolute;
  left:calc(16px * var(--ui-scale));
  right:calc(16px * var(--ui-scale));
  top:calc(-4px * var(--ui-scale));
  height:calc(8px * var(--ui-scale));
  border-radius:999px;
  background:rgba(255,255,255,.42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.50);
}

.boardSectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:calc(8px * var(--ui-scale));
  margin:0 0 calc(6px * var(--ui-scale));
  color:#6f482b;
  font-size:calc(15px * var(--ui-scale));
  font-weight:900;
  line-height:1.2;
}

.boardSectionTitle span:first-child{
  display:inline-flex;
  align-items:center;
  gap:calc(5px * var(--ui-scale));
}

.boardSectionTitle small{
  flex:0 0 auto;
  color:#aa7b53;
  font-size:calc(11px * var(--ui-scale));
  font-weight:900;
}

.boardList{
  margin:0;
  padding:0;
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:calc(5px * var(--ui-scale));
}

.boardList li{
  position:relative;
  padding-left:calc(10px * var(--ui-scale));
  color:#795536;
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  line-height:1.45;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.boardList li::before{
  content:"";
  position:absolute;
  left:0;
  top:.62em;
  width:calc(4px * var(--ui-scale));
  height:calc(4px * var(--ui-scale));
  border-radius:999px;
  background:rgba(177,119,66,.38);
}

.boardList li strong{
  margin-right:calc(5px * var(--ui-scale));
  color:#8d623d;
  font-weight:900;
}

.boardList li em{
  margin-left:calc(8px * var(--ui-scale));
  color:#a17652;
  font-style:normal;
  font-size:calc(11px * var(--ui-scale));
  font-weight:900;
  white-space:nowrap;
}

.boardGoBtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:calc(3px * var(--ui-scale)) calc(9px * var(--ui-scale));
  border-radius:999px;
  color:#70452a;
  background:rgba(255,255,255,.58);
  border:1px dashed rgba(138,90,44,.22);
  font-size:calc(11px * var(--ui-scale));
  font-weight:900;
  line-height:1.2;
  text-decoration:none;
  white-space:nowrap;
}

.boardGoBtn:hover{
  background:rgba(255,255,255,.78);
  color:#5f351f;
}

.boardGoBtnInline{
  margin-left:calc(8px * var(--ui-scale));
  vertical-align:baseline;
}

.boardSection.release{
  order:2;
  width:auto;
  --section-bg:
    radial-gradient(circle at 18% 16%, rgba(255,255,255,.48), transparent 34%),
    linear-gradient(180deg, rgba(255,249,203,.72), rgba(255,244,173,.52));

  --section-radius:18px 23px 19px 25px / 20px 16px 23px 18px;

.boardSection.focus{

  --section-border:rgba(202,145,105,.24);
  --section-radius:23px 18px 25px 18px / 17px 22px 18px 24px;

.boardSection.game{

}

.boardSection.member{

.boardSection.pet{

    radial-gradient(circle at 22% 16%, rgba(255,255,255,.42), transparent 34%),

  --section-border:rgba(100,150,124,.24);
  --section-radius:25px 23px 19px 21px / 22px 22px 19px 20px;

.boardSection.quick{

    linear-gradient(180deg, rgba(255,228,239,.62), rgba(255,241,209,.48));
  --section-border:rgba(215,134,157,.20);
  --section-radius:22px 18px 24px 20px / 19px 24px 18px 23px;
}

.boardLayout.is-compact .boardSection{
  grid-column:auto;
  grid-row:auto;
}

/* 窄桌面内层保护：541px 以上仍保留桌面外框，只让公告栏内部改为单列，避免内容被两列挤碎 */
@container (max-width:460px){
  .boardLayout,
  .boardLayout.is-compact{
    grid-template-columns:1fr;
    grid-auto-flow:row;
    gap:calc(10px * var(--ui-scale));
  }

  .boardLayout.is-compact .boardSection{
    grid-column:auto;
    grid-row:auto;
  }
}

.boardEmpty,
.boardError,
.boardLoading{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%) rotate(-1deg);
  width:min(78%, calc(420px * var(--ui-scale)));
  padding:calc(18px * var(--ui-scale)) calc(20px * var(--ui-scale));
  border-radius:calc(20px * var(--ui-scale));
  background:rgba(255,250,239,.70);
  border:1px solid rgba(196,150,105,.18);
  color:#8b6646;
  font-size:calc(15px * var(--ui-scale));
  font-weight:900;
  line-height:1.65;
  text-align:center;
  box-shadow:0 calc(8px * var(--ui-scale)) calc(18px * var(--ui-scale)) rgba(104,78,50,.07);
}

#livingPanel{

/* =========================================================
   底图 overlay 同步：使用全站通用模板规则

function isMobileLayout(){
  return window.innerWidth <= 540;
}

function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";

  root.style.setProperty("--ui-scale","1");
  root.style.setProperty("--room-nav-scale","1");
  root.style.setProperty("--identity-scale","1");
  root.style.setProperty("--board-scale","1");
}

function syncOverlayToImage(){
  if(isMobileLayout()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.45, Math.min(3.2, displayWidth / 1440));
  const navScale = Math.max(0.38, Math.min(3.2, displayWidth / 1440));

  root.style.setProperty("--ui-scale", String(scale));
  root.style.setProperty("--room-nav-scale", String(navScale));
  root.style.setProperty("--identity-scale", String(scale));
  root.style.setProperty("--board-scale", String(scale));
}

function refreshTemplateLayout(){

function roleLabel(role){
  const map = {
    owner:"维修工",
    admin:"宿管",
    member:"房客",
    applying:"申请人",
    visitor:"参观者"
  };
  return map[String(role || "visitor").toLowerCase()] || "房客";
}

function getStoredUser(){
  const oldLoggedIn = localStorage.getItem("room10LoggedIn") === "true";
  const oldUser = localStorage.getItem("room10User") || "";
  const oldRole = localStorage.getItem("room10Role") || "";
  const oldMemberId = localStorage.getItem("room10MemberId") || "";

  if(oldLoggedIn && oldUser){
    return {
      nickname:oldUser,
      role:oldRole || "member",
      member_id:oldMemberId
    };
  }

  try{
    const raw =
      localStorage.getItem("room10_user") ||
      localStorage.getItem("room10_current_user") ||
      localStorage.getItem("currentUser");

    if(!raw) return null;

    const data = JSON.parse(raw);
    if(!data) return null;

    return {
      nickname:data.nickname || data.name || "",
      role:data.role || "",
      member_id:data.member_id || data.id || ""
    };
  }catch(err){
    return null;
  }
}

function isLoggedIn(){
  const user = getStoredUser();
  return !!(user && user.nickname);
}

function updateIdentityUI(){
  const user = getStoredUser();

  if(!identityNickname || !identitySeparator || !identityRole || !identityAuthBtn) return;

  if(!user || !user.nickname){
    identityNickname.textContent = "参观者";
    identitySeparator.classList.add("hidden");
    identityRole.classList.add("hidden");
    identityRole.textContent = "参观者";
    identityAuthBtn.querySelector(".identityAuthText").textContent = "登录";
    return;
  }

  identityNickname.textContent = user.nickname;
  identitySeparator.classList.remove("hidden");
  identityRole.classList.remove("hidden");
  identityRole.textContent = roleLabel(user.role);
  identityAuthBtn.querySelector(".identityAuthText").textContent = "登出";
}

  localStorage.removeItem("room10User");
  localStorage.removeItem("room10Role");
  localStorage.removeItem("room10MemberId");
  localStorage.removeItem("room10MemberCode");
  localStorage.removeItem("room10ApplicantSession");
  localStorage.removeItem("room10ApplicationDraft");

  localStorage.removeItem("room10_user");

function openLogin(targetPage = ""){

    cancelable:true

   房间跳转
========================================================= */
function getCurrentRole(){
  const user = getStoredUser();

}

function getManagerPageByRole(){
  const role = getCurrentRole();

  if(role === "owner") return "../manager/manager-owner.html";
  if(role === "admin") return "../manager/manager-admin.html";
  if(role === "member" || role === "applying") return "../manager/manager-member.html";

function normalizeInternalLink(url){
  const raw = String(url || "").trim();
  if(!raw) return "";

  if(/^https?:\/\//i.test(raw) || raw.startsWith("#") || raw.startsWith("mailto:")){
    return raw;
  }

  // 已经是跨文件夹相对路径时，保持数据库配置原样，避免前端二次改写。
  if(raw.startsWith("../")){
    return raw;
  }

  const clean = raw.replace(/^\.\//, "").replace(/^\//, "");

  const exactMap = {
    "index.html":"../index/index.html",
    "living.html":"../living/living.html",

    "honor.html":"../honor/honor.html",
    "honor-gallery.html":"../honor/honor-gallery.html",
    "honor-titles.html":"../honor/honor-titles.html",

    "game.html":"../game/game.html",
    "game-chain.html":"../game/game-chain.html",
    "game-time.html":"../game/game-time.html",
    "game-bomb.html":"../game/bomb/game-bomb.html",
    "bomb/game-bomb.html":"../game/bomb/game-bomb.html",

    "studio-todo.html":"../studio/studio-todo.html",
    "studio-project.html":"../studio/studio-project.html",
    "studio-submit.html":"../studio/studio-submit.html",

    "dorm.html":"../dorm/dorm.html",
    "flower.html":"../flower/flower.html",
    "pets.html":"../pet/pets.html",
    "pet.html":"../pet/pets.html",

    "manager-owner.html":"../manager/manager-owner.html",
    "manager-admin.html":"../manager/manager-admin.html",
    "manager-member.html":"../manager/manager-member.html",
    "manager-visitor.html":"../manager/manager-visitor.html"
  };

  return exactMap[clean] || raw;
}

function enterRoom(page, needLogin){
  const targetPage = normalizeInternalLink(page);
  if(!targetPage) return;

  if(needLogin && !isLoggedIn()){
    openLogin(targetPage);
    return;
  }

  if((targetPage.includes("/flower.html") || targetPage.includes("/pets.html")) && !isLoggedIn()){
    window.location.href = `${targetPage}?mode=guest`;
    return;
  }

  window.location.href = targetPage;
}

function setupRoomNav(currentRoom){
  const buttons = document.querySelectorAll(".navBtn");
  const current = String(currentRoom || "").trim();

  buttons.forEach(btn => {
    const room = btn.dataset.room || "";
    const isCurrent = room === current;

    btn.classList.toggle("is-current", isCurrent);

    if(isCurrent){
      btn.setAttribute("aria-current","page");
      btn.setAttribute("tabindex","-1");
    }else{
      btn.removeAttribute("aria-current");
      btn.removeAttribute("tabindex");
    }

    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();

      if(btn.classList.contains("is-current")) return;

      if(btn.dataset.manager === "true"){
        enterManagerRoom();
        return;
      }

      enterRoom(btn.dataset.url, btn.dataset.login === "true");
    });
  });
}

/* =========================================================
   手机通知框定位：使用全站通用模板规则
========================================================= */
function resetIdentityNoticePanelPosition(){
  if(!identityNoticePanel) return;

  [
    "position",
    "top",
    "left",
    "right",
    "width",
    "minWidth",
    "maxWidth",
    "maxHeight",
    "padding",
    "borderRadius",
    "zIndex",
    "boxSizing",
    "overflowX",
    "overflowY",
    "transformOrigin"
  ].forEach(prop => {
    identityNoticePanel.style[prop] = "";
  });

  root.style.setProperty("--identity-notice-mobile-top", "58px");
}

function positionIdentityNoticePanel(){
  if(!identityNoticePanel) return;

  if(!isMobileLayout()){
    if(identityNoticeWrap && identityNoticePanel.parentNode !== identityNoticeWrap){
      identityNoticeWrap.appendChild(identityNoticePanel);
    }
    resetIdentityNoticePanelPosition();
    return;
  }

  if(identityNoticePanel.parentNode !== document.body){
    document.body.appendChild(identityNoticePanel);
  }

  const bar = document.querySelector(".roomIdentityBar") || document.getElementById("roomIdentity") || identityNoticeBtn;
  const rect = bar ? bar.getBoundingClientRect() : { bottom: 50 };
  const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 640;
  const gap = 8;
  const safeTop = Math.max(8, Math.round(rect.bottom + gap));
  const top = Math.min(safeTop, Math.max(58, viewportHeight - 120));

  root.style.setProperty("--identity-notice-mobile-top", `${top}px`);
}

const REQUIRED_PAGE_TEXT_KEYS = [
  "panel_title",
  "panel_aria_label",
  "today_prefix",
  "loading_text",
  "empty_text",
  "error_text",
  "notice_title",
  "notice_empty",
  "notice_default_title",
  "go_button",
  "database_error_hint"
];

let boardCategories = [];
let boardCategoryMap = new Map();
let pageTexts = {};

const ANNOUNCEMENT_DAY = 24 * 60 * 60 * 1000;

function toInt(value, fallback){
  const n = Number(value);
  return Number.isFinite(n) ? Math.trunc(n) : fallback;
}

function toBool(value, fallback = false){
  if(value === true || value === false) return value;
  if(value === 1 || value === "1") return true;
  if(value === 0 || value === "0") return false;
  if(typeof value === "string"){
    const v = value.trim().toLowerCase();
    if(["true", "t", "yes", "y", "on"].includes(v)) return true;
    if(["false", "f", "no", "n", "off"].includes(v)) return false;
  }
  return fallback;
}

function textValue(key){
  return Object.prototype.hasOwnProperty.call(pageTexts, key) ? String(pageTexts[key] ?? "") : "";
}

function requirePageText(key){
  const value = textValue(key);
  if(!value){
    throw new Error(`缺少 page_text_settings 配置：living.${key}`);
  }
  return value;
}

function normalizeCategoryRow(row = {}){
  const key = String(row.category_key || row.key || row.category || "").trim();
  if(!key) return null;

  return {
    key,
    label:String(row.label || row.category_label || key).trim(),
    icon:String(row.icon || "").trim(),
    meta:String(row.meta_text || row.meta || "").trim(),
    cls:String(row.style_class || row.cls || "quick").trim(),
    limit:Math.max(1, toInt(row.item_limit ?? row.limit, 3)),
    display_order:toInt(row.display_order, 999),
    // 分区时间和“去看看”都以 living_board_categories 为准。
    // 不再按 category=game 做前端特殊兜底。
    show_time:toBool(row.show_time, true),
    show_go_button:toBool(row.show_go_button, false),
    default_link_url:String(row.default_link_url || "").trim(),
    display_before_days:row.display_before_days === null || row.display_before_days === undefined
      ? null
      : Math.max(0, toInt(row.display_before_days, 0))
  };
}

function setBoardCategories(categories){
  const normalized = (Array.isArray(categories) ? categories : [])
    .map(normalizeCategoryRow)
    .filter(Boolean)
    .sort((a, b) => {
      const orderDiff = Number(a.display_order || 999) - Number(b.display_order || 999);
      if(orderDiff !== 0) return orderDiff;
      return String(a.key).localeCompare(String(b.key));
    });

  if(!normalized.length){
    throw new Error("living_board_categories 没有可用配置");
  }

  boardCategories = normalized;
  boardCategoryMap = new Map(boardCategories.map(item => [item.key, item]));
}

async function fetchPageTexts(){
  if(!client) throw new Error("Supabase 客户端没有加载成功");

  const { data, error } = await client
    .from("page_text_settings")
    .select("text_key, text_value")
    .eq("page_key", "living")
    .eq("is_active", true);

  if(error) throw error;

  const loaded = {};
  (data || []).forEach(row => {
    const key = String(row.text_key || "").trim();
    if(!key) return;
    loaded[key] = String(row.text_value ?? "");
  });

  const missing = REQUIRED_PAGE_TEXT_KEYS.filter(key => !String(loaded[key] ?? "").trim());
  if(missing.length){
    throw new Error(`page_text_settings 缺少配置：${missing.join(", ")}`);
  }

  return loaded;
}

async function fetchBoardCategories(){
  if(!client) throw new Error("Supabase 客户端没有加载成功");

  const { data, error } = await client
    .from("living_board_categories")
    .select("category_key, label, icon, meta_text, style_class, display_order, item_limit, show_time, show_go_button, default_link_url, display_before_days, is_active")
    .eq("is_active", true)
    .order("display_order", { ascending:true });

  if(error) throw error;
  return data || [];
}

async function loadLivingPageConfig(){
  const [loadedTexts, loadedCategories] = await Promise.all([
    fetchPageTexts(),
    fetchBoardCategories()
  ]);

  pageTexts = loadedTexts;
  setBoardCategories(loadedCategories);
  applyLivingTextSettings();
}

function renderLivingConfigError(error){
  console.error("客厅页面配置读取失败：", error);

  const title = document.getElementById("livingPanelTitle");
  const panel = document.getElementById("livingPanel");
  const noticeTitle = document.querySelector(".identityNoticeTitle");
  const noticeContent = document.getElementById("identityNoticeContent");

  if(title) title.textContent = "读取错误";
  if(panel) panel.setAttribute("aria-label", "读取错误");
  if(noticeTitle) noticeTitle.textContent = "读取错误";
  if(noticeContent) noticeContent.innerHTML = '<div class="identityNoticeEmpty">读取错误</div>';
  if(livingBoardLayout) livingBoardLayout.innerHTML = '<div class="boardError">读取错误</div>';
}

function applyLivingTextSettings(){
  const title = document.getElementById("livingPanelTitle");
  const panel = document.getElementById("livingPanel");
  const noticeTitle = document.querySelector(".identityNoticeTitle");
  const noticeEmpty = document.querySelector(".identityNoticeEmpty");

  if(title) title.textContent = requirePageText("panel_title");
  if(panel) panel.setAttribute("aria-label", requirePageText("panel_aria_label"));
  if(noticeTitle) noticeTitle.textContent = requirePageText("notice_title");
  if(noticeEmpty) noticeEmpty.textContent = requirePageText("notice_empty");
}

function formatTodayDate(){
  const now = new Date();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const weekdays = ["周日","周一","周二","周三","周四","周五","周六"];
  return `${month}月${day}日 ${weekdays[now.getDay()]}`;
}

function updateBoardTodayDate(){
  const target = document.getElementById("boardTodayDate");
  if(!target) return;
  target.textContent = formatTodayDate();
}

function parseBoardTimeValue(value){
  if(!value) return 0;
  const time = new Date(value).getTime();
  return Number.isNaN(time) ? 0 : time;
}

function formatBoardTime(value){
  if(!value) return "";
  const time = new Date(value).getTime();
  if(Number.isNaN(time)) return "";

  const diff = Date.now() - time;
  const minute = 60 * 1000;
  const hour = 60 * minute;
  const day = 24 * hour;

  if(diff < minute) return "刚刚";
  if(diff < hour) return `${Math.max(1, Math.floor(diff / minute))}分钟前`;
  if(diff < day) return `${Math.floor(diff / hour)}小时前`;
  if(diff < day * 2) return "昨天";
  if(diff < day * 7) return `${Math.floor(diff / day)}天前`;

  const date = new Date(time);
  return `${date.getMonth() + 1}/${date.getDate()}`;
}

function isAnnouncementActiveByTime(row){
  const now = Date.now();
  const start = parseBoardTimeValue(row?.start_at);
  const end = parseBoardTimeValue(row?.end_at);
  if(start && start > now) return false;
  if(end && end < now) return false;
  return true;
}

function isCategoryCloseEnough(row){
  const category = boardCategoryMap.get(String(row?.category || ""));
  const beforeDays = category?.display_before_days;
  if(beforeDays === null || beforeDays === undefined) return true;

  const now = Date.now();
  const start = parseBoardTimeValue(row?.start_at || row?.event_at || row?.created_at);
  const end = parseBoardTimeValue(row?.end_at);

  if(end && end < now) return false;
  if(!start) return false;
  if(start <= now) return true;

  return start - now <= Number(beforeDays) * ANNOUNCEMENT_DAY;
}

function getEventSortTime(row){
  return parseBoardTimeValue(row?.event_at || row?.created_at);
}

function getCategoryOrder(category){
  const item = boardCategoryMap.get(String(category || ""));
  return item ? Number(item.display_order || 999) : 999;
}


function normalizeBoardRows(rows){
  const safeRows = Array.isArray(rows) ? rows : [];
  return safeRows
    .filter(row => row && row.category)
    .filter(row => boardCategoryMap.has(String(row.category || "")))
    .filter(row => String(row.content || row.title || "").trim())
    .filter(row => isAnnouncementActiveByTime(row))
    .filter(row => isCategoryCloseEnough(row))
    .sort((a, b) => {
      const catDiff = getCategoryOrder(a.category) - getCategoryOrder(b.category);
      if(catDiff !== 0) return catDiff;
      if(Boolean(a.is_pinned) !== Boolean(b.is_pinned)) return a.is_pinned ? -1 : 1;
      const priorityDiff = Number(a.priority || 50) - Number(b.priority || 50);
      if(priorityDiff !== 0) return priorityDiff;
      return getEventSortTime(b) - getEventSortTime(a);
    });
}

function groupBoardRows(rows){
  const groups = new Map();
  boardCategories.forEach(category => groups.set(category.key, []));
  normalizeBoardRows(rows).forEach(row => groups.get(String(row.category || ""))?.push(row));
  return groups;
}

function renderBoardLine(row, options = {}){
  const category = boardCategoryMap.get(String(row.category || ""));
  const content = escapeHtml(row.content || row.title || "");

  // 公告正文必须来自数据库的 title/content/link_url。
  // 前端不再为“游戏通知”“发歌提醒”等事件拼接文案或补游戏名。
  const shouldShowTime = category ? category.show_time !== false : true;
  const meta = shouldShowTime ? formatBoardTime(row.event_at || row.created_at) : "";
  const time = meta ? `<em>${escapeHtml(meta)}</em>` : "";

  const target = String(row.link_url || "").trim();
  const itemLink = options.showItemLink && target
    ? `<a class="boardGoBtn boardGoBtnInline" href="${escapeHtml(normalizeInternalLink(target))}">${escapeHtml(requirePageText("go_button"))}</a>`
    : "";

  return `<li>${content}${time}${itemLink}</li>`;
}

function getBoardLink(category){
  if(!category?.show_go_button) return "";
  const target = String(category.default_link_url || "").trim();
  if(!target) return "";
  return `<a class="boardGoBtn" href="${escapeHtml(normalizeInternalLink(target))}">${escapeHtml(requirePageText("go_button"))}</a>`;
}

function renderLivingBoard(rows){
  if(!livingBoardLayout) return;

  const groups = groupBoardRows(rows);
  const sections = boardCategories.map(category => {
    const items = groups.get(category.key) || [];
    if(!items.length) return "";

    const visibleItems = items.slice(0, category.limit || 3);
    const meta = category.meta ? `<small>${escapeHtml(category.meta)}</small>` : "";
    const link = getBoardLink(category);
    const headerAside = link || meta;
    const showItemLink = Boolean(category.show_go_button && !link);
    const titleText = `${category.icon ? `${category.icon} ` : ""}${category.label}`;

    return `
      <article class="boardSection ${escapeHtml(category.cls)}" data-category="${escapeHtml(category.key)}">
        <h2 class="boardSectionTitle">
          <span>${escapeHtml(titleText)}</span>
          ${headerAside}
        </h2>
        <ul class="boardList">
          ${visibleItems.map(item => renderBoardLine(item, { showItemLink })).join("")}
        </ul>
      </article>
    `;
  }).filter(Boolean);

  livingBoardLayout.classList.toggle("is-compact", sections.length > 0 && sections.length <= 3);

  if(!sections.length){
    livingBoardLayout.innerHTML = `<div class="boardEmpty">${escapeHtml(requirePageText("empty_text"))}</div>`;
  }else{
    livingBoardLayout.innerHTML = sections.join("");
  }
}

async function fetchLivingAnnouncements(){
  if(!client){
    throw new Error("Supabase 客户端没有加载成功");
  }

  const fields = "id, category, event_kind, event_scope, title, content, priority, is_pinned, link_url, event_at, start_at, end_at, created_at";
  const result = await client
    .from("living_announcements_feed")
    .select(fields)
    .order("created_at", { ascending:false });

  if(result.error) throw result.error;
  return result.data || [];
}

async function syncDailyMemberAnnouncements(){
  if(!client){
    throw new Error("Supabase 客户端没有加载成功");
  }

  const result = await client.rpc("sync_living_daily_member_announcements");

  if(result.error){
    throw result.error;
  }

  return result.data;
}

async function syncReleaseAnnouncements(){
  if(!client){
    throw new Error("Supabase 客户端没有加载成功");
  }

  const result = await client.rpc("sync_living_release_announcements");

  if(result.error){
    throw result.error;
  }

  return result.data;
}

async function syncLivingBeforeRead(){
  await syncDailyMemberAnnouncements();
  await syncReleaseAnnouncements();
}

async function loadLivingBoard(){
  if(!livingBoardLayout) return;
  livingBoardLayout.innerHTML = `<div class="boardLoading">${escapeHtml(requirePageText("loading_text"))}</div>`;
  try{
    await syncLivingBeforeRead();

    const rows = await fetchLivingAnnouncements();
    renderLivingBoard(rows);
  }catch(err){
    console.error("读取客厅公告栏失败：", err);
    livingBoardLayout.innerHTML = `<div class="boardError">${escapeHtml(requirePageText("error_text"))}<br>${escapeHtml(requirePageText("database_error_hint"))}</div>`;
  }
}


/* =========================================================
   提醒面板
========================================================= */
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function setNoticeCount(count){
  const n = Number(count) || 0;
  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);
}

function renderNoticeList(items){
  const list = Array.isArray(items) ? items : [];

  if(!list.length){
    siteNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(requirePageText("notice_empty"))}</div>`;
    setNoticeCount(0);
    return;
  }

  siteNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => `
        <div class="siteNoticeItem">
          <div class="siteNoticeItemTitle">${escapeHtml(item.title || requirePageText("notice_default_title"))}</div>
          <div class="siteNoticeItemDesc">${escapeHtml(item.desc || "")}</div>
        </div>
      `).join("")}
    </div>
  `;

  setNoticeCount(list.length);
}

function toggleNoticePanel(){
  siteNoticePanel.classList.toggle("show");
}

function closeNoticePanel(){
  siteNoticePanel.classList.remove("show");
}

function handleResponsiveLayout(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }
  syncOverlayToImage();
}


/* =========================================================
   初始化
========================================================= */
function initLivingPage(){
  setupRoomNav(CURRENT_ROOM);
  updateBoardTodayDate();
  updateIdentityUI();
  loadLivingPageConfig()
    .then(() => {
      renderNoticeList([]);
      loadLivingBoard();
    })
    .catch(renderLivingConfigError);
  refreshTemplateLayout();

  if(identityNoticeBtn){
    identityNoticeBtn.addEventListener("click", event => {
      event.stopPropagation();
      const willShow = !identityNoticePanel.classList.contains("show");

      if(willShow){
        positionIdentityNoticePanel();
        identityNoticePanel.classList.add("show");
      }else{
        identityNoticePanel.classList.remove("show");
      }
    });
  }

  if(identityAuthBtn){
    identityAuthBtn.addEventListener("click", event => {
      event.stopPropagation();

      if(isLoggedIn()){
        logout();
        return;
      }

      openLogin();
    });
  }

  document.addEventListener("click", event => {
    if(identityNoticePanel && identityNoticeBtn){
      if(identityNoticePanel.contains(event.target) || identityNoticeBtn.contains(event.target)) return;
      identityNoticePanel.classList.remove("show");
    }
  });
}

document.addEventListener("DOMContentLoaded", initLivingPage);

window.addEventListener("resize", refreshTemplateLayout);
window.addEventListener("orientationchange", () => {
  setTimeout(refreshTemplateLayout, 80);
});

window.addEventListener("storage", event => {
  if(
    event.key === "room10LoggedIn" ||
    event.key === "room10User" ||
    event.key === "room10Role" ||
    event.key === "room10MemberId" ||
    event.key === "room10_user" ||
    event.key === "room10_current_user" ||
    event.key === "currentUser"
  ){
    updateIdentityUI();
  }
});

if(img && img.complete && img.naturalWidth){
  refreshTemplateLayout();
}else if(img){
  img.addEventListener("load", refreshTemplateLayout, { once:true });
}

setTimeout(refreshTemplateLayout, 80);

</script>
