<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>十号房｜脸萌挑战</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --bg1:#fff3e0;
  --bg2:#f8e3c8;
  --text:#5b3e28;
  --text2:#7d5c3c;
  --line:rgba(255,255,255,.78);

  /* 绿色正确框：更细、更实心 */
  --ok:#79b36b;
  --okBg:rgba(196,234,186,.78);

  --bad:#d86a6a;
  --badBg:rgba(255,193,193,.42);
  --zoneHover:rgba(255,145,40,.42);
  --zoneHoverStroke:#d96a00;
  --select:#f1b94f;
  --selectBg:rgba(255,218,120,.34);

  /* 小屏裁切参数：裁掉左侧空白，只保留右侧主体 */
  --cropScale:1.724137931;
  --cropShift:-72.4137931%;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:linear-gradient(to right, var(--bg1), var(--bg2));
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text);
}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#bgShade{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(
      circle at center,
      rgba(0,0,0,0) 56%,
      rgba(210,186,160,0.10) 72%,
      rgba(190,160,130,0.16) 86%,
      rgba(170,138,108,0.22) 100%
    );
}

#stage{
  position:relative;
  width:fit-content;
  height:fit-content;
  max-width:100vw;
  max-height:100vh;
  z-index:2;
}

#playArea{
  position:relative;
  width:fit-content;
  height:fit-content;
  line-height:0;
}

#viewport{
  position:relative;
  display:block;
  line-height:0;
}

#fullLayer{
  position:relative;
  display:block;
  line-height:0;
}

#bg{
  display:block;
  width:auto;
  height:auto;
  max-width:100vw;
  max-height:100vh;
  position:relative;
  z-index:0;
  -webkit-user-drag:none;
  user-select:none;
}

#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:4;
  overflow:visible;
}

#labelLayer{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

/* 左侧主面板 */
#leftPanel{
  position:absolute;
  left:2.2%;
  top:3%;
  width:30%;
  min-width:330px;
  max-width:430px;
  height:94%;
  z-index:6;
  pointer-events:auto;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.42) 0%,
      rgba(255,255,255,.30) 45%,
      rgba(255,255,255,.18) 100%
    );
  backdrop-filter:blur(16px) saturate(120%);
  -webkit-backdrop-filter:blur(16px) saturate(120%);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:
    0 12px 34px rgba(92,63,37,.15),
    inset 0 1px 0 rgba(255,255,255,.92),
    inset 0 -2px 8px rgba(255,255,255,.12);
  display:flex;
  flex-direction:column;
  padding:14px 12px 12px;
  gap:10px;
}

#titleRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

#gameTitle{
  font-size:24px;
  font-weight:900;
  color:var(--text);
  line-height:1.1;
  margin:0;
}

#leaderboardOpenBtn{
  flex:0 0 auto;
  height:30px;
  padding:0 12px;
  border:none;
  border-radius:999px;
  background:rgba(255,246,232,.96);
  color:#6a4b2f;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  box-shadow:
    0 6px 16px rgba(92,63,37,.14),
    inset 0 1px 0 rgba(255,255,255,.88);
  transition:transform .18s ease, background .18s ease;
  font-family:inherit;
}

#leaderboardOpenBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,250,242,.99);
}

#gameSub{
  font-size:11px;
  line-height:1.5;
  color:var(--text2);
  margin:0;
}

#layoutHint{
  display:none;
}

/* 名字区 */
#nameListWrap{
  flex:1;
  min-height:0;
  overflow:auto;
  padding-right:2px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
}

#nameListWrap::-webkit-scrollbar{
  width:7px;
}
#nameListWrap::-webkit-scrollbar-thumb{
  background:rgba(131,96,63,.28);
  border-radius:999px;
}

#nameList{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:6px;
}

.nameCard{
  user-select:none;
  -webkit-user-select:none;
  cursor:grab;
  padding:6px 4px;
  border-radius:10px;
  font-size:11px;
  font-weight:800;
  color:#6a4b2f;
  text-align:center;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  background:rgba(255,249,240,.94);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    0 4px 12px rgba(92,63,37,.12),
    inset 0 1px 0 rgba(255,255,255,.88);
  transition:
    transform .15s ease,
    box-shadow .15s ease,
    opacity .15s ease,
    background .15s ease,
    border-color .15s ease;
  touch-action:manipulation;
}

.nameCard:hover{
  transform:translateY(-1px);
  box-shadow:
    0 6px 16px rgba(92,63,37,.16),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.nameCard:active{
  cursor:grabbing;
}

.nameCard.correct{
  background:rgba(233,248,231,.96);
  color:#4c7d45;
  opacity:.82;
  cursor:default;
}

.nameCard.dragging{
  opacity:.55;
}

.nameCard.selected{
  background:rgba(255,249,232,.98);
  border-color:rgba(241,185,79,.95);
  box-shadow:
    0 0 0 2px rgba(241,185,79,.45),
    0 6px 16px rgba(92,63,37,.16),
    inset 0 1px 0 rgba(255,255,255,.92);
  transform:translateY(-1px);
}

@keyframes flashBad{
  0%{box-shadow:0 0 0 rgba(216,106,106,0);}
  50%{box-shadow:0 0 0 3px rgba(216,106,106,.35);}
  100%{box-shadow:0 0 0 rgba(216,106,106,0);}
}
.nameCard.bad{
  animation:flashBad .45s ease;
}

/* 底部信息框 */
#infoBox{
  flex:0 0 auto;
  padding:10px 10px 10px;
  background:rgba(255,250,242,.76);
  border:1px solid rgba(255,255,255,.86);
  border-radius:16px;
  color:var(--text);
  box-shadow:
    0 6px 16px rgba(92,63,37,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.statusRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-size:12px;
  line-height:1.5;
}

.statusRow b{
  color:var(--text);
}

#resultText{
  margin-top:7px;
  font-size:13px;
  font-weight:800;
  color:var(--text);
  min-height:19px;
}

#bottomBtns{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.ctrlBtn{
  flex:1;
  height:38px;
  border:none;
  border-radius:999px;
  background:rgba(255,246,232,.96);
  color:#6a4b2f;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  box-shadow:
    0 6px 18px rgba(92,63,37,.16),
    inset 0 1px 0 rgba(255,255,255,.88);
  transition:transform .18s ease, background .18s ease;
}

.ctrlBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,250,242,.99);
}

/* 热区 */
.dropZone{
  fill:rgba(255,176,72,.18);
  stroke:rgba(235,120,20,.55);
  stroke-width:.55;
  stroke-dasharray:1.4 1.1;
  rx:1.2;
  ry:1.2;
  transition:.18s;
  cursor:pointer;
  vector-effect:non-scaling-stroke;
}

.dropZone.hover{
  fill:var(--zoneHover);
  stroke:var(--zoneHoverStroke);
  stroke-width:.8;
}

.dropZone.correct{
  fill:var(--okBg);
  stroke:var(--ok);
  stroke-width:.52;
  stroke-dasharray:none;
}

.dropZone.wrong{
  fill:var(--badBg);
  stroke:var(--bad);
  stroke-width:.84;
}

.dropZone.selected{
  fill:var(--selectBg);
  stroke:var(--select);
  stroke-width:1.05;
  stroke-dasharray:none;
}

/* 白底：更高一点 */
.nameLabel{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
  background:rgba(255,248,238,.97);
  border:1px solid rgba(255,255,255,.95);
  border-radius:999px;
  box-shadow:
    0 2px 6px rgba(92,63,37,.08),
    inset 0 1px 0 rgba(255,255,255,.9);
  color:#4f3a29;
  font-weight:900;
  line-height:1;
  padding:1px 0.12em 0;
  word-break:normal;
  letter-spacing:0;
  transform:translateZ(0);
  font-stretch:normal;
}

@keyframes shakeZone{
  0%{transform:translateX(0);}
  20%{transform:translateX(-1.1px);}
  40%{transform:translateX(1.1px);}
  60%{transform:translateX(-1px);}
  80%{transform:translateX(.9px);}
  100%{transform:translateX(0);}
}
.shake{
  animation:shakeZone .36s ease;
}


.hidden{display:none !important;}

/* 挑战结束后排行榜弹窗 */
#finishMask{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(70,45,24,.22);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

#finishCard{
  position:relative;
  width:min(92vw, 470px);
  max-height:min(86vh, 690px);
  overflow:auto;
  padding:18px 18px 16px;
  border-radius:24px;
  background:rgba(255,249,240,.98);
  border:1px solid rgba(255,255,255,.86);
  box-shadow:
    0 18px 46px rgba(92,63,37,.20),
    inset 0 1px 0 rgba(255,255,255,.92);
  color:var(--text);
}


#finishCard.leaderboard-only .finishSummary,
#finishCard.leaderboard-only #finishMessage{
  display:none;
}

#finishCard.leaderboard-only .leaderboardTitle{
  margin-top:0;
}

#finishCard.leaderboard-only .finishBtn:first-child{
  display:none;
}


#finishCloseBtn{
  position:absolute;
  top:12px;
  right:12px;
  width:32px;
  height:32px;
  border:none;
  border-radius:999px;
  background:rgba(255,246,232,.96);
  color:#6a4b2f;
  font-size:18px;
  font-weight:900;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 5px 14px rgba(92,63,37,.14),
    inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .18s ease, background .18s ease;
}

#finishCloseBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,250,242,.99);
}

.finishTitle{
  margin:0 38px 8px;
  font-size:22px;
  font-weight:900;
  line-height:1.2;
  color:var(--text);
  text-align:center;
}

.finishSummary{
  margin:0 0 12px;
  padding:10px 12px;
  border-radius:16px;
  background:rgba(255,250,242,.80);
  border:1px solid rgba(255,255,255,.86);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.88);
}

.finishSummaryRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  line-height:1.65;
  color:var(--text2);
}

.finishSummaryRow b{
  color:var(--text);
}

#finishMessage{
  margin:0 0 12px;
  padding:9px 11px;
  border-radius:14px;
  background:rgba(255,246,232,.78);
  border:1px solid rgba(255,255,255,.82);
  color:#7d5c3c;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}

.leaderboardTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:12px 0 8px;
  font-size:15px;
  font-weight:900;
  color:var(--text);
}

#leaderboardHint{
  font-size:11px;
  font-weight:700;
  color:#8a6847;
}

#leaderboardList{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.rankItem{
  display:grid;
  grid-template-columns:32px 1fr auto;
  align-items:center;
  gap:8px;
  min-height:34px;
  padding:7px 9px;
  border-radius:14px;
  background:rgba(255,246,232,.82);
  border:1px solid rgba(255,255,255,.82);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
}

.rankItem.currentUser{
  background:rgba(233,248,231,.94);
  border-color:rgba(121,179,107,.46);
}

.rankNo{
  font-size:12px;
  font-weight:900;
  color:#9b7049;
}

.rankName{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  font-weight:900;
  color:#5b3e28;
}

.rankScore{
  text-align:right;
  font-size:11px;
  line-height:1.25;
  color:#7d5c3c;
  white-space:nowrap;
}

.rankScore b{
  display:block;
  font-size:13px;
  color:#4c7d45;
}

.leaderboardEmpty{
  padding:14px 10px;
  border-radius:14px;
  background:rgba(255,250,242,.72);
  color:#7d5c3c;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}

.finishActions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.finishBtn{
  flex:1;
  height:38px;
  border:none;
  border-radius:999px;
  background:rgba(255,246,232,.96);
  color:#6a4b2f;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
  box-shadow:
    0 6px 18px rgba(92,63,37,.14),
    inset 0 1px 0 rgba(255,255,255,.88);
  transition:transform .18s ease, background .18s ease;
}

.finishBtn.primary{
  background:#c98e56;
  color:#fffaf2;
}

.finishBtn:hover{
  transform:translateY(-1px);
}

@media (max-width:560px){
  #finishCard{
    width:94vw;
    padding:15px 14px 14px;
    border-radius:20px;
  }

  .finishTitle{
    font-size:18px;
  }

  .finishSummaryRow{
    font-size:12px;
  }

  .rankItem{
    grid-template-columns:28px 1fr auto;
    gap:6px;
    padding:6px 7px;
  }

  .rankName{
    font-size:12px;
  }

  .rankScore,
  #leaderboardHint{
    font-size:10px;
  }

  .finishActions{
    gap:7px;
  }

  .finishBtn{
    height:34px;
    font-size:12px;
  }
}

/* 常规中屏左右 */
@media (max-width:1100px){
  #leftPanel{
    width:32%;
    min-width:280px;
  }
}

@media (max-width:900px){
  body{
    overflow:auto;
  }

  #room{
    min-height:100vh;
    min-height:100dvh;
    align-items:flex-start;
    padding:10px 0;
  }

  #stage{
    max-width:100vw;
    max-height:none;
  }

  #bg{
    width:100vw;
    height:auto;
    max-width:none;
    max-height:none;
  }

  #leftPanel{
    left:2%;
    top:2%;
    width:34%;
    min-width:220px;
    max-width:none;
    height:94%;
    padding:10px 8px 8px;
    gap:8px;
  }

  #gameTitle{
    font-size:18px;
  }

  #leaderboardOpenBtn{
    height:28px;
    padding:0 10px;
    font-size:11px;
  }

  #gameSub{
    font-size:10px;
    line-height:1.42;
  }

  #nameList{
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:5px;
  }

  .nameCard{
    font-size:10px;
    padding:5px 4px;
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
    word-break:break-all;
    min-height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .statusRow{
    font-size:11px;
  }

  #resultText{
    font-size:12px;
    min-height:18px;
  }

  .ctrlBtn{
    font-size:12px;
    height:34px;
  }

}

/* 上下结构 */
body.stack-layout{
  overflow:hidden;
  align-items:stretch;
}

body.stack-layout #room{
  align-items:stretch;
  justify-content:flex-start;
  overflow:hidden;
  padding:0;
}

body.stack-layout #stage{
  width:100vw;
  height:100vh;
  height:100dvh;
  max-width:none;
  max-height:none;
  display:flex;
  flex-direction:column;
}

body.stack-layout #playArea{
  width:100%;
  height:auto;
  flex:0 0 48%;
  min-height:280px;
  max-height:50vh;
  padding:8px 8px 0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

body.stack-layout #viewport{
  position:relative;
  width:min(100%, calc(100% - 16px), calc(50vh * 965 / 936));
  height:100%;
  aspect-ratio:965 / 936;
  overflow:hidden;
  border-radius:18px;
  box-shadow:
    0 8px 24px rgba(92,63,37,.10),
    inset 0 1px 0 rgba(255,255,255,.65);
  background:rgba(255,248,238,.35);
}

body.stack-layout #fullLayer{
  position:absolute;
  left:var(--cropShift);
  top:0;
  width:calc(var(--cropScale) * 100%);
  height:100%;
}

body.stack-layout #bg{
  width:100%;
  height:100%;
  max-width:none;
  max-height:none;
  object-fit:fill;
  display:block;
}

body.stack-layout #map,
body.stack-layout #labelLayer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

body.stack-layout #leftPanel{
  position:relative;
  left:auto;
  top:auto;
  width:100%;
  min-width:0;
  max-width:none;
  height:auto;
  flex:1 1 auto;
  min-height:0;
  border-radius:22px 22px 0 0;
  padding:9px 8px 10px;
  gap:7px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.52) 0%,
      rgba(255,255,255,.40) 45%,
      rgba(255,255,255,.26) 100%
    );
  border-left:none;
  border-right:none;
  border-bottom:none;
  box-shadow:
    0 -8px 28px rgba(92,63,37,.10),
    inset 0 1px 0 rgba(255,255,255,.92);
}

body.stack-layout #gameTitle{
  font-size:17px;
}

body.stack-layout #leaderboardOpenBtn{
  height:28px;
  padding:0 10px;
  font-size:10px;
}


body.stack-layout #gameSub{
  font-size:9px;
  line-height:1.38;
}

body.stack-layout #layoutHint{
  display:block;
  font-size:9px;
  color:#8a6847;
  margin-top:-2px;
  margin-bottom:2px;
  line-height:1.35;
}

body.stack-layout #nameList{
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:5px;
}

body.stack-layout .nameCard{
  font-size:9.5px;
  min-height:30px;
  padding:5px 3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  word-break:normal;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1.15;
  cursor:pointer;
  touch-action:pan-y;
}

body.stack-layout #nameListWrap{
  padding:5px 3px 4px;
}

body.stack-layout #nameList{
  padding-top:1px;
}

body.stack-layout .nameCard:hover,
body.stack-layout .nameCard.selected{
  transform:none;
}

body.stack-layout .nameCard.selected{
  border-color:rgba(241,185,79,.95);
  box-shadow:
    inset 0 0 0 2px rgba(241,185,79,.42),
    0 3px 10px rgba(92,63,37,.12),
    inset 0 1px 0 rgba(255,255,255,.92);
}

body.stack-layout #infoBox{
  padding:8px 8px;
  border-radius:14px;
}

body.stack-layout .statusRow{
  font-size:9px;
  line-height:1.35;
}

body.stack-layout #resultText{
  font-size:10px;
  min-height:15px;
}

body.stack-layout #bottomBtns{
  margin-top:7px;
  gap:6px;
}

body.stack-layout .ctrlBtn{
  height:30px;
  font-size:10px;
}

function formatTime(sec){

}

    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")

function normalizeRankRows(rows){
  return (Array.isArray(rows) ? rows : [])
    .filter(row => Number.isFinite(Number(row.total_seconds)))
    .map(row => ({
      rank:Number(row.rank || 0),
      member_id:row.member_id || "",
      nickname:row.nickname || "匿名房客",
      raw_seconds:Number(row.raw_seconds || 0),
      wrong_count:Number(row.wrong_count || 0),
      penalty_seconds:Number(row.penalty_seconds || 0),
      total_seconds:Number(row.total_seconds || 0),
      completed_at:row.completed_at || ""
    }))
    .sort((a,b) =>
      a.total_seconds - b.total_seconds ||
      a.wrong_count - b.wrong_count ||
      new Date(a.completed_at || 0) - new Date(b.completed_at || 0)
    )
    .slice(0, 10);
}

    p_wrong_count:score.wrong_count,

  if(error) throw error;

function fitLabelText(el){
  if(!el || !el.textContent.trim()) return;

  const width = el.clientWidth;
  const height = el.clientHeight;
  const text = el.textContent.trim();
  const len = text.length;

  let widthFactor, heightFactor, maxSize, minSize;

  if (window.innerWidth <= 360) {
    widthFactor = 0.15;
    heightFactor = 0.52;
    maxSize = 11.5;
    minSize = 6.5;
  } else if (document.body.classList.contains("stack-layout")) {
    widthFactor = 0.18;
    heightFactor = 0.60;
    maxSize = 14;
    minSize = 7.5;
  } else if (window.innerWidth <= 1100) {
    widthFactor = 0.22;
    heightFactor = 0.68;
    maxSize = 18;
    minSize = 8;
  } else {
    widthFactor = 0.27;
    heightFactor = 0.82;
    maxSize = 26;
    minSize = 9;
  }

  let fontSize = Math.min(
    maxSize,
    Math.max(
      minSize,
      width * widthFactor,
      height * heightFactor
    )
  );

  if (len >= 4) fontSize *= 0.90;
  if (len >= 5) fontSize *= 0.84;
  if (len >= 6) fontSize *= 0.78;

  el.style.fontSize = fontSize + "px";
  el.style.whiteSpace = "nowrap";
  el.style.lineHeight = "1";
  el.style.wordBreak = "normal";
  el.style.transform = "translateZ(0)";
  el.style.fontStretch = "normal";

  while (
    (el.scrollWidth > el.clientWidth - 4 || el.scrollHeight > el.clientHeight - 3) &&
    fontSize > minSize
  ) {
    fontSize -= 0.25;
    el.style.fontSize = fontSize + "px";
  }
}

}

function updateZoneSelectionUI(){
  document.querySelectorAll(".dropZone").forEach(el => {
    el.classList.toggle("selected", el.dataset.code === selectedZoneCode);
  });
}

function selectCard(code){
  if(finished || placedCorrect.has(code)) return;
  selectedCardCode = (selectedCardCode === code) ? null : code;
  updateCardSelectionUI();
  tryResolveSelection();
}

function selectZone(code){
  if(finished || placedCorrect.has(code)) return;
  selectedZoneCode = (selectedZoneCode === code) ? null : code;
  updateZoneSelectionUI();
  tryResolveSelection();
}

function tryResolveSelection(){
  if(!selectedCardCode || !selectedZoneCode) return;

  startTimerIfNeeded();

  const draggedCode = selectedCardCode;
  const zoneCode = selectedZoneCode;

  const draggedItem = codeToItem[draggedCode];
  const cardEl = document.getElementById(`card-${draggedCode}`);
  const zoneRect = document.getElementById(`zone-${zoneCode}`);
  const placedTextEl = document.getElementById(`placed-${zoneCode}`);

  if(!draggedItem || !cardEl || !zoneRect || !placedTextEl){
    clearCurrentSelection();
    return;
  }

  if(draggedCode === zoneCode){
    triggerCorrect(zoneRect, placedTextEl, cardEl, draggedItem);
  }else{
    triggerWrong(zoneRect, cardEl);
  }

  clearCurrentSelection();
}

function triggerCorrect(zoneRect, placedTextEl, cardEl, item){
  zoneRect.classList.remove("wrong", "selected");
  zoneRect.classList.add("correct");

  placedTextEl.textContent = item.name;
  fitLabelText(placedTextEl);

  cardEl.classList.remove("selected");
  cardEl.classList.add("correct");
  cardEl.draggable = false;

  placedCorrect.add(item.code);

  updateStatus();
  setResult(`正确：${item.name}（${item.animal}）`, "#4c7d45");

  if(placedCorrect.size === peopleData.length){
    finishGame();
  }
}

function renderNameCards(){
  nameList.innerHTML = "";

  peopleData.forEach(item => {
    const div = document.createElement("div");
    div.className = "nameCard";
    div.id = `card-${item.code}`;
    div.draggable = true;
    div.textContent = item.name;
    div.dataset.code = item.code;

    div.addEventListener("dragstart", e => {
      if(finished || placedCorrect.has(item.code)){
        e.preventDefault();
        return;
      }
      startTimerIfNeeded();
      div.classList.add("dragging");
      e.dataTransfer.setData("text/plain", item.code);
      e.dataTransfer.effectAllowed = "move";
      clearCurrentSelection();
    });

    div.addEventListener("dragend", () => {
      div.classList.remove("dragging");
    });

    div.addEventListener("click", () => {
      if(finished || placedCorrect.has(item.code)) return;
      selectCard(item.code);
    });

    nameList.appendChild(div);
  });
}

function createZoneElements(){
  map.innerHTML = "";
  labelLayer.innerHTML = "";

  zoneLayout.forEach(zone => {
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("class", "dropZone");
    rect.setAttribute("id", `zone-${zone.code}`);
    rect.setAttribute("data-code", zone.code);
    rect.setAttribute("x", zone.x);
    rect.setAttribute("y", zone.y);
    rect.setAttribute("width", zone.w);
    rect.setAttribute("height", zone.h);

    const label = document.createElement("div");
    label.className = "nameLabel";
    label.id = `placed-${zone.code}`;

    /* 白底更高一点 */
    const left = zone.x + zone.w * 0.04;
    const top = zone.y + zone.h * 0.22;
    const width = zone.w * 0.92;
    const height = zone.h * 0.64;

    label.style.left = `${left}%`;
    label.style.top = `${top}%`;
    label.style.width = `${width}%`;
    label.style.height = `${height}%`;

    rect.addEventListener("dragover", e => {
      if(finished) return;
      e.preventDefault();
      rect.classList.add("hover");
    });

    rect.addEventListener("dragleave", () => {
      rect.classList.remove("hover");
    });

    rect.addEventListener("drop", e => {
      if(finished) return;
      e.preventDefault();
      rect.classList.remove("hover");
      startTimerIfNeeded();

      const draggedCode = e.dataTransfer.getData("text/plain");
      if(!draggedCode || placedCorrect.has(draggedCode)) return;

      const draggedItem = codeToItem[draggedCode];
      const cardEl = document.getElementById(`card-${draggedCode}`);
      const placedTextEl = document.getElementById(`placed-${zone.code}`);

      if(!draggedItem || !cardEl || !placedTextEl) return;

      if(draggedCode === zone.code){
        triggerCorrect(rect, placedTextEl, cardEl, draggedItem);
      }else{
        triggerWrong(rect, cardEl);
      }

      clearCurrentSelection();
    });

    rect.addEventListener("click", () => {
      if(finished || placedCorrect.has(zone.code)) return;
      selectZone(zone.code);
    });

    map.appendChild(rect);
    labelLayer.appendChild(label);
  });

  requestAnimationFrame(fitAllLabels);
}

function clearPlacedNames(){
  if(finished) return;

  placedCorrect.clear();
  clearCurrentSelection();

  document.querySelectorAll(".nameLabel").forEach(el => {
    el.textContent = "";
    el.style.fontSize = "";
  });

  document.querySelectorAll(".dropZone").forEach(el => {
    el.classList.remove("correct", "wrong", "hover", "shake", "selected");
  });

  document.querySelectorAll(".nameCard").forEach(el => {
    el.classList.remove("correct", "bad", "dragging", "selected");
    el.draggable = true;
  });

  updateStatus();
  setResult("已清空当前填写", "#5b3e28");
}

function resetGame(){
  if(finishMask) closeFinishBoard();
  placedCorrect.clear();
  wrongCount = 0;
  penaltySeconds = 0;
  timerStarted = false;
  finished = false;
  finalRawSeconds = 0;
  startTimestamp = 0;
  stopTimer();
  clearCurrentSelection();

  renderNameCards();
  createZoneElements();
  updateStatus();
  setResult("请开始匹配", "#5b3e28");
}

function handleResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    applyLayoutMode();
    fitAllLabels();
  }, 50);
}

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && finishMask && !finishMask.classList.contains("hidden")){
    closeFinishBoard();
  }
});

finishMask.addEventListener("click", (e) => {
  if(e.target === finishMask) closeFinishBoard();
});

window.addEventListener("resize", handleResize);
bg.addEventListener("load", () => {
  applyLayoutMode();
  fitAllLabels();
});

renderNameCards();
createZoneElements();
updateStatus();
applyLayoutMode();
setResult("请开始匹配");
</script>
</body>
</html>
