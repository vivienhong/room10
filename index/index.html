<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room10</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --text:#5b4632;
  --ink:#6a4223;
  --line:rgba(216,157,106,0.35);
  --soft-line:rgba(196,139,86,0.16);
  --card-shadow:rgba(69,47,28,0.24);
  --identity-scale:1;

  --identity-right:5.20%;
  --identity-top:5.15%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);
  --identity-name-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:#f3ecdf;
  color:var(--text);
  transition:background .35s ease;
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

/* ===== 首页舞台 ===== */
#home{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#homeStage{
  position:relative;
  width:fit-content;
  height:fit-content;
  max-width:100vw;
  max-height:100vh;
}

#homeImage{
  display:block;
  max-width:100vw;
  max-height:100vh;
  width:auto;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

#seasonLayer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1;
  display:block;
}

/* =========================================================
   身份组件：使用全站通用模板结构，首页不显示房间切换按钮
========================================================= */
#topActions{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:20;
  pointer-events:none;
  overflow:visible;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#siteNoticeBtn,
#loginOpenBtn,
#logoutBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

#topIdentityBadge{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

#topIdentityBadge .identityText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1.22;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
  transform:translateY(var(--identity-name-y));
}

#siteNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

#siteNoticeBtn,
#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

#siteNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

#siteNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice + #siteNoticeCount{
  display:flex;
}

#loginOpenBtn,
#logoutBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

#siteNoticeBtn:hover,
#loginOpenBtn:hover,
#logoutBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)), 72vw);
  max-height:min(calc(540px * var(--s)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

#siteNoticePanel.show{display:block;}

.siteNoticeHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:calc(8px * var(--s));
  margin-bottom:calc(10px * var(--s));
}

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
}

.noticeClear{
  appearance:none;
  border:none;
  background:transparent;
  color:#9a7957;
  font-size:calc(10px * var(--s));
  font-weight:700;
  cursor:pointer;
  padding:calc(2px * var(--s)) calc(4px * var(--s));
  border-radius:calc(8px * var(--s));
}

.noticeClear:hover{background:rgba(201,142,86,.12);color:#7c5834;}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--s));
}

.siteNoticeItem{
  display:flex;
  gap:calc(8px * var(--s));
  align-items:flex-start;
  padding:calc(10px * var(--s));
  border-radius:calc(12px * var(--s));
  background:rgba(255,252,247,0.82);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.92),
    0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(120,92,63,0.05);
}

.siteNoticeItemIcon{
  width:calc(22px * var(--s));
  height:calc(22px * var(--s));
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  font-size:calc(11px * var(--s));
  background:rgba(217,163,100,.16);
  color:#8a5a2c;
}

.siteNoticeItemText{flex:1;min-width:0;}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--s));
  font-weight:800;
  line-height:1.5;
  word-break:break-word;
}

.siteNoticeItemDesc{
  margin-top:calc(2px * var(--s));
  color:#8a6644;
  font-size:calc(11px * var(--s));
  line-height:1.55;
  word-break:break-word;
}

/* ===== SVG 热区 ===== */
#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

#map rect{
  fill:transparent;
  stroke:transparent;
  cursor:pointer;
  pointer-events:all;
  transition:.2s;
}

#map rect:hover{
  fill:rgba(255,220,120,.22);
  stroke:#ffd87a;
  stroke-width:.6;
}

/* ===== 登录UI ===== */
#loginUI{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#loginUI.show{
  display:flex;
}

.login-panel{
  position:relative;
  width:min(720px, 94vw);
}

.login-panel img{
  width:100%;
  display:block;
  pointer-events:none;
}

#username,
#password{
  position:absolute;
  left:36.2%;
  height:8.1%;
  border:none;
  outline:none;
  padding:0 10px;
  font-size:18px;
  color:#5b3e28;
  background:transparent;
  line-height:1.1;
}

#username{
  top:40%;
  width:27.5%;
}

#password{
  top:56%;
  width:20%;
}

#togglePassword{
  position:absolute;
  top:56%;
  left:56%;
  width:8%;
  height:8.1%;
  border:none;
  cursor:pointer;
  background:rgba(255,215,120,.15);
  border-radius:6px;
}

#togglePassword:hover{
  background:rgba(255,215,120,.35);
  box-shadow:0 0 8px rgba(255,220,120,.6);
}

#loginBtn{
  position:absolute;
  top:68%;
  left:40%;
  width:20%;
  height:9%;
  border:none;
  background:transparent;
  cursor:pointer;
}

#registerLink{
  position:absolute;
  top:50%;
  left:52%;
  transform:translateX(-50%);
  color:#7a4f2b;
  font-size:14px;
  font-weight:600;
  text-decoration:underline;
  cursor:pointer;
  background:none;
  border:none;
  padding:0;
  white-space:nowrap;
}

#registerLink:hover{
  color:#9b6334;
}

#loginMessage{
  position:absolute;
  top:34.8%;
  left:53.5%;
  transform:translateX(-50%);
  text-align:center;
  color:#7a4f2b;
  font-size:14px;
  font-weight:600;
  width:42%;
  max-width:320px;
  white-space:normal;
  line-height:1.25;
}

.closeBtn{
  position:absolute;
  top:4px;
  right:6px;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  background:white;
  cursor:pointer;
  font-size:18px;
}

/* =========================
   统一奖励弹窗：首页礼包领取共用
========================= */
.reward-mask{
  position:fixed;
  inset:0;
  z-index:1200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(64,45,30,0.30);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  --reward-scale:1;
}

.reward-mask.show{display:flex;}

.reward-card{
  position:relative;
  width:min(calc(430px * var(--reward-scale)), calc(100vw - 28px));
  max-height:calc(100dvh - 28px);
  padding:calc(28px * var(--reward-scale)) calc(24px * var(--reward-scale)) calc(22px * var(--reward-scale));
  border-radius:calc(26px * var(--reward-scale));
  overflow:hidden auto;
  text-align:center;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 16%, rgba(255,226,235,.68), transparent 30%),
    radial-gradient(circle at 86% 18%, rgba(255,240,181,.62), transparent 32%),
    linear-gradient(180deg, rgba(255,253,247,.98), rgba(255,244,226,.96));
  border:calc(2px * var(--reward-scale)) solid var(--line);
  box-shadow:
    0 calc(22px * var(--reward-scale)) calc(54px * var(--reward-scale)) var(--card-shadow),
    inset 0 1px 0 rgba(255,255,255,.9);
  animation:rewardPop .42s cubic-bezier(.2, 1.12, .34, 1) both;
}

.reward-card::before,
.reward-card::after{
  position:absolute;
  left:calc(12px * var(--reward-scale));
  right:calc(12px * var(--reward-scale));
  font-size:calc(15px * var(--reward-scale));
  letter-spacing:calc(8px * var(--reward-scale));
  white-space:nowrap;
  overflow:hidden;
  pointer-events:none;
}

.reward-card::before{
  content:"✿  ❀  ✽  ✿  ❀  ✽  ✿";
  top:calc(9px * var(--reward-scale));
  color:rgba(209,120,148,0.52);
}

.reward-card::after{
  content:"✿  ❀  ✽  ✿  ❀  ✽  ✿";
  bottom:calc(8px * var(--reward-scale));
  color:rgba(199,145,75,0.44);
}

@keyframes rewardPop{
  0%{opacity:0;transform:translateY(calc(12px * var(--reward-scale))) scale(.9);}
  64%{opacity:1;transform:translateY(0) scale(1.025);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

.reward-close{
  position:absolute;
  z-index:6;
  top:calc(12px * var(--reward-scale));
  right:calc(12px * var(--reward-scale));
  width:calc(30px * var(--reward-scale));
  height:calc(30px * var(--reward-scale));
  border:none;
  border-radius:999px;
  background:rgba(255,250,242,.88);
  color:#7b5636;
  font-size:calc(18px * var(--reward-scale));
  font-weight:900;
  line-height:1;
  cursor:pointer;
  box-shadow:
    0 calc(2px * var(--reward-scale)) calc(8px * var(--reward-scale)) rgba(105,75,43,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.reward-close:hover{filter:brightness(1.02);}

.reward-petals{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.reward-petals span{
  position:absolute;
  top:calc(-18px * var(--reward-scale));
  color:rgba(220,132,154,.56);
  font-size:calc(16px * var(--reward-scale));
  opacity:0;
  text-shadow:0 calc(2px * var(--reward-scale)) calc(4px * var(--reward-scale)) rgba(255,255,255,.76);
  animation:rewardPetalFall 1.35s ease-in-out both;
}

.reward-petals span:nth-child(1){left:12%;animation-delay:.05s;}
.reward-petals span:nth-child(2){left:28%;animation-delay:.18s;}
.reward-petals span:nth-child(3){left:48%;animation-delay:.02s;}
.reward-petals span:nth-child(4){left:66%;animation-delay:.22s;}
.reward-petals span:nth-child(5){left:82%;animation-delay:.10s;}

@keyframes rewardPetalFall{
  0%{opacity:0;transform:translateY(calc(-14px * var(--reward-scale))) rotate(0deg) scale(.78);}
  20%{opacity:.85;}
  100%{opacity:0;transform:translateY(calc(145px * var(--reward-scale))) rotate(160deg) scale(1);}
}

.reward-content{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.reward-icon{
  width:calc(62px * var(--reward-scale));
  height:calc(62px * var(--reward-scale));
  margin:calc(4px * var(--reward-scale)) auto calc(12px * var(--reward-scale));
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,246,226,.78);
  border:1px solid rgba(220,164,102,.25);
  box-shadow:0 calc(8px * var(--reward-scale)) calc(20px * var(--reward-scale)) rgba(126,92,51,.10), inset 0 1px 0 rgba(255,255,255,.85);
  font-size:calc(34px * var(--reward-scale));
}

.reward-label{
  min-height:calc(25px * var(--reward-scale));
  padding:0 calc(13px * var(--reward-scale));
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:rgba(255,249,232,.66);
  border:1px solid rgba(218,166,87,.20);
  color:#b26a3a;
  font-size:calc(13px * var(--reward-scale));
  font-weight:950;
  line-height:1;
  letter-spacing:.06em;
  animation:rewardStamp .42s ease both;
}

.reward-title{
  position:relative;
  max-width:100%;
  margin:calc(10px * var(--reward-scale)) auto calc(8px * var(--reward-scale));
  padding:calc(8px * var(--reward-scale)) calc(18px * var(--reward-scale));
  border-radius:999px;
  color:var(--ink);
  font-size:calc(22px * var(--reward-scale));
  font-weight:950;
  line-height:1.15;
  background:rgba(255,249,232,.72);
  border:1px solid rgba(218,166,87,.24);
  box-shadow:0 calc(5px * var(--reward-scale)) calc(14px * var(--reward-scale)) rgba(126,92,51,.08), inset 0 1px 0 rgba(255,255,255,.82);
  overflow:hidden;
}

.reward-title::after{
  content:"";
  position:absolute;
  inset:-30% auto -30% -42%;
  width:36%;
  background:linear-gradient(90deg, transparent, rgba(255,234,160,.80), transparent);
  transform:skewX(-18deg);
  animation:rewardSweep 1.25s ease .22s both;
}

@keyframes rewardStamp{
  0%{opacity:0;transform:scale(1.12);}
  72%{opacity:1;transform:scale(.97);}
  100%{opacity:1;transform:scale(1);}
}

@keyframes rewardSweep{0%{left:-42%;}100%{left:118%;}}

.reward-desc{
  width:100%;
  max-width:calc(330px * var(--reward-scale));
  margin:0 auto calc(14px * var(--reward-scale));
  color:#826046;
  font-size:calc(13px * var(--reward-scale));
  line-height:1.65;
  text-align:center;
  white-space:pre-line;
}

.reward-section-title{
  margin:0 0 calc(10px * var(--reward-scale));
  color:#8a5c33;
  font-size:calc(12px * var(--reward-scale));
  font-weight:950;
  line-height:1;
  letter-spacing:.08em;
}

.reward-list{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  justify-content:center;
  gap:calc(8px * var(--reward-scale));
  margin:0 0 calc(16px * var(--reward-scale));
}

.reward-list.count-1{grid-template-columns:minmax(0, calc(120px * var(--reward-scale)));}
.reward-list.count-2{grid-template-columns:repeat(2, minmax(0, calc(120px * var(--reward-scale))));}
.reward-list.empty,
.reward-section-title.empty{display:none;}

.reward-item{
  min-width:0;
  min-height:calc(84px * var(--reward-scale));
  padding:calc(10px * var(--reward-scale)) calc(7px * var(--reward-scale)) calc(9px * var(--reward-scale));
  border-radius:calc(16px * var(--reward-scale));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(255,252,247,.72);
  border:1px solid var(--soft-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.82), 0 calc(3px * var(--reward-scale)) calc(10px * var(--reward-scale)) rgba(116,86,54,.06);
  animation:rewardItemIn .38s ease both;
}

.reward-item:nth-child(1){animation-delay:.14s;}
.reward-item:nth-child(2){animation-delay:.24s;}
.reward-item:nth-child(3){animation-delay:.34s;}
.reward-item:nth-child(4){animation-delay:.44s;}

@keyframes rewardItemIn{
  0%{opacity:0;transform:translateY(calc(8px * var(--reward-scale))) scale(.96);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

.reward-item-icon{
  font-size:calc(28px * var(--reward-scale));
  line-height:1;
  margin-bottom:calc(7px * var(--reward-scale));

function clamp(v, min, max){
  return Math.max(min, Math.min(max, v));
}

function mixColor(a, b, t){
  return {
    r: Math.round(a.r + (b.r - a.r) * t),
    g: Math.round(a.g + (b.g - a.g) * t),
    b: Math.round(a.b + (b.b - a.b) * t)
  };
}

function colorToCss(c){
  return `rgb(${c.r}, ${c.g}, ${c.b})`;
}

function lighten(c, amt){
  return {
    r: clamp(c.r + amt, 0, 255),
    g: clamp(c.g + amt, 0, 255),
    b: clamp(c.b + amt, 0, 255)
  };
}

function saturate(c, factor){
  const avg = (c.r + c.g + c.b) / 3;
  return {
    r: clamp(Math.round(avg + (c.r - avg) * factor), 0, 255),
    g: clamp(Math.round(avg + (c.g - avg) * factor), 0, 255),
    b: clamp(Math.round(avg + (c.b - avg) * factor), 0, 255)
  };
}

function sampleRectAverage(ctx, x, y, w, h){
  const data = ctx.getImageData(x, y, w, h).data;
  let r = 0, g = 0, b = 0, count = 0;
  for(let i = 0; i < data.length; i += 4){
    const alpha = data[i + 3];
    if(alpha < 8) continue;
    r += data[i];
    g += data[i + 1];
    b += data[i + 2];
    count++;
  }
  if(count === 0){
    return { r:225, g:233, b:230 };
  }
  return {
    r: Math.round(r / count),
    g: Math.round(g / count),
    b: Math.round(b / count)
  };
}

function applyBetterHomeBackground(img){
  const w = img.naturalWidth;
  const h = img.naturalHeight;
  if(!w || !h) return;

  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d", { willReadFrequently:true });
  ctx.drawImage(img, 0, 0, w, h);

  const sideW = Math.max(12, Math.round(w * 0.08));
  const upperH = Math.max(12, Math.round(h * 0.42));
  const lowerH = Math.max(12, Math.round(h * 0.22));

  const leftSky = sampleRectAverage(ctx, 0, 0, sideW, upperH);
  const rightSky = sampleRectAverage(ctx, w - sideW, 0, sideW, upperH);
  const leftGround = sampleRectAverage(ctx, 0, h - lowerH, sideW, lowerH);
  const rightGround = sampleRectAverage(ctx, w - sideW, h - lowerH, sideW, lowerH);

  let skyColor = mixColor(leftSky, rightSky, 0.5);
  let groundColor = mixColor(leftGround, rightGround, 0.5);

  skyColor = saturate(lighten(skyColor, 12), 1.08);
  groundColor = saturate(lighten(groundColor, 8), 1.05);

  document.body.style.background = `
    linear-gradient(
      180deg,
      ${colorToCss(skyColor)} 0%,
      ${colorToCss(mixColor(skyColor, groundColor, 0.35))} 48%,
      ${colorToCss(groundColor)} 100%
    )
  `;
}

function applyCurrentHomeBackground(){
  if(homeImg.complete && homeImg.naturalWidth){
    try{
      applyBetterHomeBackground(homeImg);
    }catch(err){
      console.warn("背景采样失败：", err);
    }
  }
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

const rewardTypeMeta = {
  achievement:{ label:"成就达成", icon:"🏆" },
  title:{ label:"获得称号", icon:"🎖️" },
  daily:{ label:"日常奖励", icon:"☀️" },
  gift:{ label:"礼包领取", icon:"🎁" },
  item:{ label:"道具获得", icon:"🧺" },
  gold:{ label:"金币奖励", icon:"🪙" }
};

const rewardIconMap = {
  金币:"🪙",
  种子:"🌱",
  水:"💧",
  肥料:"🧺",
  宠物零食:"🥣",
  宠物粮:"🥣",
  医疗卡:"💊",
  亲密度:"💗",
  道具:"🧺",
  成就:"🏆",
  称号:"🎖️"
};

function normalizeRewardItem(item){
  if(typeof item === "string"){
    return {
      name:item,
      amount:"",
      unit:"",
      icon:rewardIconMap[item] || "✨"
    };
  }

  return {
    name:item?.name || "奖励",
    amount:item?.amount ?? "",
    unit:item?.unit || "",
    icon:item?.icon || rewardIconMap[item?.name] || "✨",
    prefix:item?.prefix || ""
  };
}

function formatRewardAmount(item){
  if(item.amount === "" || item.amount === null || item.amount === undefined){
    return "";
  }
  if(typeof item.amount === "number"){
    const sign = item.amount > 0 ? "+" : "";
    return `${sign}${item.amount}${item.unit || ""}`;
  }
  return `${item.prefix || ""}${item.amount}${item.unit || ""}`;
}

function isImageIcon(icon){
  return /\.(png|jpg|jpeg|gif|webp|svg)(\?.*)?$/i.test(String(icon || "").trim());
}

function renderRewardIcon(icon, name = "奖励"){
  const safeIcon = String(icon || "").trim();
  if(!safeIcon){
    return "✨";
  }

  if(isImageIcon(safeIcon)){
    return `<img src="${escapeHtml(safeIcon)}" alt="${escapeHtml(name || "奖励")}" loading="lazy">`;
  }

  return escapeHtml(safeIcon);
}

function renderRewards(rewards){
  const list = document.getElementById("rewardList");
  const sectionTitle = document.getElementById("rewardSectionTitle");
  if(!list || !sectionTitle) return;

  list.innerHTML = "";
  list.className = "reward-list";
  sectionTitle.className = "reward-section-title";

  if(!rewards.length){
    list.classList.add("empty");
    sectionTitle.classList.add("empty");
    return;
  }

  list.classList.add(`count-${Math.min(rewards.length, 3)}`);

  rewards.forEach(reward => {
    const item = document.createElement("div");
    item.className = "reward-item";
    item.innerHTML = `
      <div class="reward-item-icon">${renderRewardIcon(reward.icon, reward.name)}</div>
      <div class="reward-item-name">${escapeHtml(reward.name)}</div>
      <div class="reward-item-amount">${escapeHtml(formatRewardAmount(reward))}</div>
    `;
    list.appendChild(item);
  });
}

function openRewardModal(options = {}){
  const mask = document.getElementById("rewardMask");
  if(!mask) return;

  const type = options.type || "achievement";
  const meta = rewardTypeMeta[type] || rewardTypeMeta.achievement;
  const rewards = Array.isArray(options.rewards)
    ? options.rewards.map(normalizeRewardItem)
    : [];

  mask.dataset.type = type;
  document.getElementById("rewardIcon").textContent = options.icon || meta.icon;
  document.getElementById("rewardLabel").textContent = options.label || meta.label;
  document.getElementById("rewardTitle").textContent = options.title || "奖励已领取";
  document.getElementById("rewardDesc").textContent = options.desc || "奖励已经记录完成。";

  renderRewards(rewards);

  rewardModalShowing = true;
  mask.classList.add("show");
  mask.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function showRewardModal(options = {}, afterClose = null){
  rewardQueue.push({ options, afterClose });
  if(!rewardModalShowing){
    playNextRewardModal();
  }
}

function playNextRewardModal(){
  const next = rewardQueue.shift();
  if(!next){
    rewardModalShowing = false;
    rewardAfterCloseCallback = null;
    return;
  }
  rewardAfterCloseCallback = typeof next.afterClose === "function" ? next.afterClose : null;
  openRewardModal(next.options);
}

function closeRewardModal(){
  const mask = document.getElementById("rewardMask");
  if(mask){
    mask.classList.remove("show");
    mask.setAttribute("aria-hidden", "true");
  }
  document.body.style.overflow = "";

  const callback = rewardAfterCloseCallback;
  rewardAfterCloseCallback = null;

  if(rewardQueue.length){
    setTimeout(playNextRewardModal, 120);
    return;
  }

  rewardModalShowing = false;

  if(typeof callback === "function"){
    callback();
  }
}

function getLocalDateString(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function getAckSignature(){
  return localStorage.getItem(NOTICE_ACK_KEY) || "";
}

function setAckSignature(signature){
  localStorage.setItem(NOTICE_ACK_KEY, String(signature || ""));
}

function buildNoticeSignature(items){
  return items.map(item => `${item.main}__${item.sub}`).join("||");
}

function sortParts(parts){
  return [...parts].sort((a, b) => {
    const aOrder = Number(a.part_order || 0);
    const bOrder = Number(b.part_order || 0);
    if(aOrder !== bOrder) return aOrder - bOrder;
    return String(a.id || "").localeCompare(String(b.id || ""));
  });
}

function getReleaseSortValue(project){
  const raw = project?.release_date;
  if(!raw) return Number.POSITIVE_INFINITY;
  const time = new Date(raw).getTime();
  if(Number.isNaN(time)) return Number.POSITIVE_INFINITY;
  return time;
}

function sortProjectsByUrgency(projects){
  return [...projects].sort((a, b) => {
    const aHasDate = !!a.release_date;
    const bHasDate = !!b.release_date;

    if(aHasDate !== bHasDate){
      return aHasDate ? -1 : 1;
    }

    const aTime = getReleaseSortValue(a);
    const bTime = getReleaseSortValue(b);
    if(aTime !== bTime){
      return aTime - bTime;
    }

    const aCode = parseInt(String(a.project_code || "").match(/\d+/)?.[0] || "0", 10);
    const bCode = parseInt(String(b.project_code || "").match(/\d+/)?.[0] || "0", 10);
    if(aCode !== bCode){
      return aCode - bCode;
    }

    return String(a.project_name || "").localeCompare(String(b.project_name || ""));
  });
}

function getDisplayTaskName(project){
  return String(project?.project_name || project?.project_code || "未命名项目").trim();
}

function buildTitlePreview(names){
  const clean = names.filter(Boolean);
  if(clean.length <= 3){
    return clean.join("、");
  }
  return `${clean.slice(0, 3).join("、")} 等${clean.length}项`;
}

async function buildTaskNoticeItems(){
  const user = getCurrentUser();
  const memberId = String(user.memberId || "").trim();
  const role = String(user.role || "").trim().toLowerCase();

  if(!memberId) return { items: [], signature: "" };

  const now = Date.now();
  if(
    noticeCache.memberId === memberId &&
    noticeCache.role === role &&
    now - noticeCache.at < 15000
  ){
    return {
      items: noticeCache.items,
      signature: noticeCache.signature
    };
  }

  const [
    projectsResult,
    partsResult,
    singersResult
  ] = await Promise.all([
    client
      .from("projects")
      .select("id, project_code, project_name, release_date, lyrics_lottery_enabled"),
    client
      .from("project_parts")
      .select("id, project_id, part_order, original_name, assigned_member_id"),
    client
      .from("project_singers")
      .select("id, project_id, member_id")
  ]);

  if(projectsResult.error) throw projectsResult.error;
  if(partsResult.error) throw partsResult.error;
  if(singersResult.error) throw singersResult.error;

  const partMap = new Map();
  const singerMap = new Map();

  (partsResult.data || []).forEach(part => {
    const key = String(part.project_id || "");
    if(!partMap.has(key)) partMap.set(key, []);
    partMap.get(key).push({
      id: String(part.id || ""),
      part_order: part.part_order || 0,
      original_name: String(part.original_name || "").trim(),
      assigned_member_id: String(part.assigned_member_id || "").trim()
    });
  });

  (singersResult.data || []).forEach(singer => {
    const key = String(singer.project_id || "");
    if(!singerMap.has(key)) singerMap.set(key, []);
    singerMap.get(key).push({
      id: String(singer.id || ""),
      member_id: String(singer.member_id || "").trim()
    });
  });

  const lotteryProjects = [];

  (projectsResult.data || []).forEach(project => {
    const projectId = String(project.id || "");
    const parts = sortParts(partMap.get(projectId) || []);
    const singers = singerMap.get(projectId) || [];

    const isSingerInTask = singers.some(item => item.member_id === memberId)
      || parts.some(row => row.assigned_member_id === memberId);

    const assignedRowsForCurrentMember = parts.filter(row => row.assigned_member_id === memberId);
    const hasUnassignedRows = parts.some(row => !String(row.assigned_member_id || "").trim());

    const shouldDrawNow = !!project.lyrics_lottery_enabled
      && isSingerInTask
      && hasUnassignedRows
      && assignedRowsForCurrentMember.length === 0;

    if(shouldDrawNow){
      lotteryProjects.push(project);
    }
  });

  const sortedLottery = sortProjectsByUrgency(lotteryProjects);
  const lotteryNames = sortedLottery.map(getDisplayTaskName);

  const items = [];

  if(sortedLottery.length > 0){
    items.push({
      icon: "🎲",
      main: `抽签待处理：${sortedLottery.length} 项`,
      sub: `已开启抽签，等待你抽签：${buildTitlePreview(lotteryNames)}`
    });
  }

  const signature = buildNoticeSignature(items);

  noticeCache = {
    at: now,
    memberId,
    role,
    items,
    signature
  };

  return {
    items,
    signature
  };
}

async function renderNotices(){
  if(!isLoggedIn()){
    noticeState = { signature: "", items: [] };
    siteNoticeContent.innerHTML = `<div class="siteNoticeEmpty">登录后可查看通知</div>`;
    setNoticeCount(0);
    return;
  }

  try{
    const result = await buildTaskNoticeItems();
    const items = result.items || [];
    const signature = result.signature || "";
    noticeState = { signature, items };

    if(!items.length){
      siteNoticeContent.innerHTML = `<div class="siteNoticeEmpty">暂时还没有新的通知</div>`;
      setNoticeCount(0);
      return;
    }

    const ackSignature = getAckSignature();
    const hasUnread = signature && signature !== ackSignature;
    setNoticeCount(hasUnread ? items.length : 0);

    siteNoticeContent.innerHTML = `
      <div class="siteNoticeList">
        ${items.map(item => `
          <div class="siteNoticeItem">
            <div class="siteNoticeItemIcon">${escapeHtml(item.icon || "🔔")}</div>
            <div class="siteNoticeItemText">
              <div class="siteNoticeItemTitle">${escapeHtml(item.main || "")}</div>
              <div class="siteNoticeItemDesc">${escapeHtml(item.sub || "")}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }catch(err){
    console.error("读取首页通知失败：", err);
    noticeState = { signature: "", items: [] };
    siteNoticeContent.innerHTML = `<div class="siteNoticeEmpty">通知读取失败，请稍后再试</div>`;
    setNoticeCount(0);
  }
}

function normalizeLoginInput(value){
  return String(value || "")
    .replace(/\u3000/g, " ")
    .trim();
}

async function login(){
  const nicknameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const msg = document.getElementById("loginMessage");

  const nickname = normalizeLoginInput(nicknameInput.value);
  const key = normalizeLoginInput(passwordInput.value);

  msg.innerText = "";
  msg.style.color = "#8b4a2d";

  if(!nickname || !key){
    msg.innerText = "还没填写完整呢";
    return;
  }

  try{
    const { data, error } = await client.rpc("verify_member_login", {
      input_nickname: nickname,
      input_code: key
    });

    if(error){
      console.error("KEY 登录失败：", error);
      msg.innerText = `登录检查失败：${error.message || "请稍后再试"}`;
      return;
    }

    if(!Array.isArray(data) || data.length === 0){
      msg.innerText = "没有找到你的记录哎";
      return;
    }

    const user = data[0] || {};

    localStorage.setItem("room10LoggedIn", "true");
    localStorage.setItem("room10User", user.nickname || nickname);
    localStorage.setItem("room10Role", user.role || "member");
    localStorage.setItem("room10MemberId", user.member_id || user.id || "");
    localStorage.setItem("room10MemberCode", user.member_code || user.memberCode || user.code || key);

    noticeCache.at = 0;

    const roleMessageMap = {
      owner: "维修工已上线",
      admin: "宿管已上线",
      member: "房客已登录",
      applying: "当前身份为申请中"
    };

    msg.style.color = "#5f7d3a";
    msg.innerText = roleMessageMap[user.role] || "登录成功";

    await safeSyncHomeUI({ skipHolidayGiftCheck:true, skipAnniversaryCheck:true });

    setTimeout(async () => {
      const targetPage = getPendingRedirect();
      const goTarget = () => {
        if(targetPage){
          clearPendingRedirect();
          window.location.href = targetPage;
        }
      };

      nicknameInput.value = "";
      passwordInput.value = "";
      closeLogin(true);

      const claimedAnniversary = await maybeClaimJoinAnniversaryAchievements({
        force:true
      });

      const claimedGift = await maybeClaimLoginHolidayGifts({
        force:true,
        afterAllRewards:goTarget
      });

      if(!claimedAnniversary && !claimedGift){
        goTarget();
      }else if(claimedAnniversary && !claimedGift){
        const lastIndex = rewardQueue.length - 1;
        if(lastIndex >= 0){
          rewardQueue[lastIndex].afterClose = goTarget;
        }else if(!rewardModalShowing){
          goTarget();
        }else{
          rewardAfterCloseCallback = goTarget;
        }
      }
    }, 700);
  }catch(e){
    console.error("login() 查询异常：", e);
    msg.style.color = "#8b4a2d";
    msg.innerText = `登录失败：${e?.message || "请稍后再试"}`;
  }
}

/* ===== 四季特效 ===== */
function getSeasonByMonth(){
  const month = new Date().getMonth() + 1;
  if(month >= 3 && month <= 5) return "spring";
  if(month >= 6 && month <= 8) return "summer";
  if(month >= 9 && month <= 11) return "autumn";
  return "winter";
}

function getSeasonConfig(season){
  const configs = {
    spring: {
      count: 24,
      driftX: 0.55,
      speedMin: 0.35,
      speedMax: 0.95,
      sizeMin: 5,
      sizeMax: 11,
      alphaMin: 0.45,
      alphaMax: 0.78
    },
    summer: {
      count: 18,
      driftX: 0.28,
      speedMin: 0.12,
      speedMax: 0.34,
      sizeMin: 2,
      sizeMax: 5,
      alphaMin: 0.2,
      alphaMax: 0.5
    },
    autumn: {
      count: 22,
      driftX: 0.72,
      speedMin: 0.45,
      speedMax: 1.15,
      sizeMin: 6,
      sizeMax: 12,
      alphaMin: 0.42,
      alphaMax: 0.82
    },
    winter: {
      count: 34,
      driftX: 0.25,
      speedMin: 0.28,
      speedMax: 0.82,
      sizeMin: 2,
      sizeMax: 6,
      alphaMin: 0.42,
      alphaMax: 0.82
    }
  };
  return configs[season] || configs.spring;
}

function createSeasonParticle(width, height, season){
  const cfg = getSeasonConfig(season);
  const size = cfg.sizeMin + Math.random() * (cfg.sizeMax - cfg.sizeMin);
  return {
    x: Math.random() * width,
    y: Math.random() * height,
    size,
    alpha: cfg.alphaMin + Math.random() * (cfg.alphaMax - cfg.alphaMin),
    speedY: cfg.speedMin + Math.random() * (cfg.speedMax - cfg.speedMin),
    speedX: (Math.random() - 0.5) * cfg.driftX,
    sway: Math.random() * Math.PI * 2,
    swaySpeed: 0.004 + Math.random() * 0.012,
    rotation: Math.random() * Math.PI * 2,
    rotationSpeed: (Math.random() - 0.5) * 0.03,
    pulse: Math.random() * Math.PI * 2,
    pulseSpeed: 0.02 + Math.random() * 0.035
  };
}

function resetSeasonParticle(p, width, height, season, fromTop = true){
  const fresh = createSeasonParticle(width, height, season);
  Object.assign(p, fresh);
  p.x = Math.random() * width;
  p.y = fromTop ? (-20 - Math.random() * 80) : (Math.random() * height);
}

function drawSpringParticle(ctx, p){
  ctx.rotate(p.rotation);
  const s = p.size;
  ctx.globalAlpha = p.alpha;
  ctx.fillStyle = "rgba(255, 186, 210, 0.95)";
  ctx.beginPath();
  ctx.ellipse(-s * 0.35, -s * 0.1, s * 0.55, s * 0.36, -0.75, 0, Math.PI * 2);
  ctx.ellipse(s * 0.18, -s * 0.28, s * 0.52, s * 0.34, 0.15, 0, Math.PI * 2);
  ctx.ellipse(s * 0.28, s * 0.18, s * 0.5, s * 0.32, 0.85, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(255, 235, 170, 0.9)";
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawSummerParticle(ctx, p){
  const glow = 0.55 + Math.sin(p.pulse) * 0.18;
  ctx.globalAlpha = p.alpha * glow;
  const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size * 4.2);
  gradient.addColorStop(0, "rgba(255, 245, 165, 0.95)");
  gradient.addColorStop(0.28, "rgba(255, 234, 125, 0.45)");
  gradient.addColorStop(1, "rgba(255, 234, 125, 0)");
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(0, 0, p.size * 4.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = Math.min(1, p.alpha + 0.18);
  ctx.fillStyle = "rgba(255, 251, 196, 0.96)";
  ctx.beginPath();
  ctx.arc(0, 0, p.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawAutumnParticle(ctx, p){
  ctx.rotate(p.rotation);
  const s = p.size;
  ctx.globalAlpha = p.alpha;
  ctx.fillStyle = "rgba(201, 117, 45, 0.92)";
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.95);
  ctx.bezierCurveTo(s * 0.95, -s * 0.55, s * 0.85, s * 0.45, 0, s * 0.92);
  ctx.bezierCurveTo(-s * 0.86, s * 0.45, -s * 0.95, -s * 0.55, 0, -s * 0.95);
  ctx.fill();

  ctx.strokeStyle = "rgba(128, 78, 30, 0.75)";
  ctx.lineWidth = Math.max(0.8, s * 0.12);
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.72);
  ctx.lineTo(0, s * 0.78);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawWinterParticle(ctx, p){
  ctx.rotate(p.rotation);
  const s = p.size;
  ctx.globalAlpha = p.alpha;
  ctx.strokeStyle = "rgba(255,255,255,0.92)";
  ctx.lineWidth = Math.max(0.8, s * 0.14);

  for(let i = 0; i < 3; i++){
    const angle = (Math.PI / 3) * i;
    const x = Math.cos(angle) * s * 1.5;
    const y = Math.sin(angle) * s * 1.5;
    ctx.beginPath();
    ctx.moveTo(-x, -y);
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  ctx.globalAlpha = p.alpha * 0.65;
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.38, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.fill();
  ctx.globalAlpha = 1;
}

function initSeasonEffect(){
  const canvas = document.getElementById("seasonLayer");
  const stage = homeStage;
  if(!canvas || !stage) return;

  if(seasonEffectState.rafId){
    cancelAnimationFrame(seasonEffectState.rafId);
  }
  if(seasonEffectState.onResize){
    window.removeEventListener("resize", seasonEffectState.onResize);
  }

  const ctx = canvas.getContext("2d");
  if(!ctx) return;

  const season = getSeasonByMonth();
  const particles = [];
  let rafId = 0;

  function resizeSeasonCanvas(){
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    const drawWidth = rect.width;
    const drawHeight = rect.height;

    if(particles.length === 0){
      const cfg = getSeasonConfig(season);
      for(let i = 0; i < cfg.count; i++){
        particles.push(createSeasonParticle(drawWidth, drawHeight, season));
      }
    }else{
      particles.forEach(p => {
        p.x = Math.min(Math.max(p.x, 0), drawWidth);
        p.y = Math.min(Math.max(p.y, -40), drawHeight + 40);
      });
    }
  }

  function drawSeasonParticle(p){
    ctx.save();
    ctx.translate(p.x, p.y);

    if(season === "spring"){
      drawSpringParticle(ctx, p);
    }else if(season === "summer"){
      drawSummerParticle(ctx, p);
    }else if(season === "autumn"){
      drawAutumnParticle(ctx, p);
    }else{
      drawWinterParticle(ctx, p);
    }

    ctx.restore();
  }

  function stepSeason(){
    const rect = stage.getBoundingClientRect();
    const width = rect.width;
    const height = rect.height;

    ctx.clearRect(0, 0, width, height);

    if(season === "spring"){
      ctx.fillStyle = "rgba(255, 219, 233, 0.05)";
      ctx.fillRect(0, 0, width, height);
    }else if(season === "summer"){
      ctx.fillStyle = "rgba(255, 236, 166, 0.03)";
      ctx.fillRect(0, 0, width, height);
    }else if(season === "autumn"){
      ctx.fillStyle = "rgba(214, 154, 82, 0.04)";
      ctx.fillRect(0, 0, width, height);
    }else{
      ctx.fillStyle = "rgba(215, 235, 255, 0.035)";
      ctx.fillRect(0, 0, width, height);
    }

    for(const p of particles){
      p.sway += p.swaySpeed;
      p.pulse += p.pulseSpeed;
      p.rotation += p.rotationSpeed;

      if(season === "summer"){
        p.x += Math.sin(p.sway) * 0.18 + p.speedX * 0.2;
        p.y += p.speedY * 0.25;
        if(p.pulse > Math.PI * 2) p.pulse -= Math.PI * 2;
      }else if(season === "winter"){
        p.x += Math.sin(p.sway) * 0.35 + p.speedX * 0.28;
        p.y += p.speedY * 0.72;
      }else if(season === "autumn"){
        p.x += Math.sin(p.sway) * 0.7 + p.speedX;
        p.y += p.speedY;
      }else{
        p.x += Math.sin(p.sway) * 0.58 + p.speedX;
        p.y += p.speedY * 0.86;
      }

      if(p.y > height + 26 || p.x < -40 || p.x > width + 40){
        resetSeasonParticle(p, width, height, season, true);
      }

      drawSeasonParticle(p);
    }

    rafId = requestAnimationFrame(stepSeason);
    seasonEffectState.rafId = rafId;
  }

  const onResize = () => resizeSeasonCanvas();
  resizeSeasonCanvas();
  stepSeason();
  window.addEventListener("resize", onResize);
  seasonEffectState.onResize = onResize;
}
