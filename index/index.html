<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../room10-paths.js"></script>

<style>
*{box-sizing:border-box;}

:root{
  --text:#5b4632;
  --ink:#6a4223;
  --line:rgba(216,157,106,0.35);
  --soft-line:rgba(196,139,86,0.16);
  --card-shadow:rgba(69,47,28,0.24);
  --identity-scale:1;

  --identity-right:5.20%;
  --identity-top:5.15%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);
  --identity-name-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:linear-gradient(180deg, #f3ecdf 0%, #eee4d4 48%, #e4d4bf 100%);
  color:var(--text);
  transition:background .35s ease;
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}


/* ===== 全站统一操作失败弹窗 ===== */
body.room10ModalOpen{overflow:hidden!important;}

.room10ErrorMask{
  position:fixed;
  inset:0;
  z-index:2200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(60,42,23,.22);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

.room10ErrorMask.show{display:flex;}

.room10ErrorDialog{
  width:min(430px,92vw);
  max-height:calc(100dvh - 40px);
  overflow:auto;
  padding:24px 22px 20px;
  border:1px solid rgba(203,167,123,.30);
  border-radius:22px;
  background:rgba(255,249,241,.98);
  color:#6a4525;
  text-align:center;
  box-shadow:0 18px 45px rgba(85,58,34,.20),inset 0 1px 0 rgba(255,255,255,.94);
}

.room10ErrorTitle{margin:0 0 10px;color:#6f4726;font-size:20px;font-weight:900;line-height:1.25;}
.room10ErrorMessage{margin:0;font-size:14px;font-weight:700;line-height:1.75;white-space:pre-line;}
.room10ErrorMeta{margin-top:10px;color:#9a7656;font-size:10px;line-height:1.45;white-space:pre-line;}
.room10ErrorConfirm{
  appearance:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:108px;
  height:40px;
  margin:16px auto 0;
  padding:0 18px;
  border:0;
  border-radius:12px;
  background:linear-gradient(180deg,#efd5ab 0%,#dfbd8a 100%);
  color:#6a4120;
  font-family:inherit;
  font-size:13px;
  font-weight:900;
  line-height:1;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,247,230,.95),0 4px 12px rgba(112,83,52,.10);
  transition:transform .18s ease,filter .18s ease;
}
.room10ErrorConfirm:hover{transform:translateY(-1px);filter:brightness(1.03);}
.room10ErrorConfirm:focus-visible{outline:2px solid rgba(151,111,82,.55);outline-offset:3px;}


/* ===== 首页舞台 ===== */
#home{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#homeStage{
  position:relative;
  width:fit-content;
  height:fit-content;
  max-width:100vw;
  max-height:100vh;
}

#homeImage{
  display:block;
  max-width:100vw;
  max-height:100vh;
  width:auto;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

#seasonLayer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1;
  display:block;
}

/* =========================================================
   身份组件：使用全站通用模板结构，首页不显示房间切换按钮
========================================================= */
#topActions{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:20;
  pointer-events:none;
  overflow:visible;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#siteNoticeBtn,
#loginOpenBtn,
#logoutBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

#topIdentityBadge{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

#topIdentityBadge .identityText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1.22;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
  transform:translateY(var(--identity-name-y));
}

#siteNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

#siteNoticeBtn,
#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

#siteNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

#siteNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice + #siteNoticeCount{
  display:flex;
}

#loginOpenBtn,
#logoutBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

#siteNoticeBtn:hover,
#loginOpenBtn:hover,
#logoutBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)), 72vw);
  max-height:min(calc(540px * var(--s)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

#siteNoticePanel.show{display:block;}

.siteNoticeHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:calc(8px * var(--s));
  margin-bottom:calc(10px * var(--s));
}

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
}

.noticeClear{
  appearance:none;
  border:none;
  background:transparent;
  color:#9a7957;
  font-size:calc(10px * var(--s));
  font-weight:700;
  cursor:pointer;
  padding:calc(2px * var(--s)) calc(4px * var(--s));
  border-radius:calc(8px * var(--s));
}

.noticeClear:hover{background:rgba(201,142,86,.12);color:#7c5834;}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--s));
}

.siteNoticeItem{
  width:100%;
  display:flex;
  gap:calc(8px * var(--s));
  align-items:flex-start;
  padding:calc(10px * var(--s));
  border-radius:calc(12px * var(--s));
  background:rgba(255,252,247,0.82);
  border:none;
  color:inherit;
  font:inherit;
  text-align:left;
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.92),
    0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(120,92,63,0.05);
}

button.siteNoticeItem{
  cursor:pointer;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

button.siteNoticeItem:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,248,235,0.98);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.96),
    0 calc(5px * var(--s)) calc(14px * var(--s)) rgba(120,92,63,0.09);
}

.siteNoticeItemIcon{
  width:calc(22px * var(--s));
  height:calc(22px * var(--s));
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  font-size:calc(11px * var(--s));
  background:rgba(217,163,100,.16);
  color:#8a5a2c;
}

.siteNoticeItemText{flex:1;min-width:0;}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--s));
  font-weight:800;
  line-height:1.5;
  word-break:break-word;
}

.siteNoticeItemDesc{
  margin-top:calc(2px * var(--s));
  color:#8a6644;
  font-size:calc(11px * var(--s));
  line-height:1.55;
  word-break:break-word;
}

.siteNoticeActionLabel{
  flex:0 0 auto;
  align-self:center;
  min-height:calc(26px * var(--s));
  padding:0 calc(9px * var(--s));
  border-radius:calc(9px * var(--s));
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg, rgba(239,213,171,.96), rgba(223,189,138,.94));
  color:#6a4120;
  font-size:calc(10px * var(--s));
  font-weight:900;
  white-space:nowrap;
}

/* ===== SVG 热区 ===== */
#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

#map rect{
  fill:transparent;
  stroke:transparent;
  cursor:pointer;
  pointer-events:all;
  transition:.2s;
}

#map rect:hover{
  fill:rgba(255,220,120,.22);
  stroke:#ffd87a;
  stroke-width:.6;
}

/* ===== 登录UI ===== */
#loginUI{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#loginUI.show{
  display:flex;
}

.login-panel{
  position:relative;
  width:min(720px, 94vw);
}

.login-panel img{
  width:100%;
  display:block;
  pointer-events:none;
}

#username,
#password{
  position:absolute;
  left:36.2%;
  height:8.1%;
  border:none;
  outline:none;
  padding:0 10px;
  font-size:18px;
  color:#5b3e28;
  background:transparent;
  line-height:1.1;
}

#username{
  top:40%;
  width:27.5%;
}

#password{
  top:56%;
  width:20%;
}

#togglePassword{
  position:absolute;
  top:56%;
  left:56%;
  width:8%;
  height:8.1%;
  border:none;
  cursor:pointer;
  background:rgba(255,215,120,.15);
  border-radius:6px;
}

#togglePassword:hover{
  background:rgba(255,215,120,.35);
  box-shadow:0 0 8px rgba(255,220,120,.6);
}

#loginBtn{
  position:absolute;
  top:68%;
  left:40%;
  width:20%;
  height:9%;
  border:none;
  background:transparent;
  cursor:pointer;
}

#registerLink{
  position:absolute;
  top:50%;
  left:52%;
  transform:translateX(-50%);
  color:#7a4f2b;
  font-size:14px;
  font-weight:600;
  text-decoration:underline;
  cursor:pointer;
  background:none;
  border:none;
  padding:0;
  white-space:nowrap;
}

#registerLink:hover{
  color:#9b6334;
}

#loginMessage{
  position:absolute;
  top:34.8%;
  left:53.5%;
  transform:translateX(-50%);
  text-align:center;
  color:#7a4f2b;
  font-size:14px;
  font-weight:600;
  width:42%;
  max-width:320px;
  white-space:normal;
  line-height:1.25;
}

.closeBtn{
  position:absolute;
  top:4px;
  right:6px;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  background:white;
  cursor:pointer;
  font-size:18px;
}

/* =========================
   统一奖励弹窗：首页礼包领取共用
========================= */

.reward-mask{
  position:fixed;
  inset:0;
  z-index:1200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(64,45,30,0.30);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  --reward-scale:1;
}

.reward-mask.show{display:flex;}

.reward-card{
  position:relative;
  width:min(calc(430px * var(--reward-scale)), calc(100vw - 28px));
  max-height:calc(100dvh - 28px);
  padding:calc(28px * var(--reward-scale)) calc(24px * var(--reward-scale)) calc(22px * var(--reward-scale));
  border-radius:calc(26px * var(--reward-scale));
  overflow:hidden auto;
  text-align:center;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 16%, rgba(255,226,235,.68), transparent 30%),
    radial-gradient(circle at 86% 18%, rgba(255,240,181,.62), transparent 32%),
    linear-gradient(180deg, rgba(255,253,247,.98), rgba(255,244,226,.96));
  border:calc(2px * var(--reward-scale)) solid var(--line);
  box-shadow:
    0 calc(22px * var(--reward-scale)) calc(54px * var(--reward-scale)) var(--card-shadow),
    inset 0 1px 0 rgba(255,255,255,.9);
  animation:rewardPop .42s cubic-bezier(.2, 1.12, .34, 1) both;
}

.reward-card::before,
.reward-card::after{
  position:absolute;
  left:calc(12px * var(--reward-scale));
  right:calc(12px * var(--reward-scale));
  font-size:calc(15px * var(--reward-scale));
  letter-spacing:calc(8px * var(--reward-scale));
  white-space:nowrap;
  overflow:hidden;
  pointer-events:none;
}

.reward-card::before{
  content:"✿  ❀  ✽  ✿  ❀  ✽  ✿";
  top:calc(9px * var(--reward-scale));
  color:rgba(209,120,148,0.52);
}

.reward-card::after{
  content:"✿  ❀  ✽  ✿  ❀  ✽  ✿";
  bottom:calc(8px * var(--reward-scale));
  color:rgba(199,145,75,0.44);
}

@keyframes rewardPop{
  0%{opacity:0;transform:translateY(calc(12px * var(--reward-scale))) scale(.9);}
  64%{opacity:1;transform:translateY(0) scale(1.025);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

.reward-close{
  position:absolute;
  z-index:6;
  top:calc(12px * var(--reward-scale));
  right:calc(12px * var(--reward-scale));
  width:calc(30px * var(--reward-scale));
  height:calc(30px * var(--reward-scale));
  border:none;
  border-radius:999px;
  background:rgba(255,250,242,.88);
  color:#7b5636;
  font-size:calc(18px * var(--reward-scale));
  font-weight:900;
  line-height:1;
  cursor:pointer;
  box-shadow:
    0 calc(2px * var(--reward-scale)) calc(8px * var(--reward-scale)) rgba(105,75,43,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.reward-close:hover{filter:brightness(1.02);}

.reward-petals{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.reward-petals span{
  position:absolute;
  top:calc(-18px * var(--reward-scale));
  color:rgba(220,132,154,.56);
  font-size:calc(16px * var(--reward-scale));
  opacity:0;
  text-shadow:0 calc(2px * var(--reward-scale)) calc(4px * var(--reward-scale)) rgba(255,255,255,.76);
  animation:rewardPetalFall 1.35s ease-in-out both;
}

.reward-petals span:nth-child(1){left:12%;animation-delay:.05s;}
.reward-petals span:nth-child(2){left:28%;animation-delay:.18s;}
.reward-petals span:nth-child(3){left:48%;animation-delay:.02s;}
.reward-petals span:nth-child(4){left:66%;animation-delay:.22s;}
.reward-petals span:nth-child(5){left:82%;animation-delay:.10s;}

@keyframes rewardPetalFall{
  0%{opacity:0;transform:translateY(calc(-14px * var(--reward-scale))) rotate(0deg) scale(.78);}
  20%{opacity:.85;}
  100%{opacity:0;transform:translateY(calc(145px * var(--reward-scale))) rotate(160deg) scale(1);}
}

.reward-content{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.reward-icon{
  width:calc(62px * var(--reward-scale));
  height:calc(62px * var(--reward-scale));
  margin:calc(4px * var(--reward-scale)) auto calc(12px * var(--reward-scale));
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,246,226,.78);
  border:1px solid rgba(220,164,102,.25);
  box-shadow:0 calc(8px * var(--reward-scale)) calc(20px * var(--reward-scale)) rgba(126,92,51,.10), inset 0 1px 0 rgba(255,255,255,.85);
  font-size:calc(34px * var(--reward-scale));
}

.reward-icon img{
  display:block;
  width:calc(46px * var(--reward-scale));
  height:calc(46px * var(--reward-scale));
  object-fit:contain;
}

.reward-label{
  min-height:calc(25px * var(--reward-scale));
  padding:0 calc(13px * var(--reward-scale));
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:rgba(255,249,232,.66);
  border:1px solid rgba(218,166,87,.20);
  color:#b26a3a;
  font-size:calc(13px * var(--reward-scale));
  font-weight:950;
  line-height:1;
  letter-spacing:.06em;
  animation:rewardStamp .42s ease both;
}

.reward-title{
  position:relative;
  max-width:100%;
  margin:calc(10px * var(--reward-scale)) auto calc(8px * var(--reward-scale));
  padding:calc(8px * var(--reward-scale)) calc(18px * var(--reward-scale));
  border-radius:999px;

function showPageError(message, detail = ""){
  const title = normalizeTextValue(message) || "本次操作未成功";
  const rawDetail = normalizeTextValue(detail);
  console.error(title, rawDetail || "");

  room10ErrorMessage.textContent = `${title}。\n请截图此提示，并及时反馈给维修工。`;
  room10ErrorMeta.textContent = [
    rawDetail ? `详情：${rawDetail}` : "",
    `页面：${document.title || location.pathname}`,
    `时间：${new Date().toLocaleString("zh-CN", { hour12:false })}`
  ].filter(Boolean).join("\n");

  if(!room10ErrorMask.classList.contains("show")){
    room10ErrorReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  }

  room10ErrorMask.classList.add("show");
  room10ErrorMask.setAttribute("aria-hidden", "false");
  syncRoom10BodyLock();
  requestAnimationFrame(() => room10ErrorConfirm.focus());
}

function clearPageError(runCallback = true){
  room10ErrorMask.classList.remove("show");
  room10ErrorMask.setAttribute("aria-hidden", "true");
  syncRoom10BodyLock();

  const target = room10ErrorReturnFocus;
  const callback = room10ErrorAfterCloseCallback;
  room10ErrorReturnFocus = null;
  room10ErrorAfterCloseCallback = null;

  if(target?.isConnected) target.focus();
  if(runCallback && typeof callback === "function") callback();
}

function formatSupabaseError(error){
  if(!error) return "";
  return [
    normalizeTextValue(error.code) ? `code=${normalizeTextValue(error.code)}` : "",
    normalizeTextValue(error.message) ? `message=${normalizeTextValue(error.message)}` : "",
    normalizeTextValue(error.details) ? `details=${normalizeTextValue(error.details)}` : "",
    normalizeTextValue(error.hint) ? `hint=${normalizeTextValue(error.hint)}` : ""
  ].filter(Boolean).join(" | ") || normalizeTextValue(String(error));
}

function reportPageError(error, message, detail = ""){
  if(error?.room10Reported) return;
  showPageError(message, detail || formatSupabaseError(error) || error?.message || String(error || ""));
}

function fail(message, detail = ""){
  showPageError(message, detail);
  const error = new Error(detail ? `${message} ${detail}` : message);
  error.room10Reported = true;
  throw error;
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function normalizeTextValue(value){
  return String(value ?? "").trim();
}

function formatTextTemplate(template, vars = {}){
  return String(template ?? "").replace(/\{(\w+)\}/g, (match, name) => (
    Object.prototype.hasOwnProperty.call(vars, name)
      ? String(vars[name])
      : match
  ));
}

function text(key){
  const value = pageTexts.get(key);
  if(!normalizeTextValue(value)){
    const message = pageTexts.get("error.page_text_missing") || "首页文案配置缺失";
    fail(message, `page_key=${PAGE_KEY}, text_key=${key}`);
  }
  return String(value);
}


async function loadPageTexts(){
  const { data, error } = await client.rpc("get_room10_page_texts", {
    p_page_key:PAGE_KEY,
    p_include_inactive:false
  });

  if(error){
    fail("首页文案读取失败", error.message || "get_room10_page_texts");
  }

  pageTexts = new Map();
  (Array.isArray(data) ? data : []).forEach(row => {
    const key = normalizeTextValue(row.text_key);
    if(key) pageTexts.set(key, String(row.text_value ?? ""));
  });

  const missingKeys = REQUIRED_TEXT_KEYS.filter(key => !normalizeTextValue(pageTexts.get(key)));
  if(missingKeys.length){

function getStoredMemberSnapshot(){

function hasMemberAccess(member = currentMember || getStoredMemberSnapshot()){

function saveStoredMember(member){

  localStorage.setItem(STORAGE_KEYS.role, member.role);

}

function clearStoredLogin(){
  LOGIN_STORAGE_KEYS.forEach(key => localStorage.removeItem(key));
  sessionStorage.removeItem(HOLIDAY_GIFT_CHECK_KEY);
  currentMember = null;
}

function validateMember(row, sourceLabel){
  const id = normalizeTextValue(row?.id || row?.member_id);
  const nickname = normalizeTextValue(row?.nickname);
  const role = normalizeTextValue(row?.role).toLowerCase();
  const memberCode = normalizeTextValue(row?.member_code || row?.memberCode || row?.code);

  if(!id || !nickname || !memberCode){
    fail(text("login.config_error"), sourceLabel);
  }

  return {
    id,
    nickname,
    role,
    memberCode,
    invalidRole:!VALID_MEMBER_ROLES.has(role)
  };
}

function extractIdentityMember(data){
  if(Array.isArray(data)){
    return data.length ? extractIdentityMember(data[0]) : null;
  }

  const payload = data && typeof data === "object" ? data : null;
  if(!payload) return null;

  for(const key of ["member", "identity", "data", "item", "record"]){
    const value = payload[key];
    if(value && typeof value === "object"){
      const extracted = extractIdentityMember(value);
      if(extracted) return extracted;
    }
  }

  if(Array.isArray(payload.items) && payload.items.length){
    const extracted = extractIdentityMember(payload.items[0]);
    if(extracted) return extracted;
  }

  if(payload.id || payload.member_id) return payload;
  return null;
}

function identityPayloadExplicitlyMissing(data){
  if(data === null || data === undefined) return true;
  if(Array.isArray(data)) return data.length === 0;
  if(typeof data !== "object") return false;
  const status = normalizeTextValue(data.status || data.code).toLowerCase();
  return data.found === false || status === "not_found" || status === "member_not_found";
}

async function fetchCurrentMember(){
  if(!isLoggedIn()){
    currentMember = null;
    return null;
  }

  const memberId = getStoredMemberId();
  const memberCode = getStoredMemberCode();
  if(!memberId || !memberCode){
    clearStoredLogin();
    return null;
  }

  const previousMember = currentMember;
  const { data, error } = await client.rpc("get_index_member_identity", {
    p_member_id:memberId,
    p_member_code:memberCode
  });

  if(error){
    currentMember = previousMember?.id === memberId ? previousMember : null;
    showPageError(text("error.member_read_failed"), error.message || "get_index_member_identity RPC 失败");
    return currentMember;
  }

  const identityRow = extractIdentityMember(data);
  if(!identityRow){
    currentMember = null;
    if(identityPayloadExplicitlyMissing(data)){
      clearStoredLogin();
    }else{
      showPageError(text("error.member_read_failed"), "get_index_member_identity 返回结构无法识别");
    }
    return null;
  }

  const member = validateMember(identityRow, "get_index_member_identity 返回值");
  if(member.invalidRole){
    clearStoredLogin();
    showPageError(text("role.invalid"), member.role);
    return null;
  }

  currentMember = member;
  saveStoredMember(member);
  return member;
}

function findConfiguredAssetByFileName(fileName){
  const target = normalizeTextValue(fileName);
  const assets = window.ROOM10_PATHS?.assets;

  if(!target || !assets) return "";

  const matches = [];

  function walk(value){
    if(!value || typeof value !== "object") return;

    Object.values(value).forEach(entry => {
      if(entry && typeof entry === "object"){
        walk(entry);
        return;
      }

      const path = normalizeTextValue(entry);
      if(!path) return;

      const baseName = path.split("/").pop();
      if(baseName === target){
        matches.push(path);
      }
    });
  }

  walk(assets);

  if(matches.length !== 1) return "";
  return typeof window.room10Path === "function"
    ? window.room10Path(matches[0])
    : matches[0];
}

function resolveRewardIcon(rawIcon, rewardName){
  const name = normalizeTextValue(rewardName);
  const icon = normalizeTextValue(rawIcon);

  if(name === "金币"){
    return requireAsset("root.coin");
  }

  if(!icon) return "";

  if(isUnsafeUrl(icon)) return "";

  if(/^(https?:|blob:|\/)/i.test(icon)){
    return icon;
  }

  if(/^[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)+$/.test(icon) && !/\.(png|jpg|jpeg|gif|webp|svg)$/i.test(icon)){
    const assetUrl = typeof window.room10Asset === "function"
      ? window.room10Asset(icon)
      : "";

    if(normalizeTextValue(assetUrl)){
      return assetUrl;
    }
  }

  if(icon.includes("/") && /\.(png|jpg|jpeg|gif|webp|svg)(\?.*)?$/i.test(icon)){
    return typeof window.room10Path === "function"
      ? window.room10Path(icon)
      : icon;
  }

  if(/\.(png|jpg|jpeg|gif|webp|svg)(\?.*)?$/i.test(icon)){
    const cleanFileName = icon.split("?")[0];
    const configuredAsset = findConfiguredAssetByFileName(cleanFileName);

    if(configuredAsset){
      return configuredAsset;
    }
  }

  return icon;
}

function normalizeRewardItem(item, index){
  if(!item || typeof item !== "object"){
    fail(text("error.reward_config_invalid"), `rewards[${index}]`);
  }

  const name = normalizeTextValue(item.name);
  const icon = resolveRewardIcon(item.icon, name);
  const amount = item.amount;
  const unit = String(item.unit ?? "");
  const prefix = String(item.prefix ?? "");

  if(!name){
    fail(text("error.reward_config_invalid"), `rewards[${index}].name`);
  }

  return { name, icon, amount, unit, prefix };
}

function formatRewardAmount(item){
  if(item.amount === "" || item.amount === null || item.amount === undefined){
    return "";
  }
  if(typeof item.amount === "number"){
    const sign = item.amount > 0 ? "+" : "";
    return `${sign}${item.amount}${item.unit || ""}`;
  }
  return `${item.prefix || ""}${item.amount}${item.unit || ""}`;
}

function isImageIcon(icon){
  return /\.(png|jpg|jpeg|gif|webp|svg)(\?.*)?$/i.test(String(icon || "").trim());
}

function renderRewardIcon(icon, name){
  const safeIcon = normalizeTextValue(icon);
  if(!safeIcon) return "";

  if(isImageIcon(safeIcon)){
    return `<img src="${escapeHtml(safeIcon)}" alt="${escapeHtml(name)}" loading="lazy">`;
  }

  return escapeHtml(safeIcon);
}

function normalizeRewardModalPayload(modal, sourceLabel){
  if(!modal || typeof modal !== "object"){
    fail(text("error.reward_config_invalid"), `${sourceLabel}.modal`);
  }

  const type = normalizeTextValue(modal.type);
  const label = normalizeTextValue(modal.label);
  const title = normalizeTextValue(modal.title);
  const icon = resolveRewardIcon(modal.icon, title);
  const desc = normalizeTextValue(modal.desc);
  const rewards = Array.isArray(modal.rewards) ? modal.rewards.map(normalizeRewardItem) : [];

  if(!type || !label || !title || !desc){
    fail(text("error.reward_config_invalid"), `${sourceLabel}.modal.type/icon/label/title/desc`);
  }

  return { type, icon, label, title, desc, rewards };
}

function renderRewards(rewards){
  rewardListEl.innerHTML = "";
  rewardListEl.className = "reward-list";
  rewardSectionTitleEl.className = "reward-section-title";
  rewardSectionTitleEl.textContent = text("reward.section_title");

  if(!rewards.length){
    rewardListEl.classList.add("empty");
    rewardSectionTitleEl.classList.add("empty");
    return;
  }

  rewardListEl.classList.add(`count-${Math.min(rewards.length, 3)}`);

  rewards.forEach(reward => {
    const item = document.createElement("div");
    item.className = "reward-item";
    item.innerHTML = `
      <div class="reward-item-icon">${renderRewardIcon(reward.icon, reward.name)}</div>
      <div class="reward-item-name">${escapeHtml(reward.name)}</div>
      <div class="reward-item-amount">${escapeHtml(formatRewardAmount(reward))}</div>
    `;
    rewardListEl.appendChild(item);
  });
}

function syncRoom10BodyLock(){
  const hasOpenModal = loginUI.classList.contains("show")
    || rewardMask.classList.contains("show")
    || room10ErrorMask.classList.contains("show");
  document.body.classList.toggle("room10ModalOpen", hasOpenModal);
}

function openRewardModal(modal){
  rewardMask.dataset.type = modal.type;
  rewardIconEl.innerHTML = renderRewardIcon(modal.icon, modal.title);
  rewardLabelEl.textContent = modal.label;
  rewardTitleEl.textContent = modal.title;
  rewardDescEl.textContent = modal.desc;
  renderRewards(modal.rewards);

  rewardModalShowing = true;
  rewardMask.classList.add("show");
  rewardMask.setAttribute("aria-hidden", "false");
  syncRoom10BodyLock();
}

function showRewardModal(modal, afterClose = null, claimAction = null){
  rewardQueue.push({ modal, afterClose, claimAction });
  if(!rewardModalShowing){
    playNextRewardModal();
  }
}

function playNextRewardModal(){
  const next = rewardQueue.shift();
  if(!next){
    rewardModalShowing = false;
    rewardAfterCloseCallback = null;
    return;
  }

  rewardAfterCloseCallback = typeof next.afterClose === "function" ? next.afterClose : null;
  currentRewardClaimAction = next.claimAction || null;
  rewardConfirmBtn.disabled = false;
  openRewardModal(next.modal);
}

function closeRewardModal(force = false){
  if(rewardClaimInFlight && !force) return;

  rewardMask.classList.remove("show");
  rewardMask.setAttribute("aria-hidden", "true");
  syncRoom10BodyLock();

  const callback = rewardAfterCloseCallback;
  rewardAfterCloseCallback = null;
  currentRewardClaimAction = null;
  rewardConfirmBtn.disabled = false;

  if(rewardQueue.length){
    setTimeout(playNextRewardModal, 120);
    return;
  }

  rewardModalShowing = false;

  if(typeof callback === "function"){
    callback();
  }
}

async function maybeClaimIndexDailyLoginReward(){
  if(!isLoggedIn() || dailyLoginCheckInFlight || !currentMember) return false;

  dailyLoginCheckInFlight = true;

  try{
    const { data, error } = await client.rpc("claim_index_daily_login_reward", {
      p_member_id:currentMember.id,
      p_member_code:currentMember.memberCode,
      p_timezone_offset_minutes:new Date().getTimezoneOffset()
    });

    if(error){
      showPageError("每日登录奖励处理失败", error.message || "claim_index_daily_login_reward RPC 失败");
      return false;
    }

    if(data?.success === false){
      if(data?.reason !== "role_not_allowed"){
        showPageError("每日登录奖励处理失败", data?.message || data?.reason || "未知错误");
      }
      return false;
    }

    if(!data?.show_modal) return false;

  }catch(err){
    reportPageError(err, "每日登录奖励处理失败");

  }finally{
    dailyLoginCheckInFlight = false;
  }
}

function runAfterRewardQueue(callback, hasRewards){
  if(typeof callback !== "function") return;
  if(!hasRewards){
    callback();
    return;
  }

  const lastQueued = rewardQueue.at(-1);
  if(lastQueued){
    lastQueued.afterClose = callback;
  }else if(rewardModalShowing){
    rewardAfterCloseCallback = callback;
  }else{
    callback();
  }
}

async function runIndexLoginEvents(afterAll = null){
  if(!isLoggedIn() || !currentMember || !hasMemberAccess()){
    if(typeof afterAll === "function") afterAll();
    return false;
  }

  if(room10ErrorMask.classList.contains("show")){
    if(typeof afterAll === "function"){
      room10ErrorAfterCloseCallback = () => runIndexLoginEvents(afterAll);
    }
    return false;
  }

  let hasRewards = false;
  for(const check of [
    maybeClaimIndexDailyLoginReward,
    maybeClaimJoinAnniversaryAchievements,
    maybeClaimLoginHolidayGifts
  ]){
    hasRewards = (await check()) || hasRewards;
    if(room10ErrorMask.classList.contains("show")){
      if(typeof afterAll === "function"){
        room10ErrorAfterCloseCallback = () => runAfterRewardQueue(afterAll, hasRewards);
      }
      return hasRewards;
    }
  }

  if(typeof afterAll === "function") runAfterRewardQueue(afterAll, hasRewards);
  return hasRewards;
}

async function maybeClaimJoinAnniversaryAchievements(){
  if(!isLoggedIn() || anniversaryCheckInFlight || !currentMember) return false;

  anniversaryCheckInFlight = true;

  const isTransientNetworkError = error => /load failed|failed to fetch|networkerror|network request failed|fetch failed/i.test(
    formatSupabaseError(error) || error?.message || String(error || "")
  );

  const callAnniversaryRpc = async args => {
    let lastError = null;

    for(let attempt = 1; attempt <= 3; attempt++){
      try{
        const response = await client.rpc("claim_join_anniversary_achievements", args);
        if(!response.error || !isTransientNetworkError(response.error)) return response;
        lastError = response.error;
      }catch(error){
        if(!isTransientNetworkError(error)) throw error;
        lastError = error;
      }

      if(attempt < 3){
        await new Promise(resolve => setTimeout(resolve, 300 * attempt));
      }
    }

    return { data:null, error:lastError };
  };

  try{
    const memberId = currentMember.id;
    const memberCode = currentMember.memberCode;

    let { data, error } = await callAnniversaryRpc({
      p_member_id:memberId,
      p_member_code:memberCode,
      p_local_date:getLocalDateString()
    });

    if(error && normalizeTextValue(error.code).toUpperCase() === "PGRST202"){
      ({ data, error } = await callAnniversaryRpc({
        p_member_id:memberId,
        p_member_code:memberCode
      }));
    }

    if(error){
      showPageError(
        "加入周年成就读取失败",
        formatSupabaseError(error) || "claim_join_anniversary_achievements RPC 失败"
      );
      return false;
    }

    const claims = Array.isArray(data?.claims) ? data.claims : [];
    if(!data?.claimed_any || claims.length === 0) return false;

    claims.forEach((claim, index) => {
      const modal = normalizeRewardModalPayload(claim?.modal, `claim_join_anniversary_achievements.claims[${index}]`);
      const achievementId = normalizeTextValue(claim?.achievement_id);
      showRewardModal(
        modal,
        null,
        achievementId
          ? { type:"honor", itemType:"achievement", itemId:achievementId }
          : null
      );
    });

    return true;
  }catch(err){
    reportPageError(err, "加入周年成就处理失败");
    return false;
  }finally{
    anniversaryCheckInFlight = false;
  }
}

async function maybeClaimLoginHolidayGifts(){
  if(!isLoggedIn() || holidayGiftCheckInFlight || !currentMember) return false;

  if(hasCheckedHolidayGiftToday(currentMember.id)){
    return false;
  }

  holidayGiftCheckInFlight = true;

  try{
    const { data, error } = await client.rpc("claim_login_holiday_gifts", {
      p_member_id: currentMember.id,
      p_member_code: currentMember.memberCode,
      p_local_date: getLocalDateString()
    });

    if(error){
      showPageError("登录礼包读取失败", error.message || "claim_login_holiday_gifts RPC 失败");
      return false;
    }

    markHolidayGiftCheckedToday(currentMember.id);

    const claims = Array.isArray(data?.claims) ? data.claims : [];
    if(!data?.claimed_any || claims.length === 0) return false;

    claims.forEach((claim, index) => {
      const modal = normalizeRewardModalPayload(claim?.modal, `claim_login_holiday_gifts.claims[${index}]`);
      const pendingRewardId = normalizeTextValue(claim?.pending_reward_id);
      showRewardModal(
        modal,
        null,
        pendingRewardId
          ? { type:"holiday", pendingRewardId }
          : null
      );
    });

    return true;
  }catch(err){
    reportPageError(err, "登录礼包处理失败");
    return false;
  }finally{
    holidayGiftCheckInFlight = false;
  }
}

async function claimCurrentReward(){
  if(rewardClaimInFlight) return;

  const action = currentRewardClaimAction;
  if(!action){
    closeRewardModal();
    return;
  }

  if(!currentMember){
    showPageError("领取失败", "登录状态已失效，请重新登录。");
    return;
  }

  rewardClaimInFlight = true;
  rewardConfirmBtn.disabled = true;

  try{
    let response;

    if(action.type === "honor"){
      response = await client.rpc("claim_honor_reward", {
        p_member_id:currentMember.id,
        p_member_code:currentMember.memberCode,
        p_item_type:action.itemType,
        p_item_id:String(action.itemId)
      });
    }else if(action.type === "holiday"){
      response = await client.rpc("claim_pending_holiday_reward", {
        p_member_id:currentMember.id,
        p_member_code:currentMember.memberCode,
        p_pending_reward_id:action.pendingRewardId
      });
    }else{
      closeRewardModal();
      return;
    }

    if(response.error){
      showPageError("领取失败", response.error.message || "奖励领取 RPC 失败");
      return;
    }

    const result = Array.isArray(response.data) ? (response.data[0] || {}) : (response.data || {});
    if(result.ok === false || result.success === false){
      showPageError("领取失败", result.message || "奖励领取失败。");
      return;
    }

    clearPageError(false);
    noticeCache.at = 0;
    rewardClaimInFlight = false;
    closeRewardModal(true);
    await renderNotices();
  }catch(err){
    reportPageError(err, "领取失败");
  }finally{
    rewardClaimInFlight = false;
    rewardConfirmBtn.disabled = false;
  }
}

function getNoticeAckStorageKey(){
  const memberId = normalizeTextValue(currentMember?.id || getStoredMemberId());
  return memberId ? `${NOTICE_ACK_KEY}:${memberId}` : NOTICE_ACK_KEY;
}

function getAckSignature(){
  return localStorage.getItem(getNoticeAckStorageKey()) || "";
}

function setAckSignature(signature){
  localStorage.setItem(getNoticeAckStorageKey(), String(signature || ""));
}

function setNoticeCount(count){
  const n = Number(count) || 0;
  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);
}

function validateNoticeItem(item, index){
  const noticeKey = normalizeTextValue(item?.notice_key || item?.id);
  const noticeType = normalizeTextValue(item?.notice_type || item?.type);
  const icon = normalizeTextValue(item?.icon);
  const main = normalizeTextValue(item?.main || item?.title);
  const sub = normalizeTextValue(item?.sub || item?.description);
  const targetPage = normalizeTextValue(item?.target_page);
  const targetId = normalizeTextValue(item?.target_id);
  const actionLabel = normalizeTextValue(item?.action_label);

  if(!main){
    fail(text("error.notice_config_invalid"), `items[${index}].main`);
  }

  return {
    noticeKey,
    noticeType,
    icon,
    main,
    sub,
    targetPage,
    targetId,
    actionLabel
  };
}

async function loadNoticeItems(){
  const member = currentMember;
  const memberId = normalizeTextValue(member?.id);
  const memberCode = normalizeTextValue(member?.memberCode);

  if(!memberId || !memberCode){
    return { items: [], signature: "" };
  }

  const now = Date.now();
  if(noticeCache.memberId === memberId && now - noticeCache.at < 15000){
    return { items: noticeCache.items, signature: noticeCache.signature };
  }

  const { data, error } = await client.rpc("get_index_notice_items", {
    p_member_id: memberId,
    p_member_code: memberCode
  });

  if(error) throw error;

  const latestMemberId = normalizeTextValue(currentMember?.id);
  if(latestMemberId !== memberId){
    return { items: [], signature: "" };
  }

  const itemsSource = Array.isArray(data?.items) ? data.items : [];
  const items = itemsSource.map(validateNoticeItem);
  const signature = normalizeTextValue(data?.signature) || items.map(item => `${item.main}__${item.sub}`).join("||");

  noticeCache = { at: now, memberId, items, signature };
  return { items, signature };
}

async function renderNotices(){
  if(currentMember?.invalidRole){
    noticeState = { signature: "", items: [] };
    siteNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(text("role.invalid"))}</div>`;
    setNoticeCount(0);
    return;
  }

  if(!isLoggedIn() || !currentMember || !hasMemberAccess()){
    noticeState = { signature: "", items: [] };
    siteNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(text("notice.login_required"))}</div>`;
    setNoticeCount(0);
    return;
  }

  try{
    const result = await loadNoticeItems();
    const items = result.items;
    const signature = result.signature;
    noticeState = { signature, items };

    if(!items.length){
      siteNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(text("notice.empty"))}</div>`;
      setNoticeCount(0);
      return;
    }

    const ackSignature = getAckSignature();
    const hasUnread = signature && signature !== ackSignature;
    setNoticeCount(hasUnread ? items.length : 0);

    siteNoticeContent.innerHTML = `
      <div class="siteNoticeList">
        ${items.map((item, index) => {
          const tagName = item.targetPage ? "button" : "div";
          const actionText = item.targetPage
            ? `<span class="siteNoticeActionLabel">${escapeHtml(item.actionLabel || "前往处理")}</span>`
            : "";
          return `
            <${tagName}
              ${item.targetPage ? 'type="button"' : ''}
              class="siteNoticeItem"
              ${item.targetPage ? `data-notice-index="${index}"` : ''}
            >
              <div class="siteNoticeItemIcon">${escapeHtml(item.icon)}</div>
              <div class="siteNoticeItemText">
                <div class="siteNoticeItemTitle">${escapeHtml(item.main)}</div>
                <div class="siteNoticeItemDesc">${escapeHtml(item.sub)}</div>
              </div>
              ${actionText}
            </${tagName}>
          `;
        }).join("")}
      </div>
    `;
  }catch(err){
    noticeState = { signature: "", items: [] };
    siteNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(text("notice.read_error"))}</div>`;
    reportPageError(err, text("notice.read_error"));
    setNoticeCount(0);
  }
}

async function login(){
  if(loginInFlight) return;

  const nickname = normalizeLoginInput(usernameInput.value);
  const key = normalizeLoginInput(passwordInput.value);
  loginMessage.innerText = "";

  if(!nickname || !key){
    setLoginMessage(text("login.missing_input"));
    return;
  }

  loginInFlight = true;
  loginBtn.disabled = true;

  try{
    const { data, error } = await client.rpc("room10_member_login", {
      p_nickname:nickname,
      p_key_code:key
    });

    if(error){
      setLoginMessage(text("login.check_failed"));
      showPageError(text("login.check_failed"), error.message || "room10_member_login");
      return;
    }

    const loginRow = Array.isArray(data) ? data[0] : data;
    if(!loginRow?.success){
      setLoginMessage(normalizeTextValue(loginRow?.message) || text("login.no_record"));
      return;
    }

    const member = validateMember(loginRow, "room10_member_login 返回值");
    if(member.invalidRole){
      clearStoredLogin();
      setLoginMessage(text("role.invalid"));
      return;
    }

    saveStoredMember(member);
    currentMember = member;
    noticeCache.at = 0;

    const textRole = member.role === "roomer" ? "member" : member.role;
    setLoginMessage(text(`login.success.${textRole}`), true);
    await safeSyncHomeUI({ checkEvents:false, force:true });
    await new Promise(resolve => setTimeout(resolve, 420));

    const targetPage = getPendingRedirect();
    const goTarget = () => {
      if(!targetPage) return;
      clearPendingRedirect();
      window.location.href = hasMemberAccess(member)
        ? targetPage
        : getManagerPageByRole(member);
    };

    usernameInput.value = "";
    passwordInput.value = "";
    passwordInput.type = "password";
    closeLogin(true);

    const continueAfterUpgradeNotice = () => runIndexLoginEvents(goTarget);
    if(!showUpgradeLoginNoticeIfNeeded(loginRow, continueAfterUpgradeNotice)){
      await continueAfterUpgradeNotice();
    }
  }catch(err){
    setLoginMessage(text("login.failed"));
    reportPageError(err, text("login.failed"));
  }finally{
    loginInFlight = false;
    loginBtn.disabled = false;
  }
}

/* ===== 四季特效 ===== */
function getSeasonByMonth(){
  const month = new Date().getMonth() + 1;
  if(month >= 3 && month <= 5) return "spring";
  if(month >= 6 && month <= 8) return "summer";
  if(month >= 9 && month <= 11) return "autumn";
  return "winter";
}

const SEASON_CONFIGS = Object.freeze({
  spring: {
    count:24,
    driftX:0.55,
    speedMin:0.35,
    speedMax:0.95,
    sizeMin:5,
    sizeMax:11,
    alphaMin:0.45,
    alphaMax:0.78
  },
  summer: {
    count:18,
    driftX:0.28,
    speedMin:0.12,
    speedMax:0.34,
    sizeMin:2,
    sizeMax:5,
    alphaMin:0.2,
    alphaMax:0.5
  },
  autumn: {
    count:22,
    driftX:0.72,
    speedMin:0.45,
    speedMax:1.15,
    sizeMin:6,
    sizeMax:12,
    alphaMin:0.42,
    alphaMax:0.82
  },
  winter: {
    count:34,
    driftX:0.25,
    speedMin:0.28,
    speedMax:0.82,
    sizeMin:2,
    sizeMax:6,
    alphaMin:0.42,
    alphaMax:0.82
  }
});

function getSeasonConfig(season){
  return SEASON_CONFIGS[season] || SEASON_CONFIGS.spring;
}

function createSeasonParticle(width, height, season){
  const cfg = getSeasonConfig(season);
  const size = cfg.sizeMin + Math.random() * (cfg.sizeMax - cfg.sizeMin);
  return {
    x: Math.random() * width,
    y: Math.random() * height,
    size,
    alpha: cfg.alphaMin + Math.random() * (cfg.alphaMax - cfg.alphaMin),
    speedY: cfg.speedMin + Math.random() * (cfg.speedMax - cfg.speedMin),
    speedX: (Math.random() - 0.5) * cfg.driftX,
    sway: Math.random() * Math.PI * 2,
    swaySpeed: 0.004 + Math.random() * 0.012,
    rotation: Math.random() * Math.PI * 2,
    rotationSpeed: (Math.random() - 0.5) * 0.03,
    pulse: Math.random() * Math.PI * 2,
    pulseSpeed: 0.02 + Math.random() * 0.035
  };
}

function resetSeasonParticle(p, width, height, season, fromTop = true){
  const fresh = createSeasonParticle(width, height, season);
  Object.assign(p, fresh);
  p.x = Math.random() * width;
  p.y = fromTop ? (-20 - Math.random() * 80) : (Math.random() * height);
}

function drawSpringParticle(ctx, p){
  ctx.rotate(p.rotation);
  const s = p.size;
  ctx.globalAlpha = p.alpha;
  ctx.fillStyle = "rgba(255, 186, 210, 0.95)";
  ctx.beginPath();
  ctx.ellipse(-s * 0.35, -s * 0.1, s * 0.55, s * 0.36, -0.75, 0, Math.PI * 2);
  ctx.ellipse(s * 0.18, -s * 0.28, s * 0.52, s * 0.34, 0.15, 0, Math.PI * 2);
  ctx.ellipse(s * 0.28, s * 0.18, s * 0.5, s * 0.32, 0.85, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(255, 235, 170, 0.9)";
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawSummerParticle(ctx, p){
  const glow = 0.55 + Math.sin(p.pulse) * 0.18;
  ctx.globalAlpha = p.alpha * glow;
  const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size * 4.2);
  gradient.addColorStop(0, "rgba(255, 245, 165, 0.95)");
  gradient.addColorStop(0.28, "rgba(255, 234, 125, 0.45)");
  gradient.addColorStop(1, "rgba(255, 234, 125, 0)");
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(0, 0, p.size * 4.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = Math.min(1, p.alpha + 0.18);
  ctx.fillStyle = "rgba(255, 251, 196, 0.96)";
  ctx.beginPath();
  ctx.arc(0, 0, p.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawAutumnParticle(ctx, p){
  ctx.rotate(p.rotation);
  const s = p.size;
  ctx.globalAlpha = p.alpha;
  ctx.fillStyle = "rgba(201, 117, 45, 0.92)";
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.95);
  ctx.bezierCurveTo(s * 0.95, -s * 0.55, s * 0.85, s * 0.45, 0, s * 0.92);
  ctx.bezierCurveTo(-s * 0.86, s * 0.45, -s * 0.95, -s * 0.55, 0, -s * 0.95);
  ctx.fill();

  ctx.strokeStyle = "rgba(128, 78, 30, 0.75)";
  ctx.lineWidth = Math.max(0.8, s * 0.12);
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.72);
  ctx.lineTo(0, s * 0.78);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawWinterParticle(ctx, p){
  ctx.rotate(p.rotation);
  const s = p.size;
  ctx.globalAlpha = p.alpha;
  ctx.strokeStyle = "rgba(255,255,255,0.92)";
  ctx.lineWidth = Math.max(0.8, s * 0.14);

  for(let i = 0; i < 3; i++){
    const angle = (Math.PI / 3) * i;
    const x = Math.cos(angle) * s * 1.5;
    const y = Math.sin(angle) * s * 1.5;
    ctx.beginPath();
    ctx.moveTo(-x, -y);
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  ctx.globalAlpha = p.alpha * 0.65;
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.38, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.fill();
  ctx.globalAlpha = 1;
}

function initSeasonEffect(){
  const canvas = document.getElementById("seasonLayer");
  const stage = homeStage;
  if(!canvas || !stage) return;

  if(seasonEffectState.rafId){
    cancelAnimationFrame(seasonEffectState.rafId);
  }
  if(seasonEffectState.onResize){
    window.removeEventListener("resize", seasonEffectState.onResize);
  }

  const ctx = canvas.getContext("2d");
  if(!ctx) return;

  const season = getSeasonByMonth();
  const particles = [];

  function resizeSeasonCanvas(){
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    const drawWidth = rect.width;
    const drawHeight = rect.height;

    if(particles.length === 0){
      const cfg = getSeasonConfig(season);
      for(let i = 0; i < cfg.count; i++){
        particles.push(createSeasonParticle(drawWidth, drawHeight, season));
      }
    }else{
      particles.forEach(p => {
        p.x = Math.min(Math.max(p.x, 0), drawWidth);
        p.y = Math.min(Math.max(p.y, -40), drawHeight + 40);
      });
    }
  }

  function drawSeasonParticle(p){
    ctx.save();
    ctx.translate(p.x, p.y);

    if(season === "spring"){
      drawSpringParticle(ctx, p);
    }else if(season === "summer"){
      drawSummerParticle(ctx, p);
    }else if(season === "autumn"){
      drawAutumnParticle(ctx, p);
    }else{
      drawWinterParticle(ctx, p);
    }

    ctx.restore();
  }

  function stepSeason(){
    const rect = stage.getBoundingClientRect();
    const width = rect.width;
    const height = rect.height;

    ctx.clearRect(0, 0, width, height);

    if(season === "spring"){
      ctx.fillStyle = "rgba(255, 219, 233, 0.05)";
      ctx.fillRect(0, 0, width, height);
    }else if(season === "summer"){
      ctx.fillStyle = "rgba(255, 236, 166, 0.03)";
      ctx.fillRect(0, 0, width, height);
    }else if(season === "autumn"){
      ctx.fillStyle = "rgba(214, 154, 82, 0.04)";
      ctx.fillRect(0, 0, width, height);
    }else{
      ctx.fillStyle = "rgba(215, 235, 255, 0.035)";
      ctx.fillRect(0, 0, width, height);
    }

    for(const p of particles){
      p.sway += p.swaySpeed;
      p.pulse += p.pulseSpeed;
      p.rotation += p.rotationSpeed;

      if(season === "summer"){
        p.x += Math.sin(p.sway) * 0.18 + p.speedX * 0.2;
        p.y += p.speedY * 0.25;
        if(p.pulse > Math.PI * 2) p.pulse -= Math.PI * 2;
      }else if(season === "winter"){
        p.x += Math.sin(p.sway) * 0.35 + p.speedX * 0.28;
        p.y += p.speedY * 0.72;
      }else if(season === "autumn"){
        p.x += Math.sin(p.sway) * 0.7 + p.speedX;
        p.y += p.speedY;
      }else{
        p.x += Math.sin(p.sway) * 0.58 + p.speedX;
        p.y += p.speedY * 0.86;
      }

      if(p.y > height + 26 || p.x < -40 || p.x > width + 40){
        resetSeasonParticle(p, width, height, season, true);
      }

      drawSeasonParticle(p);
    }

    seasonEffectState.rafId = requestAnimationFrame(stepSeason);
  }

  const onResize = () => resizeSeasonCanvas();
  resizeSeasonCanvas();
  stepSeason();
  window.addEventListener("resize", onResize);
  seasonEffectState.onResize = onResize;
}

async function safeSyncHomeUI({ checkEvents = false, force = false } = {}){
  if(!pageTextReady) return false;
  if(homeSyncPromise) return homeSyncPromise;
  if(!force && !checkEvents && Date.now() - lastPassiveSyncAt < 15000) return false;

  homeSyncPromise = (async () => {
    try{
      await fetchCurrentMember();
      updateIdentityDisplay();
      await updateHomeImageByTime();
      syncHomeTopbarScale();
      await renderNotices();

      if(checkEvents && !room10ErrorMask.classList.contains("show")){
        await runIndexLoginEvents();
      }

      lastPassiveSyncAt = Date.now();
      return true;
    }catch(err){
      reportPageError(err, "首页同步失败");
      syncHomeTopbarScale();
      return false;
    }finally{
      homeSyncPromise = null;
    }
  })();

  return homeSyncPromise;
}

  });
  passwordInput.addEventListener("keydown", (event) => {
    if(event.key === "Enter") login();
  });

  document.getElementById("map").addEventListener("click", (event) => {
    const link = event.target.closest("a");
    if(!link) return;
    event.preventDefault();

    if(link.dataset.managerRoom === "true"){
      enterManagerRoom();
      return;
    }

    if(link.dataset.loginDoor === "true"){
      handleDoorClick();
      return;
    }

    const pageKey = link.dataset.roomKey;
    const needLogin = link.dataset.needLogin === "true";
    const allowGuestMode = link.dataset.guestMode === "true";
    enterRoom(pageKey, needLogin, allowGuestMode);
  });

  document.addEventListener("click", (event) => {
    if(!topActions.contains(event.target)){
      closeNoticePanel();
    }
  });

  rewardMask.addEventListener("click", (event) => {
    if(event.target === rewardMask){
      closeRewardModal();
    }
  });

  room10ErrorMask.addEventListener("click", (event) => {
    if(event.target === room10ErrorMask) clearPageError();
  });
  room10ErrorConfirm.addEventListener("click", () => clearPageError());
  rewardCloseBtn.addEventListener("click", () => closeRewardModal());
  rewardConfirmBtn.addEventListener("click", claimCurrentReward);

  document.addEventListener("keydown", (event) => {
    if(event.key !== "Escape") return;
    if(room10ErrorMask.classList.contains("show")) clearPageError();
    else if(rewardMask.classList.contains("show")) closeRewardModal();
    else if(loginUI.classList.contains("show")) closeLogin(false);
  });

  window.addEventListener("pageshow", (event) => {
    if(event.persisted) safeSyncHomeUI({ checkEvents:false, force:true });
  });
  window.addEventListener("resize", syncHomeTopbarScale);
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden) safeSyncHomeUI({ checkEvents:false });
  });
  window.addEventListener("storage", (event) => {
    const isNoticeAckKey = event.key === NOTICE_ACK_KEY
      || String(event.key || "").startsWith(`${NOTICE_ACK_KEY}:`);

    if(isNoticeAckKey){
      const unread = noticeState.signature && noticeState.signature !== getAckSignature();
      setNoticeCount(unread ? noticeState.items.length : 0);
      return;
    }

    if(event.key === null || SYNC_STORAGE_KEYS.has(event.key)){
      noticeCache.at = 0;
      if(!isLoggedIn()){
        clearPageError(false);
        resetRewardState();
      }
      safeSyncHomeUI({ checkEvents:false, force:true });
    }
  });
}

async function initIndexPage(){
  try{
    await loadPageTexts();
    applyStaticTexts();
    initAssets();
    bindEvents();
    bindHomeImageLoadOnce();
    await updateHomeImageByTime();

    if(homeImg.complete && homeImg.naturalWidth){
      syncHomeTopbarScale();
      initSeasonEffect();
    }

    await safeSyncHomeUI({ checkEvents:true, force:true });
  }catch(err){
    reportPageError(err, "首页初始化失败");
  }
}

initIndexPage();
</script>

</body>
</html>
