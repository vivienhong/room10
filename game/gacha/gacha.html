<!DOCTYPE html>
<html lang="zh-CN" data-room10-version="gacha-13-machine-frame-animation-fixed">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜扭蛋机</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../room10-paths.js"></script>

<style>
*{box-sizing:border-box;}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:#6b4326;
  background:
    radial-gradient(circle at 16% 8%, rgba(255,255,255,.78), rgba(255,255,255,0) 30%),
    radial-gradient(circle at 84% 10%, rgba(255,222,160,.28), rgba(255,222,160,0) 32%),
    linear-gradient(135deg, #fff3e5 0%, #f6dfc3 50%, #ead0b0 100%);
}

:root{
  --gacha-scale:clamp(.78, calc(100vw / 1180), 1.08);
  /* 扭蛋机素材层：机器主体、旋钮、投币口、掉落球共用同一坐标系 */
  --coin-slot-x:32.22%;
  --coin-slot-y:65.93%;
  --handle-x:49.80%;
  --handle-y:69.73%;
  --handle-size:16.50%;
  --ball-x:51.5%;
  --ball-y:76.5%;
  --ball-size:17%;
  --ball-open-rotate:18deg;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);

  --identity-scale:1;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-name-y:0em;
  --identity-separator-y:0em;
  --identity-role-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;
  --identity-mobile-name-y:0em;
  --identity-mobile-separator-y:0em;
  --identity-mobile-role-y:0em;
  --identity-mobile-notice-y:0em;
  --identity-mobile-button-y:0em;
  --identity-notice-mobile-top:58px;
  --reward-modal-scale:1;
  --reward-ink:#6b5141;
  --reward-text:#7d6557;
  --reward-line:rgba(190,143,112,0.24);
  --reward-soft-line:rgba(174,132,103,0.14);
  --ink:var(--reward-ink);
  --text:var(--reward-text);
  --line:var(--reward-line);
  --soft-line:var(--reward-soft-line);
  --card-shadow:rgba(106,78,55,0.20);
}

button{font-family:inherit; cursor:pointer;}
img{display:block; max-width:100%; user-select:none; -webkit-user-drag:none;}
.hidden{display:none !important;}

/* 弹窗遮罩：参考游戏房其他弹窗写法 */
.modal-layer{
  position:fixed;
  inset:0;
  z-index:120;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(73,45,24,.22);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  animation:modalLayerFadeIn .22s ease-out both;
}

@keyframes modalLayerFadeIn{
  from{
    opacity:0;
    background:rgba(73,45,24,0);
    backdrop-filter:blur(0);
    -webkit-backdrop-filter:blur(0);
  }
  to{
    opacity:1;
    background:rgba(73,45,24,.22);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
}

/* 弹窗主体 */
.gacha-card{
  position:relative;
  width:min(calc(760px * var(--gacha-scale)), 100%);
  max-height:min(92dvh, calc(760px * var(--gacha-scale)));
  min-height:min(calc(610px * var(--gacha-scale)), calc(100dvh - 36px));
  border-radius:calc(28px * var(--gacha-scale));
  padding:calc(18px * var(--gacha-scale)) calc(18px * var(--gacha-scale)) calc(16px * var(--gacha-scale));
  display:flex;
  flex-direction:column;
  gap:10px;
  background:
    radial-gradient(circle at 16% 0%, rgba(255,239,194,.40), transparent 34%),
    linear-gradient(180deg, rgba(255,253,248,.78), rgba(255,245,232,.66));
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:
    0 24px 70px rgba(74,48,26,.26),
    inset 0 1px 0 rgba(255,255,255,.96);
  overflow:hidden;
  animation:modalCardSoftIn .32s cubic-bezier(.18,.92,.22,1.08) both;
}

@keyframes modalCardSoftIn{
  from{opacity:0; transform:translateY(18px) scale(.965); filter:blur(1px);}
  to{opacity:1; transform:translateY(0) scale(1); filter:blur(0);}
}

.gacha-card::before{
  content:"";
  position:absolute;
  inset:-18% -10% auto auto;
  width:260px;
  height:260px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,218,130,.24), rgba(255,218,130,0) 68%);
  pointer-events:none;
}

.gacha-card::after{
  content:"✦  ✧    ✦    ✧";
  position:absolute;
  left:18px;
  right:18px;
  top:10px;
  color:rgba(205,145,73,.20);
  font-size:18px;
  letter-spacing:1.1em;
  white-space:nowrap;
  pointer-events:none;
}

.modal-close{
  position:absolute;
  right:14px;
  top:14px;
  z-index:20;
  width:34px;
  height:34px;
  border:none;
  border-radius:999px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(173,128,82,.18);
  color:#744727;
  font-size:22px;
  line-height:1;
  font-weight:900;
  box-shadow:0 6px 16px rgba(96,62,32,.12);
}

.modal-close.is-game-back{
  width:auto;
  min-width:92px;
  padding:0 14px;
  border-radius:999px;
  font-size:13px;
  line-height:1;
  white-space:nowrap;
}

/* =========================================================
   身份组件
========================================================= */
.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}

.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}

.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}

.identityNamePart{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  line-height:1;
  white-space:nowrap;
  font:inherit;
}

.identityNickname{transform:translateY(var(--identity-name-y));}
.identitySeparator{
  margin:0 .08em;
  color:rgba(111,87,70,.78);
  font-weight:800;
  transform:translateY(var(--identity-separator-y));
}
.identityRole{transform:translateY(var(--identity-role-y));}

.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}

.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:950;
  text-align:left;
}

.identityNoticePanel.show{display:block;}

.identityNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
  margin-bottom:calc(10px * var(--s));
}

.identityNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}


/* 扭蛋机弹窗中的身份组件位置：保留通用模板原始尺寸，不再跟随扭蛋机缩放 */
.roomIdentity{
  right:56px;
  top:14px;
  z-index:70;
}

.gacha-head{
  position:relative;
  z-index:2;
  flex:0 0 auto;
  padding:38px 42px 0;
  text-align:center;
}

.gacha-title{
  margin:0;
  color:#673b1a;
  font-size:clamp(26px, 4vw, 40px);
  line-height:1.05;
  font-weight:950;
  letter-spacing:.08em;
}

.gacha-subtitle{
  margin:7px 0 0;
  color:#8a6344;
  font-size:13px;
  line-height:1.45;
  font-weight:850;
  white-space:normal;
  overflow-wrap:anywhere;
}


/* 当前玩家：参考拆弹专家的内容区身份与登录方式 */
.player-panel{
  position:relative;
  z-index:3;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:8px;
  width:min(430px,100%);
  margin:0 auto;
}
.player-chip{
  min-width:0;
  min-height:32px;
  padding:0 12px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#775132;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(173,128,82,.16);
  font-size:12px;
  font-weight:950;
}
.player-auth-btn,.player-login-btn{
  min-height:32px;
  padding:0 14px;
  border:none;
  border-radius:999px;
  color:#603718;
  background:linear-gradient(180deg,#f5d59b,#e6b86f);
  border:1px solid rgba(171,126,84,.18);
  font-size:12px;
  font-weight:950;
  box-shadow:0 5px 12px rgba(121,79,39,.10),inset 0 1px 0 rgba(255,248,230,.96);
}
.player-login-box{
  position:relative;
  z-index:3;
  width:min(540px,100%);
  margin:0 auto;
  padding:9px;
  border-radius:16px;
  background:rgba(255,255,255,.34);
  border:1px solid rgba(255,255,255,.48);
}
.player-login-box.hidden{display:none!important;}
.player-login-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) 72px;
  gap:8px;
  align-items:end;
}
.player-field{display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;}
.player-field span{color:#8b6240;font-size:11px;font-weight:950;}
.player-field input{
  width:100%;height:34px;border:none;outline:none;border-radius:11px;padding:0 10px;
  color:#644021;background:rgba(255,255,255,.76);border:1px solid rgba(177,130,82,.18);
  font-size:13px;font-weight:850;box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}
.player-login-btn{height:34px;border-radius:11px;}
.player-login-message{min-height:16px;margin-top:6px;color:#986744;font-size:11px;line-height:1.35;font-weight:850;text-align:center;}
@media(max-width:540px){
  .player-panel{width:100%;}
  .player-login-row{grid-template-columns:1fr 1fr;}
  .player-login-btn{grid-column:1/-1;width:100%;}
}

/* 中间主体：第一视觉必须是扭蛋机 */
.gacha-stage-wrap{
  position:relative;
  z-index:2;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:24px;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.46);
  overflow:hidden;
}

.gacha-stage{
  position:relative;
  width:min(500px, 78vw, 58dvh);
  height:auto;
  max-width:500px;
  aspect-ratio:1/1;
  flex:0 0 auto;
}

.machine-wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.machine-wrap.shaking{
  animation:machineShake .42s ease-in-out 3;
}

.machine-img{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 14px 18px rgba(143,86,72,.18));
  pointer-events:none;
}

/*
  扭蛋机素材坐标层：
  JS 会把这一层校准到 machine-img 的实际显示区域。
  旋钮、投币口、掉落球都只跟随这张机器图缩放，不跟随外层舞台空白漂移。
*/
.machine-asset-layer{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:6;
  pointer-events:none;
  overflow:visible;
}

.flying-token{
  position:absolute;
  left:var(--coin-slot-x);
  top:var(--coin-slot-y);
  width:7.2%;
  height:auto;
  z-index:30;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%, -50%) scale(.95) rotate(0deg);
  filter:drop-shadow(0 6px 8px rgba(120,74,65,.22));
}

.flying-token.playing{
  animation:tokenInsert .58s cubic-bezier(.18,.86,.22,1) both;
}

.handle-img{
  position:absolute;
  left:var(--handle-x);
  top:var(--handle-y);
  width:var(--handle-size);
  height:auto;
  z-index:8;
  object-fit:contain;
  pointer-events:none;
  transform:translate(-50%, -50%) rotate(0deg);
  transform-origin:50% 50%;
  will-change:transform;
  filter:drop-shadow(0 5px 7px rgba(120,74,65,.18));
}

.handle-img.spinning{
  transform-origin:50% 50%;
}

.ball-drop{
  position:absolute;
  left:var(--ball-x);
  top:var(--ball-y);
  width:var(--ball-size);
  height:auto;
  z-index:12;
  opacity:0;
  transform:translate(-50%, -70%) scale(.2) rotate(-18deg);
  pointer-events:none;
  cursor:pointer;
  filter:drop-shadow(0 7px 8px rgba(120,74,65,.20));
}

.ball-drop.show{
  pointer-events:auto;
  animation:ballDrop .9s cubic-bezier(.18,.9,.22,1.15) forwards;
}

.ball-drop.opening{
  opacity:1;
  pointer-events:none;
  animation:ballLeanRight .36s ease-out forwards;
}

.ball-drop.opened{
  opacity:1;
  pointer-events:none;
  transform:translate(-50%, 12%) scale(1.10) rotate(var(--ball-open-rotate));
  animation:ballOpen .38s ease-out forwards;
}

.status-line{
  position:relative;
  z-index:2;
  flex:0 0 18px;
  height:18px;
  min-height:18px;
  text-align:center;
  color:#8b6240;
  font-size:12px;
  line-height:18px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* 底部道具区 */
.bottom-bar{
  position:relative;
  z-index:2;
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:10px;
  padding:10px;
  border-radius:22px;
  background:rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.58);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72);
}

.pay-btn,
.coin-balance{
  position:relative;
  min-width:0;
  height:82px;
  border:none;
  border-radius:18px;
  padding:8px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  background:rgba(255,252,247,.76);
  color:#785235;
  border:1px solid rgba(171,126,84,.18);
  box-shadow:0 5px 14px rgba(117,80,43,.08), inset 0 1px 0 rgba(255,255,255,.86);
  overflow:hidden;
}

.pay-btn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.94);
}

.pay-btn:disabled{
  cursor:not-allowed;
  opacity:.58;
  transform:none;
}

.pay-icon{
  width:38px !important;
  height:38px !important;
  max-width:38px !important;
  max-height:38px !important;
  object-fit:contain;
  flex:0 0 auto;
}


.img-load-error{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:38px;
  min-height:38px;
  padding:3px 5px;
  border-radius:10px;
  background:rgba(255,236,228,.88);
  border:1px solid rgba(190,92,72,.28);
  color:#9c3e2c;
  font-size:10px;
  line-height:1.15;
  font-weight:950;
  text-align:center;
  white-space:normal;
}

.coin-icon{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  background:linear-gradient(180deg, #ffe59c, #e7a93f);
  color:#8d5a10;
  font-size:17px;
  font-weight:950;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5);
}

.pay-name{
  display:block;
  width:100%;
  color:#7a4a25;
  font-size:12px;
  line-height:1.15;
  font-weight:950;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.pay-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:20px;
  max-width:100%;
  padding:0 7px;
  border-radius:999px;
  background:rgba(255,239,213,.82);
  color:#8a5a2a;
  font-size:12px;
  line-height:1;
  font-weight:950;
  white-space:nowrap;
}

/* 掉球后的两个选择：独立区域，不遮挡机器和底部图标 */
.result-actions{
  position:relative;
  z-index:3;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  width:min(268px, 100%);
  min-height:34px;
  margin:-2px auto 0;
  padding:4px;
  border-radius:18px;
  background:rgba(255,252,244,.50);
  border:1px solid rgba(255,255,255,.56);
  box-shadow:0 6px 14px rgba(110,68,60,.08);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .18s ease, visibility .18s ease;
}

.result-actions.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.action-btn{
  min-height:28px;
  border:none;
  border-radius:999px;
  color:#603718;
  background:linear-gradient(180deg, #f5d59b, #e6b86f);
  font-size:12px;
  font-weight:950;
  box-shadow:0 5px 12px rgba(121,79,39,.10), inset 0 1px 0 rgba(255,248,230,.96);
}

.action-btn.secondary{
  background:linear-gradient(180deg, #f7ede0, #ecd5bb);
}


/* 提示 */
.tip-layer{
  position:fixed;
  z-index:200;
  display:none;
  max-width:260px;
  padding:8px 11px;
  border-radius:12px;
  background:rgba(88,55,49,.94);
  color:#fffaf2;
  font-size:13px;
  line-height:1.45;
  box-shadow:0 8px 18px rgba(70,42,38,.22);
  pointer-events:none;
  white-space:pre-line;
}

/* 小确认弹窗 / 奖励弹窗 */
.sub-layer{
  position:fixed;
  inset:0;
  z-index:180;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(73,45,24,.24);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.sub-layer.show{display:flex;}

.sub-card{
  position:relative;
  width:min(390px, 100%);
  border-radius:26px;
  padding:22px;
  background:
    radial-gradient(circle at 16% 0%, rgba(255,239,194,.55), transparent 34%),
    linear-gradient(180deg, rgba(255,253,248,.98), rgba(255,245,232,.94));
  border:1px solid rgba(255,255,255,.88);
  box-shadow:0 20px 54px rgba(74,48,26,.24), inset 0 1px 0 rgba(255,255,255,.96);
  text-align:center;
  animation:modalCardSoftIn .24s ease-out both;
}

.sub-title{
  margin:0;
  color:#673b1a;
  font-size:24px;
  line-height:1.12;
  font-weight:950;
}

.sub-text{
  margin:10px 0 18px;
  color:#8a6344;
  font-size:15px;
  line-height:1.65;
  font-weight:850;
}

.sub-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.sub-btn{
  height:42px;
  border:none;
  border-radius:999px;
  font-size:15px;
  font-weight:950;
  color:#603718;
  background:linear-gradient(180deg, #f5d59b, #e6b86f);
}

.sub-btn.secondary{
  background:linear-gradient(180deg, #f7ede0, #ecd5bb);
}

.reward-img{
  width:78px;
  height:78px;
  object-fit:contain;
  margin:0 auto 10px;
}

.reward-kicker{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:24px;
  padding:0 10px;
  border-radius:999px;
  background:rgba(232,181,107,.20);
  color:#956434;
  font-size:12px;
  font-weight:950;
  margin-bottom:8px;
}

/* 动画 */
@keyframes tokenInsert{
  0%{opacity:0; transform:translate(-50%, -50%) scale(1.18) rotate(0deg);}
  18%{opacity:1; transform:translate(-50%, -50%) scale(1.02) rotate(0deg);}
  68%{opacity:1; transform:translate(-50%, -50%) scale(.48) rotate(0deg);}
  100%{opacity:0; transform:translate(-50%, -50%) scale(.18) rotate(0deg);}
}

@keyframes machineShake{
  0%,100%{transform:translateX(0) rotate(0);}
  25%{transform:translateX(-1.2%) rotate(-.8deg);}
  50%{transform:translateX(1.1%) rotate(.8deg);}
  75%{transform:translateX(-.7%) rotate(-.45deg);}
}

@keyframes ballDrop{
  0%{opacity:0; transform:translate(-50%, -70%) scale(.2) rotate(-18deg);}
  36%{opacity:1; transform:translate(-50%, -28%) scale(.88) rotate(14deg);}
  70%{opacity:1; transform:translate(-50%, 6%) scale(1.08) rotate(-8deg);}
  100%{opacity:1; transform:translate(-50%, 15%) scale(1) rotate(0deg);}
}

@keyframes ballLeanRight{
  0%{opacity:1; transform:translate(-50%, 15%) scale(1) rotate(0deg);}
  100%{opacity:1; transform:translate(-36%, 28%) scale(1.03) rotate(34deg);}
}

@keyframes ballOpen{
  0%{opacity:1; transform:translate(-36%, 28%) scale(.98) rotate(34deg);}
  100%{opacity:1; transform:translate(-50%, 12%) scale(1.10) rotate(var(--ball-open-rotate));}
}


/* =========================
   全站统一奖励弹窗
========================= */
.reward-mask {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(64, 45, 30, 0.30);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  --reward-scale: var(--reward-modal-scale, 1);
}

.reward-mask.show {
  display: flex!important;
}

.reward-card {
  position: relative;
  width: min(calc(430px * var(--reward-scale)), calc(100vw - 28px));
  max-height: calc(100dvh - 28px);
  padding:
    calc(28px * var(--reward-scale))
    calc(24px * var(--reward-scale))
    calc(22px * var(--reward-scale));
  border-radius: calc(26px * var(--reward-scale));
  overflow: hidden auto;
  text-align: center;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 16%, rgba(255,226,235,.68), transparent 30%),
    radial-gradient(circle at 86% 18%, rgba(255,240,181,.62), transparent 32%),
    linear-gradient(180deg, rgba(255,253,247,.98), rgba(255,244,226,.96));
  border: calc(2px * var(--reward-scale)) solid var(--line);
  box-shadow:
    0 calc(22px * var(--reward-scale)) calc(54px * var(--reward-scale)) var(--card-shadow),
    inset 0 1px 0 rgba(255,255,255,.9);
  animation: rewardPop .42s cubic-bezier(.2, 1.12, .34, 1) both;
}

.reward-card::before,
.reward-card::after {
  position: absolute;
  left: calc(12px * var(--reward-scale));
  right: calc(12px * var(--reward-scale));
  font-size: calc(15px * var(--reward-scale));
  letter-spacing: calc(8px * var(--reward-scale));
  white-space: nowrap;
  overflow: hidden;
  pointer-events: none;
}

.reward-card::before {
  content: "✿  ❀  ✽  ✿  ❀  ✽  ✿";
  top: calc(9px * var(--reward-scale));
  color: rgba(209, 120, 148, 0.52);
}

.reward-card::after {
  content: "✿  ❀  ✽  ✿  ❀  ✽  ✿";
  bottom: calc(8px * var(--reward-scale));
  color: rgba(199, 145, 75, 0.44);
}

@keyframes rewardPop {
  0% {
    opacity: 0;
    transform: translateY(calc(12px * var(--reward-scale))) scale(.9);
  }
  64% {
    opacity: 1;
    transform: translateY(0) scale(1.025);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.reward-close {
  position: absolute;
  z-index: 6;
  top: calc(12px * var(--reward-scale));
  right: calc(12px * var(--reward-scale));
  width: calc(30px * var(--reward-scale));
  height: calc(30px * var(--reward-scale));
  border: none;
  border-radius: 999px;
  background: rgba(255,250,242,.88);
  color: #7b5636;
  font-size: calc(18px * var(--reward-scale));
  font-weight: 900;
  line-height: 1;
  cursor: pointer;
  box-shadow:
    0 calc(2px * var(--reward-scale)) calc(8px * var(--reward-scale)) rgba(105,75,43,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.reward-close:hover {
  filter: brightness(1.02);
}

.reward-petals {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.reward-petals span {
  position: absolute;
  top: calc(-18px * var(--reward-scale));
  color: rgba(220,132,154,.56);
  font-size: calc(16px * var(--reward-scale));
  opacity: 0;
  text-shadow:
    0 calc(2px * var(--reward-scale)) calc(4px * var(--reward-scale)) rgba(255,255,255,.76);
  animation: rewardPetalFall 1.35s ease-in-out both;
}

.reward-petals span:nth-child(1) { left: 12%; animation-delay: .05s; }
.reward-petals span:nth-child(2) { left: 28%; animation-delay: .18s; }
.reward-petals span:nth-child(3) { left: 48%; animation-delay: .02s; }
.reward-petals span:nth-child(4) { left: 66%; animation-delay: .22s; }
.reward-petals span:nth-child(5) { left: 82%; animation-delay: .10s; }

@keyframes rewardPetalFall {
  0% {
    opacity: 0;
    transform: translateY(calc(-14px * var(--reward-scale))) rotate(0deg) scale(.78);
  }
  20% {
    opacity: .85;
  }
  100% {
    opacity: 0;
    transform: translateY(calc(145px * var(--reward-scale))) rotate(160deg) scale(1);
  }
}

.reward-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.reward-icon {
  width: calc(62px * var(--reward-scale));
  height: calc(62px * var(--reward-scale));
  margin:
    calc(4px * var(--reward-scale))
    auto
    calc(12px * var(--reward-scale));
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,246,226,.78);
  border: 1px solid rgba(220,164,102,.25);
  box-shadow:
    0 calc(8px * var(--reward-scale)) calc(20px * var(--reward-scale)) rgba(126,92,51,.10),
    inset 0 1px 0 rgba(255,255,255,.85);
  font-size: calc(34px * var(--reward-scale));
}

.reward-label {
  min-height: calc(25px * var(--reward-scale));
  padding: 0 calc(13px * var(--reward-scale));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: rgba(255,249,232,.66);
  border: 1px solid rgba(218,166,87,.20);
  color: #b26a3a;
  font-size: calc(13px * var(--reward-scale));
  font-weight: 950;
  line-height: 1;
  letter-spacing: .06em;
  animation: rewardStamp .42s ease both;
}

.reward-title {
  position: relative;
  max-width: 100%;
  margin:
    calc(10px * var(--reward-scale))
    auto
    calc(8px * var(--reward-scale));
  padding:
    calc(8px * var(--reward-scale))
    calc(18px * var(--reward-scale));
  border-radius: 999px;
  color: var(--ink);
  font-size: calc(22px * var(--reward-scale));
  font-weight: 950;
  line-height: 1.15;
  background: rgba(255,249,232,.72);
  border: 1px solid rgba(218,166,87,.24);
  box-shadow:
    0 calc(5px * var(--reward-scale)) calc(14px * var(--reward-scale)) rgba(126,92,51,.08),
    inset 0 1px 0 rgba(255,255,255,.82);
  overflow: hidden;
}

.reward-title::after {
  content: "";
  position: absolute;
  inset: -30% auto -30% -42%;
  width: 36%;
  background: linear-gradient(90deg, transparent, rgba(255,234,160,.80), transparent);
  transform: skewX(-18deg);
  animation: rewardSweep 1.25s ease .22s both;
}

@keyframes rewardStamp {
  0% {
    opacity: 0;
    transform: scale(1.12);
  }
  72% {
    opacity: 1;
    transform: scale(.97);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes rewardSweep {
  0% { left: -42%; }
  100% { left: 118%; }
}

.reward-desc {
  width: 100%;
  max-width: calc(330px * var(--reward-scale));
  margin: 0 auto calc(14px * var(--reward-scale));
  color: var(--text);
  font-size: calc(13px * var(--reward-scale));
  line-height: 1.65;
  text-align: center;
  white-space: pre-line;
}

.reward-section-title {
  margin: 0 0 calc(10px * var(--reward-scale));
  color: #8a5c33;
  font-size: calc(12px * var(--reward-scale));
  font-weight: 950;
  line-height: 1;
  letter-spacing: .08em;
}

.reward-list {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  justify-content: center;
  gap: calc(8px * var(--reward-scale));
  margin: 0 0 calc(16px * var(--reward-scale));
}

.reward-list.count-1 {
  grid-template-columns: minmax(0, calc(120px * var(--reward-scale)));
}

.reward-list.count-2 {
  grid-template-columns: repeat(2, minmax(0, calc(120px * var(--reward-scale))));
}

.reward-list.empty {
  display: none;
}

.reward-section-title.empty {
  display: none;
}

.reward-item {
  min-width: 0;
  min-height: calc(84px * var(--reward-scale));
  padding:
    calc(10px * var(--reward-scale))
    calc(7px * var(--reward-scale))
    calc(9px * var(--reward-scale));
  border-radius: calc(16px * var(--reward-scale));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(255,252,247,.72);
  border: 1px solid var(--soft-line);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.82),
    0 calc(3px * var(--reward-scale)) calc(10px * var(--reward-scale)) rgba(116,86,54,.06);
  animation: rewardItemIn .38s ease both;
}

.reward-item:nth-child(1) { animation-delay: .14s; }
.reward-item:nth-child(2) { animation-delay: .24s; }
.reward-item:nth-child(3) { animation-delay: .34s; }
.reward-item:nth-child(4) { animation-delay: .44s; }

@keyframes rewardItemIn {
  0% {
    opacity: 0;
    transform: translateY(calc(8px * var(--reward-scale))) scale(.96);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.reward-item-icon {
  font-size: calc(28px * var(--reward-scale));
  line-height: 1;
  margin-bottom: calc(7px * var(--reward-scale));
  filter: drop-shadow(
    0 calc(2px * var(--reward-scale))
    calc(3px * var(--reward-scale))
    rgba(96,65,35,.12)
  );
}

.reward-item-name {
  width: 100%;
  color: #7b593b;
  font-size: calc(11px * var(--reward-scale));
  font-weight: 900;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reward-item-amount {
  margin-top: calc(3px * var(--reward-scale));
  color: var(--ink);
  font-size: calc(13px * var(--reward-scale));
  font-weight: 950;
  line-height: 1.2;
  white-space: nowrap;
}

.reward-confirm {
  min-width: calc(132px * var(--reward-scale));
  height: calc(36px * var(--reward-scale));
  border: 1px solid rgba(153,104,62,.22);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,238,200,.96), rgba(227,187,132,.90));
  color: #67401f;
  font-size: calc(13px * var(--reward-scale));
  font-weight: 950;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.72),
    0 calc(4px * var(--reward-scale)) calc(12px * var(--reward-scale)) rgba(112,80,42,.10);
}

.reward-confirm:hover {
  filter: brightness(1.02);
}

/* 不同类型轻微换色 */

.reward-mask[data-type="title"] .reward-card {
  background:
    radial-gradient(circle at 12% 16%, rgba(255,235,204,.72), transparent 30%),
    radial-gradient(circle at 86% 18%, rgba(255,229,154,.58), transparent 32%),
    linear-gradient(180deg, rgba(255,253,247,.98), rgba(255,242,219,.96));
}

.reward-mask[data-type="daily"] .reward-card {
  background:
    radial-gradient(circle at 12% 16%, rgba(224,244,216,.70), transparent 30%),
    radial-gradient(circle at 86% 18%, rgba(255,239,181,.50), transparent 32%),
    linear-gradient(180deg, rgba(255,253,247,.98), rgba(241,248,229,.96));
}

.reward-mask[data-type="gift"] .reward-card {
  background:
    radial-gradient(circle at 12% 16%, rgba(255,226,235,.74), transparent 30%),

}

.reward-mask[data-type="item"] .reward-card,

    radial-gradient(circle at 86% 18%, rgba(255,240,181,.52), transparent 32%),
    linear-gradient(180deg, rgba(255,253,247,.98), rgba(235,246,252,.94));
}


@media (max-width: 540px) {
  .reward-mask {
    padding: 14px;
  }
}

@media (max-width: 340px) {
  .reward-list,
  .reward-list.count-1,
  .reward-list.count-2 {
    grid-template-columns: 1fr;
  }
}



/* 扭蛋结果弹窗：只显示本次抽到的物品，避免与奖励列表重复 */
.reward-mask[data-type="gacha-result"] .reward-petals,

function normalizeIconPath(value){

    chip.textContent = `当前玩家：${state.identity.nickname || "成员"}｜${getRoleLabel()}`;
    authBtn.textContent = "登出";
    loginBox.classList.add("hidden");
  }else{
    chip.textContent = "当前玩家：参观者模式";
    authBtn.textContent = "登录";
    loginBox.classList.remove("hidden");
  }
  updateGuestAccess();
}

function updateGuestAccess(){
  const locked = !state.identity.loggedIn || state.busy;
  const paidDrawLocked =
    locked ||
    !state.gachaStateReady ||
    !state.gachaCostsReady ||
    !!state.currentDraw;
  document.querySelectorAll(".pay-btn").forEach(btn=>{
    btn.disabled = paidDrawLocked;
    btn.title = !state.identity.loggedIn
      ? "游客只能观看，登录后才能扭蛋"
      : ((!state.gachaStateReady || !state.gachaCostsReady)
          ? (state.gachaStateError || "扭蛋价格配置尚未加载完成")
          : "");
  });
  const freeBtn = document.getElementById("freeDrawBtn");
  if(freeBtn){
    freeBtn.disabled =
      locked ||
      !state.freeDraw.statusKnown ||
      !state.freeDraw.available ||
      !!state.currentDraw;
    freeBtn.title = state.identity.loggedIn
      ? (state.freeDraw.error || "")
      : "游客只能观看，登录后才能使用每日免费机会";
  }
  if(!state.identity.loggedIn && !state.currentDraw){
    setStatus("游客可以观看，登录后才能使用扭蛋机。");
  }
}

function normalizeLoginResult(data){
  if(Array.isArray(data)) return data[0] || null;
  if(data && Array.isArray(data.data)) return data.data[0] || null;
  return data || null;
}

async function submitLogin(){
  const nicknameInput = document.getElementById("loginNicknameInput");
  const codeInput = document.getElementById("loginCodeInput");
  const message = document.getElementById("loginMessage");
  const submitBtn = document.getElementById("submitLoginBtn");
  const nickname = nicknameInput.value.trim();
  const code = codeInput.value.trim();

  if(!nickname){
    message.textContent = "请填写昵称。";
    nicknameInput.focus();
    return;
  }
  if(!code){
    message.textContent = "请填写钥匙。";
    codeInput.focus();
    return;
  }

  submitBtn.disabled = true;
  message.textContent = "验证中……";

  try{
    const {data,error} = await client.rpc("verify_member_login",{
      input_nickname:nickname,
      input_code:code
    });

    if(error){
      console.error("verify_member_login RPC error:", error);
      message.textContent = "登录失败，请检查昵称和钥匙。";
      return;
    }

    const member = normalizeLoginResult(data);
    if(!member || !member.member_id){
      message.textContent = "昵称或钥匙不正确。";
      return;
    }

    localStorage.setItem("room10LoggedIn","true");
    localStorage.setItem("room10User",member.nickname || nickname);
    localStorage.setItem("room10MemberId",member.member_id);
    localStorage.setItem("room10MemberCode",code);
    localStorage.setItem("room10Role",member.role || "member");

    codeInput.value = "";
    message.textContent = "";
    readIdentity();
    renderIdentity();

    try{
      await loadGachaState();
      setStatus("登录成功，可以使用扭蛋机了。");
    }catch(stateError){
      console.error("登录成功，但扭蛋状态读取失败：", stateError);
      message.textContent = "登录成功，但扭蛋数据读取失败。";
      setStatus(stateError?.message || "登录成功，但扭蛋数据读取失败，请稍后刷新页面。");
    }
  }catch(err){
    console.error(err);
    message.textContent = "登录失败，请稍后再试。";
  }finally{
    submitBtn.disabled = false;
  }
}

function setupIdentityActions(){
  const authBtn = document.getElementById("playerAuthBtn");
  const submitBtn = document.getElementById("submitLoginBtn");
  authBtn?.addEventListener("click",()=>{

function unwrapRpcData(data){
  if(Array.isArray(data)) return data[0] || null;
  if(data && Array.isArray(data.data)) return data.data[0] || null;
  return data || null;
}

function rpcFailed(data){
  return !!(data && (data.ok === false || data.success === false));
}

function rpcMessage(data, fallback){
  return String(data?.message || data?.error || fallback || "操作失败");
}

function numberFrom(source, keys, fallback = 0){
  for(const key of keys){
    const value = source?.[key];
    if(value !== undefined && value !== null && value !== ""){
      const num = Number(value);
      if(Number.isFinite(num)) return num;
    }
  }
  return fallback;
}

function textFrom(source, keys, fallback = ""){
  for(const key of keys){
    const value = source?.[key];
    if(value !== undefined && value !== null && String(value) !== "") return String(value);
  }
  return fallback;
}

function applyGachaState(raw){
  const data = unwrapRpcData(raw) || {};
  const tokens = data.tokens || data.token_counts || {};

  state.inventory.white = numberFrom(tokens,["white","white_count","white_token_count"],
    numberFrom(data,["white","white_count","white_token_count","normal_token_count"],0));
  state.inventory.purple = numberFrom(tokens,["purple","purple_count","purple_token_count"],
    numberFrom(data,["purple","purple_count","purple_token_count","advanced_token_count"],0));
  state.inventory.gold = numberFrom(tokens,["gold","gold_count","gold_token_count"],
    numberFrom(data,["gold","gold_count","gold_token_count","rare_token_count"],0));
  state.inventory.coins = numberFrom(data,["coins","coin_count","gold_balance","member_gold"],0);

  const free = data.free_draw ?? data.freeDraw ?? {};
  const availableValue =
    typeof free.available === "boolean"
      ? free.available
      : (typeof data.free_draw_available === "boolean"
          ? data.free_draw_available
          : null);
  const usedTodayValue =
    typeof free.used_today === "boolean"
      ? free.used_today
      : (typeof data.free_draw_used_today === "boolean"
          ? data.free_draw_used_today
          : null);

  if(usedTodayValue !== null){
    state.freeDraw.usedToday = usedTodayValue;
    state.freeDraw.available = !usedTodayValue;
  }else if(availableValue !== null){
    state.freeDraw.available = availableValue;
    state.freeDraw.usedToday = !availableValue;
  }else{
    throw new Error("数据库没有返回今日免费扭蛋状态。");
  }

  state.freeDraw.date = String(free.date ?? data.free_draw_date ?? "");
  state.freeDraw.statusKnown = true;
  state.freeDraw.loading = false;
  state.freeDraw.error = "";

  const costs = data.costs || data.tier_costs || {};
  const missingCostTiers = [];

  for(const key of Object.keys(TIERS)){
    const config = costs[key] || data[key] || {};
    const tokenCost = numberFrom(config,["token_cost","tokenCost"],Number.NaN);
    const coinCost = numberFrom(config,["coin_cost","coinCost","gold_cost"],Number.NaN);

    if(Number.isFinite(tokenCost) && tokenCost >= 0){
      TIERS[key].tokenCost = tokenCost;
    }else{
      TIERS[key].tokenCost = null;
      missingCostTiers.push(`${TIERS[key].name}游戏币价格`);
    }

    if(Number.isFinite(coinCost) && coinCost >= 0){
      TIERS[key].coinCost = coinCost;
    }else{
      TIERS[key].coinCost = null;
      missingCostTiers.push(`${TIERS[key].name}金币价格`);
    }
  }

  // 余额和每日免费状态读取成功时，不应因为价格配置缺失而显示“免费次数读取失败”。
  state.gachaStateReady = true;
  state.gachaCostsReady = missingCostTiers.length === 0;
  state.gachaStateError = state.gachaCostsReady
    ? ""
    : `数据库未返回完整的扭蛋价格配置：${missingCostTiers.join("、")}。`;
  renderBalances();
  updateGuestAccess();
}

async function loadGachaState(){
  if(!state.identity.loggedIn){
    state.gachaStateReady = false;
    state.gachaCostsReady = false;
    state.gachaStateError = "";
    state.inventory = {white:0,purple:0,gold:0,coins:0};
    state.freeDraw = {
      available:false,
      usedToday:false,
      date:"",
      statusKnown:false,
      loading:false,
      error:""
    };
    renderBalances();
    updateGuestAccess();
    return false;
  }

  state.gachaStateReady = false;
  state.gachaCostsReady = false;
  state.gachaStateError = "";
  state.freeDraw.statusKnown = false;
  state.freeDraw.loading = true;
  state.freeDraw.error = "";
  renderFreeDraw();
  updateGuestAccess();

  try{
    const {memberId, memberCode} = requireCurrentMemberCredentials();

    // 必须调用允许 anon/authenticated 执行的双参数版本：
    // public.get_gacha_state(uuid, text)
    const {data,error} = await client.rpc("get_gacha_state",{
      p_member_id: memberId,
      p_member_code: memberCode
    });
    if(error){
      console.error("get_gacha_state RPC error:", error);
      throw new Error(error.message || "读取今日免费扭蛋状态失败。");
    }

    const result = unwrapRpcData(data);
    if(rpcFailed(result)){
      throw new Error(rpcMessage(result,"读取扭蛋机状态失败。"));
    }

    applyGachaState(result);
    return true;
  }catch(err){
    state.gachaStateReady = false;
    state.gachaCostsReady = false;
    state.gachaStateError = err?.message || "读取扭蛋机状态失败。";
    state.freeDraw.available = false;
    state.freeDraw.usedToday = false;
    state.freeDraw.statusKnown = false;
    state.freeDraw.loading = false;
    state.freeDraw.error = err?.message || "读取今日免费次数失败。";
    renderFreeDraw();
    updateGuestAccess();
    throw err;
  }
}

function normalizeBall(source = {}){
  const ballSource = source.ball || source.gacha_ball || source;
  const closedImg = normalizeIconPath(textFrom(ballSource,["closed_img","closed_image","ball_closed_img","ball_image"],""));
  const openImg = normalizeIconPath(textFrom(ballSource,["open_img","open_image","ball_open_img"],""));
  if(!closedImg || !openImg) throw new Error("数据库没有返回完整的扭蛋图片。");
  return {
    key:textFrom(ballSource,["key","ball_key","color_key"],""),
    name:textFrom(ballSource,["name","ball_name","display_name"],"扭蛋"),
    closedImg,
    openImg
  };
}

function normalizeDrawResult(raw,tierKey,payType){
  const data = unwrapRpcData(raw) || {};
  if(rpcFailed(data)) throw new Error(rpcMessage(data,"扭蛋失败。"));
  return {
    id:textFrom(data,["draw_id","id","gacha_draw_id"],""),
    tierKey,
    payType,
    isEmpty: !!(data.is_empty || data.reward_type === "empty"),
    message: textFrom(data,["message","reward_desc","description"],""),
    freeEmptyCount: numberFrom(data,["free_empty_count"],0),
    achievementUnlocked: !!data.achievement_unlocked,
    achievementName: textFrom(data,["achievement_name"],""),
    ball:normalizeBall(data),
    raw:data
  };
}

function normalizeResultItem(raw, fallbackImage = ""){
  const data = unwrapRpcData(raw) || {};
  if(rpcFailed(data)) throw new Error(rpcMessage(data,"操作失败。"));
  const item = data.item || data.reward || data.result || data;
  const quantity = numberFrom(item,["quantity","amount","reward_quantity"],1);
  return {
    name:textFrom(item,["display_name","name","item_name","reward_name"],"本次获得"),
    quantity,
    image:normalizeIconPath(textFrom(item,["image","image_path","icon","item_img","reward_img"],fallbackImage)),
    description:textFrom(item,["description","message","text"],textFrom(data,["message"],"已放入背包。"))
  };
}

async function requestDraw(tierKey,payType){

  // 调用允许前端执行的四参数版本：

    p_member_id:memberId,

    p_tier_key:tierKey,

    console.error("draw_gacha_once RPC error:", error);

  return normalizeDrawResult(data,tierKey,payType);
}

  if(state.freeDraw.loading){

/*
  扭蛋数据库接口：
  1. get_gacha_state：读取游戏币、金币、价格配置和每日免费状态。
  2. draw_gacha_once：校验身份并完成一次抽取。
  3. open_gacha_ball：打开扭蛋并发放奖励。
  4. store_gacha_ball：将关闭的扭蛋放入背包并处理图鉴。
*/

async function handleFreeDraw(){
  if(state.busy || state.currentDraw) return;
  if(!state.identity.loggedIn){
    setStatus("登录后才可以使用每日免费扭蛋机会。");
    return;
  }
  if(!state.freeDraw.statusKnown){
    setStatus(state.freeDraw.error || "正在读取今日免费扭蛋状态，请稍后再试。");
    return;
  }
  if(state.freeDraw.usedToday === true || !state.freeDraw.available){
    setStatus("今天的免费普通扭蛋机会已经使用过了。");
    return;
  }
  await startDraw("white", "free");
}

async function handleTierClick(tierKey){
  if(state.busy || state.currentDraw) return;

  if(!state.identity.loggedIn){
    setStatus("登录后才可以使用扭蛋机哦。");
    return;
  }

  if(!state.gachaStateReady){
    setStatus(state.gachaStateError || "扭蛋数据尚未加载完成，请稍后再试。");
    return;
  }

  if(!state.gachaCostsReady){
    setStatus(state.gachaStateError || "扭蛋价格配置尚未加载完成，请稍后再试。");
    return;
  }

  const tier = TIERS[tierKey];
  const tokenCount = state.inventory[tier.countKey];

  if(tokenCount >= tier.tokenCost){
    await startDraw(tierKey, "token");
    return;
  }

  if(state.inventory.coins < tier.coinCost){
    setStatus(`${tier.tokenName}和金币都不足，无法扭蛋。`);
    return;
  }

  const ok = await showConfirm(`${tier.tokenName}不足，是否确认使用 ${tier.coinCost} 金币抵扣？`);
  if(!ok){
    setStatus("已取消，没有消耗任何道具。");
    return;
  }

  await startDraw(tierKey, "gold");
}

async function startDraw(tierKey, payType){
  try{
    const tier = TIERS[tierKey];
    setBusy(true);
    hideResultActions();
    resetBallView();
    clearTimers();

    if(payType === "free"){
      setStatus("正在使用今日免费普通扭蛋机会……");
    }else if(payType === "token"){
      setStatus(`正在投入 ${tier.tokenCost} 个${tier.tokenName}……`);
    }else{
      setStatus(`正在使用 ${tier.coinCost} 金币抵扣……`);
    }

    const draw = await requestDraw(tierKey,payType);
    if(!draw.id) throw new Error("数据库没有返回 draw_id。");
    state.currentDraw = draw;

    const stateRefreshed = await refreshGachaStateAfterWrite("抽取");
    await playTokenInsertAnimation(tierKey,payType);
    await playAnimation(draw);

    if(draw.isEmpty){
      setStatus(draw.message || "扭蛋是空的，这次没有获得物品。");
      leanClosedBall();
      window.setTimeout(() => showOpenedBall(draw), 380);
      window.setTimeout(() => {
        showReward({
          title:"空",
          text:draw.message || "扭蛋是空的，这次没有获得物品。",
          icon:draw.ball.openImg || draw.ball.closedImg,
          label:draw.achievementUnlocked ? "非酋成就" : "扭蛋结果"
        });
        if(draw.achievementUnlocked && draw.achievementName){
          window.setTimeout(() => {
            showReward({
              title:draw.achievementName,
              text:`累计免费抽到空 ${draw.freeEmptyCount} 次，解锁成就「${draw.achievementName}」。`,
              icon:"🏆",
              label:"成就达成"
            });
          }, 420);
        }
        state.currentDraw = null;
        resetBallView();
        setStatus(stateRefreshed
          ? "请选择下一次扭蛋。"
          : "本次扭蛋已完成，但余额刷新失败，请刷新页面后继续。");
        updateGuestAccess();
      }, 1150);
      return;
    }

    setStatus(stateRefreshed
      ? "掉出了一枚扭蛋。你要怎么处理？"
      : "扭蛋已成功掉出；余额刷新失败，处理完后请刷新页面。");
    showResultActions();
  }catch(err){
    console.error(err);
    state.currentDraw = null;
    resetBallView();
    hideResultActions();
    setStatus(err?.message || "扭蛋失败，请稍后再试。");
    try{ await loadGachaState(); }catch(_error){}
  }finally{
    setBusy(false);
    updateGuestAccess();
  }
}

function getMachineAssetRatio(){
  const machineImg = document.getElementById("machineImg");

  /*
    固定使用第一张机器图的素材比例。
    这样 gacha-machine2 / gacha-machine3 切帧时，即使图片透明边界或原始尺寸不同，
    旋钮、投币口和掉落球也不会跟着跳位。
  */
  if(state.machineAssetRatio){
    return state.machineAssetRatio;
  }

  if(machineImg && machineImg.naturalWidth > 0 && machineImg.naturalHeight > 0){
    state.machineAssetRatio = machineImg.naturalWidth / machineImg.naturalHeight;
    return state.machineAssetRatio;
  }

  return 1;
}

function updateMachineAssetLayer(){
  const stage = document.querySelector(".gacha-stage");
  const machineImg = document.getElementById("machineImg");
  const layer = document.getElementById("machineAssetLayer");
  if(!stage || !machineImg || !layer) return;

  const rect = stage.getBoundingClientRect();
  if(!rect.width || !rect.height) return;

  const imageRatio = getMachineAssetRatio();
  const stageRatio = rect.width / rect.height;

  let width;
  let height;
  let left;
  let top;

  if(stageRatio > imageRatio){
    height = rect.height;
    width = height * imageRatio;
    left = (rect.width - width) / 2;
    top = 0;
  }else{
    width = rect.width;
    height = width / imageRatio;
    left = 0;
    top = (rect.height - height) / 2;
  }

  const leftPx = `${left}px`;
  const topPx = `${top}px`;
  const widthPx = `${width}px`;
  const heightPx = `${height}px`;

  /* 机器图和素材层使用同一个盒子，避免大小屏切换时旋钮漂移 */
  machineImg.style.left = leftPx;
  machineImg.style.top = topPx;
  machineImg.style.width = widthPx;
  machineImg.style.height = heightPx;

  layer.style.left = leftPx;
  layer.style.top = topPx;
  layer.style.width = widthPx;
  layer.style.height = heightPx;
}

function setupMachineAssetLayer(){
  const stage = document.querySelector(".gacha-stage");
  const machineImg = document.getElementById("machineImg");

  if(machineImg){
    machineImg.addEventListener("load", () => {
      if(!state.machineAssetRatio && machineImg.naturalWidth > 0 && machineImg.naturalHeight > 0){
        state.machineAssetRatio = machineImg.naturalWidth / machineImg.naturalHeight;
      }
      updateMachineAssetLayer();
    });
  }

  window.addEventListener("resize", updateMachineAssetLayer);

  if(window.ResizeObserver && stage && !state.machineAssetResizeObserver){
    state.machineAssetResizeObserver = new ResizeObserver(() => updateMachineAssetLayer());
    state.machineAssetResizeObserver.observe(stage);
  }

  requestAnimationFrame(updateMachineAssetLayer);
  window.setTimeout(updateMachineAssetLayer, 80);
}

function animateHandleTurn(){
  const handleImg = document.getElementById("handleImg");
  if(!handleImg) return Promise.resolve();

  const pauseAngle = getRandomHandlePauseAngle();
  const firstDuration = 400;
  const pauseDuration = 150;
  const secondDuration = 470;
  const totalDuration = firstDuration + pauseDuration + secondDuration;

  if(state.handleRaf){
    cancelAnimationFrame(state.handleRaf);
    state.handleRaf = null;
  }

  handleImg.src = ASSETS.handleIdle;
  handleImg.classList.remove("spinning");
  handleImg.style.transition = "none";
  handleImg.style.transform = handleTurnTransform(0);
  void handleImg.offsetWidth;
  handleImg.classList.add("spinning");

  function easeOutCubic(t){
    return 1 - Math.pow(1 - t, 3);
  }

  function easeInOutCubic(t){
    return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  return new Promise(resolve => {
    const startedAt = performance.now();

    function frame(now){
      const elapsed = Math.min(now - startedAt, totalDuration);
      let angle;

      if(elapsed <= firstDuration){
        const t = elapsed / firstDuration;
        angle = pauseAngle * easeOutCubic(t);
      }else if(elapsed <= firstDuration + pauseDuration){
        angle = pauseAngle;
      }else{
        const t = (elapsed - firstDuration - pauseDuration) / secondDuration;
        angle = pauseAngle + (360 - pauseAngle) * easeInOutCubic(t);
      }

      /* 手动逐帧设置角度，确保总角度只有 0 → 360，不会叠加成两圈 */
      handleImg.style.transform = handleTurnTransform(angle);

      if(elapsed < totalDuration){
        state.handleRaf = requestAnimationFrame(frame);
      }else{
        state.handleRaf = null;
        handleImg.style.transition = "none";
        handleImg.style.transform = handleTurnTransform(0);
        handleImg.classList.remove("spinning");
        resolve();
      }
    }

    state.handleRaf = requestAnimationFrame(frame);
  });
}

function getRootPercent(name, fallback){
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const num = Number(raw.replace("%", ""));
  return Number.isFinite(num) ? num : fallback;
}

function playTokenInsertAnimation(tierKey, payType){
  const token = document.getElementById("flyingToken");
  if(!token) return Promise.resolve();

  const srcMap = {
    white:ASSETS.tokenWhite2,
    purple:ASSETS.tokenPurple2,
    gold:ASSETS.tokenGold2
  };

  token.src = srcMap[tierKey] || ASSETS.tokenWhite2;
  token.dataset.imgPath = token.src;
  token.classList.remove("playing");
  token.style.position = "absolute";
  token.style.left = "var(--coin-slot-x)";
  token.style.top = "var(--coin-slot-y)";
  token.style.width = "7.2%";
  token.style.opacity = "0";
  token.style.zIndex = "30";
  token.style.transform = "translate(-50%, -50%) scale(.95) rotate(0deg)";
  token.style.pointerEvents = "none";

  if(payType === "free") setStatus("免费机会启动中……");
  else setStatus(payType === "gold" ? "金币投入中……" : "游戏币投入中……");

  void token.offsetWidth;
  token.classList.add("playing");

  return new Promise(resolve => {
    window.setTimeout(() => {
      token.classList.remove("playing");
      token.style.opacity = "0";
      token.style.transform = "translate(-50%, -50%) scale(.95) rotate(0deg)";
      resolve();
    }, 620);
  });
}

function playAnimation(drawResult){
  return new Promise(resolve => {
    const machineWrap = document.getElementById("machineWrap");
    const machineImg = document.getElementById("machineImg");
    const handleImg = document.getElementById("handleImg");
    const machineFrames = ASSETS.machineFrames.filter(Boolean);
    let machineFrameIndex = 0;

    const showMachineFrame = index => {
      if(!machineImg || !machineFrames.length) return;
      const src = machineFrames[index] || machineFrames[0];
      machineImg.src = src;
      machineImg.dataset.imgPath = src;
    };

    showMachineFrame(0);
    handleImg.src = ASSETS.handleIdle;

    setStatus("旋钮正在转动中……");
    animateHandleTurn().then(() => {
      setStatus("扭蛋机正在转动中……");
      machineWrap.classList.add("shaking");

      /*
       * 在 gacha-machine / gacha-machine2 / gacha-machine3 之间循环切帧，
       * 配合轻微震动，让机器内部的扭蛋看起来正在滚动。
       */
      if(machineFrames.length > 1){
        const machineFrameTimer = window.setInterval(() => {
          machineFrameIndex = (machineFrameIndex + 1) % machineFrames.length;
          showMachineFrame(machineFrameIndex);
        }, 120);
        state.timers.push(machineFrameTimer);
      }
    });

    window.setTimeout(() => {
      clearTimers();

      machineWrap.classList.remove("shaking");
      showMachineFrame(0);
      handleImg.src = ASSETS.handleIdle;
      handleImg.style.transform = handleTurnTransform(0);

      showClosedBall(drawResult);
      resolve();
    }, 1850);
  });
}

function showClosedBall(drawResult){
  const ball = document.getElementById("ballDrop");
  ball.src = drawResult.ball.closedImg;
  ball.alt = drawResult.ball.name;
  ball.classList.remove("show", "opening", "opened");
  void ball.offsetWidth;
  ball.classList.add("show");
}

function leanClosedBall(){
  const ball = document.getElementById("ballDrop");
  ball.classList.remove("show", "opened");
  ball.style.opacity = "1";
  ball.style.pointerEvents = "none";
  void ball.offsetWidth;
  ball.classList.add("opening");
}

function showOpenedBall(drawResult){
  const ball = document.getElementById("ballDrop");
  ball.src = drawResult.ball.openImg;
  ball.alt = `${drawResult.ball.name}已打开`;
  ball.style.opacity = "1";
  ball.style.pointerEvents = "none";
  ball.classList.remove("show", "opening");
  void ball.offsetWidth;
  ball.classList.add("opened");
}

async function openCurrentBall(){
  if(!state.currentDraw || state.busy) return;

  const draw = state.currentDraw;
  try{
    setBusy(true);
    hideResultActions();
    leanClosedBall();

    const resultPromise = requestOpenBall(draw);

    window.setTimeout(() => {
      if(state.currentDraw === draw) showOpenedBall(draw);
    }, 380);

    const result = await resultPromise;
    const stateRefreshed = await refreshGachaStateAfterWrite("打开扭蛋");

    window.setTimeout(() => {
      showReward({
        title:`${result.name} × ${result.quantity || 1}`,
        text:result.description,
        icon:result.image
      });
      state.currentDraw = null;
      resetBallView();
      setStatus(stateRefreshed
        ? "请选择下一次扭蛋。"
        : "奖励已发放，但余额刷新失败，请刷新页面后继续。");
      updateGuestAccess();
    }, 1150);
  }catch(err){
    console.error(err);
    showResultActions();
    setStatus(err?.message || "打开失败，请稍后再试。");
  }finally{
    window.setTimeout(() => setBusy(false), 1180);
  }
}

async function storeCurrentBall(){
  if(!state.currentDraw || state.busy) return;

  const draw = state.currentDraw;
  try{
    setBusy(true);
    hideResultActions();
    const result = await requestStoreBall(draw);
    const stateRefreshed = await refreshGachaStateAfterWrite("放入背包");

    showReward({
      title:`${result.name} × ${result.quantity || 1}`,
      text:result.description,
      icon:result.image
    });

    state.currentDraw = null;
    resetBallView();
    setStatus(stateRefreshed
      ? "请选择下一次扭蛋。"
      : "已放入背包，但余额刷新失败，请刷新页面后继续。");
    updateGuestAccess();
  }catch(err){
    console.error(err);
    showResultActions();
    setStatus(err?.message || "放入背包失败，请稍后再试。");
  }finally{
    setBusy(false);
  }
}

function showConfirm(text){
  document.getElementById("confirmText").textContent = text;
  document.getElementById("confirmLayer").classList.add("show");

  return new Promise(resolve => {
    state.confirmResolver = resolve;
  });
}

function closeConfirm(result){
  document.getElementById("confirmLayer").classList.remove("show");
  if(state.confirmResolver){
    state.confirmResolver(result);
    state.confirmResolver = null;
  }
}

function showReward(info){
  const title = info.title || "本次获得";
  const icon = info.icon || "";
  showRewardModal({
    type:"gacha-result",
    label:info.label || "扭蛋结果",
    title,
    desc:info.text || "已放入背包。",
    image: icon && /\.(png|jpg|jpeg|webp|gif|svg)(\?|#|$)/i.test(icon) ? icon : "",
    icon: icon && !/\.(png|jpg|jpeg|webp|gif|svg)(\?|#|$)/i.test(icon) ? icon : "✨",
    rewards:[]
  });
}
function closeReward(){closeRewardModal();}

function setupTooltips(){
  const tip = document.getElementById("tipLayer");

  document.querySelectorAll(".pay-btn").forEach(btn => {
    const tier = TIERS[btn.dataset.tier];

    btn.addEventListener("mouseenter", () => {
      if(!state.gachaStateReady || !state.gachaCostsReady || !Number.isFinite(tier.tokenCost) || !Number.isFinite(tier.coinCost)){
        tip.textContent = state.gachaStateError || "扭蛋价格正在从数据库读取。";
      }else{
        tip.textContent = `消耗 ${tier.tokenCost} 个${tier.tokenName}扭一次；\n不足时可确认使用 ${tier.coinCost} 金币抵扣。`;
      }
      tip.style.display = "block";
    });

    btn.addEventListener("mousemove", event => {
      tip.style.left = `${event.clientX + 14}px`;
      tip.style.top = `${event.clientY + 14}px`;
    });

    btn.addEventListener("mouseleave", () => {
      tip.style.display = "none";
    });
  });

  const freeBtn = document.getElementById("freeDrawBtn");
  freeBtn?.addEventListener("mouseenter", () => {
    tip.textContent = "每日 1 次免费普通扭蛋；\n只有免费抽可能低概率抽到空。";
    tip.style.display = "block";
  });
  freeBtn?.addEventListener("mousemove", event => {
    tip.style.left = `${event.clientX + 14}px`;
    tip.style.top = `${event.clientY + 14}px`;
  });
  freeBtn?.addEventListener("mouseleave", () => {
    tip.style.display = "none";
  });
}


async function init(){
  state.source = getPageSource();
  configureBackButton();
  readIdentity();
  renderIdentity();
  setupIdentityActions();

  document.getElementById("freeDrawBtn")?.addEventListener("click", handleFreeDraw);

  renderBalances();
  let initialStateError = null;
  if(state.identity.loggedIn){
    try{
      await loadGachaState();
    }catch(err){
      console.error(err);
      initialStateError = err;
    }
  }

  setupTooltips();
  setupMachineAssetLayer();
  resetBallView();
  hideResultActions();

  document.getElementById("machineImg").src = ASSETS.machineFrames[0];
  document.getElementById("machineImg").dataset.imgPath = ASSETS.machineFrames[0];
  document.getElementById("handleImg").src = ASSETS.handleIdle;
  document.getElementById("handleImg").dataset.imgPath = ASSETS.handleIdle;
  updateMachineAssetLayer();

  if(state.identity.loggedIn){
    setStatus(initialStateError
      ? (initialStateError.message || "读取扭蛋机数据失败，请刷新页面重试。")
      : (state.gachaCostsReady
          ? "准备好了。"
          : (state.gachaStateError || "每日免费状态已读取，但扭蛋价格配置尚未加载。")));
  }else{
    setStatus("游客可以观看，登录后才能使用扭蛋机。");
  }
  updateGuestAccess();
}

document.addEventListener("DOMContentLoaded", ()=>{applyConfiguredAssetPaths();setupImageErrorReports();init();});
document.getElementById("rewardMask")?.addEventListener("click",function(event){if(event.target===this)closeRewardModal();});
document.addEventListener("keydown",function(event){if(event.key==="Escape")closeRewardModal();});

</script>
