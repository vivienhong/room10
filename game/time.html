      starterState = "idle";
      reactionReadyAt = 0;
      athleteRunStartedAt = 0;
      hideSignalPanel();
      els.stopBtn.textContent = "停止";
    }

    function cleanupStarterTimers() {
      if (reactionTimerId) {
        window.clearTimeout(reactionTimerId);
        reactionTimerId = null;
      }
    }

    function makeRandomWaitMs() {
      return Math.round(CONFIG.reactionWaitMin + Math.random() * (CONFIG.reactionWaitMax - CONFIG.reactionWaitMin));
    }

    function playStarterBeep() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.18);
      } catch (err) {
        console.warn("提示音播放失败：", err);
      }
    }

    function getReactionGrade(reactionSeconds) {
      if (reactionSeconds <= 0.200) return "枪响即动";
      if (reactionSeconds <= 0.250) return "起跑很快";
      if (reactionSeconds <= 0.350) return "反应不错";
      if (reactionSeconds <= 0.500) return "慢了半拍";
      return "还在热身";
    }

    function showSpecialResult(values, labels = ["目标", "你的时间", "误差", "当前排名"]) {
      els.resultNames.forEach((node, index) => {
        node.textContent = labels[index] || node.textContent;
      });
      els.resultBox.classList.add("show");
      els.resultGrade.textContent = values.grade || "--";
      els.resultTarget.textContent = values.target || "--";
      els.resultActual.textContent = values.actual || "--";
      els.resultError.textContent = values.error || "--";
      els.resultRank.textContent = values.rank || "--";
    }

    function getCurrentTargetSeconds() {
      if (currentMode === "daily") return Number(currentIssue?.targetSeconds || 0);
      if (currentMode === "athlete") return athleteTargetSeconds;
      if (currentMode === "reaction") return 0;
      return freeTargetSeconds;
    }

    function renderTarget() {
      const target = getCurrentTargetSeconds();
      if (currentMode === "reaction") {
        els.targetNumber.textContent = "听令";
      } else {
        els.targetNumber.textContent = target ? `${target.toFixed(3)}s` : "--";
      }

      if (currentMode === "daily") {
        els.targetLabel.textContent = "当前挑战目标";
        els.issueText.textContent = currentIssue
          ? `第 ${currentIssue.issueNo} 期 · 00:00 结算上一期冠军`
          : "正在读取当前挑战……";
        els.startBtn.textContent = "开始挑战";
      } else if (currentMode === "free") {
        els.targetLabel.textContent = "自由模式随机目标";
        els.issueText.textContent = "本局结束后会刷新新的随机秒数";
        els.startBtn.textContent = "开始自由模式";
      } else if (currentMode === "reaction") {
        els.targetLabel.textContent = "当前模式";
        els.issueText.textContent = "红灯等待，绿灯与提示音同步出现后立刻点击。";
        els.startBtn.textContent = "准备发令";
      } else {
        els.targetLabel.textContent = "运动员模式目标";
        els.issueText.textContent = "随机目标大于 10 秒。等绿灯与提示音出现后起跑，再数秒到终点。";
        els.startBtn.textContent = "准备起跑";
      }

      if (!running && (currentMode === "reaction" || currentMode === "athlete")) {
        renderSignalPanel(currentMode, currentMode === "athlete" ? 3 : 1, "red");
        els.timerHint.textContent = "点击下方按钮开始准备。";
      }
    }

    function showResult(record) {
      ["目标", "你的时间", "误差", "当前排名"].forEach((label, index) => {
        if (els.resultNames[index]) els.resultNames[index].textContent = label;
      });
      els.resultBox.classList.add("show");
      els.resultGrade.textContent = record.grade || getGrade(record.errorSeconds);
      els.resultTarget.textContent = formatSeconds(record.targetSeconds);
      els.resultActual.textContent = formatSeconds(record.actualSeconds);
      els.resultError.textContent = formatSeconds(record.errorSeconds);

      if (record.savedToBoard) {
        els.resultRank.textContent = record.enteredVisibleBoard && record.boardRank
          ? `第 ${record.boardRank} 名`
          : "未进榜";
        return;
      }

      els.resultRank.textContent = record.fallbackRank
        ? `临时第 ${record.fallbackRank} 名`
        : "未进榜";
    }

    function clearResult() {
      ["目标", "你的时间", "误差", "当前排名"].forEach((label, index) => {
        if (els.resultNames[index]) els.resultNames[index].textContent = label;
      });
      if (!running && (currentMode === "reaction" || currentMode === "athlete")) {
        renderSignalPanel(currentMode, currentMode === "athlete" ? 3 : 1, "red");
      } else if (!running) {
        hideSignalPanel();
      }
      els.resultBox.classList.remove("show");
      els.resultGrade.textContent = "--";
      els.resultTarget.textContent = "--";
      els.resultActual.textContent = "--";
      els.resultError.textContent = "--";
      els.resultRank.textContent = "--";
      els.timerDisplay.textContent = currentMode === "reaction" || currentMode === "athlete" ? "" : "00:00.000";
      els.timerDisplay.classList.remove("hidden-time");
      els.timerHint.textContent = currentMode === "reaction" || currentMode === "athlete"
        ? "点击下方按钮开始准备。"
        : "开始后前 1.5 秒显示毫秒计时，之后时间会消失。";
    }

    async function renderLeaderboard() {
      const isDaily = currentRank === "daily";
      const rankNotes = {
        daily: "前 5｜按绝对误差",
        free: "前 10｜按误差率",
        reaction: "前 10｜按反应时间",
        athlete: "前 10｜综合表现"
      };
      els.rankNote.textContent = rankNotes[currentRank] || "前 10";

      renderFeaturedRecord();

      if (isDaily && !currentIssue) {
        els.leaderboard.innerHTML = `<div class="empty">正在读取当前挑战……</div>`;
        return [];
      }

      els.leaderboard.innerHTML = `<div class="empty">正在读取排行榜……</div>`;

      try {
        const rows = await fetchLeaderboardRows(currentRank);
        updateModeFeaturedSummaryFromRows(currentRank, rows);
        renderFeaturedRecord();
        const highlightRecord = lastSubmittedRecord?.mode === currentRank ? lastSubmittedRecord : null;
        renderLeaderboardRows(rows, currentRank, highlightRecord);
        return rows;
      } catch (err) {
        console.error("读取排行榜失败：", err);
        els.leaderboard.innerHTML = `<div class="empty">排行榜读取失败<br>请稍后再试。</div>`;
        return [];
      }
    }

    async function fetchLeaderboardRows(mode) {
      const isDaily = mode === "daily";
      if (isDaily && !currentIssue) return [];

      const rpcName = (mode === "reaction" || mode === "athlete")
        ? "get_time_answer_mode_leaderboard"
        : "get_time_answer_leaderboard";

      const { data, error } = await client.rpc(rpcName, {
        p_mode: mode,
        p_issue_no: isDaily ? currentIssue.issueNo : null,
        p_limit: isDaily ? 5 : 10
      });

      if (error) throw error;
      return Array.isArray(data) ? data : [];
    }

    function renderLeaderboardRows(rows, rankMode, highlightRecord = null) {
      const mode = typeof rankMode === "string" ? rankMode : (rankMode ? "daily" : "free");
      if (!rows.length) {
        els.leaderboard.innerHTML = `<div class="empty">暂无成绩<br>完成一次挑战后会出现在这里。</div>`;
        return;
      }

      els.leaderboard.innerHTML = rows.map(item => {
        let scoreText = "";
        let metaText = "";

        if (mode === "daily") {
          scoreText = `误差 ${formatSeconds(item.error_seconds)}`;
          metaText = `目标 ${formatSeconds(item.target_seconds)} · 实际 ${formatSeconds(item.actual_seconds)}`;
        } else if (mode === "free") {
          scoreText = `误差率 ${formatPercent(item.error_rate)}`;
          metaText = `目标 ${formatSeconds(item.target_seconds)} · 误差 ${formatSeconds(item.error_seconds)}`;
        } else if (mode === "reaction") {
          scoreText = `反应 ${formatSeconds(item.reaction_seconds)}`;
          metaText = item.result_grade || "发令枪成绩";
        } else {
          scoreText = `误差 ${formatSeconds(item.error_seconds)}`;
          metaText = `目标 ${formatSeconds(item.target_seconds)} · 实际 ${formatSeconds(item.actual_seconds)} · 反应 ${formatSeconds(item.reaction_seconds)}`;
        }

        const isCurrent = highlightRecord && isSameSubmittedRecord(highlightRecord, item);
        const currentTag = isCurrent ? `<span class="rank-current-tag">本次</span>` : "";

        return `
          <div class="rank-row${isCurrent ? " current-result" : ""}">
            <div class="rank-no">${item.rank_no}</div>
            <div>
              <div class="rank-name">${escapeHtml(item.nickname)}${currentTag}</div>
              <div class="rank-meta">${metaText}</div>
            </div>
            <div class="rank-score">${scoreText}</div>
          </div>
        `;
      }).join("");
    }

    function applyVisibleBoardRank(record, rows) {
      const matched = rows.find(row => isSameSubmittedRecord(record, row));
      record.enteredVisibleBoard = !!matched;
      record.boardRank = matched ? Number(matched.rank_no) : null;
    }

    function applyGuestVirtualRank(record, rows) {
      const maxRank = record.mode === "daily" ? 5 : 10;

      if (record.mode === "athlete") {
        record.enteredVisibleBoard = !!record.fallbackRank && Number(record.fallbackRank) <= maxRank;
        return;
      }

      let metricKey = "error_rate";
      let recordMetric = record.errorRate;
      let lowerIsBetter = true;

      if (record.mode === "daily") {
        metricKey = "error_seconds";
        recordMetric = record.errorSeconds;
      } else if (record.mode === "reaction") {
        metricKey = "reaction_seconds";
        recordMetric = record.reactionSeconds;
      }

      const safeMetric = Number(recordMetric);
      if (!Number.isFinite(safeMetric)) {
        record.fallbackRank = null;
        record.enteredVisibleBoard = false;
        return;
      }

      const betterCount = rows.filter(row => {
        const rowMetric = Number(row?.[metricKey]);
        if (!Number.isFinite(rowMetric)) return false;
        return lowerIsBetter ? rowMetric < safeMetric : rowMetric > safeMetric;
      }).length;

      const virtualRank = betterCount + 1;
      const lastVisibleMetric = rows.length ? Number(rows[rows.length - 1]?.[metricKey]) : Infinity;
      const hasRoom = rows.length < maxRank;
      const reachesVisibleBoard = virtualRank <= maxRank && (hasRoom || safeMetric <= lastVisibleMetric || !Number.isFinite(lastVisibleMetric));

      record.fallbackRank = reachesVisibleBoard ? virtualRank : null;
      record.enteredVisibleBoard = reachesVisibleBoard;
    }

    function isSameSubmittedRecord(record, row) {
      if (!row) return false;
      const sameName = String(row.nickname || "").trim() === String(record.playerName || "").trim();

      if (record.mode === "reaction") {
        return sameName && numbersClose(row.reaction_seconds, record.reactionSeconds);
      }

      const sameTarget = numbersClose(row.target_seconds, record.targetSeconds);
      const sameActual = numbersClose(row.actual_seconds, record.actualSeconds);
      const sameError = numbersClose(row.error_seconds, record.errorSeconds);
      const sameReaction = record.mode === "athlete"
        ? numbersClose(row.reaction_seconds, record.reactionSeconds)
        : true;
      const sameRate = record.mode === "free"
        ? numbersClose(row.error_rate, record.errorRate, 0.00001)
        : true;
      return sameName && sameTarget && sameActual && sameError && sameReaction && sameRate;
    }

    function numbersClose(a, b, tolerance = 0.0005) {
      const left = Number(a);
      const right = Number(b);
      return Number.isFinite(left) && Number.isFinite(right) && Math.abs(left - right) <= tolerance;
    }

    function getResultHint(record) {
      if (record.isFalseStart) {
        return "抢跑成绩无效，不进入排行榜。";
      }

      if (!record.savedToBoard) {
        return record.fallbackRank
          ? "答案出现了。游客不进入正式榜单，但本次成绩可参考临时排名。"
          : "答案出现了。游客不进入正式榜单，本次成绩暂未达到当前榜单范围。";
      }

      return record.enteredVisibleBoard
        ? "答案出现了。你的成员成绩已进入当前榜单。"
        : "答案出现了。你的成员成绩已记录，但暂未进入当前榜单。";
    }

    async function openHistoryBoard() {
      els.historyBoardMask.classList.add("show");
      els.historyBoardMask.setAttribute("aria-hidden", "false");
      els.historyBoardList.innerHTML = `<div class="empty">正在读取风云榜……</div>`;

      try {
        const { data, error } = await client.rpc("get_time_answer_history_board", {
          p_limit: 50
        });

        if (error) throw error;

        const rows = Array.isArray(data) ? data : [];
        if (!rows.length) {
          els.historyBoardList.innerHTML = `<div class="empty">暂无成员历史成绩。<br>成员完成挑战后会出现在这里。</div>`;
          return;
        }

        els.historyBoardList.innerHTML = rows.map(item => `
          <div class="board-row">
            <div class="board-rank">${item.rank_no}</div>
            <div>
              <div class="board-name">${escapeHtml(item.nickname)}</div>
              <div class="board-meta">
                完美 ${Number(item.perfect_count || 0)} 次 · 神准 ${Number(item.godlike_count || 0)} 次 · 总挑战 ${Number(item.total_play_count || 0)} 次
              </div>
            </div>
            <div class="board-score">
              最佳 ${formatSeconds(item.best_error_seconds)}<br>
              平均 ${formatSeconds(item.average_error_seconds)}
            </div>
          </div>
        `).join("");
      } catch (err) {
        console.error("读取风云榜失败：", err);
        els.historyBoardList.innerHTML = `<div class="empty">风云榜读取失败。<br>请确认 get_time_answer_history_board RPC 已创建。</div>`;
      }
    }

    function closeHistoryBoard() {
      els.historyBoardMask.classList.remove("show");
      els.historyBoardMask.setAttribute("aria-hidden", "true");
    }

    function withTimeout(promise, ms, message) {
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message || "请求超时")), ms);
      });

      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    function syncRankTab() {
      els.rankTabs.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.rank === currentRank);
      });
    }

    function setStatusText(text, isError = false) {
      els.issueText.textContent = text || "";
      els.issueText.style.color = isError ? "#986744" : "var(--tea-soft)";
    }

    function getGrade(errorSeconds) {
      if (errorSeconds <= 0.010) return "完美命中";
      if (errorSeconds <= 0.050) return "神准";
      if (errorSeconds <= 0.150) return "很准";
      if (errorSeconds <= 0.500) return "不错";
      if (errorSeconds <= 1.000) return "接近了";
      if (errorSeconds <= 2.000) return "继续靠近";
      return "偏差较大";
    }

    function makeRandomTarget(min, max) {
      const value = min + Math.random() * (max - min);
      return round3(value);
    }

    function round3(value) {
      return Math.round(Number(value) * 1000) / 1000;
    }

    function formatSeconds(value) {
      const number = Number(value);
      return Number.isFinite(number) ? `${number.toFixed(3)}s` : "--";
    }

    function formatPercent(value) {
      const number = Number(value);
      return Number.isFinite(number) ? `${number.toFixed(3)}%` : "--";
    }

    function formatKeepDays(value) {
      const days = Number(value);
      if (!Number.isFinite(days) || days <= 0) return "今天";
      return `${Math.floor(days)} 天`;
    }

    function setRewardModalScaleForViewport() {
      const root = document.documentElement;
      const vw = window.innerWidth || document.documentElement.clientWidth || 1024;
      const vh = window.innerHeight || document.documentElement.clientHeight || 768;
      let scale = 1;

      if (vw <= 340) {
        scale = 0.72;
      } else if (vw <= 380 || vh <= 590) {
        scale = 0.76;
      } else if (vw <= 540) {
        scale = 0.82;
      }

      root.style.setProperty("--reward-modal-scale", String(scale));
    }

    function formatMs(ms) {
      const safeMs = Math.max(0, ms);
      const minutes = Math.floor(safeMs / 60000);
      const seconds = Math.floor((safeMs % 60000) / 1000);
      const milli = Math.floor(safeMs % 1000);
      return `${pad2(minutes)}:${pad2(seconds)}.${pad3(milli)}`;
    }

    function pad2(num) {
      return String(num).padStart(2, "0");
    }

    function pad3(num) {
      return String(num).padStart(3, "0");
    }

    function getLocalDateKey(date) {
      const y = date.getFullYear();
      const m = pad2(date.getMonth() + 1);
      const d = pad2(date.getDate());
      return `${y}-${m}-${d}`;
    }

    function normalizeRewardItem(item) {
      if (typeof item === "string") {
        return { name: item, amount: "", unit: "", icon: rewardIconMap[item] || "✨" };
      }

      return {
        name: item.name || "奖励",
        amount: item.amount ?? "",
        unit: item.unit || "",
        icon: item.icon || rewardIconMap[item.name] || "✨",
        prefix: item.prefix || ""
      };
    }

    function formatRewardAmount(item) {
      if (item.amount === "" || item.amount === null || item.amount === undefined) return "";
      if (typeof item.amount === "number") {
        const sign = item.amount > 0 ? "+" : "";
        return `${sign}${item.amount}${item.unit || ""}`;
      }
      return `${item.prefix || ""}${item.amount}${item.unit || ""}`;
    }

    function renderRewards(rewards) {
      const list = document.getElementById("rewardList");
      const sectionTitle = document.getElementById("rewardSectionTitle");

      list.innerHTML = "";
      list.className = "reward-list";
      sectionTitle.className = "reward-section-title";

      if (!rewards.length) {
        list.classList.add("empty");
        sectionTitle.classList.add("empty");
        return;
      }

      list.classList.add(`count-${Math.min(rewards.length, 3)}`);
      rewards.forEach(reward => {
        const item = document.createElement("div");
        item.className = "reward-item";
        item.innerHTML = `
          <div class="reward-item-icon">${escapeHtml(reward.icon)}</div>
          <div class="reward-item-name">${escapeHtml(reward.name)}</div>
          <div class="reward-item-amount">${escapeHtml(formatRewardAmount(reward))}</div>
        `;
        list.appendChild(item);
      });
    }

    function showRewardModal(options = {}) {
      const mask = document.getElementById("rewardMask");
      const type = options.type || "achievement";
      const meta = rewardTypeMeta[type] || rewardTypeMeta.achievement;
      const rewards = Array.isArray(options.rewards)
        ? options.rewards.map(normalizeRewardItem)
        : [];

      mask.dataset.type = type;
      document.getElementById("rewardIcon").textContent = options.icon || meta.icon;
      document.getElementById("rewardLabel").textContent = options.label || meta.label;
      document.getElementById("rewardTitle").textContent = options.title || "奖励已领取";
      document.getElementById("rewardDesc").textContent = options.desc || "奖励已经记录完成。";
      renderRewards(rewards);
      setRewardModalScaleForViewport();
      mask.classList.add("show");
      mask.style.display = "flex";
      mask.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeRewardModal() {
      const mask = document.getElementById("rewardMask");
      mask.classList.remove("show");
      mask.style.display = "";
      mask.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      playNextAwardModal();
    }

    function playAwardModals(awards = []) {
      pendingAwardModals = Array.isArray(awards) ? awards.slice() : [];
      playNextAwardModal();
    }

    function playNextAwardModal() {
      if (!pendingAwardModals.length) return;
      const award = pendingAwardModals.shift();
      showRewardModal({
        type: award.type || award.award_type || "achievement",
        title: award.title || award.award_name || award.name || "奖励已领取",
        desc: award.desc || award.award_desc || award.description || "奖励已经记录完成。",
        rewards: award.rewards || award.reward_items || []
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

  </script>
</body>
