<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时间的答案</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --tea: #7a5030;
      --tea-soft: rgba(122, 80, 48, 0.72);
      --tea-light: rgba(122, 80, 48, 0.48);
      --shadow: 0 14px 32px rgba(112, 78, 45, 0.14);
      --soft-shadow: 0 6px 14px rgba(129, 90, 54, 0.10);
      --radius: 22px;
      --font: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      --reward-ink: #6a4223;
      --reward-text: #826046;
      --reward-line: rgba(216, 157, 106, 0.35);
      --reward-soft-line: rgba(196, 139, 86, 0.16);
      --reward-modal-scale: 1;
      --desktop-card-height: 650px;
      --mode-accent-border: rgba(218, 169, 91, 0.18);
      --mode-accent-bg: rgba(255, 247, 226, 0.48);
      --mode-accent-bg-strong: rgba(255, 239, 201, 0.58);
      --mode-accent-text: #a36f30;
      --mode-accent-shadow: rgba(168, 105, 35, 0.06);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: var(--font);
      color: var(--tea);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0) 28%),
        radial-gradient(circle at 86% 18%, rgba(255, 246, 223, 0.72) 0%, rgba(255, 246, 223, 0) 34%),
        radial-gradient(circle at 35% 88%, rgba(239, 184, 184, 0.18) 0%, rgba(239, 184, 184, 0) 28%),
        linear-gradient(90deg, #fff3e7 0%, #f4dfc8 100%);
    }

    button,
    input { font-family: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .hidden { display: none !important; }

    .page {
      width: min(1030px, calc(100% - 20px));
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 12px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 861px) and (max-height: 760px) {
      .page { align-items: flex-start; }
    }

    .game-shell {
      position: relative;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.20)),
        rgba(255, 248, 239, 0.56);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.74);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .game-shell::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(181, 135, 92, 0.22);
      border-radius: 22px;
      pointer-events: none;
    }

    .game-shell::after {
      content: "✦  ✧  ✿  ✧  ✦";
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      color: rgba(181, 135, 92, 0.35);
      font-size: 14px;
      letter-spacing: 8px;
      pointer-events: none;
      white-space: nowrap;
    }

    .inner {
      position: relative;
      z-index: 1;
      padding: 24px 22px 20px;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      gap: 16px;
    }

    .main-card,
    .side-card {
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: var(--radius);
      background: rgba(255, 252, 248, 0.56);
      box-shadow: var(--soft-shadow), inset 0 1px 0 rgba(255,255,255,0.86);
      overflow: hidden;
    }

    .main-card {
      height: var(--desktop-card-height);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      text-align: center;
    }

    .side-card {
      height: var(--desktop-card-height);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .title-wrap { width: 100%; }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 4.3vw, 44px);
      line-height: 1.05;
      letter-spacing: 0.08em;
      font-weight: 900;
      color: #744a2a;
      text-shadow: 0 1px 0 rgba(255,255,255,0.72);
    }

    .subtitle {
      margin: 0 auto;
      max-width: 540px;
      color: var(--tea-soft);
      font-size: 13px;
      line-height: 1.55;
    }

    .mode-tabs {
      width: min(520px, 100%);
      margin: 12px auto 0;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
      border-radius: 18px;
      background: rgba(255, 252, 248, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.74);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.80);
    }

    .mode-tab {
      border: 0;
      border-radius: 999px;
      padding: 9px 8px;
      color: var(--tea-soft);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .mode-tab.active {
      color: #68401f;
      background: linear-gradient(180deg, rgba(249,232,203,.96) 0%, rgba(226,195,152,.92) 100%);
      box-shadow: 0 6px 14px rgba(129, 90, 54, 0.14), inset 0 1px 0 rgba(255,255,255,0.92);
    }

    .target-zone {
      position: relative;
      width: min(480px, 100%);
      margin: 0;
      padding: 16px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.18)),
        rgba(255, 244, 228, 0.58);
      border: 1px solid rgba(255,255,255,0.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.82), 0 8px 18px rgba(112,78,45,0.08);
    }

    .target-zone::before,
    .target-zone::after {
      content: "✦";
      position: absolute;
      color: rgba(209, 151, 85, 0.42);
      font-size: 15px;
    }

    .target-zone::before { left: 14px; top: 12px; }
    .target-zone::after { right: 14px; bottom: 12px; }

    .target-label {
      color: var(--tea-light);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .target-number {
      font-size: clamp(34px, 5.6vw, 64px);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: #a56a2f;
      text-shadow: 0 2px 0 rgba(255,255,255,0.58);
    }

    .issue-text {
      margin-top: 7px;
      color: var(--tea-soft);
      font-size: 12px;
    }

    .timer-zone {
      width: min(480px, 100%);
      min-height: 122px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      background: rgba(255, 252, 248, 0.56);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.86), 0 6px 14px rgba(112,78,45,0.07);
      transition: 0.25s ease;
    }

    .timer-zone.running { animation: softBreathe 1.6s ease-in-out infinite; }

    .timer-zone.starter-layout {
      min-height: 132px;
      gap: 10px;
    }

    .timer-zone.starter-layout .timer-display {
      display: none;
    }

    .timer-zone.starter-layout .timer-hint {
      margin-top: 0;
    }

    .timer-display {
      font-size: clamp(32px, 5.4vw, 58px);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: #6f4726;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
      transition: opacity 0.35s ease, filter 0.35s ease, transform 0.35s ease, letter-spacing 0.35s ease;
    }

    .timer-display.hidden-time {
      opacity: 0.42;
      filter: blur(1px);
      transform: scale(0.98);
      letter-spacing: 0.14em;
    }

    .timer-hint {
      margin-top: 10px;
      min-height: 20px;
      color: var(--tea-soft);
      font-size: 13px;
      line-height: 1.55;
    }

    .signal-panel {
      width: min(280px, 100%);
      min-height: 58px;
      margin-bottom: 0;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .signal-panel.show { display: flex; }

    .signal-light {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(159, 123, 91, 0.20);
      border: 2px solid rgba(255,255,255,0.78);
      box-shadow: inset 0 2px 8px rgba(91, 61, 35, 0.12), 0 5px 12px rgba(112,78,45,0.08);
      transition: 0.18s ease;
    }

    .signal-panel.single .signal-light {
      width: 58px;
      height: 58px;
    }

    .signal-light.red {
      background: radial-gradient(circle at 35% 28%, #ffd8d1 0%, #e05a4b 42%, #9e2f28 100%);
      box-shadow: 0 0 18px rgba(224, 90, 75, 0.34), inset 0 2px 8px rgba(255,255,255,0.32);
    }

    .signal-light.green {
      background: radial-gradient(circle at 35% 28%, #dcffd8 0%, #66bd59 42%, #357f35 100%);
      box-shadow: 0 0 18px rgba(102, 189, 89, 0.36), inset 0 2px 8px rgba(255,255,255,0.32);
    }

    .signal-light.flash {
      animation: signalFlash 0.42s ease both;
    }

    @keyframes signalFlash {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(1.16); }
    }

    .action-row {
      width: min(480px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 0;
    }

    .primary-btn,
    .danger-btn,
    .auth-btn {
      border: 1px solid rgba(255,255,255,0.82);
      border-radius: 15px;
      cursor: pointer;
      font-weight: 900;
      transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      box-shadow: 0 7px 18px rgba(129,90,54,0.12), inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .primary-btn,
    .danger-btn {
      min-height: 44px;
      font-size: 14px;
    }

    .primary-btn {
      color: #68401f;
      background: linear-gradient(180deg, #f9e8cb 0%, #e2c398 100%);
    }

    .danger-btn {
      color: #744233;
      background: linear-gradient(180deg, #f7d5cf 0%, #eab0a7 100%);
    }

    .primary-btn:hover,
    .danger-btn:hover,
    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 24px rgba(129,90,54,0.17), inset 0 1px 0 rgba(255,255,255,0.96);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      transform: none !important;
      box-shadow: none !important;
    }

    .result-box {
      width: min(480px, 100%);
      margin-top: 0;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255, 252, 248, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.82);
      display: block;
      visibility: hidden;
      pointer-events: none;
      text-align: left;
    }

    .result-box.show {
      visibility: visible;
      pointer-events: auto;
    }

    .result-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      color: #6f4726;
    }

    .result-grade {
      padding: 5px 9px;
      border-radius: 999px;
      color: #5f3d22;
      background: rgba(248, 216, 161, 0.78);
      border: 1px solid rgba(255,255,255,0.70);
      font-weight: 900;
      font-size: 12px;
      white-space: nowrap;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .result-item {
      min-width: 0;
      padding: 8px;
      border-radius: 16px;
      background: rgba(255, 248, 239, 0.68);
      border: 1px solid rgba(181, 135, 92, 0.13);
    }

    .result-name {
      color: var(--tea-light);
      font-size: 11px;
      margin-bottom: 5px;
      white-space: nowrap;
    }

    .result-value {
      min-width: 0;
      font-size: 13px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #744a2a;
      white-space: nowrap;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 900;
      margin: 0;
      color: #744a2a;
    }

    .section-title small {
      color: var(--tea-light);
      font-size: 12px;
      font-weight: 700;
    }

    .history-box .section-title {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
    }

    .featured-name {
      min-width: 0;
      color: #744a2a;
      font-size: 14px;
      font-weight: 950;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .identity-box {
      flex: 0 0 auto;
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 20px;
      background: rgba(255, 252, 248, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.82);
    }

    .identity-chip {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(173,128,82,.16);
      color: #775132;
      font-size: 12px;
      font-weight: 950;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      text-align: center;
    }

    .auth-box {
      display: grid;
      gap: 8px;
      padding-top: 2px;
    }

    .auth-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.18fr) auto;
      gap: 7px;
      align-items: end;
    }

    .guest-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
      align-items: end;
    }

    .field {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }

    .field label {
      color: var(--tea-soft);
      font-size: 12px;
      font-weight: 900;
    }

    .field input {
      width: 100%;
      height: 34px;
      border-radius: 12px;
      border: 1px solid rgba(160, 116, 78, 0.20);
      outline: none;
      padding: 0 10px;
      color: var(--tea);
      font-size: 13px;
      font-weight: 850;
      background: rgba(255, 252, 248, 0.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.88);
    }

    .field input:focus {
      border-color: rgba(160, 116, 78, 0.42);
      box-shadow: 0 0 0 3px rgba(230, 185, 111, 0.16), inset 0 1px 0 rgba(255,255,255,0.88);
    }

    .auth-btn {
      min-width: 58px;
      height: 34px;
      color: #68401f;
      background: linear-gradient(180deg, #f9e8cb 0%, #e2c398 100%);
      font-size: 12px;
    }

    .auth-btn.secondary {
      color: var(--tea);
      background: rgba(255, 252, 248, 0.70);
    }

    .auth-message {
      min-height: 16px;
      color: #986744;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 850;
    }

    .rank-tabs {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .rank-tab {
      border: 1px solid rgba(255, 255, 255, 0.74);
      border-radius: 15px;
      min-height: 34px;
      color: var(--tea-soft);
      background: rgba(255, 252, 248, 0.58);
      cursor: pointer;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.78);
    }

    .rank-tab.active {
      color: #68401f;
      background: linear-gradient(180deg, rgba(249,232,203,.96) 0%, rgba(226,195,152,.92) 100%);
    }

    .rank-note-line {
      flex: 0 0 17px;
      height: 17px;
      margin: -2px 0 0;
      color: var(--tea-light);
      font-size: 12px;
      font-weight: 800;
      line-height: 17px;
      overflow: hidden;
      white-space: nowrap;
    }

    .leaderboard {
      width: 100%;
      min-width: 0;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }

    .leaderboard::-webkit-scrollbar { width: 8px; }

    .leaderboard::-webkit-scrollbar-thumb {
      background: rgba(181, 135, 92, 0.28);
      border-radius: 999px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) minmax(78px, 92px);
      align-items: center;
      gap: 8px;
      min-height: 58px;
      padding: 9px 8px;
      border-radius: 16px;
      background: rgba(255, 252, 248, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.68);
      box-shadow: 0 3px 8px rgba(112,78,45,0.05), inset 0 1px 0 rgba(255,255,255,0.8);
      margin-bottom: 7px;
    }

    .rank-row > div:nth-child(2) { min-width: 0; }

    .rank-no {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #68401f;
      background: rgba(248, 216, 161, 0.82);
      border: 1px solid rgba(255,255,255,0.76);
      font-weight: 900;
      font-size: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.88);
    }

    .rank-name {
      min-width: 0;
      font-size: 12px;
      font-weight: 900;
      color: #6f4726;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-meta {
      margin-top: 2px;
      color: var(--tea-soft);
      font-size: 12px;
      line-height: 1.45;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-score {
      min-width: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: #8f5b2b;
      font-weight: 900;
      line-height: 1.35;
      word-break: keep-all;
    }

    .empty {
      height: 170px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--tea-soft);
      border-radius: 18px;
      border: 1px dashed rgba(181, 135, 92, 0.26);
      background: rgba(255, 252, 248, 0.42);
      line-height: 1.7;
    }

    .history-box {
      height: 148px;
      flex: 0 0 148px;
      min-width: 0;
      padding: 12px;
      border-radius: 20px;
      background: rgba(255, 252, 248, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.82);
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    .history-line {
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      color: var(--tea-soft);
      font-size: 12px;
      line-height: 1.55;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 3px;
    }

    .history-line::-webkit-scrollbar { width: 6px; }

    .history-line::-webkit-scrollbar-thumb {
      background: rgba(181, 135, 92, 0.22);
      border-radius: 999px;
    }

    .history-actions {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .history-btn {
      min-height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 15px;
      color: #68401f;
      background: linear-gradient(180deg, rgba(249,232,203,.96) 0%, rgba(226,195,152,.92) 100%);
      cursor: pointer;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 6px 14px rgba(129,90,54,0.12), inset 0 1px 0 rgba(255,255,255,0.88);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .history-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 9px 20px rgba(129,90,54,0.16), inset 0 1px 0 rgba(255,255,255,0.94);
    }

    .board-mask {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(64, 45, 30, 0.28);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .board-mask.show { display: flex; }

    .board-card {
      width: min(720px, calc(100vw - 28px));
      max-height: calc(100dvh - 28px);
      padding: 20px;
      border-radius: 26px;
      overflow: hidden;
      color: #6a4223;
      background:
        radial-gradient(circle at 14% 16%, rgba(255,226,235,.58), transparent 30%),
        radial-gradient(circle at 86% 18%, rgba(255,240,181,.52), transparent 32%),
        linear-gradient(180deg, rgba(255,253,247,.98), rgba(255,244,226,.96));
      border: 2px solid rgba(216, 157, 106, 0.35);
      box-shadow: 0 22px 54px rgba(69, 47, 28, 0.24), inset 0 1px 0 rgba(255,255,255,.9);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .board-title {
      margin: 0;
      color: #6a4223;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 950;
      letter-spacing: 0.04em;
    }

    .board-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 999px;
      color: #7b5636;
      background: rgba(255,250,242,.88);
      cursor: pointer;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 2px 8px rgba(105,75,43,.10), inset 0 1px 0 rgba(255,255,255,.9);
    }

    .board-desc {
      margin: 0;
      color: #826046;
      font-size: 13px;
      line-height: 1.65;
    }

    .board-list {
      max-height: min(520px, calc(100dvh - 180px));
      overflow: auto;
      padding-right: 4px;
      display: grid;
      gap: 8px;
    }

    .board-list::-webkit-scrollbar { width: 8px; }

    .board-list::-webkit-scrollbar-thumb {
      background: rgba(181, 135, 92, 0.28);
      border-radius: 999px;
    }

    .board-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 18px;
      background: rgba(255, 252, 248, 0.66);
      border: 1px solid rgba(255, 255, 255, 0.70);
      box-shadow: 0 3px 8px rgba(112,78,45,0.05), inset 0 1px 0 rgba(255,255,255,0.84);
    }

    .board-rank {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #68401f;
      background: rgba(248, 216, 161, 0.86);
      border: 1px solid rgba(255,255,255,0.76);
      font-size: 12px;
      font-weight: 950;
    }

    .board-name {
      color: #6f4726;
      font-size: 13px;
      font-weight: 950;
      word-break: break-word;
    }

    .board-meta {
      margin-top: 3px;
      color: rgba(122, 80, 48, 0.72);
      font-size: 12px;
      line-height: 1.45;
    }

    .board-score {
      color: #8f5b2b;
      font-size: 12px;
      font-weight: 950;
      line-height: 1.45;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .reward-mask {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(64, 45, 30, 0.30);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      --reward-scale: var(--reward-modal-scale, 1);
    }

    .reward-mask.show { display: flex; }

    .reward-card {
      position: relative;
      width: min(calc(430px * var(--reward-scale)), calc(100vw - 28px));
      max-height: calc(100dvh - 28px);
      padding:
        calc(28px * var(--reward-scale))
        calc(24px * var(--reward-scale))
        calc(22px * var(--reward-scale));
      border-radius: calc(26px * var(--reward-scale));
      overflow: hidden auto;
      text-align: center;
      color: var(--reward-ink);
      background:
        radial-gradient(circle at 12% 16%, rgba(255,226,235,.68), transparent 30%),
        radial-gradient(circle at 86% 18%, rgba(255,240,181,.62), transparent 32%),
        linear-gradient(180deg, rgba(255,253,247,.98), rgba(255,244,226,.96));
      border: calc(2px * var(--reward-scale)) solid var(--reward-line);
      box-shadow:
        0 calc(22px * var(--reward-scale)) calc(54px * var(--reward-scale)) rgba(69, 47, 28, 0.24),
        inset 0 1px 0 rgba(255,255,255,.9);
      animation: rewardPop .42s cubic-bezier(.2, 1.12, .34, 1) both;
    }

    .reward-card::before,
    .reward-card::after {
      position: absolute;
      left: calc(12px * var(--reward-scale));
      right: calc(12px * var(--reward-scale));
      font-size: calc(15px * var(--reward-scale));
      letter-spacing: calc(8px * var(--reward-scale));
      white-space: nowrap;
      overflow: hidden;
      pointer-events: none;
    }

    .reward-card::before {
      content: "✿  ❀  ✽  ✿  ❀  ✽  ✿";
      top: calc(9px * var(--reward-scale));
      color: rgba(209, 120, 148, 0.52);
    }

    .reward-card::after {
      content: "✿  ❀  ✽  ✿  ❀  ✽  ✿";
      bottom: calc(8px * var(--reward-scale));
      color: rgba(199, 145, 75, 0.44);
    }

    @keyframes rewardPop {
      0% { opacity: 0; transform: translateY(calc(12px * var(--reward-scale))) scale(.9); }
      64% { opacity: 1; transform: translateY(0) scale(1.025); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .reward-close {
      position: absolute;
      z-index: 6;
      top: calc(12px * var(--reward-scale));
      right: calc(12px * var(--reward-scale));
      width: calc(30px * var(--reward-scale));
      height: calc(30px * var(--reward-scale));
      border: none;
      border-radius: 999px;
      background: rgba(255,250,242,.88);
      color: #7b5636;
      font-size: calc(18px * var(--reward-scale));
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      box-shadow:
        0 calc(2px * var(--reward-scale)) calc(8px * var(--reward-scale)) rgba(105,75,43,.10),
        inset 0 1px 0 rgba(255,255,255,.9);
    }

    .reward-petals {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .reward-petals span {
      position: absolute;
      top: calc(-18px * var(--reward-scale));
      color: rgba(220,132,154,.56);
      font-size: calc(16px * var(--reward-scale));
      opacity: 0;
      text-shadow:
        0 calc(2px * var(--reward-scale)) calc(4px * var(--reward-scale)) rgba(255,255,255,.76);
      animation: rewardPetalFall 1.35s ease-in-out both;
    }

    .reward-petals span:nth-child(1) { left: 12%; animation-delay: .05s; }
    .reward-petals span:nth-child(2) { left: 28%; animation-delay: .18s; }
    .reward-petals span:nth-child(3) { left: 48%; animation-delay: .02s; }
    .reward-petals span:nth-child(4) { left: 66%; animation-delay: .22s; }
    .reward-petals span:nth-child(5) { left: 82%; animation-delay: .10s; }

    @keyframes rewardPetalFall {
      0% { opacity: 0; transform: translateY(calc(-14px * var(--reward-scale))) rotate(0deg) scale(.78); }
      20% { opacity: .85; }
      100% { opacity: 0; transform: translateY(calc(145px * var(--reward-scale))) rotate(160deg) scale(1); }
    }

    .reward-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .reward-icon {
      width: calc(62px * var(--reward-scale));
      height: calc(62px * var(--reward-scale));
      margin:
        calc(4px * var(--reward-scale))
        auto
        calc(12px * var(--reward-scale));
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,246,226,.78);
      border: 1px solid rgba(220,164,102,.25);
      box-shadow:
        0 calc(8px * var(--reward-scale)) calc(20px * var(--reward-scale)) rgba(126,92,51,.10),
        inset 0 1px 0 rgba(255,255,255,.85);
      font-size: calc(34px * var(--reward-scale));
    }

    .reward-label {
      min-height: calc(25px * var(--reward-scale));
      padding: 0 calc(13px * var(--reward-scale));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(255,249,232,.66);
      border: 1px solid rgba(218,166,87,.20);
      color: #b26a3a;
      font-size: calc(13px * var(--reward-scale));
      font-weight: 950;
      line-height: 1;
      letter-spacing: .06em;
      animation: rewardStamp .42s ease both;
    }

    .reward-title {
      position: relative;
      max-width: 100%;
      margin:
        calc(10px * var(--reward-scale))
        auto
        calc(8px * var(--reward-scale));
      padding:
        calc(8px * var(--reward-scale))
        calc(18px * var(--reward-scale));
      border-radius: 999px;
      color: var(--reward-ink);
      font-size: calc(22px * var(--reward-scale));
      font-weight: 950;
      line-height: 1.15;
      background: rgba(255,249,232,.72);
      border: 1px solid rgba(218,166,87,.24);
      box-shadow:
        0 calc(5px * var(--reward-scale)) calc(14px * var(--reward-scale)) rgba(126,92,51,.08),
        inset 0 1px 0 rgba(255,255,255,.82);
      overflow: hidden;
    }

    .reward-title::after {
      content: "";
      position: absolute;
      inset: -30% auto -30% -42%;
      width: 36%;
      background: linear-gradient(90deg, transparent, rgba(255,234,160,.80), transparent);
      transform: skewX(-18deg);
      animation: rewardSweep 1.25s ease .22s both;
    }

    @keyframes rewardStamp {
      0% { opacity: 0; transform: scale(1.12); }
      72% { opacity: 1; transform: scale(.97); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes rewardSweep {
      0% { left: -42%; }
      100% { left: 118%; }
    }

    .reward-desc {
      width: 100%;
      max-width: calc(330px * var(--reward-scale));
      margin: 0 auto calc(14px * var(--reward-scale));
      color: var(--reward-text);
      font-size: calc(13px * var(--reward-scale));
      line-height: 1.65;
      text-align: center;
      white-space: pre-line;
    }

    .reward-section-title {
      margin: 0 0 calc(10px * var(--reward-scale));
      color: #8a5c33;
      font-size: calc(12px * var(--reward-scale));
      font-weight: 950;
      line-height: 1;
      letter-spacing: .08em;
    }

    .reward-list {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      justify-content: center;
      gap: calc(8px * var(--reward-scale));
      margin: 0 0 calc(16px * var(--reward-scale));
    }

    .reward-list.count-1 { grid-template-columns: minmax(0, calc(120px * var(--reward-scale))); }
    .reward-list.count-2 { grid-template-columns: repeat(2, minmax(0, calc(120px * var(--reward-scale)))); }
    .reward-list.empty,
    .reward-section-title.empty { display: none; }

    .reward-item {
      min-width: 0;
      min-height: calc(84px * var(--reward-scale));
      padding:
        calc(10px * var(--reward-scale))
        calc(7px * var(--reward-scale))
        calc(9px * var(--reward-scale));
      border-radius: calc(16px * var(--reward-scale));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,252,247,.72);
      border: 1px solid var(--reward-soft-line);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.82),
        0 calc(3px * var(--reward-scale)) calc(10px * var(--reward-scale)) rgba(116,86,54,.06);
      animation: rewardItemIn .38s ease both;
    }

    .reward-item:nth-child(1) { animation-delay: .14s; }
    .reward-item:nth-child(2) { animation-delay: .24s; }
    .reward-item:nth-child(3) { animation-delay: .34s; }
    .reward-item:nth-child(4) { animation-delay: .44s; }

    @keyframes rewardItemIn {
      0% { opacity: 0; transform: translateY(calc(8px * var(--reward-scale))) scale(.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .reward-item-icon {
      font-size: calc(28px * var(--reward-scale));
      line-height: 1;
      margin-bottom: calc(7px * var(--reward-scale));
    }

    .reward-item-name {
      width: 100%;
      color: #7b593b;
      font-size: calc(11px * var(--reward-scale));
      font-weight: 900;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reward-item-amount {
      margin-top: calc(3px * var(--reward-scale));
      color: var(--reward-ink);
      font-size: calc(13px * var(--reward-scale));
      font-weight: 950;
      line-height: 1.2;
      white-space: nowrap;
    }

    .reward-confirm {
      min-width: calc(132px * var(--reward-scale));
      height: calc(36px * var(--reward-scale));
      border: 1px solid rgba(153,104,62,.22);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,238,200,.96), rgba(227,187,132,.90));
      color: #67401f;
      font-size: calc(13px * var(--reward-scale));
      font-weight: 950;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.72),
        0 calc(4px * var(--reward-scale)) calc(12px * var(--reward-scale)) rgba(112,80,42,.10);
    }

    body.free-mode .target-zone {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.44), rgba(255,255,255,0.18)),
        var(--mode-accent-bg);
      border-color: var(--mode-accent-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.86), 0 8px 18px var(--mode-accent-shadow);
    }

    body.free-mode .timer-zone {
      background: var(--mode-accent-bg);
      border-color: var(--mode-accent-border);
    }

    body.free-mode .target-number {
      color: var(--mode-accent-text);
    }

    body.free-mode .mode-tab.active,
    body.free-mode .rank-tab.active,
    body.free-mode .primary-btn {
      color: #684622;
      background: linear-gradient(180deg, rgba(255,244,218,.92), rgba(232,205,158,.82));
    }

    .rank-row.current-result {
      border-color: var(--mode-accent-border);
      background: linear-gradient(180deg, rgba(255,252,246,.86), var(--mode-accent-bg-strong));
      box-shadow: 0 5px 12px var(--mode-accent-shadow), inset 0 1px 0 rgba(255,255,255,0.88);
    }

    .rank-current-tag {
      display: inline-flex;
      align-items: center;
      margin-left: 6px;
      padding: 2px 6px;
      border-radius: 999px;
      color: #7a5530;
      background: var(--mode-accent-bg-strong);
      border: 1px solid var(--mode-accent-border);
      font-size: 11px;
      font-weight: 950;
      line-height: 1.2;
      vertical-align: middle;
    }

    @media (max-width: 860px) {
      .page {
        width: min(100% - 20px, 720px);
        padding: 12px 0;
        align-items: flex-start;
      }

      .game-shell { border-radius: 22px; }

      .game-shell::before {
        inset: 9px;
        border-radius: 20px;
      }

      .game-shell::after { display: none; }

      .inner {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .main-card,
      .side-card { height: auto; }

      .main-card { padding: 16px 12px; }

      .action-row { grid-template-columns: 1fr; }

      .result-box {
        display: none;
        visibility: visible;
        pointer-events: auto;
      }

      .history-box {
        height: auto;
        flex-basis: auto;
        max-height: none;
      }

      .history-line { overflow: visible; }

      .result-box.show { display: block; }
    }

    @media (max-width: 560px) {
      .mode-tabs,
      .rank-tabs { grid-template-columns: 1fr 1fr; border-radius: 18px; }

      .auth-row,
      .guest-row { grid-template-columns: 1fr; }

      .auth-btn { width: 100%; }
    }

    @media (max-width: 540px) {
      .reward-mask {
        padding: 14px;
      }
    }

    @media (max-width: 420px) {
      .page { width: calc(100% - 16px); }

      .inner { padding: 9px; }

      .main-card,
      .side-card {
        padding: 16px 12px;
        border-radius: 18px;
      }

      .target-zone,
      .timer-zone,
      .result-box { border-radius: 18px; }

      .rank-row { grid-template-columns: 32px minmax(0, 1fr); }

      .rank-score {
        grid-column: 2;
        width: auto;
        text-align: left;
      }
    }

    @media (max-width: 340px) {
      .reward-list,
      .reward-list.count-1,
      .reward-list.count-2 { grid-template-columns: 1fr; }
    }
  </style>
<!-- 十号房：时间的答案｜统一奖励弹窗确认版 -->
</head>

<body>
  <main class="page">
    <section class="game-shell" aria-label="时间的答案游戏">
      <div class="inner">
        <section class="main-card">
          <div class="title-wrap">
            <h1>时间的答案</h1>
            <p class="subtitle">看准目标秒数，在不同模式里完成你的时间挑战。</p>

            <div class="mode-tabs" role="tablist" aria-label="游戏模式">
              <button class="mode-tab active" type="button" data-mode="daily">当前挑战</button>
              <button class="mode-tab" type="button" data-mode="free">自由模式</button>
              <button class="mode-tab" type="button" data-mode="reaction">发令枪</button>
              <button class="mode-tab" type="button" data-mode="athlete">运动员</button>
            </div>
          </div>

          <div class="target-zone">
            <div class="target-label" id="targetLabel">当前目标</div>
            <div class="target-number" id="targetNumber">10.000s</div>
            <div class="issue-text" id="issueText">第 1 期 · 00:00 结算上一期冠军</div>
          </div>

          <div class="timer-zone" id="timerZone">
            <div class="signal-panel" id="signalPanel" aria-hidden="true"></div>
            <div class="timer-display" id="timerDisplay">00:00.000</div>
            <div class="timer-hint" id="timerHint">开始后前 1.5 秒显示毫秒计时，之后时间会消失。</div>
          </div>

          <div class="action-row">
            <button class="primary-btn" type="button" id="startBtn">开始挑战</button>
            <button class="danger-btn" type="button" id="stopBtn" disabled>停止</button>
          </div>

          <div class="result-box" id="resultBox">
            <div class="result-title">
              <strong>本次结果</strong>
              <span class="result-grade" id="resultGrade">--</span>
            </div>
            <div class="result-grid">
              <div class="result-item">
                <div class="result-name">目标</div>
                <div class="result-value" id="resultTarget">--</div>
              </div>
              <div class="result-item">
                <div class="result-name">你的时间</div>
                <div class="result-value" id="resultActual">--</div>
              </div>
              <div class="result-item">
                <div class="result-name">误差</div>
                <div class="result-value" id="resultError">--</div>
              </div>
              <div class="result-item">
                <div class="result-name">当前排名</div>
                <div class="result-value" id="resultRank">--</div>
              </div>
            </div>
          </div>
        </section>

        <aside class="side-card">
          <div class="identity-box">
            <div id="identityChip" class="identity-chip">当前玩家：参观者模式</div>

            <div id="authBox" class="auth-box hidden">
              <div class="auth-row">
                <div class="field">
                  <label>成员昵称</label>
                  <input id="loginNicknameInput" type="text" maxlength="20" placeholder="昵称" autocomplete="username">
                </div>
                <div class="field">
                  <label>成员钥匙</label>
                  <input id="loginCodeInput" type="password" maxlength="32" placeholder="钥匙" autocomplete="current-password">
                </div>
                <button id="submitLoginBtn" class="auth-btn" type="button">登录</button>
              </div>

              <div id="loginMessage" class="auth-message"></div>

              <div class="guest-row">
                <div class="field">
                  <label>游客名字</label>
                  <input id="guestNameInput" type="text" maxlength="12" placeholder="1-12字">
                </div>
                <button id="useGuestBtn" class="auth-btn secondary" type="button">游客参与</button>
              </div>
            </div>
          </div>

          <div class="rank-tabs">
            <button class="rank-tab active" type="button" data-rank="daily">当前挑战榜</button>
            <button class="rank-tab" type="button" data-rank="free">自由模式榜</button>
            <button class="rank-tab" type="button" data-rank="reaction">发令枪榜</button>
            <button class="rank-tab" type="button" data-rank="athlete">运动员榜</button>
          </div>

          <div class="rank-note-line" id="rankNote">前 5｜按绝对误差</div>

          <div class="leaderboard" id="leaderboard"></div>

          <div class="history-box">
            <h2 class="section-title">
              <span id="featuredTitle">上一期冠军</span>
              <span id="featuredName" class="featured-name"></span>
              <small id="featuredNote">00:00 生成</small>
            </h2>
            <div class="history-line" id="lastWinnerText">暂无结算记录。</div>
            <div class="history-actions">
              <button class="history-btn" type="button" id="historyBoardBtn">查看风云榜</button>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div class="board-mask" id="historyBoardMask" aria-hidden="true">
    <section class="board-card" role="dialog" aria-modal="true" aria-labelledby="historyBoardTitle">
      <div class="board-head">
        <h2 class="board-title" id="historyBoardTitle">时间风云榜</h2>
        <button class="board-close" type="button" id="historyBoardClose" aria-label="关闭">×</button>
      </div>
      <p class="board-desc">只统计成员正式成绩，不包含游客临时成绩。优先按完美命中次数、神准次数和历史最佳误差排序。</p>
      <div class="board-list" id="historyBoardList">
        <div class="empty">点击后读取风云榜。</div>
      </div>
    </section>
  </div>

  <div class="reward-mask" id="rewardMask" aria-hidden="true" data-type="achievement">
    <section class="reward-card" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
      <div class="reward-petals" aria-hidden="true">
        <span>✿</span>
        <span>❀</span>
        <span>✽</span>
        <span>✿</span>
        <span>❀</span>
      </div>

      <button class="reward-close" type="button" aria-label="关闭" onclick="closeRewardModal()">×</button>

      <div class="reward-content">
        <div class="reward-icon" id="rewardIcon" aria-hidden="true">🏆</div>
        <div class="reward-label" id="rewardLabel">成就达成</div>
        <h2 class="reward-title" id="rewardTitle">奖励已领取</h2>
        <p class="reward-desc" id="rewardDesc">奖励已经记录完成。</p>
        <div class="reward-section-title" id="rewardSectionTitle">奖励内容</div>
        <div class="reward-list" id="rewardList"></div>
        <button class="reward-confirm" type="button" onclick="closeRewardModal()">收下奖励</button>
      </div>
    </section>
  </div>

  <script>
    const CONFIG = {
      visibleMs: 1500,
      freeTargetMin: 5,
      freeTargetMax: 30,
      reactionWaitMin: 2000,
      reactionWaitMax: 6000,
      athleteTargetMin: 10.001,
      athleteTargetMax: 30,
      signalStepMs: 520,
      guestStorageKey: "room10_time_answer_guest"
    };

    const supabaseUrl = "https://tfevitwoqmxwaguvtyms.supabase.co";
    const supabaseKey = "sb_publishable_0cFYhwx_9uEcrXnMJzzNMQ_cEng8xmI";
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    const els = {
      modeTabs: document.querySelectorAll(".mode-tab"),
      rankTabs: document.querySelectorAll(".rank-tab"),
      targetLabel: document.getElementById("targetLabel"),
      targetNumber: document.getElementById("targetNumber"),
      issueText: document.getElementById("issueText"),
      timerZone: document.getElementById("timerZone"),
      signalPanel: document.getElementById("signalPanel"),
      timerDisplay: document.getElementById("timerDisplay"),
      timerHint: document.getElementById("timerHint"),
      startBtn: document.getElementById("startBtn"),
      stopBtn: document.getElementById("stopBtn"),
      resultBox: document.getElementById("resultBox"),
      resultGrade: document.getElementById("resultGrade"),
      resultTarget: document.getElementById("resultTarget"),
      resultActual: document.getElementById("resultActual"),
      resultError: document.getElementById("resultError"),
      resultRank: document.getElementById("resultRank"),
      resultNames: document.querySelectorAll(".result-name"),
      leaderboard: document.getElementById("leaderboard"),
      rankNote: document.getElementById("rankNote"),
      lastWinnerText: document.getElementById("lastWinnerText"),
      featuredTitle: document.getElementById("featuredTitle"),
      featuredName: document.getElementById("featuredName"),
      featuredNote: document.getElementById("featuredNote"),
      historyBoardBtn: document.getElementById("historyBoardBtn"),
      historyBoardMask: document.getElementById("historyBoardMask"),
      historyBoardClose: document.getElementById("historyBoardClose"),
      historyBoardList: document.getElementById("historyBoardList"),
      identityChip: document.getElementById("identityChip"),
      authBox: document.getElementById("authBox"),
      loginNicknameInput: document.getElementById("loginNicknameInput"),
      loginCodeInput: document.getElementById("loginCodeInput"),
      submitLoginBtn: document.getElementById("submitLoginBtn"),
      loginMessage: document.getElementById("loginMessage"),
      guestNameInput: document.getElementById("guestNameInput"),
      useGuestBtn: document.getElementById("useGuestBtn")
    };

    let currentMode = "daily";
    let currentRank = "daily";
    let currentIssue = null;
    let featuredRecords = null;
    const modeFeaturedSummaries = {};
    let freeTargetSeconds = makeRandomTarget(CONFIG.freeTargetMin, CONFIG.freeTargetMax);
    let athleteTargetSeconds = makeRandomTarget(CONFIG.athleteTargetMin, CONFIG.athleteTargetMax);
    let running = false;
    let starterState = "idle";
    let reactionTimerId = null;
    let reactionReadyAt = 0;
    let athleteRunStartedAt = 0;
    let startedAt = 0;
    let rafId = null;
    let activeActor = null;
    let lastLoadedDateKey = "";
    let lastSubmittedRecord = null;
    let pendingAwardModals = [];

    const rewardTypeMeta = {
      achievement: { label: "成就达成", icon: "🏆" },
      title: { label: "获得称号", icon: "🎖️" },
      daily: { label: "每日奖励", icon: "☀️" },
      gift: { label: "礼包奖励", icon: "🎁" },
      item: { label: "获得道具", icon: "🌟" },
      gold: { label: "金币奖励", icon: "🪙" }
    };

    const rewardIconMap = {
      金币: "🪙",
      成就: "🏆",
      称号: "🎖️"
    };

    init();

    async function init() {
      setRewardModalScaleForViewport();
      bindEvents();
      renderIdentityUI();
      updateModeChrome();
      await loadGameData();
      startDateWatcher();
    }

    function bindEvents() {
      els.modeTabs.forEach(btn => {
        btn.addEventListener("click", () => switchMode(btn.dataset.mode));
      });

      els.rankTabs.forEach(btn => {
        btn.addEventListener("click", () => switchMode(btn.dataset.rank));
      });

      els.historyBoardBtn.addEventListener("click", openHistoryBoard);
      els.historyBoardClose.addEventListener("click", closeHistoryBoard);
      els.historyBoardMask.addEventListener("click", event => {
        if (event.target === event.currentTarget) closeHistoryBoard();
      });

      els.startBtn.addEventListener("click", startGame);
      els.stopBtn.addEventListener("click", stopGame);
      els.submitLoginBtn.addEventListener("click", submitLogin);

      els.loginNicknameInput.addEventListener("keydown", event => {
        if (event.key === "Enter") els.loginCodeInput.focus();
      });

      els.loginCodeInput.addEventListener("keydown", event => {
        if (event.key === "Enter") submitLogin();
      });

      els.useGuestBtn.addEventListener("click", useGuestName);

      els.guestNameInput.addEventListener("input", () => {
        localStorage.setItem(CONFIG.guestStorageKey, els.guestNameInput.value.trim());
        renderIdentityUI();
      });

      window.addEventListener("storage", event => {
        if (["room10LoggedIn", "room10User", "room10Role", "room10MemberId", "room10MemberCode", CONFIG.guestStorageKey].includes(event.key)) {
          renderIdentityUI();
        }
      });

      document.getElementById("rewardMask").addEventListener("click", event => {
        if (event.target === event.currentTarget) closeRewardModal();
      });

      window.addEventListener("resize", setRewardModalScaleForViewport, { passive: true });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeRewardModal();
          closeHistoryBoard();
        }
      });
    }

    async function switchMode(mode) {
      if (running) return;

      const allowedModes = ["daily", "free", "reaction", "athlete"];
      const nextMode = allowedModes.includes(mode) ? mode : "daily";
      const modeChanged = currentMode !== nextMode;
      currentMode = nextMode;
      currentRank = nextMode;

      if (modeChanged && currentMode === "free") {
        freeTargetSeconds = makeRandomTarget(CONFIG.freeTargetMin, CONFIG.freeTargetMax);
      }

      if (modeChanged && currentMode === "athlete") {
        athleteTargetSeconds = makeRandomTarget(CONFIG.athleteTargetMin, CONFIG.athleteTargetMax);
      }

      lastSubmittedRecord = null;
      resetStarterState();
      updateModeChrome();
      renderFeaturedRecord();
      clearResult();
      renderTarget();
      await renderLeaderboard();
    }

    function updateModeChrome() {
      const isStarterMode = currentMode === "reaction" || currentMode === "athlete";
      document.body.classList.toggle("free-mode", currentMode === "free" || currentMode === "athlete");
      els.timerZone.classList.toggle("starter-layout", isStarterMode);
      els.modeTabs.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === currentMode);
      });
      syncRankTab();
    }

    function setModeControlsDisabled(disabled) {
      [...els.modeTabs, ...els.rankTabs].forEach(btn => {
        btn.disabled = disabled;
      });
    }

    async function loadGameData() {
      currentIssue = null;
      lastSubmittedRecord = null;
      updateModeChrome();
      els.startBtn.disabled = true;
      els.targetNumber.textContent = "--";
      els.leaderboard.innerHTML = `<div class="empty">正在读取当前挑战……</div>`;
      setStatusText("正在读取当前挑战……");

      const ok = await loadCurrentIssue();
      if (!ok) {
        els.startBtn.disabled = false;
        els.leaderboard.innerHTML = `<div class="empty">当前挑战读取失败<br>请检查 RPC 是否创建成功，或刷新页面重试。</div>`;
        return;
      }

      await loadFeaturedRecords();
      renderTarget();
      renderFeaturedRecord();
      els.startBtn.disabled = false;
      await renderLeaderboard();
    }

    async function loadCurrentIssue() {
      try {
        const { data, error } = await withTimeout(
          client.rpc("get_time_answer_current_issue", {}),
          10000,
          "读取当前挑战超时"
        );

        if (error) {
          console.error("读取当前挑战失败：", error);
          setStatusText(`当前挑战读取失败：${error.message || "请稍后再试"}`, true);
          return false;
        }

        const issue = Array.isArray(data) ? data[0] : data;
        if (!issue) {
          setStatusText("还没有可用挑战。", true);
          return false;
        }

        currentIssue = {
          id: issue.issue_id,
          issueNo: Number(issue.issue_no),
          issueDate: issue.issue_date,
          targetSeconds: Number(issue.target_seconds),
          startsAt: issue.starts_at,
          endsAt: issue.ends_at,
          previousIssueNo: issue.previous_issue_no == null ? null : Number(issue.previous_issue_no),
          previousIssueDate: issue.previous_issue_date || null,
          previousWinnerNickname: issue.previous_winner_nickname || "",
          previousWinnerErrorSeconds: issue.previous_winner_error_seconds == null ? null : Number(issue.previous_winner_error_seconds),
          previousWinnerActualSeconds: issue.previous_winner_actual_seconds == null ? null : Number(issue.previous_winner_actual_seconds)
        };
        lastLoadedDateKey = getLocalDateKey(new Date());
        return true;
      } catch (err) {
        console.error("读取当前挑战异常：", err);
        setStatusText(`当前挑战读取失败：${err.message || "请稍后再试"}`, true);
        return false;
      }
    }

    async function loadFeaturedRecords() {
      try {
        const { data, error } = await withTimeout(
          client.rpc("get_time_answer_featured_records", {}),
          10000,
          "读取冠军纪录超时"
        );

        if (error) throw error;

        const record = Array.isArray(data) ? data[0] : data;
        featuredRecords = record ? {
          previousIssueNo: record.previous_issue_no == null ? null : Number(record.previous_issue_no),
          previousIssueDate: record.previous_issue_date || null,
          previousWinnerNickname: record.previous_winner_nickname || "",
          previousWinnerErrorSeconds: record.previous_winner_error_seconds == null ? null : Number(record.previous_winner_error_seconds),
          previousWinnerActualSeconds: record.previous_winner_actual_seconds == null ? null : Number(record.previous_winner_actual_seconds),
          freeRecordNickname: record.free_record_nickname || "",
          freeRecordTargetSeconds: record.free_record_target_seconds == null ? null : Number(record.free_record_target_seconds),
          freeRecordActualSeconds: record.free_record_actual_seconds == null ? null : Number(record.free_record_actual_seconds),
          freeRecordErrorSeconds: record.free_record_error_seconds == null ? null : Number(record.free_record_error_seconds),
          freeRecordErrorRate: record.free_record_error_rate == null ? null : Number(record.free_record_error_rate),
          freeRecordCreatedAt: record.free_record_created_at || null,
          freeRecordKeepDays: record.free_record_keep_days == null ? null : Number(record.free_record_keep_days)
        } : null;
      } catch (err) {
        console.warn("读取冠军纪录失败：", err);
        featuredRecords = null;
      }
    }

    function renderFeaturedRecord() {
      const isDaily = currentRank === "daily";

      els.featuredName.textContent = "";
      els.featuredNote.textContent = "";

      if (isDaily) {
        els.featuredTitle.textContent = "上一期冠军";
        els.featuredNote.textContent = "00:00 生成";

        const issueNo = featuredRecords?.previousIssueNo || currentIssue?.previousIssueNo;
        const nickname = featuredRecords?.previousWinnerNickname || currentIssue?.previousWinnerNickname;
        const actual = featuredRecords?.previousWinnerActualSeconds ?? currentIssue?.previousWinnerActualSeconds;
        const error = featuredRecords?.previousWinnerErrorSeconds ?? currentIssue?.previousWinnerErrorSeconds;

        if (!currentIssue || currentIssue.issueNo <= 1) {
          els.lastWinnerText.textContent = "暂无结算记录。";
          return;
        }

        if (issueNo && nickname) {
          els.lastWinnerText.textContent =
            `第 ${issueNo} 期冠军：${nickname}，实际 ${formatSeconds(actual)}，误差 ${formatSeconds(error)}。`;
          return;
        }

        els.lastWinnerText.textContent = issueNo
          ? `第 ${issueNo} 期尚未产生冠军。`
          : "暂无结算记录。";
        return;
      }

      const summary = modeFeaturedSummaries[currentRank] || getDefaultModeFeaturedSummary(currentRank);
      els.featuredTitle.textContent = "纪录保持者";

      if (!summary.nickname) {
        els.lastWinnerText.textContent = getNoRecordText(currentRank);
        return;
      }

      const averageText = summary.averageText || getAveragePlaceholder(currentRank);
      els.lastWinnerText.innerHTML =
        `${escapeHtml(summary.nickname)}｜已保持 ${escapeHtml(formatKeepDays(summary.keepDays))}。<br>${escapeHtml(averageText)}`;
    }

    function getDefaultModeFeaturedSummary(mode) {
      if (mode === "free" && featuredRecords?.freeRecordNickname) {
        return {
          nickname: featuredRecords.freeRecordNickname,
          keepDays: featuredRecords.freeRecordKeepDays,
          averageText: getAveragePlaceholder(mode)
        };
      }

      return {
        nickname: "",
        keepDays: null,
        averageText: getAveragePlaceholder(mode)
      };
    }

    function getAveragePlaceholder(mode) {
      if (mode === "free") return "平均误差率 --";
      if (mode === "reaction") return "平均反应 --";
      if (mode === "athlete") return "平均误差 --";
      return "平均成绩 --";
    }

    function getNoRecordText(mode) {
      if (mode === "free") return "暂无自由模式纪录。";
      if (mode === "reaction") return "暂无发令枪纪录。";
      if (mode === "athlete") return "暂无运动员纪录。";
      return "暂无纪录。";
    }

    function updateModeFeaturedSummaryFromRows(mode, rows = []) {
      if (mode === "daily") return;

      const summary = getDefaultModeFeaturedSummary(mode);
      const validRows = Array.isArray(rows) ? rows : [];

      if ((mode === "reaction" || mode === "athlete") && validRows.length) {
        const top = validRows[0];
        summary.nickname = top?.nickname || "";
        summary.keepDays = getKeepDaysFromDate(top?.created_at || top?.createdAt || null);
      }

      if (mode === "free") {
        const avgRate = averageNumber(validRows.map(row => row.error_rate));
        summary.averageText = Number.isFinite(avgRate) ? `平均误差率 ${formatPercent(avgRate)}` : "平均误差率 --";
      } else if (mode === "reaction") {
        const avgReaction = averageNumber(validRows.map(row => row.reaction_seconds));
        summary.averageText = Number.isFinite(avgReaction) ? `平均反应 ${formatSeconds(avgReaction)}` : "平均反应 --";
      } else if (mode === "athlete") {
        const avgError = averageNumber(validRows.map(row => row.error_seconds));
        summary.averageText = Number.isFinite(avgError) ? `平均误差 ${formatSeconds(avgError)}` : "平均误差 --";
      }

      modeFeaturedSummaries[mode] = summary;
    }

    function averageNumber(values) {
      const nums = values
        .map(value => Number(value))
        .filter(value => Number.isFinite(value));
      if (!nums.length) return null;
      return nums.reduce((sum, value) => sum + value, 0) / nums.length;
    }

    function getKeepDaysFromDate(value) {
      if (!value) return null;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return null;
      const diff = Date.now() - date.getTime();
      if (diff < 0) return 0;
      return Math.max(0, Math.floor(diff / 86400000));
    }

    function startDateWatcher() {
      setInterval(async () => {
        const todayKey = getLocalDateKey(new Date());
        if (todayKey !== lastLoadedDateKey && !running) {
          await loadGameData();
        }
      }, 30000);
    }

    function isLoggedIn() {
      return localStorage.getItem("room10LoggedIn") === "true";
    }

    function getCurrentUser() {
      return localStorage.getItem("room10User") || "";
    }

    function getCurrentMemberId() {
      return localStorage.getItem("room10MemberId") || "";
    }

    function getCurrentMemberCode() {
      return localStorage.getItem("room10MemberCode") || "";
    }

    function getRole() {
      return localStorage.getItem("room10Role") || "";
    }

    function getRoleLabel(roleValue = getRole()) {
      const role = String(roleValue || "").toLowerCase();
      if (role === "owner") return "维修工";
      if (role === "admin") return "宿管";
      if (role === "member") return "房客";
      if (role === "applying") return "申请中";
      if (isLoggedIn()) return "房客";
      return "参观者";
    }

    function isMemberAvailable() {
      return isLoggedIn()
        && !!getCurrentUser().trim()
        && !!getCurrentMemberId().trim()
        && !!getCurrentMemberCode().trim();
    }

    function normalizeLoginResult(data) {
      if (Array.isArray(data)) return data[0] || null;
      if (data && Array.isArray(data.data)) return data.data[0] || null;
      return data || null;
    }

    function getActorPayload() {
      if (isMemberAvailable()) {
        return {
          ok: true,
          actorType: "member",
          playerName: getCurrentUser().trim(),
          memberId: getCurrentMemberId().trim(),
          memberCode: getCurrentMemberCode().trim(),
          isGuest: false
        };
      }

      const guestName = els.guestNameInput.value.trim();
      if (!guestName || guestName.length > 12) {
        return { ok: false, message: "请先登录，或填写 1-12 个字的游客名字。" };
      }

      localStorage.setItem(CONFIG.guestStorageKey, guestName);
      return {
        ok: true,
        actorType: "guest",
        playerName: guestName,
        memberId: null,
        memberCode: null,
        isGuest: true
      };
    }

    function renderIdentityUI() {
      if (isMemberAvailable()) {
        els.identityChip.textContent = `当前玩家：${getCurrentUser()}｜${getRoleLabel()}`;
        els.authBox.classList.add("hidden");
        return;
      }

      const guestName = localStorage.getItem(CONFIG.guestStorageKey) || "";
      els.authBox.classList.remove("hidden");
      els.guestNameInput.value = guestName;
      els.identityChip.textContent = guestName
        ? `当前玩家：${guestName}｜游客`
        : "当前玩家：游客模式";
    }

    function showMessage(message, isSuccess = false) {
      els.loginMessage.textContent = message || "";
      els.loginMessage.style.color = isSuccess ? "#5f7d3a" : "#986744";
    }

    function useGuestName() {
      const guestName = els.guestNameInput.value.trim();
      if (!guestName || guestName.length > 12) {
        showMessage("游客名字需要 1-12 个字。");
        els.guestNameInput.focus();
        return;
      }

      localStorage.setItem(CONFIG.guestStorageKey, guestName);
      renderIdentityUI();
      showMessage(`已使用游客名字：${guestName}`, true);
    }

    async function submitLogin() {
      const nickname = els.loginNicknameInput.value.trim();
      const code = els.loginCodeInput.value.trim();

      if (!nickname) {
        showMessage("请填写昵称。");
        els.loginNicknameInput.focus();
        return;
      }

      if (!code) {
        showMessage("请填写钥匙。");
        els.loginCodeInput.focus();
        return;
      }

      try {
        els.submitLoginBtn.disabled = true;
        showMessage("验证中……");

        const { data, error } = await client.rpc("verify_member_login", {
          input_nickname: nickname,
          input_code: code
        });

        if (error) {
          console.error(error);
          showMessage("登录失败，请检查昵称和钥匙。");
          return;
        }

        const member = normalizeLoginResult(data);
        if (!member || !member.member_id) {
          showMessage("昵称或钥匙不正确。");
          return;
        }

        localStorage.setItem("room10LoggedIn", "true");
        localStorage.setItem("room10User", member.nickname || nickname);
        localStorage.setItem("room10MemberId", member.member_id);
        localStorage.setItem("room10MemberCode", member.member_code || code);
        localStorage.setItem("room10Role", member.role || "member");
        localStorage.removeItem(CONFIG.guestStorageKey);

        els.guestNameInput.value = "";
        els.loginCodeInput.value = "";
        showMessage("登录成功。", true);
        renderIdentityUI();
        await renderLeaderboard();
      } catch (err) {
        console.error(err);
        showMessage("登录失败，请稍后再试。");
      } finally {
        els.submitLoginBtn.disabled = false;
      }
    }

    function startGame() {
      if (!currentIssue && currentMode === "daily") {
        alert("当前挑战还没有读取完成，请稍后再试。");
        return;
      }

      const actor = getActorPayload();
      if (!actor.ok) {
        alert(actor.message);
        if (!isMemberAvailable()) els.guestNameInput.focus();
        return;
      }

      activeActor = actor;

      if (currentMode === "reaction") {
        startStarterRound("reaction");
        return;
      }

      if (currentMode === "athlete") {
        startStarterRound("athlete");
        return;
      }

      running = true;
      startedAt = performance.now();
      lastSubmittedRecord = null;
      clearResult();

      els.startBtn.disabled = true;
      els.stopBtn.disabled = false;
      setModeControlsDisabled(true);
      els.timerZone.classList.add("running");
      els.timerDisplay.classList.remove("hidden-time");
      els.timerHint.textContent = "正在计时中……看见前 1.5 秒，然后相信自己。";

      rafId = requestAnimationFrame(updateTimer);
    }

    function updateTimer(now) {
      if (!running) return;

      const elapsedMs = now - startedAt;
      if (elapsedMs <= CONFIG.visibleMs) {
        els.timerDisplay.textContent = formatMs(elapsedMs);
        els.timerDisplay.classList.remove("hidden-time");
      } else {
        els.timerDisplay.textContent = "……";
        els.timerDisplay.classList.add("hidden-time");
        els.timerHint.textContent = "时间已经消失。现在按下停止，就是你的答案。";
      }

      rafId = requestAnimationFrame(updateTimer);
    }

    async function stopGame() {
      if (currentMode === "reaction" || currentMode === "athlete") {
        await handleStarterAction();
        return;
      }

      if (!running) return;

      const actor = activeActor || getActorPayload();
      if (!actor.ok) return;

      const endedAt = performance.now();
      const actualSeconds = round3((endedAt - startedAt) / 1000);
      const targetSeconds = getCurrentTargetSeconds();

      running = false;
      cancelAnimationFrame(rafId);
      rafId = null;

      els.startBtn.disabled = false;
      els.stopBtn.disabled = true;
      setModeControlsDisabled(false);
      els.timerZone.classList.remove("running");
      els.timerDisplay.classList.remove("hidden-time");
      els.timerDisplay.textContent = formatMs(actualSeconds * 1000);
      els.timerHint.textContent = "正在保存你的答案……";

      try {
        const { data, error } = await client.rpc("submit_time_answer_score", {
          p_mode: currentMode,
          p_issue_id: currentMode === "daily" ? currentIssue.id : null,
          p_member_id: actor.memberId,
          p_member_code: actor.memberCode,
          p_nickname: actor.playerName,
          p_is_guest: actor.isGuest,
          p_target_seconds: targetSeconds,
          p_actual_seconds: actualSeconds
        });

        if (error) throw error;

        const saved = Array.isArray(data) ? data[0] : data;
        const record = {
          mode: currentMode,
          playerName: actor.playerName,
          isGuest: actor.isGuest,
          targetSeconds,
          actualSeconds,
          errorSeconds: Number(saved?.error_seconds ?? Math.abs(actualSeconds - targetSeconds)),
          errorRate: Number(saved?.error_rate ?? ((Math.abs(actualSeconds - targetSeconds) / targetSeconds) * 100)),
          grade: saved?.result_grade || getGrade(Math.abs(actualSeconds - targetSeconds)),
          savedToBoard: saved?.saved === true,
          fallbackRank: saved?.temp_rank ?? null,
          boardRank: null,
          enteredVisibleBoard: false,
          awards: saved?.awards || []
        };

        let freshRows = [];
        let boardRefreshFailed = false;

        try {
          freshRows = await fetchLeaderboardRows(record.mode);
          if (record.savedToBoard) {
            applyVisibleBoardRank(record, freshRows);
          } else {
            applyGuestVirtualRank(record, freshRows);
          }
        } catch (rankErr) {
          boardRefreshFailed = true;
          console.warn("成绩已保存，但排行榜刷新失败：", rankErr);
        }

        lastSubmittedRecord = record;
        showResult(record);
        els.timerHint.textContent = boardRefreshFailed
          ? "成绩已保存，排行榜刷新失败，请刷新页面查看。"
          : getResultHint(record);

        if (currentMode === "free") {
          freeTargetSeconds = makeRandomTarget(CONFIG.freeTargetMin, CONFIG.freeTargetMax);
        }

        activeActor = null;
        renderTarget();

        if (!boardRefreshFailed && record.mode === currentRank) {
          renderLeaderboardRows(freshRows, currentRank, record);
        } else {
          await renderLeaderboard();
        }

        playAwardModals(record.awards || []);
      } catch (err) {
        console.error("保存成绩失败：", err);
        els.timerHint.textContent = "成绩保存失败，请稍后再试。";
        activeActor = null;
      }
    }

    function startStarterRound(mode) {
      running = true;
      starterState = "waiting";
      startedAt = 0;
      reactionReadyAt = 0;
      athleteRunStartedAt = 0;
      lastSubmittedRecord = null;
      clearResult();

      els.startBtn.disabled = true;
      els.stopBtn.disabled = false;
      els.stopBtn.textContent = mode === "athlete" ? "等待发令" : "等待发令";
      setModeControlsDisabled(true);
      els.timerZone.classList.add("running");
      els.timerDisplay.classList.remove("hidden-time");
      els.timerDisplay.textContent = "";
      els.timerHint.textContent = "红灯等待中。";

      if (mode === "athlete") {
        renderSignalPanel("athlete", 1, "red");
        reactionTimerId = window.setTimeout(() => renderSignalPanel("athlete", 2, "red"), CONFIG.signalStepMs);
        window.setTimeout(() => renderSignalPanel("athlete", 3, "red"), CONFIG.signalStepMs * 2);
        window.setTimeout(() => armStarterSignal(mode), CONFIG.signalStepMs * 2 + makeRandomWaitMs());
        return;
      }

      renderSignalPanel("reaction", 1, "red");
      reactionTimerId = window.setTimeout(() => armStarterSignal(mode), makeRandomWaitMs());
    }

    function armStarterSignal(mode) {
      if (!running || starterState !== "waiting") return;

      starterState = "ready";
      reactionReadyAt = performance.now();
      startedAt = reactionReadyAt;
      renderSignalPanel(mode, mode === "athlete" ? 3 : 1, "green");
      playStarterBeep();
      els.stopBtn.textContent = mode === "athlete" ? "起跑" : "冲！";
      els.timerDisplay.textContent = "";
      els.timerHint.textContent = mode === "athlete"
        ? "绿灯！点击起跑。"
        : "绿灯！现在点击。";
    }

    async function handleStarterAction() {
      if (!running) return;

      if (starterState === "waiting") {
        await finishFalseStart();
        return;
      }

      if (currentMode === "reaction") {
        await finishReactionRound();
        return;
      }

      if (currentMode === "athlete" && starterState === "ready") {
        athleteRunStartedAt = performance.now();
        starterState = "athlete-running";
        els.stopBtn.textContent = "到终点";
        els.timerDisplay.textContent = "……";
        els.timerDisplay.classList.add("hidden-time");
        els.timerHint.textContent = "已经起跑。到达目标时间时点击终点。";
        return;
      }

      if (currentMode === "athlete" && starterState === "athlete-running") {
        await finishAthleteRound();
      }
    }

    async function finishFalseStart() {
      const mode = currentMode;
      const actor = activeActor || getActorPayload();
      const targetSeconds = mode === "athlete" ? athleteTargetSeconds : 0;

      cleanupStarterTimers();
      running = false;
      starterState = "idle";
      els.startBtn.disabled = false;
      els.stopBtn.disabled = true;
      els.stopBtn.textContent = "停止";
      setModeControlsDisabled(false);
      els.timerZone.classList.remove("running");
      renderSignalPanel(mode, mode === "athlete" ? 3 : 1, "red", true);
      els.timerDisplay.classList.remove("hidden-time");
      els.timerDisplay.textContent = "抢跑";
      els.timerHint.textContent = "抢跑失败，正在记录本次结果……";

      let record = {
        mode,
        playerName: actor.ok ? actor.playerName : "",
        isGuest: actor.ok ? actor.isGuest : true,
        targetSeconds,
        actualSeconds: 0,
        errorSeconds: 0,
        errorRate: null,
        reactionSeconds: null,
        isFalseStart: true,
        grade: "抢跑失败",
        savedToBoard: false,
        fallbackRank: null,
        boardRank: null,
        enteredVisibleBoard: false,
        awards: []
      };

      try {
        if (actor.ok) {
          record = await submitStarterScore(record, actor);
        }
        lastSubmittedRecord = record;
        showStarterResult(record);
        els.timerHint.textContent = record.savedToBoard
          ? "抢跑已记录，本局不进入排行榜。"
          : "抢跑失败，本局不进入排行榜。";
        await renderLeaderboard();
      } catch (err) {
        console.error("保存抢跑结果失败：", err);
        lastSubmittedRecord = record;
        showStarterResult(record);
        els.timerHint.textContent = "抢跑失败。本次记录保存失败，请稍后再试。";
      } finally {
        activeActor = null;
      }
    }

    async function finishReactionRound() {
      const now = performance.now();
      const reactionSeconds = round3((now - reactionReadyAt) / 1000);
      const actor = activeActor || getActorPayload();

      cleanupStarterTimers();
      running = false;
      starterState = "idle";
      els.startBtn.disabled = false;
      els.stopBtn.disabled = true;
      els.stopBtn.textContent = "停止";
      setModeControlsDisabled(false);
      els.timerZone.classList.remove("running");
      els.timerDisplay.classList.remove("hidden-time");
      els.timerDisplay.textContent = formatMs(reactionSeconds * 1000);
      els.timerHint.textContent = "正在保存发令枪成绩……";

      let record = {
        mode: "reaction",
        playerName: actor.ok ? actor.playerName : "",
        isGuest: actor.ok ? actor.isGuest : true,
        targetSeconds: 0,
        actualSeconds: 0,
        errorSeconds: 0,
        errorRate: null,
        reactionSeconds,
        isFalseStart: false,
        grade: getReactionGrade(reactionSeconds),
        savedToBoard: false,
        fallbackRank: null,
        boardRank: null,
        enteredVisibleBoard: false,
        awards: []
      };

      let freshRows = [];
      let boardRefreshFailed = false;

      try {
        if (actor.ok) {
          record = await submitStarterScore(record, actor);
        }
        freshRows = await fetchLeaderboardRows("reaction");
        if (record.savedToBoard) {
          applyVisibleBoardRank(record, freshRows);
        } else {
          applyGuestVirtualRank(record, freshRows);
        }
      } catch (err) {
        boardRefreshFailed = true;
        console.error("保存发令枪成绩失败：", err);
      }

      lastSubmittedRecord = record;
      showStarterResult(record);
      els.timerHint.textContent = boardRefreshFailed
        ? "本次成绩已完成，但保存或排行榜刷新失败。"
        : getResultHint(record);

      activeActor = null;

      if (!boardRefreshFailed && currentRank === "reaction") {
        renderLeaderboardRows(freshRows, "reaction", record);
      } else {
        await renderLeaderboard();
      }

      playAwardModals(record.awards || []);
    }

    async function finishAthleteRound() {
      const now = performance.now();
      const reactionSeconds = round3((athleteRunStartedAt - reactionReadyAt) / 1000);
      const actualSeconds = round3((now - athleteRunStartedAt) / 1000);
      const targetSeconds = athleteTargetSeconds;
      const errorSeconds = round3(Math.abs(actualSeconds - targetSeconds));
      const actor = activeActor || getActorPayload();

      cleanupStarterTimers();
      running = false;
      starterState = "idle";
      els.startBtn.disabled = false;
      els.stopBtn.disabled = true;
      els.stopBtn.textContent = "停止";
      setModeControlsDisabled(false);
      els.timerZone.classList.remove("running");
      els.timerDisplay.classList.remove("hidden-time");
      els.timerDisplay.textContent = formatMs(actualSeconds * 1000);
      els.timerHint.textContent = "正在保存运动员模式成绩……";

      let record = {
        mode: "athlete",
        playerName: actor.ok ? actor.playerName : "",
        isGuest: actor.ok ? actor.isGuest : true,
        targetSeconds,
        actualSeconds,
        errorSeconds,
        errorRate: targetSeconds > 0 ? (errorSeconds / targetSeconds) * 100 : null,
        reactionSeconds,
        isFalseStart: false,
        grade: getGrade(errorSeconds),
        savedToBoard: false,
        fallbackRank: null,
        boardRank: null,
        enteredVisibleBoard: false,
        awards: []
      };

      let freshRows = [];
      let boardRefreshFailed = false;

      try {
        if (actor.ok) {
          record = await submitStarterScore(record, actor);
        }
        freshRows = await fetchLeaderboardRows("athlete");
        if (record.savedToBoard) {
          applyVisibleBoardRank(record, freshRows);
        } else {
          applyGuestVirtualRank(record, freshRows);
        }
      } catch (err) {
        boardRefreshFailed = true;
        console.error("保存运动员模式成绩失败：", err);
      }

      lastSubmittedRecord = record;
      showStarterResult(record);
      els.timerHint.textContent = boardRefreshFailed
        ? "本次成绩已完成，但保存或排行榜刷新失败。"
        : getResultHint(record);

      athleteTargetSeconds = makeRandomTarget(CONFIG.athleteTargetMin, CONFIG.athleteTargetMax);
      activeActor = null;
      renderTarget();

      if (!boardRefreshFailed && currentRank === "athlete") {
        renderLeaderboardRows(freshRows, "athlete", record);
      } else {
        await renderLeaderboard();
      }

      playAwardModals(record.awards || []);
    }

    async function submitStarterScore(record, actor) {
      const { data, error } = await client.rpc("submit_time_answer_reaction_score", {
        p_mode: record.mode,
        p_member_id: actor.memberId,
        p_member_code: actor.memberCode,
        p_nickname: actor.playerName,
        p_is_guest: actor.isGuest,
        p_target_seconds: record.targetSeconds || 0,
        p_actual_seconds: record.actualSeconds || 0,
        p_reaction_seconds: record.reactionSeconds,
        p_is_false_start: record.isFalseStart === true
      });

      if (error) throw error;

      const saved = Array.isArray(data) ? data[0] : data;
      return {
        ...record,
        errorSeconds: saved?.error_seconds == null ? record.errorSeconds : Number(saved.error_seconds),
        errorRate: saved?.error_rate == null ? record.errorRate : Number(saved.error_rate),
        reactionSeconds: saved?.reaction_seconds == null ? record.reactionSeconds : Number(saved.reaction_seconds),
        grade: saved?.result_grade || record.grade,
        savedToBoard: saved?.saved === true,
        fallbackRank: saved?.temp_rank ?? record.fallbackRank,
        awards: saved?.awards || []
      };
    }

    function showStarterResult(record) {
      if (record.mode === "reaction") {
        showSpecialResult({
          grade: record.grade,
          target: record.isFalseStart ? "抢跑" : "绿灯发令",
          actual: record.isFalseStart ? "无效" : formatSeconds(record.reactionSeconds),
          error: "--",
          rank: getRecordRankText(record)
        }, ["信号", "反应时间", "误差", "排行榜"]);
        return;
      }

      showSpecialResult({
        grade: record.grade,
        target: formatSeconds(record.targetSeconds),
        actual: record.isFalseStart ? "无效" : formatSeconds(record.actualSeconds),
        error: record.isFalseStart ? "抢跑" : formatSeconds(record.errorSeconds),
        rank: record.isFalseStart ? "不进榜" : `反应 ${formatSeconds(record.reactionSeconds)}`
      }, ["目标", "实际用时", "数秒误差", "起跑反应"]);
    }

    function getRecordRankText(record) {
      if (record.isFalseStart) return "不进榜";
      if (record.savedToBoard) {
        return record.enteredVisibleBoard && record.boardRank
          ? `第 ${record.boardRank} 名`
          : "未进榜";
      }
      return record.fallbackRank ? `临时第 ${record.fallbackRank} 名` : "未进榜";
    }

    function renderSignalPanel(mode, activeCount = 0, color = "red", flash = false) {
      const count = mode === "athlete" ? 3 : 1;
      els.signalPanel.className = `signal-panel show ${mode === "athlete" ? "multi" : "single"}`;
      els.signalPanel.innerHTML = Array.from({ length: count }, (_, index) => {
        const active = index < activeCount;
        const cls = ["signal-light"];
        if (active) cls.push(color);
        if (flash && active) cls.push("flash");
        return `<span class="${cls.join(" ")}" aria-hidden="true"></span>`;
      }).join("");
    }

    function hideSignalPanel() {
      els.signalPanel.className = "signal-panel";
      els.signalPanel.innerHTML = "";
    }

    function resetStarterState() {
      cleanupStarterTimers();
