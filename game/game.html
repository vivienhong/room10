<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>游戏房｜十号房</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../room10-paths.js"></script>
<style>
*{box-sizing:border-box;}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
:root{
  --bg-left:#fff3e7;
  --bg-right:#f4dfc8;
  --bg-top:#fff7ef;
  --bg-bottom:#edd8c1;
  --panel-bg:rgba(255,255,255,0.34);
  --panel-border:rgba(255,255,255,0.62);
  --panel-shadow:rgba(112,78,45,0.16);
  --text-main:#7a5030;
  --btn-bg:rgba(255,252,248,0.82);
  --btn-border:rgba(255,255,255,0.92);
  --btn-shadow:rgba(129,90,54,0.16);
  --bg-ui-scale:1;
  --ui-scale:var(--bg-ui-scale,1);
  --room-nav-scale:var(--bg-ui-scale,1);
  --identity-scale:var(--bg-ui-scale,1);
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-name-y:0em;
  --identity-separator-y:0em;
  --identity-role-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;
  --identity-mobile-name-y:0em;
  --identity-mobile-separator-y:0em;
  --identity-mobile-role-y:0em;
  --identity-mobile-notice-y:0em;
  --identity-mobile-button-y:0em;
  --identity-notice-mobile-top:58px;
  --room-nav-left:27.2%;
  --room-nav-top:6.35%;
  --room-nav-width:45.5%;
  --game-panel-left:55%;
  --game-panel-top:49.5%;
  --game-panel-width:48%;
  --game-panel-design-width:540;
  --game-panel-design-height:332;
  --game-panel-scale:1.03;
  --game-panel-max-width:none;
  --game-panel-padding:14px;
  --game-panel-radius:24px;
  --game-menu-gap:9px;
  --game-card-height:54px;
  --game-card-radius:16px;
  --game-card-padding-y:10px;
  --game-card-padding-x:9px;
  --game-card-padding:var(--game-card-padding-y) var(--game-card-padding-x);
  --game-card-gap:9px;
  --game-icon-size:28px;
  --game-icon-radius:11px;
  --game-icon-font-size:16px;
  --game-name-size:15px;
  --game-status-size:9px;
  --gacha-entry-left:26%;
  --gacha-entry-top:49.6%;
  --gacha-entry-width:280px;
  --gacha-entry-image-size:250px;
  --gacha-entry-scale:0.62;
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);
  --nav-text:#6e4827;
  --nav-border:rgba(145,98,56,.34);
}
body{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at center, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text-main);
}
button{
  font-family:inherit;
}
.hidden{
  display:none !important;
}
#bgColorFill{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    linear-gradient(180deg, var(--bg-top) 0%, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, var(--bg-bottom) 100%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
}
#bgBleed{
  position:fixed;
  inset:-8vh -8vw;
  z-index:1;
  background:var(--game-room-bg-url, none) center center / cover no-repeat;
  filter:blur(30px) saturate(1.05);
  transform:scale(1.08);
  opacity:.72;
  pointer-events:none;
}
#bgLight{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0) 58%),
    linear-gradient(180deg, rgba(255,248,240,0.08), rgba(255,248,240,0.08));
}
#room{
  position:relative;
  z-index:3;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:transparent;
}
#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}
#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}
#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:1;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}
#overlay *{
  pointer-events:auto;
}
.panel{
  position:absolute;
  left:var(--game-panel-left);
  top:var(--game-panel-top);
  transform:translate(-50%,-50%) scale(calc(var(--bg-ui-scale) * var(--game-panel-scale)));
  transform-origin:center center;
  width:calc(var(--game-panel-design-width) * 1px);
  height:calc(var(--game-panel-design-height) * 1px);
  max-width:none;
  padding:var(--game-panel-padding);
  border-radius:var(--game-panel-radius);
  background:
    radial-gradient(circle at 18% 18%, rgba(255,255,255,0.56), transparent 34%),
    radial-gradient(circle at 88% 84%, rgba(255,219,160,0.20), transparent 36%),
    rgba(255,255,255,0.34);
  border:1px solid rgba(255,255,255,0.64);
  box-shadow:
    0 16px 38px rgba(112,78,45,0.14),
    inset 0 1px 0 rgba(255,255,255,0.76),
    inset 0 0 30px rgba(255,255,255,0.11);
  backdrop-filter:blur(11px);
  -webkit-backdrop-filter:blur(11px);
  text-align:left;
  display:flex;
  flex-direction:column;
  gap:0;
  overflow:hidden;
  animation:gamePanelFloat 5.8s ease-in-out infinite;
}
@keyframes gamePanelFloat{
  0%,100%{filter:drop-shadow(0 0 0 rgba(255,240,210,0));}
  50%{filter:drop-shadow(0 8px 16px rgba(255,222,172,0.14));}
}
.game-section{
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:0;
  height:100%;
}
.game-section-main{
  flex:1 1 auto;
  min-height:0;
}
.menu{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  grid-auto-rows:minmax(var(--game-card-height), auto);
  align-content:start;
  gap:var(--game-menu-gap);
  min-height:0;
  overflow-x:hidden;
  overflow-y:auto;
  padding:0 2px 0 0;
  scrollbar-width:thin;
}
.menu::-webkit-scrollbar{width:6px;}
.menu::-webkit-scrollbar-thumb{background:rgba(143,101,66,.22);border-radius:999px;}
.menu::-webkit-scrollbar-track{background:rgba(255,255,255,.18);border-radius:999px;}
.game-btn{
  appearance:none;
  cursor:pointer;
  position:relative;
  width:100%;
  min-height:var(--game-card-height);
  border-radius:calc(var(--game-card-radius) + 1px);
  padding:var(--game-card-padding);
  text-decoration:none;
  display:flex;
  flex-direction:row;
  justify-content:flex-start;
  align-items:center;
  gap:var(--game-card-gap);
  text-align:left;
  background:
    radial-gradient(circle at 18% 18%, rgba(255,255,255,.55), transparent 40%),
    linear-gradient(180deg, rgba(255,253,250,.92) 0%, rgba(249,244,237,.90) 100%);
  border:1px solid rgba(201,183,161,.34);
  box-shadow:
    0 6px 16px rgba(129,90,54,0.08),
    inset 0 1px 0 rgba(255,255,255,0.78);
  transition:
    transform .22s ease,
    box-shadow .22s ease,
    background .22s ease,
    border-color .22s ease,
    opacity .22s ease,
    filter .22s ease;
  font-family:inherit;
  overflow:hidden;
}
.game-btn::before{
  content:"";
  position:absolute;
  inset:-55% auto -55% -55%;
  width:42%;
  background:linear-gradient(90deg, transparent, rgba(255,239,190,.70), transparent);
  transform:skewX(-18deg);
  opacity:0;
  pointer-events:none;
}
.game-btn:hover{
  transform:translateY(-4px) scale(1.012);
  background:
    radial-gradient(circle at 18% 18%, rgba(255,255,255,.70), transparent 40%),
    linear-gradient(180deg, rgba(255,254,251,.96) 0%, rgba(251,246,240,.94) 100%);
  box-shadow:
    0 10px 22px rgba(129,90,54,0.12),
    inset 0 1px 0 rgba(255,255,255,0.88);
  border-color:rgba(188,159,127,.42);
}
.game-btn:hover::before{
  opacity:1;
  animation:gameCardSweep .72s ease both;
}
.game-btn:active{transform:translateY(-1px) scale(.995);}
@keyframes gameCardSweep{
  0%{left:-55%;}
  100%{left:116%;}
}
.game-btn.is-coming-soon{opacity:.82;filter:saturate(.86);}
.game-btn.is-coming-soon:hover{opacity:.95;}
.game-btn > div{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.game-icon{
  position:relative;
  z-index:2;
  flex:0 0 auto;
  width:var(--game-icon-size);
  height:var(--game-icon-size);
  border-radius:var(--game-icon-radius);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:var(--game-icon-font-size);
  line-height:1;
  background:rgba(255,246,229,.72);
  border:1px solid rgba(190,139,92,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.84), 0 4px 10px rgba(112,78,45,.08);
  filter:drop-shadow(0 2px 3px rgba(112,78,45,.10));
}
.game-btn:hover .game-icon{
  transform:rotate(-4deg) scale(1.05);
}
.game-name{
  position:relative;
  z-index:2;
  color:#744a2a;
  font-size:clamp(14px, var(--game-name-size), 28px);
  font-weight:900;
  line-height:1.12;
  margin:0;
  white-space:normal;
  overflow:hidden;
  text-overflow:ellipsis;
  overflow-wrap:anywhere;
  letter-spacing:.01em;
  padding:.02em 0 .08em;
}
.game-status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  align-self:flex-start;
  min-height:17px;
  margin-top:2px;
  padding:0 7px;
  border-radius:999px;
  color:#8a6547;
  background:rgba(255,255,255,.50);
  border:1px solid rgba(180,135,92,.14);
  font-size:clamp(8px, var(--game-status-size), 13px);
  font-weight:900;
}
.game-status.ready{
  color:#75451f;
  background:rgba(248,216,161,.58);
}
.game-list-message{
  grid-column:1 / -1;
  min-height:calc(var(--game-card-height) * 2 + var(--game-menu-gap));
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  border-radius:var(--game-card-radius);
  color:#7a5030;
  font-size:14px;
  font-weight:850;
  line-height:1.6;
  text-align:center;
  background:rgba(255,252,248,0.70);
  border:1px solid rgba(255,255,255,0.72);
}
.gacha-standalone-btn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:absolute;
  left:var(--gacha-entry-left);
  top:var(--gacha-entry-top);
  width:var(--gacha-entry-width);
  min-height:calc(var(--gacha-entry-image-size) + 48px);
  padding:10px 12px 12px;
  transform:translate(-50%,-50%) scale(calc(var(--bg-ui-scale) * var(--game-panel-scale) * var(--gacha-entry-scale)));
  transform-origin:center center;
  z-index:32;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:#744a2a;
  font-family:inherit;
  overflow:visible;
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.72), transparent 42%),
    rgba(255,250,244,.56);
  border:1px solid rgba(170,132,101,.20);
  border-radius:22px;
  box-shadow:
    0 12px 24px rgba(112,78,45,.12),
    inset 0 1px 0 rgba(255,255,255,.76);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:
    transform .22s ease,
    background .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;
}
.gacha-standalone-btn:hover{
  transform:translate(-50%,-54%) scale(calc(var(--bg-ui-scale) * var(--game-panel-scale) * var(--gacha-entry-scale) * 1.04));
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.84), transparent 42%),
    rgba(255,250,244,.78);
  border-color:rgba(170,132,101,.30);
  box-shadow:
    0 16px 30px rgba(112,78,45,.18),
    inset 0 1px 0 rgba(255,255,255,.88);
}
.gacha-standalone-img{
  width:var(--gacha-entry-image-size);
  height:var(--gacha-entry-image-size);
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 8px 12px rgba(119,77,43,.20));
  transition:filter .22s ease, transform .22s ease;
}
.gacha-standalone-btn:hover .gacha-standalone-img{
  transform:rotate(-3deg) scale(1.05);
  filter:drop-shadow(0 11px 15px rgba(119,77,43,.28));
}
.gacha-standalone-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:28px;
  padding:0 13px;
  border-radius:999px;
  color:#744a2a;
  font-size:18px;
  font-weight:950;
  letter-spacing:.08em;
  background:rgba(255,250,244,.72);
  border:1px solid rgba(170,132,101,.16);
  box-shadow:0 4px 10px rgba(112,78,45,.08), inset 0 1px 0 rgba(255,255,255,.78);
  white-space:nowrap;
}
.gacha-standalone-wrap{
  position:absolute;
  left:var(--gacha-entry-left);
  top:var(--gacha-entry-top);
  width:var(--gacha-entry-width);
  transform:translate(-50%,-50%) scale(calc(var(--bg-ui-scale) * var(--game-panel-scale) * var(--gacha-entry-scale)));
  transform-origin:center center;
  z-index:32;
  overflow:visible;
}
.gacha-standalone-wrap .gacha-standalone-btn{
  position:relative;
  left:auto;
  top:auto;
  width:100%;
  transform:none;
  z-index:1;
}
.gacha-standalone-wrap .gacha-standalone-btn:hover{
  transform:translateY(-6px) scale(1.04);
}
#overlay .roomIdentity{
  pointer-events:none!important;
}
#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{
  pointer-events:auto!important;
}
.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}
.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}
.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}
.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}
.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}
.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}
.identityNamePart{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  line-height:1;
  white-space:nowrap;
  font:inherit;
}
.identityNickname{transform:translateY(var(--identity-name-y));}
.identitySeparator{
  margin:0 .08em;
  color:rgba(111,87,70,.78);
  font-weight:800;
  transform:translateY(var(--identity-separator-y));
}
.identityRole{transform:translateY(var(--identity-role-y));}
.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}
.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}
.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}
.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}
.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}
.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}
.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}
.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}
.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}
.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:950;
  text-align:left;
}
.identityNoticePanel.show{display:block;}
.identityNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
  margin-bottom:calc(10px * var(--s));
}
.identityNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}
.identityNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--s));
}
.identityNoticeItem{
  padding:calc(10px * var(--s));
  border-radius:calc(12px * var(--s));
  background:rgba(255,252,247,0.82);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.92),
    0 2px 8px rgba(120,92,63,0.05);
}

  const key = String(pageKey || "").trim();

}
function resolveRoom10Asset(assetKey, fallback = ""){

    const configured = window.room10Asset(key);

}
function cssUrl(value){
  const safe = String(value || "").replace(/\\/g, "/").replace(/"/g, '\\"');
  return `url("${safe}")`;
}
function applyConfiguredAssets(){
  const roomBg = resolveRoom10Asset("game.roomGame");
  root.style.setProperty("--game-room-bg-url", cssUrl(roomBg));
  document.querySelectorAll("[data-room10-asset]").forEach(el => {
    const assetKey = el.getAttribute("data-room10-asset") || "";
    const fallback = el.getAttribute("src") || "";
    const value = resolveRoom10Asset(assetKey, fallback);
    if(value && el.getAttribute("src") !== value){
      el.setAttribute("src", value);
    }
  });
}
/* =========================================================
   统一奖励 / 成就称号弹窗接口
   可供 iframe 小游戏或本页数据库返回 awards 后调用
========================================================= */
const rewardTypeMeta = {
  achievement:{label:"成就达成", icon:"🏆"},
  title:{label:"获得称号", icon:"🎖️"},
  daily:{label:"日常奖励", icon:"☀️"},
  gift:{label:"礼包领取", icon:"🎁"},
  item:{label:"道具获得", icon:"🧺"},
  gold:{label:"金币奖励", icon:"🪙"}
};
const rewardIconMap = {
  金币:"🪙",
  种子:"🌱",
  宠物粮:"🥣",
  医疗卡:"💊",
  亲密度:"💗",
  道具:"🧺",
  成就:"🏆",
  称号:"🎖️"
};
let pendingAwardModals = [];
function normalizeRewardItem(item){
  if(typeof item === "string"){
    return {name:item, amount:"", unit:"", icon:rewardIconMap[item] || "✨"};
  }
  return {
    name:item?.name || "奖励",
    amount:item?.amount ?? "",
    unit:item?.unit || "",
    icon:item?.icon || rewardIconMap[item?.name] || "✨",
    prefix:item?.prefix || ""
  };
}
function formatRewardAmount(item){
  if(item.amount === "" || item.amount === null || item.amount === undefined) return "";
  if(typeof item.amount === "number"){
    const sign = item.amount > 0 ? "+" : "";
    return `${sign}${item.amount}${item.unit || ""}`;
  }
  return `${item.prefix || ""}${item.amount}${item.unit || ""}`;
}
function renderRewards(rewards){
  const list = document.getElementById("rewardList");
  const sectionTitle = document.getElementById("rewardSectionTitle");
  if(!list || !sectionTitle) return;
  list.innerHTML = "";
  list.className = "reward-list";
  sectionTitle.className = "reward-section-title";
  if(!rewards.length){
    list.classList.add("empty");
    sectionTitle.classList.add("empty");
    return;
  }
  list.classList.add(`count-${Math.min(rewards.length, 3)}`);
  rewards.forEach(reward => {
    const item = document.createElement("div");
    item.className = "reward-item";
    item.innerHTML = `
      <div class="reward-item-icon">${escapeHtml(reward.icon)}</div>
      <div class="reward-item-name">${escapeHtml(reward.name)}</div>
      <div class="reward-item-amount">${escapeHtml(formatRewardAmount(reward))}</div>
    `;
    list.appendChild(item);
  });
}
function showRewardModal(options = {}){
  const mask = document.getElementById("rewardMask");
  if(!mask) return;
  const type = options.type || options.award_type || "achievement";
  const meta = rewardTypeMeta[type] || rewardTypeMeta.achievement;
  const rewards = Array.isArray(options.rewards || options.reward_items)
    ? (options.rewards || options.reward_items).map(normalizeRewardItem)
    : [];
  mask.dataset.type = type;
  document.getElementById("rewardIcon").textContent = options.icon || meta.icon;
  document.getElementById("rewardLabel").textContent = options.label || meta.label;
  document.getElementById("rewardTitle").textContent = options.title || options.award_name || options.name || "奖励已领取";
  document.getElementById("rewardDesc").textContent = options.desc || options.award_desc || options.description || "奖励已经记录完成。";
  renderRewards(rewards);
  mask.classList.add("show");
  mask.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}
function closeRewardModal(){
  const mask = document.getElementById("rewardMask");
  if(!mask) return;
  mask.classList.remove("show");
  mask.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  playNextAwardModal();
}
function playAwardModals(awards = []){
  pendingAwardModals = Array.isArray(awards) ? awards.slice() : [];
  playNextAwardModal();
}
function playNextAwardModal(){
  if(!pendingAwardModals.length) return;
  showRewardModal(pendingAwardModals.shift());
}
function handleGameAwardMessage(event){
  const data = event?.data || {};
  if(!data || typeof data !== "object") return;
  if(data.type === "room10:award"){
    showRewardModal(data.payload || {});
  }
  if(data.type === "room10:awards"){
    playAwardModals(data.payload || data.awards || []);
  }
}
window.addEventListener("message", handleGameAwardMessage);
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function showGameListMessage(message){
  if(!gameList) return;
  gameList.innerHTML = `<div class="game-list-message">${escapeHtml(message)}</div>`;
}
function normalizeGameEntry(row){
  return {
    gameKey:String(row?.game_key || "").trim(),
    displayName:String(row?.display_name || "").trim(),
    iconText:String(row?.icon_text || "").trim() || "🎮",
    pageKey:String(row?.page_key || "").trim(),
    fallbackUrl:String(row?.fallback_url || "").trim(),
    entryType:String(row?.entry_type || "panel").trim() || "panel",
    imageAssetKey:String(row?.image_asset_key || "").trim(),
    imageUrl:String(row?.image_url || "").trim(),
    isEnabled:row?.is_enabled !== false,
    memberOnly:row?.member_only === true,
    disabledMessage:String(row?.disabled_message || "").trim(),
    statusText:String(row?.status_text || "").trim()
  };
}
function validateGameEntry(entry){
  if(!entry.gameKey || !entry.displayName) return false;
  if(entry.isEnabled && !entry.pageKey && !entry.fallbackUrl) return false;
  return true;
}
function isGuestOpenGameEntry(entry){
  return entry?.gameKey === "2048"
    || entry?.gameKey === "gomoku"
    || entry?.pageKey === "gomoku"
    || entry?.displayName === "五子棋";
}
function renderGameButton(entry){
  const statusClass = entry.isEnabled ? "ready" : "";
  const statusText = isGuestOpenGameEntry(entry) && entry.memberOnly ? "开放游玩" : entry.statusText;
  return `
    <button class="game-btn${entry.isEnabled ? "" : " is-coming-soon"}" type="button" data-game-key="${escapeHtml(entry.gameKey)}">
      <span class="game-icon" aria-hidden="true">${escapeHtml(entry.iconText)}</span>
      <div>
        <div class="game-name">${escapeHtml(entry.displayName)}</div>
        ${statusText ? `<div class="game-status ${statusClass}">${escapeHtml(statusText)}</div>` : ""}
      </div>
    </button>
  `;
}
function renderStandaloneGame(entry){
  if(!gachaEntryWrap) return;
  const imageSrc = entry.imageAssetKey ? resolveRoom10Asset(entry.imageAssetKey, entry.imageUrl) : entry.imageUrl;
  gachaEntryWrap.classList.remove("hidden");
  gachaEntryWrap.innerHTML = `
    <button class="gacha-standalone-btn" type="button" data-game-key="${escapeHtml(entry.gameKey)}" aria-label="${escapeHtml(entry.displayName)}">
      ${imageSrc ? `<img class="gacha-standalone-img" src="${escapeHtml(imageSrc)}" alt="" aria-hidden="true">` : `<span class="game-icon" aria-hidden="true">${escapeHtml(entry.iconText)}</span>`}
      <span class="gacha-standalone-label">${escapeHtml(entry.displayName)}</span>
    </button>
  `;
}
let gameEntryMap = new Map();
async function loadGameEntries(){
  showGameListMessage("正在读取游戏列表...");
  if(gachaEntryWrap){
    gachaEntryWrap.classList.add("hidden");
    gachaEntryWrap.innerHTML = "";
  }
  const { data, error } = await client
    .from("game_room_entries")
    .select("game_key,display_name,icon_text,page_key,fallback_url,entry_type,image_asset_key,image_url,is_active,is_enabled,member_only,disabled_message,status_text,sort_order")
    .eq("is_active", true)
    .order("sort_order", { ascending:true })
    .order("created_at", { ascending:true });
  if(error){
    console.error("loadGameEntries() 读取失败：", error);
    showGameListMessage(`游戏列表读取失败：${error.message || "请检查 game_room_entries 表"}`);
    return;
  }
  const entries = (Array.isArray(data) ? data : []).map(normalizeGameEntry).filter(validateGameEntry);
  if(!entries.length){
    showGameListMessage("游戏列表配置缺失，请先在 game_room_entries 表中添加游戏。 ");
    return;
  }
  gameEntryMap = new Map(entries.map(entry => [entry.gameKey, entry]));
  const panelEntries = entries.filter(entry => entry.entryType !== "standalone" && entry.entryType !== "standalone_gacha");
  const standaloneEntries = entries.filter(entry => entry.entryType === "standalone" || entry.entryType === "standalone_gacha");
  if(panelEntries.length){
    gameList.innerHTML = panelEntries.map(renderGameButton).join("");
  }else{
    showGameListMessage("游戏列表配置缺失：没有可显示在主面板的游戏。 ");
  }
  standaloneEntries.slice(0, 1).forEach(renderStandaloneGame);
}
function isRoom10GameMember(){
  if(!isLoggedIn()) return false;
  const role = String(getRole() || "").trim().toLowerCase();
  return ["owner", "admin", "manager", "member", "trainee"].includes(role);
}
function openDbGame(gameKey){
  const key = String(gameKey || "").trim();
  const entry = gameEntryMap.get(key);
  if(!entry){
    showTip("游戏配置缺失，请刷新后重试。");
    return;
  }
  if(!entry.isEnabled){
    showTip(entry.disabledMessage || `《${entry.displayName}》当前不可用。`);
    return;
  }
  const isPublicGuestGame = isGuestOpenGameEntry(entry);

    showTip(`《${entry.displayName}》仅限十号房成员进入。`);
    return;

  if(!targetUrl){
    showTip(`《${entry.displayName}》页面路径配置缺失。`);
    return;
  }
  openGameModal(targetUrl, entry.displayName);
}

function isTinyScreen(){
  return window.innerWidth <= 540;
}
function clearDesktopOverlayStyles(){
  if(overlay){
    overlay.style.left = "";
    overlay.style.top = "";
    overlay.style.width = "";
    overlay.style.height = "";
  }
  if(roomNav){
    roomNav.style.transform = "";
  }
  root.style.setProperty("--bg-ui-scale", "1");
}
function syncOverlayToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }
  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;
  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;
  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;
  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }
  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;
  /*
    大屏缩放规则：
    1440px = 1 倍；2400px 继续放大；3840px 继续放大；
    约 4608px 后限制在 3.2 倍，适配 8K 时不让组件无限巨大。
    关键：用背景图实际显示宽度 displayWidth 计算，保证文字、按钮、面板和背景图一起等比例变化。
  */
  const scale = Math.max(0.34, Math.min(3.2, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));
  /*
    游戏房主内容框使用页面变量 --game-panel-scale 手动控制。
    不在这里自动覆盖，否则页面确认尺寸会失效。
  */
}
function isLoggedIn(){

}

}
function getCurrentUser(){

}
function getCurrentMemberId(){

}
function getCurrentMemberCode(){

}
function getRoleLabel(roleValue = getRole()){
  const role = String(roleValue || "").toLowerCase();
  if(role === "owner") return "维修工";
  if(role === "admin") return "宿管";
  if(role === "member") return "房客";
  if(role === "trainee") return "练习生";
  if(role === "applying") return "申请人";
  if(isLoggedIn()) return "房客";
  return "参观者";
}

  localStorage.removeItem("room10Role");
  localStorage.removeItem("room10MemberId");
  localStorage.removeItem("room10MemberCode");
  localStorage.removeItem("room10ApplicantSession");
  localStorage.removeItem("room10ApplicationDraft");
  localStorage.removeItem("room10_user");

function normalizeLoginInput(value){
  return String(value || "")
    .replace(/\u3000/g, " ")
    .trim();
}
function getPendingRedirect(){
  return sessionStorage.getItem(PENDING_REDIRECT_KEY) || "";
}
function setPendingRedirect(page){
  const safePage = String(page || "").trim();
  if(!safePage) return;
  sessionStorage.setItem(PENDING_REDIRECT_KEY, safePage);
}
function clearPendingRedirect(){

function getManagerPageByRole(roleValue = getRole()){
  const role = String(roleValue || "").toLowerCase();
  if(role === "owner") return resolveRoom10Page("managerOwner");
  if(role === "admin") return resolveRoom10Page("managerAdmin");
  if(role === "member" || role === "trainee" || role === "applying") return resolveRoom10Page("managerMember");
  return resolveRoom10Page("managerVisitor");
}

function enterRoom(page, needLogin, room = ""){
  const targetPage = String(page || "").trim();
  const targetRoom = String(room || "").trim();
  if(!targetPage) return;
  if(needLogin && !isLoggedIn()){
    openLogin(targetPage);
    return;
  }
  if(targetRoom === "dorm" && getRole() === "applying"){
    clearPendingRedirect();
    window.location.href = getManagerPageByRole();
    return;
  }
  if((targetRoom === "flower" || targetRoom === "pets" || targetRoom === "pet") && !isLoggedIn()){
    clearPendingRedirect();
    window.location.href = `${targetPage}?mode=guest`;
    return;
  }
  clearPendingRedirect();
  window.location.href = targetPage;
}
function setupRoomNav(currentRoom = "game"){
  document.querySelectorAll(".roomNavLayer .navBtn").forEach(btn => {
    const room = btn.dataset.room || "";
    const isCurrent = room === currentRoom;
    btn.classList.toggle("is-current", isCurrent);
    if(isCurrent){
      btn.setAttribute("aria-current", "page");
      btn.setAttribute("tabindex", "-1");
    }else{
      btn.removeAttribute("aria-current");
      btn.removeAttribute("tabindex");
    }
    if(btn.dataset.boundRoomNav === "true") return;
    btn.dataset.boundRoomNav = "true";
    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      if(btn.classList.contains("is-current")) return;
      if(btn.dataset.manager === "true"){
        enterManagerRoom();
        return;
      }
      const targetPage = resolveRoom10Page(btn.dataset.page);
      enterRoom(targetPage, btn.dataset.login === "true", btn.dataset.room);
    });
  });
}
function openLogin(targetPage = ""){
  if(isLoggedIn()){
    if(targetPage){
      window.location.href = targetPage;
    }
    return;
  }
  if(targetPage){
    setPendingRedirect(targetPage);
  }
  loginMask.classList.remove("hidden");
  loginMask.setAttribute("aria-hidden", "false");
  loginHint.textContent = "";
  loginHint.style.color = "#8b4a2d";
  setTimeout(() => loginNicknameInput.focus(), 0);
}
function closeLogin(keepRedirect = true){
  loginMask.classList.add("hidden");
  loginMask.setAttribute("aria-hidden", "true");
  loginHint.textContent = "";
  loginNicknameInput.value = "";
  loginCodeInput.value = "";
  if(!keepRedirect){
    clearPendingRedirect();
  }
}
async function submitLogin(){
  const nickname = normalizeLoginInput(loginNicknameInput.value);
  const code = normalizeLoginInput(loginCodeInput.value);
  loginHint.textContent = "";
  loginHint.style.color = "#8b4a2d";
  if(!nickname || !code){
    loginHint.textContent = "还没填写完整呢";
    return;
  }
  try{
    const { data, error } = await client.rpc("verify_member_login", {
      input_nickname: nickname,
      input_code: code
    });
    if(error){
      console.error("KEY 登录失败：", error);
      loginHint.textContent = `登录检查失败：${error.message || "请稍后再试"}`;
      return;
    }
    if(!Array.isArray(data) || data.length === 0){
      loginHint.textContent = "没有找到你的记录哎";
      return;
    }
    const user = data[0] || {};
    localStorage.setItem("room10LoggedIn", "true");
    localStorage.setItem("room10User", user.nickname || nickname);
    localStorage.setItem("room10Role", user.role || "member");
    localStorage.setItem("room10MemberId", user.member_id || user.id || "");
    localStorage.setItem("room10MemberCode", code);
    let roleMessage = "登录成功";
    if(user.role === "owner"){
      roleMessage = "维修工已上线";
    }else if(user.role === "admin"){
      roleMessage = "宿管已上线";
    }else if(user.role === "member"){
      roleMessage = "房客已登录";
    }else if(user.role === "trainee"){
      roleMessage = "练习生已登录";
    }else if(user.role === "applying"){
      roleMessage = "当前身份为申请中";
    }
    loginHint.style.color = "#5f7d3a";
    loginHint.textContent = roleMessage;
    updateIdentityUI();
    refreshGameNotice();
    setTimeout(() => {
      const targetPage = getPendingRedirect();
      closeLogin(true);
      if(targetPage){
        clearPendingRedirect();
        window.location.href = targetPage;
      }
    }, 700);
  }catch(err){
    console.error("submitLogin() 查询异常：", err);
    loginHint.style.color = "#8b4a2d";
    loginHint.textContent = `登录失败：${err?.message || "请稍后再试"}`;
  }
}

let latestGameNoticeIds = [];
function getNoticeEmptyText(){
  if(!isLoggedIn()){
    return "登录后会显示属于你的游戏记录提醒。";
  }
  return "目前没有新的游戏记录提醒。";

function setNoticeCount(count){

  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);

function renderNoticeLoading(){
  siteNoticeContent.innerHTML = '<div class="identityNoticeEmpty">正在读取通知……</div>';
}
function renderNoticeError(message){
  siteNoticeContent.innerHTML = `<div class="identityNoticeEmpty">${escapeHtml(message || "通知读取失败，请稍后再试。")}</div>`;
  setNoticeCount(0);
}
function renderNoticeList(items){
  const list = Array.isArray(items) ? items : [];
  latestGameNoticeIds = list.map(item => item.id).filter(Boolean);
  if(!list.length){
    siteNoticeContent.innerHTML = `<div class="identityNoticeEmpty">${escapeHtml(getNoticeEmptyText())}</div>`;
    setNoticeCount(0);
    return;
  }
  siteNoticeContent.innerHTML = `
    <div class="identityNoticeList">
      ${list.map(item => {
        const itemTitle = String(item.title || "游戏记录提醒").trim();
        return `
          <div class="identityNoticeItem">
            <div class="identityNoticeItemTitle">${escapeHtml(itemTitle)}</div>
          </div>
        `;
      }).join("")}
    </div>
    <button class="identityNoticeReadBtn" type="button" onclick="markAllGameNoticesRead()">全部已读</button>
  `;
  setNoticeCount(list.length);
}
async function fetchGameNoticeItems(){
  const memberId = getCurrentMemberId().trim();
  const memberCode = getCurrentMemberCode().trim();
  if(!isLoggedIn() || !memberId || !memberCode){
    return [];
  }
  const { data, error } = await client.rpc("get_member_notifications", {
    p_member_id: memberId,
    p_member_code: memberCode,
    p_channel: "game",
    p_limit: 20
  });
  if(error){
    console.error("读取游戏通知失败：", error);
    throw error;
  }
  return (Array.isArray(data) ? data : []).map(item => ({
    id:item.notice_id || item.id,
    title:item.title || "游戏记录提醒",
    message:item.message || item.desc || "",
    createdAt:item.created_at || ""
  }));
}
async function refreshGameNotice(){
  if(!siteNoticeContent || !siteNoticeBtn) return;
  try{
    renderNoticeLoading();
    const items = await fetchGameNoticeItems();
    renderNoticeList(items);
  }catch(err){
    renderNoticeError(err?.message || "通知读取失败，请稍后再试。");
  }
}
async function markAllGameNoticesRead(){
  const memberId = getCurrentMemberId().trim();
  const memberCode = getCurrentMemberCode().trim();
  if(!isLoggedIn() || !memberId || !memberCode || !latestGameNoticeIds.length){
    renderNoticeList([]);
    return;
  }
  try{
    const { error } = await client.rpc("mark_member_notifications_read", {
      p_member_id: memberId,
      p_member_code: memberCode,
      p_notice_ids: latestGameNoticeIds
    });
    if(error){
      console.error("标记游戏通知已读失败：", error);
      renderNoticeError(error.message || "标记已读失败，请稍后再试。");
      return;
    }
    latestGameNoticeIds = [];
    renderNoticeList([]);
  }catch(err){
    console.error("标记游戏通知已读异常：", err);
    renderNoticeError(err?.message || "标记已读失败，请稍后再试。");
  }
}

function clamp(v,min,max){
  return Math.max(min, Math.min(max, v));
}
function avgColor(data){
  let r = 0, g = 0, b = 0, count = 0;
  for(let i=0;i<data.length;i+=4){
    const alpha = data[i+3];
    if(alpha === 0) continue;
    r += data[i];
    g += data[i+1];
    b += data[i+2];
    count++;
  }
  if(!count) return [245, 233, 220];
  return [
    Math.round(r / count),
    Math.round(g / count),
    Math.round(b / count)
  ];
}
function mix(color, target, ratio){
  return [
    Math.round(color[0] * (1 - ratio) + target[0] * ratio),
    Math.round(color[1] * (1 - ratio) + target[1] * ratio),
    Math.round(color[2] * (1 - ratio) + target[2] * ratio)
  ];
}
function rgbToCss(arr){
  return `rgb(${arr[0]}, ${arr[1]}, ${arr[2]})`;
}
function applyEdgeColors(){
  try{
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently:true });
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    if(!w || !h || !ctx) throw new Error("图片尺寸或画布无效");
    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(img, 0, 0, w, h);
    const bandX = Math.max(8, Math.floor(w * 0.03));
    const bandY = Math.max(8, Math.floor(h * 0.03));
    const leftData = ctx.getImageData(0, 0, bandX, h).data;
    const rightData = ctx.getImageData(w - bandX, 0, bandX, h).data;
    const topData = ctx.getImageData(0, 0, w, bandY).data;
    const bottomData = ctx.getImageData(0, h - bandY, w, bandY).data;
    let left = avgColor(leftData);
    let right = avgColor(rightData);
    let top = avgColor(topData);
    let bottom = avgColor(bottomData);
    left = mix(left, [255,255,255], 0.14);
    right = mix(right, [255,255,255], 0.12);
    top = mix(top, [255,255,255], 0.16);
    bottom = mix(bottom, [255,255,255], 0.10);
    left = left.map(v => clamp(v, 120, 255));
    right = right.map(v => clamp(v, 120, 255));
    top = top.map(v => clamp(v, 130, 255));
    bottom = bottom.map(v => clamp(v, 110, 255));
    root.style.setProperty("--bg-left", rgbToCss(left));
    root.style.setProperty("--bg-right", rgbToCss(right));
    root.style.setProperty("--bg-top", rgbToCss(top));
    root.style.setProperty("--bg-bottom", rgbToCss(bottom));
  }catch(err){
    showTip("未能读取图片边缘颜色，已使用默认柔和背景。");
    console.warn("读取底图边缘颜色失败：", err);
  }
}
