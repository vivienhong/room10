<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十号房｜宿管室</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --bg-left:#fff3e7;
  --bg-right:#f4dfc8;
  --bg-top:#fff7ef;
  --bg-bottom:#edd8c1;
  --bg-ui-scale:1;
  --text:#5b4632;
  --title:#6a5038;
  --line:#d8c2a3;
  --line2:#e3d0b4;
  --panel:rgba(255,249,240,.92);
  --btn:#c98e56;
  --btn-hover:#b97d45;
  --sub:#e7d3b7;
  --sub-hover:#dcc29e;
  --shadow:0 10px 24px rgba(0,0,0,.08);
  --radius:16px;
  --green:#5f7d3a;
  --red:#a14f3f;
  --muted:#8e7c68;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  position:relative;
  font-family:Arial, Helvetica, sans-serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at center, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
  color:var(--text);
}

#bgColorFill{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    linear-gradient(180deg, var(--bg-top) 0%, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, var(--bg-bottom) 100%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
}

#bgBleed{
  position:fixed;
  inset:-8vh -8vw;
  z-index:1;
  background:url("room-manager.png") center center / cover no-repeat;
  filter:blur(30px) saturate(1.05);
  transform:scale(1.08);
  opacity:.72;
  pointer-events:none;
}

#bgLight{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0) 58%),
    linear-gradient(180deg, rgba(255,248,240,0.08), rgba(255,248,240,0.08));
}

#managerPage{
  position:relative;
  z-index:3;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:transparent;
}

#managerStage{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#managerBg{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

#managerUI{
  position:absolute;
  z-index:1;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#managerUI *{pointer-events:auto;}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(3px);
}

.hidden{display:none !important;}

#topActions{
  position:absolute;
  z-index:10;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  background:rgba(255,248,239,0.92);
  border:1px solid rgba(186,146,103,0.24);
  box-shadow:
    0 10px 24px rgba(116,86,54,0.12),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#logoutBtn{
  background:rgba(255,252,247,0.96);
  color:#6c4523;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:1;
}

#logoutBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  color:#67401f;
  font-weight:800;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
}

#logoutBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#topBar{
  position:absolute;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:9;
  overflow:visible;
}

#topBar,
#navOuter,
#navScroll{overflow:visible !important;}

#navOuter{
  flex:0 0 auto;
  min-width:0;
  width:100%;
}

#navScroll{
  width:100%;
  white-space:nowrap;
  scrollbar-width:none;
  -ms-overflow-style:none;
  padding:0 !important;
  margin:0 !important;
}

#navScroll::-webkit-scrollbar{display:none;}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap, 8px);
  transform-origin:left center;
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height, 40px);
  padding:0 var(--nav-btn-px, 16px);
  border-radius:var(--nav-btn-radius, 13px);
  color:#6e4827;
  font-size:var(--nav-btn-font, 14px);
  font-weight:900;
  line-height:1;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid rgba(145,98,56,.34);
  box-shadow:0 1px 1px rgba(255,255,255,.48) inset, 0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:0 1px 1px rgba(255,255,255,.55) inset, 0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{position:relative; z-index:5;}

.navActiveNote{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block !important;
  font-weight:900;
  line-height:1;
  text-shadow:0 1px 2px rgba(255,250,232,.72);
}

.navActiveNoteA{left:8%; top:-52%; color:rgba(167,104,54,.72); font-size:calc(var(--nav-btn-font, 14px) * .88);}
.navActiveNoteB{right:8%; top:-60%; color:rgba(122,91,143,.58); font-size:calc(var(--nav-btn-font, 14px) * .80);}
.navActiveNoteC{left:50%; top:-68%; transform:translateX(-50%); color:rgba(198,124,112,.78); font-size:calc(var(--nav-btn-font, 14px) * .96);}

@keyframes navNotePopA{0%,100%{transform:translateY(3px) rotate(-8deg) scale(.82);opacity:0;}22%,68%{opacity:.88;}48%{transform:translateY(-3px) rotate(5deg) scale(1);opacity:.72;}}
@keyframes navNotePopB{0%,100%{transform:translateY(4px) rotate(8deg) scale(.78);opacity:0;}26%,72%{opacity:.78;}50%{transform:translateY(-4px) rotate(-6deg) scale(1);opacity:.64;}}
@keyframes navNotePopC{0%,100%{transform:translateX(-50%) translateY(5px) rotate(0deg) scale(.76);opacity:0;}24%,70%{opacity:.86;}50%{transform:translateX(-50%) translateY(-5px) rotate(2deg) scale(1);opacity:.76;}}

.navBtn:hover .navActiveNoteA,.navBtn:focus-visible .navActiveNoteA{animation:navNotePopA 2.2s ease-in-out infinite;}
.navBtn:hover .navActiveNoteB,.navBtn:focus-visible .navActiveNoteB{animation:navNotePopB 2.5s ease-in-out infinite;}
.navBtn:hover .navActiveNoteC,.navBtn:focus-visible .navActiveNoteC{animation:navNotePopC 2.35s ease-in-out infinite;}

#managerBriefCard{
  position:absolute;
  z-index:4;
  color:#6a4b32;
  background:rgba(255,249,240,.86);
  border:1px solid rgba(216,194,163,.78);
  box-shadow:
    0 10px 24px rgba(116,86,54,.10),
    inset 0 1px 0 rgba(255,255,255,.78);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.brief-title{
  margin:0;
  line-height:1.25;
  font-weight:900;
  color:#6b4524;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.brief-text{
  margin:0;
  line-height:1.55;
  color:#765a40;
}

.brief-list{
  padding:0;
  list-style:none;
  display:flex;
  flex-direction:column;
}

.brief-list li{
  position:relative;
  line-height:1.45;
  color:#84664a;
}

.brief-list li::before{
  content:"•";
  position:absolute;
  left:0;
  top:0;
  color:#c98e56;
  font-weight:900;
}

.brief-sign{
  border-top:1px dashed rgba(180,139,94,.32);
  line-height:1.35;
  color:#9a795b;
  text-align:right;
}

#contentArea{
  position:absolute;
  z-index:2;
  overflow:visible;
}


.card{position:relative;}

.section-title{
  margin:0;
  font-weight:700;
  color:var(--title);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  line-height:1.2;
}

.member-main-card{
  min-height:0;
  display:flex;
  flex-direction:column;
}

.manager-apply-box{
  background:rgba(255,252,246,.92);
  border:1px solid var(--line2);
}

.manager-apply-box p{
  color:#6b5a45;
}

.manager-apply-box p{margin:0;}

.manager-apply-actions{
  display:flex;
  flex-wrap:wrap;
}

.apply-box-title,
.status-title{
  font-weight:900;
  color:#6b4524;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.member-apply-layout{
  display:grid;
}

.application-status-card{
  background:rgba(255,252,246,.78);
  border:1px solid rgba(227,208,180,.82);
}

.status-list{
  display:flex;
  flex-direction:column;
}

.status-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px dashed rgba(180,139,94,.24);
  color:#7b6046;
}

.status-row:last-child{
  border-bottom:none;
}

.status-row b{
  color:#6f4726;
  font-weight:900;
}

.status-note{
  color:#9a795b;
  line-height:1.45;
}

.inline-btn,
.sub-btn{
  border:none;
  cursor:pointer;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-weight:600;
  white-space:nowrap;
  flex:0 0 auto;
}

.inline-btn{
  background:var(--btn);
  color:#fff;
}

.inline-btn:hover{background:var(--btn-hover);}

.sub-btn{
  background:var(--sub);
  color:var(--text);
}

.sub-btn:hover{background:var(--sub-hover);}

.inline-btn:disabled,
.sub-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#managerApplyHint{
  color:#8b5b34;
}

#bgLight{animation:managerLightBreath 7.5s ease-in-out infinite;}
#bgBleed{animation:managerBgDrift 18s ease-in-out infinite alternate;}

@keyframes managerLightBreath{0%,100%{opacity:.62;}50%{opacity:.9;}}
@keyframes managerBgDrift{0%{transform:scale(1.08) translate3d(0,0,0);}100%{transform:scale(1.095) translate3d(-.4%,.35%,0);}}
@keyframes managerKeyShine{0%,58%{opacity:0; transform:translateX(-18%) skewX(-8deg);}68%{opacity:.72;}88%,100%{opacity:0; transform:translateX(28%) skewX(-8deg);}}
@keyframes managerDustFloat{0%{transform:translate3d(0,0,0); background-position:18% 22%, 64% 18%, 42% 68%;}100%{transform:translate3d(0,-10px,0); background-position:20% 18%, 61% 14%, 44% 64%;}}
@keyframes managerPanelIn{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:translateY(0);}}

@media (min-width:541px){
  #managerUI::before{
    content:"";
    position:absolute;
    right:9.6%;
    bottom:18.4%;
    width:19%;
    height:22%;
    border-radius:24px;
    background:linear-gradient(112deg, transparent 0%, transparent 35%, rgba(255,244,204,.06) 44%, rgba(255,238,178,.34) 50%, rgba(255,244,204,.08) 57%, transparent 68%, transparent 100%);
    mix-blend-mode:screen;
    opacity:.56;
    pointer-events:none;
    animation:managerKeyShine 6.8s ease-in-out infinite;
  }

  #managerUI::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.38;
    background-image:
      radial-gradient(circle, rgba(194,139,82,.20) 0 1px, transparent 1.5px),
      radial-gradient(circle, rgba(255,238,190,.18) 0 1px, transparent 1.6px),
      radial-gradient(circle, rgba(170,119,77,.12) 0 .8px, transparent 1.4px);
    background-size:210px 180px, 260px 220px, 320px 260px;
    background-position:18% 22%, 64% 18%, 42% 68%;
    animation:managerDustFloat 15s linear infinite;
  }

  #topActions,
  #topBar,
  #managerBriefCard,
  #contentArea{
    animation:managerPanelIn .55s ease both;
  }

  #topActions{
    right:7.35%;
    top:7.8%;
    width:calc(232px * var(--ui-scale));
    height:calc(38px * var(--ui-scale));
  }

  #topIdentityBar{
    gap:calc(5px * var(--ui-scale));
    padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
    border-radius:calc(13px * var(--ui-scale));
  }

  #topIdentityBadge{
    padding:0 calc(8px * var(--ui-scale));
    font-size:calc(13px * var(--ui-scale));
    border-radius:calc(9px * var(--ui-scale));
  }

  #logoutBtn{
    width:calc(42px * var(--ui-scale));
    min-width:calc(42px * var(--ui-scale));
    flex-basis:calc(42px * var(--ui-scale));
    font-size:calc(12px * var(--ui-scale));
    border-radius:calc(9px * var(--ui-scale));
  }

  #topBar{
    left:27.2%;
    top:8.1%;
    width:45.5%;
    --nav-gap:calc(8px * var(--ui-scale));
    --nav-btn-height:calc(40px * var(--ui-scale));
    --nav-btn-px:calc(16px * var(--ui-scale));
    --nav-btn-radius:calc(13px * var(--ui-scale));
    --nav-btn-font:calc(14px * var(--ui-scale));
  }

  #managerBriefCard{
    left:5.65%;
    top:31.2%;
    width:calc(232px * var(--ui-scale));
    padding:calc(13px * var(--ui-scale)) calc(14px * var(--ui-scale));
    border-radius:calc(16px * var(--ui-scale));
  }

  .brief-title{
    margin-bottom:calc(7px * var(--ui-scale));
    font-size:calc(14px * var(--ui-scale));
  }

  .brief-text{font-size:calc(12px * var(--ui-scale));}

  .brief-list{
    margin:calc(8px * var(--ui-scale)) 0 0;
    gap:calc(5px * var(--ui-scale));
  }

  .brief-list li{
    padding-left:calc(14px * var(--ui-scale));
    font-size:calc(11px * var(--ui-scale));
  }

  .brief-sign{
    margin-top:calc(9px * var(--ui-scale));
    padding-top:calc(7px * var(--ui-scale));
    font-size:calc(10px * var(--ui-scale));
  }

  #contentArea{
    left:25.8%;
    top:24.0%;
    width:48.8%;
    height:auto;
    max-height:none;
    overflow:visible;
    padding-right:0;
  }

  .card{
    padding:calc(20px * var(--ui-scale)) calc(22px * var(--ui-scale));
    margin-bottom:calc(10px * var(--ui-scale));
    border-radius:calc(18px * var(--ui-scale));
  }

  .member-main-card{
    min-height:calc(340px * var(--ui-scale));
    justify-content:flex-start;
  }

  .section-title{
    margin-bottom:calc(14px * var(--ui-scale));
    font-size:calc(20px * var(--ui-scale));
  }

  .member-apply-layout{
    grid-template-columns:minmax(0, 1.08fr) minmax(0, .92fr);
    gap:calc(16px * var(--ui-scale));
    align-items:stretch;
  }

  .manager-apply-box,
  .application-status-card{
    padding:calc(17px * var(--ui-scale));
    border-radius:calc(14px * var(--ui-scale));
  }

  .apply-box-title,
  .status-title{
    margin-bottom:calc(9px * var(--ui-scale));
    font-size:calc(14px * var(--ui-scale));
  }


  .manager-apply-box p{
    font-size:calc(12px * var(--ui-scale));
    line-height:1.45;
  }

  .manager-apply-box p{margin-bottom:calc(12px * var(--ui-scale));}

  .manager-apply-actions{gap:calc(10px * var(--ui-scale));}

  .inline-btn,
  .sub-btn{
    height:calc(40px * var(--ui-scale));
    padding:0 calc(18px * var(--ui-scale));
    min-width:calc(96px * var(--ui-scale));
    border-radius:calc(10px * var(--ui-scale));
    font-size:calc(13px * var(--ui-scale));
  }

  .sub-btn{padding:0 calc(14px * var(--ui-scale));}

  #managerApplyHint{
    min-height:calc(20px * var(--ui-scale));
    margin-top:calc(10px * var(--ui-scale));
    font-size:calc(11px * var(--ui-scale));
    line-height:1.35;
  }

  .status-list{
    gap:calc(7px * var(--ui-scale));
  }

  .status-row{
    min-height:calc(28px * var(--ui-scale));
    font-size:calc(11px * var(--ui-scale));
  }

  .status-note{
    margin-top:calc(10px * var(--ui-scale));
    padding-top:calc(8px * var(--ui-scale));
    border-top:1px dashed rgba(180,139,94,.24);
    font-size:calc(10px * var(--ui-scale));
  }
}

@media (prefers-reduced-motion: reduce){
  #bgLight,
  #bgBleed,
  #managerUI::before,
  #managerUI::after,
  #topActions,
  #topBar,
  #managerBriefCard,
  #contentArea{
    animation:none !important;
  }
}

@media (max-width:540px){
  html,body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  body{
    overflow-x:hidden;
    overflow-y:auto;
    display:block;
    background:#f3ecdf;
  }

  #bgColorFill,
  #bgBleed,
  #bgLight{display:none;}

  #managerPage{
    width:100%;
    max-width:100%;
    height:auto;
    min-height:100vh;
    min-height:100dvh;
    display:block;
    overflow:visible;
  }

  #managerStage{
    width:100%;
    max-width:100%;
    margin:0;
    aspect-ratio:auto;
    min-height:100vh;
    min-height:100dvh;
    padding:10px 12px 14px;
    position:relative;
    overflow-x:hidden;
  }

  #managerStage::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      linear-gradient(rgba(243,236,223,.78), rgba(243,236,223,.92)),
      url("room-manager.png") center center / cover no-repeat;
    z-index:-2;
  }

  #managerStage::after{
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom, rgba(255,255,255,.18), rgba(255,255,255,0));
    z-index:-1;
    pointer-events:none;
  }

  #managerBg{display:none;}

  #managerUI{
    position:relative;
    inset:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    max-width:100%;
  }

  #topActions{
    position:sticky;
    top:10px;
    right:auto;
    left:auto;
    width:100%;
    height:40px;
    z-index:10;
    order:0;
  }

  #topIdentityBar{
    gap:6px;
    padding:5px 7px;
    border-radius:14px;
  }

  #topIdentityBadge{
    padding:0 9px;
    font-size:12px;
    border-radius:10px;
  }

  #logoutBtn{
    width:42px;
    min-width:42px;
    flex-basis:42px;
    font-size:11px;
    border-radius:10px;
  }

  #topBar,
  #managerBriefCard,
  #contentArea{
    position:relative;
    left:auto;
    right:auto;
    top:auto;
    bottom:auto;
    width:100%;
    max-width:100%;
    max-height:none;
    overflow:visible;
    margin:0;
    padding-right:0;
    transform:none;
  }

  #topBar{
    order:1;
    padding:10px;
    display:block;
  }

  #navOuter,
  #navScroll{width:100%;}

  #roomNav{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:7px;
    transform:none !important;
  }

  .navBtn{
    width:100%;
    min-height:34px;
    height:auto;

  }
}

</style>

<body>
<div id="bgColorFill"></div>
<div id="bgBleed"></div>
<div id="bgLight"></div>

<div id="managerPage">
  <div id="managerStage">
    <img id="managerBg" src="room-manager.png" alt="宿管室背景">

    <div id="managerUI">

      <div id="topActions">

          <div id="topIdentityBadge"><span class="identityText">未登录 | 参观者</span></div>
          <button id="logoutBtn" class="hidden" type="button" onclick="logout()">登出</button>
        </div>
      </div>

      <div id="topBar" aria-label="房间切换">
        <div id="navOuter">
          <div id="navScroll">
            <nav id="roomNav">
              <button class="navBtn" type="button" onclick="location.href='index.html'"><span class="navLabel">大堂</span><span class="navActiveNote navActiveNoteA">♪</span><span class="navActiveNote navActiveNoteB">♬</span><span class="navActiveNote navActiveNoteC">♫</span></button>
              <button class="navBtn" type="button" onclick="location.href='honor.html'"><span class="navLabel">荣誉墙</span><span class="navActiveNote navActiveNoteA">♪</span><span class="navActiveNote navActiveNoteB">♬</span><span class="navActiveNote navActiveNoteC">♫</span></button>
              <button class="navBtn" type="button" onclick="location.href='game.html'"><span class="navLabel">游戏房</span><span class="navActiveNote navActiveNoteA">♪</span><span class="navActiveNote navActiveNoteB">♬</span><span class="navActiveNote navActiveNoteC">♫</span></button>
              <button class="navBtn" type="button" onclick="goNeedLogin('studio-todo.html')"><span class="navLabel">工作间</span><span class="navActiveNote navActiveNoteA">♪</span><span class="navActiveNote navActiveNoteB">♬</span><span class="navActiveNote navActiveNoteC">♫</span></button>
              <button class="navBtn" type="button" onclick="goNeedLogin('living.html')"><span class="navLabel">客厅</span><span class="navActiveNote navActiveNoteA">♪</span><span class="navActiveNote navActiveNoteB">♬</span><span class="navActiveNote navActiveNoteC">♫</span></button>
              <button class="navBtn" type="button" onclick="goNeedLogin('dorm.html')"><span class="navLabel">宿舍</span><span class="navActiveNote navActiveNoteA">♪</span><span class="navActiveNote navActiveNoteB">♬</span><span class="navActiveNote navActiveNoteC">♫</span></button>
              <button class="navBtn" type="button" onclick="goNeedLogin('pets.html')"><span class="navLabel">宠物区</span><span class="navActiveNote navActiveNoteA">♪</span><span class="navActiveNote navActiveNoteB">♬</span><span class="navActiveNote navActiveNoteC">♫</span></button>
              <button class="navBtn" type="button" onclick="goNeedLogin('flower.html')"><span class="navLabel">花房区</span><span class="navActiveNote navActiveNoteA">♪</span><span class="navActiveNote navActiveNoteB">♬</span><span class="navActiveNote navActiveNoteC">♫</span></button>
            </nav>
          </div>
        </div>
      </div>

      <aside id="managerBriefCard" class="panel" aria-label="房客宿管申请说明">
        <h3 class="brief-title">宿管申请说明</h3>
        <p class="brief-text">这里是房客提交宿管申请的页面。申请通过后，你可以协助处理入住、钥匙和宿管室相关事务。</p>
        <ul class="brief-list">
          <li>只有房客身份可以提交申请。</li>
          <li>提交后会进入管理员投票流程。</li>
          <li>结果未出前，可以取消自己的申请。</li>
        </ul>
        <div class="brief-sign">房客查看｜申请前请确认</div>
      </aside>

      <main id="contentArea">
        <section class="card panel member-main-card" id="memberMainCard">
          <h2 class="section-title">宿管申请</h2>

          <div class="member-apply-layout">
            <div class="manager-apply-box">
              <div class="apply-box-title">申请操作</div>
              <p>如果你想协助宿管处理日常事务，可以在这里提交申请。</p>

              <div class="manager-apply-actions">
                <button id="managerApplyBtn" class="inline-btn" type="button" onclick="submitManagerApplication()">我想做宿管！</button>
                <button id="managerCancelBtn" class="sub-btn" type="button" onclick="cancelManagerApplication()">取消申请</button>
              </div>

              <div id="managerApplyHint"></div>
            </div>

            <div class="application-status-card">
              <div class="status-title">申请状态</div>
              <div class="status-list">
                <div class="status-row"><span>当前身份</span><b>房客</b></div>
                <div class="status-row"><span>审核方式</span><b>宿管投票</b></div>
                <div class="status-row"><span>状态提示</span><b>自动读取</b></div>
              </div>
              <div class="status-note">提交、取消和审核结果会同步显示在左侧操作提示中。</div>
            </div>
          </div>

        </section>
      </main>

    </div>
  </div>
</div>

<script>
const supabaseUrl = "https://tfevitwoqmxwaguvtyms.supabase.co";
const supabaseKey = "sb_publishable_0cFYhwx_9uEcrXnMJzzNMQ_cEng8xmI";
const client = window.supabase.createClient(supabaseUrl, supabaseKey);

const managerImg = document.getElementById("managerBg");
const managerStage = document.getElementById("managerStage");
const managerUI = document.getElementById("managerUI");
const root = document.documentElement;
const roomNav = document.getElementById("roomNav");
const topBar = document.getElementById("topBar");

const topIdentityBadge = document.getElementById("topIdentityBadge");
const logoutBtn = document.getElementById("logoutBtn");
const managerApplyHint = document.getElementById("managerApplyHint");
const managerApplyBtn = document.getElementById("managerApplyBtn");
const managerCancelBtn = document.getElementById("managerCancelBtn");

function isTinyScreen(){
  return window.innerWidth <= 540;
}

function syncManagerUIToImage(){
  if(isTinyScreen()) return;
  if(!managerImg?.naturalWidth || !managerImg?.naturalHeight || !managerStage || !managerUI) return;

  const frame = managerStage.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = managerImg.naturalWidth / managerImg.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = (frame.width - displayWidth) / 2;
    displayTop = 0;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = 0;
    displayTop = (frame.height - displayHeight) / 2;
  }

  managerUI.style.left = `${displayLeft}px`;
  managerUI.style.top = `${displayTop}px`;
  managerUI.style.width = `${displayWidth}px`;
  managerUI.style.height = `${displayHeight}px`;

  const scale = Math.max(0.34, Math.min(1.42, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));

  requestAnimationFrame(fitRoomNavToBar);
}

function fitRoomNavToBar(){
  if(!roomNav || !topBar || isTinyScreen()) return;

  roomNav.style.transform = "scale(1)";
  const available = topBar.clientWidth;
  const needed = roomNav.scrollWidth;
  const scale = Math.min(1, available / Math.max(needed, 1));

  roomNav.style.transform = `scale(${scale})`;
}


function isLoggedIn(){
  return localStorage.getItem("room10LoggedIn") === "true";
}

function getRole(){
  return localStorage.getItem("room10Role") || "";
}

function getCurrentUser(){
  return localStorage.getItem("room10User") || "";
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getRoleLabel(roleValue = getRole()){
  const role = String(roleValue || "").toLowerCase();
  if(role === "admin") return "宿管";
  if(role === "owner") return "维修工";
  if(isLoggedIn()) return "房客";
  return "参观者";
}

function updateStatusUserUI(){
  if(!topIdentityBadge || !logoutBtn) return;

  if(isLoggedIn()){
    const user = getCurrentUser() || "已登录";
    const roleLabel = getRoleLabel();
    topIdentityBadge.innerHTML = `<span class="identityText">${escapeHtml(user)} | ${escapeHtml(roleLabel)}</span>`;
    logoutBtn.classList.remove("hidden");
  }else{
    topIdentityBadge.innerHTML = `<span class="identityText">未登录 | 参观者</span>`;
    logoutBtn.classList.add("hidden");
  }
}

function goNeedLogin(page){
  if(!isLoggedIn()){
    window.location.href = "manager-visitor.html";
    return;
  }
  window.location.href = page;
}

async function logout(){
  localStorage.removeItem("room10LoggedIn");
  localStorage.removeItem("room10User");
  localStorage.removeItem("room10Role");
  localStorage.removeItem("room10MemberId");
  localStorage.removeItem("room10MemberCode");
  window.location.href = "manager-visitor.html";
}

async function getCurrentMemberRecord(){
  const nickname = getCurrentUser();
  if(!nickname) return null;

  const result = await client
    .from("members")
    .select("id, nickname, role")
    .eq("nickname", nickname)
    .maybeSingle();

  if(result.error){
    console.error("读取当前成员失败：", result.error);
    return null;
  }

  return result.data || null;
}

async function getLatestAdminApplication(memberId){
  if(!memberId) return null;

  const result = await client
    .from("admin_applications")
    .select("id, member_id, nickname, status, created_at, updated_at")
    .eq("member_id", memberId)
    .order("created_at", { ascending: false })
    .limit(1);

  if(result.error){
    console.error("读取最新宿管申请失败：", result.error);
    return null;
  }

  return (result.data || [])[0] || null;
}

async function getPendingAdminApplication(memberId){
  if(!memberId) return null;

  const result = await client
    .from("admin_applications")
    .select("id, member_id, nickname, status, created_at, updated_at")
    .eq("member_id", memberId)
    .eq("status", "pending")
    .order("created_at", { ascending: false })
    .limit(1);

  if(result.error){
    console.error("读取 pending 宿管申请失败：", result.error);
    return null;
  }

  return (result.data || [])[0] || null;
}

function setManagerApplyButtons({
  applyDisabled = false,
  applyText = "我想做宿管！",
  cancelDisabled = true
} = {}){
  managerApplyBtn.disabled = applyDisabled;
  managerApplyBtn.textContent = applyText;
  managerApplyBtn.style.opacity = applyDisabled ? ".72" : "1";
  managerApplyBtn.style.cursor = applyDisabled ? "not-allowed" : "pointer";

  managerCancelBtn.disabled = cancelDisabled;
  managerCancelBtn.style.opacity = cancelDisabled ? ".55" : "1";
  managerCancelBtn.style.cursor = cancelDisabled ? "not-allowed" : "pointer";
}

async function refreshManagerApplyUIFromDB(){
  const role = getRole();

  if(role !== "member"){
    return;
  }

  const member = await getCurrentMemberRecord();
  if(!member){
    setManagerApplyButtons({
      applyDisabled:false,
      applyText:"我想做宿管！",
      cancelDisabled:true
    });
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = "未读取到当前成员资料。";
    return;
  }

  const data = await getLatestAdminApplication(member.id);

  if(!data || data.status === "cancelled" || data.status === "rejected"){
    setManagerApplyButtons({
      applyDisabled:false,
      applyText:"我想做宿管！",
      cancelDisabled:true
    });
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = data?.status === "rejected"
      ? "你的上一份宿管申请未通过，如需再次申请可重新提交。"
      : "点击按钮后将提交宿管申请。";
    return;
  }

  if(data.status === "pending"){
    setManagerApplyButtons({
      applyDisabled:true,
      applyText:"已提交",
      cancelDisabled:false
    });
    managerApplyHint.style.color = "#5f7d3a";
    managerApplyHint.textContent = "你的宿管申请已提交，正在等待所有管理员投票。";
    return;
  }

  if(data.status === "approved"){
    setManagerApplyButtons({
      applyDisabled:true,
      applyText:"已通过",
      cancelDisabled:true
    });
    managerApplyHint.style.color = "#5f7d3a";
    managerApplyHint.textContent = "你的宿管申请已通过。";
  }
}

async function submitManagerApplication(){
  const role = getRole();
  const nickname = getCurrentUser();

  if(role !== "member"){
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = "只有房客身份可以提交宿管申请。";
    return;
  }

  if(!nickname){
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = "未读取到当前成员信息，请重新登录。";
    return;
  }

  managerApplyHint.style.color = "#8b5b34";
  managerApplyHint.textContent = "正在提交宿管申请…";

  try{
    const member = await getCurrentMemberRecord();

    if(!member){
      managerApplyHint.textContent = "提交失败，未找到当前成员资料。";
      return;
    }

    const latest = await getLatestAdminApplication(member.id);
    if(latest && (latest.status === "pending" || latest.status === "approved")){
      if(latest.status === "pending"){
        managerApplyHint.style.color = "#5f7d3a";
        managerApplyHint.textContent = "你的宿管申请已经在等待处理中。";
      }else{
        managerApplyHint.style.color = "#5f7d3a";
        managerApplyHint.textContent = "你的宿管申请已经通过。";
      }
      await refreshManagerApplyUIFromDB();
      return;
    }

    const insertResult = await client
      .from("admin_applications")
      .insert([{
        member_id: member.id,
        nickname: nickname,
        status: "pending"
      }])
      .select()
      .single();

    if(insertResult.error){
      console.error("宿管申请提交失败：", insertResult.error);
      managerApplyHint.textContent = "宿管申请提交失败，请稍后再试。";
      return;
    }

    const verify = await getPendingAdminApplication(member.id);
    if(!verify){
      managerApplyHint.textContent = "宿管申请写入后未读取到记录，请检查数据库表结构。";
      return;
    }

    await refreshManagerApplyUIFromDB();
    managerApplyHint.style.color = "#5f7d3a";
    managerApplyHint.textContent = "宿管申请已提交，正在等待所有管理员投票。";

  }catch(err){
    console.error("submitManagerApplication() 异常：", err);
    managerApplyHint.textContent = "宿管申请提交失败，请稍后再试。";
  }
}

async function cancelManagerApplication(){
  const role = getRole();
  const nickname = getCurrentUser();

  if(role !== "member"){
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = "当前身份不能取消宿管申请。";
    return;
  }

  if(!nickname){
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = "未读取到当前成员信息，请重新登录。";
    return;
  }

  managerApplyHint.style.color = "#8b5b34";
  managerApplyHint.textContent = "正在取消宿管申请…";

  try{
    const member = await getCurrentMemberRecord();

    if(!member){
      managerApplyHint.textContent = "取消失败，未找到当前成员资料。";
      return;
    }

    const pending = await getPendingAdminApplication(member.id);

    if(!pending){
      managerApplyHint.style.color = "#8b5b34";
      managerApplyHint.textContent = "当前没有可取消的宿管申请。";
      await refreshManagerApplyUIFromDB();
      return;
    }

    const updateResult = await client
      .from("admin_applications")
      .update({ status: "cancelled" })
      .eq("id", pending.id)
      .eq("member_id", member.id)
      .eq("status", "pending")
      .select("id, status");

    if(!updateResult.error){
      const updatedRow = (updateResult.data || [])[0] || null;
      if(updatedRow && updatedRow.status === "cancelled"){
        await refreshManagerApplyUIFromDB();
        managerApplyHint.style.color = "#8b5b34";
        managerApplyHint.textContent = "已取消宿管申请。";
        return;
      }
    }else{
      console.warn("update 取消失败，准备尝试删除方案：", updateResult.error);
    }

    const deleteVotesResult = await client
      .from("admin_application_votes")
      .delete()
      .eq("application_id", pending.id);

    if(deleteVotesResult.error){
      console.warn("删除宿管申请投票失败：", deleteVotesResult.error);
    }

    const deleteAppResult = await client
      .from("admin_applications")
      .delete()
      .eq("id", pending.id)
      .eq("member_id", member.id)
      .eq("status", "pending")
      .select("id");

    if(deleteAppResult.error){
      console.error("删除宿管申请失败：", deleteAppResult.error);
      managerApplyHint.textContent = "取消失败，请检查数据库是否允许更新或删除宿管申请。";
      return;
    }

    const deletedRow = (deleteAppResult.data || [])[0] || null;
    if(!deletedRow){
      managerApplyHint.textContent = "取消失败，请检查数据库是否允许更新或删除宿管申请。";
      return;
    }

    await refreshManagerApplyUIFromDB();
    managerApplyHint.style.color = "#8b5b34";
    managerApplyHint.textContent = "已取消宿管申请。";

  }catch(err){
    console.error("cancelManagerApplication() 异常：", err);
    managerApplyHint.textContent = "取消失败，请稍后再试。";
  }
}

async function ensureMemberPage(){
  if(!isLoggedIn()){
    window.location.href = "manager-visitor.html";
    return;
  }

  const role = getRole();

  if(role === "owner"){
    window.location.href = "manager-owner.html";
    return;
  }

  if(role === "admin"){
    window.location.href = "manager-admin.html";
    return;
  }

  if(role === "applying"){
    window.location.href = "manager-visitor.html";
    return;
  }

  if(role !== "member"){
    window.location.href = "manager-visitor.html";
    return;
  }

  updateStatusUserUI();
  await refreshManagerApplyUIFromDB();
}

ensureMemberPage();

if(managerImg?.complete){
  syncManagerUIToImage();
}else{
  managerImg?.addEventListener("load", syncManagerUIToImage, { once:true });
}

window.addEventListener("resize", syncManagerUIToImage);
window.addEventListener("orientationchange", syncManagerUIToImage);
if(document.fonts?.ready){
  document.fonts.ready.then(() => {
    syncManagerUIToImage();
    fitRoomNavToBar();
  });
}

window.addEventListener("storage", async (e) => {
  if(
    e.key === "room10LoggedIn" ||
    e.key === "room10User" ||
    e.key === "room10Role" ||
    e.key === "room10MemberId" ||
    e.key === "room10MemberCode"
  ){
    await ensureMemberPage();
  }
});
</script>
