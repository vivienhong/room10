name: Temporary studio todo finalizer

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/studio-todo-final-template71'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-todo-final-template71
          fetch-depth: 0
      - name: Apply final patch
        run: python tools/patch_studio_todo_final.py
      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('studio/studio-todo.html').read_text(encoding='utf-8')
          assert html.count('id="room10LoginMask"') == 1
          assert html.count('id="room10ErrorMask"') == 1
          assert '.from(' not in html
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/studio-todo-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('scripts',len(scripts),'bytes',len(html))
          PY
          node --check /tmp/studio-todo-inline.js
          git diff --check
      - name: Commit final page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio/studio-todo.html
          git commit -m 'Finalize studio todo template integration'
          git push origin HEAD:agent/studio-todo-final-template71
