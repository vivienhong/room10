<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十号房｜宿管室</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --bg-left:#fff3e7;
  --bg-right:#f4dfc8;
  --bg-top:#fff7ef;
  --bg-bottom:#edd8c1;
  --bg-ui-scale:1;
  --text:#5b4632;
  --title:#6a5038;
  --line:#d8c2a3;
  --line2:#e3d0b4;
  --panel:rgba(255,249,240,.92);
  --btn:#c98e56;
  --btn-hover:#b97d45;
  --sub:#e7d3b7;
  --sub-hover:#dcc29e;
  --shadow:0 10px 24px rgba(0,0,0,.08);
  --radius:16px;
  --green:#5f7d3a;
  --red:#a14f3f;
  --muted:#8e7c68;
  --info:#7b654f;
  --info-bg:#f7eee1;
  --success-bg:#eef6e8;
  --error-bg:#fbeceb;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  position:relative;
  font-family:Arial, Helvetica, sans-serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at center, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
  color:var(--text);
}

/* ===== 游戏房同款底图舞台 ===== */
#bgColorFill{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    linear-gradient(180deg, var(--bg-top) 0%, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, var(--bg-bottom) 100%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
}

#bgBleed{
  position:fixed;
  inset:-8vh -8vw;
  z-index:1;
  background:url("room-manager.png") center center / cover no-repeat;
  filter:blur(30px) saturate(1.05);
  transform:scale(1.08);
  opacity:.72;
  pointer-events:none;
}

#bgLight{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0) 58%),
    linear-gradient(180deg, rgba(255,248,240,0.08), rgba(255,248,240,0.08));
}

#managerPage{
  position:relative;
  z-index:3;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:transparent;
}

#managerStage{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#managerBg{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

#managerUI{
  position:absolute;
  z-index:1;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#managerUI *{
  pointer-events:auto;
}

/* ===== 面板通用 ===== */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(3px);
}

.hidden{
  display:none !important;
}

/* ===== 页面提示 ===== */
#pageNotice{
  position:absolute;
  left:25.7%;
  top:4.6%;
  width:50%;
  min-height:42px;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--info-bg);
  color:var(--info);
  z-index:6;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow:var(--shadow);
  font-size:clamp(11px, .8vw, 14px);
  line-height:1.4;
}

#pageNotice.notice-success{
  background:var(--success-bg);
  color:var(--green);
}

#pageNotice.notice-error{
  background:var(--error-bg);
  color:var(--red);
}

.notice-text{
  flex:1 1 auto;
}

.notice-close{
  flex:0 0 auto;
  border:none;
  background:transparent;
  color:inherit;
  cursor:pointer;
  font-size:16px;
  line-height:1;
  padding:0 2px;
}

/* ===== 右上角身份组件 ===== */
#topActions{
  position:absolute;
  right:7.35%;
  top:6.46%;
  width:calc(232px * var(--ui-scale));
  height:calc(38px * var(--ui-scale));
  min-width:0;
  min-height:0;
  z-index:10;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:rgba(255,248,239,0.92);
  border:1px solid rgba(186,146,103,0.24);
  box-shadow:
    0 10px 24px rgba(116,86,54,0.12),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:rgba(255,252,247,0.96);
  color:#6c4523;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:1;
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  display:block;
  line-height:1;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--ui-scale));
  top:calc(-6px * var(--ui-scale));
  min-width:calc(18px * var(--ui-scale));
  height:calc(18px * var(--ui-scale));
  padding:0 calc(5px * var(--ui-scale));
  border-radius:999px;
  background:#c98c4f;
  color:#fff9f1;
  font-size:calc(9px * var(--ui-scale));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--ui-scale)) solid rgba(255,248,239,0.98);
  box-shadow:0 2px 8px rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice #siteNoticeCount{
  display:flex;
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:min(calc(360px * var(--ui-scale)), 72vw);
  max-height:min(calc(540px * var(--ui-scale)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  background:rgba(255,249,241,0.98);
  border:1px solid rgba(203,167,123,0.28);
  box-shadow:0 16px 36px rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

#siteNoticePanel.show{ display:block; }

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--ui-scale));
  font-weight:900;
  margin-bottom:calc(10px * var(--ui-scale));
}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--ui-scale));
  line-height:1.6;
  padding:6px 2px 2px;
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--ui-scale));
}

.siteNoticeItem{
  padding:calc(10px * var(--ui-scale));
  border-radius:calc(12px * var(--ui-scale));
  background:rgba(255,252,247,0.82);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.92), 0 2px 8px rgba(120,92,63,0.05);
}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1.5;
  margin-bottom:4px;
}

.siteNoticeItemDesc{
  color:#8a6644;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.55;
}

/* ===== 房间切换：同游戏房顶部按钮 ===== */
#topBar{
  position:absolute;
  left:27.2%;
  top:6.35%;
  width:45.5%;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:9;
  overflow:visible;
  --nav-btn-height:calc(40px * var(--ui-scale));
  --nav-btn-px:calc(16px * var(--ui-scale));
  --nav-btn-radius:calc(13px * var(--ui-scale));
  --nav-btn-font:calc(14px * var(--ui-scale));
  --nav-gap:calc(8px * var(--ui-scale));
}

#topBar,
#navOuter,
#navScroll{
  overflow:visible;
}

#navOuter{
  flex:0 0 auto;
  min-width:0;
  width:100%;
}

#navScroll{
  width:100%;
  white-space:nowrap;
  scrollbar-width:none;
  -ms-overflow-style:none;
  padding:0;
  margin:0;
}

#navScroll::-webkit-scrollbar{display:none;}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap, 8px);
  transform-origin:left center;
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height, 40px);
  padding:0 var(--nav-btn-px, 16px);
  border-radius:var(--nav-btn-radius, 13px);
  color:#6e4827;
  font-size:var(--nav-btn-font, 14px);
  font-weight:900;
  line-height:1;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid rgba(145,98,56,.34);
  box-shadow:0 1px 1px rgba(255,255,255,.48) inset, 0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:0 1px 1px rgba(255,255,255,.55) inset, 0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{position:relative; z-index:5;}

.navActiveNote{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:0 1px 2px rgba(255,250,232,.72);
}

.navActiveNoteA{left:8%; top:-52%; color:rgba(167,104,54,.72); font-size:calc(var(--nav-btn-font, 14px) * .88);}
.navActiveNoteB{right:8%; top:-60%; color:rgba(122,91,143,.58); font-size:calc(var(--nav-btn-font, 14px) * .80);}
.navActiveNoteC{left:50%; top:-68%; transform:translateX(-50%); color:rgba(198,124,112,.78); font-size:calc(var(--nav-btn-font, 14px) * .96);}

@keyframes navNotePopA{0%,100%{transform:translateY(3px) rotate(-8deg) scale(.82);opacity:0;}22%,68%{opacity:.88;}48%{transform:translateY(-3px) rotate(5deg) scale(1);opacity:.72;}}
@keyframes navNotePopB{0%,100%{transform:translateY(4px) rotate(8deg) scale(.78);opacity:0;}26%,72%{opacity:.78;}50%{transform:translateY(-4px) rotate(-6deg) scale(1);opacity:.64;}}
@keyframes navNotePopC{0%,100%{transform:translateX(-50%) translateY(5px) rotate(0deg) scale(.76);opacity:0;}24%,70%{opacity:.86;}50%{transform:translateX(-50%) translateY(-5px) rotate(2deg) scale(1);opacity:.76;}}

.navBtn:hover .navActiveNoteA,.navBtn:focus-visible .navActiveNoteA{animation:navNotePopA 2.2s ease-in-out infinite;}
.navBtn:hover .navActiveNoteB,.navBtn:focus-visible .navActiveNoteB{animation:navNotePopB 2.5s ease-in-out infinite;}
.navBtn:hover .navActiveNoteC,.navBtn:focus-visible .navActiveNoteC{animation:navNotePopC 2.35s ease-in-out infinite;}

.navBtn[data-room="hall"] .navActiveNote{
  color:rgba(255,205,96,.86);
  text-shadow:0 1px 2px rgba(255,250,232,.95), 0 0 10px rgba(255,215,105,.62);
}
.navBtn[data-room="honor"] .navActiveNote{
  color:rgba(205,143,45,.86);
  text-shadow:0 1px 2px rgba(255,250,232,.92), 0 0 8px rgba(255,220,130,.52);
}
.navBtn[data-room="game"] .navActiveNote{ color:rgba(117,91,150,.82); }
.navBtn[data-room="studio"] .navActiveNote{ color:rgba(96,112,145,.84); }
.navBtn[data-room="living"] .navActiveNote{ color:rgba(150,111,72,.82); }
.navBtn[data-room="dorm"] .navActiveNote{ color:rgba(143,111,168,.76); }
.navBtn[data-room="pets"] .navActiveNote{ color:rgba(131,111,78,.82); }
.navBtn[data-room="flower"] .navActiveNote{ color:rgba(198,119,145,.82); }


/* ===== 左侧宿管说明卡 ===== */
#managerBriefCard{
  position:absolute;
  left:5.65%;
  top:22.4%;
  width:calc(232px * var(--ui-scale));
  padding:calc(13px * var(--ui-scale)) calc(14px * var(--ui-scale));
  z-index:4;
  color:#6a4b32;
  background:rgba(255,249,240,.86);
  border:1px solid rgba(216,194,163,.78);
  border-radius:calc(16px * var(--ui-scale));
  box-shadow:
    0 10px 24px rgba(116,86,54,.10),
    inset 0 1px 0 rgba(255,255,255,.78);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.brief-title{
  margin:0 0 calc(7px * var(--ui-scale));
  font-size:calc(14px * var(--ui-scale));
  line-height:1.25;
  font-weight:900;
  color:#6b4524;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.brief-text{
  margin:0;
  font-size:calc(12px * var(--ui-scale));
  line-height:1.55;
  color:#765a40;
}

.brief-list{
  margin:calc(8px * var(--ui-scale)) 0 0;
  padding:0;
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:calc(5px * var(--ui-scale));
}

.brief-list li{
  position:relative;
  padding-left:calc(14px * var(--ui-scale));
  font-size:calc(11px * var(--ui-scale));
  line-height:1.45;
  color:#84664a;
}

.brief-list li::before{
  content:"•";
  position:absolute;
  left:0;
  top:0;
  color:#c98e56;
  font-weight:900;
}

.brief-sign{
  margin-top:calc(9px * var(--ui-scale));
  padding-top:calc(7px * var(--ui-scale));
  border-top:1px dashed rgba(180,139,94,.32);
  font-size:calc(10px * var(--ui-scale));
  line-height:1.35;
  color:#9a795b;
  text-align:right;
}

/* ===== 中栏内容区 ===== */
#contentArea{
  position:absolute;
  left:25.7%;
  top:10.1%;
  width:50%;
  height:79.2%;
  z-index:2;
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:8px;
  scrollbar-width:thin;
  scrollbar-color:#cfad82 rgba(255,255,255,.35);
}

#contentArea::-webkit-scrollbar{
  width:8px;
}
#contentArea::-webkit-scrollbar-track{
  background:rgba(255,255,255,.35);
  border-radius:999px;
}
#contentArea::-webkit-scrollbar-thumb{
  background:#cfad82;
  border-radius:999px;
}

.card{
  position:relative;
  padding:14px 16px;
  margin-bottom:10px;
}

.section-title{
  margin:0 0 10px 0;
  font-size:clamp(16px, 1.05vw, 22px);
  font-weight:700;
  color:var(--title);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  line-height:1.2;
}

/* ===== 右侧切换栏 ===== */
#adminSwitchPanel{
  position:absolute;
  right:8%;
  top:24%;
  width:13.8%;
  padding:10px;
  z-index:4;
}

.switch-title{
  margin:0 0 8px 0;
  font-size:clamp(12px, .82vw, 15px);
  font-weight:700;
  color:var(--title);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  text-align:center;
}

.switch-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.switch-btn{
  border:none;
  border-radius:11px;
  padding:8px 6px;
  font-size:clamp(11px, .76vw, 14px);
  background:#ead9bc;
  cursor:pointer;
  text-align:center;
  color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-weight:600;
  line-height:1.2;
}

.switch-btn:hover{
  background:#e2ccaa;
}

.switch-btn.active{
  background:var(--btn);
  color:#fff;
}

/* ===== 管理视图 ===== */
.admin-view-card{
  min-height:100%;
  display:flex;
  flex-direction:column;
}

.admin-block{
  background:#fff;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--line2);
  margin-top:10px;
  display:flex;
  flex-direction:column;
}

.admin-block:first-of-type{
  margin-top:0;
}

.admin-view-card > .admin-block{
  flex:1 1 auto;
  min-height:0;
}

.admin-block h3{
  margin:0 0 8px 0;
  font-size:clamp(13px, .92vw, 17px);
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  color:var(--title);
}

.module-note{
  margin:0;
  font-size:clamp(11px, .74vw, 14px);
  line-height:1.45;
  color:#7a6755;
}

.module-scroll{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding-right:4px;
  scrollbar-width:thin;
  scrollbar-color:#cfad82 rgba(255,255,255,.35);
}

.module-scroll::-webkit-scrollbar{ width:8px; }
.module-scroll::-webkit-scrollbar-track{
  background:rgba(255,255,255,.35);
  border-radius:999px;
}
.module-scroll::-webkit-scrollbar-thumb{
  background:#cfad82;
  border-radius:999px;
}

/* ===== 档案夹 ===== */
.apply-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.apply-item{
  background:rgba(255,252,246,.92);
  border:1px solid var(--line2);
  border-radius:12px;
  padding:10px 12px;
}

.apply-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:6px;
}

.apply-head strong{
  font-size:clamp(12px, .85vw, 16px);
  color:var(--title);
}

.apply-time{
  font-size:clamp(11px, .72vw, 13px);
  color:var(--muted);
  white-space:nowrap;
}

.apply-body{
  display:flex;
  flex-direction:column;
  gap:4px;

.apply-meta{

.inline-btn{

  border-radius:10px;

  cursor:pointer;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  font-weight:600;
  white-space:nowrap;
  flex:0 0 auto;
}

.sub-btn:hover{ background:var(--sub-hover); }

.apply-actions-row .inline-btn,
.apply-actions-row .sub-btn{

  min-width:82px;
  padding:0 12px;
  font-size:clamp(11px, .76vw, 14px);
}

.inline-btn:disabled,
.sub-btn:disabled{

}

.vote-summary{
  margin-top:6px;
  font-size:clamp(11px, .72vw, 13px);
  color:#7b654f;
  line-height:1.4;

.vote-wait{ color:#8b5b34; }
.vote-pass{ color:var(--green); }
.vote-reject{ color:var(--red); }

/* ===== 钥匙保管处 ===== */
.key-list-wrap{
  margin-top:6px;
  overflow:auto;
  flex:1 1 auto;
  min-height:0;
  border:1px solid var(--line2);
  border-radius:10px;
  background:rgba(255,252,246,.75);
}

.key-storage-box{

  flex-direction:column;
  flex:1 1 auto;
  min-height:0;
}

.key-col-code{ width:28%; }
.key-col-status{ width:18%; }
.key-col-user{ width:24%; }

.key-list{
  width:100%;

  table-layout:fixed;
}

.key-list th,
.key-list td{

.key-loading{ color:#7a6755; }
.key-error{ color:#a14f3f; }
.key-empty{ color:#7a6755; }

.key-status-used{

}

.key-status-free{
  color:var(--green);

/* ===== 维修日志 ===== */
.log-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.log-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 10px;

}

.log-main{
  font-size:clamp(11px, .76vw, 14px);

  color:#6b5a45;
}

.log-time{
  flex:0 0 auto;
  font-size:clamp(11px, .7vw, 13px);

  white-space:nowrap;
}

/* ===== 宿管室轻动态：柔光 / 钥匙浮光 / 空气粒子 / 纸张切换 ===== */
#bgLight{
  animation:managerLightBreath 7.5s ease-in-out infinite;
}

#bgBleed{
  animation:managerBgDrift 18s ease-in-out infinite alternate;
}

@keyframes managerLightBreath{
  0%,100%{ opacity:.62; }
  50%{ opacity:.9; }
}

@keyframes managerBgDrift{
  0%{ transform:scale(1.08) translate3d(0,0,0); }
  100%{ transform:scale(1.095) translate3d(-.4%,.35%,0); }
}

@media (min-width:541px){
  #managerUI::before{
    content:"";
    position:absolute;
    right:9.6%;
    bottom:18.4%;
    width:19%;
    height:22%;
    border-radius:24px;
    background:
      linear-gradient(112deg,
        transparent 0%,
        transparent 35%,
        rgba(255,244,204,.06) 44%,
        rgba(255,238,178,.34) 50%,
        rgba(255,244,204,.08) 57%,
        transparent 68%,
        transparent 100%);
    mix-blend-mode:screen;
    opacity:.56;
    pointer-events:none;
    animation:managerKeyShine 6.8s ease-in-out infinite;
  }

  #managerUI::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.38;
    background-image:
      radial-gradient(circle, rgba(194,139,82,.20) 0 1px, transparent 1.5px),
      radial-gradient(circle, rgba(255,238,190,.18) 0 1px, transparent 1.6px),
      radial-gradient(circle, rgba(170,119,77,.12) 0 .8px, transparent 1.4px);
    background-size:210px 180px, 260px 220px, 320px 260px;
    background-position:18% 22%, 64% 18%, 42% 68%;
    animation:managerDustFloat 15s linear infinite;
  }

  #contentArea,
  #adminSwitchPanel,
  #managerBriefCard,
  #topActions,
  #topBar{
    animation:managerPanelIn .55s ease both;
  }

  .admin-view-card.tab-enter{
    animation:managerPaperIn .36s ease both;
  }

  .switch-btn.active{
    position:relative;
    overflow:hidden;
  }

  .switch-btn.active::after{
    content:"";
    position:absolute;
    top:0;
    left:-65%;
    width:48%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.40), transparent);
    pointer-events:none;
    animation:managerBtnShine 4.2s ease-in-out infinite;
  }
}

@keyframes managerKeyShine{
  0%,58%{ opacity:0; transform:translateX(-18%) skewX(-8deg); }
  68%{ opacity:.72; }
  88%,100%{ opacity:0; transform:translateX(28%) skewX(-8deg); }
}

@keyframes managerDustFloat{
  0%{ transform:translate3d(0,0,0); background-position:18% 22%, 64% 18%, 42% 68%; }
  100%{ transform:translate3d(0,-10px,0); background-position:20% 18%, 61% 14%, 44% 64%; }
}

@keyframes managerPanelIn{
  from{ opacity:0; transform:translateY(8px); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes managerPaperIn{
  from{ opacity:.15; transform:translateY(7px) scale(.992); filter:blur(1.2px); }
  to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}

@keyframes managerBtnShine{
  0%,62%{ left:-65%; }
  100%{ left:125%; }
}

@media (prefers-reduced-motion: reduce){
  #bgLight,
  #bgBleed,
  #managerUI::before,
  #managerUI::after,
  #contentArea,
  #adminSwitchPanel,
  #managerBriefCard,
  #topActions,
  #topBar,
  .admin-view-card.tab-enter,
  .switch-btn.active::after{
    animation:none !important;
  }
}

<script>

function clearDesktopOverlayStyles(){

    managerUI.style.left = "";
    managerUI.style.top = "";
    managerUI.style.width = "";
    managerUI.style.height = "";
  }
  if(roomNav){
    roomNav.style.transform = "";
  }
}

function syncManagerUIToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }
  if(!managerImg?.naturalWidth || !managerImg?.naturalHeight || !managerStage || !managerUI) return;

  const frame = managerStage.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = managerImg.naturalWidth / managerImg.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = (frame.width - displayWidth) / 2;
    displayTop = 0;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = 0;
    displayTop = (frame.height - displayHeight) / 2;
  }

  managerUI.style.left = `${displayLeft}px`;
  managerUI.style.top = `${displayTop}px`;
  managerUI.style.width = `${displayWidth}px`;
  managerUI.style.height = `${displayHeight}px`;

  const scale = Math.max(0.34, Math.min(1.42, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));

  requestAnimationFrame(fitRoomNavToBar);
}

function fitRoomNavToBar(){
  if(!roomNav || !topBar || isTinyScreen()) return;

  roomNav.style.transform = "scale(1)";
  const available = topBar.clientWidth;
  const needed = roomNav.scrollWidth;
  const scale = Math.min(1, available / Math.max(needed, 1));

  roomNav.style.transform = `scale(${scale})`;
}

function isMediumScrollScreen(){
  return window.innerWidth > 540 && (window.innerWidth <= 900 || window.innerHeight <= 760);
}

function getStoredUser(){
  const oldLoggedIn = localStorage.getItem("room10LoggedIn") === "true";
  const oldUser = localStorage.getItem("room10User") || "";
  const oldRole = localStorage.getItem("room10Role") || "";
  const oldMemberId = localStorage.getItem("room10MemberId") || "";

  if(oldLoggedIn && oldUser){
    return {
      nickname:oldUser,
      role:oldRole || "member",
      member_id:oldMemberId
    };
  }

  try{
    const raw =
      localStorage.getItem("room10_user") ||
      localStorage.getItem("room10_current_user") ||
      localStorage.getItem("currentUser");

    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data) return null;

    return {
      nickname:data.nickname || data.name || "",
      role:data.role || "",
      member_id:data.member_id || data.id || ""
    };
  }catch(err){
    return null;
  }
}

function isLoggedIn(){
  const user = getStoredUser();
  return !!(user && user.nickname);
}

function getRole(){
  const user = getStoredUser();
  return user?.role || localStorage.getItem("room10Role") || "";
}

function getCurrentUser(){
  const user = getStoredUser();
  return user?.nickname || localStorage.getItem("room10User") || "";
}

function isAdminRole(role){
  return role === "admin" || role === "owner";
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatTime(input){
  if(!input) return "未知时间";
  const d = new Date(input);
  if(Number.isNaN(d.getTime())) return "未知时间";

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  const h = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");

  return `${y}-${m}-${day} ${h}:${min}`;
}

function parseKeySortValue(raw){
  const s = String(raw || "").trim();
  if(!s) return { num: Number.MAX_SAFE_INTEGER, text: s };

  const match = s.match(/^([A-Za-z]*)(\d+)$/);
  if(match){
    const prefix = match[1] || "";
    const num = Number(match[2]);
    return { num, text: prefix + String(num).padStart(20, "0") };
  }

  const digit = s.match(/(\d+)/);
  if(digit){
    return { num: Number(digit[1]), text: s };
  }

  return { num: Number.MAX_SAFE_INTEGER, text: s };
}

function getRoleLabel(roleValue = getRole()){
  const role = String(roleValue || "").toLowerCase();
  if(role === "admin") return "宿管";
  if(role === "owner") return "维修工";
  if(role === "applying") return "房客";
  if(isLoggedIn()) return "房客";
  return "参观者";
}

}

function renderSiteNoticeList(items){

function showNotice(message, type = "info", autoHideMs = 2600){

  pageNoticeText.textContent = message;

  if(showNotice._timer){
    clearTimeout(showNotice._timer);

  if(autoHideMs > 0){

}

function getRequiredVoteCount(adminCount){

function renderKeyList(rows){
  keyListBody.innerHTML = "";

  rows.forEach(item => {

async function loadKeyStorage(force = false){
  if(keyListLoaded && !force) return;

  resetKeyStorageUI();

  try{
    const keyResult = await client
      .from("invite_keys")
      .select("key_code, is_used, used_by_nickname")
      .order("key_code", { ascending: true });

    if(keyResult.error){
      console.error("读取钥匙保管处失败：", keyResult.error);
      keyStorageLoading.classList.add("hidden");
      keyStorageError.classList.remove("hidden");
      keyStorageError.textContent = "钥匙名单读取失败，请稍后再试。";
      return;
    }

    const keyRows = (keyResult.data || []).filter(item => String(item.key_code || "").trim());

    const memberResult = await client
      .from("members")
      .select("member_code, nickname, name");

    if(memberResult.error){
      console.error("读取成员昵称失败：", memberResult.error);
      keyStorageLoading.classList.add("hidden");
      keyStorageError.classList.remove("hidden");
      keyStorageError.textContent = "钥匙名单读取失败，请稍后再试。";
      return;
    }

    const memberMap = {};
    (memberResult.data || []).forEach(item => {
      const code = String(item.member_code || "").trim();
      if(!code) return;
      memberMap[code] = item;
    });

    const rows = keyRows
      .map(item => {
        const code = String(item.key_code || "").trim();
        const memberRow = memberMap[code];
        return {
          ...item,
          display_user: memberRow?.nickname || item.used_by_nickname || memberRow?.name || "—"
        };
      })
      .sort((a, b) => {
        const pa = parseKeySortValue(a.key_code);
        const pb = parseKeySortValue(b.key_code);
        if(pa.num !== pb.num) return pa.num - pb.num;
        return pa.text.localeCompare(pb.text, "zh-CN");
      });

    keyStorageLoading.classList.add("hidden");

    if(!rows.length){
      keyStorageEmpty.classList.remove("hidden");
      keyListWrap.classList.add("hidden");
      keyListLoaded = true;
      return;
    }

    renderKeyList(rows);
    keyListWrap.classList.remove("hidden");
    keyListLoaded = true;

  }catch(err){
    console.error("loadKeyStorage() 异常：", err);
    keyStorageLoading.classList.add("hidden");
    keyStorageError.classList.remove("hidden");
    keyStorageError.textContent = "钥匙名单读取失败，请稍后再试。";
  }
}

function buildVoteSummaryText(votes, requiredCount){
  const approveCount = votes.filter(v => v.vote === "approve").length;
  const rejectCount = votes.filter(v => v.vote === "reject").length;

  if(approveCount >= requiredCount){
    return `<div class="vote-summary vote-pass">当前票数：通过 ${approveCount} / 不通过 ${rejectCount}。已满足通过条件（需 ${requiredCount} 票）。</div>`;
  }

  if(rejectCount >= requiredCount){
    return `<div class="vote-summary vote-reject">当前票数：通过 ${approveCount} / 不通过 ${rejectCount}。已满足不通过条件（需 ${requiredCount} 票）。</div>`;
  }

  return `<div class="vote-summary vote-wait">当前票数：通过 ${approveCount} / 不通过 ${rejectCount}。达到 ${requiredCount} 票后结算。</div>`;
}

function renderMemberApplications(rows, votesMap, currentVoterId, adminCount){
  const box = document.getElementById("memberApplyList");
  if(!box) return;

  if(!rows.length){
    box.innerHTML = `<div class="module-note">当前没有待处理的入住申请。</div>`;
    return;
  }

  const requiredCount = getRequiredVoteCount(adminCount);

  box.innerHTML = rows.map(item => {
    const votes = votesMap[item.id] || [];
    const myVote = votes.find(v => String(v.voter_member_id) === String(currentVoterId));
    const busy = isActionBusy("member", item.id);
    const approveLabel = busy && myVote?.vote !== "approve" ? "提交中..." : "通过";
    const rejectLabel = busy && myVote?.vote !== "reject" ? "提交中..." : "不通过";
    const myVoteText = myVote
      ? `<div class="apply-meta">你当前投票：${myVote.vote === "approve" ? "通过" : "不通过"}（未结算前可修改）</div>`
      : `<div class="apply-meta">你还未投票</div>`;

    return `
      <div class="apply-item">
        <div class="apply-head">
          <strong>${escapeHtml(item.name || "未命名")}</strong>
          <span class="apply-time">${formatTime(item.created_at)}</span>
        </div>
        <div class="apply-body">
          <div>QQ：${escapeHtml(item.contact_qq || "未填写")}</div>
          <div>当前状态：${escapeHtml(item.status || "pending")}</div>
          <div>钥匙：${escapeHtml(item.member_code || "未分配")}</div>
        </div>
        ${myVoteText}
        ${buildVoteSummaryText(votes, requiredCount)}
        <div class="apply-actions-row">
          <button class="inline-btn" type="button" ${busy ? "disabled" : ""} onclick="voteMemberApplication('${item.id}', 'approve')">${approveLabel}</button>
          <button class="sub-btn" type="button" ${busy ? "disabled" : ""} onclick="voteMemberApplication('${item.id}', 'reject')">${rejectLabel}</button>
        </div>
      </div>
    `;
  }).join("");
}

function renderAdminApplications(rows, votesMap, currentVoterId, adminCount){
  const box = document.getElementById("adminApplyList");
  if(!box) return;

  if(!rows.length){
    box.innerHTML = `<div class="module-note">当前没有待处理的宿管申请。</div>`;
    return;
  }

  const requiredCount = getRequiredVoteCount(adminCount);

  box.innerHTML = rows.map(item => {

    const approveLabel = busy && myVote?.vote !== "approve" ? "提交中..." : "通过";
    const rejectLabel = busy && myVote?.vote !== "reject" ? "提交中..." : "不通过";
    const myVoteText = myVote
      ? `<div class="apply-meta">你当前投票：${myVote.vote === "approve" ? "通过" : "不通过"}（未结算前可修改）</div>`
      : `<div class="apply-meta">你还未投票</div>`;

    return `
      <div class="apply-item">

          <div>申请类型：宿管申请</div>

        </div>
        ${myVoteText}
        ${buildVoteSummaryText(votes, requiredCount)}
        <div class="apply-actions-row">
          <button class="inline-btn" type="button" ${busy ? "disabled" : ""} onclick="voteAdminApplication('${item.id}', 'approve')">${approveLabel}</button>
          <button class="sub-btn" type="button" ${busy ? "disabled" : ""} onclick="voteAdminApplication('${item.id}', 'reject')">${rejectLabel}</button>
        </div>
      </div>
    `;

async function loadAllApplications(force = false){
  if(archiveLoaded && !force) return;

  const memberApplyList = document.getElementById("memberApplyList");
  const adminApplyList = document.getElementById("adminApplyList");

  if(!memberApplyList || !adminApplyList) return;

  memberApplyList.innerHTML = `<div class="module-note">正在读取入住申请…</div>`;
  adminApplyList.innerHTML = `<div class="module-note">正在读取宿管申请…</div>`;

  try{
    const currentMember = await getCurrentMemberRecord();
    const currentVoterId = currentMember?.id || null;
    const adminCount = await getAdminCount();

    const memberResult = await client
      .from("applications")
      .select("id, name, contact_qq, status, member_code, created_at")
      .eq("status", "pending")
      .order("created_at", { ascending: false });

    const adminResult = await client
      .from("admin_applications")
      .select("id, member_id, nickname, status, created_at, updated_at")
      .eq("status", "pending")
      .order("created_at", { ascending: false });

    if(memberResult.error){
      console.error("读取入住申请失败：", memberResult.error);
      memberApplyList.innerHTML = `<div class="module-note">入住申请读取失败</div>`;
    }else{
      const memberAppIds = (memberResult.data || []).map(item => item.id);
      let memberVotesMap = {};

      if(memberAppIds.length){
        const memberVoteResult = await client
          .from("application_votes")
          .select("application_id, voter_member_id, vote")
          .in("application_id", memberAppIds);

        if(memberVoteResult.error){
          console.error("读取入住申请投票失败：", memberVoteResult.error);
        }else{
          memberVotesMap = (memberVoteResult.data || []).reduce((acc, row) => {
            const key = String(row.application_id);
            if(!acc[key]) acc[key] = [];
            acc[key].push(row);
            return acc;
          }, {});
        }
      }

      renderMemberApplications(memberResult.data || [], memberVotesMap, currentVoterId, adminCount);
    }

    if(adminResult.error){
      console.error("读取宿管申请失败：", adminResult.error);
      adminApplyList.innerHTML = `<div class="module-note">宿管申请读取失败</div>`;
    }else{
      const appIds = (adminResult.data || []).map(item => item.id);
      let votesMap = {};

      if(appIds.length){
        const voteResult = await client
          .from("admin_application_votes")
          .select("application_id, voter_member_id, vote")
          .in("application_id", appIds);

        if(voteResult.error){
          console.error("读取宿管申请投票失败：", voteResult.error);
        }else{
          votesMap = (voteResult.data || []).reduce((acc, row) => {
            const key = String(row.application_id);
            if(!acc[key]) acc[key] = [];
            acc[key].push(row);
            return acc;
          }, {});
        }
      }

      renderAdminApplications(adminResult.data || [], votesMap, currentVoterId, adminCount);
    }

    archiveLoaded = true;

  }catch(err){
    console.error("loadAllApplications() 异常：", err);
    memberApplyList.innerHTML = `<div class="module-note">入住申请读取失败</div>`;
    adminApplyList.innerHTML = `<div class="module-note">宿管申请读取失败</div>`;
  }
}

function renderRecentLogs(rows){
  if(!rows.length){
    recentLogList.innerHTML = `<div class="module-note">当前没有近期记录。</div>`;
    return;
  }

  recentLogList.innerHTML = rows.map(item => `
    <div class="log-item">
      <div class="log-main">${escapeHtml(item.text)}</div>
      <div class="log-time">${formatTime(item.time)}</div>
    </div>
  `).join("");
}

async function loadRecentLogs(force = false){
  if(logsLoaded && !force) return;

  recentLogList.innerHTML = `<div class="module-note">正在读取近期记录…</div>`;

  try{
    const memberResult = await client
      .from("applications")
      .select("name, status, created_at")
      .in("status", ["approved", "rejected", "registered"])
      .order("created_at", { ascending: false })
      .limit(12);

    const adminResult = await client
      .from("admin_applications")
      .select("nickname, status, created_at, updated_at")
      .in("status", ["approved", "rejected", "cancelled"])
      .order("updated_at", { ascending: false })
      .limit(12);

    let logs = [];

    if(!memberResult.error){
      logs = logs.concat((memberResult.data || []).map(item => {
        let action = "申请状态已更新";
        if(item.status === "approved") action = "入住申请已通过";
        if(item.status === "rejected") action = "入住申请未通过";
        if(item.status === "registered") action = "已完成正式登记";

        return {
          text: `${item.name || "未命名"}：${action}`,
          time: item.created_at
        };
      }));
    }else{
      console.error("读取入住日志失败：", memberResult.error);
    }

    if(!adminResult.error){
      logs = logs.concat((adminResult.data || []).map(item => {
        let action = "宿管申请状态已更新";
        if(item.status === "approved") action = "宿管申请已通过";
        if(item.status === "rejected") action = "宿管申请未通过";
        if(item.status === "cancelled") action = "取消了宿管申请";

        return {
          text: `${item.nickname || "未命名"}：${action}`,
          time: item.updated_at || item.created_at
        };
      }));
    }else{
      console.error("读取宿管日志失败：", adminResult.error);
    }

    logs.sort((a, b) => new Date(b.time) - new Date(a.time));
    renderRecentLogs(logs.slice(0, 12));
    logsLoaded = true;

  }catch(err){
    console.error("loadRecentLogs() 异常：", err);
    recentLogList.innerHTML = `<div class="module-note">近期记录读取失败</div>`;
  }
}

async function allocateInviteKeyForApplicant(applicantName){
  const freeKeys = await client
    .from("invite_keys")
    .select("key_code, is_used")
    .eq("is_used", false)
    .order("key_code", { ascending: true });

  if(freeKeys.error){
    console.error("读取可用钥匙失败：", freeKeys.error);
    throw new Error("读取可用钥匙失败");
  }

  const rows = (freeKeys.data || [])
    .filter(item => String(item.key_code || "").trim())
    .sort((a, b) => {
      const pa = parseKeySortValue(a.key_code);
      const pb = parseKeySortValue(b.key_code);
      if(pa.num !== pb.num) return pa.num - pb.num;
      return pa.text.localeCompare(pb.text, "zh-CN");
    });

  if(!rows.length){
    throw new Error("当前没有可分配的空闲钥匙");
  }

  const keyCode = rows[0].key_code;

  const updateKey = await client
    .from("invite_keys")
    .update({
      is_used: true,
      used_by_nickname: applicantName
    })
    .eq("key_code", keyCode)
    .eq("is_used", false)
    .select()
    .maybeSingle();

  if(updateKey.error){
    console.error("分配钥匙失败：", updateKey.error);
    throw new Error("分配钥匙失败");
  }

  if(!updateKey.data){
    throw new Error("钥匙分配未成功，请检查数据库权限或钥匙状态");
  }

  return keyCode;
}

async function finalizeMemberApplicationIfReady(applicationId){
  try{
    const appResult = await client
      .from("applications")
      .select("id, name, status, member_code")
      .eq("id", applicationId)
      .maybeSingle();

    if(appResult.error || !appResult.data){
      console.error("读取入住申请失败：", appResult.error);
      return false;
    }

    const app = appResult.data;
    if(String(app.status || "").toLowerCase() !== "pending"){
      return true;
    }

    const voteResult = await client
      .from("application_votes")
      .select("vote")
      .eq("application_id", applicationId);

    if(voteResult.error){
      console.error("读取入住申请投票失败：", voteResult.error);
      return false;
    }

    const adminCount = await getAdminCount();
    const requiredCount = getRequiredVoteCount(adminCount);

    const votes = voteResult.data || [];
    const approveCount = votes.filter(v => v.vote === "approve").length;
    const rejectCount = votes.filter(v => v.vote === "reject").length;

    if(approveCount >= requiredCount){
      let memberCode = String(app.member_code || "").trim();
      let newlyAllocated = false;

      if(!memberCode){
        memberCode = await allocateInviteKeyForApplicant(app.name || "");
        newlyAllocated = true;
      }

      const updatePayload = {
        status: "approved",
        member_code: memberCode
      };

      const updateResult = await client
        .from("applications")
        .update(updatePayload)
        .eq("id", applicationId)
        .eq("status", "pending")
        .select()
        .maybeSingle();

      if(updateResult.error){
        console.error("入住申请通过更新失败：", updateResult.error);

        if(newlyAllocated && memberCode){
          await client
            .from("invite_keys")
            .update({
              is_used: false,
              used_by_nickname: null
            })
            .eq("key_code", memberCode)
            .eq("used_by_nickname", app.name || "");
        }
        return false;
      }

      if(!updateResult.data && newlyAllocated && memberCode){
        await client
          .from("invite_keys")
          .update({
            is_used: false,
            used_by_nickname: null
          })
          .eq("key_code", memberCode)
          .eq("used_by_nickname", app.name || "");
      }

      return true;
    }

    if(rejectCount >= requiredCount){
      const rejectResult = await client
        .from("applications")
        .update({ status: "rejected" })
        .eq("id", applicationId)
        .eq("status", "pending")
        .select()
        .maybeSingle();

      if(rejectResult.error){
        console.error("入住申请不通过更新失败：", rejectResult.error);
        return false;
      }
      return true;
    }

    return false;

  }catch(err){
    console.error("finalizeMemberApplicationIfReady() 异常：", err);
    return false;
  }
}

async function voteMemberApplication(applicationId, voteValue){
  if(!isAdminRole(getRole())){
    showNotice("只有管理员可以投票。", "error");
    return;
  }

  if(isActionBusy("member", applicationId)) return;
  setActionBusy("member", applicationId, true);
  archiveLoaded = false;
  await loadAllApplications(true);

  try{
    const voter = await getCurrentMemberRecord();

    if(!voter?.id){
      showNotice("未读取到当前管理员信息，请重新登录。", "error");
      return;
    }

    const appInfo = await client
      .from("applications")
      .select("id, status")
      .eq("id", applicationId)
      .maybeSingle();

    if(appInfo.error || !appInfo.data){
      console.error("读取入住申请信息失败：", appInfo.error);
      showNotice("投票失败，请稍后再试。", "error");
      return;
    }

    if(String(appInfo.data.status || "").toLowerCase() !== "pending"){
      showNotice("这条入住申请已经结算。", "info");
      archiveLoaded = false;
      logsLoaded = false;
      await loadAllApplications(true);
      await loadRecentLogs(true);
      return;
    }

    const existing = await client
      .from("application_votes")
      .select("id, vote")
      .eq("application_id", applicationId)
      .eq("voter_member_id", voter.id)
      .maybeSingle();

    if(existing.error){
      console.error("检查入住申请投票记录失败：", existing.error);
      showNotice("投票失败，请稍后再试。", "error");
      return;
    }

    if(existing.data){
      const updateResult = await client
        .from("application_votes")
        .update({ vote: voteValue })
        .eq("id", existing.data.id);

      if(updateResult.error){
        console.error("更新入住申请投票失败：", updateResult.error);
        showNotice("投票失败，请稍后再试。", "error");
        return;
      }
    }else{
      const insertResult = await client
        .from("application_votes")
        .insert([{
          application_id: applicationId,
          voter_member_id: voter.id,
          vote: voteValue
        }]);

      if(insertResult.error){
        console.error("提交入住申请投票失败：", insertResult.error);
        showNotice("投票失败，请稍后再试。", "error");
        return;
      }
    }

    const finalized = await finalizeMemberApplicationIfReady(applicationId);

    archiveLoaded = false;
    logsLoaded = false;
    keyListLoaded = false;
    await loadAllApplications(true);
    await loadRecentLogs(true);
    if(activeAdminTab === "keys"){
      await loadKeyStorage(true);
    }

    showNotice(finalized ? "投票已结算。" : "投票已保存，结算前可继续修改。", finalized ? "success" : "info");

  }catch(err){
    console.error("voteMemberApplication() 异常：", err);
    showNotice("投票失败，请稍后再试。", "error");
  }finally{
    setActionBusy("member", applicationId, false);
    archiveLoaded = false;
    await loadAllApplications(true);
  }
}

async function finalizeAdminApplicationIfReady(applicationId, applicantMemberId){
  try{
    const appResult = await client
      .from("admin_applications")
      .select("id, member_id, status")
      .eq("id", applicationId)
      .maybeSingle();

    if(appResult.error || !appResult.data){
      console.error("读取宿管申请失败：", appResult.error);
      return false;
    }

    if(String(appResult.data.status || "").toLowerCase() !== "pending"){
      return true;
    }

    const voteResult = await client
      .from("admin_application_votes")
      .select("vote")
      .eq("application_id", applicationId);

    if(voteResult.error){
      console.error("读取宿管申请投票失败：", voteResult.error);
      return false;
    }

    const adminCount = await getAdminCount();
    const requiredCount = getRequiredVoteCount(adminCount);

    const votes = voteResult.data || [];
    const approveCount = votes.filter(v => v.vote === "approve").length;
    const rejectCount = votes.filter(v => v.vote === "reject").length;

    if(approveCount >= requiredCount){
      const updateApp = await client
        .from("admin_applications")
        .update({ status: "approved" })
        .eq("id", applicationId)
        .eq("status", "pending")
        .select()
        .maybeSingle();

      if(updateApp.error){
        console.error("更新宿管申请状态失败：", updateApp.error);
        return false;
      }

      if(updateApp.data){
        const updateMember = await client
          .from("members")
          .update({ role: "admin" })
          .eq("id", applicantMemberId);

        if(updateMember.error){
          console.error("更新成员身份失败：", updateMember.error);
          return false;
        }
      }

      return true;
    }

    if(rejectCount >= requiredCount){
      const updateApp = await client
        .from("admin_applications")
        .update({ status: "rejected" })
        .eq("id", applicationId)
        .eq("status", "pending")
        .select()
        .maybeSingle();

      if(updateApp.error){
        console.error("更新宿管申请状态失败：", updateApp.error);
        return false;
      }
      return true;
    }

    return false;

  }catch(err){
    console.error("finalizeAdminApplicationIfReady() 异常：", err);
    return false;
  }
}

    window.location.href = "manager-owner.html";
    return;
  }

  if(role === "member"){
    window.location.href = "manager-member.html";
    return;
  }

  if(role === "applying"){
    window.location.href = "manager-visitor.html";
    return;
  }

  if(role !== "admin"){
    window.location.href = "manager-visitor.html";
    return;
  }

  updateStatusUserUI();
  setAdminTab(activeAdminTab);
}
