<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十号房｜荣誉墙</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../room10-paths.js"></script>

<style>
*{box-sizing:border-box;}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:#5b4632;
  background:
    radial-gradient(circle at top left, #f7ead8 0%, transparent 36%),
    radial-gradient(circle at top right, #efe0c9 0%, transparent 38%),
    linear-gradient(180deg,#f7efe6 0%, #eadcc9 52%, #d9c4aa 100%);
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button{font-family:inherit;}

.hidden{display:none !important;}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#e7dfd4;
}

#stageFrame{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(100vw, calc(100vh * 2048 / 1143));
  height:min(100vh, calc(100vw * 1143 / 2048));
  overflow:hidden;
  z-index:0;
  --ui-scale:1;
  --bg-ui-scale:var(--ui-scale);
  --nav-gap:calc(8px * var(--ui-scale));
  --nav-btn-height:calc(40px * var(--ui-scale));
  --nav-btn-px:calc(16px * var(--ui-scale));
  --nav-btn-radius:calc(13px * var(--ui-scale));
  --nav-btn-font:calc(14px * var(--ui-scale));
  --switch-font-size:13.2px;
  --switch-ui-scale:1;
  --honor-text-scale:1;

  /* 当前页面坐标：荣誉墙只改这里 */
  --identity-right:1.25%;
  --identity-top:6.46%;
  --identity-width:calc(232px * var(--ui-scale));
  --identity-height:calc(38px * var(--ui-scale));

  --room-nav-left:43.95%;
  --room-nav-top:6.35%;
  --room-nav-width:42.6%;

  /* 页面可改颜色，不改结构尺寸 */
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);

  --nav-text:#6e4827;
  --nav-border:rgba(145,98,56,.34);
}


#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
  z-index:0;
}

#overlay{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}

#overlay *{pointer-events:auto;}

#bgShade{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(
      circle at center,
      rgba(0,0,0,0) 58%,
      rgba(210,186,160,0.10) 72%,
      rgba(190,160,130,0.16) 86%,
      rgba(170,138,108,0.22) 100%
    );
}

/* =========================================================
   全站统一房间切换按钮：使用客厅页满意版结构；荣誉墙页不显示“荣誉墙”按钮
========================================================= */
#topBar{
  position:absolute;
  left:var(--room-nav-left);
  top:var(--room-nav-top);
  width:var(--room-nav-width);
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:72;
  overflow:visible;
  pointer-events:none;

  --nav-btn-height:calc(40px * var(--ui-scale));
  --nav-btn-px:calc(16px * var(--ui-scale));
  --nav-btn-radius:calc(13px * var(--ui-scale));
  --nav-btn-font:calc(14px * var(--ui-scale));
  --nav-gap:calc(8px * var(--ui-scale));
}

#navOuter,
#navScroll{
  overflow:visible;
}

#navOuter{
  flex:0 0 auto;
  min-width:0;
  width:100%;
  pointer-events:auto;
}

#navScroll{
  width:100%;
  white-space:nowrap;
  padding:0;
  margin:0;
}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap);
  transform-origin:left center;
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height);
  padding:0 var(--nav-btn-px);
  border-radius:var(--nav-btn-radius);
  color:var(--nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid var(--nav-border);
  box-shadow:
    0 1px 1px rgba(255,255,255,.48) inset,
    0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease,
    filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:
    linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:
    0 1px 1px rgba(255,255,255,.55) inset,
    0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{
  position:relative;
  z-index:5;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  height:100%;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 1px 2px rgba(255,250,232,.82),
    0 0 8px rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{
  left:8%;
  top:-54%;
  font-size:calc(var(--nav-btn-font) * .92);
}

.navEffectB{
  right:8%;
  top:-62%;
  font-size:calc(var(--nav-btn-font) * .86);
}

.navEffectC{
  left:50%;
  top:-72%;
  transform:translateX(-50%);
  font-size:calc(var(--nav-btn-font) * 1.02);
}

@keyframes navFloatA{
  0%,100%{ transform:translateY(4px) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(-5px) rotate(6deg) scale(1); opacity:.76; }
}

@keyframes navFloatB{
  0%,100%{ transform:translateY(5px) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(-6px) rotate(-7deg) scale(1); opacity:.68; }
}

@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(6px) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(-6px) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:hover .navEffectA,
.navBtn:focus .navEffectA,
.navBtn:focus-visible .navEffectA,
.navBtn:active .navEffectA,
.navBtn.active .navEffectA,
.navBtn.isSelected .navEffectA,
.navBtn[aria-current="page"] .navEffectA{
  animation:navFloatA 2.2s ease-in-out infinite;
}

.navBtn:hover .navEffectB,
.navBtn:focus .navEffectB,
.navBtn:focus-visible .navEffectB,
.navBtn:active .navEffectB,
.navBtn.active .navEffectB,
.navBtn.isSelected .navEffectB,
.navBtn[aria-current="page"] .navEffectB{
  animation:navFloatB 2.5s ease-in-out infinite;
}

.navBtn:hover .navEffectC,
.navBtn:focus .navEffectC,
.navBtn:focus-visible .navEffectC,
.navBtn:active .navEffectC,
.navBtn.active .navEffectC,
.navBtn.isSelected .navEffectC,
.navBtn[aria-current="page"] .navEffectC{
  animation:navFloatC 2.35s ease-in-out infinite;
}

/* 各房间特效颜色 */
.navBtn[data-room="hall"] .navEffect{
  color:rgba(255,205,96,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.95),
    0 0 10px rgba(255,215,105,.62);
}

.navBtn[data-room="manager"] .navEffect{
  color:rgba(128,91,58,.82);
}

.navBtn[data-room="game"] .navEffect{
  color:rgba(117,91,150,.82);
}

.navBtn[data-room="studio"] .navEffect{
  color:rgba(96,112,145,.84);
}

.navBtn[data-room="living"] .navEffect{
  color:rgba(202,132,70,.82);
}

.navBtn[data-room="dorm"] .navEffect{
  color:rgba(143,111,168,.76);
}

.navBtn[data-room="pets"] .navEffect{
  color:rgba(131,111,78,.82);
}

.navBtn[data-room="flower"] .navEffect{
  color:rgba(198,119,145,.82);
}

/* =========================================================
   全站统一身份组件：参观者 / 昵称 | 身份 / 铃铛 / 登录登出
========================================================= */
#topActions{
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:var(--identity-width);
  height:var(--identity-height);
  min-width:0;
  min-height:0;
  z-index:82;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:var(--identity-bg);
  border:1px solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--ui-scale)) calc(24px * var(--ui-scale)) var(--identity-shadow),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:normal;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:.06em;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
  white-space:nowrap;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--ui-scale));
  top:calc(-6px * var(--ui-scale));
  min-width:calc(18px * var(--ui-scale));
  height:calc(18px * var(--ui-scale));
  padding:0 calc(5px * var(--ui-scale));
  border-radius:999px;
  background:#c98c4f;
  color:#fff9f1;
  font-size:calc(9px * var(--ui-scale));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--ui-scale)) solid rgba(255,248,239,0.98);
  box-shadow:0 2px 8px rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice #siteNoticeCount{
  display:flex;
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:min(calc(360px * var(--ui-scale)), 72vw);
  max-height:min(calc(540px * var(--ui-scale)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  background:rgba(255,249,241,0.98);
  border:1px solid rgba(203,167,123,0.28);
  box-shadow:0 16px 36px rgba(85,58,34,0.16);
  display:none;
  z-index:90;
  text-align:left;
}

#siteNoticePanel.show{
  display:block;
}

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--ui-scale));
  font-weight:900;
  margin-bottom:calc(10px * var(--ui-scale));
}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--ui-scale));
  line-height:1.6;
  padding:6px 2px 2px;
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--ui-scale));
}

.siteNoticeItem{
  padding:calc(10px * var(--ui-scale));
  border-radius:calc(12px * var(--ui-scale));
  background:rgba(255,252,247,0.82);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.92),
    0 2px 8px rgba(120,92,63,0.05);
}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1.5;
  margin-bottom:4px;
}

.siteNoticeItemDesc{
  color:#8a6644;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.55;
}

/* ===== 荣誉墙内部页面切换 ===== */
#panelSwitch{
  position:absolute;
  inset:0;
  z-index:34;
  pointer-events:none;
}

.switchBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:absolute;
  width:max(calc(76px * var(--switch-ui-scale)), 24px);
  height:max(calc(76px * var(--switch-ui-scale)), 24px);
  min-width:max(calc(76px * var(--switch-ui-scale)), 24px);
  min-height:max(calc(76px * var(--switch-ui-scale)), 24px);
  padding:0;
  border-radius:max(calc(17px * var(--switch-ui-scale)), 7px);
  background:rgba(255,248,239,0.92);
  border:1px solid rgba(186,146,103,0.26);
  color:#744b25;
  font-weight:850;
  line-height:1.08;
  letter-spacing:.02em;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 10px 22px rgba(116,86,54,0.12),
    inset 0 1px 0 rgba(255,255,255,0.88),
    inset 0 -2px 0 rgba(130,91,54,0.08);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:transform .18s ease, filter .18s ease, background .18s ease;
  pointer-events:auto;
  white-space:normal;
}

.switchBtn:hover{
  transform:translateY(-1px);
  filter:brightness(1.03);
  background:rgba(255,252,247,0.94);
}

#switchTitles{left:4.2%;top:4.55%;}
#switchGallery{left:34.55%;top:4.55%;}


/* ===== 排行榜面板基础结构 ===== */
#rankPanel{
  position:absolute;
  left:42.0%;
  top:16.8%;
  width:46.5%;
  height:73.5%;
  z-index:7;
  display:none;
  opacity:0;
  transform:translateX(-42px) translateY(8px) scale(.985);
  transition:opacity .34s ease, transform .38s cubic-bezier(.22,.8,.2,1);
  border-radius:calc(26px * var(--ui-scale));
  overflow:hidden;
  backdrop-filter:blur(18px) saturate(125%);
  -webkit-backdrop-filter:blur(18px) saturate(125%);
}

#rankPanel.show{display:block;opacity:1;transform:translateX(0) translateY(0) scale(1);}
#rankPanel.closing{opacity:0;transform:translateX(-30px) translateY(6px) scale(.985);}

#rankPanelInner{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
}

#rankClose{
  position:absolute;
  top:calc(12px * var(--ui-scale));
  right:calc(14px * var(--ui-scale));
  width:calc(28px * var(--ui-scale));
  height:calc(28px * var(--ui-scale));
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.62);
  color:#7b5635;
  font-size:calc(16px * var(--ui-scale));
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}

#rankClose:hover{background:rgba(255,255,255,.82);}

#trophyLabels{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

.label{
  position:absolute;
  transform:translate(-50%, -50%);
  min-width:44px;
  max-width:calc(150px * var(--ui-scale));
  font-size:calc(25px * var(--ui-scale));
  font-weight:800;
  color:#7a5432;
  white-space:nowrap;
  text-align:center;
  line-height:1.05;
  letter-spacing:.2px;
  text-shadow:0 1px 0 rgba(255,255,255,.45), 0 -1px 1px rgba(0,0,0,.12);
  overflow:hidden;
  text-overflow:ellipsis;
}

.label.multi{font-size:calc(19px * var(--ui-scale));}

#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:3;
}

.trophyRect{
  fill:rgba(255,255,255,0);
  stroke:rgba(255,255,255,0);
  stroke-width:.45;
  cursor:pointer;
  transition:fill .18s ease, stroke .18s ease, filter .18s ease;
  pointer-events:all;
}

.trophyRect:hover{
  fill:rgba(255,186,92,.14);
  stroke:rgba(255,178,76,.78);
  stroke-width:.75;
}

.trophyRect.active{
  fill:rgba(255,218,130,.26);
  stroke:#ffb24c;
  stroke-width:1.1;
  filter:drop-shadow(0 0 5px rgba(255,196,108,.85));
}

/* ===== 登录弹窗：首页同款登录框 ===== */
#loginUI{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#loginUI.show{
  display:flex;
}

.login-panel{
  position:relative;
  width:min(720px, 94vw);
}

.login-panel img{
  width:100%;
  display:block;
  pointer-events:none;
}

#username{
  position:absolute;
  top:40%;
  left:36.2%;
  width:27.5%;
  height:8.1%;
  border:none;
  outline:none;
  padding:0 10px;
  font-size:18px;
  color:#5b3e28;
  background:transparent;
  line-height:1.1;
}

#password{
  position:absolute;
  top:56%;
  left:36.2%;
  width:20%;
  height:8.1%;
  border:none;
  outline:none;
  padding:0 10px;
  font-size:18px;
  color:#5b3e28;
  background:transparent;
  line-height:1.1;
}

#togglePassword{
  position:absolute;
  top:56%;
  left:56%;
  width:8%;
  height:8.1%;
  border:none;
  cursor:pointer;
  background:rgba(255,215,120,.15);
  border-radius:6px;
}

#togglePassword:hover{
  background:rgba(255,215,120,.35);
  box-shadow:0 0 8px rgba(255,220,120,.6);
}

#loginSubmitBtn{
  position:absolute;
  top:68%;
  left:40%;
  width:20%;
  height:9%;
  border:none;
  background:transparent;
  cursor:pointer;
}

#registerLink{

<script>

const supabaseUrl = "https://tfevitwoqmxwaguvtyms.supabase.co";
const supabaseKey = "sb_publishable_0cFYhwx_9uEcrXnMJzzNMQ_cEng8xmI";
const client = window.supabase.createClient(supabaseUrl, supabaseKey);


function room10Url(path){
  const raw = String(path || "").trim();
  if(!raw) return "";
  if(/^(https?:|data:|blob:|mailto:|tel:|#|\/)/i.test(raw)) return raw;
  if(raw.startsWith("./") || raw.startsWith("../")) return raw;

  if(typeof window.room10Path === "function"){
    return window.room10Path(raw);
  }

  return `../${raw}`;
}

function room10PageUrl(key, fallbackPath){
  if(key && typeof window.room10Page === "function"){
    const url = window.room10Page(key);
    if(url) return url;
  }
  return room10Url(fallbackPath || "");
}

function room10AssetUrl(key, fallbackPath){
  if(key && typeof window.room10Asset === "function"){
    const url = window.room10Asset(key);
    if(url) return url;
  }
  return room10Url(fallbackPath || "");
}

const HONOR_PAGE_MAP = {
  "index.html":"index",
  "living.html":"living",
  "manager-visitor.html":"managerVisitor",
  "manager-owner.html":"managerOwner",
  "manager-admin.html":"managerAdmin",
  "manager-member.html":"managerMember",
  "studio-todo.html":"studioTodo",
  "game.html":"game",
  "dorm.html":"dorm",
  "flower.html":"flower",
  "pets.html":"pet",
  "honor.html":"honor",
  "honor-titles.html":"honorTitles",
  "honor-gallery.html":"honorGallery",
  "register.html":"managerRegister"
};

function resolveHonorPageUrl(target){
  const raw = String(target || "").trim();
  if(!raw) return "";
  if(/^(https?:|data:|blob:|mailto:|tel:|#|\/)/i.test(raw)) return raw;

  const hashIndex = raw.indexOf("#");
  const queryIndex = raw.indexOf("?");
  const splitIndex = [hashIndex, queryIndex].filter(i => i >= 0).sort((a,b) => a-b)[0];
  const base = splitIndex >= 0 ? raw.slice(0, splitIndex) : raw;
  const suffix = splitIndex >= 0 ? raw.slice(splitIndex) : "";
  const key = HONOR_PAGE_MAP[base] || "";

  if(key){
    return room10PageUrl(key, base) + suffix;
  }

  return room10Url(raw);
}

function applyHonorConfiguredAssets(){
  const bg = document.getElementById("bg");
  if(bg){
    const url = room10AssetUrl("honor.roomHonor", "honor/room-honor.png");
    if(url) bg.src = url;
  }

  const loginBg = document.getElementById("loginPanelBg");
  if(loginBg){
    const url = room10AssetUrl("root.login", "login.png");
    if(url) loginBg.src = url;
  }
}

function normalizeLoginInput(value){
  return String(value || "")
    .replace(/\u3000/g, " ")
    .trim();
}

function openLogin(){
  const loginUI = document.getElementById("loginUI");
  const msg = document.getElementById("loginMessage");

  if(msg){
    msg.innerText = "";
    msg.style.color = "#8b4a2d";
  }

  loginUI.classList.add("show");

  setTimeout(() => {
    const username = document.getElementById("username");
    if(username) username.focus();
  }, 30);
}

function closeLogin(){
  const loginUI = document.getElementById("loginUI");
  const msg = document.getElementById("loginMessage");

  if(loginUI) loginUI.classList.remove("show");
  if(msg) msg.innerText = "";
}

function goRegisterFromHonor(){
  sessionStorage.setItem("room10RegisterReturn", "honor.html");
  window.location.href = resolveHonorPageUrl("register.html?from=honor.html");
}

function togglePassword(){
  const p = document.getElementById("password");
  if(!p) return;
  p.type = (p.type === "password") ? "text" : "password";
}

async function login(){
  const nicknameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const msg = document.getElementById("loginMessage");

  const nickname = normalizeLoginInput(nicknameInput.value);
  const key = normalizeLoginInput(passwordInput.value);

  msg.innerText = "";
  msg.style.color = "#8b4a2d";

  if(!nickname || !key){
    msg.innerText = "还没填写完整呢";
    return;
  }

  try{
    const { data, error } = await client.rpc("verify_member_login", {
      input_nickname: nickname,
      input_code: key
    });

    if(error){
      console.error("KEY 登录失败：", error);
      msg.innerText = `登录检查失败：${error.message || "请稍后再试"}`;
      return;
    }

    if(!Array.isArray(data) || data.length === 0){
      msg.innerText = "没有找到你的记录哎";
      return;
    }

    const user = data[0] || {};

    localStorage.setItem("room10LoggedIn", "true");
    localStorage.setItem("room10User", user.nickname || nickname);
    localStorage.setItem("room10Role", user.role || "member");
    localStorage.setItem("room10MemberId", user.member_id || user.id || "");
    localStorage.setItem("room10MemberCode", key);

    let roleMessage = "登录成功";
    if(user.role === "owner"){
      roleMessage = "维修工已上线";
    }else if(user.role === "admin"){
      roleMessage = "宿管已上线";
    }else if(user.role === "member"){
      roleMessage = "房客已登录";
    }else if(user.role === "applying"){
      roleMessage = "当前身份为申请中";
    }

    msg.style.color = "#5f7d3a";
    msg.innerText = roleMessage;

    updateIdentity();
    syncHonorSeasonAwards();

    setTimeout(() => {
      nicknameInput.value = "";
      passwordInput.value = "";
      closeLogin();
    }, 650);
  }catch(e){
    console.error("login() 查询异常：", e);
    msg.style.color = "#8b4a2d";
    msg.innerText = `登录失败：${e?.message || "请稍后再试"}`;
  }
}

function enterRoom(page, needLogin){
  const targetPage = String(page || "").trim();
  if(!targetPage) return;

  if(needLogin && localStorage.getItem("room10LoggedIn") !== "true"){
    openLogin();
    return;
  }

  if((targetPage === "flower.html" || targetPage === "pets.html") && localStorage.getItem("room10LoggedIn") !== "true"){
    window.location.href = resolveHonorPageUrl(targetPage) + "?mode=guest";
    return;
  }

  window.location.href = resolveHonorPageUrl(targetPage);
}

function goRoom(url, needLogin = false){
  const target = String(url || "").trim();
  if(!target) return;

  const user = readStoredUser();

  if(needLogin && !user.loggedIn){
    sessionStorage.setItem("room10_pending_redirect", resolveHonorPageUrl(target));
    openLogin();
    return;
  }

  if((target === "flower.html" || target === "pets.html") && !user.loggedIn){
    window.location.href = resolveHonorPageUrl(target) + "?mode=guest";
    return;
  }

  window.location.href = resolveHonorPageUrl(target);
}

function goManagerRoom(){
  const user = readStoredUser();
  const role = String(user.role || "").trim().toLowerCase();

  if(!user.loggedIn){
    window.location.href = resolveHonorPageUrl("manager-visitor.html");
    return;
  }

  if(role === "owner" || role === "creator"){
    window.location.href = resolveHonorPageUrl("manager-owner.html");
    return;
  }

  if(role === "admin"){
    window.location.href = resolveHonorPageUrl("manager-admin.html");
    return;
  }

  window.location.href = resolveHonorPageUrl("manager-member.html");
}

const fallbackTrophyData = {

/* =========================================================
   荣誉墙赛季规则 + 十号房石耶耶自动同步
   页面显示正常统计说明；后台从 2026-07-01 起自动记录与结算。
   页面打开时：记录当前榜首快照，并结算已经结束的赛季。
========================================================= */
const HONOR_OFFICIAL_START_YEAR = 2026;
const HONOR_OFFICIAL_START_MONTH_INDEX = 6; // JS月份从0开始：6 = 7月

function getHonorSeasonInfo(date = new Date()){
  const officialStart = new Date(HONOR_OFFICIAL_START_YEAR, HONOR_OFFICIAL_START_MONTH_INDEX, 1);
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());

  if(d < officialStart){
    return {
      isOfficial:false,
      label:"测试期",
      rangeText:"正式赛季从 2026 年 7 月开始",
      startDate:officialStart,
      endDate:null
    };
  }

  const year = d.getFullYear();
  const month = d.getMonth();
  let startMonth = 0;

  if(month >= 0 && month <= 2){
    startMonth = 0;
  }else if(month >= 3 && month <= 5){
    startMonth = 3;
  }else if(month >= 6 && month <= 8){
    startMonth = 6;
  }else{
    startMonth = 9;
  }

  const startDate = new Date(year, startMonth, 1);
  const endDate = new Date(year, startMonth + 3, 0);
  const seasonNo = startMonth === 0 ? 1 : startMonth === 3 ? 2 : startMonth === 6 ? 3 : 4;

  return {
    isOfficial:true,
    label:`${year} 年第 ${seasonNo} 赛季`,
    rangeText:`${year} 年 ${startMonth + 1} 月 – ${endDate.getMonth() + 1} 月`,
    startDate,
    endDate
  };
}

function buildHonorSeasonSince(baseSince){
  const info = getHonorSeasonInfo();
  const normalSince = baseSince || "统计时间：按当前数据库实时统计";

  if(!info.isOfficial){
    return normalSince;
  }

  return `${info.label}｜${info.rangeText}｜每 3 个月为一季｜${normalSince}`;
}

   这里只负责展示，不改变铃铛、房间按钮、排行榜布局。
========================================================= */
const honorRewardQueue = [];
let honorRewardShowing = false;
let currentHonorReward = null;

function getHonorRewardShownKey(reward){
  const type = String(reward?.type || "title").trim() || "title";
  const code = String(reward?.code || reward?.name || "reward").trim();
  const memberId = String(reward?.memberId || readStoredUser().memberId || "guest").trim();
  const scope = String(reward?.scope || reward?.seasonKey || "global").trim();
  return `room10HonorRewardShown:${type}:${code}:${memberId}:${scope}`;
}

function hasShownHonorReward(reward){
  try{
    return localStorage.getItem(getHonorRewardShownKey(reward)) === "true";
  }catch(e){
    return false;
  }
}

function markHonorRewardShown(reward){
  try{
    localStorage.setItem(getHonorRewardShownKey(reward), "true");
  }catch(e){}
}

function normalizeHonorReward(reward){
  const type = String(reward?.type || "title").trim().toLowerCase();
  const isAchievement = type === "achievement" || type === "achieve";
  const name = String(reward?.name || "").trim();
  const desc = String(reward?.desc || reward?.description || "").trim();

  return {
    type:isAchievement ? "achievement" : "title",
    typeLabel:isAchievement ? "解锁成就" : "获得称号",
    icon:isAchievement ? "🏆" : "🏅",
    code:String(reward?.code || name || "reward").trim(),
    name:name || (isAchievement ? "新的成就" : "新的称号"),
    desc:desc || (isAchievement ? "新的成就已经记录到你的荣誉里。" : "新的称号已经记录到你的荣誉里。"),
    memberId:String(reward?.memberId || "").trim(),
    seasonKey:String(reward?.seasonKey || "").trim(),
    scope:String(reward?.scope || reward?.seasonKey || "global").trim()
  };
}

function enqueueHonorRewardModal(reward){
  const normalized = normalizeHonorReward(reward);
  if(hasShownHonorReward(normalized)) return;

  honorRewardQueue.push(normalized);
  if(!honorRewardShowing) showNextHonorRewardModal();
}

function showNextHonorRewardModal(){
  const ui = document.getElementById("honorRewardUI");
  const icon = document.getElementById("honorRewardIcon");
  const typeEl = document.getElementById("honorRewardType");
  const nameEl = document.getElementById("honorRewardName");
  const descEl = document.getElementById("honorRewardDesc");

  if(!ui || !icon || !typeEl || !nameEl || !descEl){
    honorRewardQueue.length = 0;
    honorRewardShowing = false;
    currentHonorReward = null;
    return;
  }

  const reward = honorRewardQueue.shift();
  if(!reward){
    honorRewardShowing = false;
    currentHonorReward = null;
    return;
  }

  currentHonorReward = reward;
  honorRewardShowing = true;

  closeSiteNoticePanel();

  icon.textContent = reward.icon;
  typeEl.textContent = reward.typeLabel;
  nameEl.textContent = `「${reward.name}」`;
  descEl.textContent = reward.desc;
  ui.classList.add("show");
}

function closeHonorRewardModal(){
  const ui = document.getElementById("honorRewardUI");

  if(currentHonorReward){
    markHonorRewardShown(currentHonorReward);
  }

  if(ui) ui.classList.remove("show");

  currentHonorReward = null;
  honorRewardShowing = false;

  setTimeout(showNextHonorRewardModal, 120);
}

function isMissingHonorSeasonRpcError(error){
  const message = String(error?.message || error?.details || error?.hint || "").toLowerCase();
  const code = String(error?.code || "").toLowerCase();
  const status = Number(error?.status || 0);

  return (
    status === 404 ||
    code === "404" ||
    code === "pgrst202" ||
    message.includes("could not find the function") ||
    message.includes("not found") ||
    message.includes("404")
  );
}

async function callHonorSeasonRpc(name){
  const result = await client.rpc(name);

  if(result?.error){
    throw result.error;
  }

  return result?.data;
}

async function syncHonorSeasonAwards(){
  if(!client || honorSeasonRpcUnavailable) return;

  /*
    7 月正式启用前不调用赛季 RPC。
    这样页面现在仍然正常显示实时排行榜，
    但不会因为后台结算函数尚未启用而在控制台刷 404。
  */
  if(!isHonorSeasonOfficialNow()) return;

  try{
    await callHonorSeasonRpc("honor_record_current_firsts");
    const data = await callHonorSeasonRpc("honor_settle_due_seasons");

    if(Array.isArray(data) && data.length){
      console.info("荣誉墙赛季称号结算结果：", data);
      enqueueSeasonTitleRewards(data);
    }
  }catch(err){
    if(isMissingHonorSeasonRpcError(err)){
      honorSeasonRpcUnavailable = true;
      console.warn("荣誉墙赛季结算函数尚未部署，已跳过本次后台同步：", err);
      return;
    }

    console.warn("荣誉墙赛季称号同步异常：", err);
  }
}

let trophyData = {};
let trophyDataReady = false;

const memberAvatarMap = new Map();
const memberNicknameMap = new Map();

function normalizeRankRows(rows){
  const mapped = (rows || [])
    .map(row => {
      const name = String(row.member_name || row.nickname || row.name || "").trim();
      const score = String(row.score_text || row.score || row.value || "").trim();
      const extraText = String(row.extra_text || "").trim();
      const projectName = String(row.project_name || row.source_title || "").trim();
      const memberId = String(row.member_id || "").trim();
      const sortOrder = Number(row.sort_order || 0);
      const avatarUrl = getAvatarUrlForName(name, memberId);

      return {
        name,
        score,
        sortOrder: Number.isFinite(sortOrder) && sortOrder > 0 ? sortOrder : null,
        memberId,
        avatarUrl,
        extraText,
        projectName
      };
    })
    .filter(item => item.name && item.score);

  const hasRealRank = mapped.some(item => item.sortOrder);
  if(hasRealRank){
    return mapped.filter(item => (item.sortOrder || 9999) <= 10);
  }

  return mapped.slice(0, 10);
}

function getMemberNameParts(name){
  return String(name || "")
    .split(/[×xX/、,，]/)
    .map(part => part.trim())
    .filter(Boolean);
}

function cleanImageUrl(value){
  const url = String(value || "").trim();
  if(!url) return "";

  const lower = url.toLowerCase();

  /*
    防止数据库或本地测试里存入 file:///C:/... 这类本机路径。
    浏览器会把它当成不安全的本地跨源加载，并在控制台报 Unsafe attempt。
  */
  if(
    lower.startsWith("file:") ||
    /^[a-z]:[\\/]/i.test(url) ||
    lower.startsWith("c:\\") ||
    lower.startsWith("c:/")
  ){
    return "";
  }

  return url;
}

function getAvatarUrlForName(name, memberId){
  if(memberId && memberAvatarMap.has(memberId)){
    return cleanImageUrl(memberAvatarMap.get(memberId));
  }

  const nameParts = getMemberNameParts(name);
  if(nameParts.length === 1 && memberNicknameMap.has(nameParts[0])){
    return cleanImageUrl(memberNicknameMap.get(nameParts[0])?.avatar_url);
  }

  return "";
}

function getAvatarSourcesForItem(item){
  const sources = [];

  if(item?.avatarUrl){
    sources.push({ name:item.name, avatarUrl:cleanImageUrl(item.avatarUrl) });
    return sources;
  }

  getMemberNameParts(item?.name).forEach(name => {
    const member = memberNicknameMap.get(name);
    sources.push({
      name,
      avatarUrl:cleanImageUrl(member?.avatar_url)
    });
  });

  if(!sources.length && item?.name){
    sources.push({ name:item.name, avatarUrl:"" });
  }

  return sources;
}

function renderAvatarStack(items){
  const sources = [];

  (items || []).forEach(item => {
    getAvatarSourcesForItem(item).forEach(source => {
      if(!sources.some(existing => existing.name === source.name && existing.avatarUrl === source.avatarUrl)){
        sources.push(source);
      }
    });
  });

  return sources.slice(0, 5).map(source => {
    const initial = String(source.name || "?").trim().slice(0, 1) || "?";
    if(source.avatarUrl){
      return `
        <span class="rankAvatar" title="${escapeHtml(source.name)}">
          <img src="${escapeHtml(source.avatarUrl)}" alt="${escapeHtml(source.name)}">
        </span>
      `;
    }

    return `<span class="rankAvatar" title="${escapeHtml(source.name)}">${escapeHtml(initial)}</span>`;
  }).join("");
}

function applyFallbackRanks(){
  trophyData = JSON.parse(JSON.stringify(fallbackTrophyData));
  trophyDataReady = true;
}

async function loadTrophyDataFromDatabase(){
  applyFallbackRanks();

  try{
    const [rankResult, memberResult] = await Promise.all([
      client
        .from("honor_live_rank_entries")
        .select("rank_key, sort_order, member_id, member_name, score_text, extra_text, project_name, note")
        .order("sort_order", { ascending:true })
        .order("member_name", { ascending:true }),
      client
        .from("members")
        .select("id, nickname, avatar_url")
    ]);

    if(memberResult.error){
      console.warn("成员头像读取失败，将使用姓名章：", memberResult.error);
    }else if(Array.isArray(memberResult.data)){
      memberAvatarMap.clear();
      memberNicknameMap.clear();

      memberResult.data.forEach(member => {
        const id = String(member.id || "").trim();
        const nickname = String(member.nickname || "").trim();
        const avatarUrl = cleanImageUrl(member.avatar_url);
        const cleanMember = { id, nickname, avatar_url:avatarUrl };

        if(id) memberAvatarMap.set(id, avatarUrl);
        if(nickname) memberNicknameMap.set(nickname, cleanMember);
      });
    }

    const { data, error } = rankResult;

    if(error){
      console.warn("荣誉墙实时榜单读取失败，已使用备用数据：", error);
      return;
    }

    if(!Array.isArray(data) || !data.length){
      return;
    }

    Object.entries(rankConfigs).forEach(([id, config]) => {
      const rows = data.filter(row => String(row.rank_key || "").trim() === config.key);
      const list = normalizeRankRows(rows);

      trophyData[id] = {
        title:config.title,
        desc:config.desc,
        since:config.since,
        list:list.length ? list : (fallbackTrophyData[id]?.list || [])
      };
    });

    trophyDataReady = true;
    renderPlaqueWinners();
  }catch(e){
    console.warn("荣誉墙实时榜单读取异常，已使用备用数据：", e);
  }
}

    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

function buildGroupedRanks(list){
  const groups = [];
  const groupMap = new Map();

  (list || []).forEach((item, index) => {
    const rankNo = item.sortOrder || (index + 1);
    const key = String(rankNo);

    if(!groupMap.has(key)){
      const group = {
        rankNo,
        items:[]
      };
      groupMap.set(key, group);
      groups.push(group);
    }

    groupMap.get(key).items.push(item);
  });

  return groups;
}

function cleanRangeExtraText(item){
  const name = String(item?.name || "").trim();
  let text = String(item?.extraText || "").trim();

  if(name && text.startsWith(name)){
    text = text.slice(name.length).trim();
  }

  return text;
}

function buildItemDetail(item){
  if(isRangeRank()){
    const parts = [];
    if(item?.projectName) parts.push(`《${item.projectName}》`);

    const rangeText = cleanRangeExtraText(item);
    if(rangeText) parts.push(rangeText);

    return parts.join("　");
  }

  const parts = [];
  if(item?.extraText) parts.push(item.extraText);
  if(item?.projectName) parts.push(`《${item.projectName}》`);
  return parts.join("　");
}

function splitGroupsIntoColumns(groups){
  const left = [];
  const right = [];
  let leftWeight = 0;
  let rightWeight = 0;

  (groups || []).forEach(group => {
    const weight = 1 + Math.max(1, group.items.length) * 0.72;

    if(leftWeight <= rightWeight){
      left.push(group);
      leftWeight += weight;
    }else{
      right.push(group);
      rightWeight += weight;
    }
  });

  return [left, right];
}

function renderRankGroup(group){
  const groupScore = String(group.items[0]?.score || "").trim();

  const rowsHtml = group.items.map(item => {
    const detail = buildItemDetail(item);
    const detailHtml = detail
      ? `<div class="rankPersonDetail">${escapeHtml(detail)}</div>`
      : "";

    return `
      <div class="rankPersonRow">
        <div class="rankPersonName">${escapeHtml(item.name)}</div>
        ${detailHtml}
      </div>
    `;
  }).join("");

  return `
    <div class="rankItem rankGroup ${group.items.length > 1 ? "hasTie" : "singleGroup"}">
      <div class="rankGroupHead">
        <span class="rankBadge">第 ${group.rankNo} 名</span>
        <span class="rankGroupScore">${escapeHtml(groupScore)}</span>
      </div>
      <div class="rankRows">${rowsHtml}</div>
    </div>
  `;
}

function buildChampionItemLabel(item){
  const name = String(item?.name || "").trim();
  const projectName = String(item?.projectName || "").trim();

  if(isRangeRank()){
    const parts = [];
    const nameAndSong = `${name}${projectName ? `《${projectName}》` : ""}`.trim();
    if(nameAndSong) parts.push(nameAndSong);

    const rangeText = cleanRangeExtraText(item);
    if(rangeText) parts.push(rangeText);

    return parts.join("　");
  }

  if(projectName){
    return `${name}《${projectName}》`;
  }

  return name;
}

function buildChampionExtraLine(items){
  if(isRangeRank()) return "";

  return (items || [])
    .map(item => {
      const name = String(item?.name || "").trim();
      const extraText = String(item?.extraText || "").trim();

      if(!extraText) return "";
      return name ? `${name} ${extraText}` : extraText;
    })
    .filter(Boolean)
    .join("　/　");
}

function renderChampion(groups){
  const topGroup = groups?.[0];
  if(!topGroup || !topGroup.items?.length) return "";

  const topTitle = topGroup.items
    .map(item => buildChampionItemLabel(item))
    .filter(Boolean)
    .join(" / ");
  const topScore = String(topGroup.items[0]?.score || "").trim();
  const topDetails = buildChampionExtraLine(topGroup.items);

  return `
    <div class="rankChampion">
      <div class="rankChampionMain">
        <div class="rankChampionKicker">榜首 · 第 ${topGroup.rankNo} 名</div>
        <div class="rankChampionTitle">${escapeHtml(topTitle)}</div>
        ${topDetails ? `<div class="rankChampionMeta">${escapeHtml(topDetails)}</div>` : ""}
      </div>
      <div class="rankChampionAvatars">${renderAvatarStack(topGroup.items)}</div>
      <div class="rankChampionScore">${escapeHtml(topScore)}</div>
    </div>
  `;
}

function isMobileRankLayout(){
  return window.matchMedia && window.matchMedia("(max-width:540px)").matches;
}

function renderRankList(list){
  rankList.innerHTML = "";

  if(!list || !list.length){
    rankList.innerHTML = '<div id="rankEmpty">当前还没有可展示的数据。</div>';
    return;
  }

  const groups = buildGroupedRanks(list);
  const boardGroups = groups.slice(1);
  let boardHtml = '<div id="rankEmpty">榜首之后暂无其他名次。</div>';

  if(boardGroups.length){
    if(isMobileRankLayout()){
      boardHtml = `
        <div class="rankBoard">
          <div class="rankColumn">${boardGroups.map(renderRankGroup).join("")}</div>
        </div>
      `;
    }else{
      const [leftGroups, rightGroups] = splitGroupsIntoColumns(boardGroups);
      boardHtml = `
        <div class="rankBoard">
          <div class="rankColumn">${leftGroups.map(renderRankGroup).join("")}</div>
          <div class="rankColumn">${rightGroups.map(renderRankGroup).join("")}</div>
        </div>
      `;
    }
  }

  rankList.innerHTML = `
    ${renderChampion(groups)}
    ${boardHtml}
  `;
}


function updateMascotGuide(data){
  if(!rankMascotText) return;
  rankMascotText.textContent = data?.desc || "我来给你讲讲这些奖杯～";
}

function openRankPanel(){
  clearTimeout(rankPanelHideTimer);
  rankPanel.classList.remove("closing");
  rankPanel.style.display = "block";

  requestAnimationFrame(() => {
    rankPanel.classList.add("show");
  });
}

function showTrophy(id){
  if(!trophyDataReady) applyFallbackRanks();
  const data = trophyData[id] || fallbackTrophyData[id];
  if(!data) return;

  currentTrophyId = id;
  setActiveTrophy(id);
  rankTitle.textContent = data.title;
  rankDesc.textContent = data.desc;
  rankSince.textContent = buildHonorSeasonSince(data.since);
  updateMascotGuide(data);
  renderRankList(data.list);
  openRankPanel();
}

function closeRank(){
  currentTrophyId = null;
  updateMascotGuide(null);
  clearActiveTrophies();
  rankPanel.classList.remove("show");
  rankPanel.classList.add("closing");

  rankPanelHideTimer = setTimeout(() => {
    rankPanel.classList.remove("closing");
    rankPanel.style.display = "none";
  }, 380);
}

function getPlaqueText(id){
  if(!trophyDataReady) applyFallbackRanks();
  const list = (trophyData[id] || fallbackTrophyData[id])?.list || [];
  if(!list.length) return "-";

  const first = list[0];
  if(!first || first.score === undefined || first.score === null) return "-";

  const topRank = first.sortOrder || 1;
  const topScore = String(first.score).trim();
  if(!topScore) return "-";

  const tiedNames = list
    .filter(item => {
      if(item.sortOrder) return item.sortOrder === topRank;
      return String(item.score).trim() === topScore;
    })
    .map(item => String(item.name || "").trim())
    .filter(Boolean);

  return tiedNames.length ? tiedNames.join("/") : "-";
}


function renderPlaqueWinners(){
  for(let i = 1; i <= 9; i++){
    const el = document.getElementById("label" + i);
    if(!el) continue;

    const text = getPlaqueText(i);
    el.textContent = text;

    if(text.includes("/") || text.includes("×") || text.length >= 6){
      el.classList.add("multi");
    }else{
      el.classList.remove("multi");
    }
  }
}

function readStoredUser(){
  return {
    nickname: localStorage.getItem("room10User") || "",
    role: localStorage.getItem("room10Role") || "",
    memberId: localStorage.getItem("room10MemberId") || "",
    loggedIn: localStorage.getItem("room10LoggedIn") === "true"
  };
}

function getRoleLabel(role){
  const map = {
    owner: "维修工",
    admin: "宿管",
    member: "房客",
    applying: "申请中",
    visitor: "参观者"
  };
  return map[String(role || "visitor").toLowerCase()] || "参观者";
}

function updateIdentity(){
  const currentUserText = document.getElementById("currentUserText");
  const loginOpenBtn = document.getElementById("loginOpenBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const user = readStoredUser();

  if(!currentUserText || !loginOpenBtn || !logoutBtn) return;

  if(user.loggedIn){
    currentUserText.textContent = `${user.nickname || "已登录"} | ${getRoleLabel(user.role)}`;
    loginOpenBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
  }else{
    currentUserText.textContent = "参观者";
    loginOpenBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
  }
}

function toggleSiteNoticePanel(){
  const panel = document.getElementById("siteNoticePanel");
  if(panel) panel.classList.toggle("show");
}

function closeSiteNoticePanel(){
  const panel = document.getElementById("siteNoticePanel");
  if(panel) panel.classList.remove("show");
}

function setNoticeCount(count){
  const siteNoticeBtn = document.getElementById("siteNoticeBtn");
  const siteNoticeCount = document.getElementById("siteNoticeCount");
  if(!siteNoticeBtn || !siteNoticeCount) return;

  const n = Number(count) || 0;
  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);
}

function renderNoticeList(items){
  const siteNoticeContent = document.getElementById("siteNoticeContent");
  const list = Array.isArray(items) ? items : [];
  if(!siteNoticeContent) return;

  if(!list.length){
    siteNoticeContent.innerHTML = '<div class="siteNoticeEmpty">暂无提醒。</div>';
    setNoticeCount(0);
    return;
  }

  siteNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => `
        <div class="siteNoticeItem">
          <div class="siteNoticeItemTitle">${escapeHtml(item.title || "提醒")}</div>
          <div class="siteNoticeItemDesc">${escapeHtml(item.desc || "")}</div>
        </div>
      `).join("")}
    </div>
  `;

  setNoticeCount(list.length);
}

function logoutRoom10(){
  [
    "room10LoggedIn",
    "room10User",
    "room10CurrentUser",
    "room10Member",
    "room10Role",
    "room10Nickname",
    "room10MemberId",
    "room10MemberCode",
    "room10ApplicantSession",
    "room10ApplicationDraft"
  ].forEach(key => localStorage.removeItem(key));

  updateIdentity();
  window.location.href = resolveHonorPageUrl("index.html");
}

function updateStageScale(){
  const stage = document.getElementById("stageFrame");
  const topBar = document.getElementById("topBar");
  const roomNav = document.getElementById("roomNav");
  if(!stage) return;

  const rect = stage.getBoundingClientRect();
  const rawScale = rect.width / 1440;
  const uiScale = Math.max(0.34, Math.min(3.20, rawScale));
  stage.style.setProperty("--ui-scale", uiScale.toFixed(3));
  stage.style.setProperty("--bg-ui-scale", uiScale.toFixed(3));

  const switchScale = Math.max(0.30, Math.min(1.60, rect.width / 2048));
  stage.style.setProperty("--switch-ui-scale", switchScale.toFixed(3));

  const switchFontSize = Math.max(9.8, Math.min(18.2, (rect.width / 2048) * 14.8));
  stage.style.setProperty("--switch-font-size", `${switchFontSize.toFixed(2)}px`);

  const honorTextScale = Math.max(0.58, Math.min(0.96, rect.width / 2048));
  stage.style.setProperty("--honor-text-scale", honorTextScale.toFixed(3));

  if(topBar && roomNav && rect.width > 540){
    roomNav.style.transform = "scale(1)";

    requestAnimationFrame(() => {
      const availableWidth = Math.max(1, topBar.clientWidth || topBar.getBoundingClientRect().width);
      const requiredWidth = Math.max(1, roomNav.scrollWidth || 1);
      const fit = Math.min(1, availableWidth / requiredWidth);
      roomNav.style.transform = fit < 1 ? `scale(${fit.toFixed(5)})` : "scale(1)";
    });
  }
}

function isPointInsideRect(x, y, rect){
  return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
}

function shouldAutoCloseNoticeForRoomNav(event){
  const panel = document.getElementById("siteNoticePanel");
  const topActions = document.getElementById("topActions");
  const topBar = document.getElementById("topBar");

  if(!panel || !topActions || !topBar) return false;
  if(!panel.classList.contains("show")) return false;
  if(window.matchMedia && window.matchMedia("(max-width: 540px)").matches) return false;

  const x = event.clientX;
  const y = event.clientY;
  const navRect = topBar.getBoundingClientRect();
  const identityRect = topActions.getBoundingClientRect();

  return isPointInsideRect(x, y, navRect) && !isPointInsideRect(x, y, identityRect);
}

document.addEventListener("pointermove", event => {
  if(shouldAutoCloseNoticeForRoomNav(event)){
    closeSiteNoticePanel();
  }
});

document.addEventListener("click", event => {
  if(!siteNoticePanel || !siteNoticeBtn) return;
  if(honorRewardUI && honorRewardUI.contains(event.target)) return;
