<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十号房｜荣誉墙</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../room10-paths.js"></script>

<style>
*{box-sizing:border-box;}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:#5b4632;
  background:
    radial-gradient(circle at top left, #f7ead8 0%, transparent 36%),
    radial-gradient(circle at top right, #efe0c9 0%, transparent 38%),
    linear-gradient(180deg,#f7efe6 0%, #eadcc9 52%, #d9c4aa 100%);
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button{font-family:inherit;}

.hidden{display:none !important;}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#e7dfd4;
}

#stageFrame{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(100vw, calc(100vh * 2048 / 1143));
  height:min(100vh, calc(100vw * 1143 / 2048));
  overflow:hidden;
  z-index:0;
  --ui-scale:1;
  --bg-ui-scale:var(--ui-scale);
  --room-nav-scale:var(--ui-scale);
  --room-nav-top:6.35%;
  --room-nav-left:43.95%;
  --room-nav-width:42.6%;
  --room-nav-height:5.10%;
  --room-nav-gap:calc(7px * var(--room-nav-scale));
  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);
  --switch-font-size:13.2px;
  --switch-ui-scale:1;
  --honor-text-scale:1;

  /* 当前页面坐标：荣誉墙只改这里 */
  --identity-right:1.25%;
  --identity-top:6.46%;
  --identity-width:calc(232px * var(--ui-scale));
  --identity-height:calc(38px * var(--ui-scale));


  /* 页面可改颜色，不改结构尺寸 */
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);

}


#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
  z-index:0;
}

#overlay{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}

#overlay *{pointer-events:auto;}

#bgShade{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(
      circle at center,
      rgba(0,0,0,0) 58%,
      rgba(210,186,160,0.10) 72%,
      rgba(190,160,130,0.16) 86%,
      rgba(170,138,108,0.22) 100%
    );
}

/* =========================================================
   房间切换：荣誉墙桌面端保留悬停显现，按钮使用全站通用模板样式
========================================================= */
#topBar{
  position:absolute;
  left:var(--room-nav-left);
  top:var(--room-nav-top);
  width:var(--room-nav-width);
  height:var(--room-nav-height);
  z-index:72;
  overflow:visible;
  pointer-events:none;
  --s:var(--room-nav-scale,1);
  --nav-btn-radius:calc(15px * var(--s));
  --nav-btn-font:calc(15px * var(--s));
  --nav-btn-border:calc(1px * var(--s));
}

#navOuter,
#navScroll,
#roomNav{
  width:100%;
  height:100%;
  min-width:0;
  margin:0;
  padding:0;
  overflow:visible;
}

#roomNav{
  display:grid;
  grid-template-columns:repeat(9,minmax(0,1fr));
  gap:var(--room-nav-gap);
  align-items:stretch;
}

.navBtn{
  appearance:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  padding:0;
  border-radius:var(--nav-btn-radius);
  color:var(--room-nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 22%,rgba(255,255,255,.56),transparent 40%),
    radial-gradient(circle at 78% 74%,var(--room-nav-wash),transparent 48%),
    linear-gradient(180deg,var(--room-nav-paper) 0%,var(--room-nav-paper-2) 100%);
  border:var(--nav-btn-border) solid var(--room-nav-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.64),
    0 calc(2px * var(--s)) calc(7px * var(--s)) rgba(96,70,48,.10);
  text-shadow:0 calc(1px * var(--s)) 0 rgba(255,255,255,.38);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  pointer-events:auto;
}

.navBtn:not(.is-current):hover,
.navBtn:not(.is-current):focus-visible{
  color:#5f3d22;
  background:
    radial-gradient(circle at 20% 24%,rgba(255,255,255,.66),transparent 42%),
    radial-gradient(circle at 80% 78%,rgba(207,170,143,.24),transparent 50%),
    linear-gradient(180deg,rgba(255,252,246,.88) 0%,rgba(239,226,210,.82) 100%);
  border-color:rgba(151,112,84,.36);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.70),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.12);
  filter:saturate(1.02);
}

.navBtn.is-current{
  cursor:default;
  color:var(--room-nav-current-text);
  background:
    radial-gradient(circle at 22% 22%,rgba(255,255,255,.62),transparent 42%),
    radial-gradient(circle at 80% 80%,rgba(190,151,126,.26),transparent 50%),
    linear-gradient(180deg,rgba(246,235,222,.94) 0%,var(--room-nav-current-bg) 100%);
  border-color:var(--room-nav-current-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.68),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.13),
    0 0 0 calc(2px * var(--s)) rgba(255,253,248,.46);
}

.navLabel{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.82),
    0 0 calc(8px * var(--s)) rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{transform:translateY(calc(4px * var(--s))) rotate(-8deg) scale(.82);opacity:0;}
  20%,72%{opacity:.86;}
  50%{transform:translateY(calc(-5px * var(--s))) rotate(6deg) scale(1);opacity:.76;}
}
@keyframes navFloatB{
  0%,100%{transform:translateY(calc(5px * var(--s))) rotate(9deg) scale(.78);opacity:0;}
  24%,70%{opacity:.78;}
  52%{transform:translateY(calc(-6px * var(--s))) rotate(-7deg) scale(1);opacity:.68;}
}
@keyframes navFloatC{
  0%,100%{transform:translateX(-50%) translateY(calc(6px * var(--s))) rotate(0deg) scale(.76);opacity:0;}
  24%,70%{opacity:.88;}
  50%{transform:translateX(-50%) translateY(calc(-6px * var(--s))) rotate(2deg) scale(1);opacity:.78;}
}

.navBtn:not(.is-current):hover .navEffectA,
.navBtn:not(.is-current):focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectB,
.navBtn:not(.is-current):focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectC,
.navBtn:not(.is-current):focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}
.navBtn.is-current .navEffect{display:none;}

.navBtn[data-room="hall"] .navEffect{color:rgba(255,205,96,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.95),0 0 calc(10px * var(--s)) rgba(255,215,105,.62);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="honor"] .navEffect{color:rgba(205,143,45,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.92),0 0 calc(8px * var(--s)) rgba(255,220,130,.52);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}

/* =========================================================
   全站统一身份组件：参观者 / 昵称 | 身份 / 铃铛 / 登录登出
========================================================= */
#topActions{
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:var(--identity-width);
  height:var(--identity-height);
  min-width:0;
  min-height:0;
  z-index:82;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:var(--identity-bg);
  border:1px solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--ui-scale)) calc(24px * var(--ui-scale)) var(--identity-shadow),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:normal;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:.06em;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
  white-space:nowrap;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--ui-scale));
  top:calc(-6px * var(--ui-scale));
  min-width:calc(18px * var(--ui-scale));
  height:calc(18px * var(--ui-scale));
  padding:0 calc(5px * var(--ui-scale));
  border-radius:999px;
  background:#c98c4f;
  color:#fff9f1;
  font-size:calc(9px * var(--ui-scale));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--ui-scale)) solid rgba(255,248,239,0.98);
  box-shadow:0 2px 8px rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice #siteNoticeCount{
  display:flex;
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:min(calc(360px * var(--ui-scale)), 72vw);
  max-height:min(calc(540px * var(--ui-scale)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  background:rgba(255,249,241,0.98);
  border:1px solid rgba(203,167,123,0.28);
  box-shadow:0 16px 36px rgba(85,58,34,0.16);
  display:none;
  z-index:90;
  text-align:left;
}

#siteNoticePanel.show{
  display:block;
}

.siteNoticeHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:calc(8px * var(--ui-scale));
  margin-bottom:calc(10px * var(--ui-scale));
}

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--ui-scale));
  font-weight:900;
}

#siteNoticeClear{
  appearance:none;
  border:0;
  padding:0;
  color:#9a7453;
  background:transparent;
  font-size:calc(10px * var(--ui-scale));
  font-weight:850;
  cursor:pointer;
}

#siteNoticeClear:disabled{
  opacity:.45;
  cursor:default;
}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--ui-scale));
  line-height:1.6;
  padding:6px 2px 2px;
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--ui-scale));
}

.siteNoticeItem{
  padding:calc(10px * var(--ui-scale));
  border-radius:calc(12px * var(--ui-scale));
  background:rgba(255,252,247,0.82);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.92),
    0 2px 8px rgba(120,92,63,0.05);
}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1.5;
  margin-bottom:4px;
}

.siteNoticeItemDesc{
  color:#8a6644;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.55;
}

/* ===== 荣誉墙内部页面切换 ===== */
#panelSwitch{
  position:absolute;
  inset:0;
  z-index:34;
  pointer-events:none;
}

.switchBtn{
  appearance:none;
  cursor:pointer;
  position:absolute;
  width:max(calc(76px * var(--switch-ui-scale)), 24px);
  height:max(calc(76px * var(--switch-ui-scale)), 24px);
  min-width:max(calc(76px * var(--switch-ui-scale)), 24px);
  min-height:max(calc(76px * var(--switch-ui-scale)), 24px);
  padding:0;
  border-radius:max(calc(17px * var(--switch-ui-scale)), 7px);
  background:rgba(255,248,239,0.92);
  border:1px solid rgba(186,146,103,0.26);
  color:#744b25;
  font-weight:850;
  line-height:1.08;
  letter-spacing:.02em;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 10px 22px rgba(116,86,54,0.12),
    inset 0 1px 0 rgba(255,255,255,0.88),
    inset 0 -2px 0 rgba(130,91,54,0.08);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:transform .18s ease, filter .18s ease, background .18s ease;
  pointer-events:auto;
  white-space:normal;
  font-size:var(--switch-font-size);
  word-break:keep-all;
  overflow-wrap:normal;
}

.switchBtn:hover{
  transform:translateY(-1px);
  filter:brightness(1.03);
  background:rgba(255,252,247,0.94);
}

#switchTitles{left:4.2%;top:4.55%;}
#switchGallery{left:34.55%;top:4.55%;}


/* ===== 排行榜面板基础结构 ===== */
#rankPanel{
  position:absolute;
  left:42.0%;
  top:16.8%;
  width:46.5%;
  height:73.5%;
  z-index:7;
  display:none;
  opacity:0;
  transform:translateX(-42px) translateY(8px) scale(.985);
  transition:opacity .34s ease, transform .38s cubic-bezier(.22,.8,.2,1);
  border-radius:calc(26px * var(--ui-scale));
  overflow:hidden;
  backdrop-filter:blur(18px) saturate(125%);
  -webkit-backdrop-filter:blur(18px) saturate(125%);
}

#rankPanel.show{display:block;opacity:1;transform:translateX(0) translateY(0) scale(1);}
#rankPanel.closing{opacity:0;transform:translateX(-30px) translateY(6px) scale(.985);}

#rankPanelInner{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
}

#rankClose{
  position:absolute;
  top:calc(12px * var(--ui-scale));
  right:calc(14px * var(--ui-scale));
  width:calc(28px * var(--ui-scale));
  height:calc(28px * var(--ui-scale));
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.62);
  color:#7b5635;
  font-size:calc(16px * var(--ui-scale));
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}

#rankClose:hover{background:rgba(255,255,255,.82);}

#trophyLabels{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

.label{
  position:absolute;
  transform:translate(-50%, -50%);
  min-width:44px;
  max-width:calc(150px * var(--ui-scale));
  font-size:calc(25px * var(--ui-scale));
  font-weight:800;
  color:#7a5432;
  white-space:nowrap;
  text-align:center;
  line-height:1.05;
  letter-spacing:.2px;
  text-shadow:0 1px 0 rgba(255,255,255,.45), 0 -1px 1px rgba(0,0,0,.12);
  overflow:hidden;
  text-overflow:ellipsis;
}

.label.multi{font-size:calc(19px * var(--ui-scale));}

#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:3;
}

/* 奖杯热区：保留一套最终样式，避免重复覆盖 */
.trophyRect,
#map rect{
  fill:rgba(255,255,255,0) !important;
  stroke:rgba(255,255,255,0) !important;
  stroke-width:.45;
  cursor:pointer;
  transition:fill .18s ease, stroke .18s ease, filter .18s ease;
  pointer-events:all;
}

.trophyRect:hover{
  fill:rgba(255,186,92,.14) !important;
  stroke:rgba(255,178,76,.78) !important;
  stroke-width:.75;
}

.trophyRect.active{
  fill:rgba(255,218,130,.26) !important;
  stroke:#ffb24c !important;
  stroke-width:1.1;
  filter:drop-shadow(0 0 5px rgba(255,196,108,.85));
}

/* ===== 登录弹窗：首页同款登录框 ===== */
#loginUI{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#loginUI.show{
  display:flex;
}

function room10Url(path){
  const raw = String(path || "").trim();
  if(!raw) return "";
  if(/^(https?:|data:|blob:|mailto:|tel:|#|\/)/i.test(raw)) return raw;
  if(raw.startsWith("./") || raw.startsWith("../")) return raw;

  if(typeof window.room10Path === "function"){
    return window.room10Path(raw);
  }

  return `../${raw}`;
}

function room10PageUrl(key, fallbackPath){
  if(key && typeof window.room10Page === "function"){

  return room10Url(fallbackPath || "");
}

function room10AssetUrl(key, fallbackPath){

function resolveHonorPageUrl(target){
  const raw = String(target || "").trim();
  if(!raw) return "";
  if(/^(https?:|data:|blob:|mailto:|tel:|#|\/)/i.test(raw)) return raw;

  const hashIndex = raw.indexOf("#");
  const queryIndex = raw.indexOf("?");
  const splitIndex = [hashIndex, queryIndex].filter(i => i >= 0).sort((a,b) => a-b)[0];
  const base = splitIndex >= 0 ? raw.slice(0, splitIndex) : raw;
  const suffix = splitIndex >= 0 ? raw.slice(splitIndex) : "";
  const key = HONOR_PAGE_MAP[base] || "";

  if(key){
    return room10PageUrl(key, base) + suffix;
  }

  return room10Url(raw);
}

let rankConfigs = {};

function parseLocalDate(dateText){
  const raw = String(dateText || "").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return null;
  const [year, month, day] = raw.split("-").map(Number);
  const date = new Date(year, month - 1, day);
  return Number.isNaN(date.getTime()) ? null : date;
}

function getHonorSeasonInfo(date = new Date()){
  const officialStart = parseLocalDate(honorRankSettings?.official_start_date);
  const seasonMonths = Math.max(1, Number(honorRankSettings?.season_months || 3));

  if(!officialStart){
    return null;
  }

  const current = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  if(current < officialStart){
    return {
      isOfficial:false,
      label:String(honorRankSettings?.prelaunch_label || "测试期"),
      rangeText:String(honorRankSettings?.prelaunch_text || ""),
      seasonMonths,
      startDate:officialStart,
      endDate:null
    };
  }

  const year = current.getFullYear();
  const month = current.getMonth();
  const startMonth = Math.floor(month / seasonMonths) * seasonMonths;
  const startDate = new Date(year, startMonth, 1);
  const endDate = new Date(year, startMonth + seasonMonths, 0);
  const seasonNo = Math.floor(startMonth / seasonMonths) + 1;

  return {
    isOfficial:true,
    label:`${year} 年第 ${seasonNo} 赛季`,
    rangeText:`${year} 年 ${startMonth + 1} 月 – ${endDate.getMonth() + 1} 月`,
    seasonMonths,
    startDate,
    endDate
  };
}

function buildHonorSeasonSince(baseSince){
  const normalSince = String(baseSince || "统计时间：按当前数据库实时统计");
  const info = getHonorSeasonInfo();

  if(!info) return normalSince;
  if(!info.isOfficial){
    return [info.label, info.rangeText, normalSince].filter(Boolean).join("｜");
  }

  return `${info.label}｜${info.rangeText}｜每 ${info.seasonMonths} 个月为一季｜${normalSince}`;
}

const memberAvatarMap = new Map();
const memberNicknameMap = new Map();

function normalizeRankRows(rows){
  const mapped = (rows || [])
    .map(row => {
      const name = String(row.member_name || row.nickname || row.name || "").trim();
      const score = String(row.score_text || row.score || row.value || "").trim();
      const extraText = String(row.extra_text || "").trim();
      const projectName = String(row.project_name || row.source_title || "").trim();
      const memberId = String(row.member_id || "").trim();
      const sortOrder = Number(row.sort_order || 0);
      const avatarUrl = getAvatarUrlForName(name, memberId);

      return {
        name,
        score,
        sortOrder: Number.isFinite(sortOrder) && sortOrder > 0 ? sortOrder : null,
        memberId,
        avatarUrl,
        extraText,
        projectName
      };
    })
    .filter(item => item.name && item.score);

  const hasRealRank = mapped.some(item => item.sortOrder);
  if(hasRealRank){
    return mapped.filter(item => (item.sortOrder || 9999) <= 10);
  }

  return mapped.slice(0, 10);
}

function getMemberNameParts(name){
  return String(name || "")
    .split(/[×xX/、,，]/)
    .map(part => part.trim())
    .filter(Boolean);
}

function cleanImageUrl(value){
  const url = String(value || "").trim();
  if(!url) return "";

  const lower = url.toLowerCase();

  /*
    防止数据库或本地测试里存入 file:///C:/... 这类本机路径。
    浏览器会把它当成不安全的本地跨源加载，并在控制台报 Unsafe attempt。
  */
  if(
    lower.startsWith("file:") ||
    /^[a-z]:[\\/]/i.test(url) ||
    lower.startsWith("c:\\") ||
    lower.startsWith("c:/")
  ){
    return "";
  }

  return url;
}

function getAvatarUrlForName(name, memberId){
  if(memberId && memberAvatarMap.has(memberId)){
    return cleanImageUrl(memberAvatarMap.get(memberId));
  }

  const nameParts = getMemberNameParts(name);
  if(nameParts.length === 1 && memberNicknameMap.has(nameParts[0])){
    return cleanImageUrl(memberNicknameMap.get(nameParts[0])?.avatar_url);
  }

  return "";
}

function getAvatarSourcesForItem(item){
  const sources = [];

  if(item?.avatarUrl){
    sources.push({ name:item.name, avatarUrl:cleanImageUrl(item.avatarUrl) });
    return sources;
  }

  getMemberNameParts(item?.name).forEach(name => {
    const member = memberNicknameMap.get(name);
    sources.push({
      name,
      avatarUrl:cleanImageUrl(member?.avatar_url)
    });
  });

  if(!sources.length && item?.name){
    sources.push({ name:item.name, avatarUrl:"" });
  }

  return sources;
}

function renderAvatarStack(items){
  const sources = [];

  (items || []).forEach(item => {
    getAvatarSourcesForItem(item).forEach(source => {
      if(!sources.some(existing => existing.name === source.name && existing.avatarUrl === source.avatarUrl)){
        sources.push(source);
      }
    });
  });

  return sources.slice(0, 5).map(source => {
    const initial = String(source.name || "?").trim().slice(0, 1) || "?";
    if(source.avatarUrl){
      return `
        <span class="rankAvatar" title="${escapeHtml(source.name)}">
          <img src="${escapeHtml(source.avatarUrl)}" alt="${escapeHtml(source.name)}">
        </span>
      `;
    }

    return `<span class="rankAvatar" title="${escapeHtml(source.name)}">${escapeHtml(initial)}</span>`;
  }).join("");
}

    const { data, error } = await client
      .from("honor_live_rank_entries")
      .select("rank_key, sort_order, member_id, member_name, score_text, extra_text, project_name")
      .order("sort_order", { ascending:true })
      .order("member_name", { ascending:true });

    if(error){
      console.warn("荣誉墙实时榜单读取失败：", error);
      return;
    }

    if(!Array.isArray(data) || !data.length){
      return;
    }

    memberAvatarMap.clear();
    memberNicknameMap.clear();

    const memberIds = [...new Set(data.map(row => String(row.member_id || "").trim()).filter(Boolean))];
    const nicknames = [...new Set(data.flatMap(row => getMemberNameParts(row.member_name)).filter(Boolean))];

    if(memberIds.length || nicknames.length){
      const { data:memberRows, error:memberError } = await client.rpc(
        "get_public_member_profiles",
        {
          p_member_ids:memberIds,
          p_nicknames:nicknames
        }
      );

      if(memberError){
        console.warn("成员头像读取失败，将使用姓名章：", memberError);
      }else{
        (memberRows || []).forEach(member => {
          const id = String(member.member_id || "").trim();
          const nickname = String(member.nickname || "").trim();
          const avatarUrl = cleanImageUrl(member.avatar_url);
          const cleanMember = { id, nickname, avatar_url:avatarUrl };
          if(id) memberAvatarMap.set(id, avatarUrl);
          if(nickname) memberNicknameMap.set(nickname, cleanMember);
        });
      }
    }

    Object.entries(rankConfigs).forEach(([id, config]) => {
      const rows = data.filter(row => String(row.rank_key || "").trim() === config.key);
      const list = normalizeRankRows(rows);

      trophyData[id] = {
        title:config.title,
        desc:config.desc,
        since:config.since,
        list:list
      };
    });

    trophyDataReady = true;
    renderPlaqueWinners();
  }catch(e){
    console.warn("荣誉墙实时榜单读取异常：", e);
  }
}


const rankPanel = document.getElementById("rankPanel");
const rankTitle = document.getElementById("rankTitle");
const rankDesc = document.getElementById("rankDesc");
const rankSince = document.getElementById("rankSince");
const rankList = document.getElementById("rankList");
const rankMascotText = document.getElementById("rankMascotText");
const trophyRects = document.querySelectorAll(".trophyRect");
let rankPanelHideTimer = null;
let currentTrophyId = null;

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function clearActiveTrophies(){
  trophyRects.forEach(rect => rect.classList.remove("active"));
}

function setActiveTrophy(id){
  clearActiveTrophies();
  const target = document.getElementById("trophy" + id);
  if(target) target.classList.add("active");
}

function buildGroupedRanks(list){
  const groups = [];
  const groupMap = new Map();

  (list || []).forEach((item, index) => {
    const rankNo = item.sortOrder || (index + 1);
    const key = String(rankNo);

    if(!groupMap.has(key)){
      const group = {
        rankNo,
        items:[]
      };
      groupMap.set(key, group);
      groups.push(group);
    }

    groupMap.get(key).items.push(item);
  });

  return groups;
}

function isRangeRank(){
  return Number(currentTrophyId) === 3;
}

function cleanRangeExtraText(item){
  const name = String(item?.name || "").trim();
  let text = String(item?.extraText || "").trim();

  if(name && text.startsWith(name)){
    text = text.slice(name.length).trim();
  }

  return text;
}

function buildItemDetail(item){
  if(isRangeRank()){
    const parts = [];
    if(item?.projectName) parts.push(`《${item.projectName}》`);

    const rangeText = cleanRangeExtraText(item);
    if(rangeText) parts.push(rangeText);

    return parts.join("　");
  }

  const parts = [];
  if(item?.extraText) parts.push(item.extraText);
  if(item?.projectName) parts.push(`《${item.projectName}》`);
  return parts.join("　");
}

function splitGroupsIntoColumns(groups){
  const left = [];
  const right = [];
  let leftWeight = 0;
  let rightWeight = 0;

  (groups || []).forEach(group => {
    const weight = 1 + Math.max(1, group.items.length) * 0.72;

    if(leftWeight <= rightWeight){
      left.push(group);
      leftWeight += weight;
    }else{
      right.push(group);
      rightWeight += weight;
    }
  });

  return [left, right];
}

function renderRankGroup(group){
  const groupScore = String(group.items[0]?.score || "").trim();

  const rowsHtml = group.items.map(item => {
    const detail = buildItemDetail(item);
    const detailHtml = detail
      ? `<div class="rankPersonDetail">${escapeHtml(detail)}</div>`
      : "";

    return `
      <div class="rankPersonRow">
        <div class="rankPersonName">${escapeHtml(item.name)}</div>
        ${detailHtml}
      </div>
    `;
  }).join("");

  return `
    <div class="rankItem rankGroup ${group.items.length > 1 ? "hasTie" : "singleGroup"}">
      <div class="rankGroupHead">
        <span class="rankBadge">第 ${group.rankNo} 名</span>
        <span class="rankGroupScore">${escapeHtml(groupScore)}</span>
      </div>
      <div class="rankRows">${rowsHtml}</div>
    </div>
  `;
}

function buildChampionItemLabel(item){
  const name = String(item?.name || "").trim();
  const projectName = String(item?.projectName || "").trim();

  if(isRangeRank()){
    const parts = [];
    const nameAndSong = `${name}${projectName ? `《${projectName}》` : ""}`.trim();
    if(nameAndSong) parts.push(nameAndSong);

    const rangeText = cleanRangeExtraText(item);
    if(rangeText) parts.push(rangeText);

    return parts.join("　");
  }

  if(projectName){
    return `${name}《${projectName}》`;
  }

  return name;
}

function buildChampionExtraLine(items){
  if(isRangeRank()) return "";

  return (items || [])
    .map(item => {
      const name = String(item?.name || "").trim();
      const extraText = String(item?.extraText || "").trim();

      if(!extraText) return "";
      return name ? `${name} ${extraText}` : extraText;
    })
    .filter(Boolean)
    .join("　/　");
}

function renderChampion(groups){
  const topGroup = groups?.[0];
  if(!topGroup || !topGroup.items?.length) return "";

  const topTitle = topGroup.items
    .map(item => buildChampionItemLabel(item))
    .filter(Boolean)
    .join(" / ");
  const topScore = String(topGroup.items[0]?.score || "").trim();
  const topDetails = buildChampionExtraLine(topGroup.items);

  return `
    <div class="rankChampion">
      <div class="rankChampionMain">
        <div class="rankChampionKicker">榜首 · 第 ${topGroup.rankNo} 名</div>
        <div class="rankChampionTitle">${escapeHtml(topTitle)}</div>
        ${topDetails ? `<div class="rankChampionMeta">${escapeHtml(topDetails)}</div>` : ""}
      </div>
      <div class="rankChampionAvatars">${renderAvatarStack(topGroup.items)}</div>
      <div class="rankChampionScore">${escapeHtml(topScore)}</div>
    </div>
  `;
}

function isMobileRankLayout(){
  return window.matchMedia && window.matchMedia("(max-width:540px)").matches;
}

function renderRankList(list){
  rankList.innerHTML = "";

  if(!list || !list.length){
    rankList.innerHTML = '<div class="rankEmpty">当前还没有可展示的数据。</div>';
    return;
  }

  const groups = buildGroupedRanks(list);
  const boardGroups = groups.slice(1);
  let boardHtml = '<div class="rankEmpty">榜首之后暂无其他名次。</div>';

  if(boardGroups.length){
    if(isMobileRankLayout()){
      boardHtml = `
        <div class="rankBoard">
          <div class="rankColumn">${boardGroups.map(renderRankGroup).join("")}</div>
        </div>
      `;
    }else{
      const [leftGroups, rightGroups] = splitGroupsIntoColumns(boardGroups);
      boardHtml = `
        <div class="rankBoard">
          <div class="rankColumn">${leftGroups.map(renderRankGroup).join("")}</div>
          <div class="rankColumn">${rightGroups.map(renderRankGroup).join("")}</div>
        </div>
      `;
    }
  }

  rankList.innerHTML = `
    ${renderChampion(groups)}
    ${boardHtml}
  `;
}


function updateMascotGuide(data){
  if(!rankMascotText) return;
  rankMascotText.textContent = data?.desc || "我来给你讲讲这些奖杯～";
}

function openRankPanel(){
  clearTimeout(rankPanelHideTimer);
  rankPanel.classList.remove("closing");
  rankPanel.style.display = "block";

  requestAnimationFrame(() => {
    rankPanel.classList.add("show");
  });
}

function showTrophy(id){
  if(!trophyDataReady) return;
  const data = trophyData[id];
  if(!data) return;

  currentTrophyId = id;
  setActiveTrophy(id);
  rankTitle.textContent = data.title;
  rankDesc.textContent = data.desc;
  rankSince.textContent = buildHonorSeasonSince(data.since);
  updateMascotGuide(data);
  renderRankList(data.list);
  openRankPanel();
}

function closeRank(){
  currentTrophyId = null;
  updateMascotGuide(null);
  clearActiveTrophies();
  rankPanel.classList.remove("show");
  rankPanel.classList.add("closing");

  rankPanelHideTimer = setTimeout(() => {
    rankPanel.classList.remove("closing");
    rankPanel.style.display = "none";
  }, 380);
}

function getPlaqueText(id){
  if(!trophyDataReady) return;
  const list = trophyData[id]?.list || [];
  if(!list.length) return "-";

  const first = list[0];
  if(!first || first.score === undefined || first.score === null) return "-";

  const topRank = first.sortOrder || 1;
  const topScore = String(first.score).trim();
  if(!topScore) return "-";

  const tiedNames = list
    .filter(item => {
      if(item.sortOrder) return item.sortOrder === topRank;
      return String(item.score).trim() === topScore;
    })
    .map(item => String(item.name || "").trim())
    .filter(Boolean);

  return tiedNames.length ? tiedNames.join("/") : "-";
}


function renderPlaqueWinners(){
  for(let i = 1; i <= 9; i++){
    const el = document.getElementById("label" + i);
    if(!el) continue;

    const text = getPlaqueText(i);
    el.textContent = text;

    if(text.includes("/") || text.includes("×") || text.length >= 6){
      el.classList.add("multi");
    }else{
      el.classList.remove("multi");
    }
  }
}

function readStoredUser(){
  return {
    nickname:localStorage.getItem("room10User") || "",
    role:localStorage.getItem("room10Role") || "",
    memberId:localStorage.getItem("room10MemberId") || "",
    memberCode:localStorage.getItem("room10MemberCode") || "",
    loggedIn:localStorage.getItem("room10LoggedIn") === "true"
  };
}

function getRoleLabel(role){
  const map = {
    owner: "维修工",
    admin: "宿管",
    member: "房客",
    trainee: "练习生",
    applying: "申请中",
    visitor: "参观者"
  };
  return map[String(role || "visitor").toLowerCase()] || "参观者";
}

function updateIdentity(){
  const currentUserText = document.getElementById("currentUserText");
  const loginOpenBtn = document.getElementById("loginOpenBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const user = readStoredUser();

  if(!currentUserText || !loginOpenBtn || !logoutBtn) return;

  if(user.loggedIn){
    currentUserText.textContent = `${user.nickname || "已登录"} | ${getRoleLabel(user.role)}`;
    loginOpenBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
  }else{
    currentUserText.textContent = "参观者";
    loginOpenBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    renderNoticeList([]);
  }
}

function toggleSiteNoticePanel(){
  const panel = document.getElementById("siteNoticePanel");
  if(panel) panel.classList.toggle("show");
}

function closeSiteNoticePanel(){
  const panel = document.getElementById("siteNoticePanel");
  if(panel) panel.classList.remove("show");
}

function setNoticeCount(count){
  const siteNoticeBtn = document.getElementById("siteNoticeBtn");
  const siteNoticeCount = document.getElementById("siteNoticeCount");
  if(!siteNoticeBtn || !siteNoticeCount) return;

  const n = Number(count) || 0;
  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);
}

function formatNoticeTime(value){
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "";
  return date.toLocaleString("zh-CN", {
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  });
}

let currentNoticeIds = [];

function renderNoticeList(items){
  const siteNoticeContent = document.getElementById("siteNoticeContent");
  const siteNoticeClear = document.getElementById("siteNoticeClear");
  const list = Array.isArray(items) ? items : [];
  if(!siteNoticeContent) return;

  currentNoticeIds = list
    .map(item => String(item.notice_id || item.id || "").trim())
    .filter(Boolean);
  if(siteNoticeClear) siteNoticeClear.disabled = currentNoticeIds.length === 0;

  if(!list.length){
    siteNoticeContent.innerHTML = '<div class="siteNoticeEmpty">暂无提醒。</div>';
    setNoticeCount(0);
    return;
  }

  siteNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => `
        <div class="siteNoticeItem">
          <div class="siteNoticeItemTitle">${escapeHtml(item.title || "站内通知")}</div>
          <div class="siteNoticeItemDesc">${escapeHtml(item.message || item.desc || "")}</div>
          ${item.created_at ? `<div class="siteNoticeItemDesc">${escapeHtml(formatNoticeTime(item.created_at))}</div>` : ""}
        </div>
      `).join("")}
    </div>
  `;

  setNoticeCount(list.length);
}

async function loadMemberNotifications(){
  const user = readStoredUser();
  const siteNoticeContent = document.getElementById("siteNoticeContent");

  if(!client || !user.loggedIn || !user.memberId || !user.memberCode){
    renderNoticeList([]);
    return;
  }

  if(siteNoticeContent){
    siteNoticeContent.innerHTML = '<div class="siteNoticeEmpty">读取中</div>';
  }

  try{
    const { data, error } = await client.rpc("get_member_notifications", {
      p_member_id:user.memberId,
      p_member_code:user.memberCode,
      p_channel:"site",
      p_limit:20
    });
    if(error) throw error;
    renderNoticeList(Array.isArray(data) ? data : []);
  }catch(error){
    console.error("读取荣誉墙通知失败：", error);
    currentNoticeIds = [];
    setNoticeCount(0);
    if(siteNoticeContent){
      siteNoticeContent.innerHTML = '<div class="siteNoticeEmpty">通知读取失败，请稍后再试。</div>';
    }
  }
}

async function markAllNoticesRead(){
  const user = readStoredUser();
  const siteNoticeClear = document.getElementById("siteNoticeClear");
  if(!client || !user.memberId || !user.memberCode || !currentNoticeIds.length) return;

  if(siteNoticeClear) siteNoticeClear.disabled = true;
  try{
    const { error } = await client.rpc("mark_member_notifications_read", {
      p_member_id:user.memberId,
      p_member_code:user.memberCode,
      p_notice_ids:currentNoticeIds
    });
    if(error) throw error;
    await loadMemberNotifications();
  }catch(error){
    console.error("荣誉墙通知标记已读失败：", error);
    if(siteNoticeClear) siteNoticeClear.disabled = false;
  }
}

function logoutRoom10(){
  [
    "room10LoggedIn",
    "room10User",
    "room10CurrentUser",
    "room10Member",
    "room10Role",
    "room10Nickname",
    "room10MemberId",
    "room10MemberCode",
    "room10ApplicantSession",
    "room10ApplicationDraft"
  ].forEach(key => localStorage.removeItem(key));

  updateIdentity();
  window.location.href = resolveHonorPageUrl("index.html");
}

function updateStageScale(){
  const stage = document.getElementById("stageFrame");
  if(!stage) return;

  const rect = stage.getBoundingClientRect();
  const rawScale = rect.width / 1440;
  const uiScale = Math.max(0.34, Math.min(3.20, rawScale));
  stage.style.setProperty("--ui-scale", uiScale.toFixed(3));
  stage.style.setProperty("--bg-ui-scale", uiScale.toFixed(3));

  const switchScale = Math.max(0.30, Math.min(1.60, rect.width / 2048));
  stage.style.setProperty("--switch-ui-scale", switchScale.toFixed(3));

  const switchFontSize = Math.max(9.8, Math.min(18.2, (rect.width / 2048) * 14.8));
  stage.style.setProperty("--switch-font-size", `${switchFontSize.toFixed(2)}px`);

  const honorTextScale = Math.max(0.58, Math.min(0.96, rect.width / 2048));
  stage.style.setProperty("--honor-text-scale", honorTextScale.toFixed(3));

}

function isPointInsideRect(x, y, rect){
  return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
}

function shouldAutoCloseNoticeForRoomNav(event){
  const panel = document.getElementById("siteNoticePanel");
  const topActions = document.getElementById("topActions");
  const topBar = document.getElementById("topBar");

  if(!panel || !topActions || !topBar) return false;
  if(!panel.classList.contains("show")) return false;
  if(window.matchMedia && window.matchMedia("(max-width: 540px)").matches) return false;

  const x = event.clientX;
  const y = event.clientY;
  const navRect = topBar.getBoundingClientRect();
  const identityRect = topActions.getBoundingClientRect();

  return isPointInsideRect(x, y, navRect) && !isPointInsideRect(x, y, identityRect);
}

document.addEventListener("pointermove", event => {
  if(shouldAutoCloseNoticeForRoomNav(event)){
    closeSiteNoticePanel();
  }
});

document.addEventListener("click", event => {
  if(!siteNoticePanel || !siteNoticeBtn) return;
  if(siteNoticePanel.contains(event.target) || siteNoticeBtn.contains(event.target)) return;
  closeSiteNoticePanel();
});

window.addEventListener("resize", () => {
  updateStageScale();

  if(currentTrophyId && rankPanel.classList.contains("show")){
    const data = trophyData[currentTrophyId];
    if(data) renderRankList(data.list);
  }
});

}

  updateStageScale();
});
