<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜成就称号馆</title>
<!-- PAGE_VERSION: honor-titles-v13-final-one-click-supplement -->

<script src="../room10-paths.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --bg-ui-scale:1;
  --ui-scale:var(--bg-ui-scale,1);
  --room-nav-scale:var(--ui-scale);
  --identity-scale:var(--ui-scale);

  /* 身份组件：采用全站通用模板 */
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);
  --identity-name-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;

  /* 房间按钮：采用全站通用模板，按底图百分比四角绑定 */
  --room-nav-top:6.35%;
  --room-nav-start-left:25.83%;
  --room-nav-btn-width:4.72%;
  --room-nav-btn-height:5.10%;
  --room-nav-gap:0.486%;

  --room-nav-hall-left:var(--room-nav-start-left);
  --room-nav-living-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 1);
  --room-nav-manager-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 2);
  --room-nav-honor-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 3);
  --room-nav-studio-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 4);
  --room-nav-game-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 5);
  --room-nav-dorm-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 6);
  --room-nav-flower-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 7);
  --room-nav-pets-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 8);

  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);

  /* 主面板坐标绑定底图实际显示区域：全站统一规则，不按分辨率单独改坐标 */
  --honor-panel-left:15.0%;
  --honor-panel-top:19.0%;
  --honor-panel-width:67.3%;
  --honor-panel-height:74.4%;

  --panel-border:rgba(198,145,79,.24);
  --card-border:rgba(170,122,82,.16);
  --brown:#6f4726;
  --brown-soft:#9b7656;
  --gold:#c98c4f;
  --green:#72855a;
  --reward-modal-scale:1;
  --reward-ink:#6b5141;
  --reward-line:rgba(190,143,112,0.24);
  --card-shadow:rgba(106,78,55,0.20);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at top left,#f5ecdb 0%,transparent 44%),
    linear-gradient(180deg,#efe2cc 0%,#e9d8bd 100%);
  color:var(--brown);
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button{font-family:inherit;}
.hidden{display:none !important;}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{pointer-events:auto;}

/* =========================================================
   房间按钮与身份组件：全站通用模板版
========================================================= */
#overlay .roomNavLayer{pointer-events:none!important;}
#overlay .roomNavLayer .navBtn{pointer-events:auto!important;}
#overlay .roomIdentity{pointer-events:none!important;}
#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{pointer-events:auto!important;}

/* =========================================================
   房间按钮组件
========================================================= */
.roomNavLayer{
  position:absolute;
  inset:0;
  z-index:55;
  pointer-events:none;
  --s:var(--room-nav-scale,1);
  --nav-btn-radius:calc(15px * var(--s));
  --nav-btn-font:calc(15px * var(--s));
  --nav-btn-border:calc(1px * var(--s));
  --nav-btn-shadow-y:calc(3px * var(--s));
  --nav-btn-shadow-blur:calc(8px * var(--s));
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:absolute;
  top:var(--room-nav-top);
  width:var(--room-nav-btn-width);
  height:var(--room-nav-btn-height);
  min-width:0;
  min-height:0;
  padding:0;
  border-radius:var(--nav-btn-radius);
  color:var(--room-nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.56), transparent 40%),
    radial-gradient(circle at 78% 74%, var(--room-nav-wash), transparent 48%),
    linear-gradient(180deg, var(--room-nav-paper) 0%, var(--room-nav-paper-2) 100%);
  border:var(--nav-btn-border) solid var(--room-nav-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.64),
    0 calc(2px * var(--s)) calc(7px * var(--s)) rgba(96,70,48,.10);
  text-shadow:0 calc(1px * var(--s)) 0 rgba(255,255,255,.38);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  pointer-events:auto;
}

.navBtn[data-room="hall"]{left:var(--room-nav-hall-left);}
.navBtn[data-room="living"]{left:var(--room-nav-living-left);}
.navBtn[data-room="manager"]{left:var(--room-nav-manager-left);}
.navBtn[data-room="honor"]{left:var(--room-nav-honor-left);}
.navBtn[data-room="studio"]{left:var(--room-nav-studio-left);}
.navBtn[data-room="game"]{left:var(--room-nav-game-left);}
.navBtn[data-room="dorm"]{left:var(--room-nav-dorm-left);}
.navBtn[data-room="flower"]{left:var(--room-nav-flower-left);}
.navBtn[data-room="pets"]{left:var(--room-nav-pets-left);}

.navBtn:not(.is-current):hover,
.navBtn:not(.is-current):focus-visible{
  color:#5f3d22;
  background:
    radial-gradient(circle at 20% 24%, rgba(255,255,255,.66), transparent 42%),
    radial-gradient(circle at 80% 78%, rgba(207,170,143,.24), transparent 50%),
    linear-gradient(180deg, rgba(255,252,246,.88) 0%, rgba(239,226,210,.82) 100%);
  border-color:rgba(151,112,84,.36);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.70),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.12);
  filter:saturate(1.02);
}

.navBtn.is-current{
  cursor:default;
  color:var(--room-nav-current-text);
  background:
    radial-gradient(circle at 22% 22%, rgba(255,255,255,.62), transparent 42%),
    radial-gradient(circle at 80% 80%, rgba(190,151,126,.26), transparent 50%),
    linear-gradient(180deg, rgba(246,235,222,.94) 0%, var(--room-nav-current-bg) 100%);
  border-color:var(--room-nav-current-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.68),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.13),
    0 0 0 calc(2px * var(--s)) rgba(255,253,248,.46);
  filter:none;
}

.navLabel{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.82),
    0 0 calc(8px * var(--s)) rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{ transform:translateY(calc(4px * var(--s))) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(calc(-5px * var(--s))) rotate(6deg) scale(1); opacity:.76; }
}
@keyframes navFloatB{
  0%,100%{ transform:translateY(calc(5px * var(--s))) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(calc(-6px * var(--s))) rotate(-7deg) scale(1); opacity:.68; }
}
@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(calc(6px * var(--s))) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(calc(-6px * var(--s))) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:not(.is-current):hover .navEffectA,
.navBtn:not(.is-current):focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectB,
.navBtn:not(.is-current):focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectC,
.navBtn:not(.is-current):focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}
.navBtn.is-current .navEffect{display:none;}

.navBtn[data-room="hall"] .navEffect{color:rgba(255,205,96,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.95),0 0 calc(10px * var(--s)) rgba(255,215,105,.62);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="honor"] .navEffect{color:rgba(205,143,45,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.92),0 0 calc(8px * var(--s)) rgba(255,220,130,.52);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}

/* =========================================================
   身份组件
========================================================= */
.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}

.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1.22;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
  transform:translateY(var(--identity-name-y));
}

.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}

.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}

.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

.identityNoticePanel.show{display:block;}

.identityNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
  margin-bottom:calc(10px * var(--s));
}

.identityNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}

/* =========================================================
   成就称号馆主体：主面板坐标绑定底图，比例更接近正方形
========================================================= */
#honorShell{
  position:absolute;
  left:var(--honor-panel-left);
  top:var(--honor-panel-top);
  width:var(--honor-panel-width);
  height:var(--honor-panel-height);
  z-index:20;
  padding:calc(13px * var(--ui-scale));
  border-radius:calc(26px * var(--ui-scale));
  border:1px solid var(--panel-border);
  background:
    linear-gradient(180deg, rgba(255,250,242,.84), rgba(250,236,216,.68));
  box-shadow:
    0 calc(16px * var(--ui-scale)) calc(38px * var(--ui-scale)) rgba(89,66,42,.12),
    inset 0 1px 0 rgba(255,255,255,.88);
  backdrop-filter:blur(calc(10px * var(--ui-scale)));
  -webkit-backdrop-filter:blur(calc(10px * var(--ui-scale)));
  display:grid;
  grid-template-rows:minmax(0,1fr);
  gap:calc(8px * var(--ui-scale));
  overflow:hidden;
}


.mineTools{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:calc(8px * var(--ui-scale));
  padding:calc(10px * var(--ui-scale)) calc(12px * var(--ui-scale));
  border-bottom:1px dashed rgba(170,117,62,.18);
}


.honorSummaryBox,
.honorClaimBox,
.honorMain,
.honorMine{
  border-radius:calc(18px * var(--ui-scale));
  border:1px solid var(--card-border);
  background:rgba(255,253,248,.56);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.72),
    0 calc(8px * var(--ui-scale)) calc(18px * var(--ui-scale)) rgba(90,67,43,.06);
}


.sourceFilterBox{
  position:relative;
  flex:0 0 auto;
  width:100%;
  min-width:0;
  min-height:0;
  padding:calc(9px * var(--ui-scale)) calc(12px * var(--ui-scale)) calc(10px * var(--ui-scale));
  overflow:hidden;
  border-bottom:1px dashed rgba(170,117,62,.18);
  background:rgba(255,253,248,.30);
}


.filterSparkles{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  opacity:.85;
}

.filterSparkle{
  position:absolute;
  width:calc(5px * var(--ui-scale));
  height:calc(5px * var(--ui-scale));
  border-radius:999px;
  background:rgba(210,151,75,.52);
  box-shadow:0 0 calc(9px * var(--ui-scale)) rgba(229,178,92,.34);
  opacity:.46;
  animation:filterSparkleFloat 4.6s ease-in-out infinite;
}

.filterSparkle:nth-child(1){left:8%;top:62%;animation-delay:-.2s;}
.filterSparkle:nth-child(2){left:28%;top:26%;animation-delay:-1.4s;transform:scale(.72);}
.filterSparkle:nth-child(3){left:54%;top:70%;animation-delay:-2.1s;transform:scale(.86);}
.filterSparkle:nth-child(4){left:82%;top:32%;animation-delay:-3.3s;transform:scale(.62);}
.filterSparkle:nth-child(5){left:92%;top:76%;animation-delay:-1.0s;transform:scale(.78);}

@keyframes filterSparkleFloat{
  0%,100%{opacity:.18; transform:translateY(calc(4px * var(--ui-scale))) scale(.68);}
  45%{opacity:.74; transform:translateY(calc(-6px * var(--ui-scale))) scale(1);}
  70%{opacity:.36; transform:translateY(calc(-2px * var(--ui-scale))) scale(.82);}
}

.filterHead{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:calc(8px * var(--ui-scale));
  color:#7a5537;
  font-size:calc(10px * var(--ui-scale));
  font-weight:900;
  line-height:1.2;
  margin-bottom:calc(6px * var(--ui-scale));
}

.filterTitle{
  display:inline-flex;
  align-items:center;

function room10Url(path){
  const raw = String(path || "").trim();
  if(!raw) return "";
  if(/^(javascript:|data:|vbscript:|file:|blob:|http:)/i.test(raw)) return "";
  if(/^(https:|mailto:|tel:|#|\/)/i.test(raw)) return raw;
  if(raw.startsWith("./") || raw.startsWith("../")) return raw;
  if(typeof window.room10Path === "function") return window.room10Path(raw);
  return `${ROOM10_ROOT_PREFIX}${raw}`;
}

function room10PageUrl(key,fallbackPath=""){
  const pageKey = String(key || "").trim();
  if(pageKey && typeof window.room10Page === "function"){
    const url = room10Url(window.room10Page(pageKey));
    if(url) return url;
  }
  return room10Url(fallbackPath);
}

  if(key && typeof window.room10Asset === "function"){
    const url = room10Url(window.room10Asset(key));

  return room10Url(fallbackPath);
}

function rebuildHonorSourceGroupMap(sourceGroups){
  const map = new Map();

  if(!Array.isArray(sourceGroups) || sourceGroups.length <= 0){
    throw new Error("来源筛选读取失败：honor_source_groups 没有可用配置。");
  }

  sourceGroups.forEach(row => {
    const key = normalizeSourceKey(row?.source_group);
    const filterKey = normalizeSourceKey(row?.filter_group);
    const displayName = String(row?.display_name || "").trim();
    const sortOrder = Number(row?.sort_order);

    if(!key){
      throw new Error("来源配置缺失：honor_source_groups.source_group 为空。");
    }

    if(!filterKey){
      throw new Error(`来源配置缺失：${key} 缺少 filter_group。`);
    }

    if(!displayName){
      throw new Error(`来源配置缺失：${key} 缺少 display_name。`);
    }

    if(!Number.isFinite(sortOrder)){
      throw new Error(`来源配置缺失：${key} 缺少 sort_order。`);
    }

    map.set(key, {
      source_group:key,
      filter_group:filterKey,
      room_key:String(row?.room_key || "").trim(),
      display_name:displayName,
      sort_order:sortOrder,
      is_active:row?.is_active === true,
      show_in_honor_filter:row?.show_in_honor_filter === true,
      note:String(row?.note || "")
    });
  });

  map.forEach(config => {
    if(!map.has(config.filter_group)){
      throw new Error(`来源配置缺失：${config.source_group} 的 filter_group=${config.filter_group} 没有对应配置。`);
    }
  });

  const visibleNameMap = new Map();
  map.forEach(config => {
    if(config.is_active === true && config.show_in_honor_filter === true){
      const old = visibleNameMap.get(config.display_name);
      if(old){
        throw new Error(`来源配置重复：${old} 和 ${config.source_group} 都显示为「${config.display_name}」。`);
      }
      visibleNameMap.set(config.display_name, config.source_group);
    }
  });

  honorSourceGroupMap = map;
  return map;
}

function isTinyScreen(){
  return window.innerWidth <= 540;
}

function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";
  root.style.setProperty("--bg-ui-scale","1");
}

function syncOverlayToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.34, Math.min(3.2, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));

}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function normalizeText(value){ return String(value ?? "").trim(); }
function numberValue(value){
  const num = Number(value || 0);
  return Number.isFinite(num) ? num : 0;
}
function requireDbText(value,label){
  const text = normalizeText(value);
  if(!text) throw new Error(`配置缺失：${label}。`);
  return text;
}

function normalizeReward(reward){
  const name = normalizeText(reward?.name);
  const assetKey = normalizeText(reward?.assetKey);
  const image = assetKey
    ? requireRoom10AssetUrl(assetKey,`奖励「${name || assetKey}」素材`)
    : room10Url(reward?.image || "");
  const icon = normalizeText(reward?.icon);

  if(!name) throw new Error("奖励名称不能为空。");
  if(!image && !icon) throw new Error(`奖励「${name}」缺少素材路径或图标。`);

  return {
    name,
    amount:numberValue(reward?.amount),
    unit:normalizeText(reward?.unit),
    icon,
    image,
    note:normalizeText(reward?.note)
  };
}

function renderRewardItems(rewards){
  const rows = (Array.isArray(rewards) ? rewards : []).map(normalizeReward).filter(row => row.amount > 0);

  rewardSectionTitle.classList.toggle("hidden",rows.length === 0);

    rewardList.innerHTML = "";

  rewardList.innerHTML = rows.map(row => `
    <div class="reward-item">
      ${row.image
        ? `<img class="reward-item-image" src="${escapeHtml(row.image)}" alt="${escapeHtml(row.name)}">`

      ${row.note ? `<div class="reward-item-note">${escapeHtml(row.note)}</div>` : ""}

  `).join("");
}

function getHonorItemRewards(itemType,itemId){
  const normalizedType = String(itemType || "").toLowerCase();
  const normalizedId = String(itemId || "");
  return honorRewardItemRows
    .filter(row =>
      String(row.honor_type || "").toLowerCase() === normalizedType &&
      String(row.honor_id || "") === normalizedId &&
      row.is_active !== false
    )
    .sort((a,b) => numberValue(a.sort_order) - numberValue(b.sort_order) || String(a.item_key || "").localeCompare(String(b.item_key || "")));
}

function normalizeHonorItemType(itemType){
  return String(itemType || "").trim().toLowerCase();
}

function honorItemId(itemOrId){
  if(itemOrId && typeof itemOrId === "object") return String(itemOrId.id || "");
  return String(itemOrId || "");
}

function honorStatusKey(itemType,itemOrId){
  return `${normalizeHonorItemType(itemType)}:${honorItemId(itemOrId)}`;
}

function getHonorRewardStatus(itemType,itemOrId){
  return honorRewardStatusMap.get(honorStatusKey(itemType,itemOrId)) || null;
}

function normalizeStatusRewardItem(row){
  return {
    item_key:String(row?.item_key || ""),
    item_name:String(row?.item_name || row?.item_key || ""),
    item_icon:String(row?.item_icon || ""),
    quantity:numberValue(row?.configured_quantity),
    configured_quantity:numberValue(row?.configured_quantity),
    claimed_quantity:numberValue(row?.claimed_quantity),
    remaining_quantity:numberValue(row?.remaining_quantity),
    has_claimable:row?.has_claimable === true || numberValue(row?.remaining_quantity) > 0
  };
}

function rebuildHonorRewardStatusMap(rows){
  honorRewardStatusRows = Array.isArray(rows) ? rows : [];
  honorRewardStatusMap = new Map();

  honorRewardStatusRows.forEach(row => {
    const key = honorStatusKey(row?.item_type,row?.item_id);
    const itemRewards = Array.isArray(row?.item_rewards)
      ? row.item_rewards.map(normalizeStatusRewardItem)
      : [];

    honorRewardStatusMap.set(key, {
      item_type:normalizeHonorItemType(row?.item_type),
      item_id:String(row?.item_id || ""),
      member_honor_row_id:String(row?.member_honor_row_id || ""),
      reward_gold:numberValue(row?.reward_gold),
      gold_claimed:row?.gold_claimed === true,
      gold_remaining:numberValue(row?.gold_remaining),
      item_total_quantity:numberValue(row?.item_total_quantity),
      item_claimed_quantity:numberValue(row?.item_claimed_quantity),
      item_remaining_quantity:numberValue(row?.item_remaining_quantity),
      has_claimable:row?.has_claimable === true,
      item_rewards:itemRewards
    });
  });
}

function getClaimableRewardInfo(itemType,item){
  const status = getHonorRewardStatus(itemType,item);
  if(!status){
    return { goldClaimable:false,claimableItemRewards:[],hasClaimable:false,totalGold:0,totalItemQuantity:0 };
  }
  const goldRemaining = numberValue(status.gold_remaining);
  const claimableItemRewards = (Array.isArray(status.item_rewards) ? status.item_rewards : [])
    .filter(reward => numberValue(reward.remaining_quantity) > 0);
  const totalItemQuantity = claimableItemRewards.reduce((sum,reward) => sum + numberValue(reward.remaining_quantity),0);
  return {
    goldClaimable:goldRemaining > 0,
    claimableItemRewards,
    hasClaimable:goldRemaining > 0 || totalItemQuantity > 0,
    totalGold:goldRemaining,
    totalItemQuantity
  };
}


function isHonorRewardClaimed(itemType,itemOrId){
  const status = getHonorRewardStatus(itemType,itemOrId);
  if(!status) return false;
  return status.has_claimable !== true;
}

function rewardPillHtml(itemType,item,onlyUnclaimed=false){
  const parts = [];

  if(onlyUnclaimed){
    const claimable = getClaimableRewardInfo(itemType,item);
    if(claimable.totalGold > 0){
      parts.push(`<span class="metaPill">金币 ${claimable.totalGold}</span>`);
    }
    claimable.claimableItemRewards.forEach(reward => {
      parts.push(`<span class="metaPill">${escapeHtml(reward.item_name || reward.item_key)} ×${numberValue(reward.remaining_quantity)}</span>`);
    });
    return parts.join("");
  }

  const rewardGold = numberValue(item.rewardGold);
  const itemRewards = Array.isArray(item.itemRewards) ? item.itemRewards : getHonorItemRewards(itemType,item.id);

  if(rewardGold > 0){
    parts.push(`<span class="metaPill">金币 ${rewardGold}</span>`);
  }

  itemRewards.forEach(reward => {
    parts.push(`<span class="metaPill">${escapeHtml(reward.item_name || reward.item_key)} ×${numberValue(reward.quantity)}</span>`);
  });

  return parts.join("");
}


function rewardBadgeText(item){
  const itemType = item.itemType || "achievement";
  const hasReward = numberValue(item.rewardGold) > 0 || (Array.isArray(item.itemRewards) && item.itemRewards.length > 0);
  if(!hasReward) return "已获得";
  const status = getHonorRewardStatus(itemType,item);
  if(!status) return hasMemberAccess() ? "状态待确认" : "已获得";
  return getClaimableRewardInfo(itemType,item).hasClaimable ? "待补领" : "已领取";
}


function rewardMetaHtml(item){
  const itemType = item.itemType || "achievement";
  const html = rewardPillHtml(itemType,item,true);
  if(!html) return "";
  return `<div class="metaRow">${html}</div>`;
}

function roleLabel(role){
  const map = { owner:"维修工",admin:"宿管",member:"房客",roomer:"房客",trainee:"练习生",applying:"申请中",visitor:"参观者" };
  return map[normalizeText(role).toLowerCase()] || "参观者";
}

function readLocalAuth(){
  authState.loggedIn = localStorage.getItem(STORAGE_KEYS.loggedIn) === "true";
  authState.nickname = normalizeText(localStorage.getItem(STORAGE_KEYS.user));
  authState.role = normalizeText(localStorage.getItem(STORAGE_KEYS.role) || "visitor").toLowerCase();
  authState.memberId = normalizeText(localStorage.getItem(STORAGE_KEYS.memberId)) || null;
  authState.memberCode = normalizeText(localStorage.getItem(STORAGE_KEYS.memberCode));
  return Boolean(authState.loggedIn && authState.nickname && authState.memberId && authState.memberCode);
}

function getStoredMemberSnapshot(){
  if(!readLocalAuth()) return null;
  return { id:authState.memberId,nickname:authState.nickname,role:authState.role,memberCode:authState.memberCode };
}

function hasMemberAccess(member=currentMember || getStoredMemberSnapshot()){
  return Boolean(member && MEMBER_ACCESS_ROLES.has(normalizeText(member.role).toLowerCase()));
}

function saveStoredMember(member){
  localStorage.setItem(STORAGE_KEYS.loggedIn,"true");
  localStorage.setItem(STORAGE_KEYS.user,member.nickname);
  localStorage.setItem(STORAGE_KEYS.role,member.role);
  localStorage.setItem(STORAGE_KEYS.memberId,member.id);
  localStorage.setItem(STORAGE_KEYS.memberCode,member.memberCode);
}

function clearStoredLogin(){
  LOGIN_STORAGE_KEYS.forEach(key => localStorage.removeItem(key));
  currentMember = null;
  Object.assign(authState,{loggedIn:false,nickname:"",role:"visitor",memberId:null,memberCode:""});
}

function updateIdentity(){
  const member = currentMember || getStoredMemberSnapshot();
  if(member){
    identityNickname.textContent = member.nickname;
    identitySeparator.classList.remove("hidden");
    identityRole.classList.remove("hidden");
    identityRole.textContent = roleLabel(member.role);
    identityAuthBtn.querySelector(".identityAuthText").textContent = "登出";
  }else{
    identityNickname.textContent = "参观者";
    identitySeparator.classList.add("hidden");
    identityRole.classList.add("hidden");
    identityRole.textContent = "参观者";
    identityAuthBtn.querySelector(".identityAuthText").textContent = "登录";
  }
}

function setLoginMessage(message,success=false){
  room10LoginMessage.style.color = success ? "#5f7d3a" : "#8b4a2d";
  room10LoginMessage.textContent = normalizeText(message);
}

function openRoom10Login(target=""){
  if(readLocalAuth()){
    if(target) window.location.href = target;
    return;
  }
  pendingLoginTarget = room10Url(target);
  setLoginMessage("");
  room10LoginMask.classList.add("show");
  room10LoginMask.setAttribute("aria-hidden","false");
  syncRoom10BodyLock();
  setTimeout(() => room10LoginNickname?.focus(),30);
}

function closeRoom10Login(clearTarget=true){
  room10LoginMask.classList.remove("show");
  room10LoginMask.setAttribute("aria-hidden","true");
  setLoginMessage("");
  if(clearTarget) pendingLoginTarget = "";
  syncRoom10BodyLock();
}

function toggleRoom10LoginCode(){
  room10LoginCode.type = room10LoginCode.type === "password" ? "text" : "password";
}

function validateLoginMember(row,enteredCode){
  const id = normalizeText(row?.member_id || row?.id);
  const nickname = normalizeText(row?.nickname);
  const role = normalizeText(row?.role || "member").toLowerCase();
  const memberCode = normalizeText(row?.member_code || row?.memberCode || row?.code || enteredCode);
  if(!id || !nickname || !memberCode || !VALID_MEMBER_ROLES.has(role)){
    throw new Error("登录返回的成员资料不完整。");
  }
  return { id,nickname,role,memberCode };
}

async function submitRoom10Login(){
  if(loginInFlight) return;
  const nickname = normalizeText(room10LoginNickname.value).replace(/\u3000/g," ").trim();
  const code = normalizeText(room10LoginCode.value).replace(/\u3000/g," ").trim();
  if(!nickname || !code){
    setLoginMessage("还没填写完整呢");
    return;
  }
  loginInFlight = true;
  room10LoginSubmit.disabled = true;
  setLoginMessage("正在验证……");
  try{
    const { data,error } = await supabaseClient.rpc("room10_member_login",{ p_nickname:nickname,p_key_code:code });
    if(error) throw error;
    const row = Array.isArray(data) ? data[0] : data;
    if(!row?.success){
      setLoginMessage(normalizeText(row?.message) || "没有找到你的记录哎");
      return;
    }
    const member = validateLoginMember(row,code);
    saveStoredMember(member);
    currentMember = member;
    noticeCache.at = 0;
    updateIdentity();
    setLoginMessage(`${roleLabel(member.role)}已登录`,true);
    await loadHonorData({force:true});
    await new Promise(resolve => setTimeout(resolve,350));
    const target = pendingLoginTarget;
    pendingLoginTarget = "";
    room10LoginNickname.value = "";
    room10LoginCode.value = "";
    room10LoginCode.type = "password";
    closeRoom10Login(false);
    if(target){
      window.location.href = hasMemberAccess(member) ? target : getManagerPageByRole();
    }
  }catch(error){
    setLoginMessage("登录失败，请稍后再试");
    showOperationFailure(error,"登录");
  }finally{
    loginInFlight = false;
    room10LoginSubmit.disabled = false;
  }
}

  const returnPath = window.location.href;

  window.location.href = url.href;
}

function getManagerPageByRole(){
  const role = normalizeText(currentMember?.role || authState.role).toLowerCase();
  if(role === "owner") return room10PageUrl("managerOwner","manager/manager-admin.html");
  if(role === "admin") return room10PageUrl("managerAdmin","manager/manager-admin.html");
  if(role === "member" || role === "roomer" || role === "trainee" || role === "applying") return room10PageUrl("managerMember","manager/manager-member.html");
  return room10PageUrl("managerVisitor","manager/manager-visitor.html");
}

function enterManagerRoom(){
  const url = getManagerPageByRole();
  if(url) window.location.href = url;
}

function enterRoom(pageKey,needLogin,room){
  const page = room10PageUrl(pageKey);
  if(!page){
    showOperationFailure(new Error(`page=${pageKey}`),"打开房间");
    return;
  }
  if(needLogin && !readLocalAuth()){
    openRoom10Login(page);
    return;
  }
  if(needLogin && !hasMemberAccess()){
    window.location.href = getManagerPageByRole();
    return;
  }
  if((room === "flower" || room === "pets") && !hasMemberAccess()){
    const url = new URL(page,window.location.href);
    url.searchParams.set("mode","guest");
    window.location.href = url.href;
    return;
  }
  window.location.href = page;
}

function setupRoomNav(){
  document.querySelectorAll(".navBtn").forEach(button => {
    const room = normalizeText(button.dataset.room);
    button.classList.toggle("is-current",room === CURRENT_ROOM);
    if(room === CURRENT_ROOM){
      button.setAttribute("aria-current","page");
      return;
    }
    button.addEventListener("click",() => {
      if(button.dataset.manager === "true"){
        enterManagerRoom();
        return;
      }
      enterRoom(button.dataset.page,button.dataset.login === "true",room);
    });
  });
}

function setNoticeCount(count){
  const value = Math.max(0,numberValue(count));
  identityNoticeCount.textContent = value > 99 ? "99+" : String(value);
  identityNoticeBtn.classList.toggle("hasNotice",value > 0);
}

function noticeAckKey(){
  const memberId = normalizeText(currentMember?.id || authState.memberId);
  return memberId ? `${NOTICE_ACK_KEY}:${memberId}` : NOTICE_ACK_KEY;
}

function validateNoticeItem(item,index){
  const title = normalizeText(item?.main || item?.title);
  if(!title) throw new Error(`通知 ${index + 1} 缺少标题。`);
  return {
    key:normalizeText(item?.notice_key || item?.id),
    type:normalizeText(item?.notice_type || item?.type),
    icon:normalizeText(item?.icon) || "🔔",
    title,
    desc:normalizeText(item?.sub || item?.description),
    targetPage:normalizeText(item?.target_page),
    targetId:normalizeText(item?.target_id),
    actionLabel:normalizeText(item?.action_label) || "前往处理"
  };
}

async function loadNoticeItems(){
  if(!hasMemberAccess()) return {items:[],signature:""};
  const memberId = normalizeText(currentMember?.id || authState.memberId);
  const memberCode = normalizeText(currentMember?.memberCode || authState.memberCode);
  const now = Date.now();
  if(noticeCache.memberId === memberId && now - noticeCache.at < 15000){
    return {items:noticeCache.items,signature:noticeCache.signature};
  }
  const { data,error } = await supabaseClient.rpc("get_index_notice_items",{ p_member_id:memberId,p_member_code:memberCode });
  if(error) throw error;
  const source = Array.isArray(data?.items) ? data.items : [];
  const items = source.map(validateNoticeItem);
  const signature = normalizeText(data?.signature) || items.map(item => `${item.title}__${item.desc}`).join("||");
  noticeCache = {at:now,memberId,items,signature};
  return {items,signature};
}

async function renderNotices(){
  if(!hasMemberAccess()){
    noticeState = {signature:"",items:[]};
    identityNoticeContent.className = "identityNoticeEmpty";
    identityNoticeContent.textContent = readLocalAuth() ? "当前身份没有成员通知。" : "登录后查看个人通知。";
    setNoticeCount(0);
    return;
  }
  try{
    const {items,signature} = await loadNoticeItems();
    noticeState = {items,signature};
    const unread = Boolean(signature && signature !== localStorage.getItem(noticeAckKey()));
    setNoticeCount(unread ? items.length : 0);
    if(!items.length){
      identityNoticeContent.className = "identityNoticeEmpty";
      identityNoticeContent.textContent = "暂无新通知。";
      return;
    }
    identityNoticeContent.className = "identityNoticeList";
    identityNoticeContent.innerHTML = items.map((item,index) => {
      const tag = item.targetPage ? "button" : "div";
      return `<${tag} class="identityNoticeItem" ${item.targetPage ? `type="button" data-notice-index="${index}"` : ""}>
        <span class="identityNoticeItemIcon">${escapeHtml(item.icon)}</span>
        <span class="identityNoticeItemText"><span class="identityNoticeItemTitle">${escapeHtml(item.title)}</span>${item.desc ? `<span class="identityNoticeItemDesc">${escapeHtml(item.desc)}</span>` : ""}</span>
        ${item.targetPage ? `<span class="identityNoticeAction">${escapeHtml(item.actionLabel)}</span>` : ""}
      </${tag}>`;
    }).join("");
  }catch(error){
    identityNoticeContent.className = "identityNoticeEmpty";
    identityNoticeContent.textContent = "通知读取失败，请稍后重试。";
    setNoticeCount(0);
    console.error("通知读取失败",error);
  }
}

function openNoticePanel(){
  identityNoticePanel.classList.add("show");
  if(noticeState.signature){
    localStorage.setItem(noticeAckKey(),noticeState.signature);
    setNoticeCount(0);
  }
}
function closeNoticePanel(){ identityNoticePanel.classList.remove("show"); }
function toggleNoticePanel(){ identityNoticePanel.classList.contains("show") ? closeNoticePanel() : openNoticePanel(); }
function openNoticeTarget(index){
  const item = noticeState.items[index];
  if(!item?.targetPage) return;
  const page = room10PageUrl(item.targetPage,item.targetPage);
  if(!page){
    showOperationFailure(new Error(`target=${item.targetPage}`),"打开通知");

  }
  if(noticeState.signature) localStorage.setItem(noticeAckKey(),noticeState.signature);
  closeNoticePanel();
  window.location.href = url.href;
}

  }

async function fetchHonorRewardItems(){
  const { data,error } = await supabaseClient
    .from("honor_reward_items")
    .select("id,honor_type,honor_id,item_key,quantity,sort_order,is_active,note")
    .eq("is_active",true)
    .order("honor_type",{ ascending:true })
    .order("honor_id",{ ascending:true })
    .order("sort_order",{ ascending:true });

  if(error){
    throw new Error(`荣誉物品奖励配置读取失败：${error.message || "请检查 honor_reward_items 权限。"}`);
  }

  const rows = Array.isArray(data) ? data : [];
  const itemKeys = Array.from(new Set(rows.map(row => String(row.item_key || "").trim()).filter(Boolean)));

  if(!itemKeys.length) return rows;

  const { data:itemRows,error:itemError } = await supabaseClient
    .from("item_types")
    .select("item_key,item_name,item_icon,is_active")
    .in("item_key",itemKeys);

  if(itemError){
    throw new Error(`荣誉奖励物品名称读取失败：${itemError.message || "请检查 item_types 权限。"}`);
  }

  const itemMap = new Map((itemRows || []).map(item => [String(item.item_key), item]));

  return rows.map(row => {
    const itemKey = String(row.item_key || "").trim();
    const item = itemMap.get(itemKey);

    if(!item){
      throw new Error(`奖励物品配置缺失：item_types 中找不到 ${itemKey}。`);
    }

    if(item.is_active !== true){
      throw new Error(`奖励物品配置错误：${itemKey} 未启用。`);
    }

    const itemName = String(item.item_name || "").trim();
    if(!itemName){
      throw new Error(`奖励物品配置缺失：${itemKey} 缺少 item_name。`);
    }

    return {
      ...row,
      item_name:itemName,
      item_icon:String(item.item_icon || "")
    };
  });
}

function normalizeSourceKey(raw){
  return String(raw || "").trim().toLowerCase();
}

function inferSourceKey(item){
  const key = normalizeSourceKey(item?.source_group);
  if(!key){
    const itemName = item?.name || item?.code || item?.id || "未知记录";
    throw new Error(`来源配置缺失：${itemName} 缺少 source_group。`);
  }
  return key;
}

function getSourceConfig(key){
  const normalizedKey = normalizeSourceKey(key);
  return honorSourceGroupMap.get(normalizedKey) || null;
}

function getFilterGroupKey(sourceKey){
  const normalizedKey = normalizeSourceKey(sourceKey);
  const config = getSourceConfig(normalizedKey);
  if(!config){
    throw new Error(`来源配置缺失：${normalizedKey} 未在 honor_source_groups 中配置。`);
  }

  const filterKey = normalizeSourceKey(config.filter_group);
  if(!filterKey){
    throw new Error(`来源配置缺失：${normalizedKey} 缺少 filter_group。`);
  }

  const filterConfig = getSourceConfig(filterKey);
  if(!filterConfig){
    throw new Error(`来源配置缺失：${normalizedKey} 指向的 filter_group=${filterKey} 不存在。`);
  }

  if(filterConfig.is_active !== true || filterConfig.show_in_honor_filter !== true){
    throw new Error(`来源配置错误：${normalizedKey} 指向的筛选标签 ${filterKey} 未启用显示。`);
  }

  return filterKey;
}

function sourceLabel(key){
  const config = getSourceConfig(key);
  if(!config || !config.display_name){
    throw new Error(`来源配置缺失：${normalizeSourceKey(key)} 缺少 display_name。`);
  }
  return config.display_name;
}

function sourceSortIndex(key){
  const config = getSourceConfig(key);
  const order = Number(config?.sort_order);
  if(!Number.isFinite(order)){
    throw new Error(`来源配置缺失：${normalizeSourceKey(key)} 缺少 sort_order。`);
  }
  return order;
}


function sourceMatches(item){
  const itemFilterKey = getFilterGroupKey(item?.sourceKey);
  return activeSourceFilter === "all" || itemFilterKey === normalizeSourceKey(activeSourceFilter);
}

function filteredRows(rows){
  return Array.isArray(rows) ? rows.filter(sourceMatches) : [];
}

function validateHonorSourceRows(rows,label){
  const list = Array.isArray(rows) ? rows : [];
  list.forEach(item => {
    const sourceKey = normalizeSourceKey(item?.sourceKey);
    if(!sourceKey){
      throw new Error(`${label}来源配置缺失：存在空 source_group。`);
    }
    getFilterGroupKey(sourceKey);
  });
}

function getActiveCommunityTarget(){
  const activeBtn = document.querySelector('.tabBtn[data-tab-group="community"].active');
  return activeBtn?.dataset?.target || "communityAchievements";
}

function getSourceFilterBaseRows(){
  return getActiveCommunityTarget() === "communityTitles"
    ? communityTitleRows
    : communityAchievementRows;
}

function updateSourceFilterOptions(){
  const countMap = new Map();
  const sourceRows = getSourceFilterBaseRows();

  sourceRows.forEach(item => {
    const filterKey = getFilterGroupKey(item.sourceKey);
    countMap.set(filterKey, (countMap.get(filterKey) || 0) + 1);
  });

  const options = Array.from(countMap.entries())
    .map(([key,count]) => ({ key, label:sourceLabel(key), count }))
    .sort((a,b) => sourceSortIndex(a.key) - sourceSortIndex(b.key) || a.label.localeCompare(b.label,"zh-Hans-CN"));

  const total = Array.from(countMap.values()).reduce((sum,count) => sum + count, 0);
  sourceFilterOptions = [{ key:"all", label:"全部", count:total }, ...options];

  if(activeSourceFilter !== "all" && !countMap.has(activeSourceFilter)){
    activeSourceFilter = "all";
  }
}

function renderSourceFilters(){
  const wrap = document.getElementById("sourceFilterTags");
  const count = document.getElementById("sourceFilterCount");
  if(!wrap) return;

  try{
    updateSourceFilterOptions();

    wrap.innerHTML = sourceFilterOptions.map(option => `
      <button class="sourceFilterBtn ${option.key === activeSourceFilter ? "active" : ""}" type="button" data-source-filter="${escapeHtml(option.key)}">
        ${escapeHtml(option.label)}
      </button>
    `).join("");

    if(count){
      const current = sourceFilterOptions.find(option => option.key === activeSourceFilter) || sourceFilterOptions[0];
      count.textContent = `${current.label} ${numberValue(current.count)} 项`;
    }
  }catch(error){
    console.error(error);
    showSourceFilterError(error.message || "来源筛选读取失败。");
  }
}

  records.forEach(row => {
    const key = String(row.achievement_id || "");
    if(!key) return;
    if(!countMap.has(key)) countMap.set(key,new Set());
    countMap.get(key).add(String(row.member_id || ""));
  });

  return achievements.map(item => {
    const itemKey = item?.code || item?.id || "未知成就";
    const obtainedSet = countMap.get(String(item.id)) || new Set();
    const obtainedCount = obtainedSet.size || 0;
    const unlockedNames = Array.from(obtainedSet)
      .map(memberId => memberMap?.get(String(memberId))?.nickname || "")
      .filter(Boolean);
    const isUnrevealed = obtainedCount <= 0 && numberValue(item.requirement_value) > 1;

    return {
      id:item.id,
      code:requireDbText(item.code,`achievements ${itemKey} 缺少 code`),
      condition:requireDbText(item.description,`achievements ${itemKey} 缺少 description`),
      stageName:isUnrevealed ? "？？？" : requireDbText(item.name,`achievements ${itemKey} 缺少 name`),
      progress:obtainedCount,
      total:totalMemberCount,
      rewardGold:numberValue(item.reward_gold),
      itemRewards:getHonorItemRewards("achievement",item.id),
      itemType:"achievement",
      sourceKey:inferSourceKey(item),
      status:obtainedCount > 0 ? "已解锁" : "未公开",
      unlockedNames,
      requirement_key:item.requirement_key,
      requirement_value:item.requirement_value

function buildMyAchievements(achievements,records,memberId){
  if(!memberId) return [];

  const obtainedIds = new Set(
    records
      .filter(row => row.is_current_member === true)
      .map(row => String(row.achievement_id))
  );

  const obtained = achievements.filter(item => obtainedIds.has(String(item.id)));
  const grouped = new Map();

  obtained.forEach(item => {
    const key = groupKeyFromHonor(item);
    const prev = grouped.get(key);

    if(!prev || numberValue(item.requirement_value) > numberValue(prev.requirement_value)){
      grouped.set(key,item);

  return Array.from(grouped.values())
    .sort(byRequirementValueDesc)
    .map(item => {

async function performHonorDataLoad(member){
  currentMember = member;
  updateIdentity();
  const privateMember = hasMemberAccess(member) ? member : null;
  const [
    memberCount,
    achievements,
    titles,
    honorRecords,
    rewardItems,
    sourceGroups,
    rewardStatus
  ] = await Promise.all([
    fetchTotalMembers(),
    fetchAchievementRows(),
    fetchTitleRows(),
    fetchHonorRecords(privateMember?.id || null,privateMember?.memberCode || null),
    fetchHonorRewardItems(),
    fetchHonorSourceGroups(),
    privateMember ? fetchHonorRewardStatus(privateMember.id,privateMember.memberCode) : Promise.resolve([])
  ]);

  const {achievementRecords,titleRecords} = splitHonorRecords(honorRecords);
  const memberRows = await fetchMemberRows(honorRecords);
  totalMemberCount = memberCount || 0;
  membersById = new Map((memberRows || []).map(row => [String(row.id),row]));
  honorRewardItemRows = rewardItems;
  honorSourceGroupRows = sourceGroups;
  rebuildHonorSourceGroupMap(sourceGroups);
  rebuildHonorRewardStatusMap(rewardStatus);
  communityAchievementRows = buildCommunityAchievements(achievements,achievementRecords,membersById);
  communityTitleRows = buildCommunityTitles(titles,titleRecords,membersById);
  myAchievementRows = buildMyAchievements(achievements,achievementRecords,privateMember?.id || null);
  myTitleRows = buildMyTitles(titles,titleRecords,privateMember?.id || null);
  validateHonorSourceConfiguration();
  renderAll();
  await renderNotices();
  lastDataLoadAt = Date.now();
}

function isMemberAuthError(error){
  return /成员校验|身份验证|重新登录|member.*verify|invalid member/i.test(normalizeText(error?.message));
}

async function loadHonorData({force=false}={}){
  if(dataLoadPromise) return dataLoadPromise;
  if(!force && Date.now() - lastDataLoadAt < 12000) return false;

  setListMessage("communityAchievements","正在读取共同成就……");
  setListMessage("communityTitles","正在读取共同称号……");
  setListMessage("myAchievements",hasMemberAccess() ? "正在读取我的成就……" : "登录后查看我的成就。");
  setListMessage("myTitles",hasMemberAccess() ? "正在读取我的称号……" : "登录后查看我的称号。");

  dataLoadPromise = (async () => {
    const member = getStoredMemberSnapshot();
    try{
      await performHonorDataLoad(member);
      return true;
    }catch(error){
      if(member && isMemberAuthError(error)){
        clearStoredLogin();
        await performHonorDataLoad(null);
        return true;
      }
      console.error("称号馆数据读取失败",error);
      setListMessage("communityAchievements","共同成就读取失败，请稍后重试。",true);
      setListMessage("communityTitles","共同称号读取失败，请稍后重试。",true);
      setListMessage("myAchievements","我的成就读取失败。",true);
      setListMessage("myTitles","我的称号读取失败。",true);
      showSourceFilterError("来源筛选读取失败。");
      renderSummary();
      showOperationFailure(error,"荣誉数据读取");
      return false;
    }finally{
      dataLoadPromise = null;
    }
  })();
  return dataLoadPromise;
}

function pendingRewardGold(){
  return pendingHonorRewardItems.reduce((sum,item) => sum + numberValue(item.rewardGold), 0);
}

function pendingRewardItemQuantity(){
  return pendingHonorRewardItems.reduce((sum,item) => sum + numberValue(item.itemQuantity), 0);
}

function refreshPendingRewards(){
  pendingHonorRewardItems = [];
  if(hasMemberAccess()){
    [...myAchievementRows,...myTitleRows].forEach(item => {
      const itemType = item.itemType || "achievement";
      const claimable = getClaimableRewardInfo(itemType,item);
      if(!claimable.hasClaimable) return;
      pendingHonorRewardItems.push({
        itemType,
        itemId:item.id,
        itemName:String(item.name || item.stageName || item.code || "荣誉"),
        rewardGold:claimable.totalGold,
        itemQuantity:claimable.totalItemQuantity,
        itemRewards:claimable.claimableItemRewards.map(reward => ({
          itemKey:String(reward.item_key || ""),
          itemName:String(reward.item_name || ""),
          itemIcon:String(reward.item_icon || ""),
          quantity:numberValue(reward.remaining_quantity)
        }))
      });
    });
  }

  const count = pendingHonorRewardItems.length;
  const gold = pendingRewardGold();
  const itemQuantity = pendingRewardItemQuantity();
  claimAllBtn.textContent = claimInFlight ? "补领中……" : "一键补领";

  if(!hasMemberAccess()){
    claimAllBtn.disabled = true;
    claimAllBtn.classList.add("hidden");
    claimHint.textContent = readLocalAuth() ? "当前身份无法补领奖励" : "登录后检查未领取奖励";
    return;
  }
  if(count <= 0){
    claimAllBtn.disabled = true;
    claimAllBtn.classList.add("hidden");
    claimHint.textContent = "暂无待补领奖励";
    return;
  }
  claimAllBtn.classList.remove("hidden");
  claimAllBtn.disabled = claimInFlight;
  const parts = [`待补领 ${count} 项`];
  if(gold > 0) parts.push(`${gold} 金币`);
  if(itemQuantity > 0) parts.push(`${itemQuantity} 个道具`);
  claimHint.textContent = parts.join("｜");
}

/* =========================================================
   领取奖励：需要数据库 RPC，避免前端直接写金币
========================================================= */
function validateSupplementRewardAssets(snapshot){
  requireRoom10AssetUrl("root.coin","金币素材");
  (Array.isArray(snapshot) ? snapshot : []).forEach(entry => {
    (Array.isArray(entry.itemRewards) ? entry.itemRewards : []).forEach(reward => {
      const itemKey = normalizeText(reward.itemKey);
      const itemName = normalizeText(reward.itemName);
      const itemIcon = normalizeText(reward.itemIcon);
      if(!itemKey) throw new Error("待补领奖励缺少 item_key。");
      if(!itemName) throw new Error(`奖励物品 ${itemKey} 缺少 item_name。`);
      requireRoom10AssetUrl(itemIcon,`奖励物品「${itemName}」素材`);
    });
  });
}

function buildSupplementRewards(snapshot,result){
  const rewards = [];
  const gold = numberValue(result?.total_gold);
  const itemQuantity = numberValue(result?.item_total_quantity);
  if(gold > 0){
    rewards.push({name:"金币",amount:gold,unit:"枚",assetKey:"root.coin"});
  }

  const itemTotals = new Map();
  (Array.isArray(snapshot) ? snapshot : []).forEach(entry => {
    (Array.isArray(entry.itemRewards) ? entry.itemRewards : []).forEach(reward => {
      const itemKey = normalizeText(reward.itemKey);
      const name = normalizeText(reward.itemName);
      const assetKey = normalizeText(reward.itemIcon);
      const existing = itemTotals.get(itemKey);
      if(existing && (existing.name !== name || existing.assetKey !== assetKey)){
        throw new Error(`奖励物品 ${itemKey} 的名称或素材配置不一致。`);
      }
      const row = existing || {name,assetKey,quantity:0};
      row.quantity += numberValue(reward.quantity);
      itemTotals.set(itemKey,row);
    });
  });

  const snapshotQuantity = [...itemTotals.values()].reduce((sum,row) => sum + row.quantity,0);
  if(itemQuantity !== snapshotQuantity){
    throw new Error(`补领结果与奖励明细数量不一致：数据库返回 ${itemQuantity}，页面明细为 ${snapshotQuantity}。`);
  }

  itemTotals.forEach(row => {
    if(row.quantity > 0){
      rewards.push({name:row.name,amount:row.quantity,unit:"个",assetKey:row.assetKey});
    }
  });
  return rewards;
}

async function claimAllHonorRewards(){
  if(claimInFlight) return;
  if(!hasMemberAccess()){
    openRoom10Login();
    return;
  }
  if(!pendingHonorRewardItems.length){
    showRewardModal({type:"daily",icon:"✓",label:"无需补领",title:"奖励均已到账",desc:"当前没有遗漏的成就或称号奖励。",rewards:[],confirmText:"知道了"});
    return;
  }

  const snapshot = pendingHonorRewardItems.map(item => ({
    ...item,
    itemRewards:(item.itemRewards || []).map(reward => ({...reward}))
  }));

  try{
    validateSupplementRewardAssets(snapshot);
  }catch(error){
    showOperationFailure(error,"奖励素材读取");
    return;
  }

  claimInFlight = true;
  refreshPendingRewards();

  try{
    const member = currentMember || getStoredMemberSnapshot();
    const {data,error} = await supabaseClient.rpc("claim_all_honor_rewards",{
      p_member_id:member.id,
      p_member_code:member.memberCode
    });
    if(error) throw error;
    const result = Array.isArray(data) ? data[0] : data;
    if(result?.ok === false) throw new Error(result.message || "一键补领失败");

    const count = numberValue(result?.claimed_count);
    const rewards = buildSupplementRewards(snapshot,result);
    noticeCache.at = 0;
    await loadHonorData({force:true});

    if(count <= 0 && rewards.length <= 0){
      showRewardModal({type:"daily",icon:"✓",label:"无需补领",title:"奖励均已到账",desc:"当前没有遗漏的成就或称号奖励。",rewards:[],confirmText:"知道了"});
      return;
    }

    showRewardModal({
      type:"gift",
      icon:"🎁",
      label:"补领完成",
      title:"荣誉奖励已到账",
      desc:`已补领 ${count} 项此前未领取的奖励。`,
      rewards,
      confirmText:"收下奖励"
    });
  }catch(error){
    showOperationFailure(error,"一键补领");
    await loadHonorData({force:true});
  }finally{
    claimInFlight = false;
    refreshPendingRewards();
  }
}

function switchTab(btn){
  const group = btn.dataset.tabGroup;
  const target = btn.dataset.target;
  if(!group || !target) return;
  document.querySelectorAll(`.tabBtn[data-tab-group="${group}"]`).forEach(item => item.classList.toggle("active",item === btn));
  const ids = group === "community" ? ["communityAchievements","communityTitles"] : ["myAchievements","myTitles"];
  ids.forEach(id => document.getElementById(id)?.classList.toggle("active",id === target));
  if(group === "community") renderSourceFilters();
}

function bindEvents(){
  document.querySelectorAll(".tabBtn").forEach(btn => btn.addEventListener("click",() => switchTab(btn)));
  document.addEventListener("click",event => {
    const filter = event.target.closest("[data-source-filter]");
    if(filter){
      activeSourceFilter = filter.dataset.sourceFilter || "all";
      renderAll();
      return;
    }
    if(!identityNoticeWrap?.contains(event.target)) closeNoticePanel();
  });

  claimAllBtn.addEventListener("click",claimAllHonorRewards);
  identityNoticeBtn.addEventListener("click",event => { event.stopPropagation();toggleNoticePanel(); });
  identityNoticePanel.addEventListener("click",event => {
    event.stopPropagation();
    const target = event.target.closest("[data-notice-index]");
    if(target) openNoticeTarget(Number(target.dataset.noticeIndex));
  });
  identityAuthBtn.addEventListener("click",event => {
    event.stopPropagation();
    readLocalAuth() ? handleLogout() : openRoom10Login();
  });

  room10LoginClose.addEventListener("click",() => closeRoom10Login());
  room10LoginToggle.addEventListener("click",toggleRoom10LoginCode);
  room10LoginSubmit.addEventListener("click",submitRoom10Login);
  room10LoginRegister.addEventListener("click",goRoom10Register);
  [room10LoginNickname,room10LoginCode].forEach(input => input.addEventListener("keydown",event => {
    if(event.key === "Enter") submitRoom10Login();
  }));
  room10LoginMask.addEventListener("click",event => { if(event.target === room10LoginMask) closeRoom10Login(); });

  room10ErrorConfirm.addEventListener("click",closeOperationFailure);
  room10ErrorMask.addEventListener("click",event => { if(event.target === room10ErrorMask) closeOperationFailure(); });
  rewardCloseBtn.addEventListener("click",closeRewardModal);
  rewardConfirmBtn.addEventListener("click",closeRewardModal);
  rewardMask.addEventListener("click",event => { if(event.target === rewardMask) closeRewardModal(); });

  document.addEventListener("keydown",event => {
    if(event.key !== "Escape") return;
    if(room10ErrorMask.classList.contains("show")) closeOperationFailure();
    else if(rewardMask.classList.contains("show")) closeRewardModal();
    else if(room10LoginMask.classList.contains("show")) closeRoom10Login();
    else closeNoticePanel();
  });

  window.addEventListener("resize",syncOverlayToImage);
  window.addEventListener("orientationchange",() => setTimeout(syncOverlayToImage,80));
  window.addEventListener("pageshow",event => { if(event.persisted) loadHonorData({force:true}); });
  document.addEventListener("visibilitychange",() => { if(!document.hidden) loadHonorData(); });
  window.addEventListener("storage",event => {
    if(event.key === null || LOGIN_STORAGE_KEYS.includes(event.key)){
      noticeCache.at = 0;
      loadHonorData({force:true});
      return;
    }
    if(String(event.key || "").startsWith(NOTICE_ACK_KEY)){
      const unread = noticeState.signature && noticeState.signature !== localStorage.getItem(noticeAckKey());
      setNoticeCount(unread ? noticeState.items.length : 0);
    }
  });

  window.addEventListener("error",event => {
    if(event.error || event.message) showOperationFailure(event.error || event.message,"页面运行");
  });
  window.addEventListener("unhandledrejection",event => showOperationFailure(event.reason || "发生了未处理的异步错误。","页面操作"));
}

async function initHonorPage(){
  room10LoginImage.src = room10AssetUrl("root.login","login.png");
  setupRoomNav();
  updateIdentity();
  bindEvents();
  renderAll();
  syncOverlayToImage();
  setRewardModalScaleForViewport();
  await loadHonorData({force:true});
}

document.addEventListener("DOMContentLoaded",initHonorPage);
if(img && img.complete && img.naturalWidth){
  syncOverlayToImage();
}else if(img){
  img.addEventListener("load",syncOverlayToImage,{once:true});
}
setTimeout(syncOverlayToImage,80);
</script>
</body>
</html>
