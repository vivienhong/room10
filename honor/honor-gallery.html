<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜作品展览页</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;}
:root{
  --stage-w:2048;
  --stage-h:1143;
  --stage-width:100vw;
  --stage-height:100vh;
  --ui-scale:1;
  --text-scale:1;
  --brown:#5b4632;
  --paper:rgba(255,249,240,.77);
  --line:rgba(224,202,176,.8);
  --shadow:0 calc(10px * var(--ui-scale)) calc(24px * var(--ui-scale)) rgba(91,70,50,.12);
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:"Microsoft YaHei","PingFang SC",Arial,Helvetica,sans-serif;
  color:var(--brown);
  background:#eadfce;
}
body{
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
}
button,input,select,textarea{
  font-family:inherit;
}
button{
  -webkit-tap-highlight-color:transparent;
}
#room{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 38%, rgba(255,252,244,.35), rgba(224,211,193,.62) 70%),
    #dfd1bd;
}
#stageFrame{
  position:relative;
  width:var(--stage-width);
  height:var(--stage-height);
  overflow:hidden;
  border-radius:0;
  box-shadow:0 0 0 1px rgba(255,255,255,.18);
}
#bg{
  position:absolute;
  z-index:1;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  user-select:none;
  pointer-events:none;
}
#overlay{
  position:absolute;
  inset:0;
  z-index:2;
  transform-origin:left top;
  font-size:calc(16px * var(--text-scale));
}

/* 顶部房间切换 */
.room-nav{
  position:absolute;
  left:30.49%;
  top:5.21%;
  width:39.76%;
  height:4.70%;
  transform:none;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:calc(11px * var(--ui-scale));
  padding:calc(5px * var(--ui-scale)) calc(8px * var(--ui-scale));
  border-radius:999px;
  background:rgba(255,250,242,.52);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 calc(8px * var(--ui-scale)) calc(18px * var(--ui-scale)) rgba(91,70,50,.13);
  backdrop-filter:blur(8px);
  white-space:nowrap;
}
.room-btn{
  flex:1 1 0;
  min-width:0;
  height:100%;
  padding:0 calc(8px * var(--ui-scale));
  border:none;
  border-radius:999px;
  cursor:pointer;
  color:#6a5038;
  font-size:calc(13px * var(--text-scale));
  font-weight:700;
  letter-spacing:.04em;
  background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(247,235,220,.72));
  border:1px solid rgba(224,202,176,.78);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72), 0 3px 8px rgba(91,70,50,.08);
}
.room-btn:hover{
  transform:translateY(calc(-1px * var(--ui-scale)));
  filter:brightness(1.03);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.78), 0 6px 12px rgba(91,70,50,.12);
}

/* 右上组件 */
.top-right-box{
  position:absolute;
  inset:0;
  z-index:32;
  pointer-events:none;
}
.top-right-box .identity-card{
  position:absolute;
  left:78.78%;
  top:15.62%;
  width:12.62%;
  pointer-events:auto;
}
.top-right-box .page-switcher{
  position:absolute;
  left:78.78%;
  top:22.39%;
  width:12.62%;
  pointer-events:auto;
}
.page-switcher{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(10px * var(--ui-scale));
  padding:calc(14px * var(--ui-scale));
  border-radius:calc(18px * var(--ui-scale));
  background:rgba(255,250,243,.58);
  border:1px solid rgba(226,204,176,.78);
  box-shadow:0 5px 12px rgba(91,70,50,.08), inset 0 1px 0 rgba(255,255,255,.62);
}
.page-switch-btn{
  width:100%;
  height:calc(48px * var(--ui-scale));
  padding:0 calc(16px * var(--ui-scale));
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-size:calc(16px * var(--text-scale));
  font-weight:800;
  color:#73573c;
  background:rgba(255,255,255,.7);
  border:1px solid rgba(226,204,176,.86);
  box-shadow:0 3px 8px rgba(91,70,50,.08), inset 0 1px 0 rgba(255,255,255,.7);
}
.page-switch-btn.active{
  background:rgba(139,107,75,.92);
  border-color:rgba(139,107,75,.92);
  color:#fffdf8;
}
.identity-card{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:calc(5px * var(--ui-scale));
  min-height:calc(42px * var(--ui-scale));
  max-width:100%;
  box-sizing:border-box;
  padding:calc(6px * var(--ui-scale)) calc(9px * var(--ui-scale));
  border-radius:999px;
  background:rgba(255,251,245,.72);
  border:1px solid rgba(224,202,176,.9);
  box-shadow:0 4px 10px rgba(91,70,50,.08), inset 0 1px 0 rgba(255,255,255,.65);
  color:#6a5038;
  font-size:calc(12px * var(--text-scale));
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
}
.identity-name{
  overflow:visible;
  text-overflow:clip;
  max-width:none;
  min-width:0;
  flex:0 0 auto;
}
.identity-role{
  overflow:visible;
  text-overflow:clip;
  max-width:none;
  flex:0 0 auto;
}
.identity-sep{
  color:rgba(116,88,61,.55);
}
.identity-action{
  border:none;
  cursor:pointer;
  height:calc(26px * var(--ui-scale));
  min-width:calc(48px * var(--ui-scale));
  margin-left:0;
  padding:0 calc(8px * var(--ui-scale));
  border-radius:999px;
  background:rgba(139,107,75,.9);
  color:#fffdf8;
  font-size:calc(12px * var(--text-scale));
  font-weight:800;
  flex:0 0 auto;
}

/* 主面板定位：按底图百分比坐标固定，组件随底图等比例缩放 */
.gallery-layout{
  position:absolute;
  inset:0;
  z-index:18;
  display:block;
  pointer-events:none;
}
.left-panel,
.right-panel{
  position:absolute;
  pointer-events:auto;
}
.left-panel{
  left:5.49%;
  top:25.62%;
  width:23.20%;
  height:64.92%;
}
.right-panel{
  left:30.49%;
  top:15.05%;
  width:42.13%;
  height:75.49%;
}
.left-panel,.right-panel{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:calc(24px * var(--ui-scale));
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.55);
  backdrop-filter:blur(8px);
  overflow:hidden;
}
.panel-head,.player-head{
  flex:0 0 auto;
  padding:calc(14px * var(--ui-scale)) calc(16px * var(--ui-scale)) calc(10px * var(--ui-scale));
  border-bottom:1px solid rgba(224,202,176,.65);
  background:linear-gradient(180deg, rgba(255,255,255,.58), rgba(250,242,232,.5));
}
.panel-title,.player-title{
  margin:0;
  color:#6a5038;
  font-size:calc(18px * var(--text-scale));
  line-height:1.2;
  letter-spacing:.03em;
}
.panel-subtitle,.player-subtitle{
  margin:calc(5px * var(--ui-scale)) 0 0;
  color:#8b6b4b;
  font-size:calc(12px * var(--text-scale));
  line-height:1.35;
}
.search-area{
  flex:0 0 auto;
  padding:calc(10px * var(--ui-scale)) calc(11px * var(--ui-scale));
  border-bottom:1px solid rgba(224,202,176,.58);
}
.search-input{
  width:100%;
  height:calc(34px * var(--ui-scale));
  border:none;
  outline:none;
  border-radius:calc(14px * var(--ui-scale));
  padding:0 calc(12px * var(--ui-scale));
  font-size:calc(13px * var(--text-scale));
  color:#5b4632;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(224,202,176,.82);
}
.filter-row{
  display:flex;
  flex-wrap:wrap;
  gap:calc(5px * var(--ui-scale));
  margin-top:calc(8px * var(--ui-scale));
}
.filter-btn{
  height:calc(27px * var(--ui-scale));
  padding:0 calc(8px * var(--ui-scale));
  border:none;
  border-radius:999px;
  background:rgba(255,255,255,.8);
  border:1px solid rgba(224,202,176,.82);
  color:#6a5038;
  font-size:calc(11.5px * var(--text-scale));
  font-weight:700;
  cursor:pointer;
  transition:.18s ease;
}
.filter-btn:hover{background:rgba(255,255,255,.95);}
.filter-btn.active{
  background:rgba(139,107,75,.92);
  border-color:rgba(139,107,75,.92);
  color:#fff;
}
.list-wrap{
  flex:1 1 auto;
  min-height:0;
  padding:calc(8px * var(--ui-scale)) calc(9px * var(--ui-scale));
  overflow:auto;
  scrollbar-width:thin;
}
.work-item{
  width:100%;
  text-align:left;
  border:none;
  cursor:pointer;
  display:block;
  padding:calc(10px * var(--ui-scale)) calc(11px * var(--ui-scale));
  margin-bottom:calc(8px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  background:rgba(255,255,255,.66);
  border:1px solid rgba(224,202,176,.78);
  color:#5b4632;
  transition:.18s ease;
}
.work-item:hover{
  background:rgba(255,255,255,.9);
  transform:translateY(calc(-1px * var(--ui-scale)));
}
.work-item.active{
  background:rgba(243,231,215,.95);
  border-color:#cfa878;
  box-shadow:0 5px 14px rgba(91,70,50,.08);
}
.work-main-row{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:calc(7px * var(--ui-scale));
  margin-bottom:calc(5px * var(--ui-scale));
}
.work-no,.work-type,.info-type,.meta-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  font-size:calc(11.5px * var(--text-scale));
}
.work-no{
  min-width:calc(44px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(7px * var(--ui-scale));
  background:#f3e6d6;
  color:#7a5a3b;
  font-weight:800;
}
.work-type{
  min-width:calc(44px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(8px * var(--ui-scale));
  background:#fff;
  border:1px solid rgba(224,202,176,.82);
  color:#8b6c4e;
  font-weight:700;
}
.work-title{
  min-width:0;
  margin:0;
  font-size:calc(15.5px * var(--text-scale));
  color:#6a5038;
  line-height:1.28;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.work-meta{
  font-size:calc(12px * var(--text-scale));
  color:#8e7154;
  line-height:1.45;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.empty-state,.loading-state{
  padding:calc(28px * var(--ui-scale)) calc(14px * var(--ui-scale));
  text-align:center;
  color:#9e8060;
  font-size:calc(13px * var(--text-scale));
  line-height:1.7;
}
.player-body{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:calc(14px * var(--ui-scale));
  gap:calc(12px * var(--ui-scale));
  overflow:hidden;
}
.video-shell{
  flex:0 0 auto;
  width:100%;
  aspect-ratio:16 / 9;
  max-height:50%;
  border-radius:calc(16px * var(--ui-scale));
  overflow:hidden;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(224,202,176,.86);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
}
.video-shell iframe{
  width:100%;
  height:100%;
  border:none;
  display:block;
}
.placeholder{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:calc(10px * var(--ui-scale));
  text-align:center;
  color:#9a7b5b;
  padding:calc(22px * var(--ui-scale));
  font-size:calc(14px * var(--text-scale));
}
.placeholder-icon{
  width:calc(58px * var(--ui-scale));
  height:calc(58px * var(--ui-scale));
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:calc(25px * var(--text-scale));
  background:rgba(255,255,255,.75);
  border:1px solid rgba(224,202,176,.86);
}
.info-card{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(224,202,176,.78);
  border-radius:calc(18px * var(--ui-scale));
  padding:calc(14px * var(--ui-scale));
}
.info-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:calc(9px * var(--ui-scale));
  margin-bottom:calc(10px * var(--ui-scale));
}
.info-title-line{
  min-width:0;
  display:flex;
  align-items:center;
  gap:calc(9px * var(--ui-scale));
  flex-wrap:wrap;
}
.info-no{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:calc(58px * var(--ui-scale));
  height:calc(28px * var(--ui-scale));
  padding:0 calc(9px * var(--ui-scale));
  border-radius:999px;
  background:#f3e6d6;
  color:#7a5a3b;
  font-size:calc(12px * var(--text-scale));
  font-weight:800;
}
.info-title{
  min-width:0;
  margin:0;
  font-size:calc(20px * var(--text-scale));
  color:#6a5038;
  line-height:1.25;
}
.info-type{
  flex:0 0 auto;
  min-width:calc(56px * var(--ui-scale));
  padding:calc(6px * var(--ui-scale)) calc(10px * var(--ui-scale));
  background:#f3e6d6;
  color:#7a5a3b;
  font-weight:800;
}
.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:calc(10px * var(--ui-scale));
}
.detail-card{
  background:rgba(255,255,255,.7);
  border:1px solid rgba(224,202,176,.72);
  border-radius:calc(14px * var(--ui-scale));
  padding:calc(10px * var(--ui-scale)) calc(11px * var(--ui-scale));
  min-width:0;
}
.detail-card.wide{grid-column:1 / -1;}
.detail-label{
  color:#a08262;
  font-size:calc(11.5px * var(--text-scale));
  margin-bottom:calc(5px * var(--ui-scale));
  font-weight:800;
}
.detail-value{
  color:#6a5038;
  font-size:calc(13.5px * var(--text-scale));
  line-height:1.48;
  word-break:break-word;
}

.part-line{
  color:#5b4632;
  font-size:calc(14px * var(--text-scale));
  line-height:1.55;
  font-weight:800;
  word-break:break-word;
}
.perform-row .detail-value{
  font-weight:800;
  color:#5b4632;
}
.detail-card.perform-row{
  display:grid;
  grid-template-columns:1fr minmax(calc(140px * var(--ui-scale)), .38fr);
  gap:calc(10px * var(--ui-scale));
  align-items:start;
}
.link-text{
  color:#765638;
  text-decoration:none;
  border-bottom:1px dotted rgba(118,86,56,.55);
}
.link-text:hover{
  color:#4e3722;
}
.action-row{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:calc(8px * var(--ui-scale));
  flex-wrap:wrap;
  margin-top:calc(12px * var(--ui-scale));
}
.soft-btn{
  border:none;
  cursor:pointer;
  height:calc(30px * var(--ui-scale));
  padding:0 calc(12px * var(--ui-scale));
  border-radius:999px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(224,202,176,.82);
  color:#6a5038;
  font-size:calc(12px * var(--text-scale));
  font-weight:800;
}
.primary-btn{
  background:rgba(139,107,75,.92);
  border-color:rgba(139,107,75,.92);
  color:#fffdf8;
}
.warn-btn{
  background:rgba(174,111,79,.9);
  border-color:rgba(174,111,79,.9);
  color:#fffdf8;
}
.hidden{display:none !important;}

/* 登录与编辑弹窗 */
.modal-mask{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(68,50,34,.34);
  backdrop-filter:blur(5px);
}
.modal-mask.show{display:flex;}
.modal{
  width:min(760px, 94vw);
  max-height:min(86vh, 780px);
  overflow:auto;
  border-radius:24px;
  background:rgba(255,250,242,.96);
  border:1px solid rgba(224,202,176,.95);
  box-shadow:0 18px 38px rgba(65,45,26,.22);
}
.modal.small{width:min(390px, 92vw);}
.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 18px 12px;
  border-bottom:1px solid rgba(224,202,176,.76);
}
.modal-title{
  margin:0;
  color:#6a5038;
  font-size:20px;
}
.modal-close{
  border:none;
  cursor:pointer;
  width:32px;
  height:32px;
  border-radius:999px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(224,202,176,.8);
  color:#6a5038;
  font-size:18px;
  line-height:1;
}
.modal-body{
  padding:16px 18px 18px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.form-field{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.form-field.wide{grid-column:1 / -1;}
.form-label{
  color:#8b6b4b;
  font-size:12px;
  font-weight:800;
}
.form-input,
.form-select{
  width:100%;
  min-height:38px;
  border-radius:13px;
  border:1px solid rgba(224,202,176,.9);
  background:rgba(255,255,255,.88);
  color:#5b4632;
  font-size:14px;
  outline:none;
  padding:0 11px;
}
.form-textarea{
  min-height:70px;
  resize:vertical;
  padding:10px 11px;
}
.edit-parts{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.edit-part-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:9px;
  border-radius:14px;
  background:rgba(255,255,255,.56);
  border:1px solid rgba(224,202,176,.7);
}
.logs-wrap{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.log-item{
  padding:9px 10px;
  border-radius:14px;
  background:rgba(255,255,255,.62);
  border:1px solid rgba(224,202,176,.75);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.log-main{
  min-width:0;
  font-size:12px;
  color:#7c6043;
  line-height:1.45;
}
.log-status{
  color:#a07959;
}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}
.msg{
  margin-top:10px;
  font-size:13px;
  color:#9a6e4a;
  line-height:1.5;
}


/* ===== 鲨鱼解说气泡 ===== */
.shark-guide-bubble{
  position:absolute;
  left:76.95%;
  top:46.95%;
  width:17.20%;
  height:calc(132px * var(--ui-scale));
  z-index:24;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding:calc(12px * var(--ui-scale)) calc(16px * var(--ui-scale)) calc(18px * var(--ui-scale));
  border-radius:calc(24px * var(--ui-scale)) calc(24px * var(--ui-scale)) calc(24px * var(--ui-scale)) calc(12px * var(--ui-scale));
  background:rgba(255,250,242,.72);
  border:1px solid rgba(226,204,176,.82);
  box-shadow:0 calc(8px * var(--ui-scale)) calc(18px * var(--ui-scale)) rgba(91,70,50,.10), inset 0 1px 0 rgba(255,255,255,.66);
  backdrop-filter:blur(7px);
  color:#6a5038;
  pointer-events:auto;
}
.shark-guide-bubble::after{
  content:"";
  position:absolute;

/* ===== 背景音符与小红花特效：唯一版，位于背景上方、组件下方 ===== */
.gallery-bg-effects{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  overflow:hidden;
}
.gallery-bg-effects .bg-fx-item{
  position:absolute;
  left:var(--x);
  top:var(--y);
  transform:translate(-50%, -50%);
  opacity:var(--opacity);
  animation:bgFloatLarge var(--dur) ease-in-out infinite;
  animation-delay:var(--delay);
  will-change:transform, opacity;
}
.gallery-bg-effects .bg-fx-item::before{
  content:var(--symbol);
  display:block;
  font-family:"Times New Roman","Georgia","Microsoft YaHei",serif;
  font-size:calc(var(--size) * 1px * var(--ui-scale));
  line-height:1;
  text-shadow:0 2px 4px rgba(255,255,255,.58);
}
.gallery-bg-effects .bg-fx-item.note::before{
  color:rgba(121,91,172,.68);
}
.gallery-bg-effects .bg-fx-item.flower::before{
  color:rgba(224,82,132,.70);
}
.gallery-bg-effects .bg-fx-item.flower::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:calc(var(--size) * .45px * var(--ui-scale));
  height:calc(var(--size) * .45px * var(--ui-scale));
  transform:translate(-50%, -50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,228,190,.45), rgba(255,228,190,0) 72%);
}
@keyframes bgFloatLarge{
  0%{
    transform:translate(-50%, -50%) translate3d(0,0,0) rotate(-4deg) scale(.95);
  }
  50%{
    transform:translate(-50%, -50%) translate3d(calc(10px * var(--ui-scale)), calc(-22px * var(--ui-scale)), 0) rotate(6deg) scale(1.12);
  }
  100%{
    transform:translate(-50%, -50%) translate3d(0,0,0) rotate(-4deg) scale(.95);
  }
}
@media (max-width:540px){
  .gallery-bg-effects{display:none;}
}

/* ===== 房间按钮 hover 冒出特效：唯一版 ===== */
.room-btn{
  position:relative;
  overflow:visible;
  isolation:isolate;
}
.room-btn::before,
.room-btn::after{
  position:absolute;
  left:50%;
  pointer-events:none;
  opacity:0;
  z-index:5;
  white-space:nowrap;
  text-shadow:0 2px 8px rgba(255,255,255,.82);
}
.room-btn::before{
  content:"✿   ✦   ✿";
  top:18%;
  color:rgba(236,112,156,.98);
  font-size:calc(22px * var(--text-scale));
  transform:translate(-50%, 12px) scale(.72);
}
.room-btn::after{
  content:"♪    ♫";
  top:4%;
  color:rgba(244,187,86,.98);
  font-size:calc(20px * var(--text-scale));
  transform:translate(-50%, 14px) scale(.70);
}
.room-btn:hover::before{
  animation:roomBurstFlowerSlow 1.85s ease-out forwards;
}
.room-btn:hover::after{
  animation:roomBurstNoteSlow 1.95s ease-out forwards;
}
@keyframes roomBurstFlowerSlow{
  0%{opacity:0; transform:translate(-50%, 14px) scale(.68) rotate(-5deg);}
  20%{opacity:1;}
  76%{opacity:.9;}
  100%{opacity:0; transform:translate(-50%, -38px) scale(1.26) rotate(8deg);}
}
@keyframes roomBurstNoteSlow{
  0%{opacity:0; transform:translate(-50%, 16px) scale(.66) rotate(6deg);}
  22%{opacity:1;}
  78%{opacity:.88;}
  100%{opacity:0; transform:translate(-50%, -46px) scale(1.22) rotate(-9deg);}
}
@media (max-width:540px){
  .room-btn::before,
  .room-btn::after{display:none;}
}

function updateStageSize(){
  if (window.innerWidth <= 540) {
    document.documentElement.style.setProperty("--stage-width", "100vw");
    document.documentElement.style.setProperty("--stage-height", "auto");
    document.documentElement.style.setProperty("--ui-scale", "1");
    document.documentElement.style.setProperty("--text-scale", "1");
    return;
  }

  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let width = vw;
  let height = width / STAGE_RATIO;

  if (height > vh) {
    height = vh;
    width = height * STAGE_RATIO;
  }

  const scale = width / 2048;
  const uiScale = Math.max(.26, Math.min(1.56, scale));
  const textScale = Math.max(.28, Math.min(1.52, scale * 1.02));

  document.documentElement.style.setProperty("--stage-width", `${width}px`);
  document.documentElement.style.setProperty("--stage-height", `${height}px`);
  document.documentElement.style.setProperty("--ui-scale", uiScale.toFixed(4));
  document.documentElement.style.setProperty("--text-scale", textScale.toFixed(4));
}

function escapeHtml(str){
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDateText(dateString){
  if (!dateString) return "—";
  const raw = String(dateString).trim();
  const date = new Date(raw.includes("T") ? raw : raw + "T00:00:00");
  if (Number.isNaN(date.getTime())) return raw;
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function dateInputValue(dateString){
  const text = formatDateText(dateString);
  return text === "—" ? "" : text;
}

function normalizeName(value){
  return String(value || "").trim().toLowerCase();
}

function uniqueBy(items, getKey){
  const seen = new Set();
  const result = [];
  items.forEach(item => {
    const key = getKey(item);
    if (!key || seen.has(key)) return;
    seen.add(key);
    result.push(item);
  });
  return result;
}

function pickText(obj, keys, fallback = ""){
  for (const key of keys) {
    const value = obj?.[key];
    if (value !== null && value !== undefined && String(value).trim() !== "") {
      return String(value).trim();
    }
  }
  return fallback;
}

function pickDate(obj, keys){
  for (const key of keys) {
    const value = obj?.[key];
    if (value !== null && value !== undefined && String(value).trim() !== "") {
      return value;
    }
  }
  return null;
}

function normalizeUuidValue(value){

  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(raw) ? raw : "";

function getUniqueAssignedSingerCount(task){
  const partIds = uniqueBy(
    (task.parts || []).map(part => String(part.assigned_member_id || "").trim()).filter(Boolean),
    v => v
  );
  const singerIds = uniqueBy(
    (task.singers || []).map(singer => String(singer.member_id || "").trim()).filter(Boolean),
    v => v
  );
  return uniqueBy([...partIds, ...singerIds], v => v).length;
}

function isAllSingersSubmitted(task){
  const singers = task.singers || [];
  return singers.length > 0 && singers.every(item => !!item.is_submitted);
}

function isTaskInfoComplete(task){
  const rows = task.parts || [];
  const singerQuota = Math.max(1, Number(task.participant_count) || 1);
  const assignedSingerCount = getUniqueAssignedSingerCount(task);
  const hasProducer = !!String(task.producer_member_id || "").trim();
  const hasTone = !!String(task.project_tone || "").trim();

  const allRowsComplete = rows.length > 0 && rows.every(row => {
    const partText = String(row.original_name || "").trim();
    const assignedId = String(row.assigned_member_id || "").trim();
    return !!partText && !!assignedId;
  });

  return assignedSingerCount >= singerQuota && hasProducer && hasTone && allRowsComplete;
}

function isReadyForHonorShow(task){
  if (!isTaskInfoComplete(task)) return false;
  if (!isAllSingersSubmitted(task)) return false;

  const releaseDateText = String(task.release_date || "").trim();
  if (!releaseDateText) return false;

  const releaseDate = new Date(releaseDateText + "T00:00:00");
  if (Number.isNaN(releaseDate.getTime())) return false;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return today >= releaseDate;
}

function deriveSingersText(task){
  const names = [];
  (task.singers || []).forEach(item => {
    const name = String(item.member_name || "").trim();
    if (name) names.push(name);
  });
  (task.parts || []).forEach(item => {
    const name = String(item.assigned_member_name || "").trim();
    if (name) names.push(name);
  });
  const uniqueNames = uniqueBy(names, normalizeName);
  return uniqueNames.join(" / ") || "—";
}

function transformDisplayLink(raw){
  const link = String(raw || "").trim();
  if (!link) return "";

  if (/player\.bilibili\.com\/player\.html/i.test(link)) return link;

  const bvidMatch = link.match(/BV[0-9A-Za-z]+/i);
  if (bvidMatch) {
    const pageMatch = link.match(/[?&]p=(\d+)/i);
    const page = pageMatch ? pageMatch[1] : "1";
    return `https://player.bilibili.com/player.html?bvid=${bvidMatch[0]}&page=${page}`;
  }

  const youtubeWatchMatch = link.match(/[?&]v=([A-Za-z0-9_-]{6,})/);
  if (youtubeWatchMatch) {
    return `https://www.youtube.com/embed/${youtubeWatchMatch[1]}`;
  }

  const youtubeShortMatch = link.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);
  if (youtubeShortMatch) {
    return `https://www.youtube.com/embed/${youtubeShortMatch[1]}`;
  }

  if (/youtube\.com\/embed\//i.test(link)) return link;
  return link;
}

function canEmbed(link){
  if (!link) return false;
  return /player\.bilibili\.com\/player\.html/i.test(link) || /youtube\.com\/embed\//i.test(link);
}

function buildOriginalLine(parts){
  if (!parts || !parts.length) return "—";
  return parts.map(part => String(part.original_name || "未填写").trim() || "未填写").join(" / ");
}

function buildSingerLine(parts){
  if (!parts || !parts.length) return "—";
  return parts.map(part => String(part.assigned_member_name || "未分配").trim() || "未分配").join(" / ");
}

function buildWorkRecord(task){
  return {
    id: String(task.id || ""),
    no: pickText(task, ["project_code"], "—"),
    type: pickText(task, ["project_type"], "其他"),
    title: pickText(task, ["project_name"], "未命名作品"),
    singers: deriveSingersText(task),
    mixer: String(task.producer_name || "").trim() || "—",
    producer_member_id: String(task.producer_member_id || "").trim(),
    releaseDate: formatDateText(task.release_date),
    releaseRaw: dateInputValue(task.release_date),
    embedUrl: transformDisplayLink(task.display_link),
    rawLink: String(task.display_link || "").trim(),
    createdAt: String(task.created_at || ""),
    parts: task.parts || [],
    rawTask: task
  };
}

async function loadWorksFromSupabase(){
  workList.innerHTML = '<div class="loading-state">正在读取作品...</div>';

  try {
    const { data: projectsData, error: projectsError } = await supabaseClient
      .from("projects")
      .select(`
        *,
        producer_member:members!projects_producer_member_id_fkey (
          id,
          nickname,
          name
        )
      `);

    if (projectsError) throw projectsError;

    const projectIds = (projectsData || []).map(item => item.id);
    let partsData = [];
    let singersData = [];

    if (projectIds.length) {
      const { data: partRows, error: partsError } = await supabaseClient
        .from("project_parts")
        .select(`
          id,
          project_id,
          part_order,
          original_name,
          assigned_member_id,
          members!project_parts_assigned_member_id_fkey (
            id,
            nickname,
            name
          )
        `)
        .in("project_id", projectIds)
        .order("part_order", { ascending: true });
      if (partsError) throw partsError;
      partsData = partRows || [];

      const { data: singerRows, error: singersError } = await supabaseClient
        .from("project_singers")
        .select(`
          id,
          project_id,
          member_id,
          is_submitted,
          submitted_at,
          members!project_singers_member_id_fkey (
            id,
            nickname,
            name
          )
        `)
        .in("project_id", projectIds);
      if (singersError) throw singersError;
      singersData = singerRows || [];
    }

    const partMap = new Map();
    const singerMap = new Map();

    partsData.forEach(part => {
      const key = String(part.project_id);
      if (!partMap.has(key)) partMap.set(key, []);
      partMap.get(key).push({
        id: part.id,
        part_order: part.part_order,
        original_name: part.original_name,
        assigned_member_id: part.assigned_member_id ? String(part.assigned_member_id) : "",
        assigned_member_name: part.members?.nickname || part.members?.name || ""
      });
    });

    singersData.forEach(singer => {
      const key = String(singer.project_id);
      if (!singerMap.has(key)) singerMap.set(key, []);
      singerMap.get(key).push({
        id: singer.id,
        member_id: singer.member_id ? String(singer.member_id) : "",
        member_name: singer.members?.nickname || singer.members?.name || "",
        is_submitted: !!singer.is_submitted,
        submitted_at: singer.submitted_at || null
      });
    });

    const projectTasks = (projectsData || []).map(project => {
      const id = String(project.id);
      return {
        ...project,
        id,
        project_code: pickText(project, ["project_code"], ""),
        project_name: pickText(project, ["project_name"], ""),
        project_type: pickText(project, ["project_type"], ""),
        participant_count: project.participant_count ?? 1,
        producer_member_id: project.producer_member_id ? String(project.producer_member_id) : "",
        producer_name: project.producer_member?.nickname || project.producer_member?.name || "",
        release_date: pickDate(project, ["release_date","published_at","publish_date","scheduled_release_date"]) || null,
        display_link: pickText(project, ["display_link","video_link","publish_link","bilibili_link","youtube_link","link"], ""),
        project_tone: project.project_tone || "",
        created_at: project.created_at || null,
        parts: (partMap.get(id) || []).sort((a, b) => (a.part_order || 0) - (b.part_order || 0)),
        singers: singerMap.get(id) || []
      };
    });

    WORKS = projectTasks
      .filter(isReadyForHonorShow)
      .map(buildWorkRecord)
      .sort((a, b) => {
        const aNo = parseInt(String(a.no).match(/\d+/)?.[0] || "0", 10);
        const bNo = parseInt(String(b.no).match(/\d+/)?.[0] || "0", 10);
        if (aNo !== bNo) return aNo - bNo;
        return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
      });

    if (currentSelectedId && !WORKS.some(item => item.id === currentSelectedId)) {
      currentSelectedId = null;
    }

    renderList();

    if (currentSelectedId) {
      const currentWork = WORKS.find(item => item.id === currentSelectedId);
      if (currentWork) selectWork(currentWork, false);
    } else if (WORKS[0]) {
      selectWork(WORKS[0], false);
    } else {
      renderInfoCard(null);
    }
  } catch (err) {
    console.error("读取作品失败：", err);
    workList.innerHTML = '<div class="empty-state">读取作品失败，请检查 projects / project_parts / project_singers 的读取权限。</div>';
    videoShell.innerHTML = `
      <div class="placeholder">
        <div class="placeholder-icon">!</div>
        <div>作品读取失败</div>
      </div>
    `;
    infoCard.innerHTML = `
      <div class="info-top">
        <div class="info-title-line">
          <span class="info-no">!</span>
          <h3 class="info-title">读取失败</h3>
        </div>
        <span class="info-type">异常</span>
      </div>
      <div class="detail-card wide">
        <div class="detail-value">请检查数据库表权限、外键名称和展示链接字段。</div>
      </div>
    `;
  }
}

function getFilteredWorks(){
  return WORKS.filter(work => {
    const matchType = currentType === "全部" || work.type === currentType;
    const keyword = currentKeyword.trim().toLowerCase();
    const partsText = (work.parts || []).map(part => `${part.original_name || ""} ${part.assigned_member_name || ""}`).join(" ");
    const combined = `${work.no} ${work.type} ${work.title} ${work.singers} ${work.mixer} ${partsText}`.toLowerCase();
    const matchKeyword = !keyword || combined.includes(keyword);
    return matchType && matchKeyword;
  });
}

function renderList(){
  const works = getFilteredWorks();

  if (!WORKS.length) {
    workList.innerHTML = `
      <div class="empty-state">
        当前还没有满足展览条件的作品。<br>
        需要资料完整、全员交音、已填写预计发布日期，且日期已到。
      </div>
    `;
    return;
  }

  if (!works.length) {
    workList.innerHTML = `
      <div class="empty-state">
        没有找到符合条件的作品。<br>
        可以换个关键词，或切换分类试试。
      </div>
    `;
    return;
  }

  workList.innerHTML = works.map(work => `
    <button class="work-item ${work.id === currentSelectedId ? "active" : ""}" data-id="${escapeHtml(work.id)}">
      <div class="work-main-row">
        <span class="work-no">${escapeHtml(work.no === "—" ? "编号待补" : "#" + work.no)}</span>
        <h3 class="work-title">${escapeHtml(work.title)}</h3>
        <span class="work-type">${escapeHtml(work.type)}</span>
      </div>
      <div class="work-meta">演唱者：${escapeHtml(work.singers)}</div>
      <div class="work-meta">发布日期：${escapeHtml(work.releaseDate)}</div>
    </button>
  `).join("");

  document.querySelectorAll(".work-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      const work = WORKS.find(item => item.id === id);
      if (work) selectWork(work);
    });
  });
}

function renderPlayerUnavailable(work){
  videoShell.innerHTML = `
    <div class="placeholder">
      <div class="placeholder-icon">♪</div>
      <div>${work?.rawLink ? '该链接暂不支持直接嵌入，可在作品资料中打开原链接。' : '该作品还没有填写展示链接。'}</div>
    </div>
  `;
}

function getSelectedWork(){
  return currentSelectedId ? WORKS.find(item => item.id === currentSelectedId) : null;
}

function selectWork(work, rerenderList = true){
  currentSelectedId = work.id;
  renderPlayerStandby(work);
  renderInfoCard(work);
  if (rerenderList) renderList();
}

function renderPlayerStandby(work){
  if (!work) {
    videoShell.innerHTML = `
      <div class="placeholder">
        <div class="placeholder-icon">▶</div>
        <div>请选择左侧作品开始播放</div>
      </div>
    `;
    return;
  }

  if (work.embedUrl && canEmbed(work.embedUrl)) {
    videoShell.innerHTML = `
      <button class="player-start" type="button" aria-label="播放作品">
        <span class="placeholder-icon">▶</span>
        <span class="player-start-title">${escapeHtml(work.title || "播放作品")}</span>
        <span class="player-start-sub">点击播放视频</span>
      </button>
    `;

    const startBtn = videoShell.querySelector(".player-start");
    if (startBtn) {
      startBtn.addEventListener("click", () => playSelectedWork(work));
    }
  } else {
    renderPlayerUnavailable(work);
  }
}

function playSelectedWork(work){
  if (!work || !work.embedUrl || !canEmbed(work.embedUrl)) {
    renderPlayerUnavailable(work);
    return;
  }

  videoShell.innerHTML = `
    <iframe
      src="${escapeHtml(work.embedUrl)}"
      scrolling="no"
      frameborder="0"
      allowfullscreen="true"
      allow="fullscreen; picture-in-picture">
    </iframe>
  `;
}

async function loadMemberOptions(){
  if (!isLoggedIn()) {
    MEMBER_OPTIONS = [];
    return [];
  }

  try {
    const { data, error } = await supabaseClient.rpc("get_gallery_member_options", {
      p_nickname: currentMember.nickname,
      p_member_code: currentMember.code
    });

    if (error) throw error;
    MEMBER_OPTIONS = data || [];
    return MEMBER_OPTIONS;
  } catch (err) {
    console.error("读取成员选项失败：", err);
    MEMBER_OPTIONS = [];
    return [];
  }
}

function buildMemberOptionsHtml(selectedId, includeEmpty = true){
  const empty = includeEmpty ? `<option value="">未选择</option>` : "";
  return empty + (MEMBER_OPTIONS || []).map(member => `
    <option value="${escapeHtml(member.member_id)}" ${String(member.member_id) === String(selectedId || "") ? "selected" : ""}>
      ${escapeHtml(member.nickname || "")}
    </option>
  `).join("");
}

async function openEditModal(work){
  if (!isLoggedIn()) {
    openModal(loginMask);
    return;
  }

  if (!MEMBER_OPTIONS.length) await loadMemberOptions();

  document.getElementById("editProjectCode").value = work.no === "—" ? "" : work.no;
  document.getElementById("editProjectName").value = work.title || "";
  document.getElementById("editProjectType").value = work.type || "其他";
  document.getElementById("editReleaseDate").value = work.releaseRaw || "";
  document.getElementById("editDisplayLink").value = work.rawLink || "";
  document.getElementById("editProducer").innerHTML = buildMemberOptionsHtml(work.producer_member_id, true);

  const partsWrap = document.getElementById("editParts");
  partsWrap.innerHTML = (work.parts || []).map(part => `
    <div class="edit-part-row" data-part-id="${escapeHtml(part.id)}">
      <label class="form-field">
        <span class="form-label">原唱</span>
        <input class="form-input part-original-input" type="text" value="${escapeHtml(part.original_name || "")}" />
      </label>
      <label class="form-field">
        <span class="form-label">对应演唱者</span>
        <select class="form-select part-singer-select">
          ${buildMemberOptionsHtml(part.assigned_member_id, true)}
        </select>
      </label>
    </div>
  `).join("") || `<div class="empty-state">暂无分配行。</div>`;

  document.getElementById("editMsg").textContent = "保存前会再次确认，并自动保存修改记录。";
  openModal(editMask);
}

document.getElementById("saveEditBtn").addEventListener("click", async () => {
  const work = getSelectedWork();
  const msg = document.getElementById("editMsg");

  if (!work) {
    msg.textContent = "请先选择作品。";
    return;
  }

  if (!isLoggedIn()) {
    msg.textContent = "请先登录后再修改。";
    openModal(loginMask);
    return;
  }

  const projectPatch = {
    project_code: document.getElementById("editProjectCode").value.trim(),
    project_name: document.getElementById("editProjectName").value.trim(),
    project_type: document.getElementById("editProjectType").value.trim(),
    producer_member_id: normalizeUuidValue(document.getElementById("editProducer").value),
    release_date: document.getElementById("editReleaseDate").value.trim(),
    display_link: document.getElementById("editDisplayLink").value.trim()
  };

  const partsPatch = Array.from(document.querySelectorAll(".edit-part-row")).map(row => ({
    id: normalizeUuidValue(row.dataset.partId),
    original_name: row.querySelector(".part-original-input").value.trim(),
    assigned_member_id: normalizeUuidValue(row.querySelector(".part-singer-select").value)
  })).filter(part => part.id);

  if (!projectPatch.project_code || !projectPatch.project_name || !projectPatch.project_type) {
    msg.textContent = "编号、作品名、分类不能为空。";
    return;
  }

  const assignedIds = partsPatch.map(part => part.assigned_member_id).filter(Boolean);
  const duplicatedId = assignedIds.find((id, index) => assignedIds.indexOf(id) !== index);
  if (duplicatedId) {
    msg.textContent = "同一个成员不能在同一作品里重复对应多个原唱。";
    return;
  }

  const confirmText = [
    "确认要修改这份作品资料吗？",
    "",
    "修改后会影响作品展览页显示，也可能影响荣誉墙统计。",
    "如果改错，可以在修改记录里撤回。"
  ].join("\n");

  if (!confirm(confirmText)) return;

  msg.textContent = "正在保存...";
  try {
    const { data, error } = await supabaseClient.rpc("update_gallery_work_info", {
      p_nickname: currentMember.nickname,
      p_member_code: currentMember.code,
      p_project_id: work.id,
      p_project_patch: projectPatch,
      p_parts_patch: partsPatch
    });

    if (error) throw error;

    const row = Array.isArray(data) ? data[0] : data;
    if (!row?.success) {
      msg.textContent = row?.message || "保存失败。";
      return;
    }

    msg.textContent = row.message || "已保存。";
    closeModal(editMask);
    await loadWorksFromSupabase();
  } catch (err) {
    console.error("保存作品资料失败：", err);
    const detail = err?.message || err?.details || err?.hint || "";
    msg.textContent = detail ? `保存失败：${detail}` : "保存失败，请检查函数 update_gallery_work_info。";
  }
});

async function openLogsModal(work){
  if (!isLoggedIn()) {
    openModal(loginMask);
    return;
  }

  logsWrap.innerHTML = `<div class="loading-state">正在读取修改记录...</div>`;
  openModal(logsMask);

  try {
    const { data, error } = await supabaseClient.rpc("get_gallery_edit_logs", {
      p_nickname: currentMember.nickname,
      p_member_code: currentMember.code,
      p_project_id: work.id
    });

    if (error) throw error;

    const logs = data || [];
    if (!logs.length) {
      logsWrap.innerHTML = `<div class="empty-state">暂无可查看的修改记录。</div>`;
      return;
    }

    logsWrap.innerHTML = logs.map(log => {
      const timeText = formatDateTime(log.created_at);
      const reverted = !!log.is_reverted;
      return `
        <div class="log-item">
          <div class="log-main">
            <strong>${escapeHtml(log.editor_nickname || "未知成员")}</strong>
            <span> 于 ${escapeHtml(timeText)} 修改</span>
            <div class="log-status">${reverted ? `已由 ${escapeHtml(log.reverted_by_nickname || "未知成员")} 撤回` : "可撤回"}</div>
          </div>
          <button class="soft-btn ${reverted ? "" : "warn-btn"}" type="button" data-log-id="${escapeHtml(log.log_id)}" ${reverted ? "disabled" : ""}>
            ${reverted ? "已撤回" : "撤回"}
          </button>
        </div>
      `;
    }).join("");

    logsWrap.querySelectorAll("[data-log-id]").forEach(btn => {
      btn.addEventListener("click", () => revertLog(btn.dataset.logId));
    });
  } catch (err) {
    console.error("读取修改记录失败：", err);
    logsWrap.innerHTML = `<div class="empty-state">读取修改记录失败，请检查 get_gallery_edit_logs 函数。</div>`;
  }
}

function formatDateTime(value){
  if (!value) return "—";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  const hh = String(date.getHours()).padStart(2, "0");
  const mm = String(date.getMinutes()).padStart(2, "0");
  return `${y}-${m}-${d} ${hh}:${mm}`;
}

async function revertLog(logId){
  if (!isLoggedIn()) {
    openModal(loginMask);
    return;
  }

  const confirmText = [
    "确认撤回这次修改吗？",
    "",
    "撤回后会把作品资料恢复到这次修改前的状态。"
  ].join("\n");

  if (!confirm(confirmText)) return;

  try {
    const { data, error } = await supabaseClient.rpc("revert_gallery_edit_log", {
      p_nickname: currentMember.nickname,
      p_member_code: currentMember.code,
      p_log_id: logId
    });

    if (error) throw error;

    const row = Array.isArray(data) ? data[0] : data;
    alert(row?.message || "已处理。");

    if (row?.success) {
      closeModal(logsMask);
      await loadWorksFromSupabase();
    }
  } catch (err) {
    console.error("撤回失败：", err);
    alert("撤回失败，请检查 revert_gallery_edit_log 函数。");
  }
}

searchInput.addEventListener("input", (e) => {
  currentKeyword = e.target.value || "";
  renderList();
});

filterButtons().forEach(btn => {
  btn.addEventListener("click", () => {
    filterButtons().forEach(item => item.classList.remove("active"));

    currentType = btn.dataset.type;
