<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜宿舍</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --bg-ui-scale:1;
  /* =========================================================
     全站底图 / 组件缩放
     - 541px 及以上：#overlay 绑定到底图实际显示区域
     - 540px 以下：手机流式布局
  ========================================================= */
  --ui-scale:var(--bg-ui-scale);
  --room-nav-scale:var(--ui-scale);
  --identity-scale:var(--ui-scale);

  /* =========================================================
     身份组件坐标
     位置参考最新身份组件测试版
  ========================================================= */
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);
  --identity-name-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;

  /* =========================================================
     房间按钮坐标
     默认位置参考游戏房顶部安全区：
     避开左上门牌，也避开右侧身份组件。
     9 个按钮固定显示，等宽、等高、等间隔。
  ========================================================= */
  /*
     外框位置改为底图百分比绑定，不再使用 px × scale。
     原来的 px × scale 在 541px–650px 会被最小缩放值卡住，导致整排按钮相对底图向右漂移。
     百分比只控制按钮外框位置和尺寸；--room-nav-scale 只控制内部文字、圆角、阴影和特效。
  */
  --room-nav-top:6.35%;
  --room-nav-start-left:25.83%;
  --room-nav-btn-width:4.72%;
  --room-nav-btn-height:5.10%;
  --room-nav-gap:0.486%;

  --room-nav-hall-left:var(--room-nav-start-left);
  --room-nav-living-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 1);
  --room-nav-manager-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 2);
  --room-nav-honor-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 3);
  --room-nav-studio-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 4);
  --room-nav-game-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 5);
  --room-nav-dorm-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 6);
  --room-nav-flower-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 7);
  --room-nav-pets-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 8);

  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);

}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at top left,#f5ecdb 0%,transparent 44%),
    linear-gradient(180deg,#efe2cc 0%,#e9d8bd 100%);
  color:#6f4726;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{pointer-events:auto;}

/* 修复：#overlay * 的 pointer-events:auto 会把整层 roomNavLayer 变成透明遮罩，挡住主面板按钮 */
#overlay .roomNavLayer{
  pointer-events:none!important;
}

#overlay .roomNavLayer .navBtn{
  pointer-events:auto!important;
}

#overlay .roomIdentity{
  pointer-events:none!important;
}

#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{
  pointer-events:auto!important;
}


/* =========================================================
   房间按钮组件
========================================================= */
.roomNavLayer{
  position:absolute;
  inset:0;
  z-index:55;
  pointer-events:none;
  --s:var(--room-nav-scale,1);
  --nav-btn-radius:calc(15px * var(--s));
  --nav-btn-font:calc(15px * var(--s));
  --nav-btn-border:calc(1px * var(--s));
  --nav-btn-shadow-y:calc(3px * var(--s));
  --nav-btn-shadow-blur:calc(8px * var(--s));
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:absolute;
  top:var(--room-nav-top);
  width:var(--room-nav-btn-width);
  height:var(--room-nav-btn-height);
  min-width:0;
  min-height:0;
  padding:0;
  border-radius:var(--nav-btn-radius);
  color:var(--room-nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.56), transparent 40%),
    radial-gradient(circle at 78% 74%, var(--room-nav-wash), transparent 48%),
    linear-gradient(180deg, var(--room-nav-paper) 0%, var(--room-nav-paper-2) 100%);
  border:var(--nav-btn-border) solid var(--room-nav-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.64),
    0 calc(2px * var(--s)) calc(7px * var(--s)) rgba(96,70,48,.10);
  text-shadow:0 calc(1px * var(--s)) 0 rgba(255,255,255,.38);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  pointer-events:auto;
}

.navBtn[data-room="hall"]{left:var(--room-nav-hall-left);}
.navBtn[data-room="living"]{left:var(--room-nav-living-left);}
.navBtn[data-room="manager"]{left:var(--room-nav-manager-left);}
.navBtn[data-room="honor"]{left:var(--room-nav-honor-left);}
.navBtn[data-room="studio"]{left:var(--room-nav-studio-left);}
.navBtn[data-room="game"]{left:var(--room-nav-game-left);}
.navBtn[data-room="dorm"]{left:var(--room-nav-dorm-left);}
.navBtn[data-room="flower"]{left:var(--room-nav-flower-left);}
.navBtn[data-room="pets"]{left:var(--room-nav-pets-left);}

.navBtn:not(.is-current):hover,
.navBtn:not(.is-current):focus-visible{
  color:#5f3d22;
  background:
    radial-gradient(circle at 20% 24%, rgba(255,255,255,.66), transparent 42%),
    radial-gradient(circle at 80% 78%, rgba(207,170,143,.24), transparent 50%),
    linear-gradient(180deg, rgba(255,252,246,.88) 0%, rgba(239,226,210,.82) 100%);
  border-color:rgba(151,112,84,.36);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.70),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.12);
  filter:saturate(1.02);
}

.navBtn.is-current{
  cursor:default;
  color:var(--room-nav-current-text);
  background:
    radial-gradient(circle at 22% 22%, rgba(255,255,255,.62), transparent 42%),
    radial-gradient(circle at 80% 80%, rgba(190,151,126,.26), transparent 50%),
    linear-gradient(180deg, rgba(246,235,222,.94) 0%, var(--room-nav-current-bg) 100%);
  border-color:var(--room-nav-current-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.68),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.13),
    0 0 0 calc(2px * var(--s)) rgba(255,253,248,.46);
  filter:none;
}

.navLabel{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.82),
    0 0 calc(8px * var(--s)) rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{ transform:translateY(calc(4px * var(--s))) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(calc(-5px * var(--s))) rotate(6deg) scale(1); opacity:.76; }
}
@keyframes navFloatB{
  0%,100%{ transform:translateY(calc(5px * var(--s))) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(calc(-6px * var(--s))) rotate(-7deg) scale(1); opacity:.68; }
}
@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(calc(6px * var(--s))) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(calc(-6px * var(--s))) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:not(.is-current):hover .navEffectA,
.navBtn:not(.is-current):focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectB,
.navBtn:not(.is-current):focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectC,
.navBtn:not(.is-current):focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}
.navBtn.is-current .navEffect{display:none;}

.navBtn[data-room="hall"] .navEffect{color:rgba(255,205,96,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.95),0 0 calc(10px * var(--s)) rgba(255,215,105,.62);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="honor"] .navEffect{color:rgba(205,143,45,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.92),0 0 calc(8px * var(--s)) rgba(255,220,130,.52);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}

/* =========================================================
   身份组件
========================================================= */
.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}

.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1.22;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
  transform:translateY(var(--identity-name-y));
}

.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}

.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}

.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

.identityNoticePanel.show{display:block;}

.identityNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--s));
  font-weight:900;
  margin-bottom:calc(10px * var(--s));
}

.identityNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--s));
  line-height:1.6;
  padding:calc(6px * var(--s)) calc(2px * var(--s)) calc(2px * var(--s));
}

/* =========================================================
   宿舍主体内容：参考花房最满意版本，适配钱包记录 / 系统通知
   不改房间按钮、身份组件、权限和数据库逻辑
========================================================= */
:root{
  --dorm-app-left:8.8%;
  --dorm-app-top:22.2%;
  --dorm-app-width:60.8%;
  --dorm-app-height:58.5%;
}

#dormShell{
  position:absolute;
  left:50%;
  top:52.5%;
  transform:translate(-50%,-50%);
  width:min(1180px,78%);
  height:min(650px,68%);
  display:grid;
  grid-template-columns:230px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  gap:22px;
  z-index:20;
}

.glassPanel{
  border-radius:28px;
  background:rgba(255,250,240,.76);
  border:1px solid rgba(198,145,79,.22);
  box-shadow:
    0 18px 40px rgba(116,86,54,.13),
    inset 0 1px 0 rgba(255,255,255,.75);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

#sidePanel{
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

.sideBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  width:100%;
  min-height:50px;
  padding:0 15px;
  border-radius:17px;
  background:transparent;
  display:flex;
  align-items:center;
  gap:11px;
  color:#7a4f27;
  font-size:15px;
  font-weight:900;
  text-align:left;
}

.sideBtn:hover{background:rgba(255,246,231,.58);}

.sideBtn.active{
  background:rgba(255,246,231,.96);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    0 4px 12px rgba(120,80,35,.08);
}

.sideIcon{
  width:24px;
  text-align:center;
  font-size:18px;
}

#mascotBox{
  margin-top:12px;
  flex:1 1 auto;
  min-height:0;
  border-radius:20px;
  background:
    linear-gradient(180deg,rgba(255,249,232,.76),rgba(255,238,206,.58));
  border:1px dashed rgba(170,117,62,.28);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px 12px 14px;
  overflow:hidden;
  position:relative;
}

#mascotBox img{
  width:88%;
  max-width:172px;
  max-height:150px;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 8px 12px rgba(120,80,35,.13));
  animation:mascotFloat 3.2s ease-in-out infinite;
}

#mascotBubble{
  position:absolute;
  right:10px;
  top:14px;
  max-width:150px;
  min-height:30px;
  padding:6px 13px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  text-align:center;
  white-space:nowrap;
  border:1px solid rgba(206,151,82,.22);
  box-shadow:
    0 6px 14px rgba(120,80,35,.10),
    inset 0 1px 0 rgba(255,255,255,.85);
}

#mascotBubble::after{
  content:"";
  position:absolute;
  right:18px;
  bottom:-6px;
  width:10px;
  height:10px;
  background:inherit;
  border-right:1px solid rgba(206,151,82,.22);
  border-bottom:1px solid rgba(206,151,82,.22);
  transform:rotate(45deg);
}

@keyframes mascotFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}

.bubble-work{background:#fff6e5;color:#c77b2a;animation:workShake 1.6s ease-in-out infinite;}
.bubble-ok{background:#e8fff1;color:#2e9b5f;}
.bubble-calm{background:#eef6ff;color:#4c7ecf;animation:calmFloat 2.6s ease-in-out infinite;}
.bubble-energy{background:#ffe9e9;color:#d94a4a;animation:energyJump .62s ease-in-out infinite alternate;}

.bubble-thinking{background:#eef0ff;color:#5b63d6;animation:thinkingBlink 1.2s ease-in-out infinite;}

@keyframes workShake{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-3px);}
}

@keyframes calmFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}

@keyframes energyJump{
  from{transform:translateY(0) scale(1);}
  to{transform:translateY(-7px) scale(1.03);}
}

@keyframes busyWiggle{
  0%,100%{transform:rotate(0deg);}
  33%{transform:rotate(2deg);}
  66%{transform:rotate(-2deg);}
}

@keyframes thinkingBlink{

/* =========================================================

function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";

  root.style.setProperty("--bg-ui-scale","1");
  root.style.setProperty("--ui-scale","1");
  root.style.setProperty("--room-nav-scale","1");
  root.style.setProperty("--identity-scale","1");
}

function syncOverlayToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.45, Math.min(3.2, displayWidth / 1440));
  const navScale = Math.max(0.38, Math.min(3.2, displayWidth / 1440));

  root.style.setProperty("--bg-ui-scale", String(scale));
  root.style.setProperty("--ui-scale", String(scale));
  root.style.setProperty("--room-nav-scale", String(navScale));
  root.style.setProperty("--identity-scale", String(scale));
}

/* =========================================================

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function roleLabel(role){
  const r = String(role || "").toLowerCase();
  if(r === "owner") return "维修工";
  if(r === "admin") return "宿管";
  if(r === "member") return "房客";
  if(r === "applying") return "申请中";
  return "参观者";
}

function cleanGoldLedgerNote(value){
  const raw = String(value || "").trim();
  if(!raw) return "";

  const cleaned = raw
    .replace(/（\s*title_id\s*:\s*\d+\s*）/g, "")
    .replace(/\(\s*title_id\s*:\s*\d+\s*\)/g, "")
    .replace(/（\s*achievement_id\s*:\s*\d+\s*）/g, "")
    .replace(/\(\s*achievement_id\s*:\s*\d+\s*\)/g, "")
    .replace(/历史金币余额校准[：:][^。]*。?/g, "金币余额调整")
    .trim();

  return cleaned || "金币变动";
}

function ledgerLabel(item){
  const sub = String(item.subcategory || "");
  if(sub === "submit") return "演唱交音奖励";
  if(sub === "publish") return "演唱发布奖励";
  if(sub === "mix_submit") return "后期交付奖励";
  if(sub === "mix_publish") return "后期发布奖励";
  if(sub === "pet_adopt") return "宠物领养";
  if(sub === "flower_buy") return "花房买入";
  if(sub === "flower_sell") return "花房卖出";

  const note = cleanGoldLedgerNote(item.note);
  return note || item.subcategory || item.category || "金币变动";
}

function formatDate(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function cleanNoticeSongText(value){
  return String(value ?? "")
    .replace(/《\s*(?:编号|项目编号|歌曲编号)?\s*[A-Za-z]*\d+[.．。]\s*([^》]+?)\s*》/g,"《$1》")

    .replace(/(^|[：:\s])(?:编号|项目编号|歌曲编号)[.．。]\s*(?=《)/g,"$1");
}

  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return false;
  const now = new Date();
  return d.getFullYear() === now.getFullYear()

    if(taskTypes.has(type)) return false;
    if(/待交音|待后期|待认领/.test(text)) return false;

    const releaseDateRaw = item.release_date || item.publish_at || item.scheduled_at || item.release_at || null;
    const projectStatus = String(item.project_status || item.work_status || item.publish_status || "").toLowerCase();
    if(releaseDateRaw){
      const releaseDate = new Date(releaseDateRaw);
      if(!Number.isNaN(releaseDate.getTime())){
        const isPastRelease = releaseDate.getTime() < Date.now();
        const isReleased = ["released","published","done","complete","completed"].includes(projectStatus);
        if(isPastRelease || isReleased) return false;
      }
    }
  }

  return true;
}

function renderDormNoticeCenter(items){
  const wrap = document.getElementById("dormNoticeCenter");
  if(!wrap) return;

  const list = (Array.isArray(items) ? items : [])
    .filter(noticeStillUseful)
    .map(normalizeNoticeItem)
    .filter(item => item.room && allowedNoticeRooms.has(item.room) && (item.title || item.desc));

  const byRoom = new Map();
  roomNoticeGroups.forEach(room => byRoom.set(room.key, []));

  list.forEach(item => {
    if(byRoom.has(item.room)){
      byRoom.get(item.room).push(item);
    }
  });

  wrap.innerHTML = roomNoticeGroups.map(room => {
    const roomItems = byRoom.get(room.key) || [];
    const shouldOpen = false;

    const body = roomItems.length
      ? roomItems.map(item => {
        const desc = item.desc || "暂无详细内容。";
        const time = item.created_at ? formatDate(item.created_at) : "";

        return `
          <div class="noticeRoomItem">
            <div class="noticeRoomTitleLine">
              <div class="noticeRoomItemTitle">${escapeHtml(item.title || "通知")}</div>
              ${time ? `<div class="noticeRoomTime">${escapeHtml(time)}</div>` : ""}
            </div>
            <div class="noticeRoomItemDesc">${escapeHtml(desc)}</div>
          </div>
        `;
      }).join("")
      : '<div class="noticeRoomEmpty">暂无通知。</div>';

    return `
      <section class="noticeRoomGroup${shouldOpen ? " open" : ""}" data-room="${escapeHtml(room.key)}">
        <div class="noticeRoomHeader">
          <button class="noticeRoomToggle" type="button">
            <span>${escapeHtml(room.icon)} ${escapeHtml(room.label)}</span>
          </button>
          <span class="noticeRoomCount">${roomItems.length}</span>
          <button class="noticeRoomFoldBtn" type="button">${shouldOpen ? "收起" : "展开"}</button>
        </div>
        <div class="noticeRoomBody">${body}</div>
      </section>
    `;
  }).join("");

  wrap.querySelectorAll(".noticeRoomToggle, .noticeRoomFoldBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const group = btn.closest(".noticeRoomGroup");
      if(!group) return;

      group.classList.toggle("open");
      const foldBtn = group.querySelector(".noticeRoomFoldBtn");
      if(foldBtn){
        foldBtn.textContent = group.classList.contains("open") ? "收起" : "展开";
      }
    });
  });
}

function taskTypeLabel(type){
  if(type === "vocal_submit" || type === "vocal_submitted") return "待交音";
  if(type === "mix_submit" || type === "mix_submitted") return "待后期";
  if(type === "claim" || type === "singer_claim" || type === "mix_claim" || type === "singer_claimed" || type === "mix_claimed") return "待认领";
  return "我的任务";
}

function taskTabKey(type){
  if(type === "vocal_submitted") return "vocal_submit";
  if(type === "mix_submitted") return "mix_submit";
  if(type === "singer_claim" || type === "mix_claim" || type === "singer_claimed" || type === "mix_claimed") return "claim";
  return type;
}

function taskToneText(task){
  const tone = String(task.project_tone || "").trim();
  if(!tone) return "";

  const key = taskTabKey(task.task_type);
  if(key === "vocal_submit" || key === "mix_submit"){
    return escapeHtml(tone);
  }

  return `调：${escapeHtml(tone)}`;
}

function taskDateLine(task){
  return task.release_date ? `预计发布：${escapeHtml(task.release_date)}` : "";
}

function taskOriginalLine(task){
  return task.my_original_names ? `你负责：${escapeHtml(task.my_original_names)}` : "";
}

function taskSingerNeedLine(task){
  const current = Number(task.singer_count || 0);
  const target = Number(task.target_singer_count || 0);
  const missing = Number(task.missing_singer_count || Math.max(target - current, 0));
  if(target > 0) return `演唱人数：${current}/${target}${missing > 0 ? `，缺 ${missing} 人` : ""}`;
  return `演唱人数：${current}`;
}

function taskSingerCountLine(task){
  const singerCount = Number(task.singer_count || 0);
  return `演唱人数：${singerCount}`;
}

function taskMainButtonHtml(task){
  const projectId = escapeHtml(task.project_id);

  if(task.task_type === "vocal_submit"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="submit_vocal" data-project-id="${projectId}">交音</button>`;
  }

  if(task.task_type === "mix_submit"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="submit_mix" data-project-id="${projectId}">交付</button>`;
  }

  if(task.task_type === "singer_claim"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="claim_singer" data-project-id="${projectId}">认领</button>`;
  }

  if(task.task_type === "mix_claim"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="claim_mix" data-project-id="${projectId}">认领后期</button>`;
  }

  if(task.task_type === "vocal_submitted"){
    return `<button class="dormSubBtn dormTaskActionBtn" type="button" data-action="undo_vocal" data-project-id="${projectId}">撤回交音</button>`;
  }

  if(task.task_type === "mix_submitted"){
    return `<button class="dormSubBtn dormTaskActionBtn" type="button" data-action="undo_mix" data-project-id="${projectId}">撤回</button>`;
  }

  if(task.task_type === "singer_claimed"){
    return `<span class="taskDoneText">已认领，撤回请去工作间</span>`;
  }

  if(task.task_type === "mix_claimed"){
    return `<span class="taskDoneText">已认领后期，撤回请去工作间</span>`;
  }

  return "";
}

function taskMetaItems(task){
  const items = [];

  const tone = taskToneText(task);
  if(tone) items.push(tone);

  if(task.task_type === "vocal_submit" || task.task_type === "vocal_submitted"){
    const original = taskOriginalLine(task);
    if(original) items.push(original);
  }

  if(task.task_type === "singer_claim" || task.task_type === "singer_claimed"){
    items.push(taskSingerNeedLine(task));
  }

  if(task.task_type === "mix_claim" || task.task_type === "mix_claimed"){
    items.push(taskSingerCountLine(task));
  }

  const dateLine = taskDateLine(task);
  if(dateLine) items.push(dateLine);

  return items;
}

function formatTaskTitle(task){
  const rawCode = String(task.project_code || "").trim();
  const name = escapeHtml(task.project_name || "未命名项目");

  if(!rawCode) return name;

  const code = escapeHtml(rawCode.replace(/[.．。\s]+$/g,""));
  return `${code}.${name}`;
}

function taskCardHtml(task){
  const title = formatTaskTitle(task);
  const mainButton = taskMainButtonHtml(task);
  const metaItems = taskMetaItems(task);

  return `
    <div class="taskCard taskCardCompact" data-task-type="${escapeHtml(task.task_type)}" data-project-id="${escapeHtml(task.project_id)}">
      <div class="taskCompactLine">
        <h3 class="taskCardTitle">${title}</h3>
        <div class="taskMetaInline">
          ${metaItems.map(item => `<span>${item}</span>`).join("")}
        </div>
        <div class="taskActionRow">
          ${mainButton}
        </div>
      </div>
    </div>
  `;
}

function compareProjectCode(a,b){
  return String(a.project_code || "").localeCompare(String(b.project_code || ""), "zh-Hans-CN", { numeric:true });
}

function sortDormTaskRows(rows,tabKey){
  const list = rows.slice();

  if(tabKey === "vocal_submit"){
    return list.sort((a,b) => {
      const diff = Number(a.unsubmitted_count || 999999) - Number(b.unsubmitted_count || 999999);
      return diff || compareProjectCode(a,b);
    });
  }

  if(tabKey === "mix_submit"){
    return list.sort((a,b) => {
      const ad = a.release_date || "";
      const bd = b.release_date || "";
      if(ad && bd && ad !== bd) return ad.localeCompare(bd);
      if(ad && !bd) return -1;
      if(!ad && bd) return 1;
      return compareProjectCode(a,b);
    });
  }

  if(tabKey === "claim"){
    return list.sort((a,b) => {
      const ag = a.task_type === "singer_claim" || a.task_type === "singer_claimed" ? 1 : 2;
      const bg = b.task_type === "singer_claim" || b.task_type === "singer_claimed" ? 1 : 2;
      if(ag !== bg) return ag - bg;

      const diff = Number(b.singer_count || 0) - Number(a.singer_count || 0);
      return diff || compareProjectCode(a,b);
    });
  }

  return list;
}

function mergedDormTaskRows(){
  const recentRows = Array.from(recentDormTaskActions.values());
  const recentIds = new Set(recentRows.map(item => String(item.project_id)));
  const normalRows = (Array.isArray(dormTaskRows) ? dormTaskRows : []).filter(item => !recentIds.has(String(item.project_id)));
  return recentRows.concat(normalRows);
}

function updateDormTaskTabs(rows){
  const counts = { vocal_submit:0, mix_submit:0, claim:0 };
  rows.forEach(item => {
    const key = taskTabKey(item.task_type);
    if(Object.prototype.hasOwnProperty.call(counts,key)) counts[key] += 1;
  });

  document.querySelectorAll(".taskTab").forEach(btn => {
    const key = btn.dataset.taskTab;
    btn.classList.toggle("active", key === activeDormTaskTab);
    const badge = btn.querySelector("span");
    if(badge) badge.textContent = String(counts[key] || 0);
  });
}

function renderDormTasks(rows){
  const list = document.getElementById("taskList");
  if(!list) return;

  const allRows = mergedDormTaskRows();
  updateDormTaskTabs(allRows);

  if(!allRows.length){
    list.innerHTML = `
      <div class="taskCard">
        <h3 class="taskCardTitle">今天没有需要你处理的任务</h3>
      </div>
    `;
    return;
  }

  const currentRows = sortDormTaskRows(
    allRows.filter(item => taskTabKey(item.task_type) === activeDormTaskTab),
    activeDormTaskTab
  );

  if(!currentRows.length){
    list.innerHTML = `<div class="emptyText">${escapeHtml(taskTypeLabel(activeDormTaskTab))}暂无任务。</div>`;
    return;
  }

  list.innerHTML = currentRows.map(taskCardHtml).join("");
}

async function loadDormTasks(){
  const list = document.getElementById("taskList");
  if(!list) return;

  if(!authState.memberId || !authState.memberCode){
    updateDormTaskTabs([]);
    list.innerHTML = '<div class="errorText">请先登录后查看我的任务。</div>';
    return;
  }

  list.innerHTML = '<div class="emptyText">正在读取我的任务……</div>';

  try{
    const { data,error } = await supabaseClient.rpc("get_dorm_work_tasks",{
      p_member_id:authState.memberId,
      p_member_code:authState.memberCode
    });

    if(error) throw error;

    dormTaskRows = Array.isArray(data) ? data : [];
    renderDormTasks(dormTaskRows);
  }catch(error){
    console.error(error);
    list.innerHTML = '<div class="errorText">我的任务读取失败，请检查 get_dorm_work_tasks RPC。</div>';
  }
}

function findDormTask(projectId){
  return dormTaskRows.find(item => String(item.project_id) === String(projectId))
    || recentDormTaskActions.get(String(projectId))
    || null;
}

async function runDormTaskAction(action,projectId){
  if(!action || !projectId) return;

  const task = findDormTask(projectId);
  const fnMap = {
    submit_vocal:"submit_dorm_vocal",
    undo_vocal:"undo_dorm_vocal_submit",
    submit_mix:"submit_dorm_mix",
    undo_mix:"undo_dorm_mix_submit",
    claim_singer:"claim_dorm_singer",
    claim_mix:"claim_dorm_mix"
  };

  const fn = fnMap[action];
  if(!fn) return;

  try{
    const { data,error } = await supabaseClient.rpc(fn,{
      p_member_id:authState.memberId,
      p_member_code:authState.memberCode,
      p_project_id:projectId
    });

    if(error) throw error;

    const result = Array.isArray(data) ? data[0] : data;
    if(!result || result.ok !== true){
      alert(result?.message || "操作失败，任务状态可能已变化。");
      await loadDormTasks();
      return;
    }

    if(action === "submit_vocal" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"vocal_submitted",
        my_singer_submitted:true
      });
    }

    if(action === "submit_mix" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"mix_submitted",
        producer_completed:true
      });
    }

    if(action === "claim_singer" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"singer_claimed",
        singer_count:Number(task.singer_count || 0) + 1,
        missing_singer_count:Math.max(Number(task.missing_singer_count || 0) - 1, 0)
      });
    }

    if(action === "claim_mix" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"mix_claimed",
        producer_member_id:authState.memberId,
        producer_nickname:authState.nickname
      });
    }

    if(action === "undo_vocal" || action === "undo_mix"){
      recentDormTaskActions.delete(String(projectId));
    }

    await loadDormTasks();
  }catch(error){
    console.error(error);
    alert(`操作失败：${error.message || "请检查任务 RPC"}`);
    await loadDormTasks();
  }
}

function bindDormTaskActions(){
  const list = document.getElementById("taskList");
  if(list){
    list.addEventListener("click", event => {
      const btn = event.target.closest(".dormTaskActionBtn");
      if(!btn) return;

      event.preventDefault();
      event.stopPropagation();

      const action = btn.dataset.action;
      const projectId = btn.dataset.projectId;
      runDormTaskAction(action,projectId);
    });
  }

  const tabs = document.getElementById("taskTabs");
  if(tabs){
    tabs.addEventListener("click", event => {
      const btn = event.target.closest(".taskTab");
      if(!btn) return;

      activeDormTaskTab = btn.dataset.taskTab || "vocal_submit";
      renderDormTasks(dormTaskRows);
    });
  }
}

async function loadGoldLedger(memberId){
  const { data,error } = await supabaseClient
    .from("gold_ledger")
    .select("direction,amount,category,subcategory,note,created_at")
    .eq("member_id",memberId)
    .order("created_at",{ ascending:false })
    .limit(30);

  if(error){
    console.error(error);
    setLedgerMessage("金币记录读取失败，请检查 gold_ledger 权限。",true);
    return;
  }

  if(!data || !data.length){
    setLedgerMessage("当前账号暂无金币流水。");
    setText("todayGold","0");
    return;
  }

  const todayIncome = data
    .filter(item => item.direction === "in" && isToday(item.created_at))
    .reduce((sum,item) => sum + Number(item.amount || 0),0);

  const todayEl = document.getElementById("todayGold");
  if(todayEl){
    todayEl.textContent = todayIncome > 0 ? `+${todayIncome}` : "0";
    todayEl.className = todayIncome > 0 ? "statValue todayValue income" : "statValue todayValue none";
  }

  const list = document.getElementById("ledgerList");
  list.innerHTML = data.map(item => {
    const isIn = item.direction === "in";
    const sign = isIn ? "+" : "-";
    const title = ledgerLabel(item);
    const cleanedNote = cleanGoldLedgerNote(item.note);
    const note = cleanedNote && cleanedNote !== title ? cleanedNote : "";

    return `
      <div class="ledgerItem">
        <div class="ledgerArrow ${isIn ? "in" : "out"}">${isIn ? "↑" : "↓"}</div>
        <div>
          <strong>${escapeHtml(title)}</strong>
          <div class="ledgerMeta">
            ${escapeHtml(formatDate(item.created_at))}
            ${note ? `｜${escapeHtml(note)}` : ""}
          </div>
        </div>
        <div class="ledgerAmount ${isIn ? "in" : "out"}">
          ${sign}${Number(item.amount || 0)}
        </div>
      </div>
    `;
  }).join("");
}

function itemValue(item,keys){
  for(const key of keys){
    const value = item?.[key];
    if(value !== null && value !== undefined && String(value).trim() !== "") return value;
  }
  return "";
}

function itemDisplayName(item){
  return itemValue(item,["item_name","name","title","display_name","item_key","item_code","code","resource_name","resource_key"]) || "未命名道具";
}

function itemQuantity(item){
  const value = itemValue(item,["quantity","qty","count","amount","item_count","balance","total"]);
  const number = Number(value || 0);
  return Number.isFinite(number) ? number : 0;
}

function itemSortOrder(item){
  const number = Number(item?.sort_order ?? 9999);
  return Number.isFinite(number) ? number : 9999;
}

function inventoryFallbackEmoji(item){
  const key = String(`${item?.item_key || ""} ${item?.item_name || ""} ${item?.name || ""}`).toLowerCase();
  if(key.includes("water") || key.includes("水")) return "💧";
  if(key.includes("fertilizer") || key.includes("肥")) return "🌱";
  if(key.includes("seed") || key.includes("种子")) return "🌰";
  if(key.includes("flower") || key.includes("花")) return "🌸";
  if(key.includes("pet") || key.includes("宠")) return "🐾";
  if(key.includes("card") || key.includes("ticket") || key.includes("券") || key.includes("卡")) return "🎫";
  if(key.includes("gift") || key.includes("box") || key.includes("礼包")) return "🎁";
  return "🎒";
}

function itemIconHtml(item){
  const rawIcon = String(itemValue(item,["item_icon","icon","emoji"])).trim();
  const fallback = inventoryFallbackEmoji(item);

  if(!rawIcon){
    return `<span class="inventoryEmoji">${escapeHtml(fallback)}</span>`;
  }

  if(/^https?:\/\//i.test(rawIcon) || /\.(png|jpe?g|gif|webp|svg)$/i.test(rawIcon)){
    const safeSrc = escapeHtml(rawIcon);
    const safeFallback = escapeHtml(fallback);
    return `<img src="${safeSrc}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'inventoryEmoji',textContent:'${safeFallback}'}))">`;
  }

  if(rawIcon.length <= 4){
    return `<span class="inventoryEmoji">${escapeHtml(rawIcon)}</span>`;
  }

  return `<span class="inventoryEmoji">${escapeHtml(fallback)}</span>`;
}

function mergeInventoryRows(memberItems,itemTypes){
  const typeMap = new Map((Array.isArray(itemTypes) ? itemTypes : []).map(type => [String(type.item_key), type]));

  return (Array.isArray(memberItems) ? memberItems : []).map(row => ({
    ...row,
    ...(typeMap.get(String(row.item_key)) || {})
  }));
}

function renderInventory(items){
  const wrap = document.getElementById("inventoryList");
  if(!wrap) return;

  const rows = (Array.isArray(items) ? items : [])
    .map(item => ({ item, qty:itemQuantity(item) }))
    .filter(row => row.qty > 0)
    .sort((a,b) => itemSortOrder(a.item) - itemSortOrder(b.item));

  const bookCard = collectionBookCardHtml();

  if(!rows.length){
    wrap.innerHTML = `${bookCard}<div class="emptyText inventoryEmptyNote">当前背包暂无道具。</div>`;

  wrap.innerHTML = bookCard + rows.map(({ item, qty }) => `

      <div class="inventoryIcon">${itemIconHtml(item)}</div>
      <div>
        <div class="inventoryName">${escapeHtml(itemDisplayName(item))}<span class="inventoryQty">×${qty}</span></div>

async function loadInventory(){
  const wrap = document.getElementById("inventoryList");
  if(!wrap) return;

  const memberId = currentMemberProfile?.id || authState.memberId;
  if(!memberId){
    wrap.innerHTML = '<div class="errorText">请先登录后查看我的背包。</div>';

      .from("member_items")
      .select("item_key,quantity,updated_at")
      .eq("member_id",memberId)
      .order("updated_at",{ ascending:false });

    if(itemError) throw itemError;

    if(itemKeys.length){

        itemTypes = (Array.isArray(typeRows) ? typeRows : []).filter(item => item.is_active !== false);

    }

    renderInventory(mergeInventoryRows(memberItems,itemTypes));
  }catch(error){
    console.error(error);
    wrap.innerHTML = `<div class="errorText">背包读取失败：${escapeHtml(error.message || "请检查 member_items / item_types 读取权限。")}</div>`;

function valueOrDash(value){
  const text = String(value ?? "").trim();

function formatBirthday(month,day){
  if(!month || !day) return "未填写";
  return `${Number(month)}月${Number(day)}日`;
}

function normalizeSkills(value){
  if(Array.isArray(value)) return value.map(v => String(v).trim()).filter(Boolean);
  return String(value || "")
    .split(/[，,、/|\s]+/)
    .map(v => v.trim())
    .filter(Boolean);
}

function uniqueSkills(list){
  const seen = new Set();
  const result = [];
  list.forEach(item => {
    const value = String(item || "").trim();
    if(!value) return;
    const key = value.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    result.push(value);
  });
  return result;
}

function skillPillsHtml(skills){
  const list = uniqueSkills(normalizeSkills(skills));
  if(!list.length) return '<span class="profileHint">暂未登记技能。</span>';
  return `<div class="skillPills">${list.map(skill => `<span class="skillPill">${escapeHtml(skill)}</span>`).join("")}</div>`;
}

function honorSummaryHtml(summary){

  if(summary.error){

  const recent = summary.recent ? `<span class="honorPill">最近获得：${escapeHtml(summary.recent)}</span>` : '<span class="honorPill">暂无最近记录</span>';
  return `

      <span class="honorPill">已领取成就：${Number(summary.achievements || 0)} 个</span>

  `;
}

function validateProfileName(value){
  const text = String(value || "").trim();
  return text.length >= 1 && text.length <= 20;
}

function validateProfileLocation(value){
  const text = String(value || "").trim();
  if(!text) return true;
  const allowedLocations = [
    "北京","天津","上海","重庆","河北","山西","辽宁","吉林","黑龙江","江苏","浙江","安徽","福建","江西","山东","河南","湖北","湖南","广东","海南","四川","贵州","云南","陕西","甘肃","青海","台湾","内蒙古","广西","西藏","宁夏","新疆","香港","澳门","美国","加拿大","美东","美西","美中"
  ];
  return allowedLocations.includes(text);
}

function standardSkillName(raw){
  const value = String(raw || "").trim().toLowerCase();
  if(!value) return { input:"", matched:"", status:"empty" };

  const aliases = [
    { name:"混音", values:["混音","后期","修音","贴唱","混","mix","mixing","mixer"] },
    { name:"视频剪辑", values:["视频剪辑","剪辑","视频","pv","做视频","视频后期","video"] },
    { name:"美工", values:["美工","海报","作图","排版","封面","设计","平面设计"] }
  ];

  const found = aliases.find(group => group.values.some(item => item.toLowerCase() === value));
  if(found) return { input:raw.trim(), matched:found.name, status:"matched" };
  return { input:raw.trim(), matched:"", status:"unmatched" };
}

function collectProfilePayload(){
  return {
    name:document.getElementById("profileNameInput")?.value.trim() || "",
    location:document.getElementById("profileLocationInput")?.value.trim() || null,
    birthday_month:document.getElementById("profileBirthdayMonth")?.value ? Number(document.getElementById("profileBirthdayMonth").value) : null,
    birthday_day:document.getElementById("profileBirthdayDay")?.value ? Number(document.getElementById("profileBirthdayDay").value) : null,
    mbti:document.getElementById("profileMbtiInput")?.value || null,
    social_xiaohongshu:document.getElementById("profileXhsInput")?.value.trim() || null,
    social_douyin:document.getElementById("profileDouyinInput")?.value.trim() || null,
    social_bilibili:document.getElementById("profileBilibiliInput")?.value.trim() || null,
    social_weibo:document.getElementById("profileWeiboInput")?.value.trim() || null,
    public_message:document.getElementById("profileMessageInput")?.value.trim() || null
  };
}

function fieldLabel(key){
  const labels = {
    name:"圈名",
    location:"所在地",
    birthday_month:"生日月份",
    birthday_day:"生日日期",
    mbti:"MBTI",
    social_xiaohongshu:"小红书",
    social_douyin:"抖音",
    social_bilibili:"B站",
    social_weibo:"微博",
    public_message:"公开留言",
    skills:"正式技能",
    skill_request:"新增技能申请"
  };
  return labels[key] || key;
}

function stringifyFieldValue(value){
  if(value === null || value === undefined || value === "") return "";
  if(Array.isArray(value)) return value.join("、");
  return String(value);
}

function diffProfileFields(oldMember,payload){
  const changes = [];
  Object.entries(payload).forEach(([key,newValue]) => {
    const oldValue = oldMember ? oldMember[key] : null;
    if(stringifyFieldValue(oldValue) !== stringifyFieldValue(newValue)){
      changes.push({
        field_key:key,
        field_label:fieldLabel(key),
        old_value:stringifyFieldValue(oldValue),
        new_value:stringifyFieldValue(newValue),
        change_type:"profile_update",
        status:"logged"
      });
    }
  });
  return changes;
}

async function logProfileChanges(changes){
  if(!changes.length) return;

  const rows = changes.map(item => ({
    member_id:authState.memberId,
    member_code:authState.memberCode,
    nickname:authState.nickname,
    field_key:item.field_key,
    field_label:item.field_label,
    old_value:item.old_value,
    new_value:item.new_value,
    change_type:item.change_type || "profile_update",
    status:item.status || "logged"
  }));

  try{
    const { error } = await supabaseClient.from("member_profile_change_logs").insert(rows);
    if(error) throw error;
  }catch(error){
    console.warn("成员资料修改记录表尚未可用，已跳过日志写入。", error);
  }
}

async function checkProfileNameDuplicate(name){
  const { data,error } = await supabaseClient
    .from("members")
    .select("id")
    .eq("name",name)
    .neq("id",authState.memberId)
    .limit(1);

  if(error) throw error;
  return Array.isArray(data) && data.length > 0;
}

async function saveProfileEdit(){
  if(!currentMemberProfile) return;
  const payload = collectProfilePayload();
  const skillInput = document.getElementById("profileSkillInput")?.value.trim() || "";
  const skillMatch = standardSkillName(skillInput);
  let changes = diffProfileFields(currentMemberProfile,payload);
  let skillMessage = "";

  if(!validateProfileName(payload.name)){
    setProfileStatus("圈名不能为空，且最多 20 个字符。","error");
    return;
  }

  if(!validateProfileLocation(payload.location)){
    setProfileStatus("所在地仅可填写省份、美东/美西/美中、美国或加拿大。","error");
    return;
  }

  if((payload.birthday_month && !payload.birthday_day) || (!payload.birthday_month && payload.birthday_day)){
    setProfileStatus("生日月份和日期需要一起填写。","error");
    return;
  }

  setProfileStatus("正在保存档案……");

  try{
    const duplicated = await checkProfileNameDuplicate(payload.name);
    if(duplicated){
      setProfileStatus("这个圈名已经有人使用了，请换一个。","error");
      return;
    }

    const currentSkills = uniqueSkills(normalizeSkills(currentMemberProfile.skills));
    if(skillMatch.status === "matched"){
      if(!currentSkills.some(item => item === skillMatch.matched)){
        const nextSkills = uniqueSkills([...currentSkills, skillMatch.matched]);
        payload.skills = nextSkills.join(",");
        changes.push({
          field_key:"skills",
          field_label:"正式技能",
          old_value:currentSkills.join("、"),
          new_value:nextSkills.join("、"),
          change_type:"skill_auto_matched",
          status:"logged"
        });
        skillMessage = `“${skillMatch.input}”已归并为正式技能「${skillMatch.matched}」。`;
      }else{
        skillMessage = `你已经有正式技能「${skillMatch.matched}」。`;
      }
    }else if(skillMatch.status === "unmatched"){
      changes.push({
        field_key:"skill_request",
        field_label:"新增技能申请",
        old_value:"",
        new_value:skillMatch.input,
        change_type:"skill_request",
        status:"logged"
      });
      skillMessage = `“${skillMatch.input}”已记录给宿管查看，后续如需调整会提醒你。`;
    }

    if(!changes.length){
      setProfileStatus(skillMessage || "没有检测到需要保存的修改。","success");
      return;
    }

    const { error } = await supabaseClient
      .from("members")
      .update(payload)
      .eq("id",authState.memberId)
      .eq("member_code",authState.memberCode);

    if(error) throw error;

    await logProfileChanges(changes);
    const fresh = await fetchCurrentMember();
    currentMemberProfile = fresh || { ...currentMemberProfile, ...payload };
    if(currentMemberProfile.nickname) authState.nickname = currentMemberProfile.nickname;
    if(currentMemberProfile.role) authState.role = currentMemberProfile.role;
    updateIdentity(currentMemberProfile);
    profileEditMode = false;
    honorSummaryState = honorSummaryState;
    renderProfileView(currentMemberProfile);
  }catch(error){
    console.error(error);
    setProfileStatus(`保存失败：${error.message || "请检查 members 表更新权限"}`,"error");
  }
}

async function loadHonorSummary(memberId){
  if(!memberId) return;

  try{
    const [{ data:titleRows,error:titleError,count:titleCount }, { data:achievementRows,error:achievementError,count:achievementCount }] = await Promise.all([
      supabaseClient
        .from("member_titles")
        .select("obtained_at,titles(name)", { count:"exact" })
        .eq("member_id",memberId)
        .order("obtained_at",{ ascending:false })
        .limit(1),
      supabaseClient
        .from("member_achievements")
        .select("obtained_at,achievements(name,description)", { count:"exact" })
        .eq("member_id",memberId)
        .order("obtained_at",{ ascending:false })
        .limit(1)
    ]);

    if(titleError || achievementError) throw (titleError || achievementError);

    const latestTitleTime = titleRows?.[0]?.obtained_at ? new Date(titleRows[0].obtained_at).getTime() : 0;
    const latestAchievementTime = achievementRows?.[0]?.obtained_at ? new Date(achievementRows[0].obtained_at).getTime() : 0;
    const latestTitleName = titleRows?.[0]?.titles?.name || "";
    const latestAchievementName = achievementRows?.[0]?.achievements?.name || achievementRows?.[0]?.achievements?.description || "";

    honorSummaryState = {
      titles:Number(titleCount || 0),
      achievements:Number(achievementCount || 0),
      recent:latestTitleTime >= latestAchievementTime ? latestTitleName : latestAchievementName
    };
  }catch(error){
    console.warn("荣誉摘要读取失败。", error);
    honorSummaryState = { error:"荣誉摘要暂时无法读取。" };
  }

  if(!profileEditMode) renderProfileView(currentMemberProfile);
}

    });
  }

      if(authState.loggedIn){
        handleLogout();
      }else{

      }
    });

    这样即使登录缓存里缺少 room10MemberCode，也不会被误判为未登录。
  */
  await loadGoldInfo();

  await Promise.all([
    loadSystemNotices(),
    loadDormTasks()
  ]);
}

document.addEventListener("DOMContentLoaded", () => {
  initDormPage();
});

window.addEventListener("resize", syncOverlayToImage);

window.addEventListener("storage", event => {
  if(
    event.key === STORAGE_KEYS.loggedIn ||
    event.key === STORAGE_KEYS.user ||
    event.key === STORAGE_KEYS.role ||
    event.key === STORAGE_KEYS.memberId
  ){
    updateIdentity({
      nickname:localStorage.getItem(STORAGE_KEYS.user) || "",
      role:localStorage.getItem(STORAGE_KEYS.role) || ""
    });
  }
});

if(img && img.complete && img.naturalWidth){
  syncOverlayToImage();
}else if(img){
  img.addEventListener("load", syncOverlayToImage, { once:true });
}

setTimeout(syncOverlayToImage, 120);
</script>
</body>
</html>
