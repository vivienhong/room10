<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜宿舍</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --bg-ui-scale:1;

  /* 当前页面坐标：宿舍页只改这里 */
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-width:calc(232px * var(--bg-ui-scale));
  --identity-height:calc(38px * var(--bg-ui-scale));

  --room-nav-left:27.2%;
  --room-nav-top:6.35%;
  --room-nav-width:45.5%;

  /* 页面可改颜色，不改结构尺寸 */
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);

  --nav-text:#6e4827;
  --nav-border:rgba(145,98,56,.34);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at top left,#f5ecdb 0%,transparent 44%),
    linear-gradient(180deg,#efe2cc 0%,#e9d8bd 100%);
  color:#6f4726;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{
  pointer-events:auto;
}


/* =========================================================
   身份组件：全站统一结构
========================================================= */
#topActions{
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:var(--identity-width);
  height:var(--identity-height);
  min-width:0;
  min-height:0;
  z-index:65;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:var(--identity-bg);
  border:1px solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--ui-scale)) calc(24px * var(--ui-scale)) var(--identity-shadow),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:normal;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:.06em;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
  white-space:nowrap;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

/* =========================================================
   房间切换按钮：宿舍页不显示“宿舍”按钮
========================================================= */
#topBar{
  position:absolute;
  left:var(--room-nav-left);
  top:var(--room-nav-top);
  width:var(--room-nav-width);
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:55;
  overflow:visible;
  pointer-events:none;

  --nav-btn-height:calc(40px * var(--ui-scale));
  --nav-btn-px:calc(16px * var(--ui-scale));
  --nav-btn-radius:calc(13px * var(--ui-scale));
  --nav-btn-font:calc(14px * var(--ui-scale));
  --nav-gap:calc(8px * var(--ui-scale));
}

#navOuter,
#navScroll{
  overflow:visible;
}

#navOuter{
  flex:0 0 auto;
  min-width:0;
  width:100%;
  pointer-events:auto;
}

#navScroll{
  width:100%;
  white-space:nowrap;
  padding:0;
  margin:0;
}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap);
  transform-origin:left center;
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height);
  padding:0 var(--nav-btn-px);
  border-radius:var(--nav-btn-radius);
  color:var(--nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid var(--nav-border);
  box-shadow:
    0 1px 1px rgba(255,255,255,.48) inset,
    0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease,
    filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:
    linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:
    0 1px 1px rgba(255,255,255,.55) inset,
    0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{
  position:relative;
  z-index:5;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  height:100%;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 1px 2px rgba(255,250,232,.82),
    0 0 8px rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{
  left:8%;
  top:-54%;
  font-size:calc(var(--nav-btn-font) * .92);
}

.navEffectB{
  right:8%;
  top:-62%;
  font-size:calc(var(--nav-btn-font) * .86);
}

.navEffectC{
  left:50%;
  top:-72%;
  transform:translateX(-50%);
  font-size:calc(var(--nav-btn-font) * 1.02);
}

@keyframes navFloatA{
  0%,100%{ transform:translateY(4px) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(-5px) rotate(6deg) scale(1); opacity:.76; }
}

@keyframes navFloatB{
  0%,100%{ transform:translateY(5px) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(-6px) rotate(-7deg) scale(1); opacity:.68; }
}

@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(6px) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(-6px) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:hover .navEffectA,
.navBtn:focus-visible .navEffectA{
  animation:navFloatA 2.2s ease-in-out infinite;
}

.navBtn:hover .navEffectB,
.navBtn:focus-visible .navEffectB{
  animation:navFloatB 2.5s ease-in-out infinite;
}

.navBtn:hover .navEffectC,
.navBtn:focus-visible .navEffectC{
  animation:navFloatC 2.35s ease-in-out infinite;
}

/* 各房间特效颜色 */
.navBtn[data-room="hall"] .navEffect{
  color:rgba(255,205,96,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.95),
    0 0 10px rgba(255,215,105,.62);
}

.navBtn[data-room="manager"] .navEffect{
  color:rgba(128,91,58,.82);
}

.navBtn[data-room="honor"] .navEffect{
  color:rgba(205,143,45,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.92),
    0 0 8px rgba(255,220,130,.52);
}

.navBtn[data-room="game"] .navEffect{
  color:rgba(117,91,150,.82);
}

.navBtn[data-room="studio"] .navEffect{
  color:rgba(96,112,145,.84);
}

.navBtn[data-room="living"] .navEffect{
  color:rgba(202,132,70,.82);
}

.navBtn[data-room="dorm"] .navEffect{
  color:rgba(148,112,171,.78);
}

.navBtn[data-room="pets"] .navEffect{
  color:rgba(131,111,78,.82);
}

.navBtn[data-room="flower"] .navEffect{
  color:rgba(198,119,145,.82);
}


/* =========================================================
   宿舍主体内容：参考花房最满意版本，适配钱包记录 / 系统通知
   不改房间按钮、身份组件、权限和数据库逻辑
========================================================= */
:root{
  --dorm-app-left:8.8%;
  --dorm-app-top:22.2%;
  --dorm-app-width:60.8%;
  --dorm-app-height:58.5%;
}

#dormShell{
  position:absolute;
  left:50%;
  top:52.5%;
  transform:translate(-50%,-50%);
  width:min(1180px,78%);
  height:min(650px,68%);
  display:grid;
  grid-template-columns:230px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  gap:22px;
  z-index:20;
}

.glassPanel{
  border-radius:28px;
  background:rgba(255,250,240,.76);
  border:1px solid rgba(198,145,79,.22);
  box-shadow:
    0 18px 40px rgba(116,86,54,.13),
    inset 0 1px 0 rgba(255,255,255,.75);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

#sidePanel{
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

.sideBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  width:100%;
  min-height:50px;
  padding:0 15px;
  border-radius:17px;
  background:transparent;
  display:flex;
  align-items:center;
  gap:11px;
  color:#7a4f27;
  font-size:15px;
  font-weight:900;
  text-align:left;
}

.sideBtn:hover{background:rgba(255,246,231,.58);}

.sideBtn.active{
  background:rgba(255,246,231,.96);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    0 4px 12px rgba(120,80,35,.08);
}

.sideIcon{
  width:24px;
  text-align:center;
  font-size:18px;
}

#mascotBox{
  margin-top:12px;
  flex:1 1 auto;
  min-height:0;
  border-radius:20px;
  background:
    linear-gradient(180deg,rgba(255,249,232,.76),rgba(255,238,206,.58));
  border:1px dashed rgba(170,117,62,.28);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px 12px 14px;
  overflow:hidden;
  position:relative;
}

#mascotBox img{
  width:88%;
  max-width:172px;
  max-height:150px;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 8px 12px rgba(120,80,35,.13));
  animation:mascotFloat 3.2s ease-in-out infinite;
}

#mascotBubble{
  position:absolute;
  right:10px;
  top:14px;
  max-width:150px;
  min-height:30px;
  padding:6px 13px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  text-align:center;
  white-space:nowrap;
  border:1px solid rgba(206,151,82,.22);
  box-shadow:
    0 6px 14px rgba(120,80,35,.10),
    inset 0 1px 0 rgba(255,255,255,.85);
}

#mascotBubble::after{
  content:"";
  position:absolute;
  right:18px;
  bottom:-6px;
  width:10px;
  height:10px;
  background:inherit;
  border-right:1px solid rgba(206,151,82,.22);
  border-bottom:1px solid rgba(206,151,82,.22);
  transform:rotate(45deg);
}

@keyframes mascotFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}

.bubble-work{background:#fff6e5;color:#c77b2a;animation:workShake 1.6s ease-in-out infinite;}
.bubble-ok{background:#e8fff1;color:#2e9b5f;}
.bubble-calm{background:#eef6ff;color:#4c7ecf;animation:calmFloat 2.6s ease-in-out infinite;}
.bubble-energy{background:#ffe9e9;color:#d94a4a;animation:energyJump .62s ease-in-out infinite alternate;}
.bubble-wait{background:#fffbe8;color:#b59b2a;}
.bubble-plan{background:#f3ecff;color:#7a57d1;}
.bubble-busy{background:#fff0f6;color:#c84a7a;animation:busyWiggle 1.5s ease-in-out infinite;}
.bubble-cheer{background:#fff4e6;color:#d9812c;animation:energyJump .78s ease-in-out infinite alternate;}
.bubble-thinking{background:#eef0ff;color:#5b63d6;animation:thinkingBlink 1.2s ease-in-out infinite;}
.bubble-soft{background:#f6fff3;color:#6fa35a;animation:calmFloat 3s ease-in-out infinite;}

@keyframes workShake{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-3px);}
}

@keyframes calmFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}

@keyframes energyJump{
  from{transform:translateY(0) scale(1);}
  to{transform:translateY(-7px) scale(1.03);}
}

@keyframes busyWiggle{
  0%,100%{transform:rotate(0deg);}
  33%{transform:rotate(2deg);}
  66%{transform:rotate(-2deg);}
}

@keyframes thinkingBlink{
  0%,100%{opacity:1;}
  50%{opacity:.56;}
}

#mainPanel{
  padding:26px;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

.view{
  display:none;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

.view.active{
  display:flex;
  flex-direction:column;
}

.walletHeader{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:18px;
  min-width:0;
  flex:0 0 auto;
}

.walletHeader > div:last-child{
  min-width:0;
}

.walletIcon{
  width:56px;
  height:56px;
  min-width:56px;
  border-radius:18px;
  background:
    radial-gradient(circle at 40% 22%,rgba(255,255,255,.72),transparent 30%),
    linear-gradient(180deg,#ffe7b8,#d89c58);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    0 8px 18px rgba(130,82,28,.14);
  position:relative;
  overflow:hidden;
}

.walletIcon::before,
.walletIcon::after{
  content:"";
  position:absolute;
  border-radius:999px;
  background:linear-gradient(180deg,#fff4c7,#d99a36);
  border:2px solid rgba(127,83,32,.26);
}

.walletIcon::before{
  width:31px;
  height:31px;
  left:12px;
  top:16px;
}

.walletIcon::after{
  width:24px;
  height:24px;
  right:10px;
  top:20px;
  opacity:.88;
}

.walletTitle{
  margin:0;
  font-size:30px;
  line-height:1.1;
  font-weight:900;
  color:#6f4726;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.walletSub{
  margin:5px 0 0;
  font-size:13px;
  line-height:1.3;
  color:#9b7656;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.balanceCard{
  position:relative;
  flex:0 0 auto;
  min-height:145px;
  border-radius:26px;
  padding:24px 28px;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% 8%,rgba(255,239,183,.95),transparent 48%),
    linear-gradient(135deg,rgba(255,247,218,.96),rgba(255,255,250,.82));
  border:1px solid rgba(214,166,86,.25);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 12px 26px rgba(151,105,35,.12);
}

.balanceCard::after{
  content:"🪙";
  position:absolute;
  right:38px;
  top:22px;
  font-size:70px;
  opacity:.34;
}

.goldLabel{
  color:#8a6843;
  font-size:15px;
  font-weight:900;
  margin-bottom:12px;
}

.goldNumber{
  color:#d88118;
  font-size:58px;
  line-height:1;
  font-weight:900;
}

.goldUnit{
  color:#9b6422;
  font-size:19px;
  font-weight:900;
  margin-left:8px;
}

.goldStats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-top:16px;
  flex:0 0 auto;
}

.statCard{
  min-width:0;
  padding:17px;
  border-radius:18px;
  background:rgba(255,252,247,.68);
  border:1px solid rgba(255,255,255,.62);
}

.statLabel{
  color:#92745a;
  font-size:12px;
  font-weight:900;
  margin-bottom:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.statValue{
  color:#6f4726;
  font-size:24px;
  font-weight:900;
}

.todayValue.income{color:#3f984d;}
.todayValue.none{color:#8a6a4e;}

.sectionTitle{
  margin:0 0 14px;
  color:#6f4726;
  font-size:26px;
  line-height:1.2;
  font-weight:900;
}

.sectionDesc{
  margin:0 0 18px;
  color:#9b7656;
  font-size:13px;
  line-height:1.4;
  font-weight:800;
}

.walletLedgerBlock{
  margin-top:18px;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-top:16px;
  border-top:1px dashed rgba(170,117,62,.24);
  overflow:hidden;
}

.walletLedgerHead{
  flex:0 0 auto;
}

.walletLedgerHead .sectionTitle{
  margin-bottom:6px;
  font-size:22px;
}

.walletLedgerHead .sectionDesc{
  margin-bottom:0;
}

.ledgerList{
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding-right:4px;
}

.ledgerItem{
  display:grid;
  grid-template-columns:28px minmax(0,1fr) auto;
  gap:12px;

.noticeCenter{

/* =========================================================
   我的任务 / 我的档案
========================================================= */
.taskList,
.profileScroll{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding-right:4px;
  display:flex;
  flex-direction:column;
  gap:10px;
}


.taskTabs{
  display:flex;
  align-items:center;
  gap:6px;
  margin:0 0 10px;
  padding:3px;
  border-radius:999px;
  background:rgba(255,252,247,.46);
  border:1px solid rgba(255,255,255,.50);
  flex:0 0 auto;
}

.taskTab{
  appearance:none;
  border:1px solid transparent;
  border-radius:999px;
  min-height:28px;
  padding:0 11px;
  cursor:pointer;
  color:#7b583a;
  font-size:12px;
  font-weight:900;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:background .18s ease,color .18s ease,border-color .18s ease,box-shadow .18s ease;
  white-space:nowrap;
}

.taskTab:hover{
  background:rgba(255,248,238,.68);
}

.taskTab.active{
  color:#704622;
  background:rgba(255,244,226,.90);
  border-color:rgba(201,140,79,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 3px 8px rgba(135,86,40,.08);
}

.taskTab span{
  min-width:17px;
  height:17px;
  border-radius:999px;
  padding:0 5px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  line-height:1;
  background:rgba(201,140,79,.14);
  color:#9b6422;
}

.taskTab.active span{
  background:rgba(201,140,79,.20);
  color:#8a5528;
}

.taskCardCompact{
  padding:10px 12px;
}

.taskCompactLine{
  display:grid;
  grid-template-columns:minmax(105px,.95fr) minmax(0,1.8fr) auto;
  align-items:center;
  gap:10px;
  min-width:0;
}

.taskCompactLine .taskCardTitle{
  margin:0;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.taskMetaInline{
  min-width:0;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  column-gap:9px;
  row-gap:2px;
  color:#92745a;
  font-size:12px;
  line-height:1.35;
  font-weight:800;
  white-space:normal;
  overflow:visible;
}

.taskMetaInline span{
  flex:0 1 auto;
  max-width:100%;
  min-width:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
}

.taskCompactLine .taskActionRow{
  margin:0;
  flex:0 0 auto;
  justify-content:flex-end;
}

.taskDoneText{
  color:#92745a;
  font-size:12px;
  line-height:1.35;
  font-weight:800;
  white-space:nowrap;
}

.taskCard,
.profileCard{
  border-radius:18px;
  background:rgba(255,252,247,.64);
  border:1px solid rgba(255,255,255,.58);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.68);
  padding:14px;
}

.taskCardTitle,
.profileCardTitle{
  margin:0 0 10px;
  color:#6f4726;
  font-size:15px;
  line-height:1.25;
  font-weight:900;
}

.taskHint,
.profileHint{
  margin:0;
  color:#92745a;
  font-size:12px;
  line-height:1.65;
}

.taskActionRow,
.profileActionRow{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.dormMiniBtn,
.dormSubBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  min-height:34px;
  padding:0 14px;
  border-radius:12px;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  transition:transform .16s ease, background .16s ease, box-shadow .16s ease;
}

.dormMiniBtn{
  background:#c98c4f;
  color:#fffaf3;
  box-shadow:0 4px 10px rgba(139,89,36,.12);
}

.dormMiniBtn:hover{background:#b9793f;transform:translateY(-1px);}

.dormSubBtn{
  background:rgba(239,219,190,.88);
  color:#6f4726;
}

.dormSubBtn:hover{background:rgba(229,204,169,.96);transform:translateY(-1px);}

.profileTop{
  display:grid;
  grid-template-columns:auto minmax(150px,1.05fr) minmax(180px,1fr) auto;
  gap:14px;
  align-items:center;
}

.profileTopInfo{
  min-width:0;
}

.profileTopHonor{
  min-width:0;
  align-self:stretch;
  display:flex;
  align-items:center;
  padding:10px 12px;
  border-radius:16px;
  background:rgba(255,246,231,.54);
  border:1px solid rgba(201,140,79,.14);
}

.profileTopHonor .honorPills{
  gap:5px;
}

.profileTopHonor .honorPill{
  min-height:22px;
  padding:0 8px;
  font-size:10px;
}

.profileTopAction{
  display:flex;
  justify-content:flex-end;
  align-items:center;
}

.profileAvatar{
  width:72px;
  height:72px;
  border-radius:22px;
  object-fit:cover;
  background:rgba(255,244,226,.9);
  border:1px solid rgba(184,132,75,.18);
  box-shadow:0 8px 18px rgba(116,86,54,.12);
}

.profileNameLine{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.profileName{
  color:#6f4726;
  font-size:20px;
  font-weight:900;
  line-height:1.2;
}

.profileBadge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:24px;
  padding:0 9px;
  border-radius:999px;
  background:rgba(201,140,79,.14);
  color:#9b6422;
  font-size:11px;
  font-weight:900;
}

.profileMeta{
  margin-top:6px;
  color:#9b7656;
  font-size:12px;
  line-height:1.55;
  font-weight:800;
}

.profileGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.profileField{
  min-width:0;
  border-radius:14px;
  background:rgba(255,255,255,.48);
  border:1px solid rgba(255,255,255,.56);
  padding:10px 11px;
}

.profileField.full{grid-column:1 / -1;}

.profileLabel{
  color:#9b7656;
  font-size:11px;
  font-weight:900;
  margin-bottom:5px;
}

.profileValue{
  color:#6f4726;
  font-size:13px;
  font-weight:800;
  line-height:1.45;
  word-break:break-word;
  white-space:pre-wrap;
}

.skillPills,
.honorPills{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.skillPill,
.honorPill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:25px;
  padding:0 9px;
  border-radius:999px;
  background:rgba(255,246,231,.86);
  border:1px solid rgba(201,140,79,.16);
  color:#84582f;
  font-size:11px;
  font-weight:900;
}

.profileForm{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.profileForm label{
  display:flex;
  flex-direction:column;
  gap:5px;
  color:#8a6644;
  font-size:11px;
  font-weight:900;
}

.profileForm label.full{grid-column:1 / -1;}

.profileForm input,
.profileForm select,
.profileForm textarea{
  width:100%;
  border:1px solid rgba(201,140,79,.22);
  border-radius:12px;
  background:rgba(255,255,255,.72);
  color:#6f4726;
  outline:none;
  padding:9px 10px;
  font-size:12px;
  font-weight:800;
  font-family:inherit;
}

.profileForm textarea{
  min-height:76px;
  resize:vertical;
  line-height:1.55;
}

.profileForm input:focus,
.profileForm select:focus,
.profileForm textarea:focus{
  border-color:rgba(201,140,79,.58);
  box-shadow:0 0 0 3px rgba(201,140,79,.10);
  background:rgba(255,255,255,.92);
}

.profileEditNote,
.profileStatus{
  color:#9b7656;
  font-size:12px;
  line-height:1.6;
  font-weight:800;
}

.profileStatus.success{color:#4d8a51;}
.profileStatus.error{color:#a14f3f;}

.profileCardHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.profileCardHead .profileCardTitle{
  margin:0;
}

.profileEditQuick{
  margin-left:auto;
}

/* =========================================================
   底图贴合坐标系统
========================================================= */
function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";
  root.style.setProperty("--bg-ui-scale","1");

  if(roomNav){
    roomNav.style.transform = "";
  }
}

function syncOverlayToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  /*
    大屏缩放规则：
    1440px = 1 倍；2400px 继续放大；3840px 继续放大；
    约 4608px 后限制在 3.2 倍，适配 8K 时不让组件无限巨大。
    关键：用背景图实际显示宽度 displayWidth 计算，保证文字、按钮、面板和背景图一起等比例变化。
  */
  const scale = Math.max(0.34, Math.min(3.2, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));

  requestAnimationFrame(fitRoomNavToBar);
}

/* =========================================================
   房间按钮自动缩放
========================================================= */
function fitRoomNavToBar(){
  if(!roomNav || !topBar || isTinyScreen()) return;

  roomNav.style.transform = "scale(1)";

  const availableWidth = topBar.clientWidth;
  const neededWidth = roomNav.scrollWidth;

  if(!availableWidth || !neededWidth) return;

  const fitScale = Math.min(1, availableWidth / neededWidth);
  roomNav.style.transform = `scale(${fitScale})`;
}

/* =========================================================
   通用工具
========================================================= */
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function roleLabel(role){
  const r = String(role || "").toLowerCase();
  if(r === "owner") return "维修工";
  if(r === "admin") return "宿管";
  if(r === "member") return "房客";
  if(r === "applying") return "申请中";
  return "参观者";
}

function ledgerLabel(item){
  const sub = String(item.subcategory || "");
  if(sub === "submit") return "演唱交音奖励";
  if(sub === "publish") return "演唱发布奖励";
  if(sub === "mix_submit") return "后期交付奖励";
  if(sub === "mix_publish") return "后期发布奖励";
  if(sub === "pet_adopt") return "宠物领养";
  if(sub === "flower_buy") return "花房买入";
  if(sub === "flower_sell") return "花房卖出";
  return item.note || item.subcategory || item.category || "金币变动";
}

function formatDate(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function cleanNoticeSongText(value){
  return String(value ?? "")
    .replace(/《\s*(?:编号|项目编号|歌曲编号)?\s*[A-Za-z]*\d+[.．。]\s*([^》]+?)\s*》/g,"《$1》")
    .replace(/(^|[：:\s])(?:编号|项目编号|歌曲编号)?\s*[A-Za-z]*\d+[.．。]\s*(?=《)/g,"$1")
    .replace(/(^|[：:\s])(?:编号|项目编号|歌曲编号)[.．。]\s*(?=《)/g,"$1");
}

function isToday(value){
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return false;
  const now = new Date();
  return d.getFullYear() === now.getFullYear()
    && d.getMonth() === now.getMonth()
    && d.getDate() === now.getDate();
}

function setText(id,value){
  const el = document.getElementById(id);
  if(el) el.textContent = value;
}

function setLedgerMessage(message,isError=false){
  const list = document.getElementById("ledgerList");
  if(!list) return;
  list.innerHTML = `<div class="${isError ? "errorText" : "emptyText"}">${escapeHtml(message)}</div>`;
}

function readLocalAuth(){
  authState.loggedIn = localStorage.getItem(STORAGE_KEYS.loggedIn) === "true";
  authState.nickname = String(localStorage.getItem(STORAGE_KEYS.user) || "").trim();
  authState.role = String(localStorage.getItem(STORAGE_KEYS.role) || "visitor").toLowerCase();
  authState.memberId = localStorage.getItem(STORAGE_KEYS.memberId) || null;
  authState.memberCode = localStorage.getItem(STORAGE_KEYS.memberCode) || "";

  if(!authState.loggedIn || !authState.nickname || !authState.memberId){
    window.location.href = "index.html";
    return false;
  }

  return true;
}

function updateIdentity(member){
  const name = member?.nickname || authState.nickname || "";
  const role = roleLabel(member?.role || authState.role);

  if(!currentUserText || !loginOpenBtn || !logoutBtn) return;

  if(!name){
    currentUserText.textContent = "参观者";
    loginOpenBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    return;
  }

  currentUserText.textContent = `${name} | ${role}`;
  loginOpenBtn.classList.add("hidden");
  logoutBtn.classList.remove("hidden");
}

function handleLogout(){
  localStorage.removeItem(STORAGE_KEYS.loggedIn);
  localStorage.removeItem(STORAGE_KEYS.user);
  localStorage.removeItem(STORAGE_KEYS.role);
  localStorage.removeItem(STORAGE_KEYS.memberId);
  localStorage.removeItem(STORAGE_KEYS.memberCode);

  localStorage.removeItem("room10_user");
  localStorage.removeItem("room10_current_user");
  localStorage.removeItem("currentUser");

  window.location.href = "index.html";
}

  const rawTitle = item.title || item.notice_title || item.subject || item.name || "系统通知";
  const rawDesc = item.desc || item.description || item.content || item.message || item.body || item.notice_content || "";

  return {

    title:cleanNoticeSongText(rawTitle),
    desc:cleanNoticeSongText(rawDesc),
    created_at:item.created_at || item.createdAt || item.updated_at || item.time || null

function noticeVisibleToCurrentUser(item){
  if(!item) return false;

  const targetMemberId = item.member_id || item.target_member_id || item.to_member_id || item.receiver_member_id || null;
  const targetRole = String(item.role || item.target_role || item.receiver_role || "").toLowerCase();
  const targetNickname = String(item.nickname || item.target_nickname || item.to_nickname || "").trim();

  if(targetMemberId && authState.memberId && String(targetMemberId) !== String(authState.memberId)) return false;
  if(targetRole && targetRole !== "all" && targetRole !== "member" && targetRole !== String(authState.role || "").toLowerCase()) return false;
  if(targetNickname && authState.nickname && targetNickname !== authState.nickname) return false;

  const isHidden = item.is_hidden === true || item.hidden === true || item.status === "hidden";
  const isDeleted = item.is_deleted === true || item.deleted === true || item.status === "deleted";

  return !isHidden && !isDeleted;
}

function renderDormNoticeCenter(items){
  const wrap = document.getElementById("dormNoticeCenter");
  if(!wrap) return;

  const list = (Array.isArray(items) ? items : [])
    .map(normalizeNoticeItem)
    .filter(item => item.room && allowedNoticeRooms.has(item.room) && (item.title || item.desc));

  const byRoom = new Map();
  roomNoticeGroups.forEach(room => byRoom.set(room.key, []));

  list.forEach(item => {
    if(byRoom.has(item.room)){
      byRoom.get(item.room).push(item);
    }
  });

  wrap.innerHTML = roomNoticeGroups.map(room => {
    const roomItems = byRoom.get(room.key) || [];
    const shouldOpen = false;

    const body = roomItems.length
      ? roomItems.map(item => {
        const desc = item.desc || "暂无详细内容。";
        const time = item.created_at ? formatDate(item.created_at) : "";
        return `
          <div class="noticeRoomItem">
            <div class="noticeRoomTitleLine">
              <div class="noticeRoomItemTitle">${escapeHtml(item.title || "通知")}</div>
              ${time ? `<div class="noticeRoomTime">${escapeHtml(time)}</div>` : ""}
            </div>
            <div class="noticeRoomItemDesc">${escapeHtml(desc)}</div>
          </div>
        `;
      }).join("")
      : '<div class="noticeRoomEmpty">暂无通知。</div>';

    return `
      <section class="noticeRoomGroup${shouldOpen ? " open" : ""}" data-room="${escapeHtml(room.key)}">
        <button class="noticeRoomHeader" type="button">
          <span>${escapeHtml(room.icon)} ${escapeHtml(room.label)}</span>
          <span class="noticeRoomCount">${roomItems.length}</span>
        </button>
        <div class="noticeRoomBody">${body}</div>
      </section>
    `;
  }).join("");

  wrap.querySelectorAll(".noticeRoomHeader").forEach(header => {
    header.addEventListener("click", () => {
      const group = header.closest(".noticeRoomGroup");
      if(group) group.classList.toggle("open");

  });

   我的任务：读取 / 渲染 / 快捷操作

function taskTypeLabel(type){
  if(type === "vocal_submit" || type === "vocal_submitted") return "待交音";
  if(type === "mix_submit" || type === "mix_submitted") return "待后期";
  if(type === "claim" || type === "singer_claim" || type === "mix_claim" || type === "singer_claimed" || type === "mix_claimed") return "待认领";
  return "我的任务";
}

function taskTabKey(type){
  if(type === "vocal_submitted") return "vocal_submit";
  if(type === "mix_submitted") return "mix_submit";
  if(type === "singer_claim" || type === "mix_claim" || type === "singer_claimed" || type === "mix_claimed") return "claim";
  return type;
}

function taskToneText(task){
  const tone = String(task.project_tone || "").trim();
  if(!tone) return "";

  const key = taskTabKey(task.task_type);
  if(key === "vocal_submit" || key === "mix_submit"){
    return escapeHtml(tone);
  }

  return `调：${escapeHtml(tone)}`;
}

function taskDateLine(task){
  return task.release_date ? `预计发布：${escapeHtml(task.release_date)}` : "";
}

function taskOriginalLine(task){
  return task.my_original_names ? `你负责：${escapeHtml(task.my_original_names)}` : "";
}

function taskSingerNeedLine(task){
  const current = Number(task.singer_count || 0);
  const target = Number(task.target_singer_count || 0);
  const missing = Number(task.missing_singer_count || Math.max(target - current, 0));
  if(target > 0) return `演唱人数：${current}/${target}${missing > 0 ? `，缺 ${missing} 人` : ""}`;
  return `演唱人数：${current}`;
}

function taskSingerCountLine(task){
  const singerCount = Number(task.singer_count || 0);
  return `演唱人数：${singerCount}`;
}

function taskMainButtonHtml(task){
  const projectId = escapeHtml(task.project_id);

  if(task.task_type === "vocal_submit"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="submit_vocal" data-project-id="${projectId}">交音</button>`;
  }

  if(task.task_type === "mix_submit"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="submit_mix" data-project-id="${projectId}">交付</button>`;
  }

  if(task.task_type === "singer_claim"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="claim_singer" data-project-id="${projectId}">认领</button>`;
  }

  if(task.task_type === "mix_claim"){
    return `<button class="dormMiniBtn dormTaskActionBtn" type="button" data-action="claim_mix" data-project-id="${projectId}">认领后期</button>`;
  }

  if(task.task_type === "vocal_submitted"){
    return `<button class="dormSubBtn dormTaskActionBtn" type="button" data-action="undo_vocal" data-project-id="${projectId}">撤回交音</button>`;
  }

  if(task.task_type === "mix_submitted"){
    return `<button class="dormSubBtn dormTaskActionBtn" type="button" data-action="undo_mix" data-project-id="${projectId}">撤回</button>`;
  }

  if(task.task_type === "singer_claimed"){
    return `<span class="taskDoneText">已认领，撤回请去工作间</span>`;
  }

  if(task.task_type === "mix_claimed"){
    return `<span class="taskDoneText">已认领后期，撤回请去工作间</span>`;
  }

  return "";
}

function taskMetaItems(task){
  const items = [];

  const tone = taskToneText(task);
  if(tone) items.push(tone);

  if(task.task_type === "vocal_submit" || task.task_type === "vocal_submitted"){
    const original = taskOriginalLine(task);
    if(original) items.push(original);
  }

  if(task.task_type === "singer_claim" || task.task_type === "singer_claimed"){
    items.push(taskSingerNeedLine(task));
  }

  if(task.task_type === "mix_claim" || task.task_type === "mix_claimed"){
    items.push(taskSingerCountLine(task));
  }

  const dateLine = taskDateLine(task);
  if(dateLine) items.push(dateLine);

  return items;
}

function formatTaskTitle(task){
  const rawCode = String(task.project_code || "").trim();
  const name = escapeHtml(task.project_name || "未命名项目");

  if(!rawCode) return name;

  const code = escapeHtml(rawCode.replace(/[.．。\s]+$/g,""));
  return `${code}.${name}`;
}

function taskCardHtml(task){
  const title = formatTaskTitle(task);
  const mainButton = taskMainButtonHtml(task);
  const metaItems = taskMetaItems(task);

  return `
    <div class="taskCard taskCardCompact" data-task-type="${escapeHtml(task.task_type)}" data-project-id="${escapeHtml(task.project_id)}">
      <div class="taskCompactLine">
        <h3 class="taskCardTitle">${title}</h3>
        <div class="taskMetaInline">
          ${metaItems.map(item => `<span>${item}</span>`).join("")}
        </div>
        <div class="taskActionRow">
          ${mainButton}
        </div>
      </div>
    </div>
  `;
}

function compareProjectCode(a,b){
  return String(a.project_code || "").localeCompare(String(b.project_code || ""), "zh-Hans-CN", { numeric:true });
}

function sortDormTaskRows(rows,tabKey){
  const list = rows.slice();

  if(tabKey === "vocal_submit"){
    return list.sort((a,b) => {
      const diff = Number(a.unsubmitted_count || 999999) - Number(b.unsubmitted_count || 999999);
      return diff || compareProjectCode(a,b);
    });
  }

  if(tabKey === "mix_submit"){
    return list.sort((a,b) => {
      const ad = a.release_date || "";
      const bd = b.release_date || "";
      if(ad && bd && ad !== bd) return ad.localeCompare(bd);
      if(ad && !bd) return -1;
      if(!ad && bd) return 1;
      return compareProjectCode(a,b);
    });
  }

  if(tabKey === "claim"){
    return list.sort((a,b) => {
      const ag = a.task_type === "singer_claim" || a.task_type === "singer_claimed" ? 1 : 2;
      const bg = b.task_type === "singer_claim" || b.task_type === "singer_claimed" ? 1 : 2;
      if(ag !== bg) return ag - bg;

      const diff = Number(b.singer_count || 0) - Number(a.singer_count || 0);
      return diff || compareProjectCode(a,b);
    });
  }

  return list;
}

function mergedDormTaskRows(){
  const recentRows = Array.from(recentDormTaskActions.values());
  const recentIds = new Set(recentRows.map(item => String(item.project_id)));
  const normalRows = (Array.isArray(dormTaskRows) ? dormTaskRows : []).filter(item => !recentIds.has(String(item.project_id)));
  return recentRows.concat(normalRows);
}

function updateDormTaskTabs(rows){
  const counts = { vocal_submit:0, mix_submit:0, claim:0 };
  rows.forEach(item => {
    const key = taskTabKey(item.task_type);
    if(Object.prototype.hasOwnProperty.call(counts,key)) counts[key] += 1;
  });

  document.querySelectorAll(".taskTab").forEach(btn => {
    const key = btn.dataset.taskTab;
    btn.classList.toggle("active", key === activeDormTaskTab);
    const badge = btn.querySelector("span");
    if(badge) badge.textContent = String(counts[key] || 0);
  });
}

function renderDormTasks(rows){
  const list = document.getElementById("taskList");
  if(!list) return;

  const allRows = mergedDormTaskRows();
  updateDormTaskTabs(allRows);

  if(!allRows.length){
    list.innerHTML = `
      <div class="taskCard">
        <h3 class="taskCardTitle">今天没有需要你处理的任务</h3>
      </div>
    `;
    return;
  }

  const currentRows = sortDormTaskRows(
    allRows.filter(item => taskTabKey(item.task_type) === activeDormTaskTab),
    activeDormTaskTab
  );

  if(!currentRows.length){
    list.innerHTML = `<div class="emptyText">${escapeHtml(taskTypeLabel(activeDormTaskTab))}暂无任务。</div>`;
    return;
  }

  list.innerHTML = currentRows.map(taskCardHtml).join("");
}

async function loadDormTasks(){
  const list = document.getElementById("taskList");
  if(!list) return;

  if(!authState.memberId || !authState.memberCode){
    updateDormTaskTabs([]);
    list.innerHTML = '<div class="errorText">请先登录后查看我的任务。</div>';
    return;
  }

  list.innerHTML = '<div class="emptyText">正在读取我的任务……</div>';

  try{
    const { data,error } = await supabaseClient.rpc("get_dorm_work_tasks",{
      p_member_id:authState.memberId,
      p_member_code:authState.memberCode
    });

    if(error) throw error;

    dormTaskRows = Array.isArray(data) ? data : [];
    renderDormTasks(dormTaskRows);
  }catch(error){
    console.error(error);
    list.innerHTML = '<div class="errorText">我的任务读取失败，请检查 get_dorm_work_tasks RPC。</div>';
  }
}

function findDormTask(projectId){
  return dormTaskRows.find(item => String(item.project_id) === String(projectId))
    || recentDormTaskActions.get(String(projectId))
    || null;
}

async function runDormTaskAction(action,projectId){
  if(!action || !projectId) return;

  const task = findDormTask(projectId);
  const fnMap = {
    submit_vocal:"submit_dorm_vocal",
    undo_vocal:"undo_dorm_vocal_submit",
    submit_mix:"submit_dorm_mix",
    undo_mix:"undo_dorm_mix_submit",
    claim_singer:"claim_dorm_singer",
    claim_mix:"claim_dorm_mix"
  };

  const fn = fnMap[action];
  if(!fn) return;

  try{
    const { data,error } = await supabaseClient.rpc(fn,{
      p_member_id:authState.memberId,
      p_member_code:authState.memberCode,
      p_project_id:projectId
    });

    if(error) throw error;

    const result = Array.isArray(data) ? data[0] : data;
    if(!result || result.ok !== true){
      alert(result?.message || "操作失败，任务状态可能已变化。");
      await loadDormTasks();
      return;
    }

    if(action === "submit_vocal" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"vocal_submitted",
        my_singer_submitted:true
      });
    }

    if(action === "submit_mix" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"mix_submitted",
        producer_completed:true
      });
    }

    if(action === "claim_singer" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"singer_claimed",
        singer_count:Number(task.singer_count || 0) + 1,
        missing_singer_count:Math.max(Number(task.missing_singer_count || 0) - 1, 0)
      });
    }

    if(action === "claim_mix" && task){
      recentDormTaskActions.set(String(projectId),{
        ...task,
        task_type:"mix_claimed",
        producer_member_id:authState.memberId,
        producer_nickname:authState.nickname
      });
    }

    if(action === "undo_vocal" || action === "undo_mix"){
      recentDormTaskActions.delete(String(projectId));
    }

    await loadDormTasks();
  }catch(error){
    console.error(error);
    alert(`操作失败：${error.message || "请检查任务 RPC"}`);
    await loadDormTasks();
  }
}

function bindDormTaskActions(){
  const list = document.getElementById("taskList");
  if(list){
    list.addEventListener("click", event => {
      const btn = event.target.closest(".dormTaskActionBtn");
      if(!btn) return;

      event.preventDefault();
      event.stopPropagation();

      const action = btn.dataset.action;
      const projectId = btn.dataset.projectId;
      runDormTaskAction(action,projectId);
    });
  }

  const tabs = document.getElementById("taskTabs");
  if(tabs){
    tabs.addEventListener("click", event => {
      const btn = event.target.closest(".taskTab");
      if(!btn) return;

      activeDormTaskTab = btn.dataset.taskTab || "vocal_submit";
      renderDormTasks(dormTaskRows);
    });
  }
}

async function loadGoldLedger(memberId){
  const { data,error } = await supabaseClient
    .from("gold_ledger")

    .eq("member_id",memberId)
    .order("created_at",{ ascending:false })

    .filter(item => item.direction === "in" && isToday(item.created_at))
    .reduce((sum,item) => sum + Number(item.amount || 0),0);

  const todayEl = document.getElementById("todayGold");
  if(todayEl){
    todayEl.textContent = todayIncome > 0 ? `+${todayIncome}` : "0";
    todayEl.className = todayIncome > 0 ? "statValue todayValue income" : "statValue todayValue none";
  }

  const list = document.getElementById("ledgerList");
  list.innerHTML = data.map(item => {
    const isIn = item.direction === "in";
    const sign = isIn ? "+" : "-";
    const title = ledgerLabel(item);

    return `
      <div class="ledgerItem">
        <div class="ledgerArrow ${isIn ? "in" : "out"}">${isIn ? "↑" : "↓"}</div>

          ${sign}${Number(item.amount || 0)}
        </div>
      </div>
    `;
  }).join("");
}


/* =========================================================
   我的背包
========================================================= */
function itemValue(item,keys){
  for(const key of keys){
    const value = item?.[key];
    if(value !== null && value !== undefined && String(value).trim() !== "") return value;
  }
  return "";
}

function itemDisplayName(item){
  return itemValue(item,["item_name","name","title","display_name","item_key","item_code","code","resource_name","resource_key"]) || "未命名道具";
}

function itemQuantity(item){
  const value = itemValue(item,["quantity","qty","count","amount","item_count","balance","total"]);
  const number = Number(value || 0);
  return Number.isFinite(number) ? number : 0;
}

function itemSortOrder(item){
  const number = Number(item?.sort_order ?? 9999);
  return Number.isFinite(number) ? number : 9999;
}

function inventoryFallbackEmoji(item){
  const key = String(`${item?.item_key || ""} ${item?.item_name || ""} ${item?.name || ""}`).toLowerCase();
  if(key.includes("water") || key.includes("水")) return "💧";
  if(key.includes("fertilizer") || key.includes("肥")) return "🌱";
  if(key.includes("seed") || key.includes("种子")) return "🌰";
  if(key.includes("flower") || key.includes("花")) return "🌸";
  if(key.includes("pet") || key.includes("宠")) return "🐾";
  if(key.includes("card") || key.includes("ticket") || key.includes("券") || key.includes("卡")) return "🎫";
  if(key.includes("gift") || key.includes("box") || key.includes("礼包")) return "🎁";
  return "🎒";
}

function itemIconHtml(item){
  const rawIcon = String(itemValue(item,["item_icon","icon","emoji"])).trim();
  const fallback = inventoryFallbackEmoji(item);

  if(!rawIcon){
    return `<span class="inventoryEmoji">${escapeHtml(fallback)}</span>`;
  }

  if(/^https?:\/\//i.test(rawIcon) || /\.(png|jpe?g|gif|webp|svg)$/i.test(rawIcon)){
    const safeSrc = escapeHtml(rawIcon);
    const safeFallback = escapeHtml(fallback);
    return `<img src="${safeSrc}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'inventoryEmoji',textContent:'${safeFallback}'}))">`;
  }

  if(rawIcon.length <= 4){
    return `<span class="inventoryEmoji">${escapeHtml(rawIcon)}</span>`;
  }

  return `<span class="inventoryEmoji">${escapeHtml(fallback)}</span>`;
}

function mergeInventoryRows(memberItems,itemTypes){
  const typeMap = new Map((Array.isArray(itemTypes) ? itemTypes : []).map(type => [String(type.item_key), type]));

  return (Array.isArray(memberItems) ? memberItems : []).map(row => ({
    ...row,
    ...(typeMap.get(String(row.item_key)) || {})
  }));
}

function renderInventory(items){
  const wrap = document.getElementById("inventoryList");
  if(!wrap) return;

  const rows = (Array.isArray(items) ? items : [])
    .map(item => ({ item, qty:itemQuantity(item) }))
    .filter(row => row.qty > 0)
    .sort((a,b) => itemSortOrder(a.item) - itemSortOrder(b.item));

  if(!rows.length){
    wrap.innerHTML = '<div class="emptyText">当前背包暂无道具。</div>';
    return;
  }

  wrap.innerHTML = rows.map(({ item, qty }) => `
    <div class="inventoryItem">
      <div class="inventoryIcon">${itemIconHtml(item)}</div>
      <div>
        <div class="inventoryName">${escapeHtml(itemDisplayName(item))}<span class="inventoryQty">×${qty}</span></div>
      </div>
    </div>
  `).join("");
}

async function loadInventory(){
  const wrap = document.getElementById("inventoryList");
  if(!wrap) return;

  const memberId = currentMemberProfile?.id || authState.memberId;
  if(!memberId){
    wrap.innerHTML = '<div class="errorText">请先登录后查看我的背包。</div>';
    return;
  }

  wrap.innerHTML = '<div class="emptyText">正在读取我的道具……</div>';

  try{
    const { data:memberItems,error:itemError } = await supabaseClient
      .from("member_items")
      .select("item_key,quantity,updated_at")
      .eq("member_id",memberId)
      .order("updated_at",{ ascending:false });

    if(itemError) throw itemError;

    const itemKeys = Array.from(new Set((memberItems || []).map(item => item.item_key).filter(Boolean)));
    let itemTypes = [];

    if(itemKeys.length){
      const { data:typeRows,error:typeError } = await supabaseClient
        .from("item_types")
        .select("item_key,item_name,item_category,item_desc,item_icon,is_active,sort_order")
        .in("item_key",itemKeys);

      if(typeError){
        console.warn("item_types 读取失败，背包将先显示 item_key。", typeError);
      }else{
        itemTypes = (Array.isArray(typeRows) ? typeRows : []).filter(item => item.is_active !== false);
      }
    }

    renderInventory(mergeInventoryRows(memberItems,itemTypes));
  }catch(error){
    console.error(error);
    wrap.innerHTML = `<div class="errorText">背包读取失败：${escapeHtml(error.message || "请检查 member_items / item_types 读取权限。")}</div>`;
  }
}

function formatBirthday(month,day){
  if(!month || !day) return "未填写";
  return `${Number(month)}月${Number(day)}日`;

function normalizeSkills(value){
  if(Array.isArray(value)) return value.map(v => String(v).trim()).filter(Boolean);
  return String(value || "")
    .split(/[，,、/|\s]+/)
    .map(v => v.trim())
    .filter(Boolean);
}

function uniqueSkills(list){
  const seen = new Set();
  const result = [];
  list.forEach(item => {
    const value = String(item || "").trim();
    if(!value) return;
    const key = value.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    result.push(value);
  });
  return result;
}

function skillPillsHtml(skills){

    { name:"混音", values:["混音","后期","修音","贴唱","混","mix","mixing","mixer"] },
    { name:"视频剪辑", values:["视频剪辑","剪辑","视频","pv","做视频","视频后期","video"] },
    { name:"美工", values:["美工","海报","作图","排版","封面","设计","平面设计"] }
  ];

  const found = aliases.find(group => group.values.some(item => item.toLowerCase() === value));
  if(found) return { input:raw.trim(), matched:found.name, status:"matched" };
  return { input:raw.trim(), matched:"", status:"unmatched" };
}

function collectProfilePayload(){
  return {
    name:document.getElementById("profileNameInput")?.value.trim() || "",
    location:document.getElementById("profileLocationInput")?.value.trim() || null,
    birthday_month:document.getElementById("profileBirthdayMonth")?.value ? Number(document.getElementById("profileBirthdayMonth").value) : null,
    birthday_day:document.getElementById("profileBirthdayDay")?.value ? Number(document.getElementById("profileBirthdayDay").value) : null,
    mbti:document.getElementById("profileMbtiInput")?.value || null,
    social_xiaohongshu:document.getElementById("profileXhsInput")?.value.trim() || null,
    social_douyin:document.getElementById("profileDouyinInput")?.value.trim() || null,
    social_bilibili:document.getElementById("profileBilibiliInput")?.value.trim() || null,
    social_weibo:document.getElementById("profileWeiboInput")?.value.trim() || null,
    public_message:document.getElementById("profileMessageInput")?.value.trim() || null
  };
}

function fieldLabel(key){
  const labels = {
    name:"圈名",
    location:"所在地",
    birthday_month:"生日月份",
    birthday_day:"生日日期",
    mbti:"MBTI",
    social_xiaohongshu:"小红书",
    social_douyin:"抖音",
    social_bilibili:"B站",
    social_weibo:"微博",
    public_message:"公开留言",
    skills:"正式技能",
    skill_request:"新增技能申请"
  };
  return labels[key] || key;
}

function stringifyFieldValue(value){
  if(value === null || value === undefined || value === "") return "";
  if(Array.isArray(value)) return value.join("、");
  return String(value);
}

function diffProfileFields(oldMember,payload){
  const changes = [];
  Object.entries(payload).forEach(([key,newValue]) => {
    const oldValue = oldMember ? oldMember[key] : null;
    if(stringifyFieldValue(oldValue) !== stringifyFieldValue(newValue)){
      changes.push({
        field_key:key,
        field_label:fieldLabel(key),
        old_value:stringifyFieldValue(oldValue),
        new_value:stringifyFieldValue(newValue),
        change_type:"profile_update",
        status:"logged"
      });
    }
  });
  return changes;
}

async function logProfileChanges(changes){
  if(!changes.length) return;

  const rows = changes.map(item => ({
    member_id:authState.memberId,
    member_code:authState.memberCode,
    nickname:authState.nickname,
    field_key:item.field_key,
    field_label:item.field_label,
    old_value:item.old_value,
    new_value:item.new_value,
    change_type:item.change_type || "profile_update",
    status:item.status || "logged"
  }));

  try{
    const { error } = await supabaseClient.from("member_profile_change_logs").insert(rows);
    if(error) throw error;
  }catch(error){
    console.warn("成员资料修改记录表尚未可用，已跳过日志写入。", error);
  }
}

async function checkProfileNameDuplicate(name){
  const { data,error } = await supabaseClient
    .from("members")
    .select("id")
    .eq("name",name)
    .neq("id",authState.memberId)
    .limit(1);

  if(error) throw error;
  return Array.isArray(data) && data.length > 0;
}

async function saveProfileEdit(){
  if(!currentMemberProfile) return;
  const payload = collectProfilePayload();
  const skillInput = document.getElementById("profileSkillInput")?.value.trim() || "";
  const skillMatch = standardSkillName(skillInput);
  let changes = diffProfileFields(currentMemberProfile,payload);
  let skillMessage = "";

  if(!validateProfileName(payload.name)){
    setProfileStatus("圈名不能为空，且最多 20 个字符。","error");
    return;
  }

  if(!validateProfileLocation(payload.location)){
    setProfileStatus("所在地仅可填写省份、美东/美西/美中、美国或加拿大。","error");
    return;
  }

  if((payload.birthday_month && !payload.birthday_day) || (!payload.birthday_month && payload.birthday_day)){
    setProfileStatus("生日月份和日期需要一起填写。","error");
    return;
  }

  setProfileStatus("正在保存档案……");

  try{
    const duplicated = await checkProfileNameDuplicate(payload.name);
    if(duplicated){
      setProfileStatus("这个圈名已经有人使用了，请换一个。","error");
      return;
    }

    const currentSkills = uniqueSkills(normalizeSkills(currentMemberProfile.skills));
    if(skillMatch.status === "matched"){
      if(!currentSkills.some(item => item === skillMatch.matched)){
        const nextSkills = uniqueSkills([...currentSkills, skillMatch.matched]);
        payload.skills = nextSkills.join(",");
        changes.push({
          field_key:"skills",
          field_label:"正式技能",
          old_value:currentSkills.join("、"),
          new_value:nextSkills.join("、"),
          change_type:"skill_auto_matched",
          status:"logged"
        });
        skillMessage = `“${skillMatch.input}”已归并为正式技能「${skillMatch.matched}」。`;
      }else{
        skillMessage = `你已经有正式技能「${skillMatch.matched}」。`;
      }
    }else if(skillMatch.status === "unmatched"){
      changes.push({
        field_key:"skill_request",
        field_label:"新增技能申请",
        old_value:"",
        new_value:skillMatch.input,
        change_type:"skill_request",
        status:"logged"
      });
      skillMessage = `“${skillMatch.input}”已记录给宿管查看，后续如需调整会提醒你。`;
    }

    if(!changes.length){
      setProfileStatus(skillMessage || "没有检测到需要保存的修改。","success");
      return;
    }

    const { error } = await supabaseClient
      .from("members")
      .update(payload)
      .eq("id",authState.memberId)
      .eq("member_code",authState.memberCode);

    if(error) throw error;

    await logProfileChanges(changes);
    const fresh = await fetchCurrentMember();
    currentMemberProfile = fresh || { ...currentMemberProfile, ...payload };
    if(currentMemberProfile.nickname) authState.nickname = currentMemberProfile.nickname;
    if(currentMemberProfile.role) authState.role = currentMemberProfile.role;
    updateIdentity(currentMemberProfile);
    profileEditMode = false;
    honorSummaryState = honorSummaryState;
    renderProfileView(currentMemberProfile);
  }catch(error){
    console.error(error);
    setProfileStatus(`保存失败：${error.message || "请检查 members 表更新权限"}`,"error");
  }
}

async function loadHonorSummary(memberId){
  if(!memberId) return;

  try{
    const [{ data:titleRows,error:titleError,count:titleCount }, { data:achievementRows,error:achievementError,count:achievementCount }] = await Promise.all([
      supabaseClient
        .from("member_titles")
        .select("obtained_at,titles(name)", { count:"exact" })
        .eq("member_id",memberId)
        .order("obtained_at",{ ascending:false })
        .limit(1),
      supabaseClient
        .from("member_achievements")
        .select("obtained_at,achievements(name,description)", { count:"exact" })
        .eq("member_id",memberId)
        .order("obtained_at",{ ascending:false })
        .limit(1)
    ]);

    if(titleError || achievementError) throw (titleError || achievementError);

    const latestTitleTime = titleRows?.[0]?.obtained_at ? new Date(titleRows[0].obtained_at).getTime() : 0;
    const latestAchievementTime = achievementRows?.[0]?.obtained_at ? new Date(achievementRows[0].obtained_at).getTime() : 0;
    const latestTitleName = titleRows?.[0]?.titles?.name || "";
    const latestAchievementName = achievementRows?.[0]?.achievements?.name || achievementRows?.[0]?.achievements?.description || "";

    honorSummaryState = {
      titles:Number(titleCount || 0),
      achievements:Number(achievementCount || 0),
      recent:latestTitleTime >= latestAchievementTime ? latestTitleName : latestAchievementName
    };
  }catch(error){
    console.warn("荣誉摘要读取失败。", error);
    honorSummaryState = { error:"荣誉摘要暂时无法读取。" };
  }

  if(!profileEditMode) renderProfileView(currentMemberProfile);
}

/* =========================================================
   页面交互
========================================================= */
function bindSideTabs(){
  const buttons = document.querySelectorAll(".sideBtn");

  buttons.forEach(btn => {
    btn.addEventListener("click",() => {
      activateDormView(btn.dataset.view);
    });
  });
}

function setMascotBubbleOnce(){
  const bubble = document.getElementById("mascotBubble");
  if(!bubble) return;

  const item = mascotLines[Math.floor(Math.random()*mascotLines.length)];
  bubble.textContent = item.text;
  bubble.className = `bubble-${item.style}`;
}

/* =========================================================
   初始化
========================================================= */
async function initDormPage(){
  if(!readLocalAuth()) return;

  updateIdentity({
    nickname:authState.nickname,
    role:authState.role
  });

  bindSideTabs();
  restoreDormView();
  bindDormTaskActions();
  setMascotBubbleOnce();

  if(siteNoticeBtn){
    siteNoticeBtn.addEventListener("click", event => {
      event.stopPropagation();
      jumpToSystemNotice();
    });
  }

  if(loginOpenBtn){
    loginOpenBtn.addEventListener("click", event => {
      event.stopPropagation();
      window.location.href = "index.html";
    });
  }

  if(logoutBtn){
    logoutBtn.addEventListener("click", event => {
      event.stopPropagation();
      handleLogout();
    });
  }

  syncOverlayToImage();

  /*
    先读取 members 表，回填 member_code / role / nickname 后，
    再读取系统通知和我的任务。
    这样即使登录缓存里缺少 room10MemberCode，也不会被误判为未登录。
  */
  await loadGoldInfo();

  await Promise.all([
    loadSystemNotices(),
    loadDormTasks()
  ]);
}

document.addEventListener("DOMContentLoaded", () => {
  initDormPage();
});

window.addEventListener("resize", syncOverlayToImage);

window.addEventListener("storage", event => {
  if(
    event.key === STORAGE_KEYS.loggedIn ||
    event.key === STORAGE_KEYS.user ||
    event.key === STORAGE_KEYS.role ||
    event.key === STORAGE_KEYS.memberId
  ){
    updateIdentity({
      nickname:localStorage.getItem(STORAGE_KEYS.user) || "",
      role:localStorage.getItem(STORAGE_KEYS.role) || ""
    });
  }
});

if(img && img.complete && img.naturalWidth){
  syncOverlayToImage();
}else if(img){
  img.addEventListener("load", syncOverlayToImage, { once:true });
}

setTimeout(syncOverlayToImage, 120);
</script>
