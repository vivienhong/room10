<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜成就称号馆</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --bg-ui-scale:1;

  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-width:calc(232px * var(--bg-ui-scale));
  --identity-height:calc(38px * var(--bg-ui-scale));

  --room-nav-left:27.2%;
  --room-nav-top:6.35%;
  --room-nav-width:45.5%;

  /* 主面板坐标绑定底图实际显示区域：全站统一规则，不按分辨率单独改坐标 */
  --honor-panel-left:20.4%;
  --honor-panel-top:27.2%;
  --honor-panel-width:61.8%;
  --honor-panel-height:64.4%;

  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);

  --nav-text:#6e4827;
  --nav-border:rgba(145,98,56,.34);

  --panel-border:rgba(198,145,79,.24);
  --card-border:rgba(170,122,82,.16);
  --brown:#6f4726;
  --brown-soft:#9b7656;
  --gold:#c98c4f;
  --green:#72855a;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at top left,#f5ecdb 0%,transparent 44%),
    linear-gradient(180deg,#efe2cc 0%,#e9d8bd 100%);
  color:var(--brown);
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button{font-family:inherit;}
.hidden{display:none !important;}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{pointer-events:auto;}

/* =========================================================
   身份组件：复制最满意版最终呈现结构
========================================================= */
#topActions{
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:var(--identity-width);
  height:var(--identity-height);
  min-width:0;
  min-height:0;
  z-index:65;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:var(--identity-bg);
  border:1px solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--ui-scale)) calc(24px * var(--ui-scale)) var(--identity-shadow),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:normal;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:.06em;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
  white-space:nowrap;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

/* =========================================================
   房间切换按钮：当前页面不显示“荣誉墙”
========================================================= */
#topBar{
  position:absolute;
  left:var(--room-nav-left);
  top:var(--room-nav-top);
  width:var(--room-nav-width);
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:55;
  overflow:visible;
  pointer-events:none;

  --nav-btn-height:calc(40px * var(--ui-scale));
  --nav-btn-px:calc(16px * var(--ui-scale));
  --nav-btn-radius:calc(13px * var(--ui-scale));
  --nav-btn-font:calc(14px * var(--ui-scale));
  --nav-gap:calc(8px * var(--ui-scale));
}

#navOuter,#navScroll{overflow:visible;}
#navOuter{flex:0 0 auto;min-width:0;width:100%;pointer-events:auto;}
#navScroll{width:100%;white-space:nowrap;padding:0;margin:0;}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap);
  transform-origin:left center;
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height);
  padding:0 var(--nav-btn-px);
  border-radius:var(--nav-btn-radius);
  color:var(--nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid var(--nav-border);
  box-shadow:
    0 1px 1px rgba(255,255,255,.48) inset,
    0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease,
    filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:
    linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:
    0 1px 1px rgba(255,255,255,.55) inset,
    0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{
  position:relative;
  z-index:5;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  height:100%;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 1px 2px rgba(255,250,232,.82),
    0 0 8px rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{ transform:translateY(4px) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(-5px) rotate(6deg) scale(1); opacity:.76; }
}

@keyframes navFloatB{
  0%,100%{ transform:translateY(5px) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(-6px) rotate(-7deg) scale(1); opacity:.68; }
}

@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(6px) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(-6px) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:hover .navEffectA,
.navBtn:focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:hover .navEffectB,
.navBtn:focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:hover .navEffectC,
.navBtn:focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}

.navBtn[data-room="hall"] .navEffect{
  color:rgba(255,205,96,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.95),
    0 0 10px rgba(255,215,105,.62);
}

.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}

/* =========================================================
   成就称号馆主体：主面板坐标绑定底图，比例更接近正方形
========================================================= */
#honorShell{
  position:absolute;
  left:var(--honor-panel-left);
  top:var(--honor-panel-top);
  width:var(--honor-panel-width);
  height:var(--honor-panel-height);
  z-index:20;
  padding:calc(13px * var(--ui-scale));
  border-radius:calc(26px * var(--ui-scale));
  border:1px solid var(--panel-border);
  background:
    linear-gradient(180deg, rgba(255,250,242,.84), rgba(250,236,216,.68));
  box-shadow:
    0 calc(16px * var(--ui-scale)) calc(38px * var(--ui-scale)) rgba(89,66,42,.12),
    inset 0 1px 0 rgba(255,255,255,.88);
  backdrop-filter:blur(calc(10px * var(--ui-scale)));
  -webkit-backdrop-filter:blur(calc(10px * var(--ui-scale)));
  display:grid;
  grid-template-rows:minmax(0,1fr);
  gap:calc(8px * var(--ui-scale));
  overflow:hidden;
}


.mineTools{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:calc(8px * var(--ui-scale));
  padding:calc(10px * var(--ui-scale)) calc(12px * var(--ui-scale));
  border-bottom:1px dashed rgba(170,117,62,.18);
}


.honorSummaryBox,
.honorClaimBox,
.honorMain,
.honorMine{
  border-radius:calc(18px * var(--ui-scale));
  border:1px solid var(--card-border);
  background:rgba(255,253,248,.56);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.72),
    0 calc(8px * var(--ui-scale)) calc(18px * var(--ui-scale)) rgba(90,67,43,.06);
}


.sourceFilterBox{
  position:relative;
  flex:0 0 auto;
  width:100%;
  min-width:0;
  min-height:0;
  padding:calc(9px * var(--ui-scale)) calc(12px * var(--ui-scale)) calc(10px * var(--ui-scale));
  overflow:hidden;
  border-bottom:1px dashed rgba(170,117,62,.18);
  background:rgba(255,253,248,.30);
}


.filterSparkles{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  opacity:.85;
}

.filterSparkle{
  position:absolute;
  width:calc(5px * var(--ui-scale));
  height:calc(5px * var(--ui-scale));
  border-radius:999px;
  background:rgba(210,151,75,.52);
  box-shadow:0 0 calc(9px * var(--ui-scale)) rgba(229,178,92,.34);
  opacity:.46;
  animation:filterSparkleFloat 4.6s ease-in-out infinite;
}

.filterSparkle:nth-child(1){left:8%;top:62%;animation-delay:-.2s;}
.filterSparkle:nth-child(2){left:28%;top:26%;animation-delay:-1.4s;transform:scale(.72);}
.filterSparkle:nth-child(3){left:54%;top:70%;animation-delay:-2.1s;transform:scale(.86);}
.filterSparkle:nth-child(4){left:82%;top:32%;animation-delay:-3.3s;transform:scale(.62);}
.filterSparkle:nth-child(5){left:92%;top:76%;animation-delay:-1.0s;transform:scale(.78);}

@keyframes filterSparkleFloat{
  0%,100%{opacity:.18; transform:translateY(calc(4px * var(--ui-scale))) scale(.68);}
  45%{opacity:.74; transform:translateY(calc(-6px * var(--ui-scale))) scale(1);}
  70%{opacity:.36; transform:translateY(calc(-2px * var(--ui-scale))) scale(.82);}
}

.filterHead{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:calc(8px * var(--ui-scale));
  color:#7a5537;
  font-size:calc(10px * var(--ui-scale));
  font-weight:900;
  line-height:1.2;
  margin-bottom:calc(6px * var(--ui-scale));
}

.filterTitle{
  display:inline-flex;
  align-items:center;
  gap:calc(5px * var(--ui-scale));
  white-space:nowrap;
}

.filterTitle::before{
  content:"✦";
  color:rgba(196,132,62,.76);
  font-size:calc(11px * var(--ui-scale));
  animation:filterStarPulse 2.4s ease-in-out infinite;
}

@keyframes filterStarPulse{
  0%,100%{opacity:.42; transform:scale(.86) rotate(0deg);}
  50%{opacity:.92; transform:scale(1.12) rotate(12deg);}
}

.filterCount{
  color:#9a7659;
  font-size:calc(9px * var(--ui-scale));
  white-space:nowrap;
}

.sourceFilterTags{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:calc(6px * var(--ui-scale));
}

.sourceFilterBtn{
  appearance:none;
  cursor:pointer;
  border:1px solid rgba(201,140,79,.18);
  min-height:calc(24px * var(--ui-scale));
  padding:0 calc(10px * var(--ui-scale));
  border-radius:999px;
  background:rgba(255,248,238,.62);
  color:#795334;
  font-size:calc(10px * var(--ui-scale));
  font-weight:900;
  white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72);
  transition:transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease;
}

.sourceFilterBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,243,224,.82);
  border-color:rgba(190,126,62,.28);
}

.sourceFilterBtn.active{
  color:#fffaf3;
  background:#b97a43;
  border-color:rgba(158,96,44,.36);
  box-shadow:0 calc(4px * var(--ui-scale)) calc(10px * var(--ui-scale)) rgba(142,89,41,.12);
}

.honorSummaryBox{
  min-height:calc(58px * var(--ui-scale));
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:calc(6px * var(--ui-scale));
  padding:calc(11px * var(--ui-scale));
  align-content:center;
}

.honorClaimBox{
  min-height:calc(58px * var(--ui-scale));
  padding:calc(11px * var(--ui-scale));
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:calc(6px * var(--ui-scale));
}


.mineTools .honorSummaryBox,
.mineTools .honorClaimBox{
  width:100%;
  flex:none;
}

.mineTools .honorSummaryBox{
  min-height:calc(54px * var(--ui-scale));
}

.mineTools .honorClaimBox{
  min-height:calc(52px * var(--ui-scale));
}


.summaryCell{
  min-width:0;
  text-align:center;
  border-radius:calc(13px * var(--ui-scale));
  background:rgba(255,246,231,.58);
  padding:calc(7px * var(--ui-scale)) calc(4px * var(--ui-scale));
}

.summaryNum{
  display:block;
  color:#c27932;
  font-size:calc(20px * var(--ui-scale));
  line-height:1.05;
  font-weight:900;
}

.summaryLabel{
  display:block;
  margin-top:calc(4px * var(--ui-scale));
  color:#92745a;
  font-size:calc(10px * var(--ui-scale));
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.claimAllBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  width:100%;
  min-height:calc(34px * var(--ui-scale));
  border-radius:calc(12px * var(--ui-scale));
  background:#c98c4f;
  color:#fffaf3;
  box-shadow:0 4px 10px rgba(139,89,36,.12);
  font-size:calc(12px * var(--ui-scale));
  font-weight:900;
  white-space:nowrap;
  transition:transform .16s ease, background .16s ease, box-shadow .16s ease;
}

.claimAllBtn:hover:not(:disabled){
  background:#b9793f;
  transform:translateY(-1px);
}

.claimAllBtn:disabled{
  cursor:default;
  background:rgba(239,219,190,.88);
  color:#7a5a3b;
  box-shadow:none;
}

.claimHint{
  color:#92745a;
  font-size:calc(10px * var(--ui-scale));
  line-height:1.35;
  font-weight:800;
  text-align:center;
}

.honorBody{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(calc(320px * var(--ui-scale)), .46fr);
  gap:calc(10px * var(--ui-scale));
}

.honorMain,
.honorMine{
  min-width:0;
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.panelHead{
  flex:0 0 auto;
  min-height:calc(48px * var(--ui-scale));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:calc(10px * var(--ui-scale));
  padding:calc(10px * var(--ui-scale)) calc(12px * var(--ui-scale));
  border-bottom:1px dashed rgba(170,117,62,.20);
}

.panelTitle{
  margin:0;
  color:#6f4726;
  font-size:calc(16px * var(--ui-scale));
  line-height:1.2;
  font-weight:900;
  white-space:nowrap;
}

.tabGroup{
  display:flex;
  align-items:center;
  gap:calc(6px * var(--ui-scale));
  padding:calc(3px * var(--ui-scale));
  border-radius:999px;
  background:rgba(255,252,247,.46);
  border:1px solid rgba(255,255,255,.50);
}

.tabBtn{
  appearance:none;
  border:1px solid transparent;
  border-radius:999px;
  min-height:calc(28px * var(--ui-scale));
  padding:0 calc(11px * var(--ui-scale));
  cursor:pointer;
  color:#7b583a;
  font-size:calc(12px * var(--ui-scale));
  font-weight:900;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
}

.tabBtn:hover{background:rgba(255,248,238,.68);}

.tabBtn.active{
  color:#704622;
  background:rgba(255,244,226,.90);
  border-color:rgba(201,140,79,.18);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.75),
    0 3px 8px rgba(135,86,40,.08);
}

.honorList{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding:calc(12px * var(--ui-scale));
  display:none;
  flex-direction:column;
  gap:calc(9px * var(--ui-scale));
}

.honorList.active{display:flex;}

.honorCard{
  position:relative;
  flex:0 0 auto;
  min-width:0;

function isTinyScreen(){
  return window.innerWidth <= 540;

function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";
  root.style.setProperty("--bg-ui-scale","1");

  if(roomNav){
    roomNav.style.transform = "";
  }
}

function syncOverlayToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.34, Math.min(3.2, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));

  requestAnimationFrame(fitRoomNavToBar);
}

function fitRoomNavToBar(){
  if(!roomNav || !topBar || isTinyScreen()) return;

  roomNav.style.transform = "scale(1)";

  const availableWidth = topBar.clientWidth;
  const neededWidth = roomNav.scrollWidth;

  if(!availableWidth || !neededWidth) return;

  const fitScale = Math.min(1, availableWidth / neededWidth);
  roomNav.style.transform = `scale(${fitScale})`;
}

    const note = String(row.note || "");

    /*
      gold_ledger.related_id 是 uuid，荣誉 id 是 bigint，
      因此领取 RPC 会把 achievement_id/title_id 写进 note 作为稳定标记。
      这里必须优先按 note marker 判断，否则刷新后会误判成“仍可领取”。
    */
    if(category === "honor" && subcategory === expectedSubcategory && relatedTable === expectedTable && note.includes(marker)){
      return true;
    }

    /* 兼容以后如果 related_id 改成可存荣誉 id 的版本。 */
    return relatedTable === expectedTable && relatedId === normalizedId && category === "honor";
  });
}

function readLocalAuth(){

  authState.role = String(localStorage.getItem(STORAGE_KEYS.role) || "visitor").toLowerCase();
  authState.memberId = localStorage.getItem(STORAGE_KEYS.memberId) || null;
  authState.memberCode = localStorage.getItem(STORAGE_KEYS.memberCode) || "";

  return authState.loggedIn && !!authState.nickname;
}

  if(!currentUserText || !loginOpenBtn || !logoutBtn) return;

  if(!loggedIn){
    currentUserText.textContent = "参观者";

    logoutBtn.classList.add("hidden");
    return;
  }

  currentUserText.textContent = `${authState.nickname} | ${roleLabel(authState.role)}`;
  loginOpenBtn.classList.add("hidden");
  logoutBtn.classList.remove("hidden");

function handleLogout(){
  localStorage.removeItem(STORAGE_KEYS.loggedIn);
  localStorage.removeItem(STORAGE_KEYS.user);
  localStorage.removeItem(STORAGE_KEYS.role);
  localStorage.removeItem(STORAGE_KEYS.memberId);
  localStorage.removeItem(STORAGE_KEYS.memberCode);

  localStorage.removeItem("room10_user");
  localStorage.removeItem("room10_current_user");
  localStorage.removeItem("currentUser");

  currentMember = null;
  updateIdentity();
  loadHonorData();
  showToast("已退出登录");
}

  if(role === "admin") return "manager-admin.html";
  if(role === "member") return "manager-member.html";

function enterRoom(page, needLogin){

function normalizeSourceKey(raw){
  const value = String(raw || "").trim().toLowerCase();
  if(!value) return "";

  if(["flower","flowers","flower_room","flower_market","花房","花房区"].includes(value)) return "flower";
  if(["face","face_match","face-match","facematch","face_game","face_match_game","脸萌","脸萌匹配","脸萌挑战"].includes(value)) return "face_match";
  if(["bomb","number_bomb","digital_bomb","bomb_game","number-bomb","拆弹","拆弹专家","数字炸弹"].includes(value)) return "number_bomb";
  if(["game","games","game_room","gamehouse","游戏房"].includes(value)) return "game";
  if(["pet","pets","pet_room","宠物","宠物区"].includes(value)) return "pet";
  if(["honor","honor_wall","ranking","rank","荣誉墙"].includes(value)) return "honor";
  if(["studio","work","project","song","工作间"].includes(value)) return "studio";
  return value;
}

function inferSourceKey(item){
  const candidates = [
    item?.source_group,
    item?.category,
    item?.requirement_key,
    item?.code
  ].map(value => String(value || "").toLowerCase());

  const joined = candidates.join(" ");

  if(joined.includes("flower")) return "flower";
  if(joined.includes("face")) return "face_match";
  if(joined.includes("number_bomb") || joined.includes("digital_bomb") || joined.includes("bomb")) return "number_bomb";
  if(joined.includes("pet")) return "pet";
  if(joined.includes("honor") || joined.includes("rank")) return "honor";
  if(joined.includes("studio") || joined.includes("song") || joined.includes("project")) return "studio";
  if(joined.includes("game")) return "game";

  return normalizeSourceKey(item?.source_group || item?.category) || "other";
}

function sourceLabel(key){
  const map = {
    all:"全部",
    honor:"荣誉墙",
    game:"游戏房",
    face_match:"脸萌挑战",
    number_bomb:"拆弹专家",
    flower:"花房区",
    pet:"宠物区",
    studio:"工作间",
    other:"其他"
  };
  return map[key] || key;
}

function sourceSortIndex(key){
  const order = ["all","honor","game","face_match","number_bomb","flower","pet","studio","other"];
  const idx = order.indexOf(key);
  return idx >= 0 ? idx : 999;
}

function sourceMatches(item){
  return activeSourceFilter === "all" || item.sourceKey === activeSourceFilter;
}

function filteredRows(rows){
  return Array.isArray(rows) ? rows.filter(sourceMatches) : [];
}

function updateSourceFilterOptions(){
  const countMap = new Map();
  const allRows = [
    ...communityAchievementRows,
    ...communityTitleRows
  ];

  allRows.forEach(item => {
    const key = item.sourceKey || "other";
    countMap.set(key, (countMap.get(key) || 0) + 1);
  });

  const options = Array.from(countMap.entries())
    .map(([key,count]) => ({ key, label:sourceLabel(key), count }))
    .sort((a,b) => sourceSortIndex(a.key) - sourceSortIndex(b.key) || a.label.localeCompare(b.label,"zh-Hans-CN"));

  const total = allRows.length;
  sourceFilterOptions = [{ key:"all", label:"全部", count:total }, ...options];

  if(activeSourceFilter !== "all" && !countMap.has(activeSourceFilter)){
    activeSourceFilter = "all";
  }
}

function renderSourceFilters(){
  updateSourceFilterOptions();

  const wrap = document.getElementById("sourceFilterTags");
  const count = document.getElementById("sourceFilterCount");
  if(!wrap) return;

  wrap.innerHTML = sourceFilterOptions.map(option => `
    <button class="sourceFilterBtn ${option.key === activeSourceFilter ? "active" : ""}" type="button" data-source-filter="${escapeHtml(option.key)}">
      ${escapeHtml(option.label)}
    </button>
  `).join("");

  if(count){
    const current = sourceFilterOptions.find(option => option.key === activeSourceFilter) || sourceFilterOptions[0];
    count.textContent = `${current.label} ${numberValue(current.count)} 项`;
  }
}

function buildCommunityAchievements(achievements,records,memberMap){
  const countMap = new Map();

  records.forEach(row => {
    const key = String(row.achievement_id || "");
    if(!key) return;
    if(!countMap.has(key)) countMap.set(key,new Set());
    countMap.get(key).add(String(row.member_id || ""));
  });

  return achievements.map(item => {
    const obtainedSet = countMap.get(String(item.id)) || new Set();
    const obtainedCount = obtainedSet.size || 0;
    const unlockedNames = Array.from(obtainedSet)
      .map(memberId => memberMap?.get(String(memberId))?.nickname || "")
      .filter(Boolean);
    const isUnrevealed = obtainedCount <= 0 && numberValue(item.requirement_value) > 1;

    return {
      id:item.id,
      code:item.code,
      condition:item.description || "未填写达成条件",
      stageName:isUnrevealed ? "？？？" : (item.name || "未命名阶段"),
      progress:obtainedCount,
      total:totalMemberCount,
      rewardGold:numberValue(item.reward_gold),
      sourceKey:inferSourceKey(item),
      status:obtainedCount > 0 ? "已解锁" : "未公开",
      unlockedNames,
      requirement_key:item.requirement_key,
      requirement_value:item.requirement_value
    };
  });
}

function buildCommunityTitles(titles,records,memberMap){
  const countMap = new Map();

  records.forEach(row => {
    const key = String(row.title_id || "");
    if(!key) return;
    if(!countMap.has(key)) countMap.set(key,new Set());
    countMap.get(key).add(String(row.member_id || ""));
  });

  return titles.map(item => {
    const obtainedSet = countMap.get(String(item.id)) || new Set();
    const unlockedNames = Array.from(obtainedSet)
      .map(memberId => memberMap?.get(String(memberId))?.nickname || "")
      .filter(Boolean);

    return {
    id:item.id,
    code:item.code,
    name:item.name || "未命名称号",
    condition:item.description || "未填写获得条件",
    obtainedCount:obtainedSet.size || 0,
    unlockedNames,
    rewardGold:numberValue(item.reward_gold),
    sourceKey:inferSourceKey(item),
    requirement_key:item.requirement_key,
    requirement_value:item.requirement_value
  };
  });
}

function buildMyAchievements(achievements,records,memberId){
  if(!memberId) return [];

  const obtainedIds = new Set(
    records
      .filter(row => String(row.member_id) === String(memberId))
      .map(row => String(row.achievement_id))
  );

  const obtained = achievements.filter(item => obtainedIds.has(String(item.id)));
  const grouped = new Map();

  obtained.forEach(item => {
    const key = groupKeyFromHonor(item);
    const prev = grouped.get(key);

    if(!prev || numberValue(item.requirement_value) > numberValue(prev.requirement_value)){
      grouped.set(key,item);
    }
  });

  return Array.from(grouped.values())
    .sort(byRequirementValueDesc)
    .map(item => ({
      id:item.id,
      code:item.code,
      stageName:item.name || "未命名阶段",
      condition:item.description || "未填写达成条件",
      rewardGold:numberValue(item.reward_gold),
      sourceKey:inferSourceKey(item),
      claimed:isHonorRewardClaimed("achievement",item.id),
      requirement_key:item.requirement_key,
      requirement_value:item.requirement_value
    }));
}

function buildMyTitles(titles,records,memberId){
  if(!memberId) return [];

  const obtainedIds = new Set(
    records
      .filter(row => String(row.member_id) === String(memberId))
      .map(row => String(row.title_id))
  );

  return titles
    .filter(item => obtainedIds.has(String(item.id)))
    .sort(byRequirementValueDesc)
    .map(item => ({
      id:item.id,
      code:item.code,
      name:item.name || "未命名称号",
      condition:item.description || "未填写获得条件",
      rewardGold:numberValue(item.reward_gold),
      sourceKey:inferSourceKey(item),
      claimed:isHonorRewardClaimed("title",item.id),
      requirement_key:item.requirement_key,
      requirement_value:item.requirement_value
    }));
}

async function loadHonorData(){
  updateIdentity();

  setListMessage("communityAchievements","正在读取共同成就……");
  setListMessage("communityTitles","正在读取共同称号……");
  setListMessage("myAchievements",readLocalAuth() ? "正在读取我的成就……" : "登录后查看我的成就。");
  setListMessage("myTitles",readLocalAuth() ? "正在读取我的称号……" : "登录后查看我的称号。");

  try{
    currentMember = await fetchCurrentMember();
    updateIdentity();

    const [
      memberCount,
      memberRows,
      achievements,
      titles,
      achievementRecords,
      titleRecords,
      rewardLedger
    ] = await Promise.all([
      fetchTotalMembers(),
      fetchMemberRows(),
      fetchAchievementRows(),
      fetchTitleRows(),
      fetchAchievementRecords(),
      fetchTitleRecords(),
      fetchHonorRewardLedger(currentMember?.id || authState.memberId)
    ]);

    totalMemberCount = memberCount || 0;
    membersById = new Map((memberRows || []).map(member => [String(member.id), member]));
    honorRewardLedger = rewardLedger;

    communityAchievementRows = buildCommunityAchievements(achievements,achievementRecords,membersById);
    communityTitleRows = buildCommunityTitles(titles,titleRecords,membersById);
    myAchievementRows = buildMyAchievements(achievements,achievementRecords,currentMember?.id || authState.memberId);
    myTitleRows = buildMyTitles(titles,titleRecords,currentMember?.id || authState.memberId);

    renderAll();
  }catch(error){
    console.error(error);
    setListMessage("communityAchievements",`共同成就读取失败：${error.message || "请检查 achievements / member_achievements 权限。"}`,true);

    setListMessage("myTitles","我的称号读取失败。",true);
    renderSummary();
  }

function pendingRewardGold(){
  return pendingHonorRewardItems.reduce((sum,item) => sum + numberValue(item.rewardGold), 0);
}

function refreshPendingRewards(){
  pendingHonorRewardItems = [];

  if(readLocalAuth()){
    myAchievementRows.forEach(item => {
      if(!item.claimed && numberValue(item.rewardGold) > 0){
        pendingHonorRewardItems.push({ itemType:"achievement", itemId:item.id, rewardGold:item.rewardGold });
      }
    });

    myTitleRows.forEach(item => {
      if(!item.claimed && numberValue(item.rewardGold) > 0){
        pendingHonorRewardItems.push({ itemType:"title", itemId:item.id, rewardGold:item.rewardGold });
      }
    });
  }

  const count = pendingHonorRewardItems.length;
  const gold = pendingRewardGold();

  if(!readLocalAuth()){
    claimAllBtn.disabled = true;
    claimHint.textContent = "登录后查看";
    return;
  }

  if(count <= 0){
    claimAllBtn.disabled = true;
    claimHint.textContent = "暂无可领取";
    return;
  }

  claimAllBtn.disabled = false;
  claimHint.textContent = `${count} 项｜${gold} 金币`;
}

function renderSummary(){
  const loggedIn = readLocalAuth();

  document.getElementById("summaryAchievements").textContent = loggedIn ? myAchievementRows.length : 0;
  document.getElementById("summaryTitles").textContent = loggedIn ? myTitleRows.length : 0;
  document.getElementById("summaryGold").textContent = loggedIn ? pendingRewardGold() : 0;

  refreshPendingRewards();
}

      <div class="cardTop">
        <div class="cardText">
          <h3 class="cardTitle">${escapeHtml(item.name)}</h3>
          <p class="cardSub">${escapeHtml(item.condition)}</p>
        </div>
        <span class="cardBadge">${rewardBadgeText(item)}</span>
      </div>

      ${rewardMetaHtml(item)}

      ${rewardActionHtml("title",item)}
    </article>
  `).join("");
}

function renderAll(){
  refreshPendingRewards();
  renderSourceFilters();
  renderSummary();
  renderCommunityAchievements();
  renderCommunityTitles();
  renderMyAchievements();
  renderMyTitles();
  refreshPendingRewards();
}

/* =========================================================
   领取奖励：需要数据库 RPC，避免前端直接写金币
========================================================= */
async function claimOneHonorReward(itemType,itemId){
  if(!readLocalAuth() || !authState.memberId || !authState.memberCode){
    showToast("请先登录后领取奖励");
    return;
  }

  try{
    const { data,error } = await supabaseClient.rpc("claim_honor_reward",{
      p_member_id:authState.memberId,
      p_member_code:authState.memberCode,
      p_item_type:itemType,
      p_item_id:itemId
    });

    if(error) throw error;

    const result = Array.isArray(data) ? data[0] : data;
    if(result && result.ok === false){
      showToast(result.message || "奖励领取失败");
      return;
    }

    showToast(result?.message || "奖励已领取");
    await loadHonorData();
  }catch(error){
    console.error(error);
    showToast("领取失败：请确认 claim_honor_reward RPC 已创建");
  }
}

async function claimAllHonorRewards(){
  if(!readLocalAuth() || !authState.memberId || !authState.memberCode){
    showToast("请先登录后领取奖励");
    return;
  }

  if(!pendingHonorRewardItems.length){
    showToast("暂无可领取奖励");
    return;
  }

  claimAllBtn.disabled = true;
  claimHint.textContent = "领取中……";

  try{
    const { data,error } = await supabaseClient.rpc("claim_all_honor_rewards",{
      p_member_id:authState.memberId,
      p_member_code:authState.memberCode
    });

    if(error) throw error;

    const result = Array.isArray(data) ? data[0] : data;
    if(result && result.ok === false){
      showToast(result.message || "一键领取失败");
      await loadHonorData();
      return;
    }

    const count = numberValue(result?.claimed_count);
    const gold = numberValue(result?.total_gold);
    showToast(result?.message || `已领取 ${count} 项奖励，共 ${gold} 金币`);
    await loadHonorData();
  }catch(error){
    console.error(error);
    showToast("一键领取失败：请确认 claim_all_honor_rewards RPC 已创建");
    await loadHonorData();
  }
}

/* =========================================================
   页面交互
========================================================= */
function switchTab(btn){
  const group = btn.dataset.tabGroup;
  const target = btn.dataset.target;

  if(!group || !target) return;

  document.querySelectorAll(`.tabBtn[data-tab-group="${group}"]`).forEach(item => {
    item.classList.toggle("active", item === btn);
  });

  const ids = group === "community"
    ? ["communityAchievements","communityTitles"]
    : ["myAchievements","myTitles"];

  ids.forEach(id => {
    const panel = document.getElementById(id);
    if(panel) panel.classList.toggle("active", id === target);
  });
}

function bindEvents(){
  window.addEventListener("resize", syncOverlayToImage);

  document.querySelectorAll(".tabBtn").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn));
  });

  document.addEventListener("click", event => {
    const filterBtn = event.target.closest("[data-source-filter]");
    if(filterBtn){
      activeSourceFilter = filterBtn.dataset.sourceFilter || "all";
      renderAll();
      return;
    }

    const claimBtn = event.target.closest("[data-claim-type][data-claim-id]");
    if(claimBtn && !claimBtn.disabled){
      claimOneHonorReward(claimBtn.dataset.claimType,claimBtn.dataset.claimId);
      return;
    }
  });

  if(claimAllBtn){
    claimAllBtn.addEventListener("click", claimAllHonorRewards);
  }

  if(siteNoticeBtn){
    siteNoticeBtn.addEventListener("click", event => {
      event.stopPropagation();
      showToast(readLocalAuth() ? "荣誉通知后续接入这里。" : "登录后查看个人通知。");
    });
  }

  if(loginOpenBtn){
    loginOpenBtn.addEventListener("click", event => {
      event.stopPropagation();
      window.location.href = "index.html";
    });
  }

  if(logoutBtn){
    logoutBtn.addEventListener("click", event => {
      event.stopPropagation();
      handleLogout();
    });
  }
}

async function initHonorPage(){
  updateIdentity();
  bindEvents();
  renderAll();
  syncOverlayToImage();
  await loadHonorData();
}

document.addEventListener("DOMContentLoaded", initHonorPage);

window.addEventListener("storage", event => {
  if(
    event.key === STORAGE_KEYS.loggedIn ||
    event.key === STORAGE_KEYS.user ||
    event.key === STORAGE_KEYS.role ||
    event.key === STORAGE_KEYS.memberId
  ){
    updateIdentity();
    loadHonorData();
  }
});

if(img && img.complete && img.naturalWidth){
  syncOverlayToImage();
}else if(img){
  img.addEventListener("load", syncOverlayToImage, { once:true });
}

setTimeout(syncOverlayToImage, 120);
</script>
