<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小游戏｜游戏房</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
}

:root{
  --bg-left:#fff3e7;
  --bg-right:#f4dfc8;
  --bg-top:#fff7ef;
  --bg-bottom:#edd8c1;
  --panel-bg:rgba(255,255,255,0.34);
  --panel-border:rgba(255,255,255,0.62);
  --panel-shadow:rgba(112,78,45,0.16);
  --text-main:#7a5030;
  --btn-bg:rgba(255,252,248,0.82);
  --btn-border:rgba(255,255,255,0.92);
  --btn-shadow:rgba(129,90,54,0.16);

  --bg-ui-scale:1;

  /* 当前页面坐标：游戏房页只改这里 */
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-width:calc(232px * var(--bg-ui-scale));
  --identity-height:calc(38px * var(--bg-ui-scale));

  --room-nav-left:27.2%;
  --room-nav-top:6.35%;
  --room-nav-width:45.5%;

  /* 页面可改颜色，不改结构尺寸 */
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);

  --nav-text:#6e4827;
  --nav-border:rgba(145,98,56,.34);
}

body{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at center, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text-main);
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

#bgColorFill{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    linear-gradient(180deg, var(--bg-top) 0%, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, var(--bg-bottom) 100%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
}

#bgBleed{
  position:fixed;
  inset:-8vh -8vw;
  z-index:1;
  background:url("room-game.png") center center / cover no-repeat;
  filter:blur(30px) saturate(1.05);
  transform:scale(1.08);
  opacity:.72;
  pointer-events:none;
}

#bgLight{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0) 58%),
    linear-gradient(180deg, rgba(255,248,240,0.08), rgba(255,248,240,0.08));
}

#room{
  position:relative;
  z-index:3;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:transparent;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

#overlay{
  position:absolute;
  z-index:1;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{
  pointer-events:auto;
}

.panel{
  position:absolute;
  left:48.8%;
  top:50%;
  transform:translate(-50%,-50%);
  width:57%;
  max-width:820px;
  padding:calc(38px * var(--ui-scale));
  border-radius:calc(30px * var(--ui-scale));
  background:var(--panel-bg);
  border:1.5px solid var(--panel-border);
  box-shadow:
    0 12px 36px var(--panel-shadow),
    inset 0 1px 0 rgba(255,255,255,0.72),
    inset 0 0 28px rgba(255,255,255,0.10);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  text-align:center;
}

.title{
  margin:0 0 calc(30px * var(--ui-scale));
  color:var(--text-main);
  font-size:clamp(28px, calc(44px * var(--ui-scale)), 50px);
  font-weight:800;
  letter-spacing:1px;
  text-shadow:0 1px 0 rgba(255,255,255,0.35);
}

.menu{
  display:grid;
  grid-template-columns:1fr;
  gap:calc(18px * var(--ui-scale));
}

.game-btn{
  appearance:none;
  border:none;
  cursor:pointer;
  width:100%;
  min-height:calc(150px * var(--ui-scale));
  border-radius:calc(24px * var(--ui-scale));
  padding:calc(18px * var(--ui-scale));
  text-decoration:none;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:var(--btn-bg);
  border:1.5px solid var(--btn-border);
  box-shadow:
    0 8px 22px var(--btn-shadow),
    inset 0 1px 0 rgba(255,255,255,0.92);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease,
    border-color .18s ease;
  font-family:inherit;
}

.game-btn:hover{
  transform:translateY(-3px);
  background:rgba(255,252,248,0.92);
  box-shadow:
    0 12px 28px rgba(129,90,54,0.22),
    inset 0 1px 0 rgba(255,255,255,0.96);
  border-color:rgba(255,255,255,1);
}

.game-btn:active{
  transform:translateY(0);
}

.game-name{
  color:#744a2a;
  font-size:clamp(22px, calc(28px * var(--ui-scale)), 34px);
  font-weight:800;
  line-height:1.2;
  margin-bottom:10px;
}

.game-desc{
  color:#8a6547;
  font-size:clamp(13px, calc(16px * var(--ui-scale)), 18px);
  line-height:1.55;
  max-width:22em;
}

/* =========================================================
   身份组件：全站统一结构
========================================================= */
#topActions{
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:var(--identity-width);
  height:var(--identity-height);
  min-width:0;
  min-height:0;
  z-index:65;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:var(--identity-bg);
  border:1px solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--ui-scale)) calc(24px * var(--ui-scale)) var(--identity-shadow),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:1;
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
  white-space:nowrap;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  display:block;
  line-height:1;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--ui-scale));
  top:calc(-6px * var(--ui-scale));
  min-width:calc(18px * var(--ui-scale));
  height:calc(18px * var(--ui-scale));
  padding:0 calc(5px * var(--ui-scale));
  border-radius:999px;
  background:#c98c4f;
  color:#fff9f1;
  font-size:calc(9px * var(--ui-scale));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--ui-scale)) solid rgba(255,248,239,0.98);
  box-shadow:0 2px 8px rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice #siteNoticeCount{
  display:flex;
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:min(calc(360px * var(--ui-scale)), 72vw);
  max-height:min(calc(540px * var(--ui-scale)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  background:rgba(255,249,241,0.98);
  border:1px solid rgba(203,167,123,0.28);
  box-shadow:0 16px 36px rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

#siteNoticePanel.show{
  display:block;
}

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--ui-scale));
  font-weight:900;
  margin-bottom:calc(10px * var(--ui-scale));
}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--ui-scale));
  line-height:1.6;
  padding:6px 2px 2px;
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--ui-scale));
}

.siteNoticeItem{
  padding:calc(10px * var(--ui-scale));
  border-radius:calc(12px * var(--ui-scale));
  background:rgba(255,252,247,0.82);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.92),
    0 2px 8px rgba(120,92,63,0.05);
}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1.5;
  margin-bottom:4px;
}

.siteNoticeItemDesc{
  color:#8a6644;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.55;
}

/* =========================================================
   房间切换按钮：游戏房页不显示“游戏房”按钮
========================================================= */
#topBar{
  position:absolute;
  left:var(--room-nav-left);
  top:var(--room-nav-top);
  width:var(--room-nav-width);
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:55;
  overflow:visible;
  pointer-events:none;

  --nav-btn-height:calc(40px * var(--ui-scale));
  --nav-btn-px:calc(16px * var(--ui-scale));
  --nav-btn-radius:calc(13px * var(--ui-scale));
  --nav-btn-font:calc(14px * var(--ui-scale));
  --nav-gap:calc(8px * var(--ui-scale));
}

#navOuter,
#navScroll{
  overflow:visible !important;
}

#navOuter{
  flex:0 0 auto;
  min-width:0;
  width:100%;
  pointer-events:auto;
}

#navScroll{
  width:100%;
  white-space:nowrap;
  padding:0 !important;
  margin:0 !important;
}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap);
  transform-origin:left center;
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height);
  padding:0 var(--nav-btn-px);
  border-radius:var(--nav-btn-radius);
  color:var(--nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  line-height:1;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid var(--nav-border);
  box-shadow:
    0 1px 1px rgba(255,255,255,.48) inset,
    0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease,
    filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:
    linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:
    0 1px 1px rgba(255,255,255,.55) inset,
    0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{
  position:relative;
  z-index:5;
  display:block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 1px 2px rgba(255,250,232,.82),
    0 0 8px rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{
  left:8%;
  top:-54%;
  font-size:calc(var(--nav-btn-font) * .92);
}

.navEffectB{
  right:8%;
  top:-62%;
  font-size:calc(var(--nav-btn-font) * .86);
}

.navEffectC{
  left:50%;
  top:-72%;
  transform:translateX(-50%);
  font-size:calc(var(--nav-btn-font) * 1.02);
}

@keyframes navFloatA{
  0%,100%{ transform:translateY(4px) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(-5px) rotate(6deg) scale(1); opacity:.76; }
}

@keyframes navFloatB{
  0%,100%{ transform:translateY(5px) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(-6px) rotate(-7deg) scale(1); opacity:.68; }
}

@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(6px) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(-6px) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:hover .navEffectA,
.navBtn:focus-visible .navEffectA{
  animation:navFloatA 2.2s ease-in-out infinite;
}

.navBtn:hover .navEffectB,
.navBtn:focus-visible .navEffectB{
  animation:navFloatB 2.5s ease-in-out infinite;
}

.navBtn:hover .navEffectC,
.navBtn:focus-visible .navEffectC{
  animation:navFloatC 2.35s ease-in-out infinite;
}

/* 各房间特效颜色 */
.navBtn[data-room="hall"] .navEffect{
  color:rgba(255,205,96,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.95),
    0 0 10px rgba(255,215,105,.62);
}

.navBtn[data-room="manager"] .navEffect{
  color:rgba(128,91,58,.82);
}

.navBtn[data-room="honor"] .navEffect{
  color:rgba(205,143,45,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.92),
    0 0 8px rgba(255,220,130,.52);
}

.navBtn[data-room="studio"] .navEffect{
  color:rgba(96,112,145,.84);
}

.navBtn[data-room="living"] .navEffect{
  color:rgba(202,132,70,.82);
}

.navBtn[data-room="dorm"] .navEffect{
  color:rgba(143,111,168,.76);
}

.navBtn[data-room="pets"] .navEffect{
  color:rgba(131,111,78,.82);
}

.navBtn[data-room="flower"] .navEffect{
  color:rgba(198,119,145,.82);
}

/* =========================================================
   登录弹窗：引用首页登录框
========================================================= */
.login-mask,
.game-modal-mask{
  position:fixed;
  inset:0;
  z-index:90;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(76,48,27,.24);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.login-panel{
  position:relative;
  width:min(720px, 94vw);
}

.login-panel img{
  width:100%;
  display:block;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

#loginNickname{
  position:absolute;
  top:40%;
  left:36.2%;
  width:27.5%;
  height:8.1%;
  border:none;
  outline:none;
  padding:0 10px;
  font-size:18px;
  color:#5b3e28;
  background:transparent;
  line-height:1.1;
}

#loginCode{
  position:absolute;
  top:56%;
  left:36.2%;
  width:20%;
  height:8.1%;
  border:none;
  outline:none;
  padding:0 10px;
  font-size:18px;
  color:#5b3e28;
  background:transparent;
  line-height:1.1;
}

#toggleLoginCode{
  position:absolute;
  top:56%;
  left:56%;
  width:8%;
  height:8.1%;
  border:none;
  cursor:pointer;
  background:rgba(255,215,120,.15);
  border-radius:6px;
}

#toggleLoginCode:hover{
  background:rgba(255,215,120,.35);
  box-shadow:0 0 8px rgba(255,220,120,.6);
}

#loginSubmitBtn{
  position:absolute;
  top:68%;
  left:40%;
  width:20%;
  height:9%;
  border:none;
  background:transparent;
  cursor:pointer;
}

#registerLink{
  position:absolute;
  top:50%;
  left:52%;
  transform:translateX(-50%);
  color:#7a4f2b;
  font-size:14px;
  font-weight:600;
  text-decoration:underline;
  cursor:pointer;
  background:none;
  border:none;
  padding:0;
  white-space:nowrap;
}

#registerLink:hover{
  color:#9b6334;
}

#loginHint{
  position:absolute;
  top:34.8%;
  left:53.5%;
  transform:translateX(-50%);
  text-align:center;
  color:#7a4f2b;
  font-size:14px;
  font-weight:600;
  width:42%;
  max-width:320px;
  white-space:normal;
  line-height:1.25;
}

#loginCancelBtn{
  position:absolute;
  top:4px;
  right:6px;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  background:white;
  cursor:pointer;
  font-size:18px;
  color:#5b4632;
}

.game-modal-mask{
  z-index:95;
  background:rgba(60,42,23,0.28);
}

.game-modal-box{
  position:relative;
  width:min(1180px, 96vw);
  height:min(860px, 92vh);
  border-radius:24px;
  overflow:hidden;
  background:rgba(255,249,241,0.98);
  border:1px solid rgba(203,167,123,0.28);
  box-shadow:0 20px 48px rgba(85,58,34,0.22);
}

.game-modal-close{
  position:absolute;
  top:clamp(8px, 1.35vw, 16px);
  right:clamp(9px, 1.5vw, 18px);
  z-index:2;
  min-width:clamp(46px, 6.3vw, 74px);
  height:clamp(24px, 3.2vw, 34px);
  border:none;
  border-radius:clamp(8px, 1.05vw, 12px);
  background:linear-gradient(180deg, #efd5ab 0%, #dfbd8a 100%);
  color:#6a4120;
  font-size:clamp(10px, 1.15vw, 13px);
  font-weight:800;
  cursor:pointer;

<script>
const supabaseUrl = "https://tfevitwoqmxwaguvtyms.supabase.co";
const supabaseKey = "sb_publishable_0cFYhwx_9uEcrXnMJzzNMQ_cEng8xmI";
const client = window.supabase.createClient(supabaseUrl, supabaseKey);

const img = document.getElementById("bg");
const bgFrame = document.getElementById("bgFrame");
const overlay = document.getElementById("overlay");
const root = document.documentElement;
const fallbackTip = document.getElementById("fallbackTip");
const currentUserText = document.getElementById("currentUserText");
const logoutBtn = document.getElementById("logoutBtn");
const loginOpenBtn = document.getElementById("loginOpenBtn");
const siteNoticeBtn = document.getElementById("siteNoticeBtn");
const siteNoticePanel = document.getElementById("siteNoticePanel");
const siteNoticeCount = document.getElementById("siteNoticeCount");

const roomNav = document.getElementById("roomNav");

const loginNicknameInput = document.getElementById("loginNickname");
const loginCodeInput = document.getElementById("loginCode");
const loginHint = document.getElementById("loginHint");
const gameModalMask = document.getElementById("gameModalMask");
const gameModalFrame = document.getElementById("gameModalFrame");

const PENDING_REDIRECT_KEY = "room10_pending_redirect";

function isTinyScreen(){
  return window.innerWidth <= 540;
}

function syncOverlayToImage(){
  if(isTinyScreen()) return;
  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.34, Math.min(1.42, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));

  requestAnimationFrame(fitRoomNavToBar);
}

function fitRoomNavToBar(){
  if(!roomNav || !topBar || isTinyScreen()) return;

  roomNav.style.transform = "scale(1)";

  const availableWidth = topBar.clientWidth;
  const neededWidth = roomNav.scrollWidth;

  if(!availableWidth || !neededWidth) return;

  const fitScale = Math.min(1, availableWidth / neededWidth);
  roomNav.style.transform = `scale(${fitScale})`;
}

function isLoggedIn(){
  return localStorage.getItem("room10LoggedIn") === "true";
}

function getRole(){
  return localStorage.getItem("room10Role") || "";
}

function getCurrentUser(){
  return localStorage.getItem("room10User") || "";
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getRoleLabel(roleValue = getRole()){
  const role = String(roleValue || "").toLowerCase();
  if(role === "owner") return "维修工";
  if(role === "admin") return "宿管";
  if(role === "member") return "房客";
  if(role === "applying") return "申请中";
  if(isLoggedIn()) return "房客";
  return "参观者";
}

function updateIdentityUI(){
  if(!currentUserText || !logoutBtn || !loginOpenBtn) return;

  if(isLoggedIn()){
    const user = getCurrentUser() || "已登录";
    const roleLabel = getRoleLabel();
    currentUserText.textContent = `${user} | ${roleLabel}`;
    loginOpenBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
    return;
  }

  currentUserText.textContent = "参观者";
  loginOpenBtn.classList.remove("hidden");
  logoutBtn.classList.add("hidden");
}

function logout(){
  localStorage.removeItem("room10LoggedIn");
  localStorage.removeItem("room10User");
  localStorage.removeItem("room10Role");
  localStorage.removeItem("room10MemberId");
  localStorage.removeItem("room10MemberCode");
  localStorage.removeItem("room10ApplicantSession");
  localStorage.removeItem("room10ApplicationDraft");

  localStorage.removeItem("room10_user");
  localStorage.removeItem("room10_current_user");
  localStorage.removeItem("currentUser");

  clearPendingRedirect();
  closeLogin(false);
  updateIdentityUI();
}

function normalizeLoginInput(value){
  return String(value || "")
    .replace(/\u3000/g, " ")
    .trim();
}

function getPendingRedirect(){
  return sessionStorage.getItem(PENDING_REDIRECT_KEY) || "";
}

function setPendingRedirect(page){
  const safePage = String(page || "").trim();
  if(!safePage) return;
  sessionStorage.setItem(PENDING_REDIRECT_KEY, safePage);
}

function clearPendingRedirect(){
  sessionStorage.removeItem(PENDING_REDIRECT_KEY);
}

function goRegisterFromGame(){
  sessionStorage.setItem("room10RegisterReturn", "game.html");
  window.location.href = "register.html?from=game.html";
}

function toggleLoginCode(){
  loginCodeInput.type = loginCodeInput.type === "password" ? "text" : "password";
}

function getManagerPageByRole(roleValue = getRole()){
  const role = String(roleValue || "").toLowerCase();
  if(role === "owner") return "manager-owner.html";
  if(role === "admin") return "manager-admin.html";
  if(role === "member") return "manager-member.html";
  return "manager-visitor.html";
}

function enterManagerRoom(){
  clearPendingRedirect();
  window.location.href = getManagerPageByRole();
}

function enterRoom(page, needLogin){
  const targetPage = String(page || "").trim();
  if(!targetPage) return;

  if(needLogin && !isLoggedIn()){
    openLogin(targetPage);
    return;
  }

  if((targetPage === "flower.html" || targetPage === "pets.html") && !isLoggedIn()){
    clearPendingRedirect();
    window.location.href = targetPage + "?mode=guest";
    return;
  }

  clearPendingRedirect();
  window.location.href = targetPage;
}

function openLogin(targetPage = ""){
  if(isLoggedIn()){
    if(targetPage){
      window.location.href = targetPage;
    }
    return;
  }

  if(targetPage){
    setPendingRedirect(targetPage);
  }

  loginMask.classList.remove("hidden");
  loginMask.setAttribute("aria-hidden", "false");
  loginHint.textContent = "";
  loginHint.style.color = "#8b4a2d";
  setTimeout(() => loginNicknameInput.focus(), 0);
}

function closeLogin(keepRedirect = true){
  loginMask.classList.add("hidden");
  loginMask.setAttribute("aria-hidden", "true");
  loginHint.textContent = "";
  loginNicknameInput.value = "";
  loginCodeInput.value = "";

  if(!keepRedirect){
    clearPendingRedirect();
  }
}

async function submitLogin(){
  const nickname = normalizeLoginInput(loginNicknameInput.value);
  const code = normalizeLoginInput(loginCodeInput.value);

  loginHint.textContent = "";
  loginHint.style.color = "#8b4a2d";

  if(!nickname || !code){
    loginHint.textContent = "还没填写完整呢";
    return;
  }

  try{
    const { data, error } = await client.rpc("verify_member_login", {
      input_nickname: nickname,
      input_code: code
    });

    if(error){
      console.error("KEY 登录失败：", error);
      loginHint.textContent = `登录检查失败：${error.message || "请稍后再试"}`;
      return;
    }

    if(!Array.isArray(data) || data.length === 0){
      loginHint.textContent = "没有找到你的记录哎";
      return;
    }

    const user = data[0] || {};

    localStorage.setItem("room10LoggedIn", "true");
    localStorage.setItem("room10User", user.nickname || nickname);
    localStorage.setItem("room10Role", user.role || "member");
    localStorage.setItem("room10MemberId", user.member_id || user.id || "");

    let roleMessage = "登录成功";
    if(user.role === "owner"){
      roleMessage = "维修工已上线";
    }else if(user.role === "admin"){
      roleMessage = "宿管已上线";
    }else if(user.role === "member"){
      roleMessage = "房客已登录";
    }else if(user.role === "applying"){
      roleMessage = "当前身份为申请中";
    }

    loginHint.style.color = "#5f7d3a";
    loginHint.textContent = roleMessage;
    updateIdentityUI();
    refreshGameNotice();

    setTimeout(() => {
      const targetPage = getPendingRedirect();
      closeLogin(true);

      if(targetPage){
        clearPendingRedirect();
        window.location.href = targetPage;
      }
    }, 700);
  }catch(err){
    console.error("submitLogin() 查询异常：", err);
    loginHint.style.color = "#8b4a2d";
    loginHint.textContent = `登录失败：${err?.message || "请稍后再试"}`;
  }
}

function normalizeGameUrl(url){
  const safeUrl = String(url || "").trim();
  return safeUrl && !/^(javascript|data):/i.test(safeUrl) ? safeUrl : "";
}

function openGameModal(url){
  const safeUrl = normalizeGameUrl(url);
  if(!safeUrl) return;

  closeSiteNoticePanel();

  if(isTinyScreen()){
    window.location.href = safeUrl;
    return;
  }

  const currentUrl = gameModalFrame.getAttribute("data-current-src") || "";
  const modalAlreadyOpen = !gameModalMask.classList.contains("hidden");

  if(modalAlreadyOpen && currentUrl === safeUrl){
    return;
  }

  gameModalFrame.setAttribute("data-current-src", safeUrl);
  gameModalFrame.src = safeUrl;
  gameModalMask.classList.remove("hidden");
  gameModalMask.setAttribute("aria-hidden", "false");
}

function closeGameModal(){
  gameModalMask.classList.add("hidden");
  gameModalMask.setAttribute("aria-hidden", "true");
  gameModalFrame.removeAttribute("data-current-src");
  gameModalFrame.src = "about:blank";
}

function getGameNoticeItems(){
  try{
    const raw = localStorage.getItem("room10GameRecordNotices");
    if(!raw) return [];
    const data = JSON.parse(raw);
    if(!Array.isArray(data)) return [];
    return data
      .map(item => typeof item === "string" ? { title:"游戏记录提醒", desc:item } : {
        title:item?.title || "游戏记录提醒",
        desc:item?.message || item?.desc || ""
      })
      .filter(item => item.desc);
  }catch{
    return [];
  }
}

function setNoticeCount(count){
  const n = Number(count) || 0;
  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);
}

function renderNoticeList(items){
  const list = Array.isArray(items) ? items : [];

  if(!list.length){
    siteNoticeContent.innerHTML = '<div class="siteNoticeEmpty">如果有人超过你的游戏记录，会在这里通知你。</div>';
    setNoticeCount(0);
    return;
  }

  siteNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => `
        <div class="siteNoticeItem">
          <div class="siteNoticeItemTitle">${escapeHtml(item.title || "提醒")}</div>
          <div class="siteNoticeItemDesc">${escapeHtml(item.desc || "")}</div>
        </div>
      `).join("")}
    </div>
  `;

  setNoticeCount(list.length);
}

function refreshGameNotice(){
  renderNoticeList(getGameNoticeItems());
}

function toggleSiteNoticePanel(){
  if(!siteNoticePanel) return;
  refreshGameNotice();
  siteNoticePanel.classList.toggle("show");
}

function closeSiteNoticePanel(){
  if(siteNoticePanel) siteNoticePanel.classList.remove("show");
}

function showTip(message){
  fallbackTip.textContent = message || "操作提示";
  fallbackTip.classList.add("show");
  clearTimeout(showTip._timer);
  showTip._timer = setTimeout(() => fallbackTip.classList.remove("show"), 2600);
}

function clamp(v,min,max){
  return Math.max(min, Math.min(max, v));
}

function avgColor(data){
  let r = 0, g = 0, b = 0, count = 0;
  for(let i=0;i<data.length;i+=4){
    const alpha = data[i+3];
    if(alpha === 0) continue;
    r += data[i];
    g += data[i+1];
    b += data[i+2];
    count++;
  }
  if(!count) return [245, 233, 220];
  return [
    Math.round(r / count),
    Math.round(g / count),
    Math.round(b / count)
  ];
}

function mix(color, target, ratio){
  return [
    Math.round(color[0] * (1 - ratio) + target[0] * ratio),
    Math.round(color[1] * (1 - ratio) + target[1] * ratio),
    Math.round(color[2] * (1 - ratio) + target[2] * ratio)
  ];
}

function rgbToCss(arr){
  return `rgb(${arr[0]}, ${arr[1]}, ${arr[2]})`;
}

function applyEdgeColors(){
  try{
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently:true });
    const w = img.naturalWidth;
    const h = img.naturalHeight;

    if(!w || !h || !ctx) throw new Error("图片尺寸或画布无效");

    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(img, 0, 0, w, h);

    const bandX = Math.max(8, Math.floor(w * 0.03));
    const bandY = Math.max(8, Math.floor(h * 0.03));

    const leftData = ctx.getImageData(0, 0, bandX, h).data;
    const rightData = ctx.getImageData(w - bandX, 0, bandX, h).data;
    const topData = ctx.getImageData(0, 0, w, bandY).data;
    const bottomData = ctx.getImageData(0, h - bandY, w, bandY).data;

    let left = avgColor(leftData);
    let right = avgColor(rightData);
    let top = avgColor(topData);
    let bottom = avgColor(bottomData);

    left = mix(left, [255,255,255], 0.14);
    right = mix(right, [255,255,255], 0.12);
    top = mix(top, [255,255,255], 0.16);
    bottom = mix(bottom, [255,255,255], 0.10);

    left = left.map(v => clamp(v, 120, 255));
    right = right.map(v => clamp(v, 120, 255));
    top = top.map(v => clamp(v, 130, 255));
    bottom = bottom.map(v => clamp(v, 110, 255));

    root.style.setProperty("--bg-left", rgbToCss(left));
    root.style.setProperty("--bg-right", rgbToCss(right));
    root.style.setProperty("--bg-top", rgbToCss(top));
    root.style.setProperty("--bg-bottom", rgbToCss(bottom));
  }catch(err){
    showTip("未能读取图片边缘颜色，已使用默认柔和背景。");
    console.warn("读取底图边缘颜色失败：", err);
  }
}

loginNicknameInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") submitLogin();
});

loginCodeInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") submitLogin();
});

loginMask.addEventListener("click", (e) => {
  if(e.target === loginMask) closeLogin(false);
});

gameModalMask.addEventListener("click", (e) => {
  if(e.target === gameModalMask){
    e.preventDefault();
    e.stopPropagation();
    showTip("请点击右上角“关闭”退出游戏。");
  }
});

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && !gameModalMask.classList.contains("hidden")){
    closeGameModal();
  }
});

siteNoticeBtn.addEventListener("click", event => {
  event.stopPropagation();
  toggleSiteNoticePanel();
});

loginOpenBtn.addEventListener("click", event => {
  event.stopPropagation();
  openLogin();
});

logoutBtn.addEventListener("click", event => {
  event.stopPropagation();
  logout();
});

document.addEventListener("click", (e) => {
  if(!siteNoticePanel || !siteNoticeBtn) return;
  if(siteNoticePanel.contains(e.target) || siteNoticeBtn.contains(e.target)) return;
  closeSiteNoticePanel();
});

window.addEventListener("storage", (e) => {
  if(
    e.key === "room10LoggedIn" ||
    e.key === "room10User" ||
    e.key === "room10Role" ||
    e.key === "room10MemberId"
  ){
    updateIdentityUI();
  }

  if(e.key === "room10GameRecordNotices"){
    refreshGameNotice();
  }
});

window.addEventListener("resize", syncOverlayToImage);

if(img && img.complete && img.naturalWidth){
  syncOverlayToImage();
  applyEdgeColors();
}else if(img){
  img.addEventListener("load", () => {
    syncOverlayToImage();
    applyEdgeColors();
  }, { once:true });
  img.addEventListener("error", () => {
    showTip("未能读取图片边缘颜色，已使用默认柔和背景。");
  }, { once:true });
}

setTimeout(syncOverlayToImage, 120);
updateIdentityUI();
refreshGameNotice();
</script>
