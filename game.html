<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>游戏房｜十号房</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
}

:root{
  --bg-left:#fff3e7;
  --bg-right:#f4dfc8;
  --bg-top:#fff7ef;
  --bg-bottom:#edd8c1;
  --panel-bg:rgba(255,255,255,0.34);
  --panel-border:rgba(255,255,255,0.62);
  --panel-shadow:rgba(112,78,45,0.16);
  --text-main:#7a5030;
  --btn-bg:rgba(255,252,248,0.82);
  --btn-border:rgba(255,255,255,0.92);
  --btn-shadow:rgba(129,90,54,0.16);

  --bg-ui-scale:1;

  /* 当前页面坐标：游戏房页只改这里 */
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-width:calc(232px * var(--bg-ui-scale));
  --identity-height:calc(38px * var(--bg-ui-scale));

  --room-nav-left:27.2%;
  --room-nav-top:6.35%;
  --room-nav-width:45.5%;

  --game-panel-left:45%;
  --game-panel-top:47.4%;
  --game-panel-width:48%;
  --game-panel-design-width:690;
  --game-panel-scale:1;
  --game-panel-max-width:none;
  --game-panel-padding:26px;
  --game-panel-radius:28px;
  --game-card-height:112px;
  --game-card-radius:21px;
  --game-card-padding:15px;
  --game-name-size:24px;
  --game-status-size:12px;

  /* 页面可改颜色，不改结构尺寸 */
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);

  --nav-text:#6e4827;
  --nav-border:rgba(145,98,56,.34);
}

body{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at center, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text-main);
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

#bgColorFill{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    linear-gradient(180deg, var(--bg-top) 0%, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, var(--bg-bottom) 100%),
    linear-gradient(90deg, var(--bg-left) 0%, var(--bg-right) 100%);
}

#bgBleed{
  position:fixed;
  inset:-8vh -8vw;
  z-index:1;
  background:url("room-game.png") center center / cover no-repeat;
  filter:blur(30px) saturate(1.05);
  transform:scale(1.08);
  opacity:.72;
  pointer-events:none;
}

#bgLight{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0) 58%),
    linear-gradient(180deg, rgba(255,248,240,0.08), rgba(255,248,240,0.08));
}

#room{
  position:relative;
  z-index:3;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:transparent;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:1;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{
  pointer-events:auto;
}

.panel{
  position:absolute;
  left:var(--game-panel-left);
  top:var(--game-panel-top);
  transform:translate(-50%,-50%) scale(var(--game-panel-scale));
  transform-origin:center center;
  width:calc(var(--game-panel-design-width) * 1px);
  max-width:none;
  padding:var(--game-panel-padding);
  border-radius:var(--game-panel-radius);
  background:rgba(255,255,255,0.30);
  border:1px solid rgba(255,255,255,0.58);
  box-shadow:
    0 12px 30px rgba(112,78,45,0.13),
    inset 0 1px 0 rgba(255,255,255,0.70),
    inset 0 0 26px rgba(255,255,255,0.09);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  text-align:center;
}

.menu{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:12px;
}

.game-btn.is-wide{
  grid-column:1 / -1;
  width:100%;
  justify-self:stretch;
}

.game-btn{
  appearance:none;
  border:none;
  cursor:pointer;
  width:100%;
  min-height:var(--game-card-height);
  border-radius:var(--game-card-radius);
  padding:var(--game-card-padding);
  text-decoration:none;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:rgba(255,252,248,0.76);
  border:1px solid rgba(255,255,255,0.86);
  box-shadow:
    0 7px 18px rgba(129,90,54,0.12),
    inset 0 1px 0 rgba(255,255,255,0.90);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease,
    border-color .18s ease,
    opacity .18s ease,
    filter .18s ease;
  font-family:inherit;
}

.game-btn:hover{
  transform:translateY(-3px);
  background:rgba(255,252,248,0.92);
  box-shadow:
    0 12px 28px rgba(129,90,54,0.22),
    inset 0 1px 0 rgba(255,255,255,0.96);
  border-color:rgba(255,255,255,1);
}

.game-btn:active{
  transform:translateY(0);
}

.game-btn.is-coming-soon{
  opacity:.82;
  filter:saturate(.86);
}

.game-btn.is-coming-soon:hover{
  opacity:.95;
}

.game-name{
  color:#744a2a;
  font-size:clamp(15px, var(--game-name-size), 38px);
  font-weight:850;
  line-height:1.18;
  margin-bottom:4px;
}

.game-status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:20px;
  margin-top:3px;
  padding:0 8px;
  border-radius:999px;
  color:#8a6547;
  background:rgba(255,255,255,.50);
  border:1px solid rgba(180,135,92,.14);
  font-size:clamp(9px, var(--game-status-size), 16px);
  font-weight:900;
}

.game-status.ready{
  color:#75451f;
  background:rgba(248,216,161,.58);
}

/* =========================================================
   身份组件：全站统一结构
========================================================= */
#topActions{
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:var(--identity-width);
  height:var(--identity-height);
  min-width:0;
  min-height:0;
  z-index:65;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:var(--identity-bg);
  border:1px solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--ui-scale)) calc(24px * var(--ui-scale)) var(--identity-shadow),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:normal;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:.06em;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
  white-space:nowrap;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--ui-scale));
  top:calc(-6px * var(--ui-scale));
  min-width:calc(18px * var(--ui-scale));
  height:calc(18px * var(--ui-scale));
  padding:0 calc(5px * var(--ui-scale));
  border-radius:999px;
  background:#c98c4f;
  color:#fff9f1;
  font-size:calc(9px * var(--ui-scale));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--ui-scale)) solid rgba(255,248,239,0.98);
  box-shadow:0 2px 8px rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice #siteNoticeCount{
  display:flex;
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:min(calc(360px * var(--ui-scale)), 72vw);
  max-height:min(calc(540px * var(--ui-scale)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  background:rgba(255,249,241,0.98);
  border:1px solid rgba(203,167,123,0.28);
  box-shadow:0 16px 36px rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

#siteNoticePanel.show{
  display:block;
}

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--ui-scale));
  font-weight:900;
  margin-bottom:calc(10px * var(--ui-scale));
}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--ui-scale));
  line-height:1.6;
  padding:6px 2px 2px;
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(8px * var(--ui-scale));
}

.siteNoticeItem{
  padding:calc(10px * var(--ui-scale));
  border-radius:calc(12px * var(--ui-scale));
  background:rgba(255,252,247,0.82);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.92),
    0 2px 8px rgba(120,92,63,0.05);
}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1.5;
  margin-bottom:4px;
}

.siteNoticeItemDesc{
  color:#8a6644;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.55;
}

.siteNoticeReadBtn{
  appearance:none;
  width:100%;
  margin-top:calc(10px * var(--ui-scale));
  min-height:calc(30px * var(--ui-scale));
  border:none;
  border-radius:calc(11px * var(--ui-scale));
  background:rgba(239,213,171,0.82);
  color:#6a4120;
  font-size:calc(12px * var(--ui-scale));
  font-weight:900;
  cursor:pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,247,230,0.95),
    0 3px 9px rgba(112,83,52,0.08);
}

.siteNoticeReadBtn:hover{
  background:rgba(239,213,171,0.96);
}

/* =========================================================
   房间切换按钮：游戏房页不显示“游戏房”按钮
========================================================= */
#topBar{
  position:absolute;
  left:var(--room-nav-left);
  top:var(--room-nav-top);
  width:var(--room-nav-width);
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:55;
  overflow:visible;
  pointer-events:none;

  --nav-btn-height:calc(40px * var(--ui-scale));
  --nav-btn-px:calc(16px * var(--ui-scale));
  --nav-btn-radius:calc(13px * var(--ui-scale));
  --nav-btn-font:calc(14px * var(--ui-scale));
  --nav-gap:calc(8px * var(--ui-scale));
}

#navOuter,
#navScroll{
  overflow:visible;
}

#navOuter{
  flex:0 0 auto;
  min-width:0;
  width:100%;
  pointer-events:auto;
}

#navScroll{
  width:100%;
  white-space:nowrap;
  padding:0;
  margin:0;
}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap);
  transform-origin:left center;
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height);
  padding:0 var(--nav-btn-px);
  border-radius:var(--nav-btn-radius);
  color:var(--nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid var(--nav-border);
  box-shadow:
    0 1px 1px rgba(255,255,255,.48) inset,
    0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease,
    filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:
    linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:
    0 1px 1px rgba(255,255,255,.55) inset,
    0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{
  position:relative;
  z-index:5;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  height:100%;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 1px 2px rgba(255,250,232,.82),
    0 0 8px rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{
  left:8%;
  top:-54%;
  font-size:calc(var(--nav-btn-font) * .92);
}

.navEffectB{
  right:8%;
  top:-62%;
  font-size:calc(var(--nav-btn-font) * .86);
}

.navEffectC{
  left:50%;
  top:-72%;
  transform:translateX(-50%);
  font-size:calc(var(--nav-btn-font) * 1.02);
}

@keyframes navFloatA{
  0%,100%{ transform:translateY(4px) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(-5px) rotate(6deg) scale(1); opacity:.76; }
}

@keyframes navFloatB{
  0%,100%{ transform:translateY(5px) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(-6px) rotate(-7deg) scale(1); opacity:.68; }
}

@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(6px) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(-6px) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:hover .navEffectA,
.navBtn:focus-visible .navEffectA{
  animation:navFloatA 2.2s ease-in-out infinite;
}

.navBtn:hover .navEffectB,
.navBtn:focus-visible .navEffectB{
  animation:navFloatB 2.5s ease-in-out infinite;
}

.navBtn:hover .navEffectC,
.navBtn:focus-visible .navEffectC{
  animation:navFloatC 2.35s ease-in-out infinite;
}

/* 各房间特效颜色 */
.navBtn[data-room="hall"] .navEffect{
  color:rgba(255,205,96,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.95),
    0 0 10px rgba(255,215,105,.62);
}

.navBtn[data-room="manager"] .navEffect{
  color:rgba(128,91,58,.82);
}

.navBtn[data-room="honor"] .navEffect{
  color:rgba(205,143,45,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.92),
    0 0 8px rgba(255,220,130,.52);
}

.navBtn[data-room="game"] .navEffect{
  color:rgba(117,91,150,.82);
}

.navBtn[data-room="studio"] .navEffect{
  color:rgba(96,112,145,.84);
}

.navBtn[data-room="living"] .navEffect{
  color:rgba(202,132,70,.82);
}

.navBtn[data-room="dorm"] .navEffect{
  color:rgba(143,111,168,.76);
}

.navBtn[data-room="pets"] .navEffect{
  color:rgba(131,111,78,.82);
}

.navBtn[data-room="flower"] .navEffect{
  color:rgba(198,119,145,.82);
}

/* =========================================================
   登录弹窗：引用首页登录框
========================================================= */
.login-mask,
.game-modal-mask{
  position:fixed;
  inset:0;
  z-index:90;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(76,48,27,.24);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.login-panel{
  position:relative;
  width:min(720px, 94vw);
}

.login-panel img{
  width:100%;
  display:block;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

#loginNickname{
  position:absolute;
  top:40%;
  left:36.2%;
  width:27.5%;
  height:8.1%;
  border:none;
  outline:none;
  padding:0 10px;
  font-size:18px;
  color:#5b3e28;
  background:transparent;
  line-height:1.1;
}

#loginCode{
  position:absolute;
  top:56%;
  left:36.2%;
  width:20%;
  height:8.1%;
  border:none;
  outline:none;
  padding:0 10px;
  font-size:18px;
  color:#5b3e28;
  background:transparent;
  line-height:1.1;
}

#toggleLoginCode{
  position:absolute;
  top:56%;
  left:56%;
  width:8%;
  height:8.1%;
  border:none;
  cursor:pointer;
  background:rgba(255,215,120,.15);
  border-radius:6px;
}

#toggleLoginCode:hover{
  background:rgba(255,215,120,.35);
  box-shadow:0 0 8px rgba(255,220,120,.6);
}

#loginSubmitBtn{
  position:absolute;
  top:68%;
  left:40%;
  width:20%;
  height:9%;
  border:none;
  background:transparent;
  cursor:pointer;
}

#registerLink{

/* =========================================================
   统一奖励 / 成就称号弹窗
========================================================= */
.reward-mask{
  position:fixed;
  inset:0;
  z-index:120;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(64,45,30,.30);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  --reward-scale:1;
}

.reward-mask.show{display:flex;}

.reward-card{
  position:relative;
  width:min(calc(430px * var(--reward-scale)), calc(100vw - 28px));
  max-height:calc(100dvh - 28px);
  padding:calc(28px * var(--reward-scale)) calc(24px * var(--reward-scale)) calc(22px * var(--reward-scale));
  border-radius:calc(26px * var(--reward-scale));
  overflow:hidden auto;
  text-align:center;
  color:#6a4223;
  background:
    radial-gradient(circle at 12% 16%, rgba(255,226,235,.68), transparent 30%),
    radial-gradient(circle at 86% 18%, rgba(255,240,181,.62), transparent 32%),
    linear-gradient(180deg, rgba(255,253,247,.98), rgba(255,244,226,.96));
  border:calc(2px * var(--reward-scale)) solid rgba(216,157,106,.35);
  box-shadow:
    0 calc(22px * var(--reward-scale)) calc(54px * var(--reward-scale)) rgba(69,47,28,.24),
    inset 0 1px 0 rgba(255,255,255,.9);
  animation:rewardPop .42s cubic-bezier(.2,1.12,.34,1) both;
}

.reward-card::before,
.reward-card::after{
  position:absolute;
  left:calc(12px * var(--reward-scale));
  right:calc(12px * var(--reward-scale));
  font-size:calc(15px * var(--reward-scale));
  letter-spacing:calc(8px * var(--reward-scale));
  white-space:nowrap;
  overflow:hidden;
  pointer-events:none;
}

.reward-card::before{
  content:"✿  ❀  ✽  ✿  ❀  ✽  ✿";
  top:calc(9px * var(--reward-scale));
  color:rgba(209,120,148,.52);
}

.reward-card::after{
  content:"✿  ❀  ✽  ✿  ❀  ✽  ✿";
  bottom:calc(8px * var(--reward-scale));
  color:rgba(199,145,75,.44);
}

@keyframes rewardPop{
  0%{opacity:0; transform:translateY(calc(12px * var(--reward-scale))) scale(.9);}
  64%{opacity:1; transform:translateY(0) scale(1.025);}
  100%{opacity:1; transform:translateY(0) scale(1);}
}

.reward-close{
  position:absolute;
  z-index:6;
  top:calc(12px * var(--reward-scale));
  right:calc(12px * var(--reward-scale));
  width:calc(30px * var(--reward-scale));
  height:calc(30px * var(--reward-scale));
  border:none;
  border-radius:999px;
  background:rgba(255,250,242,.88);
  color:#7b5636;
  font-size:calc(18px * var(--reward-scale));
  font-weight:900;
  line-height:1;
  cursor:pointer;
  box-shadow:0 calc(2px * var(--reward-scale)) calc(8px * var(--reward-scale)) rgba(105,75,43,.10), inset 0 1px 0 rgba(255,255,255,.9);
}

.reward-petals{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.reward-petals span{
  position:absolute;
  top:calc(-18px * var(--reward-scale));
  color:rgba(220,132,154,.56);
  font-size:calc(16px * var(--reward-scale));
  opacity:0;
  text-shadow:0 calc(2px * var(--reward-scale)) calc(4px * var(--reward-scale)) rgba(255,255,255,.76);
  animation:rewardPetalFall 1.35s ease-in-out both;
}

.reward-petals span:nth-child(1){left:12%; animation-delay:.05s;}
.reward-petals span:nth-child(2){left:28%; animation-delay:.18s;}
.reward-petals span:nth-child(3){left:48%; animation-delay:.02s;}
.reward-petals span:nth-child(4){left:66%; animation-delay:.22s;}
.reward-petals span:nth-child(5){left:82%; animation-delay:.10s;}

@keyframes rewardPetalFall{
  0%{opacity:0; transform:translateY(calc(-14px * var(--reward-scale))) rotate(0deg) scale(.78);}
  20%{opacity:.85;}
  100%{opacity:0; transform:translateY(calc(145px * var(--reward-scale))) rotate(160deg) scale(1);}
}

.reward-content{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.reward-icon{
  width:calc(62px * var(--reward-scale));
  height:calc(62px * var(--reward-scale));
  margin:calc(4px * var(--reward-scale)) auto calc(12px * var(--reward-scale));
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,246,226,.78);
  border:1px solid rgba(220,164,102,.25);
  box-shadow:0 calc(8px * var(--reward-scale)) calc(20px * var(--reward-scale)) rgba(126,92,51,.10), inset 0 1px 0 rgba(255,255,255,.85);
  font-size:calc(34px * var(--reward-scale));
}

.reward-label{
  min-height:calc(25px * var(--reward-scale));
  padding:0 calc(13px * var(--reward-scale));
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:rgba(255,249,232,.66);
  border:1px solid rgba(218,166,87,.20);
  color:#b26a3a;
  font-size:calc(13px * var(--reward-scale));
  font-weight:950;
  line-height:1;
  letter-spacing:.06em;
  animation:rewardStamp .42s ease both;
}

.reward-title{
  position:relative;
  max-width:100%;
  margin:calc(10px * var(--reward-scale)) auto calc(8px * var(--reward-scale));
  padding:calc(8px * var(--reward-scale)) calc(18px * var(--reward-scale));
  border-radius:999px;
  color:#6a4223;
  font-size:calc(22px * var(--reward-scale));
  font-weight:950;
  line-height:1.15;
  background:rgba(255,249,232,.72);
  border:1px solid rgba(218,166,87,.24);
  box-shadow:0 calc(5px * var(--reward-scale)) calc(14px * var(--reward-scale)) rgba(126,92,51,.08), inset 0 1px 0 rgba(255,255,255,.82);
  overflow:hidden;
}

.reward-title::after{
  content:"";
  position:absolute;
  inset:-30% auto -30% -42%;
  width:36%;
  background:linear-gradient(90deg, transparent, rgba(255,234,160,.80), transparent);
  transform:skewX(-18deg);
  animation:rewardSweep 1.25s ease .22s both;
}

@keyframes rewardStamp{
  0%{opacity:0; transform:scale(1.12);}
  72%{opacity:1; transform:scale(.97);}
  100%{opacity:1; transform:scale(1);}
}

@keyframes rewardSweep{
  0%{left:-42%;}
  100%{left:118%;}
}

.reward-desc{
  width:100%;
  max-width:calc(330px * var(--reward-scale));
  margin:0 auto calc(14px * var(--reward-scale));
  color:#826046;
  font-size:calc(13px * var(--reward-scale));
  line-height:1.65;
  text-align:center;
  white-space:pre-line;
}

.reward-section-title{
  margin:0 0 calc(10px * var(--reward-scale));
  color:#8a5c33;
  font-size:calc(12px * var(--reward-scale));
  font-weight:950;
  line-height:1;
  letter-spacing:.08em;
}

.reward-list{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  justify-content:center;
  gap:calc(8px * var(--reward-scale));

}

.reward-list.count-1{grid-template-columns:minmax(0, calc(120px * var(--reward-scale)));}
.reward-list.count-2{grid-template-columns:repeat(2, minmax(0, calc(120px * var(--reward-scale))));}
.reward-list.empty,
.reward-section-title.empty{display:none;}

.reward-item{
  min-width:0;
  min-height:calc(84px * var(--reward-scale));
  padding:calc(10px * var(--reward-scale)) calc(7px * var(--reward-scale)) calc(9px * var(--reward-scale));
  border-radius:calc(16px * var(--reward-scale));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(255,252,247,.72);
  border:1px solid rgba(196,139,86,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.82), 0 calc(3px * var(--reward-scale)) calc(10px * var(--reward-scale)) rgba(116,86,54,.06);
  animation:rewardItemIn .38s ease both;
}

.reward-item:nth-child(1){animation-delay:.14s;}
.reward-item:nth-child(2){animation-delay:.24s;}
.reward-item:nth-child(3){animation-delay:.34s;}
.reward-item:nth-child(4){animation-delay:.44s;}

@keyframes rewardItemIn{
  0%{opacity:0; transform:translateY(calc(8px * var(--reward-scale))) scale(.96);}
  100%{opacity:1; transform:translateY(0) scale(1);}
}

.reward-item-icon{
  font-size:calc(28px * var(--reward-scale));
  line-height:1;
  margin-bottom:calc(7px * var(--reward-scale));
}

.reward-item-name{
  width:100%;
  color:#7b593b;
  font-size:calc(11px * var(--reward-scale));
  font-weight:900;
  line-height:1.2;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.reward-item-amount{
  margin-top:calc(3px * var(--reward-scale));
  color:#6a4223;
  font-size:calc(13px * var(--reward-scale));
  font-weight:950;
  line-height:1.2;
  white-space:nowrap;
}

.reward-confirm{
  min-width:calc(132px * var(--reward-scale));
  height:calc(36px * var(--reward-scale));
  border:1px solid rgba(153,104,62,.22);
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,238,200,.96), rgba(227,187,132,.90));
  color:#67401f;
  font-size:calc(13px * var(--reward-scale));
  font-weight:950;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72), 0 calc(4px * var(--reward-scale)) calc(12px * var(--reward-scale)) rgba(112,80,42,.10);

.reward-mask[data-type="title"] .reward-card{

const rewardTypeMeta = {

function normalizeRewardItem(item){
  if(typeof item === "string"){
    return {name:item, amount:"", unit:"", icon:rewardIconMap[item] || "✨"};
  }

  return {
    name:item?.name || "奖励",
    amount:item?.amount ?? "",
    unit:item?.unit || "",
    icon:item?.icon || rewardIconMap[item?.name] || "✨",
    prefix:item?.prefix || ""
  };
}

function formatRewardAmount(item){
  if(item.amount === "" || item.amount === null || item.amount === undefined) return "";
  if(typeof item.amount === "number"){
    const sign = item.amount > 0 ? "+" : "";
    return `${sign}${item.amount}${item.unit || ""}`;
  }
  return `${item.prefix || ""}${item.amount}${item.unit || ""}`;
}

function renderRewards(rewards){
  const list = document.getElementById("rewardList");
  const sectionTitle = document.getElementById("rewardSectionTitle");
  if(!list || !sectionTitle) return;

  list.innerHTML = "";
  list.className = "reward-list";
  sectionTitle.className = "reward-section-title";

  if(!rewards.length){
    list.classList.add("empty");
    sectionTitle.classList.add("empty");
    return;
  }

  list.classList.add(`count-${Math.min(rewards.length, 3)}`);

  rewards.forEach(reward => {
    const item = document.createElement("div");
    item.className = "reward-item";
    item.innerHTML = `
      <div class="reward-item-icon">${escapeHtml(reward.icon)}</div>
      <div class="reward-item-name">${escapeHtml(reward.name)}</div>
      <div class="reward-item-amount">${escapeHtml(formatRewardAmount(reward))}</div>
    `;
    list.appendChild(item);
  });
}

function clearDesktopOverlayStyles(){
  if(overlay){
    overlay.style.left = "";
    overlay.style.top = "";
    overlay.style.width = "";
    overlay.style.height = "";
  }

  if(roomNav){
    roomNav.style.transform = "";

  root.style.setProperty("--bg-ui-scale", "1");
  root.style.setProperty("--game-panel-scale", "1");
}

function syncOverlayToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }
  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;
  /*
    大屏缩放规则：
    1440px = 1 倍；2400px 继续放大；3840px 继续放大；
    约 4608px 后限制在 3.2 倍，适配 8K 时不让组件无限巨大。
    关键：用背景图实际显示宽度 displayWidth 计算，保证文字、按钮、面板和背景图一起等比例变化。
  */
  const scale = Math.max(0.34, Math.min(3.2, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));

  const panelWidthPercentRaw = getComputedStyle(root).getPropertyValue("--game-panel-width").trim();
  const panelWidthPercent = Number(panelWidthPercentRaw.replace("%", "")) || 48;
  const panelDesignWidth = Number(getComputedStyle(root).getPropertyValue("--game-panel-design-width")) || 690;
  const panelScale = Math.max(0.42, Math.min(3.2, (displayWidth * (panelWidthPercent / 100)) / panelDesignWidth));
  root.style.setProperty("--game-panel-scale", String(panelScale));

  requestAnimationFrame(fitRoomNavToBar);
}

function fitRoomNavToBar(){
  if(!roomNav || !topBar || isTinyScreen()) return;

  roomNav.style.transform = "scale(1)";

  const availableWidth = topBar.clientWidth;
  const neededWidth = roomNav.scrollWidth;

  if(!availableWidth || !neededWidth) return;

  const fitScale = Math.min(1, availableWidth / neededWidth);
  roomNav.style.transform = `scale(${fitScale})`;
}

async function submitLogin(){
  const nickname = normalizeLoginInput(loginNicknameInput.value);
  const code = normalizeLoginInput(loginCodeInput.value);

  loginHint.textContent = "";
  loginHint.style.color = "#8b4a2d";

  if(!nickname || !code){
    loginHint.textContent = "还没填写完整呢";
    return;
  }

  try{
    const { data, error } = await client.rpc("verify_member_login", {
      input_nickname: nickname,
      input_code: code
    });

    if(error){
      console.error("KEY 登录失败：", error);
      loginHint.textContent = `登录检查失败：${error.message || "请稍后再试"}`;
      return;
    }

    if(!Array.isArray(data) || data.length === 0){
      loginHint.textContent = "没有找到你的记录哎";
      return;
    }

    const user = data[0] || {};

    localStorage.setItem("room10LoggedIn", "true");
    localStorage.setItem("room10User", user.nickname || nickname);
    localStorage.setItem("room10Role", user.role || "member");
    localStorage.setItem("room10MemberId", user.member_id || user.id || "");
    localStorage.setItem("room10MemberCode", code);

    let roleMessage = "登录成功";
    if(user.role === "owner"){
      roleMessage = "维修工已上线";
    }else if(user.role === "admin"){
      roleMessage = "宿管已上线";
    }else if(user.role === "member"){
      roleMessage = "房客已登录";
    }else if(user.role === "applying"){
      roleMessage = "当前身份为申请中";
    }

    loginHint.style.color = "#5f7d3a";
    loginHint.textContent = roleMessage;
    updateIdentityUI();
    refreshGameNotice();

    setTimeout(() => {
      const targetPage = getPendingRedirect();
      closeLogin(true);

      if(targetPage){
        clearPendingRedirect();
        window.location.href = targetPage;
      }
    }, 700);
  }catch(err){
    console.error("submitLogin() 查询异常：", err);
    loginHint.style.color = "#8b4a2d";
    loginHint.textContent = `登录失败：${err?.message || "请稍后再试"}`;
  }
}

function normalizeGameUrl(url){
  const safeUrl = String(url || "").trim();
  return safeUrl && !/^(javascript|data):/i.test(safeUrl) ? safeUrl : "";
}

function openGameModal(url, title = "小游戏"){
  const safeUrl = normalizeGameUrl(url);
  if(!safeUrl) return;

  closeSiteNoticePanel();

  const safeTitle = String(title || "小游戏").trim() || "小游戏";

  if(isTinyScreen()){
    window.location.href = safeUrl;
    return;
  }

  const currentUrl = gameModalFrame.getAttribute("data-current-src") || "";
  const modalAlreadyOpen = !gameModalMask.classList.contains("hidden");

  if(modalAlreadyOpen && currentUrl === safeUrl){
    return;
  }

  if(gameModalBox){
    gameModalBox.setAttribute("aria-label", safeTitle);
  }

  gameModalFrame.title = safeTitle;
  gameModalFrame.setAttribute("data-current-src", safeUrl);
  gameModalFrame.src = safeUrl;
  gameModalMask.classList.remove("hidden");
  gameModalMask.setAttribute("aria-hidden", "false");
}

function openReservedGame(gameKey){
  const config = RESERVED_GAMES[gameKey];
  if(!config){
    showTip("这个小游戏还在施工中，待更新。");
    return;
  }

  if(!config.enabled){
    showTip(config.message || `《${config.title}》待更新。`);
    return;
  }

  openGameModal(config.url, config.title);
}

function closeGameModal(){
  gameModalMask.classList.add("hidden");
  gameModalMask.setAttribute("aria-hidden", "true");
  gameModalFrame.removeAttribute("data-current-src");
  gameModalFrame.src = "about:blank";
}

let latestGameNoticeIds = [];

function getNoticeEmptyText(){
  if(!isLoggedIn()){
    return "登录后会显示属于你的游戏记录提醒。";
  }
  return "目前没有新的游戏记录提醒。";
}

function setNoticeCount(count){
  const n = Number(count) || 0;
  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);
}

function renderNoticeLoading(){
  siteNoticeContent.innerHTML = '<div class="siteNoticeEmpty">正在读取通知……</div>';
}

function renderNoticeError(message){
  siteNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(message || "通知读取失败，请稍后再试。")}</div>`;
  setNoticeCount(0);
}

function renderNoticeList(items){
  const list = Array.isArray(items) ? items : [];
  latestGameNoticeIds = list.map(item => item.id).filter(Boolean);

  if(!list.length){
    siteNoticeContent.innerHTML = `<div class="siteNoticeEmpty">${escapeHtml(getNoticeEmptyText())}</div>`;
    setNoticeCount(0);
    return;
  }

  siteNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => {
        const itemTitle = String(item.title || "游戏记录提醒").trim();
        return `
          <div class="siteNoticeItem">
            <div class="siteNoticeItemTitle">${escapeHtml(itemTitle)}</div>
          </div>
        `;
      }).join("")}
    </div>
    <button class="siteNoticeReadBtn" type="button" onclick="markAllGameNoticesRead()">全部已读</button>
  `;

  setNoticeCount(list.length);
}

async function fetchGameNoticeItems(){
  const memberId = getCurrentMemberId().trim();
  const memberCode = getCurrentMemberCode().trim();

  if(!isLoggedIn() || !memberId || !memberCode){
    return [];
  }

  const { data, error } = await client.rpc("get_member_notifications", {
    p_member_id: memberId,
    p_member_code: memberCode,
    p_channel: "game",
    p_limit: 20
  });

  if(error){
    console.error("读取游戏通知失败：", error);
    throw error;
  }

  return (Array.isArray(data) ? data : []).map(item => ({
    id:item.notice_id || item.id,
    title:item.title || "游戏记录提醒",
    message:item.message || item.desc || "",
    createdAt:item.created_at || ""
  }));
}

async function refreshGameNotice(){
  if(!siteNoticeContent || !siteNoticeBtn) return;

  try{
    renderNoticeLoading();
    const items = await fetchGameNoticeItems();
    renderNoticeList(items);
  }catch(err){
    renderNoticeError(err?.message || "通知读取失败，请稍后再试。");
  }
}

async function markAllGameNoticesRead(){
  const memberId = getCurrentMemberId().trim();
  const memberCode = getCurrentMemberCode().trim();

  if(!isLoggedIn() || !memberId || !memberCode || !latestGameNoticeIds.length){
    renderNoticeList([]);
    return;
  }

  try{
    const { error } = await client.rpc("mark_member_notifications_read", {
      p_member_id: memberId,
      p_member_code: memberCode,
      p_notice_ids: latestGameNoticeIds
    });

    if(error){
      console.error("标记游戏通知已读失败：", error);
      renderNoticeError(error.message || "标记已读失败，请稍后再试。");
      return;
    }

    latestGameNoticeIds = [];
    renderNoticeList([]);
  }catch(err){
    console.error("标记游戏通知已读异常：", err);
    renderNoticeError(err?.message || "标记已读失败，请稍后再试。");
  }
}

async function toggleSiteNoticePanel(){
  if(!siteNoticePanel) return;
  const willShow = !siteNoticePanel.classList.contains("show");
  siteNoticePanel.classList.toggle("show");
  if(willShow){
    await refreshGameNotice();
  }
}

function closeSiteNoticePanel(){
  if(siteNoticePanel) siteNoticePanel.classList.remove("show");
}

function showTip(message){
  fallbackTip.textContent = message || "操作提示";
  fallbackTip.classList.add("show");
  clearTimeout(showTip._timer);
  showTip._timer = setTimeout(() => fallbackTip.classList.remove("show"), 2600);
}

function clamp(v,min,max){
  return Math.max(min, Math.min(max, v));
}

function avgColor(data){
  let r = 0, g = 0, b = 0, count = 0;
  for(let i=0;i<data.length;i+=4){
    const alpha = data[i+3];
    if(alpha === 0) continue;
    r += data[i];
    g += data[i+1];
    b += data[i+2];
    count++;
  }
  if(!count) return [245, 233, 220];
  return [
    Math.round(r / count),
    Math.round(g / count),
    Math.round(b / count)
  ];
}

function mix(color, target, ratio){
  return [
    Math.round(color[0] * (1 - ratio) + target[0] * ratio),
    Math.round(color[1] * (1 - ratio) + target[1] * ratio),
    Math.round(color[2] * (1 - ratio) + target[2] * ratio)
  ];
}

function rgbToCss(arr){
  return `rgb(${arr[0]}, ${arr[1]}, ${arr[2]})`;
}

function applyEdgeColors(){
  try{
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently:true });
    const w = img.naturalWidth;
    const h = img.naturalHeight;

    if(!w || !h || !ctx) throw new Error("图片尺寸或画布无效");

    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(img, 0, 0, w, h);

    const bandX = Math.max(8, Math.floor(w * 0.03));
    const bandY = Math.max(8, Math.floor(h * 0.03));

    const leftData = ctx.getImageData(0, 0, bandX, h).data;
    const rightData = ctx.getImageData(w - bandX, 0, bandX, h).data;
    const topData = ctx.getImageData(0, 0, w, bandY).data;
    const bottomData = ctx.getImageData(0, h - bandY, w, bandY).data;

    let left = avgColor(leftData);
    let right = avgColor(rightData);
    let top = avgColor(topData);
    let bottom = avgColor(bottomData);

    left = mix(left, [255,255,255], 0.14);
    right = mix(right, [255,255,255], 0.12);
    top = mix(top, [255,255,255], 0.16);
    bottom = mix(bottom, [255,255,255], 0.10);

    left = left.map(v => clamp(v, 120, 255));
    right = right.map(v => clamp(v, 120, 255));
    top = top.map(v => clamp(v, 130, 255));
    bottom = bottom.map(v => clamp(v, 110, 255));

    root.style.setProperty("--bg-left", rgbToCss(left));
    root.style.setProperty("--bg-right", rgbToCss(right));
    root.style.setProperty("--bg-top", rgbToCss(top));
    root.style.setProperty("--bg-bottom", rgbToCss(bottom));
  }catch(err){
    showTip("未能读取图片边缘颜色，已使用默认柔和背景。");
    console.warn("读取底图边缘颜色失败：", err);
  }
}

loginNicknameInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") submitLogin();
});

loginCodeInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") submitLogin();
});

loginMask.addEventListener("click", (e) => {
  if(e.target === loginMask) closeLogin(false);
});

const rewardMask = document.getElementById("rewardMask");
if(rewardMask){
  rewardMask.addEventListener("click", (e) => {
    if(e.target === rewardMask) closeRewardModal();
  });
}

gameModalMask.addEventListener("click", (e) => {
  if(e.target === gameModalMask){
    e.preventDefault();
    e.stopPropagation();
    showTip("请点击右上角“关闭”退出游戏。");
  }
});

document.addEventListener("keydown", (e) => {
  if(e.key !== "Escape") return;

  const rewardMask = document.getElementById("rewardMask");
  if(rewardMask && rewardMask.classList.contains("show")){
    closeRewardModal();
    return;
  }

  if(!gameModalMask.classList.contains("hidden")){
    closeGameModal();
  }
});

siteNoticeBtn.addEventListener("click", event => {
  event.stopPropagation();
  toggleSiteNoticePanel();
});

loginOpenBtn.addEventListener("click", event => {
  event.stopPropagation();
  openLogin();
});

logoutBtn.addEventListener("click", event => {
  event.stopPropagation();
  logout();
});

document.addEventListener("click", (e) => {
  if(!siteNoticePanel || !siteNoticeBtn) return;
  if(siteNoticePanel.contains(e.target) || siteNoticeBtn.contains(e.target)) return;
  closeSiteNoticePanel();
});

window.addEventListener("storage", (e) => {
  if(
    e.key === "room10LoggedIn" ||
    e.key === "room10User" ||
    e.key === "room10Role" ||
    e.key === "room10MemberId" ||
    e.key === "room10MemberCode"
  ){
    updateIdentityUI();
  }

  if(e.key === "room10GameRecordNotices"){
    refreshGameNotice();
  }
});

window.addEventListener("resize", syncOverlayToImage);

if(img && img.complete && img.naturalWidth){
  syncOverlayToImage();
  applyEdgeColors();
}else if(img){
  img.addEventListener("load", () => {
    syncOverlayToImage();
    applyEdgeColors();
  }, { once:true });
  img.addEventListener("error", () => {
    showTip("未能读取图片边缘颜色，已使用默认柔和背景。");
  }, { once:true });
}

setTimeout(syncOverlayToImage, 120);
updateIdentityUI();
refreshGameNotice();
</script>
