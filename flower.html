<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜花房</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --bg-ui-scale:1;

  /* 当前页面坐标：花房页只改这里 */
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-width:calc(232px * var(--bg-ui-scale));
  --identity-height:calc(38px * var(--bg-ui-scale));

  --room-nav-left:27.2%;
  --room-nav-top:6.35%;
  --room-nav-width:45.5%;

  --flower-app-left:8.8%;
  --flower-app-top:22.2%;
  --flower-app-width:66.8%;
  --flower-app-height:67.6%;

  /* 页面可改颜色，不改结构尺寸 */
  --identity-bg:rgba(255,248,239,0.92);
  --identity-inner-bg:rgba(255,252,247,0.96);
  --identity-border:rgba(186,146,103,0.24);
  --identity-text:#6c4523;
  --identity-shadow:rgba(116,86,54,0.12);

  --nav-text:#6e4827;
  --nav-border:rgba(145,98,56,.34);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:#e7dfd4;
  color:#5b4632;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button,input{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#e7dfd4;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:none;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{
  pointer-events:auto;
}


/* =========================================================
   花房背景特效：柔光 / 花瓣 / 叶片
   背景氛围层，不影响点击，不遮挡顶部组件
========================================================= */
#flowerBgFx{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
  user-select:none;
  --fx-scale:var(--bg-ui-scale,1);
}

#flowerBgFx span{
  position:absolute;
  display:block;
  pointer-events:none;
  will-change:transform,opacity;
}

.fxGlow{
  width:calc(6px * var(--fx-scale));
  height:calc(6px * var(--fx-scale));
  border-radius:999px;
  background:rgba(255,226,154,.58);
  box-shadow:
    0 0 calc(10px * var(--fx-scale)) rgba(255,222,148,.48),
    0 0 calc(22px * var(--fx-scale)) rgba(255,241,190,.28);
  opacity:.18;
  animation:flowerGlowTwinkle 6.8s ease-in-out infinite;
}

.fxPetal,
.fxLeaf{
  line-height:1;
  text-shadow:
    0 1px 2px rgba(255,255,255,.72),
    0 3px 8px rgba(120,90,55,.12);
}

.fxPetal{
  color:rgba(232,139,162,.58);
  font-size:calc(15px * var(--fx-scale));
  opacity:.55;
  animation:flowerPetalDrift 18s linear infinite;
}

.fxLeaf{
  color:rgba(119,158,88,.50);
  font-size:calc(15px * var(--fx-scale));
  opacity:.48;
  animation:flowerLeafDrift 22s linear infinite;
}

.fxPetal.p1{left:13%; top:0%; animation-delay:-3s; animation-duration:20s;}
.fxPetal.p2{left:37%; top:-4%; animation-delay:-11s; animation-duration:23s; font-size:calc(12px * var(--fx-scale));}
.fxPetal.p3{left:61%; top:-2%; animation-delay:-7s; animation-duration:21s;}
.fxPetal.p4{left:84%; top:4%; animation-delay:-15s; animation-duration:24s; font-size:calc(13px * var(--fx-scale));}
.fxPetal.p5{left:72%; top:22%; animation-delay:-5s; animation-duration:26s; opacity:.42;}
.fxPetal.p6{left:48%; top:34%; animation-delay:-18s; animation-duration:25s; opacity:.38;}

.fxLeaf.l1{left:18%; top:16%; animation-delay:-6s; animation-duration:26s;}
.fxLeaf.l2{left:55%; top:8%; animation-delay:-15s; animation-duration:28s; font-size:calc(13px * var(--fx-scale));}
.fxLeaf.l3{left:89%; top:25%; animation-delay:-9s; animation-duration:30s; opacity:.42;}
.fxLeaf.l4{left:42%; top:58%; animation-delay:-20s; animation-duration:29s; opacity:.36;}

.fxGlow.g1{left:24%; top:20%; animation-delay:-.6s;}
.fxGlow.g2{left:46%; top:14%; animation-delay:-2.1s; transform:scale(1.35);}
.fxGlow.g3{left:69%; top:25%; animation-delay:-3.7s;}
.fxGlow.g4{left:35%; top:52%; animation-delay:-1.4s; transform:scale(.9);}
.fxGlow.g5{left:76%; top:63%; animation-delay:-4.3s; transform:scale(1.15);}


@keyframes flowerGlowTwinkle{
  0%,100%{opacity:.10; transform:scale(.72);}
  42%{opacity:.68; transform:scale(1.18);}
  68%{opacity:.28; transform:scale(.95);}
}

@keyframes flowerPetalDrift{
  0%{transform:translate3d(0,-12vh,0) rotate(0deg) scale(.86); opacity:0;}
  12%{opacity:.52;}
  42%{transform:translate3d(2.4vw,34vh,0) rotate(130deg) scale(1); opacity:.52;}
  74%{transform:translate3d(-1.8vw,68vh,0) rotate(255deg) scale(.92); opacity:.36;}
  100%{transform:translate3d(1vw,98vh,0) rotate(330deg) scale(.82); opacity:0;}
}

@keyframes flowerLeafDrift{
  0%{transform:translate3d(0,-10vh,0) rotate(-22deg) scale(.82); opacity:0;}
  16%{opacity:.46;}
  50%{transform:translate3d(-2.8vw,38vh,0) rotate(70deg) scale(1); opacity:.42;}
  100%{transform:translate3d(2vw,96vh,0) rotate(190deg) scale(.86); opacity:0;}
}


@media(max-width:540px){
  #flowerBgFx{
    position:fixed;
    z-index:1;
    --fx-scale:1;
  }

  .fxPetal.p5,
  .fxPetal.p6,
  .fxLeaf.l3,
  .fxLeaf.l4,
  .fxGlow.g4,
  .fxGlow.g5{
    display:none;
  }
}

@media(prefers-reduced-motion:reduce){
  #flowerBgFx{
    display:none;
  }
}

/* =========================================================
   身份组件：全站统一结构
========================================================= */
#topActions{
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:var(--identity-width);
  height:var(--identity-height);
  min-width:0;
  min-height:0;
  z-index:65;
  pointer-events:none;
}

#topIdentityBar{
  width:100%;
  height:100%;
  display:flex;
  align-items:stretch;
  justify-content:flex-start;
  gap:calc(5px * var(--ui-scale));
  padding:calc(4px * var(--ui-scale)) calc(5px * var(--ui-scale));
  border-radius:calc(13px * var(--ui-scale));
  background:var(--identity-bg);
  border:1px solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--ui-scale)) calc(24px * var(--ui-scale)) var(--identity-shadow),
    inset 0 1px 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

#topIdentityBadge,
#loginOpenBtn,
#logoutBtn,
#siteNoticeBtn{
  border-radius:calc(9px * var(--ui-scale));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 1px 4px rgba(112,83,52,0.05);
  border:1px solid rgba(160,116,78,0.12);
}

#topIdentityBadge{
  flex:1 1 auto;
  min-width:0;
  padding:0 calc(8px * var(--ui-scale));
  font-size:calc(13px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  white-space:nowrap;
}

#topIdentityBadge .identityText{
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

#loginOpenBtn,
#logoutBtn{
  appearance:none;
  cursor:pointer;
  width:calc(42px * var(--ui-scale));
  min-width:calc(42px * var(--ui-scale));
  flex:0 0 calc(42px * var(--ui-scale));
  padding:0;
  color:#67401f;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:normal;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:.06em;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  overflow:hidden;
  white-space:nowrap;
}

#loginOpenBtn:hover,
#logoutBtn:hover,
#siteNoticeBtn:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,0.94);
}

#siteNoticeWrap{
  position:relative;
  width:calc(30px * var(--ui-scale));
  min-width:calc(30px * var(--ui-scale));
  flex:0 0 calc(30px * var(--ui-scale));
  display:flex;
  align-items:stretch;
  justify-content:center;
  overflow:visible;
}

#siteNoticeBtn{
  appearance:none;
  cursor:pointer;
  position:relative;
  width:100%;
  height:100%;
  padding:0;
  font-size:calc(14px * var(--ui-scale));
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}

#siteNoticeIcon{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,0.55));
}

#siteNoticeCount{
  position:absolute;
  right:calc(-6px * var(--ui-scale));
  top:calc(-6px * var(--ui-scale));
  min-width:calc(18px * var(--ui-scale));
  height:calc(18px * var(--ui-scale));
  padding:0 calc(5px * var(--ui-scale));
  border-radius:999px;
  background:#c98c4f;
  color:#fff9f1;
  font-size:calc(9px * var(--ui-scale));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--ui-scale)) solid rgba(255,248,239,0.98);
  box-shadow:0 2px 8px rgba(116,86,54,0.16);
  z-index:3;
}

#siteNoticeBtn.hasNotice #siteNoticeCount{
  display:flex;
}

#siteNoticePanel{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  width:min(calc(360px * var(--ui-scale)), 72vw);
  max-height:min(calc(540px * var(--ui-scale)), 70vh);
  overflow:auto;
  padding:calc(12px * var(--ui-scale));
  border-radius:calc(16px * var(--ui-scale));
  background:rgba(255,249,241,0.98);
  border:1px solid rgba(203,167,123,0.28);
  box-shadow:0 16px 36px rgba(85,58,34,0.16);
  display:none;
  z-index:80;
  text-align:left;
}

#siteNoticePanel.show{
  display:block;
}

.siteNoticeTitle{
  color:#6f4726;
  font-size:calc(13px * var(--ui-scale));
  font-weight:900;
  margin-bottom:calc(10px * var(--ui-scale));
}

.siteNoticeEmpty{
  color:#8a6644;
  font-size:calc(12px * var(--ui-scale));
  line-height:1.6;
  padding:6px 2px 2px;
}

.siteNoticeList{
  display:flex;
  flex-direction:column;
  gap:calc(6px * var(--ui-scale));
}

.siteNoticeItem{
  padding:calc(10px * var(--ui-scale));
  border-radius:calc(12px * var(--ui-scale));
  background:rgba(255,252,247,0.82);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.92),
    0 2px 8px rgba(120,92,63,0.05);
}

.siteNoticeItemTitle{
  color:#6f4726;
  font-size:calc(12px * var(--ui-scale));
  font-weight:800;
  line-height:1.5;
  margin-bottom:4px;
}

.siteNoticeItemDesc{
  color:#8a6644;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.55;
}

/* =========================================================
   房间切换按钮：花房页不显示“花房区”按钮
========================================================= */
#topBar{
  position:absolute;
  left:var(--room-nav-left);
  top:var(--room-nav-top);
  width:var(--room-nav-width);
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  z-index:55;
  overflow:visible;
  pointer-events:none;

  --nav-btn-height:calc(40px * var(--ui-scale));
  --nav-btn-px:calc(16px * var(--ui-scale));
  --nav-btn-radius:calc(13px * var(--ui-scale));
  --nav-btn-font:calc(14px * var(--ui-scale));
  --nav-gap:calc(8px * var(--ui-scale));
}

#navOuter,
#navScroll{
  overflow:visible;
}

#navOuter{
  flex:0 0 auto;
  min-width:0;
  width:100%;
  pointer-events:auto;
}

#navScroll{
  width:100%;
  white-space:nowrap;
  padding:0;
  margin:0;
}

#roomNav{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--nav-gap);
  transform-origin:left center;
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:var(--nav-btn-height);
  padding:0 var(--nav-btn-px);
  border-radius:var(--nav-btn-radius);
  color:var(--nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    linear-gradient(180deg, rgba(249,232,203,.90) 0%, rgba(226,195,152,.86) 100%);
  border:1px solid var(--nav-border);
  box-shadow:
    0 1px 1px rgba(255,255,255,.48) inset,
    0 2px 5px rgba(91,68,45,.13);
  text-shadow:0 1px 0 rgba(255,255,255,.42);
  transition:
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    color .18s ease,
    filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
}

.navBtn:hover,
.navBtn:focus-visible{
  color:#5f3d22;
  background:
    linear-gradient(180deg, rgba(252,238,215,.95) 0%, rgba(232,205,166,.90) 100%);
  border-color:rgba(153,102,55,.48);
  box-shadow:
    0 1px 1px rgba(255,255,255,.55) inset,
    0 3px 7px rgba(91,68,45,.15);
  filter:brightness(1.015);
}

.navLabel{
  position:relative;
  z-index:5;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  height:100%;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 1px 2px rgba(255,250,232,.82),
    0 0 8px rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{
  left:8%;
  top:-54%;
  font-size:calc(var(--nav-btn-font) * .92);
}

.navEffectB{
  right:8%;
  top:-62%;
  font-size:calc(var(--nav-btn-font) * .86);
}

.navEffectC{
  left:50%;
  top:-72%;
  transform:translateX(-50%);
  font-size:calc(var(--nav-btn-font) * 1.02);
}

@keyframes navFloatA{
  0%,100%{ transform:translateY(4px) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(-5px) rotate(6deg) scale(1); opacity:.76; }
}

@keyframes navFloatB{
  0%,100%{ transform:translateY(5px) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(-6px) rotate(-7deg) scale(1); opacity:.68; }
}

@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(6px) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(-6px) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:hover .navEffectA,
.navBtn:focus-visible .navEffectA{
  animation:navFloatA 2.2s ease-in-out infinite;
}

.navBtn:hover .navEffectB,
.navBtn:focus-visible .navEffectB{
  animation:navFloatB 2.5s ease-in-out infinite;
}

.navBtn:hover .navEffectC,
.navBtn:focus-visible .navEffectC{
  animation:navFloatC 2.35s ease-in-out infinite;
}

/* 各房间特效颜色 */
.navBtn[data-room="hall"] .navEffect{
  color:rgba(255,205,96,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.95),
    0 0 10px rgba(255,215,105,.62);
}

.navBtn[data-room="manager"] .navEffect{
  color:rgba(128,91,58,.82);
}

.navBtn[data-room="honor"] .navEffect{
  color:rgba(205,143,45,.86);
  text-shadow:
    0 1px 2px rgba(255,250,232,.92),
    0 0 8px rgba(255,220,130,.52);
}

.navBtn[data-room="game"] .navEffect{
  color:rgba(117,91,150,.82);
}

.navBtn[data-room="studio"] .navEffect{
  color:rgba(96,112,145,.84);
}

.navBtn[data-room="living"] .navEffect{
  color:rgba(202,132,70,.82);
}

.navBtn[data-room="dorm"] .navEffect{
  color:rgba(148,112,171,.78);
}

.navBtn[data-room="pets"] .navEffect{
  color:rgba(131,111,78,.82);
}


/* =========================================================
   花房真实功能面板：花市 + 我的花盆
========================================================= */
#flowerApp{
  position:absolute;
  left:var(--flower-app-left);
  top:var(--flower-app-top);
  width:var(--flower-app-width);
  height:var(--flower-app-height);
  z-index:20;
  display:grid;
  grid-template-columns:minmax(0, 1.72fr) minmax(calc(200px * var(--ui-scale)), .52fr);
  gap:calc(10px * var(--ui-scale));
  padding:calc(12px * var(--ui-scale));
  pointer-events:auto;
  border-radius:calc(24px * var(--ui-scale));
  border:1px solid rgba(170,122,82,.24);
  background:
    linear-gradient(180deg, rgba(255,250,242,.83), rgba(250,236,216,.66));
  box-shadow:
    0 calc(16px * var(--ui-scale)) calc(38px * var(--ui-scale)) rgba(89,66,42,.12),
    inset 0 1px 0 rgba(255,255,255,.88);
  backdrop-filter:blur(calc(11px * var(--ui-scale)));
  -webkit-backdrop-filter:blur(calc(11px * var(--ui-scale)));
  overflow:hidden;
}

.flowerPanel{
  min-width:0;
  min-height:0;
  border-radius:calc(18px * var(--ui-scale));
  border:1px solid rgba(170,122,82,.14);
  background:rgba(255,253,248,.50);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.72),
    0 calc(8px * var(--ui-scale)) calc(18px * var(--ui-scale)) rgba(90,67,43,.06);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.flowerPanelHeader{
  flex:0 0 auto;
  padding:calc(11px * var(--ui-scale)) calc(14px * var(--ui-scale)) calc(8px * var(--ui-scale));
  border-bottom:1px solid rgba(172,125,86,.13);
}

.flowerPanelTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:calc(10px * var(--ui-scale));
  color:#6a4223;
  font-size:calc(14px * var(--ui-scale));
  font-weight:950;
  line-height:1.15;
}

.flowerPanelSub{
  margin-top:calc(5px * var(--ui-scale));
  color:#8b6545;
  font-size:calc(11px * var(--ui-scale));
  line-height:1.45;
}

.flowerGoldPill{
  flex:0 0 auto;
  max-width:48%;
  padding:calc(6px * var(--ui-scale)) calc(10px * var(--ui-scale));
  border-radius:999px;
  background:rgba(255,252,247,.82);
  border:1px solid rgba(178,128,83,.16);
  color:#744a27;
  font-size:calc(12px * var(--ui-scale));
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.flowerPanelBody{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  padding:calc(10px * var(--ui-scale)) calc(12px * var(--ui-scale)) calc(12px * var(--ui-scale));
}

.flowerPanelBody::-webkit-scrollbar{
  width:calc(8px * var(--ui-scale));
}

.flowerPanelBody::-webkit-scrollbar-thumb{
  background:rgba(160,111,72,.24);
  border-radius:999px;
}

.flowerMarketGrid{
  display:grid;
  grid-template-columns:repeat(5, minmax(0, 1fr));

/* =========================================================
   底图贴合坐标系统
========================================================= */
function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";
  root.style.setProperty("--bg-ui-scale","1");

  if(roomNav){
    roomNav.style.transform = "";
  }
}

function syncOverlayToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  /*
    大屏缩放规则：
    1440px = 1 倍；2400px 继续放大；3840px 继续放大；
    约 4608px 后限制在 3.2 倍，适配 8K 时不让组件无限巨大。
    关键：用背景图实际显示宽度 displayWidth 计算，保证文字、按钮、面板和背景图一起等比例变化。
  */
  const scale = Math.max(0.34, Math.min(3.2, displayWidth / 1440));
  root.style.setProperty("--bg-ui-scale", String(scale));

  requestAnimationFrame(fitRoomNavToBar);
}

/* =========================================================
   房间按钮自动缩放
========================================================= */
function fitRoomNavToBar(){
  if(!roomNav || !topBar || isTinyScreen()) return;

  roomNav.style.transform = "scale(1)";

  const availableWidth = topBar.clientWidth;
  const neededWidth = roomNav.scrollWidth;

  if(!availableWidth || !neededWidth) return;

  const fitScale = Math.min(1, availableWidth / neededWidth);
  roomNav.style.transform = `scale(${fitScale})`;
}

/* =========================================================
   通用工具
========================================================= */
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function roleLabel(role){
  const r = String(role || "").toLowerCase();
  if(r === "owner") return "维修工";
  if(r === "admin") return "宿管";
  if(r === "member") return "房客";
  if(r === "applying") return "申请中";
  return "参观者";
}

function normalizeLoginInput(value){
  return String(value || "").replace(/\u3000/g," ").trim();
}

function isLoggedIn(){
  return localStorage.getItem(STORAGE_KEYS.loggedIn) === "true";
}

function readLocalAuth(){
  authState.loggedIn = isLoggedIn();
  authState.nickname = String(localStorage.getItem(STORAGE_KEYS.user) || "").trim();
  authState.role = String(localStorage.getItem(STORAGE_KEYS.role) || "visitor").toLowerCase();
  authState.memberId = localStorage.getItem(STORAGE_KEYS.memberId) || null;
  authState.memberCode = localStorage.getItem(STORAGE_KEYS.memberCode) || null;

  return Boolean(authState.loggedIn && authState.nickname && authState.memberId);
}

function updateIdentity(member){
  readLocalAuth();

  const name = member?.nickname || authState.nickname || "";
  const role = roleLabel(member?.role || authState.role);

  if(!currentUserText || !loginOpenBtn || !logoutBtn) return;

  if(!name || !authState.loggedIn){
    currentUserText.textContent = "参观者";
    loginOpenBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
    return;
  }

  currentUserText.textContent = `${name} | ${role}`;
  loginOpenBtn.classList.add("hidden");
  logoutBtn.classList.remove("hidden");
}

function handleLogout(){
  localStorage.removeItem(STORAGE_KEYS.loggedIn);
  localStorage.removeItem(STORAGE_KEYS.user);
  localStorage.removeItem(STORAGE_KEYS.role);
  localStorage.removeItem(STORAGE_KEYS.memberId);
  localStorage.removeItem(STORAGE_KEYS.memberCode);

  localStorage.removeItem("room10_user");
  localStorage.removeItem("room10_current_user");
  localStorage.removeItem("currentUser");
  localStorage.removeItem("room10ApplicantSession");
  localStorage.removeItem("room10ApplicationDraft");

  closeNoticePanel();
  updateIdentity();
  renderSiteNotifications();
  loadFlowerPage();
}

  const targetPage = String(page || "").trim();
  if(!targetPage) return;

  readLocalAuth();

  if(needLogin && !authState.loggedIn){
    openLogin();
    return;
  }

  if((targetPage === "flower.html" || targetPage === "pets.html") && !authState.loggedIn){
    window.location.href = `${targetPage}?mode=guest`;
    return;
  }

  window.location.href = targetPage;
}

async function login(){
  const nicknameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const msg = document.getElementById("loginMessage");

  const nickname = normalizeLoginInput(nicknameInput?.value);
  const key = normalizeLoginInput(passwordInput?.value);

  if(!msg) return;
  msg.innerText = "";
  msg.style.color = "#8b4a2d";

  if(!nickname || !key){
    msg.innerText = "还没填写完整呢";
    return;
  }

  try{
    const { data, error } = await supabaseClient.rpc("verify_member_login", {
      input_nickname:nickname,
      input_code:key
    });

    if(error){
      console.error("KEY 登录失败：", error);
      msg.innerText = `登录检查失败：${error.message || "请稍后再试"}`;
      return;
    }

    if(!Array.isArray(data) || data.length === 0){
      msg.innerText = "没有找到你的记录哎";
      return;
    }

    const user = data[0] || {};

    localStorage.setItem(STORAGE_KEYS.loggedIn,"true");
    localStorage.setItem(STORAGE_KEYS.user,user.nickname || nickname);
    localStorage.setItem(STORAGE_KEYS.role,user.role || "member");
    localStorage.setItem(STORAGE_KEYS.memberId,user.member_id || user.id || "");
    localStorage.setItem(STORAGE_KEYS.memberCode,key);

    let roleMessage = "登录成功";
    if(user.role === "owner") roleMessage = "维修工已上线";
    else if(user.role === "admin") roleMessage = "宿管已上线";
    else if(user.role === "member") roleMessage = "房客已登录";
    else if(user.role === "applying") roleMessage = "当前身份为申请中";

    msg.style.color = "#5f7d3a";
    msg.innerText = roleMessage;

    updateIdentity({
      nickname:user.nickname || nickname,
      role:user.role || "member"
    });
    await loadFlowerPage();

    setTimeout(() => {
      if(nicknameInput) nicknameInput.value = "";
      if(passwordInput) passwordInput.value = "";
      closeLogin();
    }, 650);
  }catch(e){
    console.error("login() 查询异常：", e);
    msg.innerText = `登录失败：${e?.message || "请稍后再试"}`;
  }
}

function renderFlowerUnlockRewards(rewards=[]){
  if(!flowerRewardItems) return;

  const list = Array.isArray(rewards) ? rewards.filter(Boolean) : [];
  if(!list.length){
    flowerRewardItems.innerHTML = "";
    flowerRewardItems.style.display = "none";
    return;
  }

  flowerRewardItems.style.display = "";
  flowerRewardItems.innerHTML = list.map(item => {
    const imgHtml = item.img
      ? `<img src="${escapeHtml(item.img)}" alt="${escapeHtml(item.name || "奖励")}">`
      : `<div class="flowerRewardItemIcon">${escapeHtml(item.icon || "✦")}</div>`;
    return `
      <div class="flowerRewardItem">
        ${imgHtml}
        <div class="flowerRewardItemName">${escapeHtml(item.name || "奖励")}</div>
        <div class="flowerRewardItemQty">${escapeHtml(item.qty || "")}</div>
      </div>`;
  }).join("");
}

function formatTimeLeft(value){
  if(!value) return "--:--:--:--";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "--:--:--:--";
  const diff = date.getTime() - Date.now();
  if(diff <= 0) return "00:00:00:00";
  return formatDurationClock(diff, true);
}

function padClock(value){
  return String(Math.max(0, Math.floor(Number(value) || 0))).padStart(2, "0");
}

function formatDurationClock(diff, includeDays=true){
  const safeDiff = Math.max(0, Number(diff) || 0);
  const day = Math.floor(safeDiff / 86400000);
  const hour = Math.floor((safeDiff % 86400000) / 3600000);
  const minute = Math.floor((safeDiff % 3600000) / 60000);
  const second = Math.floor((safeDiff % 60000) / 1000);

  if(includeDays){
    return `${padClock(day)}:${padClock(hour)}:${padClock(minute)}:${padClock(second)}`;
  }

  const totalHours = Math.floor(safeDiff / 3600000);
  return `${padClock(totalHours)}:${padClock(minute)}:${padClock(second)}`;
}

function formatWitherCountdown(value){
  if(!value) return "--:--:--:--";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "--:--:--:--";

  const diff = date.getTime() - Date.now();
  if(diff <= 0) return "00:00:00:00";

  return formatDurationClock(diff, true);
}

}

function getNextMarketRefreshCountdown(){
  const now = new Date();
  const next = new Date(now);

  if(now.getHours() < 12){
    next.setHours(12, 0, 0, 0);
  }else{
    next.setDate(next.getDate() + 1);
    next.setHours(0, 0, 0, 0);
  }

  const diff = next.getTime() - now.getTime();
  if(diff <= 0) return "00:00:00";

  return formatDurationClock(diff, false);
}

function getRoundBoughtQuantity(row){
  const candidates = [
    row?.round_bought_quantity,
    row?.round_buy_quantity,
    row?.current_round_bought_quantity,
    row?.current_round_buy_quantity,
    row?.bought_quantity,
    row?.buy_quantity,
    row?.purchased_quantity,
    row?.round_purchased_quantity
  ];

  for(const value of candidates){
    const n = Number(value);
    if(Number.isFinite(n) && n >= 0) return Math.floor(n);
  }

  return Math.max(0, Number(row?.owned_quantity) || 0);
}

function getRemainingBuyQuantity(row){
  return Math.max(0, 5 - getRoundBoughtQuantity(row || {}));
}

function startMarketTipRotator(){
  const tipEl = document.getElementById("marketTipText");
  if(!tipEl) return;

  if(marketTipTimer){
    clearInterval(marketTipTimer);
    marketTipTimer = null;
  }

  const tips = getMarketTips();
  let index = 0;
  tipEl.textContent = tips[index] || "";

  if(tips.length <= 1) return;

  marketTipTimer = setInterval(() => {
    index = (index + 1) % tips.length;
    tipEl.classList.add("isChanging");
    setTimeout(() => {
      tipEl.textContent = tips[index] || "";
      tipEl.classList.remove("isChanging");
    }, 260);
  }, 3800);
}

  const imgPath = String(row?.bouquet_img || "").trim();
  if(freshMap[key]) return freshMap[key];
  if(imgPath && !imgPath.toLowerCase().includes("wither")) return imgPath;
  return "bouquet-daisy.png";
}

function hasWitheredFlowers(row){
  const quantityFields = [
    row?.withered_quantity,
    row?.wither_quantity,
    row?.withered_owned_quantity,
    row?.withered_count
  ];

  if(quantityFields.some(value => Number(value) > 0)) return true;

  const statusText = String(row?.status || row?.holding_status || row?.inventory_status || "").toLowerCase();
  if(statusText.includes("withered")) return true;

  const date = new Date(row?.earliest_wither_at || "");
  return !Number.isNaN(date.getTime()) && date.getTime() <= Date.now();
}

function getInventoryBouquetImg(row){
  if(hasWitheredFlowers(row)) return "bouquet-withered.png";
  return getFreshBouquetImg(row);
}

function getMarketQuantity(flowerKey){
  const key = String(flowerKey || "");
  const input = document.querySelector(`[data-flower-qty="${key}"]`);
  const raw = Number(input?.value);
  if(!Number.isFinite(raw)) return 1;
  return Math.max(1, Math.floor(raw));
}

function setMarketQuantity(flowerKey, quantity){
  const key = String(flowerKey || "");
  const input = document.querySelector(`[data-flower-qty="${CSS.escape(key)}"]`);
  const row = getMarketRow(key);
  const remaining = row ? getRemainingBuyQuantity(row) : 5;
  const target = Math.max(1, Math.min(5, remaining || 5, Math.floor(Number(quantity) || 1)));

  if(input){
    input.value = String(target);
  }

  if(remaining <= 0){
    const displayName = getFlowerDisplayName(row || { flower_key:key });
    showBoxMessage(marketMessage, `${displayName}这一轮已经买满啦，现在还能买 0 朵。`, true);
  }
}

function setFlowerResources(seedQuantity, waterQuantity, fertilizerQuantity){
  const seed = Math.max(0, Number(seedQuantity) || 0);
  const water = Math.max(0, Number(waterQuantity) || 0);
  const fertilizer = Math.max(0, Number(fertilizerQuantity) || 0);

  flowerState.resources.seed = seed;
  flowerState.resources.water = water;
  flowerState.resources.fertilizer = fertilizer;
}

function getFlowerResources(){
  return {
    seed:Math.max(0, Number(flowerState.resources.seed) || 0),
    water:Math.max(0, Number(flowerState.resources.water) || 0),
    fertilizer:Math.max(0, Number(flowerState.resources.fertilizer) || 0)
  };
}

async function hasClaimedFirstVisitReward(){
  const auth = getFlowerAuth();
  if(!auth) return true;

  try{

      .from("achievements")
      .select("id")
      .eq("code", "first_visit_flower")
      .maybeSingle();

    if(achievementError || !achievement?.id){

    }

    const { data:owned, error:ownedError } = await supabaseClient
      .from("member_achievements")
      .select("id")
      .eq("member_id", auth.memberId)

      ? `<button class="potActionBtn" type="button" onclick="openLogin()"><span class="potActionContent">登录后种花</span></button>`
      : `<button class="potActionBtn" type="button" onclick="plantSeed()"><span class="potActionContent"><img class="potActionIcon" src="seed.png" alt="">种下种子</span></button>`;

function renderPot(row){
  const pot = row || {};
  const displayStatus = pot.display_status || pot.status || "empty";

  if(displayStatus === "empty"){
    renderPotEmpty("花盆空着，可以种下一颗种子。", false);
    return;
  }

  if(potImage) potImage.src = pot.display_img || "pot-empty.png";
  updatePotResourceNumbers(false);

  if(displayStatus === "growing"){
    if(potStatusTitle) potStatusTitle.textContent = "种植中";
    if(potStatusDesc){
      potStatusDesc.innerHTML = `
        <span class="potStatusDescLine">它正在慢慢长大。</span>
        <span class="potStatusDescLine">距离准备好大约还有：${formatTimeLeft(pot.mature_at)}</span>
      `;
    }
    if(potActions){
      const waterDisabled = getDailyCareRemaining("water") <= 0;
      const fertilizerDisabled = getDailyCareRemaining("fertilizer") <= 0;
      potActions.className = "potActions";
      potActions.innerHTML = `
        <button class="potActionBtn" type="button" ${waterDisabled ? "data-disabled=\"true\" disabled" : ""} onclick="careFlowerPot('water')" title="每天最多浇水 3 次"><span class="potActionContent"><img class="potActionIcon" src="water.png" alt="">浇水</span></button>
        <button class="potActionBtn" type="button" ${fertilizerDisabled ? "data-disabled=\"true\" disabled" : ""} onclick="careFlowerPot('fertilizer')" title="每天最多施肥 3 次"><span class="potActionContent"><img class="potActionIcon" src="fert.png" alt="">施肥</span></button>
      `;
    }
    showBoxMessage(potMessage, "");
    return;
  }

  if(displayStatus === "ready"){
    if(potStatusTitle) potStatusTitle.textContent = "可以收获了";
    if(potStatusDesc) potStatusDesc.textContent = "它已经准备好啦，点击收获看看这次开出了什么花。";
    if(potActions){
      potActions.className = "potActions single";
      potActions.innerHTML = `<button class="potActionBtn" type="button" onclick="harvestFlowerPot()"><span class="potActionContent">收获</span></button>`;
    }
    showBoxMessage(potMessage, "");
    return;
  }

  if(displayStatus === "withered"){
    if(potStatusTitle) potStatusTitle.textContent = "花盆枯萎了";
    if(potStatusDesc) potStatusDesc.textContent = "这次没能正常收获，清理后可以重新种下一颗种子。";
    if(potActions){
      potActions.className = "potActions single";
      potActions.innerHTML = `<button class="potActionBtn" type="button" onclick="clearWitheredFlowerPot()"><span class="potActionContent">清理花盆</span></button>`;
    }
    showBoxMessage(potMessage, "");
  }
}

  readLocalAuth();

  if(!authState.loggedIn || !authState.memberId || !authState.memberCode){
    renderLoggedOutFlower();

      showBoxMessage(marketMessage, "花房需要重新登录一次，才能进行真实买卖和种植。", true);
      showBoxMessage(potMessage, "请先登出后重新登录。", true);
    }

  }

    loadFlowerMarket(),
    loadFlowerPot()
  ]);

  renderSiteNotifications();

  if(!firstVisitClaimed){
    await promptFirstVisitRewardIfNeeded();
  }
}


function formatMarketErrorMessage(message, displayName="花束"){
  const text = String(message || "").trim();
  const sellableMatch = text.match(/当前可卖\s*(\d+)\s*朵/);
  const sellable = sellableMatch ? sellableMatch[1] : "0";

  if(text.includes("刚买") || text.includes("价格刷新") || text.includes("刷新一次")){
    return `${displayName}刚买回来，要等花市刷新一次后才能卖出。当前可卖 ${sellable} 朵。`;
  }

  return text || `${displayName}操作失败`;
}

async function buyFlower(flowerKey, quantity=1){
  const auth = getFlowerAuth();
  if(!auth){
    openLogin();
    return;
  }

  if(getCurrentGoldBalance() < 100){
    showBoxMessage(marketMessage, "当前金币不足 100，暂时不能在花市买入。", true);
    return;
  }

  const rowInfo = getMarketRow(flowerKey);
  const displayName = getFlowerDisplayName(rowInfo || { flower_key:flowerKey });
  const remaining = rowInfo ? getRemainingBuyQuantity(rowInfo) : 5;
  const requestedQuantity = Math.max(1, Math.floor(Number(quantity) || 1));
  const buyQuantity = Math.max(0, Math.min(remaining, requestedQuantity));

  if(remaining <= 0){
    showBoxMessage(marketMessage, `${displayName}这一轮已经买满啦，现在还能买 0 朵。`, true);
    return;
  }

  if(requestedQuantity > remaining){
    showBoxMessage(marketMessage, `${displayName}现在还能买 ${remaining} 朵，已按 ${remaining} 朵购买。`, true);
  }

  if(buyQuantity <= 0){
    showBoxMessage(marketMessage, `请选择要买入的${displayName}数量。`, true);
    return;
  }

  setFlowerBusy(true);
  try{
    const { data, error } = await supabaseClient.rpc("buy_flower", {
      p_member_id:auth.memberId,
      p_member_code:auth.memberCode,
      p_flower_key:flowerKey,
      p_quantity:buyQuantity,
      p_timezone_offset_minutes:auth.timezoneOffset
    });

    if(error) throw error;

    const row = Array.isArray(data) ? data[0] : data;
    const actualQuantity = Number(row?.quantity) || buyQuantity;
    const oldOwned = Number(rowInfo?.owned_quantity) || 0;
    const newOwned = oldOwned + actualQuantity;
    const message = requestedQuantity > remaining
      ? `${displayName}现在最多还能买 ${remaining} 朵，已实际买入 ${actualQuantity} 朵；现在拥有 ${newOwned} 朵。`
      : `${displayName}购买成功：实际买入 ${actualQuantity} 朵；现在拥有 ${newOwned} 朵。`;

    await loadFlowerPage();
    showBoxMessage(marketMessage, message, false);
  }catch(err){
    console.error("买花失败：", err);
    showBoxMessage(marketMessage, err?.message || `${displayName}买花失败`, true);
    await loadFlowerMarket();
  }finally{
    setFlowerBusy(false);
  }
}

async function plantSeed(){
  const auth = getFlowerAuth();
  if(!auth){
    openLogin();
    return;
  }

  if(getFlowerResources().seed <= 0){
    showFlowerToast("现在还没有种子哦", "error");
    return;
  }

  setFlowerBusy(true);
  try{
    const { data, error } = await supabaseClient.rpc("plant_seed", {
      p_member_id:auth.memberId,
      p_member_code:auth.memberCode
    });

    if(error) throw error;

    const row = Array.isArray(data) ? data[0] : data;

      setFlowerResources(row.seed_quantity, flowerState.resources.water, flowerState.resources.fertilizer);

    showFlowerToast(row?.message || "种下成功");
    await loadFlowerPage();
  }catch(err){
    console.error("种下失败：", err);
    showFlowerToast(err?.message || "种下失败", "error");
  }finally{
    setFlowerBusy(false);
  }
}

function getFlowerLocalDateKey(){
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

function getDailyCareStorageKey(careType){
  const memberId = authState.memberId || localStorage.getItem(STORAGE_KEYS.memberId) || "guest";
  return `room10FlowerDailyCare:${memberId}:${getFlowerLocalDateKey()}:${careType}`;
}

function getDailyCareCount(careType){
  const count = Number(localStorage.getItem(getDailyCareStorageKey(careType)) || 0);
  return Number.isFinite(count) ? Math.max(0, Math.floor(count)) : 0;
}

function getDailyCareRemaining(careType){
  return Math.max(0, 3 - getDailyCareCount(careType));
}

function addDailyCareCount(careType){
  const key = getDailyCareStorageKey(careType);
  const next = Math.min(3, getDailyCareCount(careType) + 1);
  localStorage.setItem(key, String(next));
  return next;
}

async function careFlowerPot(careType){
  const auth = getFlowerAuth();
  if(!auth){
    openLogin();
    return;
  }

  const resources = getFlowerResources();
  if(careType === "water" && getDailyCareRemaining("water") <= 0){
    showFlowerToast("今天浇水次数已经用完啦", "error");
    return;
  }
  if(careType === "fertilizer" && getDailyCareRemaining("fertilizer") <= 0){
    showFlowerToast("今天施肥次数已经用完啦", "error");
    return;
  }
  if(careType === "water" && resources.water <= 0){
    showFlowerToast("今天的水不够啦", "error");
    return;
  }
  if(careType === "fertilizer" && resources.fertilizer <= 0){
    showFlowerToast("今天的肥料不够啦", "error");
    return;
  }

  setFlowerBusy(true);
  try{
    const { data, error } = await supabaseClient.rpc("care_flower_pot", {
      p_member_id:auth.memberId,
      p_member_code:auth.memberCode,
      p_care_type:careType
    });

    if(error) throw error;

    const row = Array.isArray(data) ? data[0] : data;
    if(row){
      setFlowerResources(row.seed_quantity ?? flowerState.resources.seed, row.water_quantity, row.fertilizer_quantity);
    }
    addDailyCareCount(careType);
    showFlowerToast(row?.message || "照顾成功");
    await loadFlowerPage();
  }catch(err){
    console.error("照顾失败：", err);
    showFlowerToast(err?.message || "照顾失败", "error");
  }finally{
    setFlowerBusy(false);
  }
}

/* =========================================================
   铃铛提醒
========================================================= */
function setNoticeCount(count){
  const n = Number(count) || 0;
  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);
}

function renderNoticeList(items){
  const list = Array.isArray(items) ? items : [];

  if(!list.length){
    siteNoticeContent.innerHTML = '<div class="siteNoticeEmpty">暂无需要维护的花盆状态。</div>';
    setNoticeCount(0);
    return;
  }

  siteNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => `
        <div class="siteNoticeItem">
          <div class="siteNoticeItemTitle">${escapeHtml(item.title || "提醒")}</div>
          <div class="siteNoticeItemDesc">${escapeHtml(item.desc || "")}</div>
        </div>
      `).join("")}
    </div>
  `;

  setNoticeCount(list.length);
}

function toggleNoticePanel(force){
  const shouldShow = typeof force === "boolean" ? force : !siteNoticePanel.classList.contains("show");
  siteNoticePanel.classList.toggle("show", shouldShow);
  siteNoticePanel.setAttribute("aria-hidden", shouldShow ? "false" : "true");
  siteNoticeBtn.setAttribute("aria-expanded", shouldShow ? "true" : "false");
}

function closeNoticePanel(){
  toggleNoticePanel(false);
}

async function getSeedMaintenanceItems(){
  const auth = getFlowerAuth();
  if(!auth) return [];

  try{
    const { data, error } = await supabaseClient.rpc("get_flower_pot_status", {
      p_member_id:auth.memberId,
      p_member_code:auth.memberCode
    });

    if(error) throw error;

    const pot = Array.isArray(data) ? data[0] : data;
    if(!pot) return [];

    const items = [];
    const status = pot.display_status || pot.status;

    if(status === "ready"){
      items.push({
        title:"我的花盆可以收获了",
        desc:"种植周期已经完成，记得进入花房收获。"
      });
    }

    if(status === "withered"){
      items.push({
        title:"我的花盆需要清理",
        desc:"花盆已经枯萎，清理后可以重新种下一颗种子。"
      });
    }

    if(status === "growing" && Number(pot.interaction_count || 0) <= 0){
      items.push({
        title:"种子还没有被照顾",
        desc:"小种子还没有被照顾，进去看看它吧。"
      });
    }

    return items;
  }catch(err){
    console.warn("读取花房提醒失败：", err);
    return [];
  }
}

async function renderSiteNotifications(){
  const items = await getSeedMaintenanceItems();
  renderNoticeList(items);
}

/* =========================================================
   初始化
========================================================= */
document.addEventListener("DOMContentLoaded", () => {
  readLocalAuth();
  updateIdentity();
  loadFlowerPage();

  if(siteNoticeBtn){
    siteNoticeBtn.addEventListener("click", event => {
      event.stopPropagation();
      toggleNoticePanel();
    });
  }

  if(loginOpenBtn){
    loginOpenBtn.addEventListener("click", event => {
      event.stopPropagation();
      openLogin();
    });
  }

  if(logoutBtn){
    logoutBtn.addEventListener("click", event => {
      event.stopPropagation();
      handleLogout();
    });
  }

  document.addEventListener("click", event => {
    if(siteNoticePanel && siteNoticeBtn){
      if(siteNoticePanel.contains(event.target) || siteNoticeBtn.contains(event.target)) return;
      closeNoticePanel();
    }
  });

  if(flowerRewardModal){
    flowerRewardModal.addEventListener("click", event => {
      if(event.target === flowerRewardModal){
        closeFlowerRewardModal();
      }
    });
  }

  document.addEventListener("keydown", event => {
    if(event.key === "Escape"){
      closeFlowerRewardModal();
    }
  });

  document.getElementById("username")?.addEventListener("keydown", event => {
    if(event.key === "Enter") login();
  });

  document.getElementById("password")?.addEventListener("keydown", event => {
    if(event.key === "Enter") login();
  });

  syncOverlayToImage();
});

window.addEventListener("resize", syncOverlayToImage);
window.addEventListener("orientationchange", syncOverlayToImage);

window.addEventListener("storage", event => {
  if(
    event.key === STORAGE_KEYS.loggedIn ||
    event.key === STORAGE_KEYS.user ||
    event.key === STORAGE_KEYS.role ||
    event.key === STORAGE_KEYS.memberId ||
    event.key === STORAGE_KEYS.memberCode
  ){
    updateIdentity();
    loadFlowerPage();
  }
});

if(img && img.complete && img.naturalWidth){
  syncOverlayToImage();
}else if(img){
  img.addEventListener("load", syncOverlayToImage, { once:true });
}

setTimeout(syncOverlayToImage, 120);
</script>
