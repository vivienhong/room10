<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十号房｜花房</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;}

:root{
  --bg-ui-scale:1;
  --ui-scale:1;
  --room-nav-scale:var(--ui-scale);
  --identity-scale:var(--ui-scale);
  --reward-modal-scale:1;

  /* 身份组件：使用全站通用模板 */
  --identity-right:7.35%;
  --identity-top:6.46%;
  --identity-base-width:232;
  --identity-base-height:38;
  --identity-bg:rgba(255,250,244,0.88);
  --identity-inner-bg:rgba(255,253,249,0.92);
  --identity-border:rgba(170,132,101,0.20);
  --identity-text:#6f5746;
  --identity-shadow:rgba(106,78,55,0.08);
  --identity-name-y:0em;
  --identity-notice-y:0em;
  --identity-button-y:0em;

  /* 房间按钮：使用全站通用模板，底图百分比绑定 */
  --room-nav-top:6.35%;
  --room-nav-start-left:25.83%;
  --room-nav-btn-width:4.72%;
  --room-nav-btn-height:5.10%;
  --room-nav-gap:0.486%;

  --room-nav-hall-left:var(--room-nav-start-left);
  --room-nav-living-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 1);
  --room-nav-manager-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 2);
  --room-nav-honor-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 3);
  --room-nav-studio-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 4);
  --room-nav-game-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 5);
  --room-nav-dorm-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 6);
  --room-nav-flower-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 7);
  --room-nav-pets-left:calc(var(--room-nav-start-left) + (var(--room-nav-btn-width) + var(--room-nav-gap)) * 8);

  --room-nav-text:#6f5746;
  --room-nav-border:rgba(158,122,93,.26);
  --room-nav-current-text:#5d4738;
  --room-nav-current-border:rgba(151,111,82,.42);
  --room-nav-paper:rgba(255,250,242,.78);
  --room-nav-paper-2:rgba(246,235,219,.74);
  --room-nav-wash:rgba(214,185,157,.20);
  --room-nav-current-bg:rgba(239,224,205,.86);

  /* 奖励弹窗基础颜色 */
  --reward-ink:#6b5141;
  --reward-text:#7d6557;
  --reward-line:rgba(190,143,112,0.24);
  --reward-soft-line:rgba(174,132,103,0.14);
  --ink:var(--reward-ink);
  --text:var(--reward-text);
  --line:var(--reward-line);
  --soft-line:var(--reward-soft-line);
  --card-shadow:rgba(106,78,55,0.20);

  --flower-app-left:8.8%;
  --flower-app-top:22.2%;
  --flower-app-width:66.8%;
  --flower-app-height:67.6%;

}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:#e7dfd4;
  color:#5b4632;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

button,input{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

#room{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#e7dfd4;
}

#bgFrame{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:none;
}

#bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  display:block;
  user-select:none;
  pointer-events:none;
  -webkit-user-drag:none;
}

#overlay{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:2;
  overflow:visible;
  pointer-events:none;
  --ui-scale:var(--bg-ui-scale, 1);
}

#overlay *{
  pointer-events:auto;
}

/* 修复：#overlay * 的优先级高于 .roomNavLayer，会把整层房间按钮层变成透明遮罩，挡住花市买卖按钮 */
#overlay .roomNavLayer{
  pointer-events:none!important;
}

#overlay .roomNavLayer .navBtn{
  pointer-events:auto!important;
}

#overlay .roomIdentity{
  pointer-events:none!important;
}

#overlay .roomIdentity .roomIdentityBar,
#overlay .roomIdentity button,
#overlay .roomIdentity .identityNoticePanel{
  pointer-events:auto!important;
}


/* =========================================================
   花房背景特效：柔光 / 花瓣 / 叶片
   背景氛围层，不影响点击，不遮挡顶部组件
========================================================= */
#flowerBgFx{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
  user-select:none;
  --fx-scale:var(--bg-ui-scale,1);
}

#flowerBgFx span{
  position:absolute;
  display:block;
  pointer-events:none;
  will-change:transform,opacity;
}

.fxGlow{
  width:calc(6px * var(--fx-scale));
  height:calc(6px * var(--fx-scale));
  border-radius:999px;
  background:rgba(255,226,154,.58);
  box-shadow:
    0 0 calc(10px * var(--fx-scale)) rgba(255,222,148,.48),
    0 0 calc(22px * var(--fx-scale)) rgba(255,241,190,.28);
  opacity:.18;
  animation:flowerGlowTwinkle 6.8s ease-in-out infinite;
}

.fxPetal,
.fxLeaf{
  line-height:1;
  text-shadow:
    0 1px 2px rgba(255,255,255,.72),
    0 3px 8px rgba(120,90,55,.12);
}

.fxPetal{
  color:rgba(232,139,162,.58);
  font-size:calc(15px * var(--fx-scale));
  opacity:.55;
  animation:flowerPetalDrift 18s linear infinite;
}

.fxLeaf{
  color:rgba(119,158,88,.50);
  font-size:calc(15px * var(--fx-scale));
  opacity:.48;
  animation:flowerLeafDrift 22s linear infinite;
}

.fxPetal.p1{left:13%; top:0%; animation-delay:-3s; animation-duration:20s;}
.fxPetal.p2{left:37%; top:-4%; animation-delay:-11s; animation-duration:23s; font-size:calc(12px * var(--fx-scale));}
.fxPetal.p3{left:61%; top:-2%; animation-delay:-7s; animation-duration:21s;}
.fxPetal.p4{left:84%; top:4%; animation-delay:-15s; animation-duration:24s; font-size:calc(13px * var(--fx-scale));}
.fxPetal.p5{left:72%; top:22%; animation-delay:-5s; animation-duration:26s; opacity:.42;}
.fxPetal.p6{left:48%; top:34%; animation-delay:-18s; animation-duration:25s; opacity:.38;}

.fxLeaf.l1{left:18%; top:16%; animation-delay:-6s; animation-duration:26s;}
.fxLeaf.l2{left:55%; top:8%; animation-delay:-15s; animation-duration:28s; font-size:calc(13px * var(--fx-scale));}
.fxLeaf.l3{left:89%; top:25%; animation-delay:-9s; animation-duration:30s; opacity:.42;}
.fxLeaf.l4{left:42%; top:58%; animation-delay:-20s; animation-duration:29s; opacity:.36;}

.fxGlow.g1{left:24%; top:20%; animation-delay:-.6s;}
.fxGlow.g2{left:46%; top:14%; animation-delay:-2.1s; transform:scale(1.35);}
.fxGlow.g3{left:69%; top:25%; animation-delay:-3.7s;}
.fxGlow.g4{left:35%; top:52%; animation-delay:-1.4s; transform:scale(.9);}
.fxGlow.g5{left:76%; top:63%; animation-delay:-4.3s; transform:scale(1.15);}


@keyframes flowerGlowTwinkle{
  0%,100%{opacity:.10; transform:scale(.72);}
  42%{opacity:.68; transform:scale(1.18);}
  68%{opacity:.28; transform:scale(.95);}
}

@keyframes flowerPetalDrift{
  0%{transform:translate3d(0,-12vh,0) rotate(0deg) scale(.86); opacity:0;}
  12%{opacity:.52;}
  42%{transform:translate3d(2.4vw,34vh,0) rotate(130deg) scale(1); opacity:.52;}
  74%{transform:translate3d(-1.8vw,68vh,0) rotate(255deg) scale(.92); opacity:.36;}
  100%{transform:translate3d(1vw,98vh,0) rotate(330deg) scale(.82); opacity:0;}
}

@keyframes flowerLeafDrift{
  0%{transform:translate3d(0,-10vh,0) rotate(-22deg) scale(.82); opacity:0;}
  16%{opacity:.46;}
  50%{transform:translate3d(-2.8vw,38vh,0) rotate(70deg) scale(1); opacity:.42;}
  100%{transform:translate3d(2vw,96vh,0) rotate(190deg) scale(.86); opacity:0;}
}


@media(max-width:540px){
  #flowerBgFx{
    position:fixed;
    z-index:1;
    --fx-scale:1;
  }

  .fxPetal.p5,
  .fxPetal.p6,
  .fxLeaf.l3,
  .fxLeaf.l4,
  .fxGlow.g4,
  .fxGlow.g5{
    display:none;
  }
}

@media(prefers-reduced-motion:reduce){
  #flowerBgFx{
    display:none;
  }
}

/* =========================================================
   房间按钮组件
========================================================= */
.roomNavLayer{
  position:absolute;
  inset:0;
  z-index:55;
  pointer-events:none;
  --s:var(--room-nav-scale,1);
  --nav-btn-radius:calc(15px * var(--s));
  --nav-btn-font:calc(15px * var(--s));
  --nav-btn-border:calc(1px * var(--s));
  --nav-btn-shadow-y:calc(3px * var(--s));
  --nav-btn-shadow-blur:calc(8px * var(--s));
}

.navBtn{
  appearance:none;
  border:none;
  cursor:pointer;
  position:absolute;
  top:var(--room-nav-top);
  width:var(--room-nav-btn-width);
  height:var(--room-nav-btn-height);
  min-width:0;
  min-height:0;
  padding:0;
  border-radius:var(--nav-btn-radius);
  color:var(--room-nav-text);
  font-size:var(--nav-btn-font);
  font-weight:900;
  white-space:nowrap;
  overflow:visible;
  isolation:isolate;
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.56), transparent 40%),
    radial-gradient(circle at 78% 74%, var(--room-nav-wash), transparent 48%),
    linear-gradient(180deg, var(--room-nav-paper) 0%, var(--room-nav-paper-2) 100%);
  border:var(--nav-btn-border) solid var(--room-nav-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.64),
    0 calc(2px * var(--s)) calc(7px * var(--s)) rgba(96,70,48,.10);
  text-shadow:0 calc(1px * var(--s)) 0 rgba(255,255,255,.38);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,filter .18s ease;
  font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
  pointer-events:auto;
}

.navBtn[data-room="hall"]{left:var(--room-nav-hall-left);}
.navBtn[data-room="living"]{left:var(--room-nav-living-left);}
.navBtn[data-room="manager"]{left:var(--room-nav-manager-left);}
.navBtn[data-room="honor"]{left:var(--room-nav-honor-left);}
.navBtn[data-room="studio"]{left:var(--room-nav-studio-left);}
.navBtn[data-room="game"]{left:var(--room-nav-game-left);}
.navBtn[data-room="dorm"]{left:var(--room-nav-dorm-left);}
.navBtn[data-room="flower"]{left:var(--room-nav-flower-left);}
.navBtn[data-room="pets"]{left:var(--room-nav-pets-left);}

.navBtn:not(.is-current):hover,
.navBtn:not(.is-current):focus-visible{
  color:#5f3d22;
  background:
    radial-gradient(circle at 20% 24%, rgba(255,255,255,.66), transparent 42%),
    radial-gradient(circle at 80% 78%, rgba(207,170,143,.24), transparent 50%),
    linear-gradient(180deg, rgba(255,252,246,.88) 0%, rgba(239,226,210,.82) 100%);
  border-color:rgba(151,112,84,.36);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.70),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.12);
  filter:saturate(1.02);
}

.navBtn.is-current{
  cursor:default;
  color:var(--room-nav-current-text);
  background:
    radial-gradient(circle at 22% 22%, rgba(255,255,255,.62), transparent 42%),
    radial-gradient(circle at 80% 80%, rgba(190,151,126,.26), transparent 50%),
    linear-gradient(180deg, rgba(246,235,222,.94) 0%, var(--room-nav-current-bg) 100%);
  border-color:var(--room-nav-current-border);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,.68),
    0 calc(3px * var(--s)) calc(9px * var(--s)) rgba(96,70,48,.13),
    0 0 0 calc(2px * var(--s)) rgba(255,253,248,.46);
  filter:none;
}

.navLabel{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  white-space:nowrap;
  line-height:normal;
  padding-top:.06em;
}

.navEffect{
  position:absolute;
  pointer-events:none;
  opacity:0;
  z-index:4;
  display:block;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.82),
    0 0 calc(8px * var(--s)) rgba(255,246,210,.52);
  filter:saturate(.95);
}

.navEffectA{left:8%;top:-54%;font-size:calc(var(--nav-btn-font) * .92);}
.navEffectB{right:8%;top:-62%;font-size:calc(var(--nav-btn-font) * .86);}
.navEffectC{left:50%;top:-72%;transform:translateX(-50%);font-size:calc(var(--nav-btn-font) * 1.02);}

@keyframes navFloatA{
  0%,100%{ transform:translateY(calc(4px * var(--s))) rotate(-8deg) scale(.82); opacity:0; }
  20%,72%{ opacity:.86; }
  50%{ transform:translateY(calc(-5px * var(--s))) rotate(6deg) scale(1); opacity:.76; }
}
@keyframes navFloatB{
  0%,100%{ transform:translateY(calc(5px * var(--s))) rotate(9deg) scale(.78); opacity:0; }
  24%,70%{ opacity:.78; }
  52%{ transform:translateY(calc(-6px * var(--s))) rotate(-7deg) scale(1); opacity:.68; }
}
@keyframes navFloatC{
  0%,100%{ transform:translateX(-50%) translateY(calc(6px * var(--s))) rotate(0deg) scale(.76); opacity:0; }
  24%,70%{ opacity:.88; }
  50%{ transform:translateX(-50%) translateY(calc(-6px * var(--s))) rotate(2deg) scale(1); opacity:.78; }
}

.navBtn:not(.is-current):hover .navEffectA,
.navBtn:not(.is-current):focus-visible .navEffectA{animation:navFloatA 2.2s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectB,
.navBtn:not(.is-current):focus-visible .navEffectB{animation:navFloatB 2.5s ease-in-out infinite;}
.navBtn:not(.is-current):hover .navEffectC,
.navBtn:not(.is-current):focus-visible .navEffectC{animation:navFloatC 2.35s ease-in-out infinite;}
.navBtn.is-current .navEffect{display:none;}

.navBtn[data-room="hall"] .navEffect{color:rgba(255,205,96,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.95),0 0 calc(10px * var(--s)) rgba(255,215,105,.62);}
.navBtn[data-room="manager"] .navEffect{color:rgba(128,91,58,.82);}
.navBtn[data-room="honor"] .navEffect{color:rgba(205,143,45,.86);text-shadow:0 calc(1px * var(--s)) calc(2px * var(--s)) rgba(255,250,232,.92),0 0 calc(8px * var(--s)) rgba(255,220,130,.52);}
.navBtn[data-room="game"] .navEffect{color:rgba(117,91,150,.82);}
.navBtn[data-room="studio"] .navEffect{color:rgba(96,112,145,.84);}
.navBtn[data-room="living"] .navEffect{color:rgba(202,132,70,.82);}
.navBtn[data-room="dorm"] .navEffect{color:rgba(148,112,171,.78);}
.navBtn[data-room="pets"] .navEffect{color:rgba(131,111,78,.82);}
.navBtn[data-room="flower"] .navEffect{color:rgba(198,119,145,.82);}

/* =========================================================
   身份组件
========================================================= */
.roomIdentity{
  --s:var(--identity-scale,1);
  position:absolute;
  right:var(--identity-right);
  top:var(--identity-top);
  width:calc(var(--identity-base-width) * 1px * var(--s));
  height:calc(var(--identity-base-height) * 1px * var(--s));
  min-width:calc(var(--identity-base-width) * 1px * var(--s));
  min-height:calc(var(--identity-base-height) * 1px * var(--s));
  z-index:70;
  pointer-events:none;
  overflow:visible;
}

.roomIdentityBar{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:minmax(calc(130px * var(--s)),1fr) calc(30px * var(--s)) calc(42px * var(--s));
  gap:calc(5px * var(--s));
  padding:calc(4px * var(--s)) calc(5px * var(--s));
  border-radius:calc(13px * var(--s));
  background:var(--identity-bg);
  border:calc(1px * var(--s)) solid var(--identity-border);
  box-shadow:
    0 calc(10px * var(--s)) calc(24px * var(--s)) var(--identity-shadow),
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.9);
  backdrop-filter:blur(calc(8px * var(--s)));
  -webkit-backdrop-filter:blur(calc(8px * var(--s)));
  pointer-events:auto;
  overflow:visible;
  white-space:nowrap;
}

.identityNameBox,
.identityNoticeBtn,
.identityAuthBtn{
  min-width:0;
  min-height:0;
  height:100%;
  border-radius:calc(9px * var(--s));
  background:var(--identity-inner-bg);
  color:var(--identity-text);
  border:calc(1px * var(--s)) solid rgba(160,116,78,0.12);
  box-shadow:
    inset 0 calc(1px * var(--s)) 0 rgba(255,255,255,0.95),
    0 calc(1px * var(--s)) calc(4px * var(--s)) rgba(112,83,52,0.05);
}

.identityNameBox{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 calc(8px * var(--s));
  overflow:visible;
}

.identityNameText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  max-width:100%;
  color:var(--identity-text);
  font-size:calc(13px * var(--s));
  font-weight:850;
  line-height:1.22;
  letter-spacing:0;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
  transform:translateY(var(--identity-name-y));
}

.identityNameText.isOverflowSafe{overflow:hidden;text-overflow:ellipsis;}

.identityNoticeWrap{
  position:relative;
  width:100%;
  height:100%;
  overflow:visible;
}

.identityNoticeBtn,
.identityAuthBtn{
  appearance:none;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}

.identityNoticeBtn{
  width:100%;
  height:100%;
  font-size:calc(14px * var(--s));
}

.identityNoticeIcon{
  display:flex;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  line-height:1;
  transform:translateY(var(--identity-notice-y));
  filter:drop-shadow(0 calc(1px * var(--s)) 0 rgba(255,255,255,0.55));
}

.identityNoticeCount{
  position:absolute;
  right:calc(-6px * var(--s));
  top:calc(-6px * var(--s));
  min-width:calc(18px * var(--s));
  height:calc(18px * var(--s));
  padding:0 calc(5px * var(--s));
  border-radius:999px;
  background:#b98f72;
  color:#fffaf6;
  font-size:calc(9px * var(--s));
  font-weight:900;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  border:calc(2px * var(--s)) solid rgba(255,248,239,0.98);
  box-shadow:0 calc(2px * var(--s)) calc(8px * var(--s)) rgba(116,86,54,0.16);
  z-index:3;
}

.identityNoticeBtn.hasNotice + .identityNoticeCount{display:flex;}

.identityAuthBtn{
  width:100%;
  height:100%;
  color:#6f5746;
  font-size:calc(12px * var(--s));
  font-weight:850;
  line-height:1.18;
  white-space:nowrap;
  overflow:visible;
}

.identityAuthText{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.18;
  transform:translateY(var(--identity-button-y));
}

.identityNoticeBtn:hover,
.identityAuthBtn:hover{
  transform:translateY(calc(-1px * var(--s)));
  background:rgba(255,255,255,0.94);
}

.identityNoticePanel{
  position:absolute;
  top:calc(100% + 10px * var(--s));
  right:0;
  width:min(calc(360px * var(--s)),72vw);
  max-height:min(calc(540px * var(--s)),70vh);
  overflow:auto;
  padding:calc(12px * var(--s));
  border-radius:calc(16px * var(--s));
  background:rgba(255,249,241,0.98);
  border:calc(1px * var(--s)) solid rgba(203,167,123,0.28);
  box-shadow:0 calc(16px * var(--s)) calc(36px * var(--s)) rgba(85,58,34,0.16);
  display:none;
  z-index:80;

/* =========================
   统一奖励弹窗（来自独立测试页）
========================= */

.reward-mask {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(64, 45, 30, 0.30);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  --reward-scale: var(--reward-modal-scale, 1);
}

.reward-mask.show {
  display: flex!important;
}

.reward-card {
  position: relative;
  width: min(calc(430px * var(--reward-scale)), calc(100vw - 28px));
  max-height: calc(100dvh - 28px);
  padding:
    calc(28px * var(--reward-scale))
    calc(24px * var(--reward-scale))
    calc(22px * var(--reward-scale));
  border-radius: calc(26px * var(--reward-scale));
  overflow: hidden auto;
  text-align: center;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 16%, rgba(255,226,235,.68), transparent 30%),
    radial-gradient(circle at 86% 18%, rgba(255,240,181,.62), transparent 32%),
    linear-gradient(180deg, rgba(255,253,247,.98), rgba(255,244,226,.96));
  border: calc(2px * var(--reward-scale)) solid var(--line);
  box-shadow:
    0 calc(22px * var(--reward-scale)) calc(54px * var(--reward-scale)) var(--card-shadow),
    inset 0 1px 0 rgba(255,255,255,.9);
  animation: rewardPop .42s cubic-bezier(.2, 1.12, .34, 1) both;
}

.reward-card::before,
.reward-card::after {
  position: absolute;
  left: calc(12px * var(--reward-scale));
  right: calc(12px * var(--reward-scale));
  font-size: calc(15px * var(--reward-scale));
  letter-spacing: calc(8px * var(--reward-scale));
  white-space: nowrap;
  overflow: hidden;
  pointer-events: none;
}

.reward-card::before {
  content: "✿  ❀  ✽  ✿  ❀  ✽  ✿";
  top: calc(9px * var(--reward-scale));
  color: rgba(209, 120, 148, 0.52);
}

.reward-card::after {
  content: "✿  ❀  ✽  ✿  ❀  ✽  ✿";
  bottom: calc(8px * var(--reward-scale));
  color: rgba(199, 145, 75, 0.44);
}

@keyframes rewardPop {
  0% {
    opacity: 0;
    transform: translateY(calc(12px * var(--reward-scale))) scale(.9);
  }
  64% {
    opacity: 1;
    transform: translateY(0) scale(1.025);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.reward-close {
  position: absolute;
  z-index: 6;
  top: calc(12px * var(--reward-scale));
  right: calc(12px * var(--reward-scale));
  width: calc(30px * var(--reward-scale));
  height: calc(30px * var(--reward-scale));
  border: none;
  border-radius: 999px;
  background: rgba(255,250,242,.88);
  color: #7b5636;
  font-size: calc(18px * var(--reward-scale));
  font-weight: 900;
  line-height: 1;
  cursor: pointer;
  box-shadow:
    0 calc(2px * var(--reward-scale)) calc(8px * var(--reward-scale)) rgba(105,75,43,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.reward-close:hover {
  filter: brightness(1.02);
}

.reward-petals {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.reward-petals span {
  position: absolute;
  top: calc(-18px * var(--reward-scale));
  color: rgba(220,132,154,.56);
  font-size: calc(16px * var(--reward-scale));
  opacity: 0;
  text-shadow:
    0 calc(2px * var(--reward-scale)) calc(4px * var(--reward-scale)) rgba(255,255,255,.76);
  animation: rewardPetalFall 1.35s ease-in-out both;
}

.reward-petals span:nth-child(1) { left: 12%; animation-delay: .05s; }
.reward-petals span:nth-child(2) { left: 28%; animation-delay: .18s; }
.reward-petals span:nth-child(3) { left: 48%; animation-delay: .02s; }
.reward-petals span:nth-child(4) { left: 66%; animation-delay: .22s; }
.reward-petals span:nth-child(5) { left: 82%; animation-delay: .10s; }

@keyframes rewardPetalFall {
  0% {
    opacity: 0;
    transform: translateY(calc(-14px * var(--reward-scale))) rotate(0deg) scale(.78);
  }
  20% {
    opacity: .85;
  }
  100% {
    opacity: 0;
    transform: translateY(calc(145px * var(--reward-scale))) rotate(160deg) scale(1);
  }
}

.reward-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.reward-icon {
  width: calc(62px * var(--reward-scale));
  height: calc(62px * var(--reward-scale));
  margin:
    calc(4px * var(--reward-scale))
    auto
    calc(12px * var(--reward-scale));
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,246,226,.78);
  border: 1px solid rgba(220,164,102,.25);
  box-shadow:
    0 calc(8px * var(--reward-scale)) calc(20px * var(--reward-scale)) rgba(126,92,51,.10),
    inset 0 1px 0 rgba(255,255,255,.85);
  font-size: calc(34px * var(--reward-scale));
}

.reward-label {
  min-height: calc(25px * var(--reward-scale));
  padding: 0 calc(13px * var(--reward-scale));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: rgba(255,249,232,.66);
  border: 1px solid rgba(218,166,87,.20);
  color: #b26a3a;
  font-size: calc(13px * var(--reward-scale));
  font-weight: 950;
  line-height: 1;
  letter-spacing: .06em;
  animation: rewardStamp .42s ease both;
}

.reward-title {
  position: relative;
  max-width: 100%;
  margin:
    calc(10px * var(--reward-scale))
    auto
    calc(8px * var(--reward-scale));
  padding:
    calc(8px * var(--reward-scale))
    calc(18px * var(--reward-scale));
  border-radius: 999px;
  color: var(--ink);
  font-size: calc(22px * var(--reward-scale));
  font-weight: 950;
  line-height: 1.15;
  background: rgba(255,249,232,.72);
  border: 1px solid rgba(218,166,87,.24);
  box-shadow:
    0 calc(5px * var(--reward-scale)) calc(14px * var(--reward-scale)) rgba(126,92,51,.08),
    inset 0 1px 0 rgba(255,255,255,.82);
  overflow: hidden;
}

.reward-title::after {
  content: "";
  position: absolute;
  inset: -30% auto -30% -42%;
  width: 36%;
  background: linear-gradient(90deg, transparent, rgba(255,234,160,.80), transparent);
  transform: skewX(-18deg);
  animation: rewardSweep 1.25s ease .22s both;
}

@keyframes rewardStamp {
  0% {
    opacity: 0;
    transform: scale(1.12);
  }
  72% {
    opacity: 1;
    transform: scale(.97);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes rewardSweep {
  0% { left: -42%; }
  100% { left: 118%; }
}

.reward-desc {
  width: 100%;
  max-width: calc(330px * var(--reward-scale));
  margin: 0 auto calc(14px * var(--reward-scale));
  color: var(--text);
  font-size: calc(13px * var(--reward-scale));
  line-height: 1.65;
  text-align: center;
  white-space: pre-line;
}

.reward-section-title {
  margin: 0 0 calc(10px * var(--reward-scale));
  color: #8a5c33;
  font-size: calc(12px * var(--reward-scale));
  font-weight: 950;
  line-height: 1;
  letter-spacing: .08em;
}

.reward-list {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  justify-content: center;
  gap: calc(8px * var(--reward-scale));
  margin: 0 0 calc(16px * var(--reward-scale));
}

.reward-list.count-1 {
  grid-template-columns: minmax(0, calc(120px * var(--reward-scale)));
}

.reward-list.count-2 {
  grid-template-columns: repeat(2, minmax(0, calc(120px * var(--reward-scale))));
}

.reward-list.empty {
  display: none;
}

.reward-section-title.empty {
  display: none;
}

.reward-item {
  min-width: 0;
  min-height: calc(84px * var(--reward-scale));
  padding:
    calc(10px * var(--reward-scale))
    calc(7px * var(--reward-scale))
    calc(9px * var(--reward-scale));
  border-radius: calc(16px * var(--reward-scale));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(255,252,247,.72);
  border: 1px solid var(--soft-line);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.82),
    0 calc(3px * var(--reward-scale)) calc(10px * var(--reward-scale)) rgba(116,86,54,.06);
  animation: rewardItemIn .38s ease both;
}

.reward-item:nth-child(1) { animation-delay: .14s; }
.reward-item:nth-child(2) { animation-delay: .24s; }
.reward-item:nth-child(3) { animation-delay: .34s; }
.reward-item:nth-child(4) { animation-delay: .44s; }

@keyframes rewardItemIn {
  0% {
    opacity: 0;
    transform: translateY(calc(8px * var(--reward-scale))) scale(.96);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.reward-item-icon {
  font-size: calc(28px * var(--reward-scale));
  line-height: 1;
  margin-bottom: calc(7px * var(--reward-scale));
  filter: drop-shadow(
    0 calc(2px * var(--reward-scale))
    calc(3px * var(--reward-scale))
    rgba(96,65,35,.12)
  );
}

.reward-item-name {
  width: 100%;
  color: #7b593b;
  font-size: calc(11px * var(--reward-scale));
  font-weight: 900;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reward-item-amount {
  margin-top: calc(3px * var(--reward-scale));
  color: var(--ink);
  font-size: calc(13px * var(--reward-scale));
  font-weight: 950;
  line-height: 1.2;
  white-space: nowrap;
}

.reward-confirm {
  min-width: calc(132px * var(--reward-scale));
  height: calc(36px * var(--reward-scale));
  border: 1px solid rgba(153,104,62,.22);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,238,200,.96), rgba(227,187,132,.90));
  color: #67401f;
  font-size: calc(13px * var(--reward-scale));
  font-weight: 950;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.72),
    0 calc(4px * var(--reward-scale)) calc(12px * var(--reward-scale)) rgba(112,80,42,.10);
}

.reward-confirm:hover {
  filter: brightness(1.02);
}

/* 不同类型轻微换色 */

function setRewardModalScaleForViewport(displayWidth){
  let scale;

  if(isTinyScreen()){
    scale = Math.max(0.58, Math.min(0.82, (window.innerWidth - 56) / 430));
  }else{
    const width = Number(displayWidth || window.innerWidth || 900);
    scale = Math.max(0.58, Math.min(1.15, width / 900));
  }

  root.style.setProperty("--reward-modal-scale", String(scale));
}

function clearDesktopOverlayStyles(){
  if(!overlay) return;

  overlay.style.left = "";
  overlay.style.top = "";
  overlay.style.width = "";
  overlay.style.height = "";

  root.style.setProperty("--bg-ui-scale","1");
  root.style.setProperty("--ui-scale","1");
  root.style.setProperty("--room-nav-scale","1");
  root.style.setProperty("--identity-scale","1");
  setRewardModalScaleForViewport();
}

function syncOverlayToImage(){
  if(isTinyScreen()){
    clearDesktopOverlayStyles();
    return;
  }

  if(!img || !img.naturalWidth || !img.naturalHeight || !bgFrame || !overlay) return;

  const frame = bgFrame.getBoundingClientRect();
  const frameRatio = frame.width / frame.height;
  const imageRatio = img.naturalWidth / img.naturalHeight;

  let displayWidth;
  let displayHeight;
  let displayLeft;
  let displayTop;

  if(frameRatio > imageRatio){
    displayHeight = frame.height;
    displayWidth = displayHeight * imageRatio;
    displayLeft = frame.left + (frame.width - displayWidth) / 2;
    displayTop = frame.top;
  }else{
    displayWidth = frame.width;
    displayHeight = displayWidth / imageRatio;
    displayLeft = frame.left;
    displayTop = frame.top + (frame.height - displayHeight) / 2;
  }

  overlay.style.left = `${displayLeft}px`;
  overlay.style.top = `${displayTop}px`;
  overlay.style.width = `${displayWidth}px`;
  overlay.style.height = `${displayHeight}px`;

  const scale = Math.max(0.45, Math.min(3.2, displayWidth / 1440));
  const navScale = Math.max(0.38, Math.min(3.2, displayWidth / 1440));

  root.style.setProperty("--bg-ui-scale", String(scale));
  root.style.setProperty("--ui-scale", String(scale));
  root.style.setProperty("--room-nav-scale", String(navScale));
  root.style.setProperty("--identity-scale", String(scale));
  setRewardModalScaleForViewport(displayWidth);
}

/* =========================================================

========================================================= */
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function roleLabel(role){
  const r = String(role || "").toLowerCase();
  if(r === "owner") return "维修工";
  if(r === "admin") return "宿管";
  if(r === "member") return "房客";
  if(r === "applying") return "申请中";
  return "参观者";
}

function normalizeLoginInput(value){
  return String(value || "").replace(/\u3000/g," ").trim();
}

function isLoggedIn(){
  return localStorage.getItem(STORAGE_KEYS.loggedIn) === "true";
}

function readLocalAuth(){
  authState.loggedIn = isLoggedIn();
  authState.nickname = String(localStorage.getItem(STORAGE_KEYS.user) || "").trim();
  authState.role = String(localStorage.getItem(STORAGE_KEYS.role) || "visitor").toLowerCase();
  authState.memberId = localStorage.getItem(STORAGE_KEYS.memberId) || null;
  authState.memberCode = localStorage.getItem(STORAGE_KEYS.memberCode) || null;

  return Boolean(authState.loggedIn && authState.nickname && authState.memberId);
}

function updateIdentity(member){
  readLocalAuth();

  const name = member?.nickname || authState.nickname || "";
  const role = roleLabel(member?.role || authState.role);

  if(!currentUserText || !identityAuthText) return;

  if(!name || !authState.loggedIn){
    currentUserText.textContent = "参观者";
    identityAuthText.textContent = "登录";
    return;
  }

  currentUserText.textContent = `${name}｜${role}`;
  identityAuthText.textContent = "登出";
}

function setupRoomNav(currentRoom){
  const buttons = document.querySelectorAll(".roomNavLayer .navBtn");
  const current = String(currentRoom || "").trim();

  buttons.forEach(btn => {
    const room = btn.dataset.room || "";
    const isCurrent = room === current;

    btn.classList.toggle("is-current", isCurrent);

    if(isCurrent){
      btn.setAttribute("aria-current","page");
      btn.setAttribute("tabindex","-1");
    }else{
      btn.removeAttribute("aria-current");
      btn.removeAttribute("tabindex");
    }

    btn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();

      if(btn.classList.contains("is-current")) return;

      if(btn.dataset.manager === "true"){
        enterManagerRoom();
        return;
      }

      enterRoom(btn.dataset.url, btn.dataset.login === "true");
    });
  });
}

async function login(){
  const nicknameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const msg = document.getElementById("loginMessage");

  const nickname = normalizeLoginInput(nicknameInput?.value);
  const key = normalizeLoginInput(passwordInput?.value);

  if(!msg) return;
  msg.innerText = "";
  msg.style.color = "#8b4a2d";

  if(!nickname || !key){
    msg.innerText = "还没填写完整呢";
    return;
  }

  try{
    const { data, error } = await supabaseClient.rpc("verify_member_login", {
      input_nickname:nickname,
      input_code:key
    });

    if(error){
      console.error("KEY 登录失败：", error);
      msg.innerText = `登录检查失败：${error.message || "请稍后再试"}`;
      return;
    }

    if(!Array.isArray(data) || data.length === 0){
      msg.innerText = "没有找到你的记录哎";
      return;
    }

    const user = data[0] || {};

    localStorage.setItem(STORAGE_KEYS.loggedIn,"true");
    localStorage.setItem(STORAGE_KEYS.user,user.nickname || nickname);
    localStorage.setItem(STORAGE_KEYS.role,user.role || "member");
    localStorage.setItem(STORAGE_KEYS.memberId,user.member_id || user.id || "");
    localStorage.setItem(STORAGE_KEYS.memberCode,key);

    let roleMessage = "登录成功";
    if(user.role === "owner") roleMessage = "维修工已上线";
    else if(user.role === "admin") roleMessage = "宿管已上线";
    else if(user.role === "member") roleMessage = "房客已登录";
    else if(user.role === "applying") roleMessage = "当前身份为申请中";

    msg.style.color = "#5f7d3a";
    msg.innerText = roleMessage;

    updateIdentity({
      nickname:user.nickname || nickname,
      role:user.role || "member"
    });
    await loadFlowerPage();

    setTimeout(() => {
      if(nicknameInput) nicknameInput.value = "";
      if(passwordInput) passwordInput.value = "";
      closeLogin();
    }, 650);
  }catch(e){
    console.error("login() 查询异常：", e);
    msg.innerText = `登录失败：${e?.message || "请稍后再试"}`;
  }
}

const rewardTypeMeta = {
  achievement:{ label:"成就达成", icon:"🏆" },
  title:{ label:"获得称号", icon:"🎖️" },
  daily:{ label:"日常奖励", icon:"☀️" },

  item:{ label:"道具获得", icon:"🧺" },
  gold:{ label:"金币奖励", icon:"🪙" }
};

const rewardIconMap = {
  金币:"🪙",
  水:"💧",
  肥料:"🌱",
  花种子:"🌰",
  种子:"🌱",
  宠物粮:"🥣",
  医疗卡:"💊",
  亲密度:"💗",
  道具:"🧺",
  成就:"🏆",
  称号:"🎖️"
};

function normalizeRewardItem(item){
  if(typeof item === "string"){
    return {
      name:item,
      amount:"",
      unit:"",
      icon:rewardIconMap[item] || "✨"
    };
  }

  return {
    name:item.name || "奖励",
    amount:item.amount ?? item.qty ?? "",
    unit:item.unit || "",
    icon:item.icon || rewardIconMap[item.name] || "✨",
    img:item.img || "",
    prefix:item.prefix || ""
  };
}

function formatRewardAmount(item){
  if(item.amount === "" || item.amount === null || item.amount === undefined){
    return "";
  }

  if(typeof item.amount === "number"){
    const sign = item.amount > 0 ? "+" : "";
    return `${sign}${item.amount}${item.unit || ""}`;
  }

  return `${item.prefix || ""}${item.amount}${item.unit || ""}`;
}

function renderRewards(rewards){
  const list = document.getElementById("rewardList");
  const sectionTitle = document.getElementById("rewardSectionTitle");
  if(!list || !sectionTitle) return;

  list.innerHTML = "";
  list.className = "reward-list";
  sectionTitle.className = "reward-section-title";

  if(!rewards.length){
    list.classList.add("empty");
    sectionTitle.classList.add("empty");
    return;
  }

  list.classList.add(`count-${Math.min(rewards.length, 3)}`);

  rewards.forEach(reward => {
    const item = document.createElement("div");
    item.className = "reward-item";

    const iconHtml = reward.img
      ? `<img src="${escapeHtml(reward.img)}" alt="" style="width:calc(30px * var(--reward-scale));height:calc(30px * var(--reward-scale));object-fit:contain;display:block;margin:0 auto calc(6px * var(--reward-scale));">`
      : `<div class="reward-item-icon">${escapeHtml(reward.icon)}</div>`;

    item.innerHTML = `
      ${iconHtml}
      <div class="reward-item-name">${escapeHtml(reward.name)}</div>
      <div class="reward-item-amount">${escapeHtml(formatRewardAmount(reward))}</div>
    `;

    list.appendChild(item);
  });
}

function showRewardModal(options={}){

  const type = options.type || "achievement";
  const meta = rewardTypeMeta[type] || rewardTypeMeta.achievement;
  const rewards = Array.isArray(options.rewards)
    ? options.rewards.map(normalizeRewardItem)
    : [];

  mask.dataset.type = type;

  const icon = document.getElementById("rewardIcon");
  const label = document.getElementById("rewardLabel");
  const title = document.getElementById("rewardTitle");
  const desc = document.getElementById("rewardDesc");
  const confirm = document.querySelector(".reward-confirm");

  if(icon) icon.textContent = options.icon || meta.icon;
  if(label) label.textContent = options.label || meta.label;
  if(title) title.textContent = options.title || "奖励已领取";
  if(desc) desc.textContent = options.desc || "奖励已经记录完成。";

  renderRewards(rewards);

  rewardConfirmHandler = typeof options.onConfirm === "function" ? options.onConfirm : null;

  if(confirm){
    confirm.disabled = false;
    confirm.style.display = options.hideConfirm ? "none" : "";
    confirm.textContent = options.confirmText || "收下奖励";
  }

  mask.classList.add("show");
  mask.style.display = "flex";
  mask.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

  if(options.autoCloseMs){
    flowerRewardAutoCloseTimer = setTimeout(() => {
      closeRewardModal();
    }, Number(options.autoCloseMs));
  }
}

  if(flowerRewardAutoCloseTimer){

  rewardConfirmHandler = null;
  mask.classList.remove("show");
  mask.style.display = "";
  mask.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

    icon:options.icon || (type === "title" ? "🏷️" : "🌷"),

    title:options.name || "新的解锁",

function formatTimeLeft(value){
  if(!value) return "--:--:--:--";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "--:--:--:--";
  const diff = date.getTime() - Date.now();
  if(diff <= 0) return "00:00:00:00";
  return formatDurationClock(diff, true);
}

function padClock(value){
  return String(Math.max(0, Math.floor(Number(value) || 0))).padStart(2, "0");
}

function formatDurationClock(diff, includeDays=true){
  const safeDiff = Math.max(0, Number(diff) || 0);
  const day = Math.floor(safeDiff / 86400000);
  const hour = Math.floor((safeDiff % 86400000) / 3600000);
  const minute = Math.floor((safeDiff % 3600000) / 60000);
  const second = Math.floor((safeDiff % 60000) / 1000);

  if(includeDays){
    return `${padClock(day)}:${padClock(hour)}:${padClock(minute)}:${padClock(second)}`;
  }

  const totalHours = Math.floor(safeDiff / 3600000);
  return `${padClock(totalHours)}:${padClock(minute)}:${padClock(second)}`;
}

function formatWitherCountdown(value){
  if(!value) return "--:--:--:--";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "--:--:--:--";

  const diff = date.getTime() - Date.now();
  if(diff <= 0) return "00:00:00:00";

  return formatDurationClock(diff, true);
}

function getNextMarketRefreshCountdown(){
  const now = new Date();
  const next = new Date(now);

  if(now.getHours() < 12){
    next.setHours(12, 0, 0, 0);
  }else{
    next.setDate(next.getDate() + 1);
    next.setHours(0, 0, 0, 0);
  }

  const diff = next.getTime() - now.getTime();
  if(diff <= 0) return "00:00:00";

  return formatDurationClock(diff, false);
}

function getRoundBoughtQuantity(row){
  const candidates = [
    row?.round_bought_quantity,
    row?.round_buy_quantity,
    row?.current_round_bought_quantity,
    row?.current_round_buy_quantity,
    row?.bought_quantity,
    row?.buy_quantity,
    row?.purchased_quantity,
    row?.round_purchased_quantity
  ];

  for(const value of candidates){
    const n = Number(value);
    if(Number.isFinite(n) && n >= 0) return Math.floor(n);
  }

  return Math.max(0, Number(row?.owned_quantity) || 0);
}

function getRemainingBuyQuantity(row){
  return Math.max(0, 5 - getRoundBoughtQuantity(row || {}));
}

function getSellableQuantity(row){
  if(!row || typeof row !== "object") return 0;

  const candidates = [
    row?.sellable_quantity,
    row?.current_sellable_quantity,
    row?.available_sell_quantity,
    row?.sellable_owned_quantity,
    row?.ready_sell_quantity,
    row?.owned_quantity
  ];

  for(const value of candidates){
    const n = Number(value);
    if(Number.isFinite(n) && n >= 0) return Math.floor(n);
  }

  return 0;
}

function clearMarketTipTimers(clearResume=true){
  marketTipCycleId += 1;

  if(marketTipTimer){
    clearInterval(marketTipTimer);
    marketTipTimer = null;
  }

  if(clearResume && marketTipResumeTimer){
    clearTimeout(marketTipResumeTimer);
    marketTipResumeTimer = null;
  }
}

function updateMarketTipText(tipEl, tips, nextIndex, animate=true){
  if(!tipEl || !Array.isArray(tips) || !tips.length) return;

  marketTipIndex = ((Number(nextIndex) || 0) % tips.length + tips.length) % tips.length;
  const text = tips[marketTipIndex] || "";

  if(!animate){
    tipEl.classList.remove("isChanging");
    tipEl.textContent = text;
    return;
  }

  const cycleId = marketTipCycleId;
  tipEl.classList.add("isChanging");

  setTimeout(() => {
    if(cycleId !== marketTipCycleId) return;
    tipEl.textContent = text;
    tipEl.classList.remove("isChanging");
  }, 260);
}

function startMarketTipRotator(options={}){
  const tipEl = document.getElementById("marketTipText");
  if(!tipEl) return;

  clearMarketTipTimers();

  const tips = getMarketTips();
  if(!tips.length){
    tipEl.textContent = "";
    tipEl.classList.remove("isChanging");
    return;
  }

  if(!options.preserveIndex){
    marketTipIndex = 0;
  }

  updateMarketTipText(tipEl, tips, marketTipIndex, false);

  if(tips.length <= 1) return;

  const cycleId = marketTipCycleId;
  marketTipTimer = setInterval(() => {
    if(cycleId !== marketTipCycleId) return;
    updateMarketTipText(tipEl, tips, marketTipIndex + 1, true);
  }, 3200);
}

function showMarketOperationMessage(message, isError=false, holdMs=7200){
  /*
    操作结果只显示在下方状态提示框，避免和上方滚动小提示重复。
    滚动提示暂停一段时间后会按当前最新提示列表继续轮播，不会卡在某一条旧提示。
    普通提示刷新节奏应短于操作提示停留时间，避免用户觉得滚动条停太久。
  */
  showBoxMessage(marketMessage, message, isError);

  const tipEl = document.getElementById("marketTipText");
  if(!tipEl || !message) return;

  const holdTime = Math.max(5200, Number(holdMs) || 7200);
  clearMarketTipTimers();

  const tips = getMarketTips();
  if(tips.length){
    updateMarketTipText(tipEl, tips, marketTipIndex, false);
  }

  marketTipResumeTimer = setTimeout(() => {
    marketTipResumeTimer = null;

    if(marketMessage && marketMessage.textContent === String(message || "")){
      showBoxMessage(marketMessage, "");
    }

    startMarketTipRotator({ preserveIndex:true });
  }, holdTime);
}

function setMarketMaxQuantity(flowerKey){
  const key = String(flowerKey || "");
  const row = getMarketRow(key);
  const displayName = getFlowerDisplayName(row || { flower_key:key });
  const owned = Math.max(0, Math.floor(Number(row?.owned_quantity) || 0));
  const sellable = getSellableQuantity(row);
  const remainingBuy = row ? getRemainingBuyQuantity(row) : 5;

  /*
    「5朵」是快速填数量，不直接决定买入或卖出。
    优先按当前背包/可卖数量填入，解决拥有 4 朵时点击「5朵」没有自动变成 4 的问题；
    如果当前没有花可卖，再按本轮还能买入的最大数量填入。
  */
  let target = 1;
  let message = "";

  if(owned > 0 || sellable > 0){
    target = Math.min(5, Math.max(sellable, owned));
    if(target < 5){
      message = `${displayName}当前最多可选 ${target} 朵，已自动填入最大数量。`;
    }
  }else{
    target = Math.min(5, Math.max(0, remainingBuy));
    if(remainingBuy <= 0){
      target = 1;
      message = `${displayName}这一轮已经买满啦，现在还能买 0 朵。`;
    }
  }

  setMarketQuantityInput(key, target);

  if(message){
    showMarketOperationMessage(message, remainingBuy <= 0 && owned <= 0 && sellable <= 0, 7600);
  }
}
function setFlowerResources(seedQuantity, waterQuantity, fertilizerQuantity){
  const seed = Math.max(0, Number(seedQuantity) || 0);
  const water = Math.max(0, Number(waterQuantity) || 0);
  const fertilizer = Math.max(0, Number(fertilizerQuantity) || 0);

  flowerState.resources.seed = seed;
  flowerState.resources.water = water;
  flowerState.resources.fertilizer = fertilizer;
}

function getFlowerResources(){
  return {
    seed:Math.max(0, Number(flowerState.resources.seed) || 0),
    water:Math.max(0, Number(flowerState.resources.water) || 0),
    fertilizer:Math.max(0, Number(flowerState.resources.fertilizer) || 0)
  };
}

function updateFlowerResourcesFromRow(row, refreshUI=true){
  if(!row || typeof row !== "object") return false;

  const hasSeed = Object.prototype.hasOwnProperty.call(row, "seed_quantity");
  const hasWater = Object.prototype.hasOwnProperty.call(row, "water_quantity");
  const hasFertilizer = Object.prototype.hasOwnProperty.call(row, "fertilizer_quantity");

  if(!hasSeed && !hasWater && !hasFertilizer) return false;

  const current = getFlowerResources();

  setFlowerResources(
    hasSeed ? row.seed_quantity : current.seed,
    hasWater ? row.water_quantity : current.water,
    hasFertilizer ? row.fertilizer_quantity : current.fertilizer
  );

  if(refreshUI){
    updatePotResourceNumbers(false);
  }

  return true;
}

              <div class="flowerMetaLine"><span>本轮变化</span><strong>${getPriceChangeHtml(row.price_change)}</strong></div>
              <div class="flowerMetaLine"><span>我拥有</span><strong>${owned} 朵</strong></div>
              <div class="flowerMetaLine"><span>枯萎倒计时</span><strong data-wither-countdown="${escapeHtml(row.earliest_wither_at || "")}">${formatWitherCountdown(row.earliest_wither_at)}</strong></div>
            </div>
            <div class="flowerQtyBox">
              <span class="flowerQtyLabel">数量</span>
              <input class="flowerQtyInput" data-flower-qty="${escapeHtml(row.flower_key)}" type="number" min="1" max="5" step="1" value="1" inputmode="numeric" aria-label="${escapeHtml(displayName)}买入数量">
              <button class="flowerQtyFiveBtn" type="button" onclick="setMarketMaxQuantity('${escapeHtml(row.flower_key)}')" aria-label="将${escapeHtml(displayName)}数量设为当前最大可用数量">5朵</button>
            </div>
            <div class="flowerActions">
              <button class="flowerActionBtn" type="button" onclick="buyFlower('${escapeHtml(row.flower_key)}', getMarketQuantity('${escapeHtml(row.flower_key)}'))">买入</button>
              <button class="flowerActionBtn" type="button" ${canSell ? "" : "data-disabled=\"true\" disabled"} onclick="sellFlower('${escapeHtml(row.flower_key)}', getMarketQuantity('${escapeHtml(row.flower_key)}'))">卖出</button>
            </div>
          </article>
        `;
      }).join("")}
    </div>
    <div class="flowerMarketNote" id="marketTipText">${escapeHtml(getMarketLimitNote())}</div>
  `;
  renderFlowerBundleInventory(false);
  startWitherCountdownTimer();
  startMarketTipRotator();
}

function updatePotResourceNumbers(loggedOut=false){
  const resources = getFlowerResources();
  const seedText = loggedOut ? "0" : String(resources.seed);
  const waterText = loggedOut ? "0" : String(resources.water);
  const fertilizerText = loggedOut ? "0" : String(resources.fertilizer);

  if(potSeedCount) potSeedCount.textContent = seedText;
  if(potWaterCount) potWaterCount.textContent = waterText;
  if(potFertCount) potFertCount.textContent = fertilizerText;

  renderFlowerBundleInventory(loggedOut);
}

function renderPotEmpty(desc="当前是空花盆。", loggedOut=false){
  if(potImage) potImage.src = "pot-empty.png";
  if(potStatusTitle) potStatusTitle.textContent = "空花盆";
  if(potStatusDesc) potStatusDesc.textContent = desc;

  updatePotResourceNumbers(loggedOut);

  if(potActions){
    potActions.className = "potActions single";
    potActions.innerHTML = loggedOut
      ? `<button class="potActionBtn" type="button" onclick="openLogin()"><span class="potActionContent">登录后种花</span></button>`
      : `<button class="potActionBtn" type="button" onclick="plantSeed()"><span class="potActionContent"><img class="potActionIcon" src="seed.png" alt="">种下种子</span></button>`;
  }

  showBoxMessage(potMessage, "");
}

function renderPot(row){
  const pot = row || {};
  const displayStatus = pot.display_status || pot.status || "empty";

  if(displayStatus === "empty"){
    renderPotEmpty("花盆空着，可以种下一颗种子。", false);
    return;
  }

  if(potImage) potImage.src = pot.display_img || "pot-empty.png";
  updatePotResourceNumbers(false);

  if(displayStatus === "growing"){
    if(potStatusTitle) potStatusTitle.textContent = "种植中";
    if(potStatusDesc){
      potStatusDesc.innerHTML = `
        <span class="potStatusDescLine">它正在慢慢长大。</span>
        <span class="potStatusDescLine">距离准备好大约还有：${formatTimeLeft(pot.mature_at)}</span>
      `;
    }
    if(potActions){
      const waterDisabled = getDailyCareRemaining("water") <= 0;
      const fertilizerDisabled = getDailyCareRemaining("fertilizer") <= 0;
      potActions.className = "potActions";
      potActions.innerHTML = `
        <button class="potActionBtn" type="button" ${waterDisabled ? "data-disabled=\"true\" disabled" : ""} onclick="careFlowerPot('water')" title="每天最多浇水 3 次"><span class="potActionContent"><img class="potActionIcon" src="water.png" alt="">浇水</span></button>
        <button class="potActionBtn" type="button" ${fertilizerDisabled ? "data-disabled=\"true\" disabled" : ""} onclick="careFlowerPot('fertilizer')" title="每天最多施肥 3 次"><span class="potActionContent"><img class="potActionIcon" src="fert.png" alt="">施肥</span></button>
      `;
    }
    showBoxMessage(potMessage, "");
    return;
  }

  if(displayStatus === "ready"){
    if(potStatusTitle) potStatusTitle.textContent = "可以收获了";
    if(potStatusDesc) potStatusDesc.textContent = "它已经准备好啦，点击收获看看这次开出了什么花。";
    if(potActions){
      potActions.className = "potActions single";
      potActions.innerHTML = `<button class="potActionBtn" type="button" onclick="harvestFlowerPot()"><span class="potActionContent">收获</span></button>`;
    }
    showBoxMessage(potMessage, "");
    return;
  }

  if(displayStatus === "withered"){
    if(potStatusTitle) potStatusTitle.textContent = "花盆枯萎了";
    if(potStatusDesc) potStatusDesc.textContent = "这次没能正常收获，清理后可以重新种下一颗种子。";
    if(potActions){
      potActions.className = "potActions single";
      potActions.innerHTML = `<button class="potActionBtn" type="button" onclick="clearWitheredFlowerPot()"><span class="potActionContent">清理花盆</span></button>`;
    }
    showBoxMessage(potMessage, "");
  }
}

async function loadMemberGold(){
  const auth = getFlowerAuth();
  if(!auth){
    if(flowerGoldPill) flowerGoldPill.textContent = "金币：--";
    return null;
  }

  const { data, error } = await supabaseClient
    .from("members")
    .select("gold_balance")
    .eq("id", auth.memberId)
    .eq("member_code", auth.memberCode)
    .maybeSingle();

  if(error){
    console.warn("读取金币失败：", error);
    if(flowerGoldPill) flowerGoldPill.textContent = "金币：读取失败";
    return null;
  }

  const gold = Number(data?.gold_balance) || 0;
  flowerState.goldBalance = gold;
  if(flowerGoldPill) flowerGoldPill.textContent = `金币：${gold}`;
  return gold;
}

async function loadFlowerMarket(){
  const auth = getFlowerAuth();

  if(!auth){
    renderLoggedOutFlower();
    return;
  }

  try{
    const { data, error } = await supabaseClient.rpc("get_flower_market", {
      p_member_id:auth.memberId,
      p_member_code:auth.memberCode,
      p_timezone_offset_minutes:auth.timezoneOffset
    });

    if(error) throw error;

    flowerState.marketRows = Array.isArray(data) ? data : [];

    showBoxMessage(marketMessage, "");

    console.error("读取花市失败：", err);

  }
}

async function loadFlowerPot(){
  const auth = getFlowerAuth();

  if(!auth){
    renderPotEmpty("登录后可以种下一颗种子。", true);
    return;
  }

  try{
    const { data, error } = await supabaseClient.rpc("get_flower_pot_status", {
      p_member_id:auth.memberId,
      p_member_code:auth.memberCode
    });

    renderPot(row);

    showBoxMessage(potMessage, err?.message || "花盆状态读取失败，请稍后再试。", true);

async function loadFlowerPage(){
  readLocalAuth();

  if(!authState.loggedIn || !authState.memberId || !authState.memberCode){
    renderLoggedOutFlower();
    if(authState.loggedIn && authState.memberId && !authState.memberCode){
      showBoxMessage(marketMessage, "花房需要重新登录一次，才能进行真实买卖和种植。", true);
      showBoxMessage(potMessage, "请先登出后重新登录。", true);
    }
    return;
  }

  const firstVisitClaimed = await hasClaimedFirstVisitReward();
  const skipDailyForFirstVisitToday = firstVisitClaimed && isFirstVisitRewardClaimedToday();

  if(firstVisitClaimed && !skipDailyForFirstVisitToday){
    await claimDailyFlowerItems();
  }else{
    flowerState.dailyTipMessage = "";
  }

  await loadFlowerPaperTips();

  await Promise.all([
    loadMemberGold(),
    loadFlowerMarket(),
    loadFlowerPot()
  ]);

  renderSiteNotifications();

  if(!firstVisitClaimed){
    await promptFirstVisitRewardIfNeeded();
  }
}


function formatMarketErrorMessage(message, displayName="花束"){
  const text = String(message || "").trim();
  const sellableMatch = text.match(/当前可卖\s*(\d+)\s*朵/);
  const sellable = sellableMatch ? sellableMatch[1] : "0";

  if(text.includes("刚买") || text.includes("价格刷新") || text.includes("刷新一次")){
    return `${displayName}刚买回来，要等花市刷新一次后才能卖出。当前可卖 ${sellable} 朵。`;
  }

  return text || `${displayName}操作失败`;
}

async function buyFlower(flowerKey, quantity=1){
  const auth = getFlowerAuth();
  if(!auth){
    openLogin();
    return;
  }

  if(getCurrentGoldBalance() < 100){
    showMarketOperationMessage("当前金币不足 100，暂时不能在花市买入。", true);
    return;
  }

  const rowInfo = getMarketRow(flowerKey);
  const displayName = getFlowerDisplayName(rowInfo || { flower_key:flowerKey });
  const remaining = rowInfo ? getRemainingBuyQuantity(rowInfo) : 5;
  const requestedQuantity = Math.max(1, Math.floor(Number(quantity) || 1));
  const buyQuantity = Math.max(0, Math.min(remaining, requestedQuantity));

  if(remaining <= 0){
    showMarketOperationMessage(`${displayName}这一轮已经买满啦，现在还能买 0 朵。`, true);
    return;
  }

  if(requestedQuantity > remaining){
    setMarketQuantityInput(flowerKey, remaining);
    showMarketOperationMessage(`${displayName}现在最多还能买 ${remaining} 朵，已按 ${remaining} 朵购买。`, true);
  }

  if(buyQuantity <= 0){
    showMarketOperationMessage(`请选择要买入的${displayName}数量。`, true);
    return;
  }

  setFlowerBusy(true);
  try{
    const { data, error } = await supabaseClient.rpc("buy_flower", {
      p_member_id:auth.memberId,
      p_member_code:auth.memberCode,
      p_flower_key:flowerKey,
      p_quantity:buyQuantity,
      p_timezone_offset_minutes:auth.timezoneOffset
    });

    if(error) throw error;

    const row = Array.isArray(data) ? data[0] : data;
    const actualQuantity = Number(row?.quantity) || buyQuantity;
    const oldOwned = Number(rowInfo?.owned_quantity) || 0;
    const newOwned = oldOwned + actualQuantity;
    const message = requestedQuantity > remaining
      ? `${displayName}现在最多还能买 ${remaining} 朵，已实际买入 ${actualQuantity} 朵；现在拥有 ${newOwned} 朵。`
      : `${displayName}购买成功：实际买入 ${actualQuantity} 朵；现在拥有 ${newOwned} 朵。`;

    await loadFlowerPage();
    showMarketOperationMessage(message, false);
  }catch(err){
    console.error("买花失败：", err);
    showMarketOperationMessage(err?.message || `${displayName}买花失败`, true);
    await loadFlowerMarket();
  }finally{
    setFlowerBusy(false);
  }
}

async function sellFlower(flowerKey, quantity=1){
  const auth = getFlowerAuth();
  if(!auth){
    openLogin();
    return;
  }

  const rowInfo = getMarketRow(flowerKey);
  const displayName = getFlowerDisplayName(rowInfo || { flower_key:flowerKey });
  const sellable = getSellableQuantity(rowInfo);
  const requestedQuantity = Math.max(1, Math.floor(Number(quantity) || 1));
  const sellQuantity = Math.max(0, Math.min(sellable, requestedQuantity));

  if(sellable <= 0){
    showMarketOperationMessage(`${displayName}当前没有可以卖出的花。`, true);
    return;
  }

  if(requestedQuantity > sellable){
    setMarketQuantityInput(flowerKey, sellable);
    showMarketOperationMessage(`${displayName}当前最多只能卖 ${sellable} 朵，已按 ${sellable} 朵卖出。`, true);
  }

  if(sellQuantity <= 0){
    showMarketOperationMessage(`请选择要卖出的${displayName}数量。`, true);
    return;
  }

  setFlowerBusy(true);
  try{
    const { data, error } = await supabaseClient.rpc("sell_flower", {
      p_member_id:auth.memberId,
      p_member_code:auth.memberCode,
      p_flower_key:flowerKey,
      p_quantity:sellQuantity,
      p_timezone_offset_minutes:auth.timezoneOffset
    });

    if(error) throw error;

    const row = Array.isArray(data) ? data[0] : data;
    const actualQuantity = Number(row?.quantity) || sellQuantity;
    await loadFlowerPage();
    showMarketOperationMessage(`${displayName}卖出成功：实际卖出 ${actualQuantity} 朵。`, false);
  }catch(err){
    console.error("卖花失败：", err);
    showMarketOperationMessage(formatMarketErrorMessage(err?.message, displayName), true);
  }finally{
    setFlowerBusy(false);
  }
}

  const auth = getFlowerAuth();
  if(!auth){
    openLogin();

  }

    showFlowerToast("现在还没有种子哦", "error");

}

function getFlowerLocalDateKey(){
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

function getDailyCareStorageKey(careType){
  const memberId = authState.memberId || localStorage.getItem(STORAGE_KEYS.memberId) || "guest";
  return `room10FlowerDailyCare:${memberId}:${getFlowerLocalDateKey()}:${careType}`;
}

function getDailyCareCount(careType){
  const count = Number(localStorage.getItem(getDailyCareStorageKey(careType)) || 0);
  return Number.isFinite(count) ? Math.max(0, Math.floor(count)) : 0;
}

function getDailyCareRemaining(careType){
  return Math.max(0, 3 - getDailyCareCount(careType));
}

function addDailyCareCount(careType){
  const key = getDailyCareStorageKey(careType);
  const next = Math.min(3, getDailyCareCount(careType) + 1);
  localStorage.setItem(key, String(next));
  return next;
}

async function careFlowerPot(careType){
  const auth = getFlowerAuth();
  if(!auth){
    openLogin();
    return;
  }

  const resources = getFlowerResources();
  if(careType === "water" && getDailyCareRemaining("water") <= 0){
    showFlowerToast("今天浇水次数已经用完啦", "error");
    return;
  }
  if(careType === "fertilizer" && getDailyCareRemaining("fertilizer") <= 0){
    showFlowerToast("今天施肥次数已经用完啦", "error");
    return;
  }
  if(careType === "water" && resources.water <= 0){
    showFlowerToast("今天的水不够啦", "error");
    return;
  }
  if(careType === "fertilizer" && resources.fertilizer <= 0){
    showFlowerToast("今天的肥料不够啦", "error");
    return;
  }

  setFlowerBusy(true);
  try{
    const { data, error } = await supabaseClient.rpc("care_flower_pot", {
      p_member_id:auth.memberId,
      p_member_code:auth.memberCode,
      p_care_type:careType
    });

    if(error) throw error;

    const row = Array.isArray(data) ? data[0] : data;
    updateFlowerResourcesFromRow(row);
    addDailyCareCount(careType);
    showFlowerToast(row?.message || "照顾成功");
    await loadFlowerPage();
  }catch(err){
    console.error("照顾失败：", err);
    showFlowerToast(err?.message || "照顾失败", "error");
  }finally{
    setFlowerBusy(false);
  }
}

/* =========================================================
   铃铛提醒
========================================================= */
function setNoticeCount(count){
  const n = Number(count) || 0;
  siteNoticeCount.textContent = n > 99 ? "99+" : String(n);
  siteNoticeBtn.classList.toggle("hasNotice", n > 0);
}

function renderNoticeList(items){
  const list = Array.isArray(items) ? items : [];

  if(!list.length){
    siteNoticeContent.innerHTML = '<div class="siteNoticeEmpty">暂无需要维护的花盆状态。</div>';
    setNoticeCount(0);
    return;
  }

  siteNoticeContent.innerHTML = `
    <div class="siteNoticeList">
      ${list.map(item => `
        <div class="siteNoticeItem">
          <div class="siteNoticeItemTitle">${escapeHtml(item.title || "提醒")}</div>
          <div class="siteNoticeItemDesc">${escapeHtml(item.desc || "")}</div>
        </div>
      `).join("")}
    </div>
  `;

  setNoticeCount(list.length);
}

function toggleNoticePanel(force){
  const shouldShow = typeof force === "boolean" ? force : !siteNoticePanel.classList.contains("show");
  siteNoticePanel.classList.toggle("show", shouldShow);
  siteNoticePanel.setAttribute("aria-hidden", shouldShow ? "false" : "true");
  siteNoticeBtn.setAttribute("aria-expanded", shouldShow ? "true" : "false");
}

function closeNoticePanel(){
  toggleNoticePanel(false);
}

function getSeedMaintenanceItems(pot = flowerState.pot){
  const auth = getFlowerAuth();
  if(!auth || !pot) return [];

  const items = [];
  const status = pot.display_status || pot.status;

  if(status === "ready"){
    items.push({
      title:"我的花盆可以收获了",
      desc:"种植周期已经完成，记得进入花房收获。"
    });
  }

  if(status === "withered"){
    items.push({
      title:"我的花盆需要清理",
      desc:"花盆已经枯萎，清理后可以重新种下一颗种子。"
    });
  }

  if(status === "growing" && Number(pot.interaction_count || 0) <= 0){
    items.push({
      title:"种子还没有被照顾",
      desc:"小种子还没有被照顾，进去看看它吧。"
    });
  }

  return items;
}

function renderSiteNotifications(){
  renderNoticeList(getSeedMaintenanceItems());
}

/* =========================================================
   初始化
========================================================= */
document.addEventListener("DOMContentLoaded", () => {
  readLocalAuth();
  setupRoomNav("flower");
  updateIdentity();
  loadFlowerPage();

  if(siteNoticeBtn){
    siteNoticeBtn.addEventListener("click", event => {
      event.stopPropagation();
      toggleNoticePanel();
    });
  }

  if(identityAuthBtn){
    identityAuthBtn.addEventListener("click", event => {
      event.stopPropagation();
      if(authState.loggedIn){
        handleLogout();
      }else{
        openLogin();
      }
    });
  }

  document.addEventListener("click", event => {
    if(siteNoticePanel && siteNoticeBtn){
      if(siteNoticePanel.contains(event.target) || siteNoticeBtn.contains(event.target)) return;
      closeNoticePanel();
    }
  });

  const rewardMask = document.getElementById("rewardMask");
  if(rewardMask){
    rewardMask.addEventListener("click", event => {
      if(event.target === rewardMask){
        closeRewardModal();
      }
    });
  }

  const rewardConfirm = document.querySelector(".reward-confirm");
  if(rewardConfirm){
    rewardConfirm.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      handleRewardConfirm();
    });
  }

  document.addEventListener("keydown", event => {
    if(event.key === "Escape"){
      closeFlowerRewardModal();
    }
  });

  document.getElementById("username")?.addEventListener("keydown", event => {
    if(event.key === "Enter") login();
  });

  document.getElementById("password")?.addEventListener("keydown", event => {
    if(event.key === "Enter") login();
  });

  syncOverlayToImage();
});

window.addEventListener("resize", syncOverlayToImage);
window.addEventListener("orientationchange", syncOverlayToImage);

window.addEventListener("storage", event => {
  if(
    event.key === STORAGE_KEYS.loggedIn ||
    event.key === STORAGE_KEYS.user ||
    event.key === STORAGE_KEYS.role ||
    event.key === STORAGE_KEYS.memberId ||
    event.key === STORAGE_KEYS.memberCode
  ){
    updateIdentity();
    loadFlowerPage();
  }
});

if(img && img.complete && img.naturalWidth){
  syncOverlayToImage();
}else if(img){
  img.addEventListener("load", syncOverlayToImage, { once:true });
}

setTimeout(syncOverlayToImage, 120);
